<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalentNext Design System — reference</title>

<!-- THE WHOLE DEPENDENCY. Two files, and the fonts are inside the first. -->
<link rel="stylesheet" href="talentnext-ds.css?b=306c79ac">

<style>
/* ==========================================================================
   THIS PAGE'S OWN CHROME — not part of the design system.
   Three things the DS deliberately does not carry: a host for the app frame,
   a code block, and a colour swatch. Everything else on this page is drawn
   with DS classes and nothing here overrides one.
   ========================================================================== */

/* 1. THE HOST.
   `.app` is `position:absolute; inset:0`, so it needs a positioned, sized
   parent — and that parent is also where `container-type` goes, because in
   this system NOTHING responds to the browser window. The breakpoints are
   `@container app (min-width:…)`, so they resolve against this box. Give the
   host the window's height and the app scrolls internally, which is the
   portal's own architecture. */
.ds-host{
  position:relative;width:100%;height:100vh;max-width:none;
  container-type:inline-size;container-name:app;
  overflow:hidden;background:var(--background);border:0}

/* 2. CODE. Scrolls inside its own box so a long line never widens the column. */
.doc-src{margin-top:var(--s04);border-top:1px solid var(--border-subtle-01)}
/* THE EYEBROW ROLE, TAKEN BY TOKEN. This page documents the system, so it has
   to obey it — "+ MARKUP" in capitals on the page that says nothing is set in
   capitals was the one thing here that could not be argued with. */
.doc-src summary{
  padding:var(--s03) 0;
  font-size:var(--t-eyebrow-size);line-height:var(--t-eyebrow-lh);
  font-weight:var(--t-w-strong);letter-spacing:var(--t-eyebrow-ls);
  color:var(--text-secondary);cursor:pointer;list-style:none}
.doc-src summary::-webkit-details-marker{display:none}
.doc-src summary::before{content:'+ ';font-weight:400}
.doc-src[open] summary::before{content:'– '}
.doc-src pre{
  margin:0 0 var(--s04);padding:var(--s04);overflow-x:auto;
  background:var(--layer-02);border-left:3px solid var(--border-strong-01);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;line-height:17px;color:var(--text-secondary);
  white-space:pre;tab-size:2}
.doc-ex{padding:var(--s05) 0;border-top:1px solid var(--border-subtle-01)}
.doc-ex:first-child{border-top:0;padding-top:0}
.doc-ex > .doc-t{
  display:block;margin-bottom:var(--s04);
  font-size:12.5px;font-weight:600;letter-spacing:.2px;color:var(--text-primary)}
.doc-ex > .doc-t small{
  display:block;margin-top:2px;font-weight:400;color:var(--text-helper);
  font-size:11.5px;letter-spacing:.2px}
.doc-live{display:block;--pad-x:0px}
/* WHY --pad-x:0 ABOVE. `.plate`, `.lvl-hero` and `.band` reach the column edge
   with a negative margin of `--pad-x`. Inside this page's own wrapper there is
   no column to reach, so they hung off both sides — the plate was rendering
   straight out of the content area, which is worse than not showing it at all.
   One declaration answers all of them; §35.1 does the same thing for a
   component borrowed into a Tal bubble. Do not chase the selectors. */

/* 3. SWATCHES. A token table, not a decoration: value and contrast in text,
   because the point is to be able to read the number. */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:1px;background:var(--border-subtle-01);border:1px solid var(--border-subtle-01)}
.sw-c{background:var(--layer-01);padding:0}
.sw-c i{display:block;height:52px}
.sw-c b,.sw-c span{display:block;padding:0 var(--s03)}
.sw-c b{margin-top:var(--s03);font-size:11.5px;font-weight:600;letter-spacing:.2px}
.sw-c span{padding-bottom:var(--s03);font-size:11px;color:var(--text-helper);
  font-family:ui-monospace,Menlo,monospace}

/* the icon sheet */
.ic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  gap:1px;background:var(--border-subtle-01);border:1px solid var(--border-subtle-01)}
.ic-c{background:var(--layer-01);padding:var(--s04) var(--s02);text-align:center}
.ic-c svg{width:22px;height:22px;fill:var(--icon-primary);margin:0 auto var(--s02)}
.ic-c span{font-size:10.5px;color:var(--text-helper);word-break:break-all;
  font-family:ui-monospace,Menlo,monospace}

/* THE MARK NEEDS A SIZE. `TN_MARK` carries a viewBox and no width/height —
   deliberately, so a call site can scale it — and §01's reset makes every svg
   `display:block; max-width:100%`. Given no size at all it collapses, so the
   host says how big it is. In the portal the logo is an <img>, which is why
   this does not come up there. */
.shell-logo{gap:var(--s03)}
.shell-logo svg{width:18px;height:18px;fill:var(--icon-primary);flex:none}
.shell-logo .wordmark{
  font-size:15px;font-weight:400;letter-spacing:-.2px;color:var(--text-primary);
  white-space:nowrap}

/* the spacing ruler */
.sp-row{display:flex;align-items:center;gap:var(--s04);padding:var(--s02) 0;
  font-size:12px;letter-spacing:.2px}
.sp-row i{display:block;height:12px;background:var(--brand-primary);flex:none}
.sp-row code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
  color:var(--text-helper);min-width:44px}

/* 4. THE LABEL COLUMN, OPTED OUT — and this is worth reading, because it is
   the one piece of the system a new page is most likely to fight.

   §10.15 gives any `.sec` that has a `.sec-h` a 184px label column at desktop,
   with the heading in it and a vertical rule down its right. That is the
   product's reading pattern and it is correct there, because a section on a
   real page is short. A reference section is not: it holds six examples and
   runs 900px, and the heading — which is `display:flex; align-items:center`
   with `min-height:100%`, so it centres itself in whatever height the section
   turns out to be — ends up floating halfway down a rule with nothing beside
   it. Verified against the portal, which centres it the same way.

   So these sections opt out, and the opt-out has to be RESTATED INSIDE THE
   SAME CONTAINER QUERY. A container query is its own cascade tier: a rule
   inside `@container app` beats an unconditional rule of equal weight no
   matter which stylesheet came later, so writing this outside the query would
   simply lose. §36.9 does exactly this twice for the same reason.

   The six containers that get the opt-out for free — `.tile-stack`, `.stats`,
   `.tbl-wrap`, `.facts`, `.cardrow`, `.gcard` — are the reason a page built
   out of the system's own components never has to write this block. Build from
   those and the spine is free. `.doc-body` is a wrapper this page invented,
   which is precisely the case §10.15's list does not cover. */
@container app (min-width:900px){
  .sec:has(> .doc-body){
    display:block;padding-left:var(--pad-x);padding-right:var(--pad-x)}
  .sec:has(> .doc-body) > .sec-h{
    border-right:0;min-height:0;margin-bottom:var(--s05);padding:0}
  .sec:has(> .doc-body) > .doc-body{padding-left:0}
}

/* THE CALL DEMO'S FRAME. `.call` is `flex:1` inside `.app`, which is the whole
   window in a real portal and cannot be that here — the reference is a page of
   examples. A fixed-height flex column is the smallest thing that gives it
   somewhere to grow into, and the hairline says where the surface stops.
   Nothing in this rule is part of the component. */
.doc-live .call-demo{
  display:flex;flex-direction:column;height:440px;overflow:hidden;
  border:1px solid var(--border-subtle-01)}
</style>
</head>
<body>

<!-- The frame. `data-vp="fluid"` is the portal's own desktop frame marker. -->
<div class="device ds-host" id="host" data-vp="fluid">
  <div class="app" id="app">

    <!-- THE MARK IS THE MENU (§34). The toggle comes FIRST in the DOM,
         because that is the order a phone wants and the order a screen reader
         should hear — the control, then the link home. Open at desktop, §34
         gives `.shell-logo` `order:-1` so the wordmark holds the left end
         without the source order changing. Both glyphs are printed at every
         width; the container query decides which one shows. -->
    <header class="shell">
      <button class="shell-act nav-t" id="navBtn" data-toggle="nav" aria-label="Sections">
        <span class="nav-t-mark"></span>
        <span class="nav-t-menu"></span>
      </button>
      <a class="shell-logo" href="#top" id="logo" aria-label="TalentNext"></a>
      <div class="shell-right">
        <span class="shell-name">Design system</span>
      </div>
    </header>

    <div class="shell-body">
      <!-- no `.sn-cap` here on purpose: at desktop this is a 72px icon rail,
           and a caption has nowhere to go in 72px. The labels live in the
           `.sn-item`s and §14 reveals them when the rail expands. -->
      <nav class="sidenav" id="rail">
        <div class="sn-main" id="railItems"></div>
      </nav>
      <div class="scrim" id="scrim"></div>
      <main class="main" id="main">
        <div class="page" id="page"></div>
      </main>
    </div>

    <!-- the one overlay, so the sheet can be demonstrated for real -->
    <div class="modal" id="sheetModal">
      <div class="sheet">
        <div class="sheet-h">
          <h2>A bottom sheet</h2>
          <button class="x" id="sheetX" aria-label="Close"></button>
        </div>
        <div class="sheet-b">
          <label class="f">
            <span class="lbl">Full name</span>
            <input class="inp" value="Maryam Naz">
          </label>
          <p class="help">On a phone this rises from the bottom edge. At 600px
            and up it centres — one component, two anchors, stated once in §14.</p>
        </div>
        <div class="sheet-f">
          <button class="btn btn-s noic" data-close>Cancel</button>
          <button class="btn btn-p noic" data-close>Save</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="talentnext-ds.js?b=306c79ac"></script>
<script>
/* ==========================================================================
   THE PAGE IS BUILT FROM A SPEC, so every example is written once and shows
   up twice: rendered, and as the markup that rendered it. A gallery whose
   snippets are re-typed beside the demo goes stale the first time one of
   them is corrected.
   ========================================================================== */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* trim the shared indent so the snippet reads as it would in a file */
function dedent(s){
  const lines = s.replace(/^\n/,'').replace(/\s+$/,'').split('\n');
  const pad = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  return lines.map(l => l.slice(pad)).join('\n');
}

/* ICONS ARE WRITTEN AS PLACEHOLDERS, and that is the whole reason this
   indirection exists. `${I.info}` inside the template would be expanded
   before `ex()` ever saw it, so the "markup" panel would show a 300-character
   SVG path where the reader needs to see the call they would type. So the
   examples say `{{info}}`, the live copy gets the real mark, and the snippet
   gets the call back. `{{name|class}}` is the path-only form, which is what
   the portal uses wherever the svg needs a class of its own. */
/* `{{av:priya}}` IS THE SAME TRICK FOR A FACE. The embedded portraits are
   base64 JPEGs a few hundred characters long, and a component that takes one
   as an inline `background-image` — the call's feed does — would otherwise
   print a wall of base64 where the reader needs to see `${AV.priya}`. Same
   split as the icons: the live copy gets the data URI, the snippet gets the
   call. It goes FIRST because its body contains a colon, which the bare
   `\w+` form below would not match anyway, but the order is what makes that
   independent of the next placeholder somebody adds. */
/* `{{aw:rank1}}` IS THE THIRD OF THE SAME TRICK, for the award artwork — the
   rank medals, the three badges and the points mark are embedded WebPs and a
   rank in a page header carries one twice (on the face and beside the
   sentence). Same split, same reason, and it sits beside the faces because the
   two behave identically. */
const fillLive = s => s
  .replace(/\{\{av:(\w+)\}\}/g, (_, n) => (typeof AV === 'object' && AV[n]) || '')
  .replace(/\{\{aw:(\w+)\}\}/g, (_, n) => (typeof AWARD === 'object' && AWARD[n]) || '')
/* AND `{{art:feed}}` FOR THE CALL'S OWN THREE PICTURES — the landscape
   still the feed is drawn on and the two faces beside it. Same split, same
   reason as the two above; `CALL_ART` is the table build-ds.py embeds. */
  .replace(/\{\{art:(\w+)\}\}/g, (_, n) => (typeof CALL_ART === 'object' && CALL_ART[n]) || '')
  .replace(/\{\{(\w+)\|([\w-]+)\}\}/g,
    (_, n, c) => `<svg class="${c}" viewBox="0 0 24 24">${inner(n)}</svg>`)
  .replace(/\{\{(\w+)\}\}/g, (_, n) => I[n] || '');
const fillSrc = s => s
  .replace(/\{\{av:(\w+)\}\}/g, (_, n) => '${AV.' + n + '}')
  .replace(/\{\{aw:(\w+)\}\}/g, (_, n) => '${AWARD.' + n + '}')
  .replace(/\{\{art:(\w+)\}\}/g, (_, n) => '${CALL_ART.' + n + '}')
  .replace(/\{\{(\w+)\|([\w-]+)\}\}/g,
    (_, n, c) => `<svg class="${c}" viewBox="0 0 24 24">\${inner('${n}')}</svg>`)
  .replace(/\{\{(\w+)\}\}/g, (_, n) => '${I.' + n + '}');

/* one example: a title, the live thing, and its source. `noSrc` is for the
   generated sheets — a swatch grid's markup is a for-loop, not a component,
   and printing it would only bury the ones worth copying. */
function ex(title, note, html, noSrc){
  const src = dedent(html);
  return `<div class="doc-ex">
    <span class="doc-t">${title}${note ? `<small>${note}</small>` : ''}</span>
    <span class="doc-live">${fillLive(src)}</span>
    ${noSrc ? '' : `<details class="doc-src"><summary>markup</summary>
      <pre>${esc(fillSrc(src))}</pre></details>`}
  </div>`;
}

/* a section of the reference. Headings stay SHORT: at desktop a `.sec` with a
   `.sec-h` puts it in a 184px label column, and three words is two lines. */
function sec(id, heading, body, cls){
  return `<section class="sec${cls ? ' ' + cls : ''}" id="${id}">
    <div class="sec-h"><h2>${heading}</h2></div>
    <div class="doc-body">${body}</div></section>`;
}

const swatch = (name, val, note) => `<div class="sw-c">
  <i style="background:${val}"></i><b>${name}</b><span>${note || val}</span></div>`;

/* A FIGURE CELL, and all three parts are required. `.stat` is a named grid —
   `.stat-ic` sits in `grid-area:ic` — so a cell written without the icon does
   not merely lack a mark, it loses the area and the figures stop lining up.
   The mark colour is NOT chosen here: §29 cycles `--mk` over
   `nth-child(4n+1…4)`, the svg takes `fill:var(--mk)` and the box a
   `color-mix` of it, so the fourth cell is magenta because it is fourth.
   Markup read off the running portal, not written from the CSS. */
const statCell = (icon, label, fig, note) => `<div class="stat">
      <span class="stat-ic">${I[icon] || ''}</span>
      <div class="stat-top"><div class="l">${label}</div><div class="n">${fig}</div></div>
      ${note ? `<div class="d">${note}</div>` : ''}
    </div>`;

const SECTIONS = [];

/* ---------------------------------------------------------------- how to use */
SECTIONS.push({id:'use', nav:'Using it', icon:'document', build: () => `
  ${ex('Two files', 'Fonts are embedded in the stylesheet, so there is nothing else to copy.', `
    <div class="note"><span>{{info}}</span><div class="nb"><b>In your &lt;head&gt;</b>
      &lt;link rel="stylesheet" href="design-system/talentnext-ds.css"&gt;<br>
      &lt;script src="design-system/talentnext-ds.js"&gt;&lt;/script&gt;</div></div>
  `)}
  ${ex('The host is required', 'Nothing in this system responds to the browser window — every breakpoint is a container query named <code>app</code>. Give the frame <code>container-type:inline-size</code> and <code>container-name:app</code> or the desktop layout never arrives.', `
    <div class="note warn"><span>{{warning}}</span><div class="nb"><b>The frame</b>
      &lt;div class="device" style="container-type:inline-size;container-name:app"&gt;<br>
      &nbsp;&nbsp;&lt;div class="app"&gt; … &lt;/div&gt;<br>
      &lt;/div&gt;<br>
      Or call <code>dsFrame(el)</code>. See starter.html for the whole skeleton.</div></div>
  `)}
  ${ex('Breakpoints', 'The three tiers the layers actually use.', `
    <div>
      <div class="kv"><span class="k">600px</span><span class="v">Gutter 24, sheets centre</span></div>
      <div class="kv"><span class="k">900px</span><span class="v">Permanent rail, label column</span></div>
      <div class="kv"><span class="k">1200px</span><span class="v">Rail 280, gutter 32</span></div>
    </div>
  `)}
`});

/* ---------------------------------------------------------------- signature */
/* THE COMPONENTS THAT CARRY THE LOOK, and the section that should have been
   here from the start. The first extraction dropped every one of these as
   "one product surface's own", which left a page that was correct and did not
   look like TalentNext. Their markup is FIXED — taken from views.js, not
   invented — because each has internal structure the CSS keys on, and getting
   it slightly wrong is what makes a component look broken rather than absent. */
SECTIONS.push({id:'signature', nav:'Signature', icon:'star', build: () => `
  ${ex('The dashboard head, whole', 'This is the opening move of the candidate portal and the thing a new portal most needs to match. The markup below is the <b>real DOM</b>, read off the running portal — not written from the CSS. Three parts inside one <code>.modhead</code>: the page header, one section holding Tal, and a <code>.sec.sec-dark</code> holding the plate. <b>The header carries the reader</b> — <code>.ph-you</code> puts a 75px face left of the <code>&lt;h1&gt;</code>, spanning the title and the fact row, with the rank medal on its corner; <code>.ph-rank</code> is a <b>sibling</b> of <code>.av-ph</code> and not a child, because §09 gives the avatar <code>overflow:hidden</code> and would clip anything hanging past the edge. The award line rides <code>.ph-act</code>, the slot §15 already keeps at the right-hand end of that row, and §62 lets the row <b>wrap</b> — under 360px of title block the sentence drops to its own line instead of breaking &ldquo;Welcome back, Maryam!&rdquo; over three. A rank does not go in the green <code>.ach</code> band: a badge is news you dismiss, a rank is what you now are. The wash (<code>.app .modhead::before</code>) covers all three, which is what makes it read as one band instead of three stacked blocks. <b>§56 arranges it as two columns</b> — the title, the <code>&middot;</code> fact row, a hairline, the steps, a second hairline and then what Tal says on the left; the plate beside all of it, content packed to the top and its actions on the foot, as tall as the column. The second column appears on its own: the gate is <code>.modhead:has(&gt; .sec-dark .plate)</code> at 900 and up, so a band whose dark card is a <code>.lvl-hero</code> or a <code>.cert</code> keeps the full-width place under the head. <b>The title is the <code>.ph</code>, not a greeting.</b> <code>.tal-greet</code> still works and still hides the <code>.ph</code> when you use it (§33.9) — the candidate portal chose the other shape, because with the fact row and the steps above Tal a greeting would be the fourth thing in the column. <b>Four things in the steps are easy to get wrong.</b> <code>.stps</code> is a column-flow grid and <b>each <code>.stps-i</code> paints the rail segment to its own right</b>, from its mark to the next one — there is no rail element to add, and adding a wrapper for one puts a line through the marks. The item is a <b>three-row grid</b> and <code>.stps-b</code> is <code>display:contents</code>, which is what keeps the state words on one line when a label wraps and another does not. A step is <code>.stps-m</code> + <code>.stps-b</code>: the step&rsquo;s own subject icon at every state, with the state on the <code>.stps-i</code> (<code>done</code> / <code>on</code> / neither) and the mark&rsquo;s <b>ground</b> carrying it — flat accent for done, the accent tint for the one you are on, the panel tone for what is ahead. That is the opposite of §33.7&rsquo;s dropdown, where the mark is a bare glyph because five filled tiles in a 340px panel read as buttons. And the <b>second divider is the wing&rsquo;s <code>border-bottom</code></b>, so it exists only where there are steps; below 900 the same markup turns 90 degrees into a column, the state word gives its line back to the step&rsquo;s own detail, and <code>.plate-b</code>&rsquo;s icon rows stay as they are.', `
    <div class="modhead">
      <div class="ph ph-has-act ph-you">
        <div class="ph-main">
          <span class="ph-you-av">
            <span class="av-ph"><i>MN</i><img src="{{av:hana}}" alt=""></span>
            <span class="ph-rank"><img src="{{aw:rank1}}" alt="1-Star rank"></span>
          </span>
          <div class="ph-top"><h1>Welcome back, Maryam!</h1></div>
          <p class="ph-facts">
            <span class="ph-f">{{growth}}<span>Explorer Track – E3</span></span>
            <span class="ph-f">{{group}}<span>Cohort 41</span></span>
            <span class="ph-f">{{calendar}}<span>Week 5 of 13</span></span>
          </p>
        </div>
        <div class="ph-act">
          <a class="ph-earned">
            <span class="ph-earned-mk"><img src="{{aw:rank1}}" alt=""></span>
            <span>You have earned 1-star <span class="ph-earned-u">rank!</span></span></a>
        </div>
      </div>
      <div class="sec">
        <div class="ai-aura tile tight talsum">
          <div class="ai-head"><span class="ai-label">Tal</span></div>
          <div class="ai-body"><p>Day 34 of 90, week 5. 5 of 13 chapters at 88%,
            260 minutes so far.</p></div>
          <div class="stp-wing">
            <div class="stp stp-open stp-titled">
              <div class="stp-top"><h2 class="u-h3">Your journey so far</h2></div>
              <ol class="stps">
                <li class="stps-i done"><span class="stps-m">{{chart}}</span>
                  <span class="stps-b"><span class="pi-lab">Leadership quiz</span>
                    <span class="stps-st">Completed</span>
                    <span class="pi-sec">Explorer track</span></span></li>
                <li class="stps-i done"><span class="stps-m">{{video}}</span>
                  <span class="stps-b"><span class="pi-lab">Interview and level</span>
                    <span class="stps-st">Completed</span>
                    <span class="pi-sec">E3 &middot; confirmed Aug 21</span></span></li>
                <li class="stps-i done"><span class="stps-m">{{group}}</span>
                  <span class="stps-b"><span class="pi-lab">Enrolled</span>
                    <span class="stps-st">Completed</span>
                    <span class="pi-sec">Cohort 41 &middot; started Aug 25</span></span></li>
                <li class="stps-i on" aria-current="step"><span class="stps-m">{{book}}</span>
                  <span class="stps-b"><span class="pi-lab">90-day course</span>
                    <span class="stps-st">In progress</span>
                    <span class="pi-sec">Week 5 of 13 &middot; 5 of 13 chapters done</span></span></li>
              </ol>
            </div>
          </div>
        </div>
      </div>
      <div class="sec sec-dark">
        <div class="plate" data-when="today 6:00 PM">
          <i class="dark-glow" aria-hidden="true"></i>
          <div class="plate-h plate-h-bare">
            <div class="plate-t">Cohort Week 36 Session</div>
            <span class="plate-when">{{time}}<b>today 6:00 PM</b></span>
          </div>
          <div class="plate-b plate-lines">
            <span class="plate-bi">{{time}}<span>Thursday at 6:00 PM ET</span></span>
            <span class="plate-bi">{{group}}<span>9 others</span></span>
            <span class="plate-bi">{{hourglass}}<span>60 minutes</span></span>
          </div>
          <div class="plate-who">
            <span class="av-ph" style="width:56px;height:56px"><i>PN</i></span>
            <span class="plate-wb"><b>Priya Nair</b>
              <span>Cohort leader &middot; leads Cohort 41</span></span>
          </div>
          <div class="plate-a">
            <button class="btn btn-p btn-sm noic">Join Call {{video}}</button>
          </div>
        </div>
      </div>
    </div>

  ${ex('The summary types itself', 'The summary is the one line on a page that is <b>written rather than stored</b> — assembled from state at the moment you arrive — so it is said rather than already there. Nothing else at the head of a page does this: the <code>&lt;h1&gt;</code> is a label and was true before you got here. <b>You write the paragraph and hand it to <code>dsTypeSummary(p, key)</code> at the end of your render</b>; the helper does the rest. Two things it does that are worth knowing about. The paragraph is drawn <b>twice</b> — <code>.tsum-g</code> is the finished line at <code>visibility:hidden</code>, holding the final box open, and <code>.tsum-t</code> is the visible copy laid over it — because a typewriter that grows its own box shoves the whole page down mid-read. And <code>&lt;span class="tal-greet"&gt;</code> <b>does not type</b>: §33.9 hides the page&rsquo;s <code>.ph</code> when a greeting is present, so the greeting <i>is</i> that page&rsquo;s title, and a title that types itself in is a louder effect than a sentence that does. The <code>key</code> is &ldquo;which page am I on&rdquo; — the helper appends the words to it, so the line re-types when the page changes <i>or</i> when the reading does, and prints instantly on every other re-render. Pass <code>null</code> for the paragraph on a page that has no summary; that is how the next arrival is recognised as one.', `

  ${ex('The live call', 'The one surface here that is <b>not a page</b>: it replaces the shell and the view rather than sitting inside them, so draw it in place of your app’s body, not on top of it. <b>The photograph is the screen</b> — a full-bleed <code>.call-main</code> with the far side’s picture on it, their name in white over the bottom-left corner, and nothing else. Facts about the session are one press away, not permanently beside it. The picture is an inline <code>background-image</code>, so every scrim over it is a pseudo-element: an inline background beats any stylesheet rule on the same property. <b>Two arrangements from one markup shape.</b> Two people: a <code>.call-self</code> picture-in-picture inside the feed and no column. A group: a <code>.call-col</code> of participants beside the feed — <b>discs on a light ground, not little videos</b>, because nine 16:9 thumbnails in a 300px column are nine letterbox slits — and you are one of the tiles rather than a picture-in-picture. <code>.call-p.on</code> is whoever is speaking: the accent tint on the tile and a ring on the disc, drawn as two shadows so nothing moves by a pixel. <b>The bar is light and square</b>: <code>--layer-02</code> for a control that is available, <code>.off</code> (black) for one you switched off, <code>.on</code> (the accent tint) for one you switched on, and the error tint on the way out. <b>There is no JS in this box for it</b> — the portal fast-forwards a 45-minute session into 42 seconds so a prototype can be watched, which is scaffolding rather than a component; a real product takes its clock and its participants from a video SDK. Keep every state in your own model: a class a click handler adds does not survive the next render.', `

  ${ex('Figure cells', 'Where several figures belong together they become cells of one grid sharing single hairlines — the opposite of a row of cards. <b>Each cell is a named grid and needs all three parts:</b> <code>.stat-ic</code> (<code>grid-area:ic</code>), <code>.stat-top</code> holding <code>.l</code> + <code>.n</code>, and <code>.d</code> underneath. Leave the icon out and the cell loses its grid area — the figures stop lining up, which is the misalignment you get from the older <code>.k</code>/<code>.v</code> spelling. <b>The mark is coloured and it cycles:</b> §29 sets <code>--mk</code> per <code>nth-child(4n+1…4)</code> to <code>--mk-1</code>…<code>--mk-4</code> (blue, green, purple, magenta), the icon takes <code>fill:var(--mk)</code> and its box a <code>color-mix</code> of it. You do not pick the colour — position does. <b>Keep <code>.l</code> short.</b> §37.11 puts the label and the figure on one line and drops the figure underneath when the pair will not fit — so one long label staggers its own cell 15px below its neighbours. The portal shows both: its four-short-label row lines up exactly, and its <i>Assessment average</i> cell sits low for this reason. One or two words per label. Put <code>.stats</code> straight in the section: it is one of the six containers that opt a heading out of the label column. <b>Give it exactly four.</b> The hairlines <i>are</i> the 1px grid gap, with the rule colour showing through from the container’s own background, and the grid is <i>fixed</i> — 2 columns on a phone, 4 from 700px. An incomplete row therefore paints grey rather than collapsing. An odd count is handled: <code>:last-child:nth-child(odd)</code> spans the last cell across the row — but the row above it still has to be full.', `
    <div class="stats">
      ${statCell('book',   'Chapters',  '5 <small>of 13</small>', '38% done')}
      ${statCell('chart',  'Average',   '88<small>%</small>',     'cohort 79%')}
      ${statCell('time',   'Invested',  '4h<small> 20m</small>',  '52 min a chapter')}
      ${statCell('check',  'On time',   '4 <small>of 5</small>',  'one overdue')}

  `)}
  ${ex('Facts', 'A label above its value, in a bordered band — for reference material rather than achievement. Same hairline-as-gap construction as <code>.stats</code>, but the columns are <code>auto-fit</code> at <code>minmax(140px,1fr)</code>, so the count that fits is <code>floor(width / 140)</code>. Spare tracks collapse, so a band whose cells all fit on one row always fills. Cells that <i>wrap</i> do not: the second row keeps the full column count and its empty slots paint the rule colour. Four cells are right for a full-width band and wrap to 3 + 1 in a band of roughly 420–560px — which is what you are looking at here at 900px, and what the portal does on its own interview page at that width. <b>For three items, or for a band that must hold at every width, use <code>.kv</code> instead.</b>', `

  ${ex('Key and value', 'A hairline list. The value is tabular and right-aligned, so a column of them reads down.', `
    <div>
      <div class="kv"><span class="k">Chapters finished</span><span class="v n">13 of 13</span></div>
      <div class="kv"><span class="k">Live calls attended</span><span class="v n">12 of 13</span></div>
      <div class="kv"><span class="k">Assessment average</span><span class="v n">92%</span></div>
    </div>
  `)}
  ${ex('Progress', 'The accent marks progress, because progress is a thing the candidate owns. A segmented bar is one segment per chapter.', `
    <div>
      <div class="prog">
        <div class="prog-top">
          <div><div class="prog-pct">72<small>%</small></div>
            <div class="prog-l">of the course done</div></div>
          <div class="prog-day"><div class="prog-dn">Day 47</div>
            <div class="prog-l">of 90</div></div>
        </div>
        <div class="prog-seg">${Array.from({length:13},(_,i)=>
          `<i class="${i<9?'done':i===9?'now':''}"></i>`).join('')}</div>
      </div>
      <div class="pb mt5"><i style="width:72%"></i></div>
    </div>
  `)}
  ${ex('Steps', 'A numbered list for a process, not a stepper widget.', `
    <ol class="steps">
      <li><span class="s-n">1</span><span class="s-b"><b>You choose the agent</b>
        Everyone who assesses your track is listed with their next free slot.</span></li>
      <li><span class="s-n">2</span><span class="s-b"><b>You have the conversation</b>
        Forty-five minutes, recorded, so your report can be written from it.</span></li>
      <li><span class="s-n">3</span><span class="s-b"><b>Your report arrives</b>

`});

/* ==========================================================================
   RENDER
   ========================================================================== */
const page = document.getElementById('page');
const rail = document.getElementById('railItems');
const app  = document.getElementById('app');

/* The portal's wordmark is an image asset that is not part of the design
   system, so this sets the mark plus the name as text. §34 sizes the mark
   inside `.nav-t-mark` to 21px — deliberately smaller than the 24px
   hamburger it swaps with, because three thin chevrons read heavier than a
   Material glyph at the same size. */
document.getElementById('logo').innerHTML =
  `${TN_MARK}<b class="wordmark">TalentNext</b>`;
document.querySelector('#navBtn .nav-t-mark').innerHTML = TN_MARK;
document.querySelector('#navBtn .nav-t-menu').innerHTML = I.menu;
document.getElementById('sheetX').innerHTML = I.close;

page.innerHTML = `
  <div class="ph" id="top">
    <span class="eyebrow">TalentNext</span>
    <h1>The design system</h1>
    <p class="lead">Every class below is a real rule from the hi-fi candidate
      portal, extracted in its own cascade position — so a page built on these
      names comes out looking like that portal rather than like an
      approximation of it. Two files, no build step, nothing to re-draw.</p>
  </div>
  ${SECTIONS.map(s => sec(s.id, s.nav, s.build())).join('')}
  <div class="sec">
    <p class="help">Generated from <code>hifi/build/*.css</code> by
      <code>design-system/build-ds.py</code>. To change the system, change the
      layer that states the rule — the reasoning for it is the comment above
      it — then re-run the build.</p>
  </div>`;

rail.innerHTML = SECTIONS.map((s,i) =>
  `<a class="sn-item${i === 0 ? ' on' : ''}" href="#${s.id}" data-sec="${s.id}">
     ${I[s.icon]}<span>${s.nav}</span></a>`).join('');

dsStagger(page);
dsEnter(app);

/* --- the rail, and the phone drawer ------------------------------------- */
const railEl = document.getElementById('rail');
const scrim  = document.getElementById('scrim');

/* ONE FLAG, TWO BEHAVIOURS, and both have to be set — which is what the
   portal's own render does (`views.js` stamps `data-rail` and `.on` from the
   same `S.nav`). Below 900 the rail is a temporary drawer over a scrim, so it
   needs `.on`; at 900 and up it is a permanent 72px icon rail that widens to
   `--drawer-w` on `data-rail="open"`, revealing the `.sn-item` labels §14
   otherwise clips to 1px. The stylesheet decides which one applies at this
   width; the page just tells it the state. */
function setNav(open){
  railEl.classList.toggle('on', open);
  scrim.classList.toggle('on', open);
  app.setAttribute('data-rail', open ? 'open' : 'shut');
  /* `data-open` is a ONE-RENDER marker and only motion may read it (trap 5).
     Left set, `mo-drawer` runs with `fill-mode:both` and its final keyframe
     keeps applying to the rail's transform for as long as the flag is there —
     which is the same class of bug as styling a resting state with opacity.
     The persistent state is `data-rail` and `.on`; this is just the cue.

     It is cleared when the entrance has finished rather than on the next
     frame — `mo-drawer` is 320ms (--mo-slow) and pulling the flag two frames
     in would cancel the slide it exists to start. */
  clearTimeout(setNav.t);
  if(open){
    app.setAttribute('data-open', 'nav');
    setNav.t = setTimeout(() => app.removeAttribute('data-open'), 380);
  } else {
    app.removeAttribute('data-open');
  }
}
setNav(false);
document.getElementById('navBtn').onclick = () => setNav(!railEl.classList.contains('on'));
scrim.onclick = () => setNav(false);
rail.onclick = e => {
  const a = e.target.closest('.sn-item');
  if(!a) return;
  rail.querySelectorAll('.sn-item').forEach(x => x.classList.toggle('on', x === a));
  setNav(false);
};

/* mark the section you are in — the rail is the one place that says where you
   are, so it has to keep up with the scroller rather than only with clicks */
const main = document.getElementById('main');
const io = new IntersectionObserver(entries => {
  entries.filter(e => e.isIntersecting).slice(0,1).forEach(e => {
    rail.querySelectorAll('.sn-item').forEach(x =>
      x.classList.toggle('on', x.dataset.sec === e.target.id));
  });
}, {root: main, rootMargin: '-20% 0px -70% 0px'});
SECTIONS.forEach(s => { const el = document.getElementById(s.id); if(el) io.observe(el); });

/* --- the demos ---------------------------------------------------------- */
document.querySelectorAll('#demoTabs, #demoSeg').forEach(g => g.onclick = e => {
  const b = e.target.closest('button');
  if(b) g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
});
document.getElementById('demoAcc').onclick = e => {
  const h = e.target.closest('.acc-h');
  if(h) h.parentElement.classList.toggle('on');
};
const modal = document.getElementById('sheetModal');
function sheet(open){
  modal.classList.toggle('on', open);
  app.setAttribute('data-open', open ? 'editProfile' : '');
}
document.getElementById('openSheet').onclick = () => sheet(true);
modal.onclick = e => { if(e.target === modal || e.target.closest('[data-close],.x')) sheet(false); };
document.getElementById('replay').onclick = () => { dsStagger(page); dsEnter(app); };

/* THE SUMMARY, TYPED — the one demo on this page that has to be RE-armed to be
   seen twice. `dsTypeSummary` runs once per arrival by design, and its key is
   "which page am I on" plus the words; on a single-page reference neither ever
   changes, so a second call is correctly a no-op. Clearing `DS_SUM.key` is
   what tells it this is a new arrival — the same thing a real portal gets for
   free by navigating.

   It is deliberately NOT wired to the section scroll: a line that re-types
   every time it comes back into view is a page that will not sit still. */
/* THE ROSE, DRAWN. `dsQuizRose` returns the whole component out of an array
   and a number, so the example's markup is a host and one line — there is no
   hand-written version of this to show. */
const roseDemo = document.getElementById('roseDemo');
if(roseDemo) roseDemo.innerHTML = dsQuizRose(
  [['Decisiveness',78],['Delegation',41],['Directness',66],['Coaching',38],['Composure',84]], 64);

const tsumDemo = document.getElementById('tsumDemo');
if(tsumDemo){
  const typeDemo = () => { DS_SUM.key = null; dsTypeSummary(tsumDemo, 'gallery'); };
  typeDemo();
  document.getElementById('tsumReplay').onclick = typeDemo;
}
</script>
