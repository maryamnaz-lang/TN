function delTplConfirmed(id){ var t=DB.TPL_BY_ID[id]; if(!t){ U.closeModal(); return; }
  for(var i=DB.CO_TEMPLATES.length-1;i>=0;i--){ if(DB.CO_TEMPLATES[i].id===id) DB.CO_TEMPLATES.splice(i,1); } delete DB.TPL_BY_ID[id]; U.closeModal(); toast('Template deleted'); reView(); }

/* --- new-cohort flow (multi-step drawer) --- */
function leaderPool(track){
  if(track==='Explorer') return ['Maryam Naz (Builder)','Bruno Sella (Builder)'];
  if(track==='Builder') return ['Dana Whitfield (Trailblazer)'];
  return ['Platform staff'];
}
function suggestCohortName(track){ var max=0; DB.COHORTS.forEach(function(c){ if(c.track===track){ var m=/(\d+)\s*$/.exec(c.name); if(m) max=Math.max(max,+m[1]); } }); return track+' '+(max+1); }
function openNcoh(){
  if(!ncoh) ncoh=freshNcoh();
  var body = ncoh.step===0?ncohTemplate():ncoh.step===1?ncohDetails():ncoh.step===2?ncohSchedule():ncohReview();
  var content='<p class="sub" style="margin:-4px 0 2px">Start a new 90-day cohort. Pick a template or build a new one, then set the dates.</p>'
    +bkSteps(NCOH_STEPS, ncoh.step)+'<div>'+body+'</div>';
  var back = ncoh.step>0?'<button class="btn" data-act="ncoh:back">Back</button>':'';
  var primary = ncoh.step<3?'<button class="btn p" data-act="ncoh:next">Continue</button>':'<button class="btn p" data-act="ncoh:finish">'+I('check')+' Create cohort</button>';
  U.openDrawer('New cohort', content, back+'<div class="f1"></div><button class="btn" data-act="ncoh:close">Cancel</button>'+primary, 'md');
}
function ncohTemplate(){
  var pick='';
  ['Explorer','Builder','Trailblazer'].forEach(function(g){ var list=DB.CO_TEMPLATES.filter(function(t){return t.track===g&&t.status==='published';}); if(!list.length) return;
    pick+='<div class="ad-sub-lab">'+esc(g)+'</div><div class="ad-rolepick">'+list.map(function(t){var on=ncoh.templateId===t.id; var co=DB.COURSE_BY_ID[t.courseId];
      return '<button class="ad-ropt radio '+(on?'on':'')+'" data-act="ncoh:pick:'+t.id+'"><span class="rio"></span><span class="f1"><span class="rt">'+esc(t.name)+' '+lvlTag(t.level)+'</span><span class="rd">'+esc(co?co.name:'')+' · '+t.sessions.length+' sessions</span></span></button>';}).join('')+'</div>';
  });
  return '<h3>Choose a template</h3><p class="sub" style="margin-bottom:10px">Every cohort runs from a template. Pick one, or build a new blueprint first.</p>'
   +(pick||'<div class="note w">No published templates yet — create one to continue.</div>')
   +'<button class="btn mt" data-act="ncoh:newtpl">'+I('plus')+' Create a new template</button>';
}
function ncohDetails(){
  var t=DB.TPL_BY_ID[ncoh.templateId];
  if(!t) return '<div class="note w">Go back and choose a template first.</div>';
  if(!ncoh.name) ncoh.name=suggestCohortName(t.track);
  var leaders=[{v:'Unassigned',l:'Unassigned (assign later)'}].concat(leaderPool(t.track).map(function(n){return {v:n,l:n};}));
  var co=DB.COURSE_BY_ID[t.courseId];
  return '<h3>Cohort details</h3>'
   +'<div class="tpl-picked mt">'+I('doc')+'<div class="f1"><div class="tp-nm">'+esc(t.name)+' '+lvlTag(t.level)+'</div><div class="tp-sub">'+esc(co?co.name:'')+' · '+t.sessions.length+' sessions</div></div><button class="btn sm" data-act="ncoh:back">Change</button></div>'
   +'<div class="mt"><label class="fl">Cohort name</label><input class="inp" id="ncoh_name" value="'+esc(ncoh.name)+'" placeholder="e.g. Explorer 16"></div>'
   +'<div class="mt"><label class="fl">Start date (day 1 of the 90-day cycle)</label><input class="inp" type="date" id="ncoh_start" value="'+esc(ncoh.start)+'"></div>'
   +'<div class="mt"><label class="fl">Cohort leader</label>'+cSelect('ncoh_leader', leaders, ncoh.leader)+'</div>'
   +'<div class="note i mt">The platform assigns leaders — it is not the candidate’s choice. You can leave it unassigned and assign one later from the cohort’s detail page.</div>';
}
function ncohSchedule(){
  var t=DB.TPL_BY_ID[ncoh.templateId]; if(!t) return '<div class="note w">Go back and choose a template.</div>';
  var sess=t.sessions.slice().sort(function(a,b){return a.week-b.week;});
  var rows=sess.map(function(s){ var cur=ncoh.times[s.id]||{}; var sugg=addWeeks(ncoh.start,s.week);
    var dval=cur.date||sugg||''; var tval=cur.time||'10:00';
    return '<div class="ad-sess"><div class="ad-sess-h"><span class="ad-sess-n">'+s.week+'</span><div class="f1"><div class="ad-sess-t">'+esc(s.title)+'</div><div class="ad-sess-s">Week '+s.week+' · '+s.dur+' min · '+esc(s.mode)+'</div></div></div>'
     +'<div class="ad-sess-g2"><div><label class="fl">Date</label><input class="inp" type="date" data-time="date:'+s.id+'" value="'+esc(dval)+'"></div><div><label class="fl">Time</label><input class="inp" type="time" data-time="time:'+s.id+'" value="'+esc(tval)+'"></div></div></div>';
  }).join('');
  return '<h3>Schedule the sessions</h3><p class="sub" style="margin-bottom:6px">This is where the template’s blank slots get real dates and times'+(ncoh.start?' — pre-filled from the start date ('+fmtDate(ncoh.start)+'). Adjust any of them.':'.')+'</p>'
   +(ncoh.start?'':'<div class="note w mt">Set a start date on the previous step to auto-fill these.</div>')
   +'<div class="ad-sess-list mt">'+rows+'</div>';
}
function ncohReview(){
  var t=DB.TPL_BY_ID[ncoh.templateId];
  var sess=t?t.sessions.slice().sort(function(a,b){return a.week-b.week;}):[];
  var sched=sess.map(function(s){ var cur=ncoh.times[s.id]||{}; var d=cur.date||addWeeks(ncoh.start,s.week);
    return '<div class="li"><div class="dot">'+s.week+'</div><div class="f1"><div class="ad-sess-t" style="font-size:12.5px">'+esc(s.title)+'</div><div class="ad-sess-s">'+fmtDate(d)+(cur.time?' · '+esc(cur.time):'')+'</div></div></div>';}).join('');
  return '<h3>Review & create</h3>'
   +'<div class="kv mt"><span>Cohort</span><b>'+esc(ncoh.name)+'</b></div>'
   +'<div class="kv"><span>Template</span><b>'+esc(t?t.name:'—')+'</b></div>'
   +'<div class="kv"><span>Level</span><b>'+(t?lvlTag(t.level)+' '+esc(t.track):'—')+'</b></div>'
   +'<div class="kv"><span>Start</span><b>'+fmtDate(ncoh.start)+'</b></div>'
   +'<div class="kv"><span>Leader</span><b>'+esc(ncoh.leader)+'</b></div>'
   +subhead('Scheduled sessions')
   +'<div class="ad-sess-list">'+sched+'</div>'
   +'<div class="note i mt">The cohort is created as a draft. Members are enrolled and the leader confirmed before it becomes active.</div>';
}
function readNcoh(){
  if(ncoh.step===1){
    var n=document.getElementById('ncoh_name'); if(n) ncoh.name=n.value;
    var s=document.getElementById('ncoh_start'); if(s) ncoh.start=s.value;
    var l=document.getElementById('ncoh_leader'); if(l) ncoh.leader=l.getAttribute('data-value');
  }
  if(ncoh.step===2){
    var t=DB.TPL_BY_ID[ncoh.templateId]; if(t) t.sessions.forEach(function(sx){
      var d=document.querySelector('[data-time="date:'+sx.id+'"]'); var tm=document.querySelector('[data-time="time:'+sx.id+'"]');
      if(d||tm) ncoh.times[sx.id]={date:(d?d.value:''),time:(tm?tm.value:'')};
    });
  }
}
function handleNcoh(cmd,arg){
  if(cmd==='open'){ ncoh=freshNcoh(); openNcoh(); return; }
  if(cmd==='from'){ ncoh=freshNcoh(); ncoh.templateId=arg; ncoh.step=1; openNcoh(); return; }
  if(cmd==='close'){ ncoh=null; U.closeDrawer(); return; }
  if(cmd==='pick'){ readNcoh(); ncoh.templateId=arg; openNcoh(); return; }
  if(cmd==='newtpl'){ if(!ncoh) ncoh=freshNcoh(); readNcoh(); ncoh.resume=true; tpl=freshTpl(); openTpl(); return; }
  if(cmd==='back'){ readNcoh(); ncoh.step=Math.max(0,ncoh.step-1); openNcoh(); return; }
  if(cmd==='next'){ readNcoh();
    if(ncoh.step===0 && !ncoh.templateId){ toast('Choose a template','b'); return; }
    if(ncoh.step===1){ if(!ncoh.name.trim()){ toast('Name the cohort','b'); return; } if(!ncoh.start){ toast('Set a start date','b'); return; } }
    ncoh.step=Math.min(3,ncoh.step+1); openNcoh(); return; }
  if(cmd==='finish'){ readNcoh();
    var t=DB.TPL_BY_ID[ncoh.templateId]; if(!t){ toast('Choose a template','b'); return; }
    var nid='ch'+(DB.COHORTS.length+1),loop=2; while(DB.COHORTS.filter(function(c){return c.id===nid;}).length){nid='ch'+(DB.COHORTS.length+loop);loop++;}
    DB.COHORTS.push({id:nid,name:ncoh.name.trim(),track:t.track,level:t.level,templateId:t.id,leader:ncoh.leader,size:0,week:0,day:0,start:ncoh.start,status:'draft',sessionTimes:ncoh.times});
    t.used=(t.used||0)+1;
    DB.AUDIT.unshift({when:'Just now',who:'Derek Sole',act:'Created cohort',obj:ncoh.name.trim()+' — from '+t.name,mod:'Cohorts'});
    toast('Cohort created · '+ncoh.name.trim(),'g');
    ncoh=null; U.closeDrawer(); U.go('cohorts/cohorts'); reView(); return;
  }
}

window.__ADMIN_DRAWERS={
 user:function(id){ var u=DB.USER_BY_ID[id]; if(!u)return;
   U.openDrawer('<span class="a" style="width:32px;height:32px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700">'+(window.TNINITIALS?window.TNINITIALS(u.name):'?')+'</span> '+esc(u.name),
     subhead('Account')+'<div class="kv"><span>Email</span><b>'+esc(u.email)+'</b></div><div class="kv"><span>Origin</span><b>'+esc(u.origin)+'</b></div><div class="kv"><span>Joined</span><b>'+esc(u.joined)+'</b></div><div class="kv"><span>Status</span><b>'+statusDot(u.status)+'</b></div>'
     +subhead('Roles (stacked)')+roleChips(u.roles)
     +(u.level&&u.level!=='—'?subhead('Level')+lvlTag(u.level):'')
     +(u.cohorts?subhead('Cohorts')+u.cohorts.map(function(c){return tag(c);}).join(' '):'')
     +subhead('Capabilities granted')+'<div class="row">'+DB.CAPS.filter(function(c){return u.roles.some(function(r){return DB.MATRIX[r]&&DB.MATRIX[r][c.k];});}).map(function(c){return tag(c.t,'ac');}).join(' ')+'</div>',
     '<button class="btn" data-mclose>Close</button><button class="btn p" data-act="toast:Role editor for '+esc(u.name)+'">Edit roles</button>'); },
 app:function(id){ openAppDrawer(id); },
 emp:function(id){ var e=DB.EMPLOYERS.filter(function(x){return x.id===id;})[0]; if(!e)return;
   U.openDrawer(esc(e.name), subhead('Company')+'<div class="kv"><span>Domain</span><b class="mono">'+esc(e.domain)+'</b></div><div class="kv"><span>Signer</span><b>'+esc(e.signer)+'</b></div><div class="kv"><span>Type</span><b>'+esc(e.type)+'</b></div><div class="kv"><span>Org</span><b>'+esc(e.org)+'</b></div><div class="kv"><span>Verified</span><b>'+statusDot(e.verify)+'</b></div>'+subhead('Activity')+'<div class="kv"><span>Unlocks</span><b>'+e.unlocks+'</b></div><div class="kv"><span>Placements</span><b>'+e.placements+'</b></div>','<button class="btn" data-mclose>Close</button>'); },
 cand:function(id){ if(!DB.CANDS.filter(function(x){return x.id===id;})[0]) return; viewCandId=id; U.go('candidates/detail'); },
 coh:function(id){ if(!DB.COHORTS.filter(function(x){return x.id===id;})[0]) return; viewCohId=id; U.go('cohorts/detail'); }
};
function openAppDrawer(id){ var a=DB.APPLICATIONS.filter(function(x){return x.id===id;})[0]; if(!a)return;
  U.openDrawer(esc(a.name)+' — application',
    subhead('Applicant')+'<div class="kv"><span>Email</span><b>'+esc(a.email)+'</b></div><div class="kv"><span>Applied</span><b>'+esc(a.when)+'</b></div>'
    +subhead('Checks')+'<div class="kv"><span>Background</span><b>'+esc(a.bg)+'</b></div><div class="kv"><span>Safeguarding</span><b>'+esc(a.safeguarding)+'</b></div><p class="sub mt8">'+esc(a.note)+'</p>'
    +'<div class="note i mt">Approve once the applicant clears background and safeguarding checks.</div>',
    '<button class="btn dg" data-act="toast:Application rejected">Reject</button><button class="btn p" data-act="toast:'+esc(a.name)+' approved (provisional)">Approve</button>'); }

})();

</script>
<script>window.__ADMIN_BOOT && window.__ADMIN_BOOT();</script>
