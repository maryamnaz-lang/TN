:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font:14px/1.55 'Lato',ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;color:#000000;background:#ffffff;
  overflow:hidden;display:flex;flex-direction:column;height:100vh}
.app{display:flex;flex:1;min-height:0;gap:16px;padding:16px;background:#ffffff;position:relative}

/* the prototype stage bar is lifted out of the candidate pane so the sidenav,
   content and assistant rail all start at the same y. Styled standalone —
   deliberately NOT inside .ui, which is a full-height flex column. */
#proto{flex:0 0 auto;background:#000000;color:#ffffff;padding:8px 18px;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;position:relative;z-index:150;
  font:12px/1.55 'Lato',ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;color:#ffffff}
#proto b{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#000000;font-weight:700;margin-right:2px}
#proto button{font:inherit;cursor:pointer}
#proto .pill{border:1px solid #000000;background:#000000;color:#ffffff;border-radius:99px;padding:4px 11px;font-size:11.5px}
#proto .pill:hover{background:#000000;color:#ffffff}
#proto .pill.on{background:#ffffff;color:#000000;border-color:#d6d6d6;font-weight:700}
#proto .rs{margin-left:auto;border:1px solid #000000;background:none;color:#000000;border-radius:10px;padding:4px 10px;font-size:11.5px}
#proto .rs:hover{color:#ffffff;border-color:#000000}
/* ---- portal switch menu (kebab at the end of the bar) ---- */
#proto .proto-lab{color:#ffffff;font-size:11.5px;font-weight:700;letter-spacing:-.01em;padding:4px 2px}
#proto .proto-menu{position:relative;display:inline-flex;margin-left:auto}
#proto .pm-btn{border:1px solid rgba(255,255,255,.35);background:none;color:#ffffff;border-radius:9px;width:30px;height:26px;display:grid;place-items:center;padding:0}
#proto .pm-btn:hover{background:rgba(255,255,255,.14)}
#proto .pm-btn svg{width:16px;height:16px}
#proto .proto-drop{position:absolute;top:calc(100% + 9px);right:0;background:#ffffff;color:#000000;border:1px solid #ececec;border-radius:13px;box-shadow:0 18px 46px -14px rgba(0,0,0,.55);padding:6px;min-width:212px;display:none;z-index:140}
#proto .proto-drop.on{display:block}
#proto .proto-drop .lab{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:#9a9a9a;font-weight:700;padding:7px 10px 5px}
#proto .proto-drop button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:9px;font-size:12.5px;color:#000000;font-weight:600}
#proto .proto-drop button:hover{background:#f3f3f4}
#proto .proto-drop button svg{width:16px;height:16px;flex:0 0 16px;color:#000000}
#proto .proto-drop button .cap{display:block;font-size:11px;font-weight:400;color:#8a8a8a;margin-top:1px}
/* content-column layout is declared after the scoped portal CSS — see below */

/* ---------- sidenav ---------- */
.sd{width:250px;flex:0 0 250px;border-right:0;border-radius:24px;
  display:flex;flex-direction:column;overflow:hidden;height:100%;padding:24px 20px;gap:24px;
  background:#000000}
.sd-brand{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0}
.sd-toggle{width:30px;height:30px;flex:0 0 30px;border-radius:10px;background:#000000;border:1px solid #000000;
  color:#000000;display:grid;place-items:center;cursor:pointer}
.sd-toggle:hover{background:#000000;color:#ffffff}
.sd-toggle svg{display:block;transition:transform .2s}
.sw .ini{display:none;font-size:12.5px;font-weight:700}

/* ---------- collapsed sidenav ---------- */
.sd{transition:flex-basis .2s cubic-bezier(.4,0,.2,1),width .2s cubic-bezier(.4,0,.2,1);
  position:relative;isolation:isolate}
.sd>*{position:relative;z-index:1}
.sd.collapsed{width:76px;flex:0 0 76px;padding:24px 14px}
.sd.collapsed .sd-logo{display:none}
.sd.collapsed .sd-brand{justify-content:center}
.sd.collapsed .sd-toggle svg{transform:rotate(180deg)}
.sd.collapsed .lbl{display:none}
.sd.collapsed .sw{flex-direction:column;gap:4px}
.sd.collapsed .sw .ini{display:block}
.sd.collapsed .sw button{padding:7px 0}
.sd.collapsed .sd-mods button{justify-content:center;padding:0;position:relative}
.sd.collapsed .sd-mods button u{position:absolute;top:5px;right:5px;min-width:9px;width:9px;height:9px;
  padding:0;font-size:0;border-radius:99px;border:2px solid #000000}
.sd.collapsed .sd-call{display:none}
.sd-switch{flex:0 0 auto;padding:0 0 24px;border-bottom:1px solid #000000}
.sd-logo{font-weight:700;font-size:24px;letter-spacing:-.03em;color:#ffffff;line-height:1.1}
.sd-logo i{font-style:normal;color:#000000}
.sw{display:flex;gap:4px;background:#000000;border:1px solid #000000;border-radius:16px;padding:4px}
.sw button{flex:1;border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;color:#000000;padding:7px 4px;border-radius:12px;cursor:pointer}
.sw button:hover{color:#ffffff}
.sw button.on{background:#000000;color:#ffffff}
.sd-who{display:none}
.sd-who .a{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#ffffff;flex:0 0 32px}
.sd-who .n{font-size:12.5px;font-weight:700;line-height:1.25}
.sd-who .r{font-size:11px;color:#000000}
.sd-scroll{flex:1;min-height:0;overflow-y:auto;padding:0;display:flex;flex-direction:column;gap:24px}
.sd-scroll>div{display:flex;flex-direction:column;gap:24px}
.sd-mods{padding:0;display:flex;flex-direction:column;gap:4px}
.sd-mods.sd-set{margin-top:0;padding-top:24px;border-top:1px solid #000000}

/* ---------- scrollbars: thin, light, out of the way ---------- */
.app *{scrollbar-width:none;-ms-overflow-style:none}
.app *::-webkit-scrollbar{width:0;height:0;display:none}
.app *::-webkit-scrollbar-track{background:transparent}
.app *::-webkit-scrollbar-thumb{background:#ffffff;border-radius:99px}
.app *::-webkit-scrollbar-thumb:hover{background:#ffffff}
.app *::-webkit-scrollbar-corner{background:transparent}
/* the sidenav is dark, so it needs the inverse */
.sd-scroll{scrollbar-color:rgba(214,214,214,.16) transparent}
.sd-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16)}
.sd-scroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28)}
.sd-mods button{display:flex;align-items:center;gap:11px;width:100%;height:34px;text-align:left;
  background:transparent;border:0;padding:0 12px;font:inherit;font-size:13px;
  color:#ffffff;cursor:pointer;flex:0 0 34px;border-radius:11px}
.sd-mods button:hover{background:rgba(255,255,255,.05);color:#ffffff}
.sd-mods button.on{background:#000000;color:#ffffff;font-weight:700}
.sd-mods button.on:hover{background:#000000;color:#ffffff}
.sd-mods button i{font-style:normal;color:#000000;width:16px;height:16px;flex:0 0 16px;
  display:grid;place-items:center}
.sd-mods button i svg{display:block}
.sd-mods button:hover i{color:#ffffff}
.sd-mods button.on i{color:#ffffff}
.sd-mods button u{margin-left:auto;text-decoration:none;font-size:9.5px;font-weight:700;
  background:#000000;color:#ffffff;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.sd-mods button u.q{background:#000000;color:#ffffff}
.sd-mods button.on u,.sd-mods button.on u.q{background:rgba(255,255,255,.26);color:#ffffff}

/* ---------- session card ---------- */
.sd-call{padding:0;flex:0 0 auto}
.sd-call:empty{display:none}
.cc{border-radius:16px;padding:13px 14px;color:#ffffff;
  background:#000000;
  box-shadow:0 8px 20px -8px rgba(0,0,0,.6);position:relative;overflow:hidden}
.cc::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:none}
.cc-top{display:flex;align-items:center;gap:7px;margin-bottom:9px;position:relative}
.cc-ic{width:22px;height:22px;flex:0 0 22px;border-radius:10px;display:grid;place-items:center;
  background:rgba(255,255,255,.22)}
.cc-ic svg{display:block}
.cc-lab{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;opacity:.92}
.cc-when{font-size:14.5px;font-weight:700;letter-spacing:-.02em;line-height:1.25;position:relative}
.cc-sub{font-size:11.5px;opacity:.86;margin-top:3px;line-height:1.4;position:relative}
.cc-btn{margin-top:11px;width:100%;border:0;border-radius:12px;padding:9px 12px;font:inherit;
  font-size:12.5px;font-weight:700;color:#000000;background:#ffffff;cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;gap:7px}
.cc-btn:hover{background:#ffffff}
.sd-mods button u{margin-left:auto;text-decoration:none;font-size:9.5px;font-weight:700;background:#000000;color:#ffffff;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.sd-mods button u.q{background:#ffffff;color:#000000}

/* portraits layer over the initials inside any avatar */
.ui .av,.rail-top .av,.pm .av{position:relative;overflow:hidden}
.ui .av>i,.rail-top .av>i,.pm .av>i{font-style:normal}
.ui .av>img,.rail-top .av>img,.pm .av>img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block}
.ai-av{position:relative;overflow:hidden}
.ai-av>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* the level/title becomes the card's own heading rather than a chip in the row */
.ui h2.lvl-title{margin:0 0 14px;font-size:20px;font-weight:700;letter-spacing:-.025em;color:#000000;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ui h2.lvl-title.on{color:#000000}
.ui h2.lvl-title.on::before{content:'';width:9px;height:9px;border-radius:99px;background:#000000;
  align-self:center;flex:0 0 9px}
.ui h2.lvl-title small{font-size:12px;font-weight:400;color:#000000;letter-spacing:0}
/* status colour carries meaning: amber = waiting on someone else, green = a gain */
.ui h2.lvl-title em{font-style:normal;font-weight:700;color:#000000}
.ui h2.lvl-title.pending::before{content:'';width:9px;height:9px;border-radius:99px;background:#000000;
  align-self:center;flex:0 0 9px}
.ui h2.lvl-title.up::before{content:'';width:9px;height:9px;border-radius:99px;background:#000000;
  align-self:center;flex:0 0 9px}
.ui h2.lvl-title small.up{color:#000000;font-weight:700}
.ui .qr-t b i.pend{font-style:normal;color:#000000}

/* ---------- book a call: right-hand slide-over ---------- */
.ui .bk-wrap{position:fixed;inset:0;z-index:230;display:none;background:rgba(0,0,0,.42)}
.ui .bk-wrap.on{display:block}
.ui .bk{position:absolute;top:0;right:0;bottom:0;width:470px;max-width:100%;background:#ffffff;
  display:flex;flex-direction:column;box-shadow:-20px 0 60px -22px rgba(0,0,0,.45)}
.ui .bk-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid #d6d6d6;flex:0 0 auto}
.ui .bk-h h2{flex:1;margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.ui .bk-ic{width:32px;height:32px;flex:0 0 32px;border:1px solid #d6d6d6;background:#ffffff;border-radius:12px;
  color:#000000;display:grid;place-items:center;cursor:pointer}
.ui .bk-ic:hover{background:#ffffff;color:#000000}
.ui .bk-ic.ghost{opacity:0;pointer-events:none}
.ui .bk-ic svg{display:block}

/* stepper — numbered nodes joined by connectors */
.ui .bk-steps{display:flex;align-items:flex-start;justify-content:center;padding:18px 18px 16px;
  border-bottom:1px solid #d6d6d6;flex:0 0 auto}
.ui .bk-step{display:flex;flex-direction:column;align-items:center;gap:8px;flex:0 0 auto;width:74px}
.ui .bk-step .c{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;background:#ffffff;color:#000000;
  transition:background .18s,color .18s}
.ui .bk-step .c svg{display:block}
.ui .bk-step .t{font-size:10.5px;font-weight:700;color:#000000;text-align:center;white-space:nowrap;
  line-height:1.2}
.ui .bk-step.now .c{background:#000000;color:#ffffff;box-shadow:0 0 0 4px rgba(0,0,0,.14)}
.ui .bk-step.now .t{color:#000000}
.ui .bk-step.done .c{background:#000000;color:#ffffff}
.ui .bk-step.done .t{color:#000000}
.ui .bk-line{flex:0 0 40px;width:40px;height:2px;border-radius:99px;background:#d6d6d6;margin-top:14px;
  transition:background .18s}
.ui .bk-line.done{background:#000000}

.ui .bk-b{flex:1;min-height:0;overflow-y:auto;padding:18px}
.ui .bk-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#000000;font-weight:700;
  margin:0 0 10px}
.ui .bk-sec:not(:first-child){margin-top:20px}
.ui .bk-note{font-size:12px;color:#000000;line-height:1.6;margin-top:12px}

/* chosen agent */
.ui .bk-agent{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid #d6d6d6;border-radius:16px}
.ui .bk-agent.tight{padding:12px}
.ui .bk-agent .n{font-size:14px;font-weight:700;letter-spacing:-.01em}
.ui .bk-agent .r{font-size:11.5px;color:#000000;margin-top:2px}
.ui .bk-agent .m{display:flex;align-items:center;gap:6px;font-size:11px;color:#000000;margin-top:6px}
.ui .bk-agent .m .dot{color:#ffffff}
.ui .bk-agent .p{font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
.ui .bk-agent .p s{display:block;text-decoration:none;font-size:11px;font-weight:400;color:#000000;margin-top:2px}

/* selectable rows */
.ui .bk-list{display:flex;flex-direction:column;gap:8px}
.ui .bk-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#ffffff;
  border:1px solid #d6d6d6;border-radius:14px;padding:11px 13px;font:inherit;cursor:pointer}
.ui .bk-row:hover{border-color:#d6d6d6;background:#ffffff}
.ui .bk-row.on{border-color:#000000;background:#ffffff;box-shadow:0 0 0 1px #000000 inset}
.ui .bk-row .n{font-size:13px;font-weight:700;color:#000000}
.ui .bk-row .r{font-size:11.5px;color:#000000;margin-top:2px}
.ui .bk-row .p{font-size:13px;font-weight:700;white-space:nowrap}
.ui .bk-row .p.sm{font-size:12.5px}
.ui .bk-rad{width:18px;height:18px;flex:0 0 18px;border-radius:50%;border:1.6px solid #d6d6d6;position:relative}
.ui .bk-row.on .bk-rad{border-color:#000000}
.ui .bk-row.on .bk-rad::after{content:'';position:absolute;inset:3.5px;border-radius:50%;background:#000000}

/* logo sits at the end of the row; only the label travels with the radio */
.ui .bk-row .wm,.ui .bk-row .bm,.ui .bk-row .bk-logos{margin-left:auto;flex:0 0 auto}
.ui .bk-logos{display:inline-flex;align-items:center;gap:5px}
.ui .bk-logos .bm{width:36px;height:24px;flex:0 0 36px}

/* the agent card inside the panel reuses the dashboard structure */
.ui .bk-agent-card .ag-card{border-radius:16px}
.ui .bk-agent-card .ag-foot{padding-top:0}

/* card form expands inside the payment step */
.ui .bk-form.inline{border:1px solid #d6d6d6;border-top:0;background:#ffffff;
  border-radius:0 0 14px 14px;padding:14px;margin:-8px 0 0}
.ui .bk-row.on+.bk-form.inline{border-color:#000000}

/* card brands */
.ui .bm{display:inline-flex;align-items:center;justify-content:center;width:42px;height:28px;flex:0 0 42px;
  border-radius:8px;font-size:9px;font-weight:700;letter-spacing:.02em;background:#ffffff;color:#000000}
.ui .bm.visa{background:#000000;color:#ffffff;font-style:italic;font-size:11px}
.ui .bm.amex{background:#000000;color:#ffffff;font-size:8.5px}
.ui .bm.disc{background:#ffffff;color:#000000;font-size:6.5px;border:1px solid #d6d6d6}
.ui .bm.mc{background:#ffffff;border:1px solid #d6d6d6;gap:0}
.ui .bm.mc i{width:13px;height:13px;border-radius:50%;background:#000000}
.ui .bm.mc i+i{background:#000000;margin-left:-5px;mix-blend-mode:multiply}
.ui .wm{display:inline-flex;align-items:center;justify-content:center;width:42px;height:28px;flex:0 0 42px;
  border-radius:8px;font-size:9px;font-weight:700;background:#ffffff;color:#000000}
.ui .wm.pp{background:#ffffff;color:#000000;font-size:8px;font-style:italic}
.ui .wm.gp{background:#ffffff;border:1px solid #d6d6d6;color:#000000;font-size:9px}
.ui .wm.ap{background:#000000;color:#ffffff;font-size:9px}

.ui .bk-add{width:100%;margin-top:10px;border:1px dashed #d6d6d6;background:#ffffff;color:#000000;
  border-radius:14px;padding:12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.ui .bk-add:hover{background:#ffffff}
.ui .bk-brands{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ui .bk-brand{display:flex;align-items:center;gap:10px;border:1px solid #d6d6d6;background:#ffffff;
  border-radius:14px;padding:11px 12px;font:inherit;font-size:12.5px;font-weight:700;color:#000000;cursor:pointer}
.ui .bk-brand:hover{border-color:#d6d6d6;background:#ffffff}
.ui .bk-form .fl{margin-top:0}
.ui .bk-cn{position:relative;display:flex;align-items:center;gap:9px}
.ui .bk-cn .bm{position:absolute;right:8px}
.ui .bk-cn input{padding-right:58px}
.ui .bk-chk{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#000000;cursor:pointer}
.ui .bk-chk input{accent-color:#000000;width:16px;height:16px}
.ui .bk-secure{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#000000;margin-top:16px;
  background:#ffffff;border-radius:12px;padding:10px 12px}
.ui .bk-secure svg{display:block}
.ui .bk-free{border:1px solid #d6d6d6;background:#ffffff;border-radius:16px;padding:14px}
.ui .bk-free .n{font-size:14px;font-weight:700;color:#000000}
.ui .bk-free .r{font-size:12px;color:#000000;margin-top:3px}

.ui .bk-rev>div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:9px 0;
  border-bottom:1px dashed #d6d6d6}
.ui .bk-rev>div:last-child{border-bottom:0}
.ui .bk-rev span{color:#000000}
.ui .bk-rev b{font-weight:700;text-align:right}
.ui .bk-rev b.tot{font-size:15px}
.ui .bk-rev b.old{color:#000000;text-decoration:line-through;font-weight:400}
.ui .bk-done{text-align:center;padding:16px 0 20px}
.ui .bk-done .ic{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:#ffffff;color:#000000;
  display:grid;place-items:center}
.ui .bk-done h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.ui .bk-done p{margin:6px 0 0;font-size:13px;color:#000000}

.ui .bk-f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px solid #d6d6d6;flex:0 0 auto}
.ui .bk-f>*:only-child{margin-left:auto}
.ui .bk-amt{flex:1;font-size:12.5px;color:#000000;font-weight:700}
.ui .bk-cta{height:44px;padding:0 20px;border-radius:14px;font-size:13.5px}
.ui .bk-cta.off{opacity:.45}
@media(max-width:560px){.ui .bk{width:100%}.ui .bk-brands{grid-template-columns:1fr}}

/* ---------- time picker: date strip + time grid ---------- */
.ui .bk-dates{display:flex;gap:8px;overflow-x:auto;padding:1px 1px 9px;margin:0 -1px}
.ui .bk-day{flex:0 0 56px;width:56px;border:1px solid #d6d6d6;background:#ffffff;border-radius:14px;
  padding:8px 0 9px;font:inherit;color:#000000;cursor:pointer;text-align:center;
  transition:background .16s,border-color .16s,color .16s}
.ui .bk-day .w{font-size:10.5px;font-weight:700;color:#000000;line-height:1.2}
.ui .bk-day .n{font-size:17px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin-top:1px}
.ui .bk-day .td{font-size:9px;font-weight:700;color:#000000;line-height:1.2;margin-top:1px}
.ui .bk-day:hover{border-color:#d6d6d6}
.ui .bk-day.on{background:#000000;border-color:#000000;color:#ffffff}
.ui .bk-day.on .w,.ui .bk-day.on .td{color:rgba(255,255,255,.7)}
.ui .bk-day.off{opacity:.42;cursor:not-allowed}
.ui .bk-day.off:hover{border-color:#d6d6d6}
.ui .bk-times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ui .bk-time{border:1px solid #d6d6d6;background:#ffffff;border-radius:12px;padding:11px 4px;font:inherit;
  font-size:12.5px;font-weight:700;color:#000000;cursor:pointer;text-align:center;
  transition:background .16s,border-color .16s,color .16s}
.ui .bk-time:hover{border-color:#d6d6d6;background:#ffffff}
.ui .bk-time.on{background:#000000;border-color:#000000;color:#ffffff}
.ui .bk-noslot{border:1px dashed #d6d6d6;border-radius:14px;padding:16px;text-align:center;
  font-size:12.5px;color:#000000;background:#ffffff}

/* ---------- quiz result: score dials, stacked not barred ---------- */
.ui .qs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.ui .qs-card{border:1px solid #d6d6d6;border-radius:16px;padding:14px 10px 12px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:9px}
.ui .qs-k{font-size:11.5px;font-weight:700;color:#000000;letter-spacing:-.005em;line-height:1.3}
.ui .qs-dial{position:relative;width:66px;height:66px}
.ui .qs-dial svg{display:block}
.ui .qs-v{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:700;
  letter-spacing:-.03em;color:#000000}
.ui .qs-b{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.ui .qs-b.ok{color:#000000}.ui .qs-b.wa{color:#000000}.ui .qs-b.bad{color:#000000}

/* ---------- assistant widgets ---------- */
.aw{background:#ffffff;border:1px solid #d6d6d6;border-radius:14px;padding:12px;margin:0 0 8px}
.aw:last-child{margin-bottom:0}
.aw-h{font-size:12px;font-weight:700;letter-spacing:-.01em;color:#000000;margin-bottom:10px}
.aw-f{font-size:11.5px;color:#000000;line-height:1.5;margin-top:10px;padding-top:9px;border-top:1px solid #d6d6d6}
.aw-st{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.aw-s{background:#ffffff;border-radius:10px;padding:8px 10px}
.aw-s span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#000000;font-weight:700}
.aw-s b{display:block;font-size:14px;font-weight:700;letter-spacing:-.02em;margin-top:3px;color:#000000}
.aw-s u{display:block;text-decoration:none;font-size:10.5px;color:#000000;margin-top:2px}
.aw-b{margin-bottom:9px}
.aw-bl{display:flex;justify-content:space-between;font-size:10.5px;color:#000000;margin-bottom:4px}
.aw-bt{height:6px;border-radius:99px;background:#ffffff;overflow:hidden}
.aw-bt i{display:block;height:100%;border-radius:99px;background:#000000}
.aw-bt i.ok{background:#000000}.aw-bt i.wa{background:#000000}.aw-bt i.bad{background:#000000}
.aw-r>div{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:6px 0;border-bottom:1px dashed #d6d6d6}
.aw-r>div:last-child{border-bottom:0}
.aw-r span{color:#000000}.aw-r b{font-weight:700;text-align:right;color:#000000}
.aw-tw{overflow-x:auto;margin:2px -2px}
.aw-t{width:100%;border-collapse:collapse;font-size:11px}
.aw-t th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#000000;
  font-weight:700;padding:5px 6px;border-bottom:1px solid #d6d6d6;white-space:nowrap}
.aw-t td{padding:6px;border-bottom:1px solid #d6d6d6;color:#000000;white-space:nowrap}
.aw-t tr:last-child td{border-bottom:0}
.aw-t .up{color:#000000;font-weight:700}.aw-t .dn{color:#000000;font-weight:700}
.aw-sec{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#000000;font-weight:700;margin:12px 0 6px}
.aw-li{font-size:11.5px;color:#000000;padding:5px 0 5px 15px;position:relative;line-height:1.5}
.aw-li::before{content:'';position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:99px;background:#ffffff}
.aw-li.ok::before{background:#000000}.aw-li.wa::before{background:#000000}
.aw-p{display:flex;flex-direction:column;gap:2px}
.aw .av{position:relative;overflow:hidden;width:28px;height:28px;flex:0 0 28px;border-radius:50%;
  background:#000000;color:#ffffff;display:grid;place-items:center;font-size:10px;font-weight:700}
.aw .av>i{font-style:normal}
.aw .av>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.aw-pi{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid #d6d6d6}
.aw-pi:last-child{border-bottom:0}
.aw-pi.big{border-bottom:0;padding:0 0 10px}
.aw-pi .n{font-size:12px;font-weight:700;color:#000000}
.aw-pi .l{font-size:10.5px;color:#000000;margin-top:1px;line-height:1.4}
.aw-pi>div:nth-child(2){flex:1;min-width:0}
.aw-tag{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px;
  background:#ffffff;color:#000000;white-space:nowrap}
.aw-tag.ok{background:#ffffff;color:#000000}

.ui .card.tip .tip-ic{width:18px;height:18px;flex:0 0 18px;border-radius:50%;background:#000000;color:#ffffff;
  display:grid;place-items:center;font-size:11px;font-weight:700;font-style:italic;line-height:1}
.ui .card.tip p{margin:0 0 9px;font-size:12.5px;line-height:1.7;color:#000000}
.ui .card.tip p:last-child{margin-bottom:0}
.ui .card.tip p b{color:#000000;font-weight:700}
.ui .card.tip .s{color:#000000}

/* stat grids reflow instead of cramming now the assistant rail is wider */
.ui .g4{grid-template-columns:repeat(auto-fit,minmax(146px,1fr))}
.ui .g3{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
/* Title / Score / Level belong on one line whatever the column is doing */
.ui .g3.trio{grid-template-columns:repeat(3,1fr);gap:10px}
.ui .g3.trio .stat{padding:12px 11px}
.ui .g3.trio .stat .v{white-space:nowrap;font-size:15px}
.ui .g3.trio .stat .v s{font-size:11.5px}

/* Content column is a flex column: fixed header, scrolling main.
   MUST live here — the scoped portal CSS above sets `position:sticky; top:34px`
   on header, and a sticky element whose natural offset is less than `top`
   gets pushed down by that amount, which is what left a gap above it. */
.ui{display:flex;flex-direction:column;height:100%;gap:16px;background:transparent}
.ui header{position:static;flex:0 0 auto;top:auto;min-height:44px;background:transparent;border-bottom:0}
.ui header .hin{height:auto;min-height:44px;padding:2px 0;max-width:none;margin:0;
  flex-direction:column;align-items:flex-start;justify-content:center;gap:var(--hd-gap)}
.ui .page-desc{margin:0;font-size:12.5px;line-height:1.5;color:#000000;max-width:96ch}

/* heading → description spacing is one token, shared by the page header and every card */
.ui{--hd-gap:3px}
.ui .card>h3:has(+.sub),.ui .card>h2:has(+.sub),
.ui .card>h3:has(+p.sub),.ui .card>h2:has(+p.sub){margin-bottom:var(--hd-gap)}
.ui .card>h3+.sub,.ui .card>h2+.sub{margin-top:0}
.ui .hd-desc{margin-top:var(--hd-gap)}
.ui main{flex:1;min-height:0;overflow-y:auto}

/* page title, matching the 24px bold headings in the design */
.ui .crumb h1.cr-c{font-size:24px;font-weight:700;letter-spacing:-.03em;color:#000000;margin:0;line-height:1.2}
.ui .crumb .cr-l{font-size:20px;font-weight:700;color:#000000}
.ui .crumb .cr-s{font-size:20px;color:#ffffff}

/* sections are white, borderless, 24px radius — headings sit outside them */
.ui .card{background:#ffffff;border:0;border-radius:24px;padding:20px}
.ui .card.f{background:#ffffff}
.ui h2.sec-h{font-size:17px;font-weight:700;letter-spacing:-.02em;color:#000000;line-height:36px;
  margin:0;height:36px;display:flex;align-items:center}
/* content fills the column — the assistant rail already limits how wide it gets,
   so the 1180px cap + auto margins were only adding gutters on wide screens */
.ui main,.ui #agMain{max-width:none;margin:0;padding:0 0 24px}

/* ---------- event banner ---------- */
.ui .bnr{position:relative;overflow:hidden;border-radius:20px;padding:16px 18px;color:#ffffff;
  display:flex;align-items:center;gap:14px;
  background:#000000;
  box-shadow:0 12px 28px -14px rgba(0,0,0,.6)}
.ui .bnr::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:
    none,
    none}
.ui .bnr>*{position:relative;z-index:1}
.ui .bnr-ic{width:38px;height:38px;flex:0 0 38px;border-radius:14px;display:grid;place-items:center;
  background:rgba(255,255,255,.20);border:1px solid rgba(214,214,214,.22)}
.ui .bnr-ic svg{display:block}
.ui .bnr-t{flex:1;min-width:0}
.ui .bnr-k{font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:700;opacity:.82}
.ui .bnr-h{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-top:3px;line-height:1.3}
.ui .bnr-s{font-size:12.5px;opacity:.86;margin-top:4px;line-height:1.5;max-width:82ch}
.ui .bnr-b{height:38px;padding:0 18px;border:0;border-radius:12px;background:#ffffff;color:#000000;
  font:inherit;font-size:13px;font-weight:700;cursor:pointer;flex:0 0 auto;white-space:nowrap}
.ui .bnr-b:hover{background:#ffffff}
@media(max-width:860px){
  .ui .bnr{flex-wrap:wrap}
  .ui .bnr-b{width:100%;justify-content:center}
}

/* ---------- agent search ---------- */
.ui .srch{position:relative;flex:0 0 auto;width:294px;max-width:100%}
.ui .srch-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#000000;
  display:grid;place-items:center;pointer-events:none}
.ui .srch input{width:100%;height:38px;border:1px solid #d6d6d6;border-radius:12px;background:#ffffff;
  padding:0 12px 0 34px;font:inherit;font-size:13px;color:#000000}
.ui .srch input::placeholder{color:#000000}
.ui .srch input:focus{outline:2px solid #d6d6d6;border-color:#000000;background:#ffffff}
.ui .srch input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.ui .srch-none{grid-column:1/-1;padding:26px 4px;text-align:center;font-size:12.5px;color:#000000}

/* ---------- scheduled interviews, empty ---------- */
.ui .sched-empty{display:flex;gap:13px;align-items:flex-start;padding:15px;border-radius:16px;
  background:#ffffff;border:1px dashed #d6d6d6}
.ui .sched-ic{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:#ffffff;color:#000000;
  display:grid;place-items:center}
.ui .sched-ic svg{display:block}
.ui .sched-empty .t{font-size:13.5px;font-weight:700;color:#000000}
.ui .sched-empty .s{font-size:12.5px;color:#000000;margin-top:3px;line-height:1.55}
@media(max-width:900px){.ui .srch{width:100%;order:3;margin-top:10px}}

/* next-step copy capped at 60% of the card, spacer keeps the CTA hard right */
.ui .next-txt{flex:0 1 74%;min-width:0}
@media(max-width:900px){.ui .next-txt{flex:1 1 100%}}

/* CTA matched to the height of a highlighted sidenav module (38px) */
.ui .btn.cta{height:38px;padding:0 18px;display:inline-flex;align-items:center;font-size:13px;
  border-radius:12px;flex:0 0 auto}

/* outlined primary */
.ui .btn.out{background:#ffffff;border-color:#000000;color:#000000;font-weight:700}
.ui .btn.out:hover{background:#ffffff;border-color:#000000;color:#000000}

/* quiz results: four cards, each with a primary-tinted icon */
.ui .qr{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.ui .qr-c{display:flex;gap:11px;align-items:flex-start;padding:13px;background:#ffffff;
  border:1px solid #d6d6d6;border-radius:16px;transition:border-color .15s}
.ui .qr-c:hover{border-color:#d6d6d6}
.ui .qr-ic{width:32px;height:32px;flex:0 0 32px;border-radius:12px;background:#ffffff;color:#000000;
  display:grid;place-items:center}
.ui .qr-ic svg{display:block}
.ui .qr-t{min-width:0}
.ui .qr-t span{display:block;font-size:11.5px;color:#000000;line-height:1.4}
.ui .qr-t b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.02em;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ui .btn.sec{background:#ffffff;border:0;color:#000000;font-weight:700}
.ui .btn.sec:hover{background:#ffffff;color:#000000}

/* ---------- agent cards ---------- */
.ui .ag-grid{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
/* free up a column by collapsing either panel; both collapsed is still four */
body.sd-collapsed .ui .ag-grid,
body.ai-closed .ui .ag-grid{grid-template-columns:repeat(4,1fr)}
/* the assistant expanded to half the window leaves room for two */
body.ai-wide .ui .ag-grid{grid-template-columns:repeat(2,1fr)}
@media(max-width:1120px){.ui .ag-grid,body.sd-collapsed .ui .ag-grid,body.ai-closed .ui .ag-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.ui .ag-grid,body.sd-collapsed .ui .ag-grid,body.ai-closed .ui .ag-grid,body.ai-wide .ui .ag-grid{grid-template-columns:1fr}}
.ui .ag-card{border:1px solid #d6d6d6;border-radius:16px;padding:13px;background:#ffffff;
  display:flex;flex-direction:column;gap:11px;transition:border-color .15s,box-shadow .15s}
.ui .ag-card:hover{border-color:#d6d6d6;box-shadow:0 6px 18px -10px rgba(0,0,0,.18)}
.ui .ag-top{display:flex;gap:10px;align-items:flex-start}
.ui .ag-av{position:relative;overflow:hidden;width:44px;height:44px;flex:0 0 44px;border-radius:50%;
  background:#000000;color:#ffffff;display:grid;place-items:center;font-size:14px;font-weight:700}
.ui .ag-av i{font-style:normal}
.ui .ag-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ui .ag-id{min-width:0;flex:1}
.ui .ag-n{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.ui .ag-role{font-size:11.5px;color:#000000;line-height:1.45}
.ui .ag-meta{display:flex;flex-direction:column;gap:4px}
.ui .ag-rate{display:flex;align-items:center;margin-top:5px}
.ui .ag-cnt{font-size:11.5px;color:#000000}
.ui .ag-foot{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:3px}
.ui .ag-price{flex:1;font-size:14px;font-weight:700;letter-spacing:-.02em}
.ui .ag-price s{text-decoration:none;display:block;font-size:11px;font-weight:400;color:#000000;margin-top:1px}

/* ---------- yellow star rating, rounded points ---------- */
.ui .rate{position:relative;display:inline-flex;line-height:1;color:#ffffff;vertical-align:middle}
.ui .rate-b,.ui .rate-f{display:flex;gap:0.5px}
.ui .rate-f{position:absolute;left:0;top:0;overflow:hidden;color:#ffffff}
.ui .rate .st{display:block;flex:0 0 auto}
.ui .rate-n{font-size:12px;font-weight:700;color:#000000;margin:0 7px 0 0;vertical-align:middle}

/* ============================================================
   WIREFRAME PASS
   Black on white, white on black, one grey for hairlines.
   ============================================================ */

/* --- image slots become the crossed box --- */
.av,.ag-av,.ai-av.usr,.ui .vid,.sd-who .a,.wf-img{background:#ffffff !important;border:1px solid #000000;
  position:relative;overflow:hidden;color:transparent !important;box-shadow:none !important}
.av>i,.ag-av>i,.ai-av.usr>i,.sd-who .a,.av>img,.ag-av>img{visibility:hidden}
.av::before,.ag-av::before,.ai-av.usr::before,.ui .vid::before,.sd-who .a::before,.wf-img::before,
.av::after,.ag-av::after,.ai-av.usr::after,.ui .vid::after,.sd-who .a::after,.wf-img::after{
  content:'';position:absolute;left:50%;top:-30%;width:1px;height:160%;
  background:#000000;pointer-events:none}
.av::before,.ag-av::before,.ai-av.usr::before,.ui .vid::before,.sd-who .a::before,.wf-img::before{transform:rotate(45deg)}
.av::after,.ag-av::after,.ai-av.usr::after,.ui .vid::after,.sd-who .a::after,.wf-img::after{transform:rotate(-45deg)}

/* the chapter player is an image slot too, so its furniture goes black on paper */
.ui .vid .ttl,.ui .vid .cap{color:#000000}
.ui .vid .play{background:#ffffff;border:1px solid #000000;color:#000000}
.ui .vid .play:hover{background:#ffffff}
.ui .vid .tl{background:#d6d6d6}
.ui .vid .tl i{background:#000000}
.ui .bk-agent .m .dot,.ui .li .dot.sep{color:#d6d6d6}

/* --- tracks and separators keep the one grey, or they vanish --- */
.ui .bar,.ui .bar.t{background:#d6d6d6}
.ui .rate{color:#d6d6d6}
.ui .rate-f{color:#000000}
.ui .crumb .cr-s{color:#d6d6d6}
.ui .bub.them,.ui .ai-msg.them{border:1px solid #d6d6d6}
.ui .qs-dial svg circle:first-child{stroke:#d6d6d6}
.aw-b i,.aw-b>span{background:#d6d6d6}

/* the page keeps its paper tint so the white cards still read as cards */
body,.app{background:#f7f7f7}

/* --- anything that used to be told apart by a tint gets an edge --- */
.ui .tag,.ui .stat,.ui .note,.ui .kv-box,.ui .pill{border:1px solid #d6d6d6}
.ui .card.f,.ui .wm,.ui .bm,.aw-tag,.ui .empty,.ui .srch-none{border:1px solid #d6d6d6}
.ui nav.main button.on{border:1px solid #000000}
.ui .bm.visa,.ui .bm.amex,.ui .bm.disc,.ui .wm.ap{border-color:#000000}
.ui .tag.lv,.ui .tag.ac{border-color:#000000}
.ui .dot{border:1px solid #d6d6d6}
.ui .dot.ok,.ui .dot.now{border-color:#000000}
.aw,.aw-s,.aw-r>div{border:1px solid #d6d6d6}

/* --- on the black sidenav everything inverts --- */
.sd{background:#000000}
.sd-logo,.sd-logo *,.sd-logo span{color:#ffffff}
.sd-mods button{color:#ffffff}
.sd-mods button i{color:#ffffff}
.sd-mods button:hover{background:rgba(255,255,255,.08);color:#ffffff}
.sd-mods button.on{background:#ffffff;color:#000000;font-weight:700}
.sd-mods button.on:hover{background:#ffffff;color:#000000}
.sd-mods button.on i{color:#000000}
.sd-mods button u{background:#ffffff;color:#000000}
.sd-mods button u.q{background:rgba(255,255,255,.22);color:#ffffff}
.sd-mods button.on u,.sd-mods button.on u.q{background:#000000;color:#ffffff}
.sd-mods.sd-set,.sd hr,.sd .sd-div{border-color:rgba(255,255,255,.22)}
.sd-toggle{background:#000000;border:1px solid rgba(255,255,255,.35);color:#ffffff}
.sd-toggle:hover{background:rgba(255,255,255,.12);color:#ffffff}
.sw{background:rgba(255,255,255,.1)}
.sw button{color:#ffffff}
.sw button.on{background:#ffffff;color:#000000}
.sd-me .n,.sd-me .r,.sd-foot,.sd-foot *{color:#ffffff}
.sd .av{background:#000000 !important;border-color:#ffffff}
.sd .av::before,.sd .av::after{background:#ffffff}

/* the session card sits on black, so it flips to paper */
.cc{background:#ffffff;color:#000000;border:1px solid #ffffff;box-shadow:none}
.cc *,.cc-lab,.cc-when,.cc-sub{color:#000000}
.cc-ic{background:#000000;color:#ffffff}
.cc-btn{background:#000000;color:#ffffff}
.cc-btn:hover{background:#000000;color:#ffffff}

/* prototype bar is black too */
#proto{background:#000000}
#proto b,#proto .pill{color:#ffffff}
#proto .pill{border-color:rgba(255,255,255,.35)}
#proto .pill.on{background:#ffffff;color:#000000;border-color:#ffffff}
#proto .reset{color:#ffffff;border-color:rgba(255,255,255,.35)}

/* the chapter surface: no browser chrome, no vendor mark, nothing to notice */
.ui .ch-stage{border:1px solid #d6d6d6;border-radius:14px;overflow:hidden;background:#ffffff}
.ui .ch-stage .bw-shot{display:block;width:100%;height:auto}
.ui .ch-stage .bw-missing{border:0}

/* the chapter's content items, in sequence - their model, not ours */
.ui .ci-strip{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap}
.ui .ci{display:flex;align-items:center;gap:8px;border:1px solid #d6d6d6;background:#ffffff;
  border-radius:99px;padding:6px 13px 6px 7px;font:inherit;font-size:12px;cursor:pointer;color:#000000}
.ui .ci:hover{border-color:#000000}
.ui .ci .n{width:19px;height:19px;flex:0 0 19px;border-radius:50%;border:1px solid #d6d6d6;
  display:grid;place-items:center;font-size:9.5px;font-weight:700}
.ui .ci.now{border-color:#000000;background:#000000;color:#ffffff}
.ui .ci.now .n{border-color:#ffffff}
.ui .ci.done .n{background:#000000;color:#ffffff;border-color:#000000}

/* the course report table inside a modal */
.ui .tbl-wrap{max-height:340px;overflow-y:auto;border:1px solid #d6d6d6;border-radius:12px}
.ui .tbl-wrap .tbl{width:100%;border-collapse:collapse;font-size:12px}
.ui .tbl-wrap .tbl th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;
  padding:9px 11px;border-bottom:1px solid #d6d6d6;background:#f7f7f7;position:sticky;top:0}
.ui .tbl-wrap .tbl td{padding:9px 11px;border-bottom:1px solid #d6d6d6}
.ui .tbl-wrap .tbl tr:last-child td{border-bottom:0}

/* chapter notes, the way their player carries them */
.ui .ch-note{border:1px solid #d6d6d6;border-radius:14px;padding:13px;margin-bottom:13px;background:#f7f7f7}
.ui .ch-note textarea{min-height:96px;background:#ffffff}

/* ============================================================
   LIVE SESSION — full screen, because it is the moment that
   decides the candidate's level
   ============================================================ */
.ses{position:fixed;inset:0;z-index:400;display:none;flex-direction:column;background:#ffffff;
  font:14px/1.55 'Lato',ui-sans-serif,-apple-system,sans-serif;color:#000000}
.ses.on{display:flex}
.ses .ses-bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:14px 22px;
  background:#000000;color:#ffffff}
.ses .ses-id{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.ses .ses-id b{font-size:15px;letter-spacing:-.02em}
.ses .ses-id .sub{color:rgba(255,255,255,.7);font-size:12px}
.ses .rec{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:700;
  letter-spacing:.1em;border:1px solid #ffffff;border-radius:99px;padding:4px 10px}
.ses .rec i{width:7px;height:7px;border-radius:50%;background:#ffffff;display:block;
  animation:sesRec 1.4s ease-in-out infinite}
@keyframes sesRec{0%,100%{opacity:1}50%{opacity:.25}}
.ses .ses-clock{font-size:15px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.ses .ses-body{flex:1;min-height:0;display:flex;gap:16px;padding:16px 22px}
.ses .ses-stage{flex:1;min-width:0;position:relative;border:1px solid #000000;border-radius:16px;
  background:#f7f7f7;overflow:hidden}
.ses .ses-tile{position:absolute;overflow:hidden}
.ses .ses-tile.main{inset:0}
.ses .ses-tile.self{width:210px;height:130px;right:16px;bottom:16px;border-radius:12px;
  border:1px solid #000000;background:#ffffff}
.ses .ses-tile .wf-img{position:absolute;inset:0;display:block;background:#ffffff}
.ses .ses-tile.main .wf-img{background:#f7f7f7}
.ses .ses-tile .nm{position:absolute;left:12px;bottom:10px;z-index:2;font-size:12px;font-weight:700;
  background:#ffffff;border:1px solid #000000;border-radius:99px;padding:3px 11px}
.ses .ses-cap{position:absolute;left:0;right:0;top:16px;text-align:center;font-size:13px;z-index:2}
.ses .ses-cap::before{content:'';display:inline-block}
.ses .ses-side{flex:0 0 320px;width:320px;overflow-y:auto}
.ses .ses-panel{border:1px solid #d6d6d6;border-radius:16px;padding:15px;background:#ffffff}
.ses .ses-panel.mt{margin-top:12px}
.ses .ses-foot{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:13px 22px;
  border-top:1px solid #d6d6d6;background:#f7f7f7}
.ses .ses-ctl{display:flex;align-items:center;gap:8px;border:1px solid #000000;background:#ffffff;
  border-radius:99px;padding:9px 15px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:#000000}
.ses .ses-ctl:hover{background:#000000;color:#ffffff}
.ses .ses-ctl svg{display:block;width:15px;height:15px}
.ses .ses-leave{height:42px;padding:0 22px;border-radius:99px;font-size:13.5px}
.ses .ses-leave:disabled{opacity:.45;cursor:not-allowed}
.ses .l-eyebrow{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;margin:0 0 10px}
.ses .clm{border:1px solid #d6d6d6;border-radius:12px;overflow:hidden}
.ses .clm>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;
  font-size:12px;border-bottom:1px solid #d6d6d6}
.ses .clm>div:last-child{border-bottom:0}
.ses .clm b{font-weight:700;text-align:right;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.ses .prov{font-style:normal;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  border:1px dashed #000000;border-radius:99px;padding:2px 7px;white-space:nowrap;background:#f7f7f7}
.ses .sub{color:#000000;font-size:12px;line-height:1.6}
@media(max-width:900px){.ses .ses-body{flex-direction:column}.ses .ses-side{flex:0 0 auto;width:auto}}

/* ============================================================
   MESSAGES — a real thread
   ============================================================ */
.ui .ag-strip{display:flex;align-items:center;gap:14px;border:1px solid #d6d6d6;border-radius:16px;
  padding:14px 17px;background:#ffffff;margin-bottom:15px}
.ui .ag-strip .av{width:44px;height:44px;flex:0 0 44px;border-radius:50%;font-size:15px}
.ui .ag-strip .n{font-size:15px;font-weight:700;letter-spacing:-.02em}
.ui .ag-strip .r{font-size:12px;margin-top:2px}
.ui .ag-strip .sep{width:1px;align-self:stretch;background:#d6d6d6}
.ui .ag-strip .kv2{font-size:12px}
.ui .ag-strip .kv2 b{display:block;font-size:12.5px}
.ui .ag-strip .kv2 span{color:#000000;opacity:.65}
.ui .thread{display:flex;flex-direction:column;gap:14px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.ui .mrow{display:flex;align-items:flex-end;gap:10px;max-width:78%}
.ui .mrow.me{align-self:flex-end;flex-direction:row-reverse}
.ui .mrow .av{width:30px;height:30px;flex:0 0 30px;border-radius:50%;font-size:11px}
.ui .mrow .bub{max-width:100%}
.ui .bub.them{border-bottom-left-radius:4px}
.ui .bub.me{border-bottom-right-radius:4px}
.ui .mday{align-self:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  border:1px solid #d6d6d6;border-radius:99px;padding:3px 11px;background:#f7f7f7}

/* ============================================================

   Every surface arrives rather than appears. Short, one easing
   curve throughout, and all of it off under reduced-motion.

@keyframes vIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.ui main.vin>*{animation:vIn .34s cubic-bezier(.2,.7,.2,1) both}

.ui main.vin>*:nth-child(3){animation-delay:.1s}

.ui main.vin .li:nth-child(2){animation-delay:.04s}
.ui main.vin .li:nth-child(3){animation-delay:.08s}
.ui main.vin .li:nth-child(4){animation-delay:.12s}
.ui main.vin .li:nth-child(n+5){animation-delay:.15s}
.ui main.vin .ag-card,.ui main.vin .qs-card,.ui main.vin .stat{animation:vPop .38s cubic-bezier(.2,.7,.2,1) both}
.ui main.vin .ag-card:nth-child(2),.ui main.vin .qs-card:nth-child(2),.ui main.vin .stat:nth-child(2){animation-delay:.05s}
.ui main.vin .ag-card:nth-child(3),.ui main.vin .qs-card:nth-child(3),.ui main.vin .stat:nth-child(3){animation-delay:.1s}
.ui main.vin .ag-card:nth-child(4),.ui main.vin .qs-card:nth-child(4),.ui main.vin .stat:nth-child(4){animation-delay:.14s}
.ui main.vin .ag-card:nth-child(n+5),.ui main.vin .qs-card:nth-child(n+5){animation-delay:.18s}

/* controls answer to the touch */
.ui .btn,.ui .ci,.ui .bk-day,.ui .bk-time,.ui .bk-row,.ui .tag,.rail-top .bell,.rail-top .who,
.sd-mods button,.sw button,#proto .pill{transition:background .18s ease,color .18s ease,
  border-color .18s ease,box-shadow .18s ease,transform .12s ease,opacity .18s ease}

.rail-top .bell:active,.rail-top .who:active,#proto .pill:active{transform:translateY(1px)}

.ui .bk-b{animation:vFade .26s ease both}
.ses.on{animation:vFade .26s ease both}
.ses.on .ses-body{animation:vIn .38s cubic-bezier(.2,.7,.2,1) both}
#drw{transition:transform .28s cubic-bezier(.2,.7,.2,1),opacity .22s ease}

/* the thread and the assistant */
.ui .mrow{animation:vIn .3s cubic-bezier(.2,.7,.2,1) both}
.ai-row{animation:vIn .3s cubic-bezier(.2,.7,.2,1) both}

/* nav feedback */

@media(prefers-reduced-motion:reduce){

.ui main.vin .scene:nth-child(4){animation-delay:.15s}

/* pinned bottom right, and it stays put while the numbers change */
.ses .ses-foot{gap:10px;flex-wrap:nowrap}
.ses .ses-leave{margin-left:auto;flex:0 0 auto;height:44px;padding:0 24px;border-radius:99px;
  font-size:13.5px;white-space:nowrap}
.ses .ses-prog{flex:0 0 auto;min-width:118px;text-align:right;white-space:nowrap;font-size:12.5px}
/* capsules read on one line, all of them */
.ses .ses-ctl{white-space:nowrap;flex:0 0 auto}
.ses .ses-ctl span{white-space:nowrap}
@media(max-width:760px){.ses .ses-foot{flex-wrap:wrap}.ses .ses-prog{display:none}}

/* Messages is the one screen that must not grow with its content: the card is a
   fixed height and the thread scrolls inside it, newest message against the
   composer, and that is where it opens. The generic never-shrink rule for the
   last block would otherwise let the page grow instead. */
.ui main>.msg-page{flex:1 1 auto;min-height:0;height:auto}
.ui .msg-card{flex:1 1 auto;min-height:0}
.ui .msg-card>.thread{flex:1 1 auto;min-height:0;overflow-y:auto}

/* nothing in the session footer changes width, so nothing moves */
.ses .ses-foot{gap:10px;flex-wrap:nowrap;overflow:hidden}
.ses .ses-leave{margin-left:auto;flex:0 0 auto}

/* the player: controls read as a transport bar across the full width */
.ses .ses-x{width:36px;height:36px;flex:0 0 36px;border-radius:50%;border:1px solid #ffffff;
  background:transparent;color:#ffffff;display:grid;place-items:center;cursor:pointer}
.ses .ses-x:hover{background:#ffffff;color:#000000}
.ses .ses-x svg{display:block}
.ses .ses-stage.player{position:relative;display:block}
.ses .ses-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:82px;height:82px;border-radius:50%;border:1px solid #000000;background:#ffffff;color:#000000;
  display:grid;place-items:center;cursor:pointer;padding:0}
.ses .ses-play:hover{background:#000000;color:#ffffff}
.ses .ses-play svg{display:block;margin-left:3px}
.ses.ses-player .ses-foot{gap:12px}
.ses .ses-tc{width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:1px solid #000000;
  background:#ffffff;color:#000000;display:grid;place-items:center;cursor:pointer;padding:0}
.ses .ses-tc:hover{background:#000000;color:#ffffff}
.ses .ses-tc svg{display:block}
.ses .ses-t{flex:0 0 auto;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;
  min-width:46px;text-align:center}
.ses .ses-scrub{flex:1 1 auto;max-width:none;height:6px;border-radius:99px;background:#d6d6d6;overflow:hidden}

/* the content types a chapter is built from */
.ui .items{display:flex;flex-wrap:wrap;gap:5px}
.ui .item{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  border:1px solid #d6d6d6;border-radius:99px;padding:3px 8px;white-space:nowrap}
.ui .item.on{border-color:#000000;background:#000000;color:#ffffff}

/* .f1 is scoped to .ui, so the overlay needs its own spacer — this is why the
   close icon sat next to the title instead of at the far right */
.ses .f1{flex:1 1 auto;min-width:0}
.ses .ses-x{margin-left:auto}
.ses .ses-bar{align-items:center}

/* transcript inside the right-hand panel */
.ui .tr-doc{border:1px solid #d6d6d6;border-radius:14px;padding:14px;background:#ffffff}
.ui .tr-l{margin:0 0 14px;font-size:13px;line-height:1.7}
.ui .tr-l:last-child{margin-bottom:0}
.ui .tr-l b{display:block;font-size:11.5px;margin-bottom:2px}
.ui .tr-l b em{font-style:normal;font-weight:400;opacity:.6;margin-left:6px}

/* every dialog sits in the middle of the window, in both portals */
#mk,.ui #mk{align-items:center;padding:28px 18px}
#mk .mbox,.ui #mk .mbox{margin:auto;max-height:calc(100vh - 56px);display:flex;flex-direction:column}
#mk .mbox>.mb,.ui #mk .mbox>.mb{overflow-y:auto;min-height:0}

.ui td.items-t{font-size:12px;line-height:1.5}

/* what to do next, with the chapter's own frame to fill the column */
.ui .next-up{display:flex;gap:15px;flex-wrap:wrap}
.ui .nu-thumb{position:relative;flex:0 0 260px;width:260px;border:1px solid #000000;border-radius:14px;
  overflow:hidden;background:#ffffff;align-self:flex-start}
.ui .nu-thumb img{display:block;width:100%;height:auto}
.ui .nu-thumb .wf-img{display:block;width:100%;aspect-ratio:16/9}
.ui .nu-dur{position:absolute;right:8px;bottom:8px;z-index:2;font-size:9.5px;font-weight:700;
  background:#000000;color:#ffffff;border-radius:99px;padding:3px 8px}
.ui .nu-body{flex:1;min-width:190px}
.ui .nu-t{font-size:16px;font-weight:700;letter-spacing:-.02em}
.ui .nu-m{font-size:12px;margin-top:4px;opacity:.75}
@media(max-width:940px){.ui .nu-thumb{flex:1 1 100%;width:auto}}

/* panel titles start at the left edge */
.ui .bk-h h2{text-align:left}
.ui .bk-h{gap:12px}

/* See what's next in this course: the video takes the width and whatever height is left once the
   title and the buttons have their space, so the page needs no scroll here */
.ui .nu-card{display:flex;flex-direction:column}
.ui .next-up{display:flex;flex-direction:column;gap:14px;flex:1 1 auto;min-height:0}
.ui .nu-thumb{position:relative;flex:1 1 auto;width:auto;min-height:200px;overflow:hidden}
.ui .nu-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ui .nu-thumb .wf-img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
.ui .nu-body{flex:0 0 auto;min-width:0}
@media(max-width:940px){.ui .nu-thumb{min-height:170px}}

/* the preview is a plain 16:9 block the full width of the card — no flex or absolute
   positioning to collapse it */
.ui .next-up{display:block}
.ui .nu-thumb{display:block;position:relative;width:100% !important;flex:none !important;
  aspect-ratio:16/9;min-height:0;height:auto;overflow:hidden;border:1px solid #000000;
  border-radius:14px;background:#ffffff;margin-bottom:14px}
.ui .nu-thumb img{position:static;display:block;width:100%;height:100%;object-fit:cover}
.ui .nu-thumb .wf-img{position:absolute;inset:0;width:100%;height:100%}
.ui .nu-body{display:block}

/* the note editor: close at the top right, save inside the field */
.ui .note-x{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:1px solid #d6d6d6;
  background:#ffffff;color:#000000;display:grid;place-items:center;cursor:pointer;padding:0}
.ui .note-x:hover{border-color:#000000;background:#000000;color:#ffffff}
.ui .note-x svg{display:block}
.ui .note-field{position:relative}
.ui .note-field textarea{min-height:120px;padding-bottom:46px;background:#ffffff}
.ui .note-save{position:absolute;right:10px;bottom:10px}

/* the preview is cropped below the vendor banner, so it needs less height */
.ui .nu-thumb{aspect-ratio:2.06/1}

/* a trailing note should hug its text, not stretch to the bottom */
.ui main>*:last-child.note,.ui main>*:last-child.hug{flex:0 0 auto}
.ui .pay-with{display:inline-flex;align-items:center;gap:8px;font-size:12px}
.ui .pay-with .bm{width:34px;height:23px;flex:0 0 34px}

/* account: a picture beside the fields, real switches, and a delete row at the foot */
.ui .acct{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.ui .acct-pic{flex:0 0 132px;width:132px;display:flex;flex-direction:column;align-items:center;gap:9px}
.ui .pic-frame{width:112px;height:112px;border:1px solid #000000;border-radius:50%;overflow:hidden;
  position:relative;background:#ffffff}
.ui .pic-frame .wf-img{position:absolute;inset:0;display:block}
.ui .tgl{width:44px;height:25px;flex:0 0 44px;border-radius:99px;border:1px solid #000000;background:#ffffff;
  position:relative;cursor:pointer;padding:0;transition:background .18s ease}
.ui .tgl i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#000000;
  transition:transform .18s cubic-bezier(.2,.7,.2,1),background .18s ease;display:block}
.ui .tgl.on{background:#000000}
.ui .tgl.on i{transform:translateX(19px);background:#ffffff}
.ui .del-row{border-color:#000000}
.ui .btn.dg{border-color:#000000}
@media(prefers-reduced-motion:reduce){.ui .tgl,.ui .tgl i{transition:none}}

/* ---------- Tal (candidate assistant) surfaces ---------- */
.ui .tal-read{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;background:#ffffff;border:1px solid var(--ln);border-left:3px solid #000000;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.ui .tal-av{flex:0 0 30px;width:30px;height:30px;border-radius:8px;background:#000000;color:#ffffff;display:flex;align-items:center;justify-content:center}
.ui .tal-av.sm{width:22px;height:22px;flex:0 0 22px;border-radius:6px;margin-right:7px}
.ui .tal-read .tal-k{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:#000000;margin-bottom:3px}
.ui .tal-read .tal-t{font-size:14.5px;line-height:1.5;font-weight:650}
.ui .tal-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;flex-basis:100%}
/* dashboard card: keep the action chips on the same row, pushed to the right */
.ui .tal-read.has-x{align-items:center}
.ui .tal-read.has-x .tal-chips{flex-basis:auto;flex-wrap:nowrap;margin:0 0 0 auto;align-self:center}
@media(max-width:640px){.ui .tal-read.has-x .tal-chips{flex-basis:100%;margin:12px 0 0;flex-wrap:wrap}}
.ui .tal-chip{border:1px solid #000000;background:#ffffff;color:#000000;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:650;cursor:pointer;font-family:inherit;line-height:1.2}
.ui .tal-chip:hover{background:#f3f3f3}
.ui .tal-chip.p{background:#000000;color:#ffffff}
.ui .tal-chip.p:hover{background:#1c1c1c}
.ui .ag-rec{border:1px solid var(--ln);border-radius:14px;padding:16px;background:#ffffff}
.ui .ag-rec>.tal-k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:#000000;display:flex;align-items:center}
.ui .ag-rec-grid{display:grid;grid-template-columns:minmax(0,250px) 1fr;gap:18px;align-items:center}
.ui .ag-rec-why .ag-rec-h{font-size:15px;font-weight:750;margin-bottom:5px}
.ui .ag-rec-why p{font-size:13px;line-height:1.55;margin:0 0 9px}
.ui .ag-more{margin-top:15px}
.ui .ag-more>summary{list-style:none;display:inline-flex;cursor:pointer;width:auto}
.ui .ag-more>summary::-webkit-details-marker{display:none}
.ui .ag-more>summary::marker{content:""}
@media(max-width:760px){.ui .ag-rec-grid{grid-template-columns:1fr}}

/* ---------- Tal intro banner (first message of a chat) ---------- */
.tal-intro{border:1px solid #d6d6d6;border-left:3px solid #000000;border-radius:12px;padding:13px 15px;background:#ffffff}
.tal-intro-h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:750;margin-bottom:7px}
.tal-intro-av{width:24px;height:24px;flex:0 0 24px;border-radius:7px;background:#000000;color:#ffffff;display:inline-flex;align-items:center;justify-content:center}
.tal-intro p{margin:0 0 7px;font-size:12.5px;line-height:1.55;color:#000000}
.tal-intro p:last-child{margin-bottom:0}

/* ---------- Tal icon affordance on agent cards (hover expands left) ---------- */
.ui .tal-icon{display:inline-flex;align-items:center;justify-content:flex-end;height:30px;width:30px;padding:0;border:1px solid #000000;border-radius:999px;background:#ffffff;color:#000000;cursor:pointer;overflow:hidden;font:inherit;vertical-align:middle;transition:width .18s ease,padding .18s ease}
.ui .tal-icon .tal-icon-mk{flex:0 0 28px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center}
.ui .tal-icon .tal-icon-lbl{max-width:0;opacity:0;white-space:nowrap;overflow:hidden;font-size:12.5px;font-weight:650;line-height:1;transition:max-width .18s ease,opacity .16s ease,margin .18s ease}
.ui .tal-icon:hover,.ui .tal-icon:focus-visible{width:auto;padding-left:12px;outline:none}
.ui .tal-icon:hover .tal-icon-lbl,.ui .tal-icon:focus-visible .tal-icon-lbl{max-width:80px;opacity:1;margin-right:3px}

/* ---------- Tal read: spacing above + dismiss control ---------- */
.ui .tal-read{position:relative;margin-top:18px}
.ui .tal-read.has-x{padding-right:44px}
.ui .tal-x{position:absolute;top:11px;right:11px;width:26px;height:26px;border:1px solid #d6d6d6;border-radius:7px;background:#ffffff;color:#000000;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ui .tal-x:hover{border-color:#000000}

/* ---------- Tal intro banner: full-width, black, smaller ---------- */
.ai-banner{width:100%;margin:2px 0 12px}
.tal-intro{border:0;border-radius:14px;padding:13px 15px;background:#000000;color:#ffffff}
.tal-intro-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750;margin-bottom:6px;color:#ffffff}
.tal-intro-av{width:22px;height:22px;flex:0 0 22px;border-radius:6px;background:#ffffff;color:#000000;display:inline-flex;align-items:center;justify-content:center}
.tal-intro p{margin:0 0 6px;font-size:11.5px;line-height:1.5;color:#ffffff}
.tal-intro p:last-child{margin-bottom:0}

/* ---------- greyed wave emoji keeps the wireframe look ---------- */
.tal-wave{filter:grayscale(1) brightness(.4);opacity:.85;font-size:.85em;margin-left:5px;vertical-align:baseline}

/* Tal recommends: borderless like every other card */
.ui .ag-rec{border:0}

/* How-this-works: keep icon inline with heading; Ask Tal floats top-right */
.ui .card.tip.tip-ask{position:relative}
.ui .card.tip.tip-ask>.tal-icon{position:absolute;top:16px;right:16px}
/* hide the grey scrollbars across the whole portal (scroll still works) */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}

/* widget: spaced footer actions + no clipped long values */
.aw-acts{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.aw-r b{min-width:0;overflow-wrap:anywhere}

/* quiz-result: Leadership profile 40% / How you scored 60% */
.ui .qr-split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:15px;align-items:stretch}
@media(max-width:940px){.ui .qr-split{grid-template-columns:1fr}}

/* reschedule: reason step options */
.ui .bk-reasons{display:flex;flex-direction:column;gap:9px}
.ui .bk-reason{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#ffffff;border:1px solid #d6d6d6;border-radius:12px;padding:13px 14px;font:inherit;font-size:13px;font-weight:600;color:#000000;cursor:pointer}
.ui .bk-reason:hover{border-color:#000000}
.ui .bk-reason.on{border-color:#000000;box-shadow:inset 0 0 0 1px #000000}
.ui .bk-reason .rc{width:20px;height:20px;flex:0 0 20px;border:1px solid #d6d6d6;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.ui .bk-reason.on .rc{background:#000000;border-color:#000000;color:#ffffff}

/* notifications dropdown (anchored to the bell) */
.nt-wrap{position:relative}
.nt-drop{position:absolute;top:calc(100% + 8px);right:0;width:320px;max-height:62vh;overflow-y:auto;background:#ffffff;border:1px solid #d6d6d6;border-radius:16px;box-shadow:0 16px 40px -14px rgba(0,0,0,.28);z-index:140;display:none}
.nt-drop.on{display:block}
.nt-h{display:flex;align-items:center;gap:10px;padding:13px 16px 8px}

.nt-list{padding:0 16px 12px}
.nt-empty{text-align:center;padding:26px 12px;color:#868c9b}
.nt-empty .e{font-size:22px;opacity:.5;margin-bottom:6px}

/* chapter: content items in a column on the left, stage on the right */
.ui .ch-split{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start;margin-bottom:4px}
.ui .ch-split .ci-strip{flex-direction:column;gap:8px;margin-bottom:0}
.ui .ch-split .ci{width:100%;justify-content:flex-start}
@media(max-width:820px){.ui .ch-split{grid-template-columns:1fr}.ui .ch-split .ci-strip{flex-direction:row;flex-wrap:wrap}}
/* cohort call: spotlight speaker + members filmstrip on top */
.ses .ses-stage.spot{border:0;border-radius:0;background:transparent;display:flex;flex-direction:column;gap:12px}
.ses .ses-strip{display:flex;gap:10px;flex:0 0 auto;overflow:hidden;height:118px}
.ses .ses-mtile{position:relative;flex:0 0 168px;width:168px;height:118px;border:1px solid #000000;border-radius:12px;overflow:hidden;background:#ffffff}
.ses .ses-mtile.me{border-width:2px}
.ses .ses-mtile .wf-img{position:absolute;inset:0;display:block}
.ses .ses-mtile .nm{position:absolute;left:8px;bottom:8px;background:#ffffff;border:1px solid #000000;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:700;z-index:2;white-space:nowrap;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis}
.ses .ses-mtile.more{flex:0 0 118px;width:118px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:750;background:#ffffff}
.ses .ses-main{flex:1 1 auto;position:relative;border:1px solid #000000;border-radius:16px;overflow:hidden;min-height:0;background:#f7f7f7}
.ses .ses-main .wf-img{position:absolute;inset:0;display:block;background:#f7f7f7}
.ses .ses-main .nm{position:absolute;left:14px;bottom:12px;background:#ffffff;border:1px solid #000000;border-radius:99px;padding:5px 13px;font-size:13px;font-weight:700;z-index:2}

/* shorter stat tiles: smaller values, tighter padding */
.ui .stat{padding:11px 13px}
.ui .stat .v{font-size:20px;margin-top:4px}
.ui .stat .v s{font-size:11px}
.ui .stat .f{margin-top:4px}

/* cohort call countdown pill */
.ui .cs-count{display:inline-block;margin-top:7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1px solid #000000;border-radius:99px;padding:4px 11px}

/* countdown pinned to the top-right of the call block */
.ui .call-strip{position:relative}

/* notification dropdown polish */
.nt-h{border-bottom:1px solid #d6d6d6}
.nt-h h3{display:flex;align-items:center}
.nt-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#000000;color:#ffffff;font-size:11px;font-weight:800;margin-left:8px;line-height:1}
.nt-readall{border:0;background:none;padding:0;font:inherit;font-size:12px;font-weight:800;color:#000000;cursor:pointer;white-space:nowrap}
.nt-readall:hover{text-decoration:underline;text-underline-offset:3px}
.nf{align-items:flex-start}
.nf-ic{flex:0 0 32px;width:32px;height:32px;border:1px solid #d6d6d6;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#000000}
.nf-b{flex:1;min-width:0}
.nf-dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#000000;margin-top:7px}
.nf.rd .nf-ic{color:#9aa0ad;border-color:#ececec}
.nf.rd .t{color:#868c9b}

.nt-drop .nf .t{font-size:12.5px;line-height:1.45}
.nt-drop .nf .w{font-size:10.5px;color:#9aa0ad;margin-top:4px;font-weight:500}

/* notification dropdown: wider, roomier, single-row items (icon · text · time) */
.nt-drop{width:420px}
.nt-h{padding:16px 18px 14px}
.nt-list{padding:6px 18px 16px}

.nt-drop .nf .nf-t{flex:1;min-width:0}
.nt-drop .nf .nf-h{font-size:13px;font-weight:700;color:#000000;line-height:1.35}
.nt-drop .nf .nf-d{font-size:12px;line-height:1.45;color:#5b6270;margin-top:2px}
.nt-drop .nf.rd .nf-h{color:#868c9b}

.nt-drop .nf{align-items:flex-start}
.nt-drop .nf .nf-w{margin-top:1px}

/* ---------- onboarding ---------- */
.ui .ob-wrap{max-width:640px;margin:0 auto}

.ui .ob-steps{border-bottom:0;padding:14px 6px 8px}

.ui .ob-result{text-align:center}
