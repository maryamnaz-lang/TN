/* page title block — uses the portals' own .cr-c (24px) + .page-desc */
.ad-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ad-head .cr-c{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.ad-head .page-desc{margin-top:6px;max-width:660px}
.ad-head .act{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;flex:0 0 auto;align-items:center;padding-top:2px}

/* KPI tiles — the portals' .stat tile on an auto-fit grid */
.ad-stats{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}

/* ---- table toolbar + wrapper ---- */
.ad-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ad-toolbar.ad-toolbar-top{margin-top:26px}
.ad-tabs{display:flex;gap:4px;background:#f7f7f7;border:1px solid #d6d6d6;border-radius:12px;padding:3px}
.ad-tabs button{background:none;border:0;padding:6px 13px;border-radius:9px;font-size:12.5px;color:#000000;font-family:inherit}
.ad-tabs button.on{background:#000000;color:#ffffff;font-weight:700}
.ad-filter{display:flex;align-items:center;gap:7px;border:1px solid #d6d6d6;border-radius:11px;padding:6px 11px;font-size:12.5px}
.ad-filter select{border:0;outline:0;font:inherit;font-size:12.5px;background:none}
.ad-tblcard{border:0;border-radius:24px;background:#ffffff;overflow:hidden}
.ad-tblcard .tw{overflow-x:auto}
.ad-tblcard table.tb{min-width:640px}
.ad-tblcard table.tb th{padding:13px 18px 10px}
.ad-tblcard table.tb td{padding:12px 18px}
.ad-tblcard table.tb tbody tr{cursor:default}
.ad-tblcard table.tb tbody tr.clk{cursor:pointer}
.ad-tblcard table.tb tbody tr.clk:hover{background:#f7f7f7}
.ad-tfoot{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid #ececec;font-size:11.5px;opacity:.62}

/* avatar cell */
.ad-u{display:flex;align-items:center;gap:10px}
.ad-u .a{width:30px;height:30px;border-radius:50%;background:#000000;color:#ffffff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 30px;overflow:hidden}
.ad-u .a img{width:100%;height:100%;object-fit:cover}
.ad-u .n{font-weight:700;font-size:12.5px}
.ad-u .e{font-size:11px;opacity:.55}

/* role chips */
.ad-roles{display:flex;gap:5px;flex-wrap:wrap}
.rc{display:inline-flex;align-items:center;gap:5px;border:1px solid #d6d6d6;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;background:#ffffff}
.rc.prime{background:#000000;color:#ffffff;border-color:#000000}
.rc .x{cursor:pointer;opacity:.55;font-weight:700}
.rc .x:hover{opacity:1}

/* status dot */
.sdot{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap}
.sdot b{width:7px;height:7px;border-radius:50%;display:inline-block;background:#000000}
.sdot.off b{background:#ffffff;border:1px solid #999}
.sdot.ring b{background:#ffffff;box-shadow:0 0 0 2px #000 inset}

/* two-column layout */
.ad-2col{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
@media(max-width:980px){.ad-2col{grid-template-columns:1fr}}
.ad-3col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.tpl-grid{align-items:start}
@media(max-width:900px){.ad-3col{grid-template-columns:1fr}}

/* decision / flag card */
.ad-flag{border:0;border-radius:18px;padding:16px 18px;background:#ffffff;display:flex;gap:13px}
.ad-flag+.ad-flag{margin-top:12px}
.ad-flag .ic{width:34px;height:34px;border-radius:10px;border:1px dashed #999;display:grid;place-items:center;flex:0 0 34px;background:#f7f7f7}
.ad-flag .ic svg{width:17px;height:17px}
.ad-flag .t{font-size:13px;font-weight:700}
.ad-flag .d{font-size:12px;opacity:.66;margin-top:3px;line-height:1.5}
.ad-flag .meta{font-size:11px;opacity:.5;margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}
.ad-flag .go{margin-left:auto;align-self:center;flex:0 0 auto}

/* permission matrix */
.ad-matrix{width:100%;border-collapse:collapse;font-size:12px}
.ad-matrix th,.ad-matrix td{border:1px solid #d6d6d6;padding:9px 11px;text-align:center}
.ad-matrix th:first-child,.ad-matrix td:first-child{text-align:left;font-weight:700;background:#f7f7f7;position:sticky;left:0}
.ad-matrix thead th{background:#000000;color:#ffffff;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.ad-matrix .yes{font-weight:700}
.ad-matrix .no{opacity:.28}
.ad-matrix-wrap{overflow:auto;border:1px solid var(--ln);border-radius:16px;background:#ffffff}
/* application vetting stepper */
.ad-steps{display:flex;align-items:center;gap:0;flex-wrap:wrap;background:#ffffff;border:1px solid var(--ln);border-radius:16px;padding:16px 18px}
.ad-stp{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.ad-stp .d{width:27px;height:27px;border-radius:50%;border:1.5px solid var(--ln2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut);background:#ffffff;flex:0 0 27px}
.ad-stp .d svg{width:14px;height:14px}
.ad-stp .l{font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.ad-stp.done .d,.ad-stp.now .d{background:#000000;border-color:#000000;color:#ffffff}
.ad-stp.done .l,.ad-stp.now .l{color:#000000}
.ad-stp-line{flex:1 1 22px;min-width:22px;height:2px;background:var(--ln2);margin:0 12px}
.ad-stp-line.done{background:#000000}
.ad-sched-form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ad-sched-form>div{flex:1 1 150px;min-width:140px}
.ad-callcard{display:flex;align-items:center;gap:14px;border:1px solid var(--ln);border-radius:14px;padding:14px 16px;background:var(--fa)}
.ad-callcard .ic{width:40px;height:40px;border-radius:12px;background:#000000;color:#ffffff;display:grid;place-items:center;flex:0 0 40px}
.ad-callcard .ic svg{width:19px;height:19px}
/* AI evaluation of the vetting call */
.ad-aiev{display:flex;gap:13px;align-items:flex-start}
.ad-aiev .ic{width:34px;height:34px;border-radius:10px;background:#000000;color:#ffffff;display:grid;place-items:center;flex:0 0 34px}
.ad-aiev .ic svg{width:17px;height:17px}
.ad-evsig{margin-top:14px;border-top:1px solid var(--ln);padding-top:12px;display:grid;gap:9px}
.ad-evrow{display:flex;align-items:center;gap:10px;font-size:12.5px}
.ad-evrow .d{width:8px;height:8px;border-radius:50%;background:#000000;flex:0 0 8px}
.ad-evrow .d.warn{background:#c9c9c9}
.ad-evrow b{font-weight:700}
/* call transcript */
.ad-transcript{display:flex;flex-direction:column;gap:12px;max-height:300px;overflow-y:auto;padding:2px 2px 2px 0}
.ad-tr .who{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;margin-bottom:3px}
.ad-tr .txt{font-size:12.5px;line-height:1.55;background:#000000;color:#ffffff;border-radius:12px;border-bottom-right-radius:4px;padding:9px 12px;display:inline-block;max-width:82%}
.ad-tr.them .txt{background:var(--fa);color:#000000;border:1px solid var(--ln);border-bottom-right-radius:12px;border-bottom-left-radius:4px}
.ad-tr.them{align-items:flex-start}
.ad-doc-ic{width:32px;height:32px;border-radius:9px;border:1px solid var(--ln2);background:#ffffff;color:#000000;display:grid;place-items:center;flex:0 0 32px}
.ad-doc-ic svg{width:16px;height:16px}
.ad-ov-badge{display:inline-flex;align-items:center;gap:7px;background:#000000;color:#ffffff;border-radius:99px;padding:5px 13px;font-size:11.5px;font-weight:700;letter-spacing:.01em}
.ad-ov-badge svg{width:14px;height:14px}
/* vetting call: recording+eval column beside a full-height transcript */
.ad-callgrid{display:grid;grid-template-columns:1fr 384px;gap:15px;align-items:stretch}
@media(max-width:1080px){.ad-callgrid{grid-template-columns:1fr}}
.ad-callcol{display:flex;flex-direction:column;gap:15px;min-width:0}
.ad-callcol>.card{margin:0}
/* centre the play/video icon in the recording thumbnail */
.ad-app .vid{display:grid;place-items:center}
.ad-app .vid .play{margin:0}
.ad-app .vid .play svg{display:block;margin:0 auto}

/* org hierarchy tree */
.ad-tree{list-style:none;margin:0;padding:0}
.ad-tree ul{list-style:none;margin:0;padding:0 0 0 26px;position:relative}
.ad-tree ul::before{content:"";position:absolute;left:9px;top:0;bottom:14px;width:1px;background:#d6d6d6}
.ad-tree li{position:relative;padding:5px 0}
.ad-tree ul li::before{content:"";position:absolute;left:-17px;top:22px;width:16px;height:1px;background:#d6d6d6}
.ad-node{display:inline-flex;align-items:center;gap:10px;border:1px solid #d6d6d6;border-radius:12px;padding:8px 13px;background:#ffffff}
.ad-node.root{background:#000000;color:#ffffff;border-color:#000000}
.ad-node .ni{width:26px;height:26px;border-radius:8px;background:#f7f7f7;display:grid;place-items:center;flex:0 0 26px}
.ad-node.root .ni{background:rgba(255,255,255,.16)}
.ad-node .ni svg{width:15px;height:15px}
.ad-node .nn{font-size:12.5px;font-weight:700}
.ad-node .nm{font-size:10.5px;opacity:.6}

/* money flow band */
.ad-flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:6px}
.ad-flowcol{flex:1;min-width:150px;display:flex;flex-direction:column;gap:9px}
.ad-flowcol>.h{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.5;text-align:center;padding-bottom:4px}
.ad-money{border:1px solid #d6d6d6;border-radius:12px;padding:10px 11px;background:#ffffff;font-size:11.5px}
.ad-money.pool{background:#000000;color:#ffffff;border-color:#000000}
.ad-money .mt{font-weight:700;font-size:12px}
.ad-money .mv{font-variant-numeric:tabular-nums;margin-top:3px;opacity:.7}
.ad-arrow{align-self:center;flex:0 0 26px;display:grid;place-items:center;opacity:.4}

/* stepper for the add-user wizard (reuse .step semantics inside modal) */
.ad-wiz-steps{display:flex;gap:8px;margin-bottom:18px}
.ad-wiz-steps .s{flex:1;text-align:center;font-size:11px;font-weight:700;color:#000000;opacity:.4;position:relative;padding-top:14px}
.ad-wiz-steps .s::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:99px;background:#d6d6d6}
.ad-wiz-steps .s.done{opacity:.7}.ad-wiz-steps .s.done::before{background:#000000}
.ad-wiz-steps .s.now{opacity:1}.ad-wiz-steps .s.now::before{background:#000000}

/* role picker */
.ad-rolepick{display:flex;flex-direction:column;gap:9px}
.ad-ropt{display:flex;gap:12px;align-items:flex-start;border:1px solid #d6d6d6;border-radius:13px;padding:12px 14px;background:#ffffff;text-align:left;width:100%;font-family:inherit}
.ad-ropt:hover{background:#f7f7f7}
.ad-ropt.on{border-color:#000000;background:#f7f7f7}
.ad-ropt .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid #d6d6d6;flex:0 0 20px;display:grid;place-items:center;margin-top:1px}
.ad-ropt.on .ck{background:#000000;border-color:#000000;color:#ffffff}
.ad-ropt .ck svg{width:12px;height:12px;opacity:0}
.ad-ropt.on .ck svg{opacity:1}
.ad-ropt .rt{font-size:13px;font-weight:700}
.ad-ropt .rd{font-size:11.5px;opacity:.62;margin-top:2px;line-height:1.45}
.ad-ropt.radio .rio{width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:1.6px solid #c9c9c9;background:#ffffff;margin-top:1px;display:grid;place-items:center;transition:.12s}
.ad-ropt.radio:hover .rio{border-color:#000000}
.ad-ropt.radio.on .rio{border-color:#000000}
.ad-ropt.radio.on .rio:after{content:"";width:10px;height:10px;border-radius:50%;background:#000000}

/* detail drawer */
.ad-drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,86%);background:#ffffff;border-left:1px solid #d6d6d6;box-shadow:-18px 0 50px -24px rgba(0,0,0,.35);transform:translateX(105%);transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:310;display:flex;flex-direction:column}
.ad-drawer.mid{width:min(600px,94%)}
.ad-drawer.on{transform:translateX(0)}
.ad-dh{padding:16px 20px;border-bottom:1px solid #d6d6d6;display:flex;align-items:center;gap:12px}
.ad-dh .x{margin-left:auto;background:none;border:0;font-size:20px;line-height:1;color:#000000;opacity:.5;padding:2px 6px;border-radius:9px}
.ad-dh .x:hover{opacity:1;background:#f7f7f7}
.ad-db{flex:1;min-height:0;overflow-y:auto;padding:20px}
.ad-df{padding:13px 20px;border-top:1px solid #d6d6d6;display:flex;gap:9px;justify-content:flex-end;background:#f7f7f7}
.ad-scrim{position:fixed;inset:0;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;transition:opacity .26s ease;z-index:300}
.ad-scrim.on{opacity:1;pointer-events:auto}

/* section headings use the portals' .sec-h scale (17px) */
.ad-sec{font-size:17px;font-weight:700;letter-spacing:-.02em;color:#000000;margin:26px 0 13px}
.ad-sec .ad-cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:#000000;color:#ffffff;font-size:11.5px;font-weight:700;vertical-align:middle;margin-left:4px;line-height:1}
.ad-sec:first-child{margin-top:0}

/* sign-in gate: full height (no 34px prototype bar) */
.ui.ad-gate{height:100vh;display:block}
.ui.ad-gate .ob-split{min-height:100vh;background:#f7f7f7}
.ui.ad-gate .ob-brand-panel .bp-sub{font-size:13px;color:rgba(255,255,255,.6);max-width:280px;line-height:1.6;margin-top:8px}
.ui.ad-gate .ob-brand-panel .bp-lock{width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;margin-bottom:6px}
.ui.ad-gate .ob-brand-panel .bp-lock svg{width:22px;height:22px;color:#ffffff}
.ui.ad-gate .card>h3{font-size:23px}

/* Tal — imported from the portals; behaves as a flex rail beside the stage,
   exactly like the assistant rail on the candidate/cohort portals. */
#adTal{display:none}
#adTal.on{display:flex;flex:0 0 380px;min-width:0;height:100%}
#adTal.on:has(.rail.wide){flex:0 0 min(52%,780px)}
#adTal .rail{flex:1 1 auto;width:auto;min-width:0;height:100%;gap:0}
#adTal .rail.wide{flex:1 1 auto;width:auto}
#adTal .ai{display:flex;flex-direction:column;height:100%;width:100%;background:#ffffff;border:1px solid #d6d6d6;border-radius:22px;overflow:hidden;box-shadow:-12px 0 40px -18px rgba(0,0,0,.28)}

/* misc */
.ad-empty{border:0;border-radius:24px;background:#ffffff;padding:44px 20px;text-align:center;color:#000000}
.ad-empty .i{width:44px;height:44px;border-radius:12px;background:#f7f7f7;display:grid;place-items:center;margin:0 auto 12px}
.ad-empty .i svg{width:22px;height:22px;opacity:.5}
.ad-empty .t{font-weight:700;font-size:14px}
.ad-empty .d{font-size:12.5px;opacity:.6;margin-top:5px}
/* ---- cohort templates ---- */
.tpl-card{background:#ffffff;border:1px solid var(--ln);border-radius:16px;padding:15px 16px;display:flex;flex-direction:column}
.tpl-top{display:flex;gap:10px;align-items:flex-start}
.tpl-nm{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.tpl-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tpl-body{margin:12px 0 4px}
.tpl-body .kv{padding:6px 0}
.tpl-foot{display:flex;gap:7px;align-items:center;margin-top:11px;padding-top:12px;border-top:1px solid var(--ln)}
.tpl-add{display:flex;gap:15px;align-items:center;width:100%;text-align:left;border:1.5px dashed var(--ln2);border-radius:16px;padding:20px 22px;background:#ffffff;font-family:inherit;color:var(--ink);transition:.14s}
.tpl-add:hover{background:var(--fa);border-color:#000000}
.tpl-add .ta-ic{width:40px;height:40px;border-radius:12px;flex:0 0 40px;display:grid;place-items:center;background:#f2f2f2;border:1px solid var(--ln)}
.tpl-add .ta-ic svg{width:19px;height:19px}
.tpl-add:hover .ta-ic{background:#000000;color:#ffffff;border-color:#000000}
.tpl-add .ta-mid{flex:1;min-width:0}
.tpl-add .ta-t{font-size:13.5px;font-weight:700;display:block}
.tpl-add .ta-d{font-size:12px;color:var(--mut);margin-top:3px;display:block;line-height:1.5}
.tpl-add .ta-go{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;place-items:center;border:1px solid var(--ln2);color:var(--mut)}
.tpl-add:hover .ta-go{border-color:#000000;color:#000000}
/* ---- fix banner (unassigned-leader alert on cohort detail) ---- */
.ad-fixbanner{display:flex;gap:14px;align-items:center;background:#000000;color:#ffffff;border-radius:16px;padding:15px 17px;margin-bottom:8px}
.ad-fixbanner .fb-ic{width:36px;height:36px;border-radius:11px;flex:0 0 36px;display:grid;place-items:center;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22)}
.ad-fixbanner .fb-ic svg{width:18px;height:18px}
.ad-fixbanner .fb-t{font-size:14px;font-weight:700}
.ad-fixbanner .fb-d{font-size:12px;opacity:.72;margin-top:3px;line-height:1.5}
.ad-fixbanner .fb-btn{flex:0 0 auto;background:#ffffff;border-color:#ffffff;color:#000000;font-weight:700}
.ad-fixbanner .fb-btn:hover{background:#f0f0f0;color:#000000}
.ad-fixbanner .fb-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#000000;color:#ffffff;font-size:10.5px;font-weight:700;margin-left:2px}
/* ---- leader request picker ---- */
.lreq-list{display:flex;flex-direction:column;gap:10px}
.lreq{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid #d6d6d6;border-radius:14px;padding:13px 14px;background:#ffffff;font-family:inherit;color:var(--ink)}
.lreq:hover{background:#f7f7f7}
.lreq.on{border-color:#000000;background:#f7f7f7}
.lreq-rio{width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:1.6px solid #c9c9c9;background:#ffffff;margin-top:2px;display:grid;place-items:center}
.lreq.on .lreq-rio{border-color:#000000}
.lreq.on .lreq-rio:after{content:"";width:10px;height:10px;border-radius:50%;background:#000000}
.lreq .a{width:34px;height:34px;border-radius:50%;flex:0 0 34px;margin-top:1px;background:#ffffff !important;border:1px solid #000000;color:transparent !important;position:relative;overflow:hidden}
.lreq .a img{visibility:hidden}
.lreq .a::before,.lreq .a::after{content:'';position:absolute;left:50%;top:-30%;width:1px;height:160%;background:#000000;pointer-events:none}
.lreq .a::before{transform:rotate(45deg)}
.lreq .a::after{transform:rotate(-45deg)}
.lreq-mid{flex:1;min-width:0}
.lreq-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lreq-nm{font-size:13.5px;font-weight:700}
.lreq-meta{font-size:11.5px;color:var(--mut);margin-top:3px;display:block}
.lreq-pitch{font-size:12px;color:var(--mid);margin-top:6px;display:block;line-height:1.5}
/* course library picker (Add Course from LSVT) */
.lib-list{display:flex;flex-direction:column;gap:9px}
.lib-row{display:flex;gap:12px;align-items:center;border:1px solid #d6d6d6;border-radius:13px;padding:11px 13px;background:#ffffff}
.lib-row.on{border-color:#000000;background:#f7f7f7}
.lib-row .lib-pick{border:0;background:none;padding:0;cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
.lib-row .lreq-rio{width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:1.6px solid #c9c9c9;background:#ffffff;margin:0;display:grid;place-items:center}
.lib-row.on .lreq-rio{border-color:#000000}
.lib-row.on .lreq-rio:after{content:"";width:10px;height:10px;border-radius:50%;background:#000000}
.lib-mid{flex:1;min-width:0}
.lib-nm{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lib-meta{font-size:11.5px;color:var(--mut);margin-top:2px}
.lib-price{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.lib-price .cur{font-size:13px;color:var(--mut)}
.lib-price .inp{width:98px}
.lib-price .inp:disabled{opacity:.45;background:#f7f7f7}
/* clickable inline value (e.g. template name on cohort detail) */
.lk{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.lk:hover{opacity:.7}
/* cohort-detail Overview: horizontal leader card + 3-column details */

.ad-kpi-spark{display:block;color:#141414;opacity:.9}

.stat.clk:hover{border-color:#000;box-shadow:0 8px 24px -14px rgba(0,0,0,.45)}

function tableCard(cols, rows, opts){
  opts=opts||{};
  var sr = opts.nosr?false:true;
  var PAGE = opts.page||10;
  var paged = !opts.nopage && rows.length>PAGE;
  var tid='adtbl-'+(++_tblN);
  var head='<tr>'+(sr?'<th class="ad-sr" style="width:52px">Sr. #</th>':'')+cols.map(function(c){return '<th'+(c.w?' style="width:'+c.w+'"':'')+'>'+esc(c.t)+'</th>';}).join('')+'</tr>';
  var body=rows.length?rows.map(function(r,i){
    var hide = paged && i>=PAGE;
    return '<tr'+(r._act?' class="clk" data-open="'+esc(r._act)+'"':'')+' data-t="'+tid+'" data-ri="'+i+'"'+(hide?' hidden':'')+'>'
      +(sr?'<td class="ad-sr">'+(i+1)+'</td>':'')
      +cols.map(function(c){return '<td>'+(r[c.k]!=null?r[c.k]:'')+'</td>';}).join('')+'</tr>';
  }).join(''):'<tr><td colspan="'+(cols.length+(sr?1:0))+'" style="text-align:center;padding:28px;opacity:.55">Nothing here yet.</td></tr>';
  /* pad with blank rows so short tables keep a steady minimum height */
  if(opts.minRows && rows.length && rows.length<opts.minRows){
    var blank='<td class="ad-sr"></td>'+cols.map(function(){return '<td></td>';}).join('');
    for(var bp=rows.length;bp<opts.minRows;bp++){ body+='<tr class="ad-padrow" style="height:53px">'+(sr?blank:cols.map(function(){return '<td></td>';}).join(''))+'</tr>'; }
  }
  var pager='';
  if(paged){
    var pages=Math.ceil(rows.length/PAGE), btns='';
    for(var p=0;p<pages;p++){ btns+='<button class="'+(p===0?'on':'')+'" data-tpg="'+tid+'" data-pg="'+p+'" data-ps="'+PAGE+'">'+(p+1)+'</button>'; }
    pager='<div class="ad-pager" data-for="'+tid+'"><span class="ad-pg-info">1&ndash;'+Math.min(PAGE,rows.length)+' of '+rows.length+'</span><div class="ad-pg-btns">'+btns+'</div></div>';
  }
  return '<div class="ad-tblcard"><div class="tw"><table class="tb"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'
    +pager
    +(opts.foot?'<div class="ad-tfoot"><span>'+opts.foot+'</span>'+(opts.footR||'')+'</div>':'')+'</div>';
}

  window.__adTalSyncRec=function(){ syncRec(); };

var CHART_INK=['#141414','#5f5f5f','#9a9a9a','#c9c9c9','#e3e3e3'];
function chFunnel(items){ // items: [{l, v}]
  var max=Math.max.apply(null,items.map(function(i){return i.v;}).concat([1]));

}
function chBars(items){ // horizontal % bars: [{l, v}] (v already a %)
  return items.map(function(i){

  }).join('');
}
function chDonut(segs, vertical){ // segs: [{l, v, c}]; vertical -> stacked, larger, centred
  var total=segs.reduce(function(s,x){return s+x.v;},0)||1, r=54, c=2*Math.PI*r, off=0, cx=68, cy=68;
  var ring=segs.map(function(s,ix){ var len=c*(s.v/total);
    var el='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.c+'" stroke-width="20" stroke-dasharray="'+len.toFixed(2)+' '+(c-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt"/>';
    off+=len; return el; }).join('');
  var leg=segs.map(function(s){return '<div class="ch-leg"><span class="ch-dot" style="background:'+s.c+'"></span><span class="f1">'+esc(s.l)+'</span><b>'+s.v+'</b></div>';}).join('');
  var sz=vertical?140:136;
  return '<div class="ch-donutwrap'+(vertical?' vert':'')+'"><svg viewBox="0 0 136 136" width="'+sz+'" height="'+sz+'" class="ch-donut">'+ring
    +'<text x="68" y="64" text-anchor="middle" class="ch-dnum">'+total+'</text>'

    +'<div class="ch-legs">'+leg+'</div></div>';

function chColumns(items, unit){ // items: [{l, v}]; a value tooltip shows on the tallest bar by default + on hover
  var max=Math.max.apply(null,items.map(function(i){return i.v;}).concat([1]));
  var peak=0; items.forEach(function(i,ix){ if(i.v>items[peak].v) peak=ix; });
  unit=unit||'';
  return '<div class="ch-cols">'+items.map(function(i,ix){
    var h=Math.max(6,Math.round(i.v/max*100));
    var tip='<div class="ch-tip">'+i.v+(unit?' '+unit:'')+'<i>'+esc(i.l)+'</i></div>';
    return '<div class="ch-col'+(ix===peak?' on':'')+'"><div class="ch-cval">'+i.v+'</div><div class="ch-cbarwrap"><div class="ch-cbar" style="height:'+h+'%">'+tip+'</div></div><div class="ch-clab">'+esc(i.l)+'</div></div>';
  }).join('')+'</div>';
}
/* line chart — for a value that moves over time (a trend). items: [{l, v}].
   SVG draws the area+line in a 0..100 box (stretched, non-scaling stroke); dots
   and axis labels are HTML so they stay crisp and undistorted at any width. */
function chLine(items, unit){
  unit=unit||'';
  var max=Math.max.apply(null,items.map(function(i){return i.v;}).concat([1]));
  var n=items.length;
  var yOf=function(v){ return 6 + (1 - v/max)*88; };            // map value -> % (6=top,94=bottom)
  var xOf=function(i){ return n<=1?50:(i/(n-1))*100; };
  var pts=items.map(function(it,i){ return {x:xOf(i), y:yOf(it.v), v:it.v, l:it.l}; });
  var line=pts.map(function(p,i){ return (i?'L':'M')+p.x.toFixed(2)+' '+p.y.toFixed(2); }).join(' ');
  var area=line+' L100 100 L0 100 Z';
  var svg='<svg class="ch-linesvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'
    +'<path class="ch-larea" d="'+area+'"/>'
    +'<path class="ch-lstroke" d="'+line+'" vector-effect="non-scaling-stroke"/></svg>';
  var dots=pts.map(function(p,i){ var last=(i===n-1);
    return '<span class="ch-ldot'+(last?' on':'')+'" style="left:'+p.x+'%;top:'+p.y+'%"><span class="ch-ltip">'+p.v+(unit?' '+unit:'')+'<i>'+esc(p.l)+'</i></span></span>';
  }).join('');
  /* keep the x-axis readable when many points fall in range — show ~7 labels, always first & last */
  var step=Math.max(1,Math.ceil(n/7));
  var labs='<div class="ch-llabs">'+items.map(function(it,i){ var show=(i%step===0)||(i===n-1); return '<span>'+(show?esc(it.l):'')+'</span>'; }).join('')+'</div>';
  return '<div class="ch-line"><div class="ch-lplot">'+svg+dots+'</div>'+labs+'</div>';
}
/* stacked share bar — a compact part-to-whole for a small set. segs: [{l, v, c}] */
function chStack(segs){
  var total=segs.reduce(function(a,s){return a+s.v;},0)||1;
  var bar='<div class="ch-stack">'+segs.map(function(s){ return '<span class="ch-sseg" style="width:'+(s.v/total*100).toFixed(2)+'%;background:'+s.c+'" title="'+esc(s.l)+': '+s.v+'"></span>'; }).join('')+'</div>';
  var leg='<div class="ch-legs" style="margin-top:14px;min-width:0">'+segs.map(function(s){ return '<div class="ch-leg"><span class="ch-dot" style="background:'+s.c+'"></span><span class="f1">'+esc(s.l)+'</span><b>'+s.v+'</b></div>'; }).join('')+'</div>';
  return bar+leg;
}

function pad2(x){return (x<10?'0':'')+x;}

/* quiz rose chart — ported verbatim from the candidate portal's quiz breakdown.
   Radial "pie": each wedge reaches out as far as its score. centre = quiz score. */
function scoreBand(v){ return v>=70?['ok','#000000','Strong'] : v>=50?['wa','#000000','Mixed'] : ['bad','#000000','Weak']; }
function quizRose(dims, centre){
  var CX=180, CY=158, R0=36, R=108, GAP=1.4;
  var pol=function(a,r){ return [CX+r*Math.cos(a*Math.PI/180), CY+r*Math.sin(a*Math.PI/180)]; };
  var seg=function(a0,a1,r){
    var p0=pol(a0,R0), p1=pol(a0,r), p2=pol(a1,r), p3=pol(a1,R0);
    return 'M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+'L'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)
      +'A'+r.toFixed(1)+' '+r.toFixed(1)+' 0 0 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)
      +'L'+p3[0].toFixed(1)+' '+p3[1].toFixed(1)
      +'A'+R0+' '+R0+' 0 0 0 '+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+'Z';
  };
  var fillOf=function(v){ return v>=70?'#000000':v>=50?'url(#qzHatchAd)':'#ffffff'; };
  var step=360/dims.length;
  var rings=[25,50,75,100].map(function(p){ var r=R0+(p/100)*(R-R0);
    return '<circle cx="'+CX+'" cy="'+CY+'" r="'+r.toFixed(1)+'" fill="none" stroke="#d6d6d6" stroke-width="1" stroke-dasharray="2 4"/>'; }).join('');
  var wedges=dims.map(function(d,i){ var v=d[1], a0=-90+i*step+GAP, a1=-90+(i+1)*step-GAP;
    return '<path d="'+seg(a0,a1,R0+(v/100)*(R-R0))+'" fill="'+fillOf(v)+'" stroke="#000000" stroke-width="1.4"/>'; }).join('');
  var marks=dims.map(function(d,i){ var k=d[0], v=d[1], mid=-90+i*step+step/2;
    var lp=pol(mid,R+21), anchor=Math.abs(lp[0]-CX)<14?'middle':(lp[0]>CX?'start':'end');
    var vp=pol(mid,R0+(v/100)*(R-R0)-15);
    return '<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+4).toFixed(1)+'" text-anchor="'+anchor+'" class="qz-lab">'+esc(k)+'</text>'
      +'<text x="'+vp[0].toFixed(1)+'" y="'+(vp[1]+4).toFixed(1)+'" text-anchor="middle" class="qz-val '+(v>=70?'on':'')+'">'+v+'</text>'; }).join('');
  return '<div class="qz-rose">'
    +'<svg viewBox="0 0 360 326" class="qz-svg" role="img" aria-label="Quiz bands">'
      +'<defs><pattern id="qzHatchAd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'
        +'<rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#000000" stroke-width="2"/></pattern></defs>'
      +rings+wedges
      +'<circle cx="'+CX+'" cy="'+CY+'" r="'+R0+'" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>'
      +'<text x="'+CX+'" y="'+(CY-2)+'" text-anchor="middle" class="qz-mid">'+centre+'</text>'
      +'<text x="'+CX+'" y="'+(CY+14)+'" text-anchor="middle" class="qz-mids">of 100</text>'
      +marks
    +'</svg>'
    +'<div class="qz-key">'+dims.map(function(d){ var v=d[1], b=scoreBand(v);
      return '<div class="qz-row"><span class="qz-sw '+(v>=70?'s':v>=50?'m':'w')+'"></span>'
        +'<span class="qz-n">'+esc(d[0])+'</span><b>'+v+'</b><em class="qz-vd">'+b[2]+'</em></div>'; }).join('')+'</div>'
    +'<div class="qz-note">Each wedge reaches out as far as its score. The two shortest are what the interview probes hardest, and what the course spends most of its time on.</div>'
  +'</div>';
}

   override to a higher level with reasoning, or a hold with a reason. */
var promoDecided={};
function promoRec(c){
  var LAD=['E1','E2','E3','E4','E5','B1','B2','B3','B4','B5','T1','T2','T3','T4','T5'];
  var li=LAD.indexOf(c.level); if(li<0) li=0;
  var seed=0,i; for(i=0;i<c.id.length;i++) seed+=c.id.charCodeAt(i);
  var next=LAD[Math.min(LAD.length-1,li+1)], higher=LAD[Math.min(LAD.length-1,li+2)];
  var type=['standard','higher','hold'][seed%3], fn=c.name.split(' ')[0];
  if(type==='standard') return {type:type, level:next, tag:['Standard promotion','ok'], line:'Promote to <b>'+next+'</b>, subject to re-interview.', why:'Met the bar across the 90 days — steady on the weekly rhythm and stronger where the interview flagged. The agent endorses the standard one-level step.'};
  if(type==='higher') return {type:type, level:higher, tag:['Agent override · higher','ac'], line:'Skip to <b>'+higher+'</b> — stronger than a single step.', why:fn+' operated above level throughout: led two peer sessions and closed the delegation gap early. The agent overrides the generic promotion and recommends a double step.'};

   Everything the platform holds on one agent: profile, availability, upcoming and
   past interviews (each opening its recording/transcript/scenes), earnings settled
   vs. in progress, and candidate reviews. Synthesized deterministically per agent
   so the page is stable across renders. ------------------------------------- */
function agentSeed(a){ var s=0,i; for(i=0;i<(a.id||'').length;i++) s+=a.id.charCodeAt(i); return s; }
var AGENT_PAST_POOL=[
  ['Leo Martins','E2','Aug 6','42 min'],['Aisha Bello','E1','Aug 1','38 min'],['Diego Alvarez','B1','Jul 27','45 min'],
  ['Grace Kim','E3','Jul 22','40 min'],['Sam Whitfield','E2','Jul 18','36 min'],['Hana Sato','B2','Jul 12','47 min'],
  ['Omar Haddad','E1','Jul 5','35 min'],['Yuki Tanaka','T1','Jun 28','44 min']
];
function agentPast(a){
  var seed=agentSeed(a), n=Math.max(4,Math.min(AGENT_PAST_POOL.length, Math.round((a.interviewed||8)/9)+3));
  var out=[]; for(var k=0;k<n;k++){ var s=AGENT_PAST_POOL[(seed+k)%AGENT_PAST_POOL.length];
    out.push({cand:s[0], level:s[1], when:s[2], dur:s[3], kind:(k%3===0?'Re-interview':'Levelling interview'), rating:4+(((seed+k)%11)/10)}); }
  return out;
}
var AGENT_REVIEW_POOL=[
  ['Maryam Naz',5,'Asked sharp questions and gave feedback I could act on the same day.'],
  ['Leo Martins',5,'Calm, precise and fair. The re-interview felt like a genuine read, not a checklist.'],
  ['Aisha Bello',4,'Great at drawing out real examples. I’d have liked a little more time at the end.'],
  ['Diego Alvarez',5,'Pushed me without rattling me — the best interview feedback I’ve had.'],
  ['Grace Kim',4,'Structured and warm, and clear on why the level landed where it did.'],
  ['Sam Whitfield',5,'Made a nerve-wracking session feel like a conversation.']
];
function agentReviews(a){ var seed=agentSeed(a), n=4; var out=[]; for(var k=0;k<n;k++){ out.push(AGENT_REVIEW_POOL[(seed+k)%AGENT_REVIEW_POOL.length]); } return out; }
var AV_DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], AV_SLOTS=['09:00','10:30','13:00','14:30','16:00'];
var agentAvailWeek=0;   /* week offset the super admin is viewing (0 = current) */
function agentAvail(a, wk){ var seed=agentSeed(a)+((wk||0)*11); return AV_DAYS.map(function(d,di){
    var off=(di>=5);   /* Sat/Sun are the agent's off days */
    return {day:d, off:off, slots:off?[]:AV_SLOTS.map(function(t,si){ var v=(seed+di*7+si*3)%5; return {t:t, open:v>1}; })}; }); }
/* week range label for a given offset from the week containing TODAY_ISO */
var AVCAL_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function agentWeekLabel(wk){
  var base=new Date('2026-08-11T00:00:00'); var dow=(base.getDay()+6)%7;   /* Mon=0 */
  var mon=new Date(base); mon.setDate(base.getDate()-dow+(wk||0)*7);
  var sun=new Date(mon); sun.setDate(mon.getDate()+6);
  var f=function(d){ return AVCAL_MON[d.getMonth()]+' '+d.getDate(); };
  return f(mon)+' – '+f(sun);
}

/* ============================ COHORTS & PROGRAMME ============================ */
function cohActive(c){ return c.status==='active' && c.leader!=='Unassigned'; }
/* inactive cohort that has a leader but hasn't started yet — eligible for "Start cohort" */
function cohReady(c){ return c.status!=='active' && c.leader!=='Unassigned'; }
V['cohorts/cohorts']=function(){
  var all=DB.COHORTS;
  var counts={all:all.length, active:all.filter(cohActive).length, inactive:all.filter(function(c){return !cohActive(c);}).length};
  var list=all.filter(function(c){ if(cohTab==='active') return cohActive(c); if(cohTab==='inactive') return !cohActive(c); return true; });
  var un=all.filter(function(c){return c.leader==='Unassigned'&&c.status==='active';}).length;
  var seats=all.reduce(function(a,c){return a+c.size;},0);
  var tabDefs=[['all','All Cohorts'],['active','Active'],['inactive','Inactive']];
  var tabsHtml=tabDefs.map(function(t){return '<button class="'+(cohTab===t[0]?'on':'')+'" data-act="cohtab:'+t[0]+'">'+t[1]+' ('+counts[t[0]]+')</button>';}).join('');
  return pageHead('Cohorts','Every cohort is spun up from a template and runs one 90-day cycle. A cohort is only active once a leader is assigned — a Builder leads Explorer cohorts, a Trailblazer leads Builder cohorts.',
     '<button class="btn p sm" data-act="ncoh:open">'+I('plus')+' New cohort</button>')
   +talCard(un?(un+' active cohort'+(un===1?' is':'s are')+' waiting on a leader.'):'Every active cohort has a leader.','None of these can go active until you assign one — open the cohort and pick from the candidates who applied to lead. That\'s your call to make, not the candidate\'s.',[{l:'Show cohorts awaiting a leader',act:'cohtab:inactive',p:1},{l:'How do I add a cohort leader?',ask:'How do I add a cohort leader?'}],true)
   +kpis([{l:'Active cohorts',v:counts.active, ic:'cohorts'},{l:'Inactive',v:counts.inactive, ic:'doc'},{l:'Members enrolled',v:seats, ic:'users'},{l:'Awaiting a leader',v:un, ic:'route'}], 'Programme at a glance')
   +'<div class="ad-toolbar ad-toolbar-top"><div class="ad-tabs">'+tabsHtml+'</div></div>'
   +filterTable({key:'cohorts', data:list, placeholder:'Search cohort, leader or template…', icon:'cohorts', emptyTitle:'No cohorts match',
     columns:[{t:'Cohort',k:'name',w:'130px'},{t:'Level',k:'level',w:'86px'},{t:'Template',k:'tpl',w:'150px'},{t:'Leader',k:'leader'},{t:'Members',k:'size',w:'92px'},{t:'Progress',k:'prog',w:'150px'},{t:'Status',k:'status',w:'96px'}],
     searchText:function(c){var tp=DB.TPL_BY_ID[c.templateId]; return c.name+' '+c.leader+' '+(tp?tp.name:'');},
     filters:[
       {key:'track', all:'All tracks', get:function(c){return c.track;}},
       {key:'level', all:'All levels', get:function(c){return c.level;}}
     ],
     row:function(c){var tp=DB.TPL_BY_ID[c.templateId]; var st=statusDot(cohActive(c)?'active':'off');
       return {_act:'coh:'+c.id, name:'<span class="nm">'+esc(c.name)+'</span>', level:c.level?lvlTag(c.level):'<span class="sub">—</span>', tpl: tp?'<span class="sub">'+esc(tp.name)+'</span>':'<span class="sub">—</span>', leader: c.leader==='Unassigned'?tag('Unassigned','wa'):esc(c.leader), size:c.size+' / 10', prog: c.status==='draft'?'<span class="sub">not started</span>':'Week '+c.week+' · day '+c.day+'/90', status:st};},
     foot:function(n,t){return 'Showing '+n+' of '+all.length+' cohort'+(all.length===1?'':'s');}});
};
V['cohorts/templates']=function(){

    return '<div class="tpl-card"><div class="tpl-top"><div class="f1"><div class="tpl-nm">'+esc(t.name)+'</div><div class="tpl-meta">'+lvlTag(t.level)+tag(t.track)+(t.status==='draft'?tag('Draft','wa'):'')+'</div></div><button class="ad-iconbtn" data-act="tpl:menu:'+t.id+'" title="Actions">'+I('dots')+'</button></div>'
      +'<div class="tpl-body"><div class="kv"><span>Course</span><b>'+esc(co?co.name:'—')+'</b></div><div class="kv"><span>Sessions</span><b>'+t.sessions.length+'</b></div><div class="kv"><span>Cohorts using it</span><b>'+t.used+'</b></div></div>'
      +'<div class="tpl-foot">'+(t.status==='draft'
          ? '<button class="btn sm" data-act="tpl:edit:'+t.id+'">'+I('edit')+' Keep Editing</button>'
          : '<button class="btn sm" data-act="tpl:edit:'+t.id+'">'+I('edit')+' Edit</button><button class="btn p sm" data-act="ncoh:from:'+t.id+'">Use template</button>')+'</div></div>';
  }

  var list=all.filter(function(t){ if(tplTab==='published') return t.status!=='draft'; if(tplTab==='draft') return t.status==='draft'; return true; });
  var tabDefs=[['all','All Templates'],['draft','Draft']];
  var tabsHtml=tabDefs.map(function(t){return '<button class="'+(tplTab===t[0]?'on':'')+'" data-act="tpltab:'+t[0]+'">'+t[1]+' ('+counts[t[0]]+')</button>';}).join('');
  var out=pageHead('Cohort Templates','A template is a reusable blueprint — one course plus a session outline — tagged by level. Session times stay blank until you use the template to start a cohort, so the same plan can run again and again on new dates.',
     '<button class="btn p sm" data-act="tpl:open">'+I('plus')+' New template</button>')
   +'<div class="ad-toolbar ad-toolbar-top"><div class="ad-tabs">'+tabsHtml+'</div></div>';
  ['Explorer','Builder','Trailblazer'].forEach(function(lv){ var tl=list.filter(function(t){return t.track===lv;});
    if(tl.length){ out+=subhead(lv+' templates')+'<div class="ad-3col tpl-grid">'+tl.map(tplCard).join('')+'</div>'; }
    else if(tplTab==='all'){ out+=subhead(lv+' templates')+'<button class="tpl-add" data-act="tpl:new:'+lv+'"><span class="ta-ic">'+I('plus')+'</span><span class="ta-mid"><span class="ta-t">Add a '+lv+' template</span><span class="ta-d">No '+lv+'-level templates yet. Create a blueprint to start spinning up '+lv+' cohorts.</span></span><span class="ta-go">'+I('plus')+'</span></button>'; }
  });
  if(tplTab!=='all' && !list.length) out+='<div class="ad-empty"><div class="i">'+I('doc')+'</div><div class="t">No '+(tplTab==='draft'?'draft':'published')+' templates</div><div class="d">'+(tplTab==='draft'?'Templates you save as drafts will appear here.':'Published templates ready to use will appear here.')+'</div></div>';
  return out;
};
V['cohorts/detail']=function(){
  var c=DB.COHORTS.filter(function(x){return x.id===viewCohId;})[0]||DB.COHORTS[0];
  var tp=DB.TPL_BY_ID[c.templateId];
  var co=tp?DB.COURSE_BY_ID[tp.courseId]:null;
  var members=DB.CANDS.filter(function(x){return x.cohort===c.name;});
  var isDraft=c.status==='draft';
  var unassigned=c.leader==='Unassigned';
  var leaderName=c.leader.replace(/\s*\(.*\)$/,'');
  var leaderRole=(c.leader.match(/\(([^)]*)\)/)||[null,'—'])[1];
  var pct=isDraft?0:Math.round(c.day/90*100);
  var curWeek=isDraft?0:Math.max(1,Math.min(13,Math.ceil(c.day/7)));
  var sessions=tp?tp.sessions.slice().sort(function(a,b){return a.week-b.week;}):[];
  function slot(s){ var t=(c.sessionTimes||{})[s.id]||{}; var d=t.date||(c.start?addWeeks(c.start,s.week):''); return {date:d,time:t.time||''}; }
  var endDate=(function(){ var d=parseISO(c.start); if(!d) return ''; d.setDate(d.getDate()+89); return fmtISO(d); })();
  var next=null,i; for(i=0;i<sessions.length;i++){ if(sessions[i].week>=curWeek){ next=sessions[i]; break; } } if(!next && sessions.length) next=sessions[sessions.length-1];
  var leadTrack=c.track==='Explorer'?'Builder':c.track==='Builder'?'Trailblazer':'a platform staff lead';

  var reqCount=leaderReadyFor(c).length;
  var out=pageHead(c.name, 'Full cohort record — the template it runs, its schedule, roster, leader and progress, all in one place.', '', c.name);

  if(unassigned) out+='<div class="ad-fixbanner"><div class="fb-ic">'+I('alert')+'</div>'
    +'<div class="f1"><div class="fb-t">This cohort has no leader assigned yet</div>'
    +'<div class="fb-d">A '+leadTrack+' leads '+esc(c.track)+' cohorts. '+(reqCount?reqCount+' interviewed candidate'+(reqCount===1?' has':'s have')+' been recommended — assign one.':'No recommended leader yet — interview applicants on the Cohort Leaders page first.')+'</div></div>'
    +(reqCount?'<button class="btn fb-btn" data-act="leadreq:open:'+c.id+'">'+I('users')+' Assign a cohort leader <span class="fb-badge">'+reqCount+'</span></button>':'<button class="btn fb-btn" data-go="cohorts/assign">'+I('users')+' Open Cohort Leaders</button>')+'</div>';
  else if(cohReady(c)) out+='<div class="ad-fixbanner"><div class="fb-ic">'+I('check')+'</div>'
    +'<div class="f1"><div class="fb-t">This cohort has a leader and is ready to start</div>'
    +'<div class="fb-d">Led by '+esc(leaderName)+'. Starting it begins the 90-day cycle'+(c.start?' from '+fmtDate(c.start):' today')+' and moves the cohort to Active.</div></div>'
    +'<button class="btn fb-btn" data-act="cohstart:'+c.id+'">'+I('check')+' Start cohort</button></div>';

  out+='<div class="g4">'
    +'<div class="stat"><div class="l">Level</div><div class="v" style="font-size:19px">'+esc(c.level||'—')+'</div><div class="f">'+esc(c.track)+' track</div></div>'
    +'<div class="stat"><div class="l">Leader</div><div class="v" style="font-size:15px;line-height:1.35">'+(unassigned?'Unassigned':esc(leaderName))+'</div><div class="f">'+(unassigned?'awaiting assignment':esc(leaderRole))+'</div></div>'
    +'<div class="stat"><div class="l">Members</div><div class="v" style="font-size:19px">'+c.size+' <s>/10</s></div><div class="f">seats filled</div></div>'
    +'<div class="stat"><div class="l">Progress</div><div class="v" style="font-size:19px">'+(isDraft?'—':pct+'<s>%</s>')+'</div><div class="f">'+(isDraft?'not started':'Week '+c.week+' · day '+c.day+'/90')+'</div></div>'
  +'</div>';

  var leaderBody = unassigned
    ? '<div class="coh-lead-row"><div class="f1"><div class="cl-t">No leader assigned yet</div><div class="sub">A '+leadTrack+' leads '+esc(c.track)+' cohorts. Review the candidates who applied to lead and choose one.</div></div><button class="btn p" data-act="leadreq:open:'+c.id+'">'+I('users')+' Review leader requests</button></div>'
    : '<div class="coh-lead-row"><div class="ad-u cl-person">'+av(leaderName)+'<div><div class="n" style="font-size:14.5px">'+esc(leaderName)+'</div><div class="e" style="margin-top:2px">'+esc(leaderRole)+' · leads '+esc(c.name)+'</div></div></div>'
      +'<div class="f1"></div>'
      +'<span class="tag">'+I('shield')+' Platform-assigned</span>'
      +'<button class="btn" data-act="leadreq:open:'+c.id+'">'+I('users')+' Change leader</button></div>';
  function kvrow(l,v){ return '<div class="kv"><span>'+l+'</span><b>'+v+'</b></div>'; }
  var detailBody='<div class="coh-details-3">'
    +'<div class="cd-col">'+kvrow('Cohort',esc(c.name))+kvrow('Track',esc(c.track))+kvrow('Level',lvlTag(c.level))+'</div>'
    +'<div class="cd-col">'+kvrow('Status',statusDot(cohActive(c)?'active':'off'))+kvrow('Template',tp?'<span class="lk" data-go="cohorts/templates">'+esc(tp.name)+'</span>':'—')+kvrow('Course',co?esc(co.name):'—')+'</div>'
    +'<div class="cd-col">'+kvrow('Start date',c.start?fmtDate(c.start):'to be set')+kvrow('End date',endDate?fmtDate(endDate):'—')+kvrow('Sessions',sessions.length)+'</div>'
    +'</div>';
  out+=subhead('Overview')
   +card('Cohort leader', leaderBody)
   +'<div style="height:14px"></div>'
   +card('Cohort details', detailBody);

   +card('Where this cohort is in its cycle',
     (isDraft
       ? '<p class="sub" style="margin:0">This cohort is a draft — the 90-day cycle has not started. '+(c.start?'It is scheduled to begin '+fmtDate(c.start)+'.':'Set a start date to schedule it.')+'</p>'

         }).join(''),
         (c.start?'starts '+fmtDate(c.start):'dates unset'))

  var full=members.length>=10;

   +(members.length

/* each pipeline tab renders one table with columns suited to that stage */
function leaderTable(stage, list){

  }

    cols=[{t:'Candidate',k:'cand'},{t:'Leads',k:'leads',w:'190px'},{t:'Interviewed',k:'iv',w:'150px'},{t:'Agent recommendation',k:'note'},{t:'',k:'act',w:'170px'}];
    rows=list.map(function(r){var iv=r.interview||{},fb=r.feedback||{};return {cand:leadCand(r), leads:leadLeads(r),
      iv:'<span class="sub">'+fmtDate(iv.date)+'<br>by '+esc(fb.agent||iv.agent)+'</span>', note:'<span class="sub">'+(fb.note?'“'+esc(fb.note)+'”':'—')+'</span>',
      act:'<button class="btn sm" data-act="leadallot:open:'+r.id+'">Allot to a cohort</button>'};});
  } else if(stage==='feedback'){
    cols=[{t:'Candidate',k:'cand'},{t:'Leads',k:'leads',w:'190px'},{t:'Interview',k:'iv',w:'190px'},{t:'',k:'act',w:'230px'}];
    rows=list.map(function(r){var iv=r.interview||{};return {cand:leadCand(r), leads:leadLeads(r),
      iv:'<b>'+esc(iv.agent)+'</b><div class="sub">'+fmtDate(iv.date)+(iv.time?' · '+esc(iv.time):'')+'</div>',
      act:'<button class="btn sm" data-act="leadint:open:'+r.id+'">Reschedule</button> <button class="btn sm" data-act="leadfb:open:'+r.id+'">Record feedback</button>'};});
  } else if(stage==='interview'){
    cols=[{t:'Candidate',k:'cand'},{t:'Leads',k:'leads',w:'190px'},{t:'Interview',k:'iv',w:'200px'},{t:'Pitch',k:'pitch'},{t:'',k:'act',w:'240px'}];
    rows=list.map(function(r){

        return {cand:leadCand(r), leads:leadLeads(r),

          pitch:'<span class="sub">“'+esc(r.pitch)+'”</span>',
          act:'<button class="btn sm" data-act="leadint:open:'+r.id+'">Reschedule</button> <button class="btn sm" data-act="leadfb:open:'+r.id+'">Record feedback</button>'};
      }
      return {cand:leadCand(r), leads:leadLeads(r),
        iv:'<span class="sub">Not scheduled · applied '+esc(r.when)+'</span>',
        pitch:'<span class="sub">“'+esc(r.pitch)+'”</span>',
        act:'<button class="btn sm" data-act="leadint:open:'+r.id+'">Schedule</button>'};
    });
  } else {
    cols=[{t:'Candidate',k:'cand'},{t:'Leads',k:'leads',w:'190px'},{t:'Interviewed by',k:'iv',w:'150px'},{t:'Agent note',k:'note'},{t:'',k:'act',w:'150px'}];
    rows=list.map(function(r){var iv=r.interview||{},fb=r.feedback||{};return {cand:leadCand(r), leads:leadLeads(r),
      iv:'<span class="sub">'+esc(fb.agent||iv.agent||'—')+'</span>', note:'<span class="sub">'+(fb.note?'“'+esc(fb.note)+'”':'—')+'</span>',
      act:'<button class="btn sm" data-act="leadint:open:'+r.id+'">Re-interview</button>'};});
  }
  return tableCard(cols, rows, {nopage:list.length<=10});

/* ---- Recordings & Transcripts ------------------------------------------------
   A grid of interviews taken (searchable, filterable). Opening one shows its
   recording, transcript, the scenes the AI cut from it, and the subset the
   candidate finalized onto their profile. ---------------------------------- */
var recSel=null;
var recFilters={q:'',cand:'',agent:'',date:''};
var REC_SCENEPOOL=[
  ['Handing over a project that was going wrong','1:12','Delegation','From 14:20'],
  ['Holding a line under pressure from a peer','0:48','Composure','From 22:05'],
  ['Explaining a decision they later regretted','1:35','Decisiveness','From 31:40'],
  ['Coaching a struggling team member','1:04','Coaching','From 38:12'],
  ['Naming a problem before it became visible','0:52','Directness','From 44:03'],
  ['Re-planning the week after a setback','1:18','Composure','From 51:27']
];
function recScenes(name){
  var seed=0,i; for(i=0;i<(name||'').length;i++) seed+=name.charCodeAt(i);
  var pool=REC_SCENEPOOL, n=pool.length, start=seed%n, gen=[];
  for(var k=0;k<5;k++) gen.push(pool[(start+k)%n]);
  return {gen:gen, keep:2+(seed%3)};   /* the candidate finalizes 2–4 of the 5 */
}
function recSceneCard(s,opts){ opts=opts||{};
  return '<div class="scene'+(opts.on?' on':'')+(opts.dim?' sc-dim':'')+'">'
    +'<div class="sc-thumb"><span class="wf-img"></span><span class="sc-dur">'+esc(s[1])+'</span></div>'
    +'<div class="sc-body f1"><div class="sc-t">'+esc(s[0])+'</div><div class="sc-m">'+esc(s[2])+' · '+esc(s[3])+'</div>'
    +(opts.tag?'<div class="mt8">'+opts.tag+'</div>':'')+'</div></div>';
}
function recTranscript(b){
  var fn=esc((b.cand||'').split(' ')[0]), ag=esc((b.agent||'Agent').split(' ')[0]);
  var lines=[[ag,'Thanks for making the time. Walk me through a time a plan slipped and you were the first to see it.'],
    [fn,'We were three weeks into a launch and I could tell the delivery date wasn’t going to hold. The signals were small — a couple of missed check-ins, a vendor going quiet.'],
    [ag,'What did you do with that read?'],
    [fn,'I raised it early rather than waiting for it to become obvious. I pulled the team together, we re-cut the scope, and I took the harder conversation with the stakeholder myself.'],
    [ag,'How did the stakeholder take it?'],
    [fn,'Not thrilled at first. But because I brought options rather than just a problem, we landed on a smaller launch that still hit the deadline.'],
    [ag,'Was there a moment you doubted the call?'],
    [fn,'Around week two. Cutting scope felt like admitting failure. What settled it was watching the team move faster once the target was realistic.']];
  return '<div style="font-size:12.5px;line-height:1.7">'
    +lines.map(function(l){return '<p style="margin:0 0 10px"><b>'+l[0]+':</b> '+esc(l[1])+'</p>';}).join('')
    +'<p class="sub" style="margin:6px 0 0">Transcript continues — 42 min total. Open full to read the rest.</p></div>';
}
function recFullTranscript(b){
  var fn=esc((b.cand||'').split(' ')[0]), ag=esc((b.agent||'Agent').split(' ')[0]);
  var lines=[
    ['00:12',ag,'Thanks for making the time. Walk me through a time a plan slipped and you were the first to see it.'],
    ['00:31',fn,'We were three weeks into a launch and I could tell the delivery date wasn’t going to hold. The signals were small — a couple of missed check-ins, a vendor going quiet.'],
    ['01:05',ag,'What did you do with that read?'],
    ['01:18',fn,'I raised it early rather than waiting for it to become obvious. I pulled the team together, we re-cut the scope, and I took the harder conversation with the stakeholder myself.'],
    ['02:40',ag,'How did the stakeholder take it?'],
    ['02:52',fn,'Not thrilled at first. But because I brought options rather than just a problem, we landed on a smaller launch that still hit the deadline.'],
    ['05:14',ag,'Was there a moment you doubted the call?'],
    ['05:29',fn,'Around week two. Cutting scope felt like admitting failure. What settled it was watching the team move faster once the target was realistic.'],
    ['08:03',ag,'If you ran it again, what would you change?'],
    ['08:17',fn,'I’d surface the risk a week earlier. I sat on the hunch a little too long trying to be certain before I said anything.']
  ];
  return '<p class="sub" style="margin:-2px 0 14px">'+esc(b.agent)+' · '+fmtDate(b.date)+' · '+esc(b.kind)+' · full session, 42 min</p>'
    +'<div style="font-size:12.5px;line-height:1.7">'
    +lines.map(function(l){return '<div style="display:flex;gap:12px;margin:0 0 13px"><span class="mono sub" style="flex:0 0 42px">'+l[0]+'</span><div class="f1"><b>'+l[1]+'</b><br>'+esc(l[2])+'</div></div>';}).join('')
    +'<p class="sub" style="margin:4px 0 0">End of excerpt — the remaining 33 minutes stay with the recording.</p></div>';
}
function recDetail(b){
  var sc=recScenes(b.cand);
  return '<div class="row ac" style="margin-bottom:14px"><button class="btn sm" data-act="recback">← All interviews</button><div class="f1"></div>'
    +'<button class="btn sm" data-act="toast:Transcript downloaded">Download transcript</button></div>'
    +'<div class="row ac" style="margin-bottom:15px">'+av(b.cand)+'<div class="f1"><h2 style="font-size:18px">'+esc(b.cand)+' <span class="tag">'+esc(b.kind)+'</span></h2>'
    +'<p class="sub hd-desc">'+esc(b.agent)+' · '+fmtDate(b.date)+' · '+esc(b.slot)+' · recorded and transcribed</p></div></div>'
    +'<div class="ad-2col" style="align-items:stretch">'
    +card('Recording','<div class="vid" style="aspect-ratio:16/9"><span class="play">'+I('video')+'</span><span class="cap">'+esc(b.cand)+' · full session</span></div>'
      +'<div class="row mt8"><button class="btn p sm" data-act="toast:Playing recording">Play recording</button></div>','human-led · stored securely')
    +'<div class="card" style="display:flex;flex-direction:column"><h3>Transcript<span class="r"><button class="btn sm" data-act="rectr:'+b.id+'">Open full</button></span></h3>'
      +'<div class="f1" style="overflow:auto;min-height:0">'+recTranscript(b)+'</div></div>'
    +'</div>'
    +subhead('Scenes generated from this interview')
    +card('AI-generated scenes',
       '<p class="sub" style="margin:-4px 0 12px">Cut automatically from the recording. The candidate chooses which of these to keep on their profile.</p>'
       +'<div class="scenes ad-scenes3">'+sc.gen.map(function(s,i){var kept=i<sc.keep; return recSceneCard(s,{dim:!kept, tag:(kept?'<span class="tag ok">Kept by candidate</span>':'<span class="tag">Not published</span>')});}).join('')+'</div>', sc.gen.length+' clips')
    +subhead('Scenes finalized by the candidate')
    +card('On '+esc((b.cand||'').split(' ')[0])+'’s profile',
       '<p class="sub" style="margin:-4px 0 12px">The only clips visible to employers — the candidate finalized this selection.</p>'
       +'<div class="scenes ad-scenes3">'+sc.gen.slice(0,sc.keep).map(function(s){return recSceneCard(s,{on:true, tag:'<span class="tag ok">Visible to employers</span>'});}).join('')+'</div>', sc.keep+' of '+sc.gen.length+' kept');
}
function recTaken(){ return DB.BOOKINGS.filter(function(b){return b.status==='active';}); }
function recFiltered(){
  var q=(recFilters.q||'').toLowerCase();
  return recTaken().filter(function(b){
    if(recFilters.cand && b.cand!==recFilters.cand) return false;
    if(recFilters.agent && b.agent!==recFilters.agent) return false;
    if(recFilters.date && b.date!==recFilters.date) return false;
    if(q && (b.cand+' '+b.agent).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function recResultsHTML(){
  var list=recFiltered();
  if(!list.length) return '<div class="ph" style="min-height:120px">No interviews match these filters.</div>';
  return '<div class="ad-3col">'+list.map(function(b){ var sc=recScenes(b.cand);
    return '<div class="card"><div class="vid" style="aspect-ratio:16/9;margin-bottom:10px"><span class="play">'+I('video')+'</span></div>'
      +'<h3 style="margin-bottom:3px">'+esc(b.cand)+'</h3>'
      +'<p class="sub">'+esc(b.agent)+' · '+fmtDate(b.date)+' · '+esc(b.kind)+'</p>'
      +'<div class="row ac mt8" style="gap:7px"><span class="tag ok">Transcript ready</span><span class="tag">'+sc.gen.length+' scenes · '+sc.keep+' kept</span><div class="f1"></div><button class="btn p sm" data-act="recopen:'+b.id+'">Open</button></div>'
      +'</div>';
  }).join('')+'</div>';
}
var REC_DDCHEV='<svg class="ad-dd-chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>';
function recOptsBuild(){
  var taken=recTaken();
  var uniq=function(arr){var o={},r=[];arr.forEach(function(v){if(v&&!o[v]){o[v]=1;r.push(v);}});return r;};
  var opt=function(all,lst,fmt){ return [{v:'',l:all}].concat(lst.map(function(v){return {v:v,l:fmt?fmt(v):v};})); };
  var OPTS={
    cand: opt('All candidates',    uniq(taken.map(function(b){return b.cand;})).sort()),
    agent:opt('All talent agents',  uniq(taken.map(function(b){return b.agent;})).sort()),
    date: opt('All dates',          uniq(taken.map(function(b){return b.date;})).sort(), fmtDate)
  };
  window.__RECOPTS=OPTS; return OPTS;
}
function recDd(OPTS,field,id){
  var cur=recFilters[field]||'';
  var sel=OPTS[field].filter(function(o){return o.v===cur;})[0]||OPTS[field][0];
  var menu=OPTS[field].map(function(o,i){return '<button class="'+(o.v===cur?'on':'')+'" data-act="recfilter:set:'+field+':'+i+'">'+esc(o.l)+'</button>';}).join('');
  return '<div class="ad-dd" id="'+id+'"><button class="ad-dd-btn" data-act="recfilter:toggle:'+id+'">'+I('filter')+'<span>'+esc(sel.l)+'</span>'+REC_DDCHEV+'</button><div class="ad-dd-menu">'+menu+'</div></div>';
}
function recFilterBar(){
  var OPTS=recOptsBuild();
  var search='<div class="ad-cand-search">'+I('search')+'<input type="text" placeholder="Search candidate or agent…" value="'+esc(recFilters.q||'')+'" oninput="window.__recSetSearch(this.value)"></div>';
  return '<div class="ad-toolbar">'+search+'<div class="f1"></div>'
    +recDd(OPTS,'cand','recCandDD')+recDd(OPTS,'agent','recAgentDD')+recDd(OPTS,'date','recDateDD')
    +'<button class="btn sm" data-act="recclear">Clear</button>'
    +'</div>';
}
if(typeof window!=='undefined'){
  window.__recRefresh=function(){ var w=document.getElementById('recResults'); if(w) w.innerHTML=recResultsHTML(); };
  window.__recSetSearch=function(v){ recFilters.q=v; window.__recRefresh(); };
  if(!window.__recNavWired){ window.__recNavWired=true; window.addEventListener('hashchange',function(){ recSel=null; }); }
}
V['market/recordings']=function(){
  if(recSel){ var sb=DB.BOOKINGS.filter(function(x){return x.id===recSel;})[0]; if(sb) return recDetail(sb); recSel=null; }
  return pageHead('Recordings & Transcripts','Every interview is human-led, video-recorded and transcribed. Open an interview to see its recording, transcript and the scenes cut from it.')
   +recFilterBar()
   +'<div id="recResults">'+recResultsHTML()+'</div>';
};

   +'<div>'+card('Agent scoring','<div class="kv"><span>Scored on</span><b>Follow-up quality & depth</b></div><div class="kv"><span>Can change candidate level?</span><b>No</b></div><div class="kv"><span>Ranking</span><b>Computed, not editable</b></div>')+'</div>'
   +'</div>';
};

/* ============================ EMPLOYERS & HIRING ============================ */
/* ---- shared helpers for the employer views ---- */
function empById(id){ return DB.EMPLOYERS.filter(function(x){return x.id===id;})[0]||null; }
function empName(id){ var e=empById(id); return e?e.name:'—'; }
function empUnlocksFor(id){ return DB.UNLOCKS.filter(function(u){return u.empId===id;}); }
function empPlacementsFor(id){ return DB.PLACEMENTS.filter(function(p){return p.empId===id;}); }
function empSpend(e){ return e.unlocks*40 + empPlacementsFor(e.id).reduce(function(a,p){return a+p.fee;},0); }
function ulOutcomeTag(o){ return o==='placed'?tag('Placed','ok'):o==='shortlisted'?tag('Shortlisted','ac'):o==='reviewing'?tag('Reviewing','wa'):tag('Passed'); }
function feeStateTag(s){ return s==='paid'?tag('Paid','ok'):s==='invoiced'?tag('Invoiced','ac'):tag('Pending','wa'); }
function candCell(name, level, bucket){ return userCell(name, level+' · '+bucket); }
function ebar(label, valTxt, pct){ return '<div class="blab"><span>'+esc(label)+'</span><span>'+valTxt+'</span></div><div class="bar"><i style="width:'+Math.max(3,Math.round(pct))+'%"></i></div><div style="height:12px"></div>'; }

V['employers/employers']=function(){
  var emps=DB.EMPLOYERS;
  var verified=emps.filter(function(e){return e.verify==='ok';}).length;
  var pending=emps.length-verified;
  var hiring=emps.filter(function(e){return e.type==='Hiring';}).length;
  var sponsoring=emps.length-hiring;
  var totUnlocks=DB.UNLOCKS.length, totPlace=DB.PLACEMENTS.length;
  var unlockRev=totUnlocks*40, feeRev=DB.PLACEMENTS.reduce(function(a,p){return a+p.fee;},0);
  var openRoles=emps.reduce(function(a,e){return a+(e.openRoles||0);},0);

  var maxSpend=ranked.length?ranked[0].spend:1;

   +kpis([

     {l:'Candidate unlocks', v:totUnlocks, f:money(unlockRev)+' in unlock fees', ic:'lock', go:'employers/unlocks'},
     {l:'Placements', v:totPlace, f:money(feeRev)+' in placement fees', ic:'check', go:'employers/placements'},
     {l:'Open roles', v:openRoles, f:'across '+hiring+' hiring employers', ic:'users'}
   ], 'Employers at a glance')
   +subhead('Breakdown')
   +'<div class="g2 ad-stretch">'
   +'<div>'+card('Type & verification',
       '<div class="row" style="gap:20px;align-items:center;flex-wrap:nowrap">'
       +'<div style="flex:0 0 auto">'+chDonut([{l:'Hiring',v:hiring,c:CHART_INK[0]},{l:'Sponsoring',v:sponsoring,c:CHART_INK[2]}])+'</div>'
       +'<div class="f1" style="min-width:0"><div class="kv"><span><span class="sdot"><b></b>Verified</span></span><b>'+verified+'</b></div>'

         +'<div class="kv"><span><span class="sdot off"><b></b>Unverified</span></span><b>'+unverif+'</b></div></div>'
       +'</div>')+'</div>'

   +'</div>'
   +subhead('Companies', emps.length)
   +filterTable({key:'employers', data:emps, placeholder:'Search company, domain, industry or signer…', icon:'store', emptyTitle:'No employers match',
     columns:[{t:'Company',k:'name',w:'220px'},{t:'Type',k:'type',w:'118px'},{t:'Industry',k:'industry',w:'150px'},{t:'Unlocks',k:'unlocks',w:'92px'},{t:'Placements',k:'place',w:'108px'},{t:'Spend',k:'spend',w:'104px'},{t:'Signer',k:'signer',w:'150px'},{t:'Verified',k:'status',w:'118px'}],

     foot:function(n,t){return 'Showing '+n+' of '+t+' employer'+(t===1?'':'s');}});

/* ============================ FINANCE & SETTLEMENT ============================ */
/* ---- shared finance helpers ---- */
function m2(n){ return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function txnCatIc(c){ return {course:'cohorts',interview:'video',unlock:'store',payout:'bank',placement:'check',refund:'alert'}[c]||'money'; }
function txnCatLbl(c){ return {course:'Course fee',interview:'Interview',unlock:'Unlock',payout:'Payout',placement:'Placement',refund:'Refund'}[c]||c; }
function txnStatusTag(s){ return s==='settled'?tag('Settled','ok'):s==='held'?tag('In progress','ac'):s==='refunded'?tag('Refunded','bad'):tag('Pending','wa'); }
function payStatusTag(s){ return s==='settled'?tag('Settled','ok'):s==='held'?tag('Held','ac'):tag('Review','wa'); }
function invStatusTag(s){ return s==='paid'?tag('Paid','ok'):s==='sent'?tag('Sent','ac'):s==='overdue'?tag('Overdue','bad'):s==='void'?tag('Void','wa'):tag('Draft','wa'); }
function refStatusTag(s){ return (s==='approved'||s==='won')?tag(s==='won'?'Won':'Approved','ok'):(s==='requested'||s==='processing')?tag(s==='requested'?'Requested':'Processing','ac'):s==='lost'?tag('Lost','bad'):tag('Declined','wa'); }
function refTypeIc(t){ return t==='Refund'?'alert':'scale'; }
function finAgg(){
  var T=DB.TXNS;
  var grossIn=T.filter(function(t){return t.dir==='in'&&t.status!=='blocked';}).reduce(function(a,t){return a+t.amt;},0);
  var held=T.filter(function(t){return t.status==='held';}).reduce(function(a,t){return a+t.amt;},0);
  var settledIn=T.filter(function(t){return t.dir==='in'&&t.status==='settled';}).reduce(function(a,t){return a+t.amt;},0);
  var payoutsOut=T.filter(function(t){return t.cat==='payout';}).reduce(function(a,t){return a+t.amt;},0);
  var refundsOut=T.filter(function(t){return t.cat==='refund';}).reduce(function(a,t){return a+t.amt;},0);
  var procFees=T.reduce(function(a,t){return a+(t.fee||0);},0);
  var interviewGross=T.filter(function(t){return t.cat==='interview'&&t.status!=='blocked';}).reduce(function(a,t){return a+t.amt;},0);
  var platformTake=Math.round(interviewGross*0.2), agentEarn=interviewGross-platformTake;
  var courseRev=T.filter(function(t){return t.cat==='course'&&t.dir==='in'&&t.status!=='blocked';}).reduce(function(a,t){return a+t.amt;},0);
  var unlockRev=T.filter(function(t){return t.cat==='unlock'&&t.status!=='blocked';}).reduce(function(a,t){return a+t.amt;},0);
  var blocked=T.filter(function(t){return t.status==='blocked';}).length;
  var payOwed=DB.PAYOUTS.filter(function(p){return p.status==='held';}).reduce(function(a,p){return a+p.net;},0);
  var payReleased=DB.PAYOUTS.filter(function(p){return p.status==='settled';}).reduce(function(a,p){return a+p.net;},0);
  var payReview=DB.PAYOUTS.filter(function(p){return p.status==='review';}).length;
  var invBilled=DB.INVOICES.filter(function(i){return i.status!=='draft'&&i.status!=='void';}).reduce(function(a,i){return a+i.amount;},0);
  var invCollected=DB.INVOICES.filter(function(i){return i.status==='paid';}).reduce(function(a,i){return a+i.amount;},0);
  var invOutstanding=DB.INVOICES.filter(function(i){return i.status==='sent'||i.status==='overdue';}).reduce(function(a,i){return a+i.amount;},0);
  var invOverdue=DB.INVOICES.filter(function(i){return i.status==='overdue';}).reduce(function(a,i){return a+i.amount;},0);
  var refOpen=DB.REFUNDS.filter(function(r){return r.status==='requested'||r.status==='processing';}).length;
  var platformNet=courseRev+unlockRev+platformTake-refundsOut;
  return {grossIn:grossIn,held:held,settledIn:settledIn,payoutsOut:payoutsOut,refundsOut:refundsOut,procFees:procFees,
    interviewGross:interviewGross,platformTake:platformTake,agentEarn:agentEarn,courseRev:courseRev,unlockRev:unlockRev,blocked:blocked,
    payOwed:payOwed,payReleased:payReleased,payReview:payReview,invBilled:invBilled,invCollected:invCollected,invOutstanding:invOutstanding,invOverdue:invOverdue,refOpen:refOpen,platformNet:platformNet};
}
function finBar(label,valTxt,pct,cls){ return '<div class="blab"><span>'+esc(label)+'</span><span>'+valTxt+'</span></div><div class="bar"><i'+(cls?' class="'+cls+'"':'')+' style="width:'+Math.max(3,Math.round(pct))+'%"></i></div><div style="height:12px"></div>'; }
function finFunnel(){
  var f=finAgg();
  var steps=[['Collected',f.grossIn,'money'],['Held in progress',f.held,'clock'],['Released to agents',f.payoutsOut,'bank'],['Net to platform',f.platformNet,'check']];
  var max=Math.max.apply(null,steps.map(function(s){return s[1];}).concat([1]));
  return steps.map(function(s){return '<div class="li"><div class="dot">'+I(s[2])+'</div><div class="f1"><div class="blab" style="margin:0"><span style="font-weight:600">'+s[0]+'</span><span class="mono">'+money(s[1])+'</span></div><div class="bar" style="margin-top:5px"><i style="width:'+Math.max(4,Math.round(s[1]/max*100))+'%"></i></div></div></div>';}).join('');
}

/* ============================ CRM & ATTRIBUTION ============================ */
/* A lead is an arrival BEFORE an account exists — landed, took the quiz, saw a
   result, maybe left contact details. Every lead carries where it came from
   (channel + campaign + agent link) and its full touch path, so acquisition can
   be read as a funnel, per-channel, per-campaign, and per-agent, under three
   attribution models. */
var CRM_VALUE=100; /* value credited per converted account (first course fee) — used for attributed revenue */
var LEAD_STAGES=DB.LEAD_STAGES; /* core-script global isn't visible here — read it off the DB bridge */
function leadById(id){ return DB.LEADS.filter(function(x){return x.id===id;})[0]||null; }
function campById(id){ return DB.CAMPAIGNS.filter(function(x){return x.id===id;})[0]||null; }
function chanByK(k){ return DB.CHANNELS.filter(function(x){return x.k===k;})[0]||null; }
function crmSourceIcon(s){ var c=chanByK(s); return c?c.icon:'link'; }
function iconText(ic,txt){ return '<span style="display:inline-flex;align-items:center;gap:7px;min-width:0"><span style="flex:0 0 auto;opacity:.72;display:inline-flex">'+I(ic)+'</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(txt)+'</span></span>'; }
function crmSourceCell(s){ return iconText(crmSourceIcon(s), s); }
function agentCell(name){ return name&&name!=='—'?iconText('agent',name):'<span class="sub">Direct</span>'; }
function leadStageTag(s){ var m={'Quiz done':'ac','Result revealed':'ac','Contact captured':'wa','Converted':'ok','Lost':'bad'}; return tag(s, m[s]||''); }
function campStatusTag(s){ return s==='active'?tag('Active','ok'):s==='paused'?tag('Paused','wa'):s==='ended'?tag('Ended'):tag('Draft','ac'); }
function pctOf(a,b){ return b?Math.round(a/b*100):0; }
function crmAgg(){
  var C=DB.CHANNELS;
  var arrivals=C.reduce(function(a,c){return a+c.arrivals;},0);
  var quiz=C.reduce(function(a,c){return a+c.quizDone;},0);
  var conv=C.reduce(function(a,c){return a+c.converted;},0);
  var spend=C.reduce(function(a,c){return a+c.spend;},0);
  var best=C.slice().sort(function(a,b){return (b.converted/b.arrivals)-(a.converted/a.arrivals);})[0];
  return {arrivals:arrivals,quiz:quiz,conv:conv,spend:spend,rev:conv*CRM_VALUE,best:best,convRate:pctOf(conv,arrivals),cpa:conv?Math.round(spend/conv):0};
}
/* recent new-lead volume trend — reuses the platform's date-range picker (leadsFrom/leadsTo) */
function crmTrendCard(){
  var s=LEADS_SERIES.filter(function(p){return p.d>=leadsFrom&&p.d<=leadsTo;});
  if(!s.length) s=LEADS_SERIES.slice(-1);
  var data=s.map(function(p){return {l:fmtDateShort(p.d),v:p.v};});
  var sum=s.reduce(function(a,p){return a+p.v;},0), first=s[0].v, last=s[s.length-1].v, arrow=last>=first?'▲':'▼';
  var body='<div class="sub" style="margin:-2px 0 12px"><b>'+sum+'</b> leads · '+fmtDateShort(leadsFrom)+' – '+fmtDateShort(leadsTo)+' · '+arrow+' '+first+'→'+last+'</div>'+chLine(data,'leads');
  var dates='<div class="ad-datefilter">'+leadsDateField('from',leadsFrom)+'<span class="ad-df-dash">–</span>'+leadsDateField('to',leadsTo)+'</div>';
  return card('New leads', body, dates);
}
/* channel share donut + per-channel bars */
function crmSourceBars(){
  var C=DB.CHANNELS.slice().sort(function(a,b){return b.arrivals-a.arrivals;});
  var max=Math.max.apply(null,C.map(function(c){return c.arrivals;}).concat([1]));
  return C.map(function(c){return ebar(c.label, String(c.arrivals), c.arrivals/max*100);}).join('');
}

V['crm/campaigns']=function(){

  var conv=CM.reduce(function(a,c){return a+c.conv;},0);
  var blendedCPA=conv?Math.round(spend/conv):0;
  var running=CM.filter(function(c){return c.status!=='draft';}).slice().sort(function(a,b){return b.spend-a.spend;});
  var maxSpend=Math.max.apply(null,running.map(function(c){return c.spend;}).concat([1]));

V['system/audit']=function(){
  var A=DB.AUDIT;
  var high=A.filter(function(a){return a.sev==='high';}).length;
  var cfgSec=A.filter(function(a){return a.cat==='Configuration'||a.cat==='Security';}).length;
  var dataRights=A.filter(function(a){return a.cat==='Data rights';}).length;
  var byMod={}; A.forEach(function(a){byMod[a.mod]=(byMod[a.mod]||0)+1;});
  var modRows=Object.keys(byMod).sort(function(x,y){return byMod[y]-byMod[x];});
  var modMax=Math.max.apply(null,modRows.map(function(k){return byMod[k];}).concat([1]));
  var byCat={}; A.forEach(function(a){var c=auditCat(a); byCat[c]=(byCat[c]||0)+1;});
  var catSeg=Object.keys(byCat).sort(function(x,y){return byCat[y]-byCat[x];}).map(function(k,i){return {l:k,v:byCat[k],c:CHART_INK[i%CHART_INK.length]};});
  return pageHead('Audit Log','A Super Admin can do anything, so everything is logged — every level change, payout, approval, permission edit and data-rights action lands here. The log is immutable and retained for compliance. Click any entry for the full record.',
     '<button class="btn sm" data-act="toast:Audit log exported">'+I('dl')+' Export</button>')
   +talCard('Everything a Super Admin does is logged.','This period the log recorded '+high+' high-severity action'+(high===1?'':'s')+' — feature-flag and permission changes, an early payout release and an API-key rotation. Entries cannot be edited or deleted.',[{l:'What gets logged?',ask:'What gets written to the audit log?'}],true)
   +kpis([
     {l:'Total events', v:A.length, f:'this period', ic:'doc'},
     {l:'High severity', v:high, f:'overrides & config', ic:'alert'},
     {l:'Config & security', v:cfgSec, f:'flags · perms · keys', ic:'lock'},
     {l:'Data-rights actions', v:dataRights, f:'exports · erasure · consent', ic:'scale'}
   ],'Audit at a glance')
   +subhead('Activity')
   +'<div class="g2 ad-stretch">'
   +'<div>'+card('Events by module', modRows.map(function(k){return finBar(k, String(byMod[k]), byMod[k]/modMax*100);}).join(''))+'</div>'
   +'<div>'+card('Events by category', chDonut(catSeg,true))+'</div>'
   +'</div>'
   +subhead('All log entries', A.length)
   +filterTable({key:'audit', data:A, placeholder:'Search actor, action or object…', icon:'doc', emptyTitle:'No log entries match',
     columns:[{t:'When',k:'when',w:'118px'},{t:'Actor',k:'who',w:'150px'},{t:'Action',k:'act'},{t:'Category',k:'cat',w:'130px'},{t:'Module',k:'mod',w:'126px'},{t:'Severity',k:'sev',w:'104px'}],
     searchText:function(a){return a.who+' '+a.act+' '+a.obj+' '+a.mod+' '+auditCat(a);},
     filters:[
       {key:'mod', all:'All modules', get:function(a){return a.mod;}},
       {key:'cat', all:'All categories', get:function(a){return auditCat(a);}},
       {key:'sev', all:'All severities', get:function(a){return a.sev||'info';}, fmt:function(v){return v.charAt(0).toUpperCase()+v.slice(1);}},
       {key:'who', all:'All actors', get:function(a){return a.who;}}
     ],
     row:function(a){return {_act:'audrec:'+A.indexOf(a), when:'<span class="sub">'+esc(a.when)+'</span>', who:userCell(a.who,a.role||''), act:'<span class="nm">'+esc(a.act)+'</span><div class="sub">'+esc(a.obj)+'</div>', cat:tag(auditCat(a)), mod:'<span class="sub">'+esc(a.mod)+'</span>', sev:sevTag(a.sev)};},
     foot:function(n,t){return 'Showing '+n+' of '+t+' entr'+(t===1?'y':'ies')+' · immutable, retained for compliance';}});
};

function toggleUserPermRole(id, rk){

    if(DB.isFullAccess(rk)){ d.roles=[rk]; }
    else {
      if(d.roles.some(function(k){return DB.isFullAccess(k);})) d.roles=[];
      if(rk==='agent'){ var ci=d.roles.indexOf('candidate'); if(ci>=0) d.roles.splice(ci,1); }
      if(rk==='candidate'){ var ai=d.roles.indexOf('agent'); if(ai>=0) d.roles.splice(ai,1); }
      d.roles.push(rk);
    }
  }
  renderUserPerms();
}

function handleWiz(cmd,arg){
  if(cmd==='reset'){ wiz=freshWiz(); openWiz(); return; }
  if(cmd==='close'){ wizOpen=false; wiz=freshWiz(); U.closeDrawer(); return; }
  if(cmd==='mode'){ readWiz(); wiz.mode=arg; openWiz(); return; }
  if(cmd==='role'){ var ri=wiz.roles.indexOf(arg);
     if(ri>=0){ wiz.roles.splice(ri,1); }
     else { wiz.roles.push(arg);
       if(arg==='agent'){ var ci=wiz.roles.indexOf('candidate'); if(ci>=0){ wiz.roles.splice(ci,1); toast('A Talent Agent cannot also be a Candidate','b'); } }
       if(arg==='candidate'){ var ai=wiz.roles.indexOf('agent'); if(ai>=0){ wiz.roles.splice(ai,1); toast('A Candidate cannot also be a Talent Agent','b'); } }
     }
     openWiz(); return; }
  if(cmd==='back'){ readWiz(); wiz.step=Math.max(0,wiz.step-1); openWiz(); return; }
  if(cmd==='next'){ readWiz();
     if(wiz.step===0){ if(wiz.mode==='new'&&(!wiz.person.name||!wiz.person.email)){ toast('Enter a name and email','b'); return; } if(wiz.mode==='existing'&&!wiz.existingId) wiz.existingId=DB.USERS[0].id; }
     if(wiz.step===1&&!wiz.roles.length){ toast('Choose a role','b'); return; }
     wiz.step=Math.min(2,wiz.step+1); openWiz(); return; }
  if(cmd==='finish'){
     var name= wiz.mode==='new'?wiz.person.name:DB.USER_BY_ID[wiz.existingId].name;
     if(wiz.mode==='new'){
       var id='u'+(DB.USERS.length+1);
       DB.USERS.push({id:id,name:wiz.person.name,email:wiz.person.email,roles:wiz.roles.slice(),level:'—',status:'pending',joined:'Just now',origin:'internal',last:'invited',internal:wiz.roles.some(function(k){return DB.ROLE_BY_K[k].kind==='internal';})});
       DB.USER_BY_ID[id]=DB.USERS[DB.USERS.length-1];
     } else {
       var u=DB.USER_BY_ID[wiz.existingId]; var k=wiz.roles[0];
       if(DB.isFullAccess(k)){
         /* full access supersedes every other role — it becomes the account's only role */
         u.roles=[k];
       } else if(u.roles.some(function(r){return DB.isFullAccess(r);})){
         toast(esc(name)+' holds a full-access role (Admin / Super Admin), which can’t be combined with another role','b'); return;
       } else if(u.roles.indexOf(k)<0){
         u.roles.push(k);
       }
     }
     DB.AUDIT.unshift({when:'Just now',who:'Derek Sole',act:wiz.mode==='new'?'Invited user':'Added role(s)',obj:name+' — '+wiz.roles.map(function(k){return DB.ROLE_BY_K[k].short;}).join(', '),mod:'Users'});
     toast(wiz.mode==='new'?('Invite sent to '+name):('Roles added to '+name),'g');
     wiz=freshWiz();
     wizOpen=false; U.closeDrawer(); reView();
     return;
  }
}

/* --- template builder (multi-step drawer) --- */

function openTplEdit(id){ var t=DB.TPL_BY_ID[id]; if(!t) return;

function tplSessions(){
