function readTpl(){
  if(tpl.step===0){
    var n=document.getElementById('tpl_name'); if(n) tpl.name=n.value;
    var tk=document.getElementById('tpl_track'); if(tk) tpl.track=tk.getAttribute('data-value');
    var lv=document.getElementById('tpl_lvl'); if(lv) tpl.lvlNum=+lv.getAttribute('data-value')||1;
    var co=document.getElementById('tpl_course'); if(co) tpl.courseId=co.getAttribute('data-value');
  }
  if(tpl.step===1){
    tpl.sessions.forEach(function(s){
      var t=document.querySelector('[data-sess="title:'+s.id+'"]'); if(t) s.title=t.value;
      var w=document.querySelector('[data-sess="week:'+s.id+'"]'); if(w) s.week=+w.value||s.week;
      var d=document.querySelector('[data-sess="dur:'+s.id+'"]'); if(d) s.dur=+d.value||s.dur;
      var m=document.getElementById('sessmode_'+s.id); if(m) s.mode=m.getAttribute('data-value');
    });
  }
}
function handleTpl(cmd,arg){
  if(cmd==='close'){ var wasResume=ncoh&&ncoh.resume; tpl=null; U.closeDrawer(); if(wasResume){ ncoh.resume=false; openNcoh(); } return; }
  if(cmd==='back'){ readTpl(); tpl.step=Math.max(0,tpl.step-1); openTpl(); return; }
  if(cmd==='sessadd'){ readTpl(); var last=tpl.sessions[tpl.sessions.length-1]; tpl.sessions.push({id:'ns'+(tplSeq++),title:'',week:last?Math.min(13,last.week+1):1,dur:60,mode:'Live'}); openTpl(); return; }
  if(cmd==='sessdel'){ readTpl(); tpl.sessions=tpl.sessions.filter(function(s){return s.id!==arg;}); openTpl(); return; }
  if(cmd==='next'){ readTpl();
    if(tpl.step===0 && !tpl.name.trim()){ toast('Name the template','b'); return; }
    if(tpl.step===1 && !tpl.sessions.length){ toast('Add at least one session','b'); return; }
    tpl.step=Math.min(2,tpl.step+1); openTpl(); return; }
  if(cmd==='finish'){ readTpl();
    if(!tpl.name.trim()){ toast('Name the template','b'); return; }
    var lvl=trackLevel(tpl.track,tpl.lvlNum);
    var sess=tpl.sessions.map(cleanSess).sort(function(a,b){return a.week-b.week;});
    var savedId;
    if(tpl.id && DB.TPL_BY_ID[tpl.id]){ var t=DB.TPL_BY_ID[tpl.id]; t.name=tpl.name.trim(); t.track=tpl.track; t.level=lvl; t.courseId=tpl.courseId; t.sessions=sess; savedId=tpl.id; DB.AUDIT.unshift({when:'Just now',who:'Derek Sole',act:'Updated cohort template',obj:t.name+' — '+lvl,mod:'Cohorts'}); toast('Template updated','g'); }
    else { var nid='tpl'+(DB.CO_TEMPLATES.length+1),loop=2; while(DB.TPL_BY_ID[nid]){nid='tpl'+(DB.CO_TEMPLATES.length+loop);loop++;} var nt={id:nid,name:tpl.name.trim(),track:tpl.track,level:lvl,courseId:tpl.courseId,status:'published',used:0,sessions:sess}; DB.CO_TEMPLATES.push(nt); DB.TPL_BY_ID[nid]=nt; savedId=nid; DB.AUDIT.unshift({when:'Just now',who:'Derek Sole',act:'Created cohort template',obj:nt.name+' — '+lvl,mod:'Cohorts'}); toast('Template created','g'); }
    var resume=ncoh&&ncoh.resume;
    tpl=null; U.closeDrawer();
    if(resume){ ncoh.resume=false; ncoh.templateId=savedId; ncoh.step=0; openNcoh(); }
    else reView();
    return;
  }
}
function dupTpl(id){ var t=DB.TPL_BY_ID[id]; if(!t) return; var nid='tpl'+(DB.CO_TEMPLATES.length+1),loop=2; while(DB.TPL_BY_ID[nid]){nid='tpl'+(DB.CO_TEMPLATES.length+loop);loop++;}
  var nt={id:nid,name:t.name+' (copy)',track:t.track,level:t.level,courseId:t.courseId,status:'draft',used:0,sessions:t.sessions.map(function(s){return {id:nid+'_'+s.id,title:s.title,week:s.week,dur:s.dur,mode:s.mode};})};

function readNcoh(){
  if(ncoh.step===1){
    var n=document.getElementById('ncoh_name'); if(n) ncoh.name=n.value;
    var s=document.getElementById('ncoh_start'); if(s) ncoh.start=s.value;
    var l=document.getElementById('ncoh_leader'); if(l) ncoh.leader=l.getAttribute('data-value');
  }
  if(ncoh.step===2){
    var t=DB.TPL_BY_ID[ncoh.templateId]; if(t) t.sessions.forEach(function(sx){
      var d=document.querySelector('[data-time="date:'+sx.id+'"]'); var tm=document.querySelector('[data-time="time:'+sx.id+'"]');
      if(d||tm) ncoh.times[sx.id]={date:(d?d.value:''),time:(tm?tm.value:'')};
    });
  }
}
function handleNcoh(cmd,arg){
  if(cmd==='open'){ ncoh=freshNcoh(); openNcoh(); return; }
  if(cmd==='from'){ ncoh=freshNcoh(); ncoh.templateId=arg; ncoh.step=1; openNcoh(); return; }
  if(cmd==='close'){ ncoh=null; U.closeDrawer(); return; }
  if(cmd==='pick'){ readNcoh(); ncoh.templateId=arg; openNcoh(); return; }
  if(cmd==='newtpl'){ if(!ncoh) ncoh=freshNcoh(); readNcoh(); ncoh.resume=true; tpl=freshTpl(); openTpl(); return; }
  if(cmd==='back'){ readNcoh(); ncoh.step=Math.max(0,ncoh.step-1); openNcoh(); return; }
  if(cmd==='next'){ readNcoh();
    if(ncoh.step===0 && !ncoh.templateId){ toast('Choose a template','b'); return; }
    if(ncoh.step===1){ if(!ncoh.name.trim()){ toast('Name the cohort','b'); return; } if(!ncoh.start){ toast('Set a start date','b'); return; } }
    ncoh.step=Math.min(3,ncoh.step+1); openNcoh(); return; }
  if(cmd==='finish'){ readNcoh();
    var t=DB.TPL_BY_ID[ncoh.templateId]; if(!t){ toast('Choose a template','b'); return; }
    var nid='ch'+(DB.COHORTS.length+1),loop=2; while(DB.COHORTS.filter(function(c){return c.id===nid;}).length){nid='ch'+(DB.COHORTS.length+loop);loop++;}
    DB.COHORTS.push({id:nid,name:ncoh.name.trim(),track:t.track,level:t.level,templateId:t.id,leader:ncoh.leader,size:0,week:0,day:0,start:ncoh.start,status:'draft',sessionTimes:ncoh.times});
    t.used=(t.used||0)+1;
    DB.AUDIT.unshift({when:'Just now',who:'Derek Sole',act:'Created cohort',obj:ncoh.name.trim()+' — from '+t.name,mod:'Cohorts'});
    toast('Cohort created · '+ncoh.name.trim(),'g');
    ncoh=null; U.closeDrawer(); U.go('cohorts/cohorts'); reView(); return;
  }
}

    toast('Vetting call scheduled with '+a.name.split(' ')[0],'g'); reView(); return;
  }
  if(cmd==='reset'){ a.interview=null; a.stage='checks'; reView(); return; }
  if(cmd==='cancel'){ a.interview=null; a.stage='checks'; adAudit('Cancelled vetting call', a.name, 'Vetting & Approvals'); toast('Call cancelled'); reView(); return; }
  if(cmd==='done'){ if(a.interview) a.interview.done=true; adAudit('Completed vetting call', a.name, 'Vetting & Approvals'); toast('Call marked complete — ready for a decision','g'); reView(); return; }
}
function appHire(id){
  var a=DB.APPLICATIONS.filter(function(x){return x.id===id;})[0]; if(!a) return;
  a.decision='hired'; a.status='approved'; a.stage='decided';
  adAudit('Approved agent application', a.name, 'Vetting & Approvals');
  toast(a.name+' approved as a Talent Agent','g'); reView();
}
function appRejectOpen(id){
  var a=DB.APPLICATIONS.filter(function(x){return x.id===id;})[0]; if(!a) return;
  U.openModal('<div class="mh"><h3>Reject '+esc(a.name)+'?</h3><button class="x" data-mclose>&times;</button></div>'
    +'<div class="mb"><p class="sub" style="margin:-2px 0 12px">Give a reason — it’s recorded on the application and shared with the applicant.</p>'
    +'<textarea class="inp" id="apRejReason" rows="3" placeholder="Why is this application being rejected?"></textarea></div>'
    +'<div class="mf"><button class="btn" data-mclose>Cancel</button><button class="btn dg" onclick="window.__ADMIN_ACTS._router(&#39;appreject:save:'+id+'&#39;)">'+I('trash')+' Reject application</button></div>');
}
function appRejectSave(id){
  var a=DB.APPLICATIONS.filter(function(x){return x.id===id;})[0]; if(!a) return;
  var r=((document.getElementById('apRejReason')||{}).value||'').trim();
  if(!r){ toast('Add a reason first','b'); return; }
  a.decision='rejected'; a.rejectReason=r; a.status='rejected'; a.stage='decided';
  adAudit('Rejected agent application', a.name+' — '+r, 'Vetting & Approvals');
  U.closeModal(); toast(a.name+' rejected'); reView();
}
/* ---- Super Admin override: a candidate's assigned level (the human decision wins, always logged) ---- */
var LVL_LETTER={Explorer:'E',Builder:'B',Trailblazer:'T'};
var ovDraft=null;
function ovOpen(id){ var c=DB.CANDS.filter(function(x){return x.id===id;})[0]; if(!c) return; ovDraft={id:id, level:c.level, reason:''}; ovRender(); }
function ovCapture(){ if(!ovDraft) return; var r=document.getElementById('ovReason'); if(r) ovDraft.reason=r.value; }
function ovPick(id, lvl){ ovCapture(); if(ovDraft&&ovDraft.id===id){ ovDraft.level=lvl; } ovRender(); }
function ovRender(){
  var c=DB.CANDS.filter(function(x){return x.id===ovDraft.id;})[0]; if(!c) return;
  var letter=LVL_LETTER[c.bucket]||'E';
  var opts=[1,2,3,4,5].map(function(n){return letter+n;});
  var changed=ovDraft.level!==c.level;
  var body='<div class="ad-ov-badge">'+I('shield')+' Super Admin override</div>'
    +'<p class="sub" style="margin:12px 0 0;line-height:1.6">The Reviewer set this candidate at <b>'+esc(c.level)+'</b>. As Super Admin you can override that decision — your call wins over the AI and the Reviewer, and the change is written to the audit log.</p>'
    +'<label class="fl" style="margin-top:16px">New level — '+esc(c.bucket)+'</label>'
    +'<div class="row" style="gap:7px">'+opts.map(function(o){return '<button class="btn '+(o===ovDraft.level?'p':'')+'" data-act="ovlvl:pick:'+c.id+':'+o+'">'+o+'</button>';}).join('')+'</div>'
    +'<label class="fl" style="margin-top:16px">Reason for the override'+(changed?'<span class="req">*</span>':'')+'</label>'
    +'<textarea class="inp" id="ovReason" placeholder="Why override the assigned level? Recorded on the decision.">'+esc(ovDraft.reason||'')+'</textarea>';
  U.openDrawer('Override level — '+esc(c.name), body,
    '<button class="btn" data-mclose>Cancel</button><button class="btn p" data-act="ovlvl:save:'+c.id+'">'+I('shield')+' Apply override</button>', 'md');
}
function ovSave(id){
  ovCapture(); var c=DB.CANDS.filter(function(x){return x.id===id;})[0]; if(!c||!ovDraft) return;
  if(ovDraft.level===c.level){ toast('Pick a different level to override','b'); return; }
  if(!(ovDraft.reason&&ovDraft.reason.trim())){ toast('Add a reason for the override','b'); var r=document.getElementById('ovReason'); if(r) r.focus(); return; }
  var old=c.level; c.level=ovDraft.level;
  adAudit('Overrode candidate level', c.name+' · '+old+' → '+c.level+' — '+ovDraft.reason.trim(), 'Candidates');
  ovDraft=null; U.closeDrawer(); toast(c.name+' overridden to '+c.level,'g'); reView();
}
/* ---- Super Admin action: force-release a payout held in escrow ---- */
function payReleaseOpen(id){
  var p=DB.PAYOUTS.filter(function(x){return x.id===id;})[0]; if(!p) return;
  confirmDelete('Release payout to '+esc(p.agent)+'?',
    '<p class="sub" style="margin:0">This releases '+money(p.net)+' from escrow to the agent now, ahead of the normal settlement cycle. Recorded in the audit log.</p>',
    'payrelease:ok:'+id, 'Release '+money(p.net));
}
function payReleaseOk(id){
  var p=DB.PAYOUTS.filter(function(x){return x.id===id;})[0]; if(!p) return;
  p.status='settled'; p.when='Released early';
  adAudit('Released payout early', p.agent+' · '+money(p.net), 'Finance & Settlement');
  U.closeModal(); U.closeDrawer(); toast(money(p.net)+' released to '+p.agent.split(' ')[0],'g'); reView();
}
/* ---- invoices: mark an outstanding invoice paid ---- */
function invPaidOpen(id){
  var iv=DB.INVOICES.filter(function(x){return x.id===id;})[0]; if(!iv) return;
  confirmDelete('Mark '+esc(iv.num)+' paid?',
    '<p class="sub" style="margin:0">Records '+money(iv.amount)+' from <b>'+esc(iv.party)+'</b> as collected and closes the invoice. Written to the audit log.</p>',
    'invpaid:ok:'+id, 'Mark paid');
}
function invPaidOk(id){
  var iv=DB.INVOICES.filter(function(x){return x.id===id;})[0]; if(!iv) return;
  iv.status='paid'; iv.method=iv.method==='—'?'Manual':iv.method;
  adAudit('Marked invoice paid', iv.num+' · '+iv.party+' · '+money(iv.amount), 'Finance & Settlement');
  U.closeModal(); U.closeDrawer(); toast(iv.num+' marked paid','g'); reView();
}
/* ---- refunds & disputes: approve or decline a request ---- */
function refDecideOpen(id, mode){
  var r=DB.REFUNDS.filter(function(x){return x.id===id;})[0]; if(!r) return;
  if(mode==='approve'){
    confirmDelete('Approve refund to '+esc(r.party)+'?',
      '<p class="sub" style="margin:0">Refunds '+money(r.amount)+' against '+esc(r.txnRef)+' back to the original payment method. This can’t be undone.</p>',
      'refappr:ok:'+id, 'Approve refund');
  } else {
    confirmDelete('Decline refund for '+esc(r.party)+'?',
      '<p class="sub" style="margin:0">Declines the '+money(r.amount)+' request against '+esc(r.txnRef)+'. The requester is notified. Recorded in the audit log.</p>',
      'refdecl:ok:'+id, 'Decline request');
  }
}
function refDecideOk(id, status){
  var r=DB.REFUNDS.filter(function(x){return x.id===id;})[0]; if(!r) return;
  r.status=status;
  adAudit(status==='approved'?'Approved refund':'Declined refund', r.party+' · '+money(r.amount)+' · '+r.txnRef, 'Finance & Settlement');
  U.closeModal(); toast(status==='approved'?money(r.amount)+' refunded to '+r.party.split(' ')[0]:'Refund declined', status==='approved'?'g':''); reView();
}
/* ---- fee editor: a working drawer that updates the fee table + logs it ---- */
var feeDraft=null;
function feeEditOpen(k){
  var fee=DB.FEES.filter(function(x){return x.k===k;})[0]; if(!fee) return;
  feeDraft={k:k, v:(fee.v==='Not set'?'':fee.v), note:fee.note};
  var body='<div class="ad-ov-badge">'+I('money')+' Fee editor</div>'
    +'<p class="sub" style="margin:12px 0 0;line-height:1.6">Editing <b>'+esc(fee.t)+'</b>. The new value applies to transactions from now on, and the change is written to the audit log.</p>'
    +'<label class="fl" style="margin-top:16px">Value<span class="req">*</span></label>'
    +'<input class="inp" id="feeVal" placeholder="e.g. $250 or 15% of salary" value="'+esc(feeDraft.v)+'">'
    +'<label class="fl" style="margin-top:15px">Applies</label>'
    +'<input class="inp" id="feeUnit" value="'+esc(fee.unit||'')+'" placeholder="e.g. per hire">'
    +'<label class="fl" style="margin-top:15px">Note</label>'
    +'<textarea class="inp" id="feeNote" rows="2" placeholder="What this fee covers…">'+esc(feeDraft.note||'')+'</textarea>'
    +(k==='placement'?'<div class="note b mt8">The placement fee is undecided in the source calls — % of salary, flat, or tiered were all floated. Setting it here issues the two draft placement invoices.</div>':'');
  U.openDrawer('Set fee — '+esc(fee.t), body,
    '<button class="btn" data-mclose>Cancel</button><button class="btn p" data-act="feeset:save:'+k+'">'+I('check')+' Save fee</button>', 'md');
}
function feeEditSave(k){
  var fee=DB.FEES.filter(function(x){return x.k===k;})[0]; if(!fee) return;
  var v=((document.getElementById('feeVal')||{}).value||'').trim();
  var unit=((document.getElementById('feeUnit')||{}).value||'').trim();
  var note=((document.getElementById('feeNote')||{}).value||'').trim();
  if(!v){ toast('Enter a value','b'); var el=document.getElementById('feeVal'); if(el) el.focus(); return; }
  var old=fee.v; fee.v=v; if(unit) fee.unit=unit; if(note) fee.note=note; fee.state='set'; fee.effective='Just now'; fee.by='Derek Sole';
  DB.FEE_HISTORY.unshift({when:'Just now', who:'Derek Sole', what:'Set '+fee.t.toLowerCase(), detail:v});
  adAudit('Updated fee', fee.t+' · '+(old==='Not set'?'':old+' → ')+v, 'Finance & Settlement');
  if(k==='placement'){ DB.INVOICES.forEach(function(iv){ if(iv.status==='draft'&&iv.type==='Placement fee'){ iv.status='sent'; } }); }
  feeDraft=null; U.closeDrawer(); toast(fee.t+' updated','g'); reView();
}

})();

</script>
