<title>TalentNext — Super Admin portal</title>

<!-- ==========================================================================
     THE DESIGN SYSTEM. Two files, fonts embedded in the first, so this is the
     whole dependency — the same link the Talent Agent portal carries. Serve
     over http (a browser blocks a linked stylesheet on file://):
         python3 -m http.server 8802 --bind 127.0.0.1
     Every class used below is a real class from design-system/gallery.html.
     The <style> block is PROTOTYPE CHROME AND NOTHING ELSE (the device frame,
     the viewport picker, the wordmark size, a toast host) — no product rule.
     ========================================================================== -->
<link rel="stylesheet" href="design-system/talentnext-ds.css?b=a7e5e391">

<style>
/* ==========================================================================
   PROTOTYPE CHROME ONLY — not product design.

   `.pt-bar`, `.pt-stage`, `.pt-fit` and `.device` all come from the design
   system, including `container-type:inline-size; container-name:app` on
   `.device`, which is the host requirement — nothing in this system responds
   to the browser window, every breakpoint is `@container app (min-width:…)`.

   The mark: `TN_MARK` carries a viewBox and no size, so the bar says how big.
   The admin portal has no stage picker — a super admin sees one live platform,
   not a set of onboarding snapshots the way the agent portal does — so the bar
   holds the frame (viewport) picker and the Reset button only.
   ========================================================================== */
.pt-bar img{height:18px;width:auto;flex:none}

/* THE STAGE FOOT ROOM GOES WITH THE STAGE PICKER THIS FILE DOES NOT HAVE.
   `.pt-stage` is `padding:var(--s06) var(--s05) var(--s10)` in the design
   system — 64px at the foot for a caption row, plus a 16px flex gap. This file
   prints neither, so both reserved space for elements that are not here. Set to
   an even margin, same as the agent portal's chrome states for the same reason. */
.pt-stage{padding-bottom:var(--s05);gap:0}

/* THE TOAST HOST is prototype chrome: a fixed layer for the transient
   confirmations the source portal shows on cosmetic actions (reminder sent,
   receipt downloaded). Each toast is the design system's own `.note` component —
   no colour or type is stated here, only where the stack sits. It is appended
   inside `.device`, whose `container-type` makes it the containing block for a
   fixed child, so a toast is clipped to the frame it belongs to (the same
   mechanism the agent portal's steps popup note records). */
.pt-toasts{position:fixed;left:50%;bottom:var(--s06);transform:translateX(-50%);
  z-index:60;display:flex;flex-direction:column;gap:var(--s03);width:min(360px,86%);
  pointer-events:none}
.pt-toasts .note{margin:0;box-shadow:0 6px 24px rgba(17,17,17,.12);background:var(--pure-white,#fff)}
</style>
<style id="pilot-side-sheet">
/* PILOT (Maryam, 13 Sep 2026) — a record form opens as the candidate portal's
   IN-FLOW `.peek` column (§44), NOT a centre modal and NOT an overlay: the
   content column narrows and the panel takes the freed space beside it, no dim.
   `render()` places `sidePeek()` as a `.peek.peek-form` column in `.shell-body`
   after `.view-col`, and adds `peek` to `data-shown` so §44's `.main`
   margin-drop fires; `sheetView()` renders nothing for these. The panel reuses
   the sheet's `.sheet-h`/`.sheet-b`/`.sheet-f` inside the `.peek` shell so ALL
   the form logic is untouched — `readForm`, the `.fdd` dropdown's `.sheet-b`
   overflow toggle, and the two-step `_pending` flow. §44 already ships the
   column, the mobile-overlay fallback and the margin-drop through the design
   system; only these two panel-fit tweaks are portal-local. Scoped to Add/Edit
   User (`sideSheet`); promote to a build layer if approved. */
.peek.peek-form .sheet-b{flex:1 1 auto}
.peek.peek-form .sheet-f{justify-content:space-between; border-top:1px solid var(--rule)}

/* THE PANEL HEADING IS THE SECTION-HEADING SIZE (Maryam, 13 Sep 2026: "the
   heading of the slider should be the section heading size like how we use it").
   The DS sets `.sheet-h h2` to 18px; here it takes `--t-sec` (16px), the same
   role every `.sec-h` heading uses, at the strong weight. And the heading row's
   air is tighter — the space above "Add a user" and below it (down to the header
   divider) both come down from `--s06` (24) to `--s04` (12). */
.app .peek.peek-form .sheet-h{padding-top:var(--s04); padding-bottom:var(--s04)}
.app .peek.peek-form .sheet-h h2{
  font-size:var(--t-sec-size); line-height:var(--t-sec-lh);
  font-weight:var(--t-w-strong); letter-spacing:var(--t-sec-ls)}

/* THE HELP LINE IS AN INFO BLOCK — a light-grey panel with an info icon on the
   left (Maryam, 13 Sep 2026). `recSheet` wraps the help text in `.sheet-help`;
   this is not panel-scoped, so every record form's help reads the same way. */
.app .sheet-help{
  display:flex; gap:var(--s03); align-items:flex-start;
  margin-top:var(--s05); padding:var(--s04);
  background:var(--surface-2); border:1px solid var(--rule)}
.app .sheet-help .sheet-help-ic{
  flex:none; width:18px; height:18px; margin-top:1px; fill:var(--accent)}
.app .sheet-help .t-desc{margin:0}

/* WIDER PANEL (Maryam, 13 Sep 2026, per the reference red box): the panel takes
   a bit under half the frame and the content column reduces to fit. Overrides
   §44's `.app .peek{width:min(420px,42%)}` — `.app .peek.peek-form` is (0,3,0) vs
   (0,2,0), so it wins; below 900cqw §44 still makes it a full overlay. The -1px
   margin is the seam fix below. `--peek-w` is the panel's width, reused by the
   entrance animation so the two can never drift apart.
   NARROWED A LITTLE (Maryam, 14 Sep 2026: "reduce the width of the right slider
   a little bit") — 40%/720 → 37%/640, so the form reads tighter without losing
   its two-column fields. */
.app .peek.peek-form{--peek-w:min(37%, 640px); width:var(--peek-w); margin-left:-1px}

/* THE ENTRANCE — THE PANEL WALKS IN FROM THE RIGHT AND THE CONTENT NARROWS WITH
   IT (Maryam, 13 Sep 2026: "it should not instantly switch — a smooth slider
   walking in from the right, and the left content window smoothly going left").
   Animating ONE property does both: `margin-right` on the last flex child. At
   `-var(--peek-w)` the panel's width is cancelled, so the content column (flex:1)
   fills the frame and the panel sits just past the right edge (clipped by
   `#device`'s overflow). Easing it to 0 lets the panel's width count again — the
   content reflows narrower every frame while the panel slides into view, one
   push-drawer motion. Keyed on `data-open~="peek"` (this render only, trap 5), so
   it plays on open and never on an incidental re-render; a CSS animation plays on
   a freshly-inserted element, which a transition would not. */
@keyframes peek-walk-in{
  from{margin-right:calc(-1 * var(--peek-w))}
  to{margin-right:0}}
.app[data-open~="peek"] .peek.peek-form{
  animation:peek-walk-in 450ms var(--ease-decelerate) both}

/* THE EXIT — the mirror of the entrance (Maryam, 14 Sep 2026: "the smooth
   interaction with which it was opened should also be applied on closing").
   `data-closing="peek"` is stamped for the one render between the close press and
   the panel's removal (400ms later); the panel walks back out to the right and the
   content column widens with it, the same margin-right motion reversed. */
@keyframes peek-walk-out{
  from{margin-right:0}
  to{margin-right:calc(-1 * var(--peek-w))}}
.app[data-closing~="peek"] .peek.peek-form{
  animation:peek-walk-out 400ms var(--ease-accelerate) both}

/* ONE CLEAN SEAM LINE, CONTENT ATTACHED — NO GAP (Maryam, 13 Sep 2026: "the
   content and the slider need to be attached, no gap between them; the border has
   to look like one line, not two combined lines"). The panel's own `border-left`
   (§44, 1px `--rule`) is the single divider; content sits flush against it. The
   doubling was full-bleed content drawing its OWN border at the seam — the `.cs`
   filter-tab strip's faint per-tab `border-right` dividers (invisible on white,
   but a second hairline beside the panel's), and a bordered control at the
   toolbar's right edge. Two fixes, no gutter:
     1. switch the tab dividers off while the panel is open (they are not a
        visible design element), so nothing draws a line a few px inside the seam;
     2. pull the panel 1px onto the content edge (`margin-left:-1px`, above) so any
        edge-control border coincides with the panel border instead of sitting
        beside it — one line, still visually attached. */
.app[data-shown~="peek"] .cs button{border-right-color:transparent}
</style>
<style id="admin-row-hover">
/* A CLICKABLE TABLE ROW (`tr.clk`) LIGHTS ITS FIRST-COLUMN NAME ON HOVER
   (Maryam, 13 Sep 2026: "the rows are clickable, so on hover I want the black
   text in the first column to change to the accent — only the black text, not
   the grey sub-line"). The first cell holds two kinds of text: the name (the
   black anchor) and the `.t-caption` sub-line (the grey email). Colouring the
   whole first `td` accent recolours the name only — `.t-caption` carries its own
   colour rule, which beats the inherited value, so the sub-line stays grey with
   nothing named here.

   The accent as INK is `--accent-text` (#c2332d, AA on white), per DESIGN.md §3
   — `--accent` on words is reserved for stated exceptions.

   WRITTEN AS A PLAIN `:hover` HERE ON PURPOSE. The admin portal links the design
   system, whose `:hover`s are disarmed (`:where(.__nh)`, trap 6) and never armed
   in this file — so the DS's own `.clk:hover` row wash does not even fire here.
   A portal-local rule fires natively. Admin-only. */
.app .tbl tr.clk{cursor:pointer}
.app .tbl tr.clk:hover td:first-child{color:var(--accent-text)}
/* NO ROW BACKGROUND WASH (Maryam, 13 Sep 2026: "on clicking the menu icon the
   whole row shows this bg, it should not show this"). The DS gives `.clk:active`
   an `--overlay-pressed` grey; pressing anywhere in the row — including the kebab
   — washed the whole row. The row's only hover affordance is the first-column
   name turning accent (above), so the pressed wash is dropped. (0,4,1) beats the
   DS `.clk:active` (0,2,0). */
.app .tbl tr.clk:active{background:transparent}

/* THE ROLES TABLE'S "DEFAULT" CHIP (Maryam, 14 Sep 2026): the one chip on the
   Super Admin row, accent ink on a light-accent ground. `.app` gives it (0,3,0)
   so it beats the base `.tag:not(.brand):not(.acc)` (0,3,0) on order. */
.app .tag.rl-default{background:color-mix(in srgb, var(--accent) 12%, transparent); border-color:transparent; color:var(--accent-text)}
/* `.tag.brand` shipped BLACK-ON-BLACK on the admin (DS gives it a dark ground,
   §63 forces `.tag` ink to near-black and skips `.brand`, so the label was
   invisible — the "Original" marker read as a solid black blob). Give it the same
   readable accent-tint the Default chip uses, admin-scoped. (15 Sep 2026) */
.app .tag.brand{background:color-mix(in srgb, var(--accent) 12%, transparent); border-color:transparent; color:var(--accent-text)}
/* THE PAGE-HEADING DESCRIPTION IS THE DESCRIPTION GREY #828282 (Maryam, 15 Sep
   2026: "the desc with the page heading needs to be in the font colour what tal
   summary desc colour is in right now"). The DS gives `.aih-d` its
   --text-secondary colour only through `.sec > .sec-h.aih` (a DIRECT child, §63
   §13). Admin list heads wrap the head in `searchHead` — `.sec > .hd-srch >
   .hd-srch-t > .sec-h.aih` — so that rule never matches and the desc fell back
   to the inherited primary #111 (black). Every admin heading desc reads the
   same #828282 now, matching the colour the Tal summary body carried before it
   was darkened one step platform-wide the same day (§33). Descendant combinator
   so it covers both the wrapped list heads and the direct ones; (0,7,0), later
   than the DS base (0,7,0), so it wins on order. The dark-card override (0,8,0,
   §63) still beats it, so a black-card heading keeps --on-dark-2. Admin-only. */
.app .page .sec .sec-h.aih > .aih-b > .aih-d{color:var(--text-secondary)}
/* the dashboard period selector row (2.2): caption left, the segmented buttons
   right; wraps to a stack on a narrow width. */
.app .dash-periodbar-in{display:flex;align-items:center;justify-content:space-between;gap:var(--s05);flex-wrap:wrap}
.app .dash-periodbar-in .lst-filters{display:flex;gap:var(--s03);flex-wrap:wrap}

/* NO VERTICAL SCROLLBAR ON A DATA TABLE (Maryam, 14 Sep 2026: "we are only
   showing 5 rows, why is the table scrollable"). A CLOSED row-action menu is
   `visibility:hidden` but still laid out (`position:absolute`, `display:flex`)
   below the last row, so it inflates `.tbl-wrap`'s scrollHeight; and because
   `overflow-x` is `auto`, `overflow-y` computes to `auto` too (CSS spec), so a
   stray vertical scrollbar appears. The OPEN menu is lifted into `.main`
   (placeRowMenu), so the wrap is only ever a sideways scroller — pin overflow-y
   hidden. Admin-wide; the table auto-heights to its rows so nothing real clips. */
.app .tbl-wrap{overflow-y:hidden}

/* PERMISSIONS MATRIX MARKS (Maryam, 14 Sep 2026): granted in the accent,
   ungranted a very light grey. Read-mode marks (pmYes/pmNo) carry their own inline
   colour; these colour the edit-mode toggle icons, which have none. */
.app .perm-tbl .btn[aria-pressed="true"] svg{fill:var(--accent)}
.app .perm-tbl .btn[aria-pressed="false"] svg{fill:var(--gray-20)}
/* The edit-view toggle is icon-only, so an edit row is the same height as a read
   row (Maryam, 14 Sep 2026). The default .btn min-height (32px) made edit rows
   ~12px taller than the read table; drop the button chrome to its glyph. */
.app .perm-tbl td .btn{min-height:0; height:auto; padding:0; border:0}
/* Every role column is CENTRED under its own heading (Maryam, 14 Sep 2026) — the
   mark sits mid-column, not right-aligned like a figure. The first column
   (Capability) stays left. Beats `.tbl .num{text-align:right}` (0,2,0). */
.app .perm-tbl th:not(:first-child), .app .perm-tbl td:not(:first-child){text-align:center}
/* The Permissions heading row breathes like the Roles one (Maryam, 14 Sep 2026).
   The modhead's first section (Roles) gets s06 above and s06 below its heading
   (DS 9572/9573); this later section had the default 12 heading-to-content gap, so
   lift it to s06. Top padding is already s06, matching Roles. */
.app .sec:has(.perm-tbl){padding-top:var(--s06)}
.app .sec:has(.perm-tbl) > .sec-h{margin-bottom:var(--s06)}

/* MODALS SIT TIGHTER (Maryam, 14 Sep 2026: "less padding from all sides").
   Admin-portal-local overrides of the DS modal frame (uniform --s06); the DS
   default is untouched for the other three portals. Reduce the sheet header,
   body and footer to --s05 and pull the header divider in to match. */
.app .sheet .sheet-h{padding:var(--s05) var(--s04) var(--s05) var(--s05)}
.app .sheet .sheet-h::after{left:var(--s05); right:var(--s05)}
.app .sheet .sheet-b{padding:var(--s05)}
.app .sheet .sheet-f{padding:var(--s05)}
/* The confirm dialog: a 16 outer frame the body rides on, the button row 16
   below the text. */
.app .conf{padding:var(--s05)}
.app .conf > .conf-b{padding:0}
.app .conf > .conf-a{padding:var(--s05) 0 0}
/* THE CONFIRM ICON is ONE accent circle with a BLACK glyph (Maryam, 14 Sep 2026):
   no light-red inner disc, no outer ring (the DS box-shadow), no per-kind hue. */
.app .conf .conf-mk, .app .conf.conf-ok .conf-mk{background:var(--accent); box-shadow:none; margin-bottom:var(--s04)}
.app .conf .conf-mk svg, .app .conf.conf-ok .conf-mk svg{fill:var(--text-primary)}

/* A FORM FIELD GROUPS WITH ITS OWN LABEL (Maryam, 14 Sep 2026: "the field is more
   attached to the field name below it than its own"). Tighten label->input to s01
   and widen the gap between field rows to s07 — the same spacing the form-page
   forms already use, so every admin form reads the same. Sheet and settings forms
   are single-column (no .f-row in this portal), so this is safe. */
.app :is(.sheet-b, [data-form]) .lbl,
.app :is(.sheet-b, [data-form]) .f > label{margin-bottom:var(--s01)}
.app :is(.sheet-b, [data-form]) .f{margin-bottom:var(--s07)}
.app :is(.sheet-b, [data-form]) .f.last{margin-bottom:0}

/* HEADING / TOOLBAR ACTION BUTTONS ARE THE PLATFORM'S 40px HEIGHT (Maryam, 14 Sep
   2026: "the filled buttons height should be equal to the buttons on other
   portals"). The admin used btn-sm (32px) for its CTAs, which read shorter than
   the standard .btn (40px) filled buttons on the other portals. Bump the heading
   and toolbar actions — filled and ghost together, so the row stays aligned —
   to 40, matching a real .btn's 40px height (font also to 13px). Pagination,
   table-row and modal-footer buttons are untouched, and btn-sm's own padding
   (and the leading-icon compensation) is left alone. */
.app :is(.aih-a, .sec-h-act, .lst-tools) .btn.btn-sm{min-height:40px; font-size:13px}

/* INFO BANNER ICON IS ACCENT (Maryam, 14 Sep 2026: "for all the info banners, the
   info icon should be in the accent color"). Only the INFO note — warn/err/succ/acc
   keep their state colours. `.note`'s icon is `.note > span > svg`. */
.app .note:not(.warn):not(.err):not(.succ):not(.acc) > span svg{fill:var(--accent)}

/* A CHEVRON (dropdown) FIELD WEARS THE SAME UNDERLINE AS A TEXT INPUT (Maryam,
   14 Sep 2026, ref candidate portal): our form dropdown's trigger dropped its full
   box for a single bottom border, transparent ground, so Level/Cohort/Agent read
   like the name/email fields with only the chevron added. Scoped to `.fdd-form`
   so the toolbar filter dropdowns keep their box. */
.app .fdd-form .fdd-t{border:0; border-bottom:1px solid var(--rule); border-radius:0; background:transparent; padding-left:0; padding-right:var(--s05)}

/* A REQUIRED FIELD'S NAME CARRIES AN ACCENT ASTERISK (Maryam, 14 Sep 2026). */
.app .req-star{color:var(--accent); margin-left:1px}

/* THE QUIZ-RESULTS BLOCK on the candidate detail (Maryam, 14 Sep 2026). The
   candidate portal draws this content in a 372px slide-over; on the wider detail
   page it reads best as a centred vertical column at the reference's own measure,
   its parts stacked the way `.peek-b` stacked them. The `.qzp-*` classes ship in
   the design system already (§80) — this only bounds and stacks them. */
.app .adm-quiz{max-width:400px; display:flex; flex-direction:column; gap:var(--s05)}

/* NO LABEL COLUMN ANYWHERE ON THE ADMIN — a section stacks its heading ABOVE its
   content, never in a 184px spine beside it (Maryam, 14 Sep 2026: "none of our
   sections are side by side heading and content, everything is vertically
   aligned"). Every existing admin section already opts out of §10.15 by its
   content (kv / tbl-wrap / tile-stack / stats / …); this makes it UNIVERSAL so a
   section built on any other wrapper — the candidate-detail Interview scenes
   (`.scv-row`) and Quiz results (`.adm-quiz`) — stays vertical too. Mirrors the
   DS opt-out (display:block + the sec-h reset), scoped to `.main .sec` at (0,4,0)
   so it beats the grid rule (0,2,0), restated INSIDE the same 900 container query
   (trap 3 — a later unconditional rule cannot outweigh a rule inside the tier). */
@container app (min-width:900px){
  .app .main .sec:has(> .sec-h){display:block}
  .app .main .sec:has(> .sec-h) > .sec-h{border-right:0; min-height:0; margin-bottom:var(--sec-h-gap); padding:0 var(--pad-x)}
}
</style>

<script src="design-system/talentnext-ds.js?b=a7e5e391"></script>
<script>
/* ==========================================================================
   THE SUPER ADMIN PORTAL

   A FOURTH SIGNED-IN USER, IN A FILE OF ITS OWN, on the same design system the
   Talent Agent portal is built on. The candidate and cohort leader share
   `hifi/` because a demo walks between them; the agent and the admin are each
   a separate application and a separate signed-in person, so each is a
   hand-written file linking `design-system/`.

   WHO IS SIGNED IN: Derek Sole, Super Admin (u9 in the record). The portal has
   full control across every module — users, vetting, cohorts, the marketplace
   and settlement — with override on any level or setting.

   WHERE THE DATA COMES FROM: verbatim from `tn-admin.html`, the frozen data and
   flow reference. Every user, application, cohort, booking, payout, refund,
   settlement, lead, campaign, feature flag, decision and audit line below is
   copied from that file's seed block (its lines 3077–3592 and 6772–6836). No
   record, number or copy is invented here — the frozen file is the source of
   truth and this file is only its hi-fi skin.

   WHERE THE DESIGN COMES FROM: the other three portals only. The head band with
   Tal's page summary (`dsTypeSummary`), §78's top bar with the breadcrumb trail
   and the account menu, the rail, `aiHead` for a heading that carries a
   sentence, `.dark-card` for the one loud thing on a page, `.stat`/`.qa-c`
   figure cells, the design system's data table, §65 disclosures, and the
   `.conf` dialog for every destructive action and log-out. No component is
   invented; where the admin needs one the box does not ship, it is composed
   from ones it does.

   TWO ADMIN RULES STATED BY THE BRIEF AND KEPT HERE:
     - DATA OVER DECORATIVE CHARTS. The frozen file draws bar, donut, funnel and
       line charts on its dashboards; this portal reads the same figures as
       `.stats`, `.kv` bands and tables, which is the standing admin preference
       (DESIGN.md §3) and also keeps every surface on the design system with no
       chart CSS to invent.
     - THE FEE SPLIT IS CONFIGURATION, NOT COPY. The 20% platform share appears
       once, in Fee Configuration, and nowhere in a sentence — an admin-set
       number does not belong in prose.

   4 SEP 2026 — THE SECOND PASS, from Maryam's review of the first ("tal is
   missing, the tabs on pages have margins, the black card has no fine content
   structuring, no sub modules … no filters on tables, unnecessary lines …
   there should have been crud operations"). What changed, and where each is
   argued: the ask dock and the full-height Tal page are ported from the agent
   portal (see TAL, FOR THE ADMIN); the sub-page strip is `.sec-cs` + `.cs`
   (see `subTabs`); the rail is a tree with queue counts (§120, `sidenav`);
   the black card follows the gallery recipe (`darkCard`); every list has a
   live search, a count strip, sortable heads and row actions (`searchHead`,
   `filterStrip`, `table`, `rowActs`); and a record engine gives every kind of
   record create, edit, delete and status changes through the same sheet and
   confirmation (THE RECORD ENGINE). Everything the admin does writes a line
   to the audit log (`audit`), so System & Audit shows the session's own work.

   NAVIGATION IS `mod/sub[/id]`, and that is the whole of the router. The rail
   is the twelve modules; a module opens on its first sub-page; the sub-pages of
   a module are a `.tabs` strip; a table row drills into a hidden detail sub
   with a record id. The hash is `#mod/sub[/id]`, written with `replaceState`
   and read back on load, so a reload comes back to the screen you were on — the
   same three parts `hifi/` and the agent portal keep.
   ========================================================================== */

/* ---- small utilities ---------------------------------------------------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + Number(n).toLocaleString('en-US');
const money2 = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});

/* THE ICON MAP. The admin data names icons in its own vocabulary (`agent`,
   `cohorts`, `spark`, `store`, `route`, `dl`, `dots`, `sliders`, `bank`,
   `scale`…). This maps each onto the design system's Material Symbols set —
   `Object.keys(IP)` is the whole list — so a call site names the meaning and
   gets the official mark. A name already in the set passes through. */
const IMAP = {
  home:'dashboard', users:'group', vetting:'shield', candidates:'user',
  agents:'verified', cohorts:'growth', market:'video', employers:'launch',
  finance:'wallet', crm:'chart', system:'settings', settings:'settings',
  profile:'user', agent:'verified', store:'launch', spark:'lightning',
  money:'wallet', bank:'wallet', alert:'warning', route:'link', account:'user',
  lock:'locked', node:'link', eye:'view', scale:'renew', doc:'document',
  clock:'time', plus:'add', dots:'overflow', sliders:'settings', dl:'download',

/* A STATUS WORD IS A `.tag`, AND ITS HUE IS A SET, NOT THE ACCENT (DESIGN.md
   §3). This maps every status string the records carry onto the design system's
   tag variants — green for done/good, warn for waiting, red for a problem —
   with the word the source shows. Anything unmapped renders as a plain tag with
   its own text title-cased. */
const TAGV = {
  /* good */ active:'green', settled:'green', paid:'green', live:'green', ok:'green',
  approved:'green', won:'green', reconciled:'green', placed:'green', confirmed:'green',
  published:'green', completed:'green', verified:'green',
  /* waiting */ held:'warn', pending:'warn', review:'warn', requested:'warn', invited:'warn',
  processing:'warn', sent:'warn', overdue:'warn', unmatched:'warn', shortlisted:'warn',
  reviewing:'warn', scheduled:'warn', draft:'warn', degraded:'warn', 'in progress':'warn',
  /* problem */ blocked:'red', declined:'red', lost:'red', unverified:'red',
  inactive:'red', rejected:'red', down:'red', open:'red', flagged:'red', passed:'',
  /* neutral-ish */ applied:'', feedback:'green', 'n/a':'',
  /* the Super Admin journey's states (7 Sep 2026) */ reassign:'warn', expired:'red', offboarded:'red', voided:'red', permanent:'green', 'time-boxed':'warn', credit:'green'
};
const TAGLABEL = {'n/a':'n/a', ok:'Verified'};
const cap = s => String(s || '').replace(/^\w/, c => c.toUpperCase());
/* A STATUS IS PLAIN COLOURED TEXT, NEVER A CHIP (Maryam, 7 Sep 2026: "never add
   status in tags, this is a universal change on admin portal"). The chip box is
   dropped platform-wide across the admin — `tag()` is the admin's own state
   helper, so changing it here changes every Status/Listing/verify/outcome cell
   at once. The good/waiting/problem colour stays (it is the meaning, a SET, not
   the accent — DESIGN.md §3); §126 gives `.statw` its inks. The categorical
   LABEL chips (roles, levels) still use `.tag` and become round chips (§126). */
const tag = (status, label) => {
  const key = String(status || '').toLowerCase();
  const v = TAGV[key] === undefined ? '' : TAGV[key];
  const txt = label != null ? label : (TAGLABEL[key] || cap(status));
  return `<span class="statw${v ? ' ' + v : ''}">${esc(txt)}</span>`;
};

/* A HAIRLINE KEY/VALUE LIST — the safe band at any width (DESIGN.md §3). */
/* ALIGNED (14 Sep 2026): delegates to the shipped `dsKv`. No admin call uses the
   optional per-row `cls` the old copy carried (every row is `[k, v]`), so nothing

/* DASHBOARD CHARTS (§120.1f). Two self-contained shapes on the `--dv-*` ramp.
   `donut(segs)` — segs are [label, value, fill]; the arc is drawn as a
   stroke-dasharray length off a rotated circle, the total sits in the hole, the
   figures ride the legend. `hbars(rows)` — rows are [label, valueText, barValue]
   (barValue is what sets the width, valueText is what the reader sees, so a bar
   can read a per-cent while its length tracks a count). The figure never leaves
   the graph. */
const DV = ['var(--dv-4)', 'var(--dv-3)', 'var(--dv-2)', 'var(--dv-hi)', 'var(--dv-gold)', 'var(--dv-1)'];
function donut(segs){
  const total = segs.reduce((n, s) => n + s[1], 0) || 1;
  const r = 44, C = 2 * Math.PI * r; let off = 0;
  const arcs = segs.filter(s => s[1] > 0).map(s => {
    const len = s[1] / total * C;
    const c = `<circle cx="58" cy="58" r="${r}" fill="none" stroke="${s[2]}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off += len; return c;
  }).join('');
  const leg = segs.map(s => `<div class="leg-row"><span class="leg-sw" style="background:${s[2]}"></span><span class="leg-l t-desc">${esc(s[0])}</span><b class="leg-v">${s[1]}</b></div>`).join('');
  return `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 116 116" aria-hidden="true">${arcs}</svg><div class="donut-c"><span class="t-h3">${total}</span><span class="t-caption">total</span></div></div><div class="donut-leg">${leg}</div></div>`;
}
function hbars(rows){
  const max = Math.max(...rows.map(r => r[2]), 1);
  return `<div class="hbars">${rows.map(r => {
    const w = Math.max(3, Math.round(r[2] / max * 100));
    return `<div class="hbar"><div class="hbar-top"><span class="hbar-l t-desc">${esc(r[0])}</span><b class="hbar-v">${r[1]}</b></div><div class="hbar-track"><i style="width:${w}%"></i></div></div>`;
  }).join('')}</div>`;
}

/* THE REVENUE WATERFALL (Maryam, 11 Sep 2026: "I need this kind of revenue chart
   but according to our data ... please do not use green only"). A self-contained
   inline SVG — like `donut`/`hbars`, one function, no new stylesheet class — that
   walks a P&L: each REVENUE line is a floating bar that builds the running total
   up, a SUBTOTAL is a full bar from zero, each COST floats it back down. Every
   figure reconciles because it is read off ONE seed (TXNS): gross = the three
   `in` lines, net = gross − payouts − refunds.
   COLOUR is assigned by CONTENT off Maryam's four (11 Sep 2026): the caller hands
   each REVENUE bar a fill (the calendar pastels `--cal-reiv`/`--cal-iv`/`--cal-open`
   — violet / green / warm-grey); COST bars are red `#FF4626`; SUBTOTAL bars stay
   the neutral `--text-helper` grey so a total still reads as a total. All fills,
   sizes and weights are inline on the SVG (a chart owns its own labels, §63 §5).
   `rows` are {l:label, v:signed delta, k:'rev'|'cost'|'sub', c:fill for 'rev'}. */
function waterfall(rows){
  let run = 0;
  const bars = rows.map(r => {
    if(r.k === 'sub') return {...r, from:0, to:run, disp:run};
    const from = run; run += r.v;
    return {...r, from:Math.min(from, run), to:Math.max(from, run), disp:r.v};
  });
  const maxV = Math.max(...bars.map(b => b.to), 1) * 1.08;
  const W = 560, L = 150, RM = 72, rowH = 34, barH = 19, padT = 10, padB = 10;
  const H = bars.length * rowH + padT + padB;
  const plotL = L, plotR = W - RM, plotW = plotR - plotL;
  const x = v => plotL + v / maxV * plotW;
  const grid = [0, .25, .5, .75, 1].map(f => {
    const gx = (plotL + f * plotW).toFixed(1);
    return `<line x1="${gx}" y1="${padT}" x2="${gx}" y2="${H - padB}" stroke="var(--rule)" stroke-width="1"/>`;
  }).join('');
  const body = bars.map((b, i) => {
    const cy = padT + i * rowH + rowH / 2;
    const bx = x(b.from), bw = Math.max(2, x(b.to) - x(b.from));
    const fill = b.k === 'sub' ? 'var(--text-helper)' : b.k === 'cost' ? '#FF4626' : b.c;
    const sign = b.k === 'rev' ? '+' : b.k === 'cost' ? '−' : '';
    const lw = b.k === 'sub' ? 600 : 400;
    return `<rect x="${bx.toFixed(1)}" y="${(cy - barH / 2).toFixed(1)}" width="${bw.toFixed(1)}" height="${barH}" rx="2" fill="${fill}"/>`
      + `<text x="${L - 12}" y="${(cy + 4).toFixed(1)}" text-anchor="end" style="font-size:12px;font-weight:${lw};fill:var(--text-secondary)">${esc(b.l)}</text>`
      + `<text x="${(x(b.to) + 8).toFixed(1)}" y="${(cy + 4).toFixed(1)}" style="font-size:12px;font-weight:600;fill:var(--text-primary)">${sign}${money(Math.abs(b.disp))}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Revenue waterfall" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:${W}px;height:auto;margin-top:var(--s04)">${grid}${body}</svg>`;
}

/* THE TREND LINE CHART — the platform's OWN `perfChart` line, reused (Maryam,
   11 Sep 2026: "you could have used this component instead of what you created").
   `perfChart` lives in hifi's views.js and is candidate-specific (perfParts, the
   13-chapter %, the score ring), so it does not port whole — but its LOOK is all
   in the design-system `.perf-*` CSS the admin already links: `.perf-line` /
   `.perf-dot` / `.perf-avg-line` are one green (`--support-success-ink`), the
   lowest point flips red (`.perf-lo`) and the highest carries a halo (`.perf-hi`).
   So this is that component's markup, generalised to any series: straight-segment
   line, a dashed benchmark, y labels through `fmt`, x labels from `axis`. No
   inline colour — the DS classes paint it.
   `data` numbers, `axis` labels, `target` the dashed benchmark, `fmt` the y/label
   formatter (money or plain). Series are authored placeholder (§74). */
function trendChart(data, {axis, target, fmt}){
  fmt = fmt || (v => String(v));
  const W = 900, H = 180, L = 44, R = 12, T = 12, B = 26;
  const IW = W - L - R, IH = H - T - B, min = 0;
  const max = Math.max(...data, target || 0) * 1.14 || 1;
  const n = data.length;
  const x = i => L + (n > 1 ? i * (IW / (n - 1)) : IW / 2);
  const y = v => T + IH - ((v - min) / (max - min)) * IH;
  const lo = data.indexOf(Math.min(...data)), hi = data.indexOf(Math.max(...data));
  const path = data.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const grid = [0, .25, .5, .75, 1].map(f => { const v = min + (max - min) * f; return `
    <line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--rule)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <text class="perf-yl" x="${L - 8}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${fmt(Math.round(v))}</text>`; }).join('');
  const avg = target != null ? `<line class="perf-avg-line" x1="${L}" x2="${W - R}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>` : '';
  const dots = data.map((v, i) => { const call = i === lo ? ' perf-lo' : i === hi ? ' perf-hi' : '';
    return `${call ? `<circle class="perf-halo${call}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="9"/>` : ''}<circle class="perf-dot${call}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4"/>`; }).join('');
  const xl = axis.map((l, i) => `<text class="perf-xl" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`).join('');
  return `<div class="perf-plot"><svg class="perf-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend">
    ${grid}${avg}<path class="perf-line" d="${path}" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${dots}${xl}</svg></div>`;
}
/* AUTHORED weekly new-lead counts (§74) — the seed's LEADS carry no capture date,
   so the six-week trend the wireframe's "New leads" card shows is a placeholder;
   the total and the start/end steps are read off it. */
const LEADS_TREND = { axis:['Jun 30', 'Jul 7', 'Jul 14', 'Jul 21', 'Jul 28', 'Aug 4'], data:[19, 26, 23, 33, 29, 39] };
function newLeadsCard(){
  const d = LEADS_TREND, total = d.data.reduce((a, b) => a + b, 0);
  const avg = Math.round(total / d.data.length);
  return `
    <div class="chart-read" style="margin:0 0 var(--s04)"><span class="v">${total} leads</span><span class="k">${esc(d.axis[0])} – ${esc(d.axis[d.axis.length - 1])} · ${d.data[0]}→${d.data[d.data.length - 1]} a week</span></div>
    ${trendChart(d.data, {axis:d.axis, target:avg})}`;
}

/* THE DATA TABLE — always inside `.tbl-wrap`, the one component that scrolls
   sideways. `cols` are [{label, num?, sort?, act?}] and `rows` are
   {cells:[…], go?, sv?:[…]} — `sv` is a row's raw sort values where the cell's
   text is not the thing to order by (a tag, a two-line cell).

   EVERY COLUMN SORTS unless it says `sort:false` or is the action cell. The
   head carries `data-sort=i`; the router flips `S.sort[page]` between asc, desc
   and off; the active head shows a chevron (§120.2). Sorting reads the cell's
   text with the tags stripped and compares as numbers when both sides parse as
   one — `$1,250` and `4.9 ★` both do — so a money column orders by amount. */
function table(cols, rows, opts){
  opts = opts || {};
  const st = S.sort[pageKey()];
  const head = cols.map((c, i) => {
    const cls = [c.num ? 'num' : '', c.act ? 'tbl-act' : ''].filter(Boolean).join(' ');
    /* TABLE HEADERS ARE NOT CLICKABLE (Maryam, 13 Sep 2026: "table headers should
       not be clickable"). Click-to-sort is off — no `data-sort`, no chevron; the
       `S.sort` machinery stays dormant (st is always undefined, so rows keep their
       given order). Flip this back to `!c.act && c.sort !== false && c.label` to
       restore sorting. */
    const sortable = false;
    const on = st && st.i === i;
    return `<th${cls ? ` class="${cls}"` : ''}${sortable ? ` data-sort="${i}" aria-sort="${on ? (st.dir === 'desc' ? 'descending' : 'ascending') : 'none'}"` : ''}>${esc(c.label)}${on ? `<svg viewBox="0 -960 960 960" aria-hidden="true">${inner(st.dir === 'desc' ? 'chevDown' : 'chevUp')}</svg>` : ''}</th>`;
  }).join('');
  const ordered = sortRows(rows, st);
  /* STABLE COLUMN WIDTHS ACROSS PAGES (Maryam 12 Sep 2026). A plain
     `table-layout:auto` table sizes its columns to whichever rows are on the
     current page, so paginating a list makes the columns jump width page to
     page. We size them ONCE off the whole dataset (`ordered`, every row, not the
     visible slice) and pin them with `table-layout:fixed` + a `<colgroup>`, so
     every page draws the same grid — the page-1 layout, held steady. Widths are
     a text-length estimate (longest line in the column, header included), so
     they stay proportional to the content rather than going equal-width; the
     table keeps its sideways scroll (`width:auto; min-width:100%`) so a wide
     table behaves exactly as before, just without the per-page reflow. */
  const colW = cols.map((c, i) => {
    if(c.act) return 56;                                   // the kebab column
    const strip = s => String(s == null ? '' : s)
      .replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p|li|tr)>/gi, '\n')
      .replace(/<[^>]*>/g, '').replace(/&[a-z]+;/gi, 'x').trim();
    const lineMax = s => strip(s).split('\n').reduce((m, l) => Math.max(m, l.trim().length), 0);
    let body = 0;
    for(const r of ordered) body = Math.max(body, lineMax((r.cells || [])[i]));
    const sortable = !c.act && c.sort !== false && c.label;
    const head = String(c.label || '').length * 7.7 + (sortable ? 18 : 0);
    const w = Math.max(body * 6.7, head) + 16 /* cell padding */ + 4;
    return Math.round(Math.min(Math.max(w, 72), 340));
  });
  const colGroup = `<colgroup>${colW.map(w => `<col style="width:${w}px">`).join('')}</colgroup>`;
  const colSum = colW.reduce((s, w) => s + w, 0);
  /* PAGINATION (§127, Maryam 7 Sep 2026). A table shows one page at a time —
     PAGE_DEFAULT rows, and the reader can change that. State is `S.pg[key]`,
     keyed by page AND a per-render table index (`TBL_SEQ`) so two tables on one
     page do not share a page number. The bar is skipped when everything already
     fits in the smallest page (`total <= PAGE_MIN`), and opts.paginate:false
     turns it off for a table that should always show whole. */
  const total = ordered.length;
  const key = pageKey() + '#' + (TBL_SEQ++);
  const paginate = opts.paginate !== false && total > PAGE_MIN;
  let shown = ordered, pgBar = '';
  if(paginate){
    const cur = S.pg[key] || {};
    const size = cur.size || PAGE_DEFAULT;
    const pages = Math.max(1, Math.ceil(total / size));
    const page = Math.min(Math.max(0, cur.page || 0), pages - 1);
    shown = ordered.slice(page * size, page * size + size);
    pgBar = pagination(key, total, page, size, pages);
  }
  const body = shown.map(r => `<tr${r.go ? ` class="clk" data-go="${esc(r.go)}"` : ''}>${
    r.cells.map((c, i) => {
      const col = cols[i] || {};
      const cls = [col.num ? 'num' : '', col.act ? 'tbl-act' : ''].filter(Boolean).join(' ');
      return `<td${cls ? ` class="${cls}"` : ''}>${c}</td>`;
    }).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table class="tbl" style="table-layout:fixed;width:100%;min-width:${colSum}px">${colGroup}<tr>${head}</tr>${body}</table></div>${pgBar}`;
}

/* THE PAGINATION BAR — §127. Rows-per-page on the left (a set of sizes, the
   active one filled), the range in the middle, prev / page-numbers / next on the
   right. The controls reuse `.btn` so §63 owns their type; this file only writes
   the numbers and the data hooks. Page numbers window to first · current±1 ·
   last with ellipses once there are more than seven pages. */
const PAGE_DEFAULT = 5, PAGE_MIN = 5, PAGE_SIZES = [5, 10, 25, 50];
let TBL_SEQ = 0;
function pageWindow(page, pages){
  if(pages <= 7) return Array.from({length: pages}, (_, i) => i);
  const out = [0];
  const start = Math.max(1, page - 1), end = Math.min(pages - 2, page + 1);
  if(start > 1) out.push('…');
  for(let i = start; i <= end; i++) out.push(i);
  if(end < pages - 2) out.push('…');
  out.push(pages - 1);
  return out;
}
function pagination(key, total, page, size, pages){
  const from = page * size + 1, to = Math.min(total, (page + 1) * size);
  /* OUR dropdown, never a native <select> (DESIGN.md §3). The trigger shows the
     size, the menu opens UPWARD (the bar sits at the table's foot, so there is
     room above and the Tal dock never covers it); `S.pgOpen` is the open one. */
  const open = S.pgOpen === key;
  const sizeDd = `<div class="pgn-dd${open ? ' on' : ''}">
    <button class="pgn-dd-t" data-pgddtoggle="${key}" aria-haspopup="listbox" aria-expanded="${open ? 'true' : 'false'}">${size}<svg class="pgn-dd-cx" viewBox="0 -960 960 960" aria-hidden="true">${inner('chevDown')}</svg></button>
    <div class="pgn-dd-menu" role="listbox">${PAGE_SIZES.map(s =>
      `<button class="pgn-dd-opt${s === size ? ' on' : ''}" role="option" aria-selected="${s === size ? 'true' : 'false'}" data-pgsize="${key}:${s}">${s}</button>`).join('')}</div>
  </div>`;
  const nums = pageWindow(page, pages).map(n => n === '…'
    ? `<span class="pgn-gap">…</span>`
    : `<button class="btn btn-sm noic ${n === page ? 'btn-p' : 'btn-g'}" data-pg="${key}:${n}"${n === page ? ' aria-current="page"' : ''}>${n + 1}</button>`).join('');
  return `<div class="pgn">
    <div class="pgn-size"><span class="pgn-lbl">Rows per page</span>${sizeDd}</div>
    <div class="pgn-info">${from}–${to} of ${total}</div>
    <div class="pgn-nav">
      <button class="btn btn-g btn-sm pgn-arrow" data-pg="${key}:prev"${page === 0 ? ' disabled' : ''} aria-label="Previous page">${I.chevLeft}</button>
      <div class="pgn-nums">${nums}</div>
      <button class="btn btn-g btn-sm pgn-arrow" data-pg="${key}:next"${page >= pages - 1 ? ' disabled' : ''} aria-label="Next page">${I.chevRight}</button>
    </div>
  </div>`;
}
const cellText = h => String(h == null ? '' : h).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
function sortRows(rows, st){
  if(!st) return rows;
  const i = st.i, dir = st.dir === 'desc' ? -1 : 1;
  const val = r => (r.sv && r.sv[i] !== undefined) ? r.sv[i] : cellText(r.cells[i]);
  const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return /^[\s$−\-]*\d/.test(String(v)) && !isNaN(n) ? n : null; };
  return rows.slice().sort((a, b) => {
    let x = val(a), y = val(b);
    const nx = num(x), ny = num(y);
    if(nx !== null && ny !== null){ x = nx; y = ny; } else { x = String(x).toLowerCase(); y = String(y).toLowerCase(); }
    return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });
}

/* THE ROW'S ACTIONS — ONE KEBAB THAT OPENS A MENU (§125, Maryam 7 Sep 2026).
   Each entry is [icon, label, attr] where attr is the control's `data-*`; the
   old row of quiet icon buttons is now a single `overflow` trigger and the
   actions are labelled rows in a dropdown. `ROWMENU_SEQ` (reset each render)
   gives every menu a stable id so `S.rowMenu` can hold the open one; the id is
   deterministic across renders because the render order is. The item keeps its
   own `data-*`, so a press still runs the action; the router closes the menu.
   The row is `tr.clk` and opens the record; the trigger and items sit nearer in
   the router's `closest`, so a press on one never also opens the row. */
let ROWMENU_SEQ = 0;
const rowActs = acts => {
  acts = (acts || []).filter(Boolean);
  if(!acts.length) return '';
  const id = 'rm' + (ROWMENU_SEQ++);
  const open = S.rowMenu === id;
  const items = acts.map(([icon, label, attr]) =>
    `<button class="rowmenu-i" role="menuitem" ${attr}><span class="rowmenu-ic">${I[icon] || ic(icon)}</span>${esc(label)}</button>`).join('');
  /* `.on` rides the LIST, not the wrapper — `placeRowMenu` lifts the open list
     out of `.rowmenu` into `.main`, where a wrapper-scoped state would not reach
     it (§125). */
  return `<div class="rowmenu">
    <button class="btn btn-g btn-sm rowmenu-t" data-rowmenu="${id}" aria-haspopup="menu" aria-expanded="${open ? 'true' : 'false'}" title="Actions" aria-label="Actions">${I.overflow}</button>
    <div class="rowmenu-list${open ? ' on' : ''}" role="menu" data-rmlist="${id}">${items}</div>
  </div>`;
};
const ACT_COL = {label:'Actions', act:true};

/* THE BLACK CARD — §75, and it is the WHOLE recipe (DESIGN.md §3, memory).
   `.sec.dark-card`, a `.dc-hd` head row that takes ONE of a `.dc-when` time or
   a `.dc-act` control, then the content as direct children — `.kv` rows, a
   paragraph, a `.crow` — and a `.btn-row` at the foot when the card has things
   to do. That is the gallery's own markup (#signature, "one class, and it is
   the whole recipe"). The first admin build wrapped the rows in a `.dc-lines`
   div, a class no layer states, which is why Maryam read the card as having
   "no fine content structuring": the rows were unstyled on black. The
   `body`+`actions` shape (`.dc-b` > content + `.dc-a`) is §75's other body, for
   a sentence with a button beside it. */
const darkCard = ({title, when, act, head, body, foot, actions, cls}) => `
  <section class="sec dark-card${cls ? ' ' + cls : ''}">
    <div class="dc-hd">
      <div class="dc-hd-r"><h2 class="dc-t">${title}</h2>
        ${head ? head
          : when ? `<span class="dc-when">${ic('time')}${when}</span>`
          : act ? `<button class="btn btn-sm noic dc-act" ${act.attr || ''}>${act.label} ${I.arrowRight}</button>`
          : ''}</div>
    </div>
    ${actions
      ? `<div class="dc-b">${body || ''}<div class="dc-a">${actions}</div></div>`
      : (body || '')}
    ${foot ? `<div class="btn-row">${foot}</div>` : ''}
  </section>`;

/* ALIGNED (14 Sep 2026): delegates to the shipped `dsNote`. Same markup and the
   admin's own kinds ('', warn, err, succ) map identically; the arg order flips
   ((kind,title,body) here, (body,kind,title) there) and is adapted below, so no
   caller changes. The admin never used 'acc', so the one icon that differed
   (star vs the source's info) has no call site. */
const note = (kind, title, body) => dsNote(body, kind, title);

const emptyState = (icon, title, sub) => `<div class="empty">${ic(icon)}<span class="t">${esc(title)}</span>${sub ? `<span class="s">${esc(sub)}</span>` : ''}</div>`;

/* A PERSON ROW — the design system's `.mem`, an initials disc, a name and a

const memRow = (name, sub, trail, go) => `
  <${go ? 'button' : 'div'} class="mem${go ? ' clk' : ''}"${go ? ` data-go="${esc(go)}"` : ''}>${av(name)}
    <span class="mem-b"><span class="mem-n">${esc(name)}</span><span class="mem-m">${sub}</span></span>
    ${trail || ''}

/* A NAVIGATION ROW — the design system's `.tile.clk.gcard`, a leading icon, a

/* A CARD ROW — `.cardrow`: a mark, a title line with tags, a description, and
   the actions on the right. Used where a record has more to say than a table
   cell holds (a payout, a refund, a flag). */
const cardRow = (icon, title, desc, acts) => `
  <div class="cardrow">
    <span class="cardrow-ic">${ic(icon)}</span>
    <span class="cardrow-b"><span class="cardrow-t">${title}</span>

/* A TOAST — the transient confirmations the source shows on cosmetic actions.
   Built from the design system's `.note`; positioned by the chrome host. */
function toast(msg, kind){
  const host = device.querySelector('#toasts');
  if(!host) return;
  const el = document.createElement('div');
  el.innerHTML = note(kind === 'ok' ? 'succ' : kind || 'succ', '', esc(msg));
  const node = el.firstElementChild;
  host.appendChild(node);
  setTimeout(() => { node.style.transition = 'opacity .3s'; node.style.opacity = '0';
    setTimeout(() => node.remove(), 300); }, 2400);
}

/* THE AUDIT LOG IS WRITTEN, NOT ONLY READ. Every state-changing action in the
   portal calls `audit()` so the immutable record on System & Audit shows what
   the signed-in admin just did — the source's own rule ("written to the audit
   log") made true rather than said. */
function audit(act, obj, mod, sev, diff){
  /* `diff` is {from, to} — the BEFORE and AFTER state (SA-15 A2), so a line can
     be inspected rather than only read. Callers that change one value pass it;
     the audit line sheet (`SHEETS.auditline`) draws it as two `.kv` rows. While
     a View As session is open (SA-11) the line says so, so an action taken in
     somebody's name is never mistaken for the admin's own. */
  const va = S.viewAs && USER_BY_ID[S.viewAs.id];
  AUDIT.unshift({when:'Just now', who:ME.name, role:'Super Admin', obj, act, mod: mod || MOD_BY_K[S.mod].t,
    cat: va ? `Admin action · viewing as ${va.name}` : 'Admin action', sev: sev || 'notice', ip:'10.2.14.2',
    from: diff ? diff.from : undefined, to: diff ? diff.to : undefined});
}

/* NO INLINE RULING NOTES ON MODULE PAGES — Maryam, 7 Sep 2026: "remove all
   such sections like 'SA-09 · Account actions — Open ruling' … this is not the
   info a user would want to see." This REVERSES the earlier rule that a page
   waiting on a ruling drew one `ruling('SA-nn')` `.note`; the open/blocked
   branches still live on the Rulings Register (`home/rulings`, in the Dashboard
   sub-nav), which is the one place they belong — they are not surfaced on the
   working pages any more. Kept as a no-op so the call apparatus and the SA_CASES
   data behind the register are untouched; a stray call renders nothing. */
function ruling(){ return ''; }
/* the case's status as the admin's plain coloured text (§126) */
const saTag = st => tag(st === 'confirmed' ? 'confirmed' : st === 'open' ? 'requested' : 'blocked', cap(st));

/* THE ACTIONS TABLE — declared here, before the module views, because each
   module registers its gated/destructive actions into it (`ACTIONS['deact']
   = …`). Every action funnels through `doAction`; the confirmation sheet's
   button carries `data-do`, a plain control `data-act`. Cosmetic actions
   toast; state-changing ones mutate a record and re-render. */
const ACTIONS = {
  logout: () => { S.confirm = null; if(S.viewAs) ACTIONS.endviewas(); S.signedIn = false; S.auth = 'login'; S.nav = S.notif = S.acct = false; S.tal = false; }
};
/* DETAIL_LABEL — the record name a detail page puts in the last breadcrumb
   crumb. Declared up here so `render()` can always clear it. */
let DETAIL_LABEL = null;

/* THE EDITING SHEETS — a module registers its own (the reject-with-reason
   sheet); the record engine's `rec:` sheets are built on demand by `recSheet`.
   An entry is an object, or a function of `S.id` for a record-specific one. */
const SHEETS = {};

/* ======================================================================
   THE RECORD ENGINE — create, edit and delete for every kind of record

   Maryam, 4 Sep 2026: "since it is super admin then there should have been
   crud operations, it's like data were just added". One engine rather than a
   sheet per module: a KIND declares its fields, how to make a record from a
   form, how to write a form back onto a record and how to remove one. The
   design system's `.sheet` is the form (§sheet, "rises from the bottom on a
   phone, centres at 600px and up"), the `.conf` dialog gates every delete
   (memory: confirm every destructive action), and the same three attributes
   drive all of it:

     data-sheet="rec:<kind>:new|<id>"   open the form, blank or filled
     data-act="save:<kind>:new|<id>"    read the form, validate, write
     data-act="askdel:<kind>:<id>"      confirm, then  del:<kind>:<id>

   A FIELD is {k, l, t, opts?, req?, ph?, help?}: t is text | email | number |
   date | select | textarea | checks. `checks` is a list of `.cbx` boxes and
   reads back as an array — that is how roles stack on an account.

   THE FORM IS READ FROM THE DOM ON SAVE, and it is the one place this file
   reads DOM state — the sheet is a form, and a form's state is its fields.
   `doAction` runs the handler before the render that would replace the sheet,
   so the inputs are still there to read; a handler returning 'keep' holds the
   sheet open (a required field is empty) instead of closing it.
   ====================================================================== */
const KINDS = {};
const newId = (pfx, list) => { let n = list.length + 1; while(list.some(x => x.id === pfx + n)) n++; return pfx + n; };
const today = () => { const d = new Date(); return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}-${d.getFullYear()}`; };

/* OUR form dropdown for a sheet/settings SELECT field — never a native <select>
   anywhere in this portal (DESIGN.md §3, Maryam 11 Sep 2026: no system dropdowns
   on the Super Admin portal). It is DOM-only: a `.fdd.fdd-form` with a hidden
   `[data-f]` input that `readForm`/`readPageForm` read UNCHANGED, plus a
   full-width trigger and an option menu. `data-formddtoggle`/`data-formddset`
   are handled in the NON-rendering click listener, because the form is read from
   the DOM on save — a render would rebuild it and lose every other in-progress
   field. Reuses the existing `.fdd*` classes (like `impRoleCell`), so no new CSS. */
function formDd(f, val){
  const opts = (typeof f.opts === 'function' ? f.opts() : f.opts).map(o => Array.isArray(o) ? o : [o, o]);
  const cur = opts.find(o => String(o[0]) === String(val)) || opts[0] || ['', ''];
  return `<label class="f"><span class="lbl">${esc(f.l)}${f.req ? ' <span class="req-star" aria-hidden="true">*</span>' : ''}</span>
    <div class="fdd fdd-form" style="display:block">
      <input type="hidden" data-f="${f.k}" value="${esc(cur[0])}">
      <button type="button" class="fdd-t" data-formddtoggle aria-haspopup="listbox" aria-expanded="false" style="width:100%;justify-content:space-between;min-height:40px">
        <span class="fdd-val">${esc(cur[1])}</span>
        <svg class="fdd-cx" viewBox="0 -960 960 960" aria-hidden="true">${inner('chevDown')}</svg></button>
      <div class="fdd-menu" role="listbox" style="left:0;right:0;max-height:260px;overflow-y:auto">${opts.map(([ov, ol]) =>
        `<button type="button" class="fdd-opt${String(ov) === String(cur[0]) ? ' on' : ''}" role="option" aria-selected="${String(ov) === String(cur[0]) ? 'true' : 'false'}" data-formddset="${esc(ov)}">${esc(ol)}</button>`).join('')}</div>
    </div></label>`;
}
function fieldHtml(f, v){
  const def = typeof f.def === 'function' ? f.def() : f.def;
  const val = v == null ? (def == null ? '' : def) : v;
  if(typeof f.opts === 'function') f = Object.assign({}, f, {opts:f.opts()});
  const lbl = `<span class="lbl">${esc(f.l)}${f.req ? ' <span class="req-star" aria-hidden="true">*</span>' : ''}</span>`;
  /* Every text field carries a placeholder (Maryam, 14 Sep 2026: "the fields should
     always have placeholder text like the Email address field"). Falls back to a
     hint off the label when the field defines none. Selects/checks don't take one. */
  const ph = f.ph || ('Enter ' + String(f.l || '').toLowerCase());
  if(f.t === 'select') return formDd(f, val);
  if(f.t === 'textarea') return `<label class="f">${lbl}<textarea class="inp" data-f="${f.k}" rows="3" placeholder="${esc(ph)}">${esc(val)}</textarea></label>`;
  if(f.t === 'checks') return `<div class="f">${lbl}<div class="mt4">${f.opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o];
    const on = Array.isArray(val) && val.includes(ov);
    return `<label class="cbx"><input type="checkbox" data-f="${f.k}" value="${esc(ov)}"${on ? ' checked' : ''}><span class="box">${I.check}</span><span class="txt">${esc(ol)}</span></label>`; }).join('')}</div></div>`;
  return `<label class="f">${lbl}<input class="inp" data-f="${f.k}" type="${f.t || 'text'}" value="${esc(val)}" placeholder="${esc(ph)}" autocomplete="off"${f.t === 'number' ? ' min="0"' : ''}></label>`;
}
function recSheet(kind, id){
  const K = KINDS[kind]; if(!K) return null;
  const rec = id === 'new' ? null : K.find(id);
  const fields = typeof K.fields === 'function' ? K.fields(rec) : K.fields;
  return {
    title: rec ? `Edit ${K.label} — ${K.name(rec)}` : `Add ${K.an || 'a'} ${K.label}`,
    body: fields.map(f => fieldHtml(f, rec ? (typeof f.get === 'function' ? f.get(rec) : rec[f.k]) : undefined)).join('')
      /* the help line is an INFO BLOCK — a light-grey panel with an info icon on
         the left (Maryam, 13 Sep 2026) — not a bare description paragraph. */
      + (K.help ? `<div class="sheet-help"><svg class="sheet-help-ic" viewBox="0 -960 960 960" aria-hidden="true">${inner('info')}</svg><p class="t-desc">${K.help}</p></div>` : ''),
    ok: rec ? 'Save Changes' : (K.okNew || `Add ${cap(K.label)}`),

  };

function readForm(){
  const out = {};
  /* the centre modal OR the in-flow side panel (sidePeek) — a record form lives
     in whichever is open (`.peek-form` is the side panel; see sideSheet) */
  device.querySelectorAll('.modal.on .sheet [data-f], .peek-form [data-f]').forEach(el => {
    const k = el.dataset.f;
    if(el.type === 'checkbox'){ (out[k] = out[k] || []); if(el.checked) out[k].push(el.value); return; }
    out[k] = el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value.trim();
  });
  return out;
}
function saveRecord(kind, id){
  const K = KINDS[kind]; if(!K) return;
  const vals = readForm();
  const fields = typeof K.fields === 'function' ? K.fields(id === 'new' ? null : K.find(id)) : K.fields;
  const missing = fields.find(f => f.req && (vals[f.k] === '' || vals[f.k] == null || (Array.isArray(vals[f.k]) && !vals[f.k].length)));
  if(missing){ toast(`${missing.l} is required`, 'warn'); return 'keep'; }
  if(id === 'new'){
    const rec = K.create(vals);
    audit(`Added ${K.label}`, K.name(rec), K.mod, K.sev);
    toast(`${cap(K.label)} added — ${K.name(rec)}`);
    if(K.detail){ const d = K.detail(rec).split('/'); S.mod = d[0]; S.sub = d[1]; S.id = d[2] || null; }
  } else {
    const rec = K.find(id); if(!rec) return;
    K.update(rec, vals);
    audit(`Edited ${K.label}`, K.name(rec), K.mod, K.sev);
    toast(`${K.name(rec)} saved`);
  }
}
ACTIONS.save = key => { const [, kind, id] = key.split(':');

     fresh code before it commits (the fee's own confirmation). */
  if(kind === 'fee') return feeStepup(id);

function feeStepup(id){
  const vals = readForm();
  const fields = typeof KINDS.fee.fields === 'function' ? KINDS.fee.fields(id === 'new' ? null : KINDS.fee.find(id)) : KINDS.fee.fields;

  if(missing){ toast(`${missing.l} is required`, 'warn'); return 'keep'; }
  S._pending = {id, vals};
  const nm = id === 'new' ? (vals.t || 'the fee') : KINDS.fee.name(KINDS.fee.find(id));
  askConfirm({mk:'warning', stepup:true, title:`${id === 'new' ? 'Add' : 'Change'} ${nm}?`, body:'A fee change applies to new charges only, from its effective date; anything already in escrow settles at the rate it was booked at.', ok:'Save Fee', act:'dosavefee'});
}
ACTIONS.dosavefee = () => {

  else { const rec = KINDS.fee.find(id); if(rec){ const from = rec.v; KINDS.fee.update(rec, vals); audit('Changed fee', KINDS.fee.name(rec), KINDS.fee.mod, 'high', {from, to:rec.v}); toast(`${KINDS.fee.name(rec)} saved`); } }

/* THE "NEEDS YOUR ATTENTION" PAGER — `attn:prev` / `attn:next` walk the black

ACTIONS.askdel = key => {

};
ACTIONS.del = key => {

  const sub = MOD_BY_K[S.mod]._sub[S.sub];

/* a status flip with a confirmation — `askstatus:<kind>:<id>:<value>` */
ACTIONS.askstatus = key => {

ACTIONS.status = key => {
  const [, kind, id, val] = key.split(':'); const K = KINDS[kind]; const rec = K && K.find(id); if(!rec) return;

  audit(st && st.log ? st.log : `Set ${K.label} ${val}`, K.name(rec), K.mod, 'high');

/* THE PAGED BLACK CARD BODY — Maryam, 11 Sep 2026 (second pass). One attention
   item's queue is "opened" in the card at a time: its LABEL row (no count) leads,
   then every request under it as a `.kv` row (name left, one short field right),

   admin now); the count beside them, `1 of <rows in view>`, counts the rows shown,

function attnCard(){
  const items = attnItems();
  const n = items.length;
  const i = ((S.attnPage % n) + n) % n;               /* clamp/wrap defensively */
  const it = items[i];
  const shown = 1 + it.rows.length;                   /* label row + its request rows */
  /* THE PAGER reuses the dark card's own header-right slot `.dc-when` (right-
     aligned, on-dark ink, 16px icons, gapped) so it needs no new CSS and sits
     exactly on the heading line above the header divider. The chevrons carry
     `data-act` so the shared click router walks them; `.dc-pg` / `.dc-pg-n`

  const pager = `<span class="dc-when dc-pager">

    <span class="dc-pg" data-act="attn:next" role="button" tabindex="0" aria-label="Next queue">${I.chevRight}</span>
  </span>`;
  const body = kv([
    [`<b>${it.label}</b>`, '', ''],                    /* the queue label — no count (Maryam) */
    ...it.rows.map(r => [r[0], r[1], 'n'])
  ]);
  return darkCard({
    title:'Needs your attention',
    head:pager,

    foot:`<button class="btn btn-p btn-sm noic" data-go="${it.go[0]}">${it.go[1]} ${I.arrowRight}</button>`

}

const talAnswer = q => Object.values(talq()).flat().find(e => e[0] === q);
const talReply = q => {

const askBubble = (who, html) => who === 'me'

      <span class="av"><i>${esc(initials(ME.name))}</i></span></span>

const askWhere = mod => (MOD_BY_K[mod] || MOD_BY_K.home).t;

/* THE DOCK. The sample question is the module's own and rotates every three
   seconds; the index lives outside the DOM because every interaction rebuilds
   the frame. `askRotate` edits one span and never calls `render()`. */
const ASK_ROT_MS = 3000;
let ASK_KEY = null, ASK_I = 0, ASK_ON = false;
const askList = () => (talq()[S.mod] || talq().home).map(q => q[0]);
function askQ(){
  const list = askList();
  if(S.mod !== ASK_KEY){ ASK_KEY = S.mod; ASK_I = 0; }
  return list.length ? list[ASK_I % list.length] : '';
}
function askRotate(){
  const el = device.querySelector('.askdock .askline-q');
  if(!el) return;
  const list = askList();
  if(S.mod !== ASK_KEY){ ASK_KEY = S.mod; ASK_I = 0; return; }
  if(list.length < 2) return;
  ASK_I = (ASK_I + 1) % list.length;
  el.classList.add('going');
  setTimeout(() => {
    const still = device.querySelector('.askdock .askline-q');
    if(!still) return;
    still.innerHTML = '&ldquo;' + esc(list[ASK_I % list.length]) + '&rdquo;';
    still.classList.remove('going');
  }, 200);
}
/* THE TRAVELLING LIGHT — hifi's `ai4.js` verbatim, via the agent portal: the

const AI_RUN = `<span class="ai-run" aria-hidden="true">

        <!-- The comet's five stops, off Figma 875:6598 (Maryam 9 Sep 2026), the
             same ramp every portal now runs: white into magenta, orange, red and

        <linearGradient id="aiRunGrad" x1="0" y1="0" x2="1" y2="0">
          ${''/* magenta #d551d7 stop dropped 9 Sep 2026 — white → orange → red → white */}
          <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
          <stop offset="0.4904" stop-color="#ff6e24" stop-opacity=".7"/>
          <stop offset="0.75" stop-color="#ff3733" stop-opacity=".7"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity=".7"/>
        </linearGradient>
      </defs>

function askDock(){

}
function askView(){
  const opened = S.thread.length > 0;
  const qs = (talq()[S.askFrom] || talq().home).map(q => q[0]);
  const hero = `<div class="tal-hero">
      <span class="tal-mk lg orb"></span>
      <h2>Hello <b>${esc(ME.name.split(' ')[0])}</b>, I am Tal &#128075;</h2>
      <p>I can read the platform: accounts, the vetting queue, cohorts, the marketplace and the money. What do you need?</p>
    </div>`;
  const thread = (opened ? '' : hero)
    + S.thread.map(m => askBubble(m.who, m.html)).join('')
    + (S.typing ? askBubble('tal', '<div class="ai-stream"><i></i><i></i><i></i></div>') : '');
  return `<div class="page ask-page">

}
let ASK_FOCUS = false;
const ASK_WAIT = 520;
function askOpen(q){
  if(!S.tal){ S.askFrom = S.mod; S.tal = true; S.nav = false; }
  if(q) return ask(q);
  ASK_FOCUS = true; render();
}
function askClose(){ S.tal = false; S.typing = false; render(); }
function ask(q){
  S.thread.push({who:'me', html:`<p>${esc(q)}</p>`});
  S.typing = true;
  ASK_FOCUS = true;
  render();
  setTimeout(() => {
    if(!S.typing) return;
    S.typing = false;
    S.thread.push({who:'tal', html:talReply(q)});
    render();
  }, ASK_WAIT);
}

/* ======================================================================
   THE VIEWS — one function per module, returning the page inside `.page`.
   A module page is: the head band, the sub-tabs, then the current sub's
   sections. The rail only shows a module once its renderer is registered.
   ====================================================================== */
const V = {};

/* ------------------------------------------------------------ DASHBOARD --- */
function homeOverview(){
  const activeCands = countActive(CANDS);
  const agentCount = USERS.filter(u => u.roles.includes('agent')).length;
  /* COHORT LEADERS vs MODERATORS, KEYED ON `addedBy` (Maryam, 14 Sep 2026:
     "addedBy = moderator; cap the rest"). A candidate who came up through the
     application pathway and volunteered is a "Cohort Leader" and leads ONE cohort
     at a time; a leader an admin ADDED directly is a "Moderator" and may lead
     several. `u.addedBy` — the adding admin's id, the same field the Cohort Leader
     list's "Added by" column reads — is the one marker for both the split and the
     cap, so the two never disagree. u4 (Maryam) has none: a candidate-leader,
     leading Explorer 14 alone. u40 (Bruno) carries one: a moderator, leading
     Explorer 12 and Explorer 15. `u.volunteer` is kept in step but no longer the
     signal. Authored placeholder split — read off the seed, not a signed-off KPI
     (SA-03 E1). */
  const leaders = USERS.filter(u => u.roles.includes('leader'));
  const cohortLeaderCount = leaders.filter(u => !u.addedBy).length;
  const moderatorCount = leaders.filter(u => u.addedBy).length;
  const activeCohorts = COHORTS.filter(c => c.status === 'active').length;
  const liveCourses = COURSES.filter(c => c.status === 'live').length;
  const draftCourses = COURSES.filter(c => c.status === 'draft').length;
  const gross = grossProcessed();
  const inprog = inProgress();
  const highDec = DECISIONS.filter(d => d.sev === 'high').length;
  const medDec = DECISIONS.filter(d => d.sev === 'med').length;

  /* revenue by fee line — the "Revenue streams · this cycle" card reads these */
  const courseRev = TXNS.filter(t => t.cat === 'course' && t.dir === 'in').reduce((n, t) => n + t.amt, 0);
  const interviewRev = TXNS.filter(t => t.cat === 'interview' && t.dir === 'in').reduce((n, t) => n + t.amt, 0);
  const unlockRev = TXNS.filter(t => t.cat === 'unlock' && t.dir === 'in').reduce((n, t) => n + t.amt, 0);
  const revMax = Math.max(courseRev, interviewRev, unlockRev, 1);
  const placementSet = FEES.find(f => f.k === 'placement').state === 'set';

  /* RESTORED DASHBOARD ANALYTICS — Maryam, 8 Sep 2026. The frozen file's
     dashboard (`tn-admin.html`, the data reference) carried payments/payouts,
     the marketplace mix, acquisition, the funnel and the people/cohort splits;
     the first hi-fi conversion dropped them. They come back here read from THIS
     portal's own seed — nothing typed twice — and rendered as DATA (`.kv`,
     `.stats`, a `table`), not the frozen file's donuts and bars, per "data over
     decorative charts" (DESIGN §5): a proportion is stated as a count and a per
     cent, which is the number the reader wanted from the chart anyway. */
  const pctOf = (n, t) => t ? Math.round(n / t * 100) : 0;
  /* marketplace + booking mix (BOOKINGS) */
  const bkConfirmed = BOOKINGS.filter(b => b.status === 'active').length;
  const bkAwaiting = BOOKINGS.filter(b => !b.paid || b.status === 'pending').length;
  const gmv = BOOKINGS.filter(b => b.paid).reduce((n, b) => n + b.fee, 0);
  const bkPaid = BOOKINGS.filter(b => b.paid).length;
  const avgFee = bkPaid ? Math.round(gmv / bkPaid) : 0;
  const bkTot = BOOKINGS.length || 1;
  const bkMix = {}; BOOKINGS.forEach(b => { bkMix[b.kind] = (bkMix[b.kind] || 0) + 1; });
  const bkMixRows = Object.entries(bkMix).sort((a, b) => b[1] - a[1]);
  /* payouts breakdown (PAYOUTS) */
  const poSettled = PAYOUTS.filter(p => p.status === 'settled').reduce((n, p) => n + p.net, 0);
  const poPending = PAYOUTS.filter(p => p.status === 'held').reduce((n, p) => n + p.net, 0);
  const poGross = PAYOUTS.reduce((n, p) => n + p.gross, 0);
  const platTake = poGross - PAYOUTS.reduce((n, p) => n + p.net, 0);
  const poBlocked = PAYOUTS.filter(p => p.status === 'review').length;
  /* acquisition + funnel (LEADS, CANDS, BOOKINGS, PLACEMENTS) */
  const srcMap = {}; LEADS.forEach(l => { srcMap[l.source] = (srcMap[l.source] || 0) + 1; });
  const srcRows = Object.entries(srcMap).sort((a, b) => b[1] - a[1]);
  const leadTot = LEADS.length;
  const leadConv = LEADS.filter(l => l.accountId).length;
  const inCohort = CANDS.filter(c => c.cohort && c.cohort !== '—').length;
  const byBucket = BUCKETS.map(b => [b.name, CANDS.filter(c => c.bucket === b.name).length]);
  /* people (USERS roles + status) — employers are ORGANISATIONS, counted in
     their own module, so they stay off this account-role list to avoid reading
     against the 9-org headline. */
  const roleRows = ROLES.filter(r => r.k !== 'employer')
    .map(r => [r.name, USERS.filter(u => u.roles.includes(r.k)).length]).filter(r => r[1] > 0);
  const uActive = countActive(USERS);
  const uInactive = USERS.length - uActive;
  /* cohort health (COHORTS) */
  const liveCohorts = COHORTS.filter(c => c.status === 'active');

  /* NEEDS-YOUR-ATTENTION LIST (Pipeline & activity) — the four queues as clickable
     rows (icon · title · count · arrow), the `.tile clk gcard` shape `decisionTile`
     uses. Agents are added straight through the admin now, so their vetting queue
     is not one of the rows. */
  const cohortsNoLeader = COHORTS.filter(c => c.leader === 'Unassigned' && c.status === 'active').length;
  const attnRows = [
    ['cohorts', 'Cohort leader', `${cohortsNoLeader} cohort${cohortsNoLeader === 1 ? '' : 's'} without a leader`, 'cohorts/assign'],
    ['verified', 'Employer verification', `${unverifiedEmp()} awaiting checks`, 'vetting/empverify'],
    ['bank', 'Payouts to release', `${heldPayouts()} pending`, 'finance/payouts']
  ].map(([ic_, t, s, go]) => `<button class="tile clk gcard" data-go="${go}">
      <span class="cardrow-ic">${ic(ic_)}</span>
      <span class="gcard-b"><h3>${t}</h3><span class="sub">${esc(s)}</span></span>
      <svg class="tile-arrow" viewBox="0 -960 960 960">${inner('arrowRight')}</svg></button>`).join('');
  /* GROUP HEADING — the dashboard's section dividers (Maryam, 11 Sep 2026, off the
     wireframes): a plain full-width heading leading each group of cards. It is set
     to the SAME type as "Platform at a glance" (`secHead` renders its h2 at
     `--t-sec` 16px / weight 500 / -.15px, `--text-primary`) — matched inline
     because `.t-sec` is a token, not a class, and a bare `<h2>` falls to a smaller
     base size. Plain (not `.sec-h`) so it never turns its section into a
     label-column grid. */
  const group = t => `<h2 style="margin:0 0 var(--s05);padding-left:0;font-size:var(--t-sec-size);line-height:var(--t-sec-lh);font-weight:500;letter-spacing:var(--t-sec-ls);color:var(--text-primary)">${t}</h2>`;

  /* 2.2 — PERIOD SELECTOR + as-at time. The selector applies to the panels that
     report over a period (money, marketplace, level changes); population panels
     are current-state. The seed carries no time series, so switching the period
     is presentational here (the figures are read off the seed, not a signed-off
     KPI feed — SA-03 E1); the surface, the default and the as-at stamp are what
     the story asks for. */
  const period = S.period || 'month';
  const PERIODS = [['week', 'This week'], ['month', 'This month'], ['quarter', 'This quarter']];
  const periodBar = `<div class="lst-filters">${PERIODS.map(([v, l]) => `<button class="btn btn-sm ${period === v ? 'btn-p' : 'btn-g'} noic" data-act="setperiod:${v}">${l}</button>`).join('')}</div>`;
  const asAt = new Date().toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});

  return `
  ${/* PLATFORM AT A GLANCE — the overview band, kept above the grouped sections. */''}
  <section class="sec dash-periodbar">
    <div class="dash-periodbar-in">
      <div><span class="t-desc">Figures as at ${asAt}. The period applies to the money and activity panels.</span></div>
      ${periodBar}

  </section>
  <section class="sec">
    ${secHead('Platform at a glance')}
    ${stats([
      ['candidates', 'Candidates', String(activeCands), `in ${activeCohorts} cohorts`],
      ['group', 'Cohort leaders', String(cohortLeaderCount), 'volunteered'],
      ['shield', 'Moderators', String(moderatorCount), 'admin-added'],
      ['agents', 'Talent agents', String(agentCount), 'set own fee'],
      ['cohorts', 'Cohorts', String(activeCohorts), `${COHORTS.filter(c => c.status === 'draft').length} in draft`],
      ['book', 'Courses', String(COURSES.length), `${liveCourses} live, ${draftCourses} draft`],
      ['money', 'Gross payment', money(gross), 'this window'],
      ['bank', 'Payment in progress', money(inprog), 'not yet settled']
    ])}
  </section>

  ${/* ══ REVENUE & SETTLEMENT ══ Revenue streams (bars) · payments/payouts (kv) · booking mix (donut) */''}
  <section class="sec">
    ${group('Revenue &amp; settlement')}
    <div class="dgrid dgrid-3">
      <div class="dcol">
        ${secHead('Revenue streams · this cycle')}
        ${hbars([
          ['Course fees', money(courseRev), courseRev],
          ['Interview fees', money(interviewRev), interviewRev],
          ['Employer unlocks', money(unlockRev), unlockRev],
          ['Placement fees', placementSet ? money(PLACEMENTS.filter(p => p.feeState === 'paid').reduce((n, p) => n + p.fee, 0)) : 'Not set', placementSet ? revMax : 0]
        ])}
      </div>
      <div class="dcol">
        ${secHead('In-progress payments & payouts')}
        ${kv([
          ['In-progress payments', `<b>${money(inprog)}</b>`, 'n'],
          ['Platform earnings', `<b>${money(platTake)}</b>`, 'n'],
          ['Agent payouts', `<b>${money(poSettled + poPending)}</b>`, 'n'],
          ['Payouts settled', `<b>${money(poSettled)}</b>`, 'n'],
          ['Payouts pending', `<b>${money(poPending)}</b>`, 'n'],
          ['Blocked / at risk', `<b>${poBlocked}</b> txn${poBlocked === 1 ? '' : 's'}`, 'n']
        ])}
      </div>
      <div class="dcol">
        ${secHead('Booking mix')}
        ${donut(bkMixRows.map(([kind, n], i) => [kind, n, DV[i % DV.length]]))}
      </div>
    </div>
  </section>

  ${/* ══ GROWTH & ACQUISITION ══ leads by source (bars) · candidates by bucket (donut) · new leads (line) */''}
  <section class="sec">
    ${group('Growth &amp; acquisition')}
    <div class="dgrid dgrid-2">
      <div class="dcol">
        ${secHead('Leads by source')}

  <section class="sec">
