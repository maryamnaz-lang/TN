<!-- ==========================================================================
     THE DESIGN SYSTEM. Two files, fonts embedded in the first, so this is the
     whole dependency — the same link the Talent Agent portal carries. Serve
     over http (a browser blocks a linked stylesheet on file://):
         python3 -m http.server 8802 --bind 127.0.0.1
     Every class used below is a real class from design-system/gallery.html.
     The <style> block is PROTOTYPE CHROME AND NOTHING ELSE (the device frame,
     the viewport picker, the wordmark size, a toast host) — no product rule.
     ========================================================================== -->
<link rel="stylesheet" href="design-system/talentnext-ds.css?b=fd33ac50">

<style>
/* ==========================================================================
   PROTOTYPE CHROME ONLY — not product design.

   `.pt-bar`, `.pt-stage`, `.pt-fit` and `.device` all come from the design
   system, including `container-type:inline-size; container-name:app` on
   `.device`, which is the host requirement — nothing in this system responds
   to the browser window, every breakpoint is `@container app (min-width:…)`.

   The mark: `TN_MARK` carries a viewBox and no size, so the bar says how big.
   The admin portal has no stage picker — a super admin sees one live platform,
   not a set of onboarding snapshots the way the agent portal does — so the bar
   holds the frame (viewport) picker and the Reset button only.
   ========================================================================== */
.pt-bar img{height:18px;width:auto;flex:none}

/* THE STAGE FOOT ROOM GOES WITH THE STAGE PICKER THIS FILE DOES NOT HAVE.
   `.pt-stage` is `padding:var(--s06) var(--s05) var(--s10)` in the design
   system — 64px at the foot for a caption row, plus a 16px flex gap. This file
   prints neither, so both reserved space for elements that are not here. Set to
   an even margin, same as the agent portal's chrome states for the same reason. */
.pt-stage{padding-bottom:var(--s05);gap:0}

/* THE TOAST HOST is prototype chrome: a fixed layer for the transient
   confirmations the source portal shows on cosmetic actions (reminder sent,
   receipt downloaded). Each toast is the design system's own `.note` component —
   no colour or type is stated here, only where the stack sits. It is appended
   inside `.device`, whose `container-type` makes it the containing block for a
   fixed child, so a toast is clipped to the frame it belongs to (the same
   mechanism the agent portal's steps popup note records). */
.pt-toasts{position:fixed;left:50%;bottom:var(--s06);transform:translateX(-50%);
  z-index:60;display:flex;flex-direction:column;gap:var(--s03);width:min(360px,86%);
  pointer-events:none}
.pt-toasts .note{margin:0;box-shadow:0 6px 24px rgba(17,17,17,.12);background:var(--pure-white,#fff)}
</style>
</head>

/* ==========================================================================
   THE SUPER ADMIN PORTAL

   A FOURTH SIGNED-IN USER, IN A FILE OF ITS OWN, on the same design system the
   Talent Agent portal is built on. The candidate and cohort leader share
   `hifi/` because a demo walks between them; the agent and the admin are each
   a separate application and a separate signed-in person, so each is a
   hand-written file linking `design-system/`.

   WHO IS SIGNED IN: Derek Sole, Super Admin (u9 in the record). The portal has
   full control across every module — users, vetting, cohorts, the marketplace
   and settlement — with override on any level or setting.

   WHERE THE DATA COMES FROM: verbatim from `tn-admin.html`, the frozen data and
   flow reference. Every user, application, cohort, booking, payout, refund,
   settlement, lead, campaign, feature flag, decision and audit line below is
   copied from that file's seed block (its lines 3077–3592 and 6772–6836). No
   record, number or copy is invented here — the frozen file is the source of
   truth and this file is only its hi-fi skin.

   WHERE THE DESIGN COMES FROM: the other three portals only. The head band with
   Tal's page summary (`dsTypeSummary`), §78's top bar with the breadcrumb trail
   and the account menu, the rail, `aiHead` for a heading that carries a
   sentence, `.dark-card` for the one loud thing on a page, `.stat`/`.qa-c`
   figure cells, the design system's data table, §65 disclosures, and the
   `.conf` dialog for every destructive action and log-out. No component is
   invented; where the admin needs one the box does not ship, it is composed
   from ones it does.

   TWO ADMIN RULES STATED BY THE BRIEF AND KEPT HERE:
     - DATA OVER DECORATIVE CHARTS. The frozen file draws bar, donut, funnel and
       line charts on its dashboards; this portal reads the same figures as
       `.stats`, `.kv` bands and tables, which is the standing admin preference
       (DESIGN.md §3) and also keeps every surface on the design system with no
       chart CSS to invent.
     - THE FEE SPLIT IS CONFIGURATION, NOT COPY. The 20% platform share appears
       once, in Fee Configuration, and nowhere in a sentence — an admin-set
       number does not belong in prose.

   NAVIGATION IS `mod/sub[/id]`, and that is the whole of the router. The rail
   is the twelve modules; a module opens on its first sub-page; the sub-pages of
   a module are a `.tabs` strip; a table row drills into a hidden detail sub
   with a record id. The hash is `#mod/sub[/id]`, written with `replaceState`
   and read back on load, so a reload comes back to the screen you were on — the
   same three parts `hifi/` and the agent portal keep.
   ========================================================================== */

/* ---- small utilities ---------------------------------------------------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + Number(n).toLocaleString('en-US');
const money2 = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});

/* THE ICON MAP. The admin data names icons in its own vocabulary (`agent`,
   `cohorts`, `spark`, `store`, `route`, `dl`, `dots`, `sliders`, `bank`,
   `scale`…). This maps each onto the design system's Material Symbols set —
   `Object.keys(IP)` is the whole list — so a call site names the meaning and
   gets the official mark. A name already in the set passes through. */
const IMAP = {
  home:'dashboard', users:'group', vetting:'shield', candidates:'user',
  agents:'verified', cohorts:'growth', market:'video', employers:'launch',
  finance:'wallet', crm:'chart', system:'settings', settings:'settings',
  profile:'user', agent:'verified', store:'launch', spark:'lightning',
  money:'wallet', bank:'wallet', alert:'warning', route:'link', account:'user',
  lock:'locked', node:'link', eye:'view', scale:'renew', doc:'document',
  clock:'time', plus:'add', dots:'overflow', sliders:'settings', dl:'download',
  gear:'settings', flag:'flag', shield:'shield', video:'video', wallet:'wallet',
  chart:'chart', link:'link', group:'group', calendar:'calendar', book:'book',
  growth:'growth', receipt:'receipt', check:'check', star:'star', time:'time',
  filter:'filter', search:'search', user:'user', verified:'verified',
  location:'location', ticket:'ticket', document:'document', notification:'notification'
};
const ic = name => I[IMAP[name] || name] || '';

/* A STATUS WORD IS A `.tag`, AND ITS HUE IS A SET, NOT THE ACCENT (DESIGN.md
   §3). This maps every status string the records carry onto the design system's
   tag variants — green for done/good, warn for waiting, red for a problem —
   with the word the source shows. Anything unmapped renders as a plain tag with
   its own text title-cased. */
const TAGV = {
  /* good */ active:'green', settled:'green', paid:'green', live:'green', ok:'green',
  approved:'green', won:'green', reconciled:'green', placed:'green', confirmed:'green',
  published:'green', completed:'green', verified:'green',
  /* waiting */ held:'warn', pending:'warn', review:'warn', requested:'warn',
  processing:'warn', sent:'warn', overdue:'warn', unmatched:'warn', shortlisted:'warn',
  reviewing:'warn', scheduled:'warn', draft:'warn', degraded:'warn', 'in progress':'warn',
  /* problem */ blocked:'red', declined:'red', lost:'red', unverified:'red',
  inactive:'red', rejected:'red', down:'red', open:'red', flagged:'red', passed:'',
  /* neutral-ish */ applied:'', feedback:'green', 'n/a':''
};
const TAGLABEL = {'n/a':'n/a', ok:'Verified'};
const cap = s => String(s || '').replace(/^\w/, c => c.toUpperCase());
const tag = (status, label) => {
  const key = String(status || '').toLowerCase();
  const v = TAGV[key] === undefined ? '' : TAGV[key];
  const txt = label != null ? label : (TAGLABEL[key] || cap(status));
  return `<span class="tag sm${v ? ' ' + v : ''}">${esc(txt)}</span>`;
};

/* A FACE IS A DISC OF INITIALS. The five embedded portraits in the design
   system belong to named people who are not these thirty-two accounts, so admin
   rows carry initials on a disc — the design system's own `.av`/`.mem-av`, round
   since §106 — rather than a photograph that would claim an identity. */
const initials = name => String(name || '?').trim().split(/\s+/).slice(0, 2)
  .map(w => w[0]).join('').toUpperCase();
const av = (name, size) => `<span class="av${size ? ' ' + size : ''} mem-av">${esc(initials(name))}</span>`;

/* THE HEAD BAND — §70/§78. A page opens with `.modhead` (the warm-to-green
   wash), a bare `.ph` (the breadcrumb carries the page name now, §78), and
   Tal's page summary in the band. `dsTypeSummary` types the sentence. */
function head(sum){
  return `<div class="modhead">
    <div class="ph ph-bare"></div>
    ${sum ? `<div class="sec">
      <div class="ai-aura tile tight talsum">
        <div class="ai-head"><span class="ai-label">Tal</span></div>
        <div class="ai-body"><p>${sum}</p></div>
      </div>
    </div>` : ''}
  </div>`;
}

/* A DETAIL PAGE HEAD — a real `.ph` with a back arrow to the list it came from.
   The breadcrumb pass keeps the arrow and drops the (empty) heading, §78. */
function detailHead(backTo, sum){
  return `<div class="modhead">
    <div class="ph"><div class="ph-main"><div class="ph-top">
      <button class="ph-back" data-go="${esc(backTo)}" aria-label="Back">${I.arrowLeft}</button></div></div></div>
    ${sum ? `<div class="sec">
      <div class="ai-aura tile tight talsum">
        <div class="ai-head"><span class="ai-label">Tal</span></div>
        <div class="ai-body"><p>${sum}</p></div>
      </div>
    </div>` : ''}
  </div>`;
}

/* THE SUB-PAGE TABS — a module's visible sub-pages as a `.tabs` strip. Drawn
   only when a module has more than one visible sub. */
function subTabs(){
  const m = MOD_BY_K[S.mod];
  const vis = m.subs.filter(s => !s.hidden);
  if(vis.length < 2) return '';
  return `<section class="sec"><div class="tabs">${vis.map(s =>
    `<button class="${s.k === S.sub ? 'on' : ''}" data-go="${m.k}/${s.k}">${esc(s.t)}</button>`).join('')}</div></section>`;
}

/* §73's aiHead — a heading, its one-line description and the row's actions as
   one block. No mark (§73's one-star-per-page: the band already has Tal's). */
const aiHead = (title, desc, act) => `
  <div class="sec-h aih">
    <div class="aih-b">
      <h2 class="aih-t">${title}</h2>
      ${desc ? `<p class="aih-d">${desc}</p>` : ''}
    </div>
    ${act ? `<div class="aih-a">${act}</div>` : ''}`.replace(/\s+$/, '') + `
  </div>`;
const secHead = title => `<div class="sec-h"><h2>${esc(title)}</h2></div>`;

/* THE FIGURE CELL — §29/§24. Four parts, four cells per `.stats`, the mark's
   hue cycles by position. `small` in the value is the design system's `<small>`. */
const statCell = (icon, label, value, note) => `
  <div class="stat">
    <span class="stat-ic">${ic(icon)}</span>
    <div class="stat-top"><div class="l">${esc(label)}</div><div class="n">${value}</div></div>
    ${note ? `<div class="d">${note}</div>` : ''}
  </div>`;
const stats = cells => `<div class="stats">${cells.map(c => statCell(c[0], c[1], c[2], c[3])).join('')}</div>`;

/* A HAIRLINE KEY/VALUE LIST — the safe band at any width (DESIGN.md §3). */
const kv = rows => `<div>${rows.map(([k, v, cls]) =>
  `<div class="kv"><span class="k">${k}</span><span class="v${cls ? ' ' + cls : ''}">${v}</span></div>`).join('')}</div>`;

/* THE DATA TABLE — always inside `.tbl-wrap`, the one component that scrolls
   sideways. `cols` are [label, {num?}] and `rows` are arrays of cells. */
function table(cols, rows, opts){
  opts = opts || {};
  const head = cols.map(c => `<th${c.num ? ' class="num"' : ''}>${esc(c.label)}</th>`).join('');
  const body = rows.map(r => `<tr${r.go ? ` class="clk" data-go="${esc(r.go)}"` : ''}>${
    r.cells.map((c, i) => `<td${cols[i] && cols[i].num ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table class="tbl"><tr>${head}</tr>${body}</table></div>`;
}

/* THE BLACK CARD — §75. Adding `.dark-card` to a `.sec` is the whole
   conversion. The head row takes EITHER a `.dc-when` time OR a `.dc-act`/accent
   control, never both. Its CTA (a plain `.btn.btn-p`) comes out accent. */
const darkCard = ({title, when, act, body, actions, cls}) => `
  <section class="sec dark-card${cls ? ' ' + cls : ''}">
    <div class="dc-hd">
      <div class="dc-hd-r"><h2 class="dc-t">${title}</h2>
        ${when ? `<span class="dc-when">${ic('time')}${when}</span>`
          : act ? (act.accent
            ? `<button class="btn btn-p btn-sm noic" ${act.attr || ''}>${act.label} ${I.arrowRight}</button>`
            : `<button class="btn btn-sm noic dc-act" ${act.attr || ''}>${act.label} ${I.arrowRight}</button>`)
          : ''}</div>
    </div>
    ${actions
      ? `<div class="dc-b">${body || ''}<div class="dc-a">${actions}</div></div>`
      : (body || '')}
  </section>`;

const note = (kind, title, body) => `<div class="note${kind ? ' ' + kind : ''}"><span>${
  kind === 'warn' ? I.warning : kind === 'err' ? I.error : kind === 'succ' ? I.checkFilled : kind === 'acc' ? I.star : I.info
  }</span><div class="nb">${title ? `<b>${title}</b>` : ''}${body}</div></div>`;

const emptyState = (icon, title, sub) => `<div class="empty">${ic(icon)}<span class="t">${esc(title)}</span>${sub ? `<span class="s">${esc(sub)}</span>` : ''}</div>`;

/* A PERSON ROW — the design system's `.mem`, an initials disc, a name and a
   line under it, an optional trailing tag. */
const memRow = (name, sub, trail, go) => `
  <${go ? 'button' : 'div'} class="mem${go ? ' clk' : ''}"${go ? ` data-go="${esc(go)}"` : ''}>${av(name)}
    <span class="mem-b"><span class="mem-n">${esc(name)}</span><span class="mem-m">${sub}</span></span>
    ${trail || ''}
  </${go ? 'button' : 'div'}>`;

/* A NAVIGATION ROW — the design system's `.tile.clk.gcard`, a leading icon, a
   title with a sub-line, and the GO arrow. */
const navRow = (icon, title, sub, go, cta) => `
  <button class="tile clk gcard" data-go="${esc(go)}">
    <span class="cardrow-ic">${ic(icon)}</span>
    <span class="gcard-b"><h3>${esc(title)}</h3><span class="sub">${sub}</span></span>
    ${cta ? `<span class="row-cta">${esc(cta)}</span>` : ''}
    <svg class="tile-arrow" viewBox="0 -960 960 960">${inner('arrowRight')}</svg>
  </button>`;

/* A search field — the design system's `.srch`. Cosmetic in the prototype:
   the rows are already shown; the field says the page is searchable. */
const searchField = ph => `<div class="srch">${I.search}<input class="inp" placeholder="${esc(ph)}" aria-label="${esc(ph)}"></div>`;

/* A TOAST — the transient confirmations the source shows on cosmetic actions.
   Built from the design system's `.note`; positioned by the chrome host. */
function toast(msg, kind){
  const host = device.querySelector('#toasts');
  if(!host) return;
  const el = document.createElement('div');
  el.innerHTML = note(kind === 'ok' ? 'succ' : kind || 'succ', '', esc(msg));
  const node = el.firstElementChild;
  host.appendChild(node);
  setTimeout(() => { node.style.transition = 'opacity .3s'; node.style.opacity = '0';
    setTimeout(() => node.remove(), 300); }, 2400);
}

/* ======================================================================
   THE PAGE SUMMARIES — Tal's reading of each page. Two sentences, real

/* A MODULE DISPATCHER — a module view renders the head band + sub-tabs for a
   list/config sub, or hands straight to a detail sub which draws its own head.
   `subs` maps a sub key to its renderer. */
function modView(subs){
  const m = MOD_BY_K[S.mod];
  const sub = m._sub[S.sub] || m._sub[firstSub(m)];
  const fn = subs[S.sub] || subs[firstSub(m)];
  if(sub.hidden) return fn();                         /* detail: its own head */
  return head(pageSummary()) + subTabs() + fn();
}

/* ROLE CHIPS — a role as a small tag; an internal role is outlined so it reads
   as staff without a second fill colour competing with the status tags. */
const roleChips = roles => roles.map(r => {
  const R = ROLE_BY_K[r]; const int = R && R.kind === 'internal';
  return `<span class="tag sm${int ? ' bordered' : ''}">${esc(R ? R.short : r)}</span>`;
}).join(' ');

/* A TWO-LINE TABLE IDENTITY CELL — a name over a caption (email, ref…). */
const idCell = (name, sub) => `<div>${esc(name)}</div>${sub ? `<div class="t-caption">${esc(sub)}</div>` : ''}`;

/* A GRANTED / NOT-GRANTED MARK — the icon proxy returns a full <svg> with no
   size, so a matrix cell needs its own sized wrapper; the fill is a token. */
const yesMark = `<svg viewBox="0 -960 960 960" width="17" height="17" style="fill:var(--text-primary);vertical-align:-3px" aria-label="Yes">${inner('check')}</svg>`;
const noMark = '<span class="t-caption" aria-hidden="true">—</span>';

/* A FILTER STRIP — the design system's `.tabs`, used as an in-page filter with
   live counts. `name` is the filter key; `opts` are [value, label, count]. */
function filterTabs(name, def, opts){
  const cur = getFilter(name, def);
  return `<div class="tabs">${opts.map(([v, l, c]) =>
    `<button class="${v === cur ? 'on' : ''}" data-filter="${name}:${v}">${esc(l)}${c != null ? ` (${c})` : ''}</button>`).join('')}</div>`;
}

ACTIONS['askdeact'] = key => {
  const u = USER_BY_ID[key.split(':')[1]];

  if(u.id === 'u9'){ toast('The Super Admin account can’t be deactivated'); return; }
  askConfirm({mk:'warning', title:`Deactivate ${u.name}?`,

    ok:'Deactivate', danger:true, act:'deact:' + u.id});
};

ACTIONS['react'] = key => { const u = USER_BY_ID[key.split(':')[1]]; if(u){ u.status = 'active'; toast(u.name + ' reactivated'); } };
ACTIONS['askdelrole'] = key => {
  const k = key.split(':')[1]; const r = ROLE_BY_K[k];

  if(k === 'admin'){ toast('The Super Admin role can’t be deleted'); return; }
  const n = USERS.filter(u => u.roles.includes(k)).length;
  askConfirm({mk:'warning', title:`Delete the "${r.name}" role?`,
    body:`This can’t be undone. Its permissions are removed${n ? ` and the role is stripped from ${n} ${n === 1 ? 'account' : 'accounts'}` : ''}.`,
    ok:'Delete role', danger:true, act:'delrole:' + k});
};
ACTIONS['delrole'] = key => {
  const k = key.split(':')[1]; const i = ROLES.findIndex(r => r.k === k);
  if(i >= 0){ const nm = ROLES[i].name; ROLES.splice(i, 1); toast(nm + ' role deleted'); }

};

/* THE CONFIRMATION DIALOG — the `.conf` sheet, for every destructive action
   and log-out (DESIGN.md §3). `data-do` on the confirm button names the action
   the router runs; a `.danger` fill on anything that destroys. */
const CONFIRMS = {
  logout: {mk:'warning', title:'Log out?', body:'You will need your password to sign back in to the admin.', ok:'Log out', danger:false, act:'logout'}
};
function confirmSheet(){
  const c = CONFIRMS[S.confirm] || S._confirm || null;
  return `<div class="modal ${S.confirm ? 'on' : ''}" data-close="confirm">
    <div class="sheet conf" role="dialog" aria-modal="true" aria-label="${c ? esc(c.title) : ''}">
      <div class="sheet-b conf-b">
        <span class="conf-mk">${c && c.mk === 'check' ? I.checkFilled : I.warning}</span>
        <h2 class="conf-t">${c ? esc(c.title) : ''}</h2>
        <p class="conf-x">${c ? c.body : ''}</p>
      </div>
      <div class="sheet-f conf-a">
        <button class="btn btn-s noic" data-close="confirm">${c && c.cancel ? esc(c.cancel) : 'Cancel'}</button>
        <button class="btn btn-p noic${c && c.danger ? ' danger' : ''}" data-do="${c ? esc(c.act) : ''}">${c ? esc(c.ok) : ''}</button>
      </div>
    </div>
  </div>`;
}
/* DYNAMIC CONFIRMATIONS — a record-specific dialog is built at the call site and
   held in `S._confirm`; `S.confirm='_dyn'` opens it. The button's `data-do`
   names the action to run. Modules register their openers in `ACTIONS`. */
function askConfirm(o){ S._confirm = o; S.confirm = '_dyn'; }

/* THE EDITING SHEETS — the design system's bottom `.sheet`. `SHEETS` is declared
   up near the page summaries so modules can register into it; an entry is an
   object or a function of `S.id`. */
function sheetView(){
  let s = SHEETS[S.sheet];
  if(typeof s === 'function') s = s();     /* a record-specific sheet reads S.id */
  return `<div class="modal ${S.sheet ? 'on' : ''}" data-close="sheet">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${s ? esc(s.title) : ''}">
      <div class="sheet-h"><h2>${s ? esc(s.title) : ''}</h2>
        <button class="x" data-close="sheet" aria-label="Close">${I.close}</button></div>
      <div class="sheet-b">${s ? s.body : ''}</div>
      <div class="sheet-f">
        <button class="btn btn-s noic" data-close="sheet">Cancel</button>
        <button class="btn btn-p noic${s && s.danger ? ' danger' : ''}" data-act="${s ? esc(s.act) : ''}">${s ? esc(s.ok) : ''}</button>
      </div>
    </div>
  </div>`;
}

/* ======================================================================
   THE BREADCRUMB TRAIL — §78, filled by a pass after the page renders.
   Module > sub-page, and Module > list > record on a detail page.
   ====================================================================== */
function trailParts(){
  const m = MOD_BY_K[S.mod];
  const sub = m._sub[S.sub];
  const out = [{label:m.t, go:m.k + '/' + firstSub(m)}];
  if(sub && sub.hidden){
    /* a detail page: name the list it came from, then the record. Skip the
       list crumb when its label just repeats the module's (Talent Agents). */
    const list = detailListSub(m);
    if(list && list.t !== m.t) out.push({label:list.t, go:m.k + '/' + list.k});
    const rec = detailRecordLabel();
    out.push({label:rec || sub.t});
  } else if(sub && S.sub !== firstSub(m)){
    out.push({label:sub.t});
  }
  return out;
}
/* which visible sub a hidden detail belongs under (its list) */
function detailListSub(m){
  const map = {users:'users', vetting:'applications', candidates:'candidates', agents:'agents',
    cohorts:'cohorts', employers:'employers', crm:'leads'};
  const dmap = {appdetail:'applications', staffdetail:'users', coursedetail:'catalogue',
    leaddetail:'leads', campaigndetail:'campaigns'};
  const k = dmap[S.sub] || map[m.k];
  return m._sub[k] || null;
}
/* the record's own name for the last crumb — `DETAIL_LABEL` is declared up top */
function detailRecordLabel(){ return DETAIL_LABEL; }

function drawTrail(){
  const trail = device.querySelector('.shell .crumb-trail');
  if(!trail) return;
  const parts = trailParts();
  const sep = `<span class="crumb-sep" aria-hidden="true">${I.chevRight}</span>`;
  trail.innerHTML = parts.map((p, i) => {
    const now = i === parts.length - 1;
    return `<li class="crumb-i${now ? ' crumb-now' : ''}">${i ? sep : ''}${now
      ? `<span class="crumb-l" aria-current="page">${esc(p.label)}</span>`
      : `<a class="crumb-l" data-go="${esc(p.go)}">${esc(p.label)}</a>`}</li>`;
  }).join('');
}
/* the bare `.ph` still pays its margins; tidy it the way §78 does */
function tidyPh(){
  const page = device.querySelector('.main .page');
  if(!page) return;
  const ph = page.querySelector('.ph');
  if(!ph) return;
  const top = ph.querySelector('.ph-top');
  if(top && !top.firstElementChild) top.remove();
  const main = ph.querySelector('.ph-main');
  if(main && !main.firstElementChild) main.remove();
  ph.classList.toggle('ph-bare', !ph.firstElementChild);
  ph.classList.toggle('ph-backonly',
    !!ph.querySelector('.ph-back') &&
    ph.querySelectorAll('.ph-main > *, .ph > *:not(.ph-main)').length === 1 &&
    ph.querySelectorAll('.ph-top > *').length === 1);
}
function placeTopbar(){
  try { drawTrail(); tidyPh(); } catch(e){ console.warn('topbar', e); }
}

/* ======================================================================
   RENDER
   ====================================================================== */
const device = document.getElementById('device');
const MO = {key:'', open:{}};

function render(){
  /* guard: an unknown module or a module with no renderer falls to the
     dashboard; a sub the module does not have falls to its first sub. */
  if(!MOD_BY_K[S.mod] || !V[S.mod]){ S.mod = 'home'; S.sub = 'home'; }
  const m = MOD_BY_K[S.mod];
  if(!m._sub[S.sub]) S.sub = firstSub(m);
  DETAIL_LABEL = null;

  const view = V[S.mod];
  const key = S.mod + '/' + S.sub + '/' + (S.id || '');
  const entered = MO.key !== '' && key !== MO.key;
  MO.key = key;

  const OVER = ['nav', 'notif', 'confirm', 'sheet'];
  const opened = OVER.filter(k => S[k] && !MO.open[k]);
  const shown = OVER.filter(k => S[k]);
  for(const k of OVER) MO.open[k] = !!S[k];

  const at = ` data-rail="${S.nav ? 'open' : 'shut'}" data-view="${S.mod}"`
    + (entered ? ' data-enter' : '')
    + (opened.length ? ` data-open="${opened.join(' ')}"` : '')
    + (shown.length ? ` data-shown="${shown.join(' ')}"` : '');

  device.innerHTML = `<div class="app"${at}>
    ${shell()}
    <div class="shell-body">
      ${sidenav()}
      <div class="view-col">
        <main class="main"><div class="page">${view()}</div></main>
      </div>
      ${notifPanel()}
      ${confirmSheet()}
      ${sheetView()}
    </div>
    <div class="pt-toasts" id="toasts"></div>
  </div>`;

  const app = device.querySelector('.app');
  if(app.hasAttribute('data-enter')){
    device.querySelectorAll('.page > .modhead, .page > .sec, .page > .ph, .page > .tabs')
      .forEach((el, i) => el.style.setProperty('--i', Math.min(i, 7)));
  }
  dsStagger(device.querySelector('.page'));

  placeTopbar();

  /* Tal's summary types itself — last, after the topbar pass, per the design
     system's contract. Wrapped: a throw in a nicety must not take the render. */
  try {
    if(typeof dsTypeSummary === 'function'){
      dsTypeSummary(device.querySelector('.modhead .ai-aura.talsum > .ai-body > p'), key);
    }
  } catch(e){ console.warn('talsum', e); }

  writeHash();
}

/* ======================================================================
   THE URL IS WHERE YOU ARE — hash `#mod/sub[/id]`, `replaceState` out,
   read back on load and on the back button.
   ====================================================================== */
function writeHash(){
  const parts = [S.mod, S.sub];
  if(S.id) parts.push(S.id);
  try { history.replaceState(null, '', '#' + parts.join('/')); } catch(e){}
}
function readHash(){
  const p = location.hash.slice(1).split('/').filter(Boolean);
  if(!p.length) return false;
  if(!MOD_BY_K[p[0]] || !V[p[0]]) return false;
  S.mod = p[0];
  S.sub = (p[1] && MOD_BY_K[p[0]]._sub[p[1]]) ? p[1] : firstSub(MOD_BY_K[p[0]]);
  S.id = p[2] || null;
  return true;
}
window.addEventListener('hashchange', () => {
  if(!readHash()) return;
  S.nav = S.notif = S.acct = false; S.confirm = null; S.sheet = null;
  render();
});

/* ======================================================================
   NAVIGATION — one delegated listener on `#device`, which outlives every
   render. `data-go` carries `mod/sub[/id]`; everything else is a flag.
   ====================================================================== */
function go(dest){
  const p = String(dest).split('/');
  const mod = p[0], sub = p[1], id = p[2];
  if(!MOD_BY_K[mod] || !V[mod]) return;                 /* unbuilt module */
  S.mod = mod;
  S.sub = (sub && MOD_BY_K[mod]._sub[sub]) ? sub : firstSub(MOD_BY_K[mod]);
  S.id = id || null;
  S.nav = false; S.notif = false; S.acct = false;
  render();
  const main = device.querySelector('.main');
  if(main) main.scrollTop = 0;
}

device.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-toggle],[data-close],[data-confirm],[data-do],[data-readall],[data-tab],[data-filter],[data-act],[data-sheet]');

  /* a click outside the account menu shuts it — answered before the guard */
  if(S.acct && !e.target.closest('.acct-t, .acct-menu')){ S.acct = false; render(); }
  if(!t) return;
  const d = t.dataset;

  if(d.close !== undefined){
    if(t.classList.contains('modal') && e.target !== t) return;
    S[d.close] = d.close === 'confirm' || d.close === 'sheet' ? null : false;
    return render();
  }
  if(d.readall){
    ADMIN_NOTIF.forEach(n => { if(!n.rd && !S.read.includes(n.h)) S.read.push(n.h); });
    return render();
  }
  if(d.confirm !== undefined){ S.confirm = d.confirm; return render(); }
  if(d.do !== undefined){ return doAction(d.do, t); }
  if(d.toggle){ S[d.toggle] = !S[d.toggle]; return render(); }
  if(d.tab !== undefined){ setTab(d.tab); return render(); }
  if(d.filter !== undefined){
    const [name, val] = d.filter.split(':');
    setFilter(name, val); return render();
  }
  if(d.sheet !== undefined){ S.sheet = d.sheet; return render(); }
  if(d.act !== undefined){ return doAction(d.act, t); }
  if(d.read && !S.read.includes(d.read)) S.read.push(d.read);
  if(d.go !== undefined){ return go(d.go); }
});

/* Every gated/destructive action funnels through `doAction`; `ACTIONS` is
   declared up near the page summaries, and each module registers its own. */
function doAction(key, el){
  S.sheet = null;                          /* any action dismisses an open sheet */
  const name = key.split(':')[0];
  const fn = ACTIONS[key] || ACTIONS[name];
  if(fn){ fn(key, el); render(); return; }
  /* a bare `toast:Message` action just shows the message */
  if(name === 'toast'){ toast(key.slice(6)); render(); return; }
  /* unknown: close any dialog and re-render, never throw */
  S.confirm = null; render();
}

/* ======================================================================
   THE VIEWPORT (frame) PICKER — prototype chrome. One document, three sizes,
   each keeping its true pixel width so the container queries resolve honestly.
   ====================================================================== */
const VP_SIZE = {mobile:[390, 844], tablet:[744, 1133], fluid:[1440, 900]};
const fitBox = document.getElementById('fit');
function fitFrame(){
  const vp = device.dataset.vp;
  const stage = fitBox.parentElement;
  const pct = document.getElementById('vpscale');
  if(vp === 'fluid'){
    device.style.transform = 'none';
    device.style.width = '100%';
    device.style.height = Math.max(520, window.innerHeight - stage.getBoundingClientRect().top) + 'px';
    fitBox.style.width = '100%';
    fitBox.style.height = device.style.height;
    if(pct) pct.textContent = Math.round(stage.clientWidth) + 'px';
    return;
  }
  const [w, h] = VP_SIZE[vp] || VP_SIZE.mobile;
  device.style.width = w + 'px';
  device.style.height = Math.min(h, Math.round(window.innerHeight * 0.8)) + 'px';
  const avail = stage.clientWidth - 8;
  const scale = Math.min(1, avail / w);
  device.style.transform = scale < 1 ? `scale(${scale})` : 'none';
  fitBox.style.width = Math.round(w * scale) + 'px';
  fitBox.style.height = Math.round(parseFloat(device.style.height) * scale) + 'px';
  if(pct) pct.textContent = scale < 1 ? Math.round(scale * 100) + '%' : '100%';
}
document.getElementById('vp').addEventListener('click', e => {
  const b = e.target.closest('button[data-vp]');
  if(!b) return;
  document.querySelectorAll('#vp button').forEach(x => x.classList.toggle('on', x === b));
  device.dataset.vp = b.dataset.vp;
  S.nav = false;
  render();
  fitFrame();
});
window.addEventListener('resize', fitFrame);
document.getElementById('reset').onclick = () => {
  S.mod = 'home'; S.sub = 'home'; S.id = null;
  S.nav = S.notif = S.acct = false; S.confirm = null; S.sheet = null;
  S.read = []; S.tab = {}; S.filter = {};
  render();
};

/* the prototype-bar wordmark (a black mark scaled by the chrome) */
document.getElementById('ptLogo').innerHTML = `<img src="${LOGO_K}" alt="TalentNext">`;

/* ---- boot ---- */
readHash();
render();
fitFrame();
</script>
</body>
</html>
