   MARKETPLACE & INTERVIEWS
   ====================================================================== */
/* ======================================================================
   INTERVIEWS (user-stories Epic 8) — the booking register with a STAGE
   machine (8.1), the resolve-a-failed-interview flow (8.2), and the
   recordings register with consent, retention and status (8.3).
   ====================================================================== */
const emailOf = n => (USERS.find(u => u.name === n) || {}).email || '';
const candByName = n => CANDS.find(c => c.name === n);
/* A booking's stage follows events: paid → Booked, the recording → Held, the
   evaluation → Reported; a scheduled time that passed with no recording → Not
   held; a failed one dealt with through Resolve → Resolved. */
const bkStage = b => b.stage || 'booked';
const BK_STAGE = {booked:'Booked', held:'Held', reported:'Reported', nothld:'Not held', resolved:'Resolved'};
const bkStageTag = b => { const s = bkStage(b);
  return tag(s === 'reported' ? 'active' : s === 'held' ? 'pending' : (s === 'nothld' || s === 'resolved') ? 'inactive' : '', BK_STAGE[s]); };
const bkOverdue = b => bkStage(b) === 'held' && b.overdue;
const bkNeedsAttention = b => bkOverdue(b) || bkStage(b) === 'nothld';
const bkReportDue = b => bkStage(b) !== 'held' ? '—'
  : b.overdue ? `<span class="statw err">Report ${b.overdueDays} day${b.overdueDays === 1 ? '' : 's'} overdue</span>` : 'Within 24h';
const escrowTag = e => e === 'held' ? '<span class="tag sm green">Held</span>' : e === 'released' ? '<span class="tag sm">Released</span>' : e === 'refunded' ? '<span class="tag sm">Refunded</span>' : '<span class="tag sm">n/a</span>';
/* RECORDINGS — a recording exists once the interview was held. SCENES consent
   governs employer visibility only; status is Available / Deleted / Expired. */
const scenesConsent = b => b.scenesWithdrawn ? 'Withdrawn' : ((candByName(b.cand) || {}).consent && candByName(b.cand).consent.scenes ? 'Given' : 'Not asked');
const empVisible = b => scenesConsent(b) === 'Given' ? 'On' : 'Off';
const recStatus = b => b.recDeleted ? 'Deleted' : b.recExpired ? 'Expired' : 'Available';

(function seedInterviews(){
  const cycle = ['reported', 'held', 'booked', 'nothld', 'reported', 'held', 'resolved', 'booked', 'held'];
  const now = new Date();
  BOOKINGS.forEach((b, i) => {
    if(!b.stage) b.stage = b.status === 'cancelled' ? 'resolved' : b.status === 'pending' ? 'booked' : cycle[i % cycle.length];
    const s = b.stage;
    if(b.fee){
      if(s === 'reported') b.escrow = 'released';
      else if(s === 'resolved') b.escrow = 'refunded';
      else if(b.escrow !== 'refunded') b.escrow = 'held';
    }
    if(s === 'held'){ b.overdue = (i % 2 === 0); b.overdueDays = b.overdue ? 1 + (i % 3) : 0; }
    b.recExists = (s === 'held' || s === 'reported' || (s === 'resolved' && i % 3 === 0));
    if(b.recExists){
      b.recLen = `${28 + (i * 7) % 25}:${String((i * 13) % 60).padStart(2, '0')}`;
      b.transcript = i % 11 === 0 ? 'Generating' : i % 19 === 0 ? 'Failed' : 'Ready';
      const d = b.date ? new Date(b.date + 'T00:00:00') : new Date();
      const ret = new Date(d); ret.setMonth(ret.getMonth() + 24);
      b.retDate = ret; b.retention = ret.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
      b.recExpired = ret < now;
      b.expiringSoon = !b.recExpired && (ret - now) < 30 * 864e5;
    }
  });
  /* one Deleted and one Expired row for the demo (§74 — the seed has no telemetry) */
  const rec = BOOKINGS.filter(b => b.recExists);
  if(rec[2]) rec[2].recDeleted = true;
  if(rec[4]){ const r = new Date(now); r.setMonth(r.getMonth() - 2); rec[4].retDate = r; rec[4].retention = r.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); rec[4].recExpired = true; }
})();

PAGESUM['market/bookings'] = () => {
  const attn = BOOKINGS.filter(bkNeedsAttention).length;
  return `${BOOKINGS.length} interviews on the register. <b>${attn} need attention</b> — held with the report overdue, or the time passed with no interview. The register is a record; a stuck one is dealt with through Resolve.`;
};
PAGESUM['market/recordings'] = () => {
  const rec = BOOKINGS.filter(b => b.recExists);
  const soon = rec.filter(b => b.expiringSoon).length;
  return `${rec.filter(b => recStatus(b) === 'Available').length} recordings available, kept 24 months then deleted automatically${soon ? `; <b>${soon} expiring within 30 days</b>` : ''}. Playing one is logged. Withdrawing SCENES consent stops employers seeing the clips; deleting leaves the level unchanged.`;
};

/* 8.2 — RESOLVE A FAILED INTERVIEW. Offered only on an overdue Held booking or a
   Not-held one. Chase the agent (a nudge, no state change) or Refund and close
   (full refund from escrow, booking → Resolved, nothing recovered from the
   agent). Every resolution carries a reason to the audit log at High severity. */
SHEETS.resolve = id => {
  const b = BOOKINGS.find(x => x.id === id); if(!b) return {title:'Resolve', body:'', ok:''};
  const held = bkStage(b) === 'held';
  return {title:`Resolve — ${b.cand} with ${b.agent}`, ok:'Apply', act:'doresolve:' + id,
    body:`${kv([
        ['Candidate', `${esc(b.cand)} · ${esc(emailOf(b.cand))}`],
        ['Agent', `${esc(b.agent)} · ${esc(emailOf(b.agent))}`],
        ['Interview', `${esc(b.kind)} · ${esc(b.slot)} · ${held ? 'held' : 'not held'}`],
        ['Report', held ? `Outstanding, ${b.overdueDays} day${b.overdueDays === 1 ? '' : 's'} overdue` : 'No interview took place'],
        ['Payment', `${b.fee ? money(b.fee) : 'Free'} · ${b.escrow} in escrow`]
      ])}
      ${fieldHtml({k:'outcome', l:'Outcome', t:'select', opts:[['', 'Choose an outcome…'], ...(held ? [['chase', 'Chase the agent']] : []), ['refund', 'Refund and close']]}, '')}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — written to the audit log; never shown to the candidate or agent'})}`};
};
ACTIONS.doresolve = key => {
  const b = BOOKINGS.find(x => x.id === key.split(':')[1]); const v = readForm(); if(!b) return;
  if(!v.outcome){ toast('Choose an outcome', 'warn'); return 'keep'; }
  if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  if(v.outcome === 'chase'){
    audit('Chased agent for outstanding report', `${b.cand} with ${b.agent} · ${v.reason}`, 'Marketplace & Interviews', 'high');
    toast(`${b.agent} chased for the report`); return;
  }
  S._pending = {reason: v.reason};
  askConfirm({mk:'warning', title:`Refund ${b.cand} ${b.fee ? money(b.fee) : 'the fee'} and close this interview?`, body:'They will be free to book again and the agent will not be paid. The refund comes out of escrow, so nothing is recovered from the agent.', ok:'Refund and Close', danger:true, act:'dorefundclose:' + b.id});
};
ACTIONS.dorefundclose = key => {
  const b = BOOKINGS.find(x => x.id === key.split(':')[1]); const v = S._pending || {}; S._pending = null; S.confirm = null; if(!b) return;
  b.stage = 'resolved'; b.status = 'cancelled'; if(b.escrow === 'held') b.escrow = 'refunded';
  audit('Resolved failed interview — refunded and closed', `${b.cand} with ${b.agent}${b.fee ? ' · ' + money(b.fee) : ''} · ${v.reason}`, 'Marketplace & Interviews', 'high', {from:'held', to:'resolved'});
  toast(`${b.cand} refunded${b.fee ? ' ' + money(b.fee) : ''} — interview closed`);
};

const recStatusTag = b => { const s = recStatus(b); return tag(s === 'Available' ? 'active' : '', s); };
const scenesTag = b => { const s = scenesConsent(b); return tag(s === 'Given' ? 'active' : s === 'Withdrawn' ? 'inactive' : '', s); };
function marketRecordings(){
  const q = getFilter('q', ''), cf = getFilter('recscenes', 'all'), stf = getFilter('recstatus', 'all'), exp = getFilter('recexp', '') === '1';
  const key = s => s.toLowerCase().replace(/\s/g, '');
  const all = BOOKINGS.filter(b => b.recExists);
  const recs = all
    .filter(b => cf === 'all' ? true : key(scenesConsent(b)) === cf)
    .filter(b => stf === 'all' ? true : recStatus(b).toLowerCase() === stf)
    .filter(b => !exp || b.expiringSoon)
    .filter(b => hit(q, b.cand, b.agent, emailOf(b.cand)));
  const expToggle = `<button class="btn ${exp ? 'btn-p' : 'btn-g'} btn-sm noic" data-filter="recexp:${exp ? '' : '1'}" aria-pressed="${exp}">Expiring soon</button>`;
  return `
  <section class="sec">
    ${searchHead('Recordings', 'Every interview recording, with its consent and retention state. The register shows that a recording exists — not its content.', exportBtn('Recordings'), 'Search by candidate or agent')}
    ${lstTools('Search by candidate or agent', `${expToggle}
      ${filterDd('recscenes', 'all', [['all', 'Any consent'], ['given', 'Given'], ['withdrawn', 'Withdrawn'], ['notasked', 'Not asked']], 'SCENES')}
      ${filterDd('recstatus', 'all', [['all', 'Any status'], ['available', 'Available'], ['deleted', 'Deleted'], ['expired', 'Expired']], 'Status')}`)}
    ${recs.length ? table(
      [{label:'Candidate'}, {label:'Agent'}, {label:'Interview'}, {label:'Length', num:true}, {label:'Transcript'}, {label:'SCENES consent'}, {label:'Employer visibility'}, {label:'Retention'}, {label:'Status'}, ACT_COL],
      recs.map(b => { const avail = recStatus(b) === 'Available';
        return {cells:[
          idCell(b.cand, emailOf(b.cand)),
          esc(b.agent),
          `${esc(b.slot)} · ${esc(b.kind)}`,
          esc(b.recLen || '—'),
          esc(b.transcript || '—'),
          scenesTag(b),
          empVisible(b),
          esc(b.retention || '—'),
          recStatusTag(b),
          rowActs([
            ...(avail ? [['play', 'Play recording', `data-act="recplay:${b.id}"`]] : []),
            ...(avail && b.transcript === 'Ready' ? [['download', 'Download transcript', `data-act="dltranscript:${b.id}"`]] : []),
            ...(scenesConsent(b) === 'Given' ? [['close', 'Withdraw SCENES consent', `data-sheet="recwithdraw:${b.id}"`]] : []),
            ...(avail ? [['delete', 'Delete recording', `data-sheet="recdelete:${b.id}"`]] : [])
          ])
        ]}; }))
      : emptyState('video', 'No recordings match', q || cf !== 'all' || stf !== 'all' || exp ? 'Nothing matches the current filters.' : 'No recordings yet.')}
  </section>`;
}

      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — written to the audit log'})}
      <p class="t-desc">The recording, its transcript and every clip cut from it are deleted ahead of the 24-month retention. The candidate’s level and the agent’s report both stand.</p>`};

ACTIONS.askrecdelete = key => {
  const b = BOOKINGS.find(x => x.id === key.split(':')[1]); const v = readForm(); if(!b) return;
  if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }

ACTIONS.dorecdelete = key => {

  b.recDeleted = true;

/* NEW (flow review, 11 Sep 2026): Play recording and Download transcript were toast
   no-ops. Play now opens a prototype player + transcript sheet; Download writes a real
   .txt file (a Blob download). The transcript body is authored placeholder copy — the
   seed has no real transcripts. */
function recTranscript(b){
  return [
    `TalentNext interview transcript (prototype)`,
    `${b.cand} with ${b.agent} — ${b.kind} — ${b.slot}`,
    ``,
    `[00:00] ${b.agent}: Thanks for making the time. Tell me about something you have shipped recently.`,
    `[00:14] ${b.cand}: I led a small team on a payments feature, from the first spec to release.`,
    `[02:38] ${b.agent}: Walk me through a decision you later reversed, and what changed your mind.`,
    `[03:02] ${b.cand}: We started on a message queue, then moved to a simpler scheduled job once we knew the real load.`,
    `[07:51] ${b.agent}: Good. That is the kind of judgement I was looking for at this level.`,
    ``,
    `Note: authored placeholder transcript for the prototype; no real recording is stored.`
  ].join('\n');
}
SHEETS.recording = id => {
  const b = BOOKINGS.find(x => x.id === id);
  if(!b) return {title:'Recording', body:'This recording is no longer available.', ok:''};
  return {title:`${b.cand} with ${b.agent}`, ok:'Download Transcript', act:'dltranscript:' + b.id,
    body:`<div style="position:relative;aspect-ratio:16/9;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden">
        <div style="width:56px;height:56px;border-radius:999px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 -960 960 960" width="26" height="26" fill="#fff">${inner('play')}</svg>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:12px;display:flex;gap:8px;align-items:center">
          <span>0:00</span><div style="flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:999px"><div style="width:22%;height:100%;background:#fff;border-radius:999px"></div></div><span>${esc(b.kind)}</span>
        </div>
      </div>
      <p class="t-desc">Prototype player — video streaming is not wired in this build.</p>
      ${kv([['Candidate', esc(b.cand)], ['Agent', esc(b.agent)], ['Kind', esc(b.kind)], ['When', esc(b.slot)]])}
      ${secHead('Transcript')}
      <div style="max-height:220px;overflow:auto;background:var(--surface-2);border:1px solid var(--rule);padding:12px;white-space:pre-wrap;font-size:13px;line-height:1.5">${esc(recTranscript(b))}</div>`};
};
ACTIONS.dltranscript = key => {
  const b = BOOKINGS.find(x => x.id === key.split(':')[1]); if(!b) return;
  try{
    const blob = new Blob([recTranscript(b)], {type:'text/plain'});
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = `transcript-${b.cand.replace(/\s+/g, '-').toLowerCase()}.txt`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }catch(e){}
  audit('Opened interview transcript', `${b.cand} with ${b.agent}`, 'Marketplace & Interviews', 'high'); toast('Transcript downloaded');
};

const verifyTag = v => v === 'ok' ? '<span class="tag sm green">Verified</span>'
  : v === 'review' ? '<span class="tag sm warn">Under review</span>'

};
ACTIONS.dorelease = key => { const p = PAYOUTS.find(x => x.id === key.split(':')[1]); if(p){ p.status = 'settled'; p.when = 'Released'; audit('Released payout', `${p.agent} — ${money(p.net)}`, 'Finance & Settlement', 'high'); toast(money(p.net) + ' released to ' + p.agent); } S.confirm = null; };
ACTIONS.askreleaseall = () => askConfirm({mk:'warning', stepup:true, title:`Release all ${heldPayouts()} held payouts?`, body:`${money(owedAgents())} leaves escrow now instead of on the weekly cycle. Payouts under review are not touched. Each release is logged.`, ok:`Release ${money(owedAgents())}`, act:'doreleaseall'});
ACTIONS.doreleaseall = () => { PAYOUTS.filter(p => p.status === 'held' && p.net).forEach(p => { p.status = 'settled'; p.when = 'Released'; audit('Released payout', `${p.agent} — ${money(p.net)}`, 'Finance & Settlement', 'high'); }); toast('All held payouts released'); S.confirm = null; };
ACTIONS.askhold = key => { const p = PAYOUTS.find(x => x.id === key.split(':')[1]); if(!p) return; askConfirm({mk:'warning', title:`Hold ${p.agent}’s ${money(p.net)} for review?`, body:'The payout leaves the weekly cycle until you clear the hold. The agent is told it is under review.', ok:'Hold', danger:true, act:'dohold:' + p.id}); };
ACTIONS.dohold = key => { const p = PAYOUTS.find(x => x.id === key.split(':')[1]); if(p){ p.status = 'review'; p.when = 'On hold — under review'; audit('Held payout for review', `${p.agent} — ${money(p.net)}`, 'Finance & Settlement', 'high'); toast('Payout held for review'); } S.confirm = null; };
ACTIONS.askclearhold = key => { const p = PAYOUTS.find(x => x.id === key.split(':')[1]); if(!p) return; askConfirm({mk:'check', title:`Clear the hold on ${p.agent}’s payout?`, body:`${p.net ? money(p.net) : 'It'} returns to the weekly settlement cycle.`, ok:'Clear Hold', act:'doclearhold:' + p.id}); };
ACTIONS.doclearhold = key => { const p = PAYOUTS.find(x => x.id === key.split(':')[1]); if(p){ p.status = 'held'; p.when = 'Awaiting settlement'; audit('Cleared payout hold', p.agent, 'Finance & Settlement', 'notice'); toast('Hold cleared'); } S.confirm = null; };
ACTIONS.askpaid = key => {
  const i = INVOICES.find(x => x.id === key.split(':')[1]); if(!i) return;
  askConfirm({mk:'check', title:`Mark ${i.num} paid?`,
    body:`Records ${money(i.amount)} from ${i.party} as collected and closes the invoice. Written to the audit log.`,
    ok:'Mark Paid', act:'dopaid:' + i.id});
};
ACTIONS.dopaid = key => { const i = INVOICES.find(x => x.id === key.split(':')[1]); if(i){ i.status = 'paid'; audit('Marked invoice paid', `${i.num} — ${money(i.amount)}`, 'Finance & Settlement', 'notice'); toast(i.num + ' marked paid'); } S.confirm = null; };
/* where a refund's money comes from, and who is paid — one line under the card */
const refundSource = r => {
  const k = r.rtype || (r.type === 'Credit' ? 'credit' : null);
  return k === 'interview' ? ' · platform share first' : k === 'cohort' ? ' · pro-rated by intent price' : k === 'sponsored' ? ' · paid to the sponsoring employer' : k === 'credit' ? ' · as a credit, not cash' : '';
};
/* the agent an interview charge belongs to, read off the charge's own line */
const agentOfTxn = t => { const m = t && /—\s*(.+)$/.exec(t.kind || ''); return m && (t.cat === 'interview') ? m[1].trim() : null; };
ACTIONS.askrefappr = key => {
  const r = REFUNDS.find(x => x.id === key.split(':')[1]); if(!r) return;
  /* SA-06 E2 — a chargeback already in flight on the same charge: approving would
     pay twice, so it is refused, not warned. */
  const inflight = REFUNDS.find(x => x !== r && x.txnRef === r.txnRef && x.status === 'processing');
  if(inflight){ toast(`A ${inflight.type.toLowerCase()} is already in flight on ${r.txnRef} — approving would pay twice (SA-06 E2)`, 'warn'); return; }
  /* SA-06 E3 — the agent's payout for this interview has already settled: the
     refund comes from the platform share and the clawback is carried to the
     agent's next payout. Said in the confirmation, not hidden in a rule. */
  const t = TXNS.find(x => x.ref === r.txnRef); const ag = agentOfTxn(t);
  const settled = ag && PAYOUTS.some(p => p.agent === ag && p.status === 'settled');
  const k = r.rtype || (r.type === 'Credit' ? 'credit' : 'interview');
  const to = k === 'sponsored' ? 'the sponsoring employer, who paid' : k === 'credit' ? `${r.party}’s account as a goodwill credit` : 'the original payment method';
  askConfirm({mk:'warning', stepup:true, title:`Approve ${k === 'credit' ? 'credit' : 'refund'} to ${r.party}?`,
    body:`${money(r.amount)} against ${r.txnRef} goes to ${to}.${k === 'interview' ? ' Clawed back from the platform share first.' : k === 'cohort' ? ' Pro-rated by the intent price.' : ''}${settled ? ` <b>${ag}’s payout has already settled</b> — the refund comes from the platform share and the clawback is carried to their next payout (SA-06 E3).` : ''} No approval threshold is set, so this is yours to decide (E1). This can’t be undone.`,
    ok: k === 'credit' ? 'Issue Credit' : 'Approve Refund', danger:true, act:'dorefappr:' + r.id});
};
ACTIONS.dorefappr = key => { const r = REFUNDS.find(x => x.id === key.split(':')[1]); if(r){ r.status = 'approved'; const t = TXNS.find(x => x.ref === r.txnRef); if(t) t.status = 'refunded'; audit('Approved refund', `${r.party} — ${money(r.amount)}`, 'Finance & Settlement', 'high'); toast(money(r.amount) + ' refunded to ' + r.party); } S.confirm = null; };
ACTIONS.askrefdecl = key => {
  const r = REFUNDS.find(x => x.id === key.split(':')[1]); if(!r) return;
  askConfirm({mk:'warning', title:`Decline refund for ${r.party}?`,
    body:`Declines the ${money(r.amount)} request. The requester is notified and the decision is recorded in the audit log.`,
    ok:'Decline Request', danger:true, act:'dorefdecl:' + r.id});
};
ACTIONS.dorefdecl = key => { const r = REFUNDS.find(x => x.id === key.split(':')[1]); if(r){ r.status = 'declined'; audit('Declined refund', `${r.party} — ${money(r.amount)}`, 'Finance & Settlement', 'notice'); toast(r.party + '’s refund declined'); } S.confirm = null; };

  const rows = CAMPAIGNS.filter(c => sf === 'all' ? true : c.status === sf).filter(c => hit(q, c.name, c.channel, c.owner));
  return `
  <section class="sec">
    ${searchHead('Campaigns', 'Each runs on one channel with a budget, and is credited the leads and conversions it drove.',
      `${exportBtn('Campaigns')} ${addBtn('campaign', 'New Campaign')}`, 'Search campaigns')}
    ${filterStrip('cmstat', 'all', [['all', 'All', CAMPAIGNS.length], ...['active', 'draft', 'paused', 'ended'].map(s => [s, cap(s), CAMPAIGNS.filter(c => c.status === s).length])])}
    ${lstTools('Search campaigns')}
    ${rows.length ? table(
      [{label:'Campaign'}, {label:'Channel'}, {label:'Spend', num:true}, {label:'Leads', num:true}, {label:'Conv.', num:true}, {label:'CPA', num:true}, {label:'ROI', num:true}, {label:'Status'}, ACT_COL],
      rows.map(c => ({go:'crm/campaigndetail/' + c.id, cells:[
        esc(c.name), esc(c.channel), money(c.spend), String(c.leads), String(c.conv), cpa(c), roi(c), tag(c.status),
        rowActs([editBtn('campaign', c.id),
          ...(c.status === 'active' ? [['pause', 'Pause', `data-act="askstatus:campaign:${c.id}:paused"`], ['stopFilled', 'End', `data-act="askstatus:campaign:${c.id}:ended"`]]
            : c.status === 'ended' ? [] : [['play', c.status === 'draft' ? 'Launch' : 'Resume', `data-act="askstatus:campaign:${c.id}:active"`]]),
          ...(c.status === 'active' ? [] : [delBtn('campaign', c.id)])])
      ]})))
      : emptyState('spark', 'No campaigns match', 'Nothing in this filter yet.')}
  </section>`;
}

function crmCampaignDetail(){
  const c = CMP_BY_ID[S.id] || CAMPAIGNS[0];
  DETAIL_LABEL = c.name;
  const leads = LEADS.filter(l => l.campaign === c.name);
  const sum = `<b>${esc(c.name)}</b> runs on ${esc(c.channel)} with a ${money(c.budget)} budget, ${money(c.spend)} spent. ${c.leads} leads, ${c.conv} converted — a cost per acquisition of ${cpa(c)}.`;
  return `
  ${detailHead('crm/campaigns', sum)}
  <section class="sec">
    ${aiHead(esc(c.name), esc(c.channel) + ' · owned by ' + esc(c.owner),
      `${tag(c.status)}
       <button class="btn btn-g btn-sm noic" data-sheet="rec:campaign:${c.id}">${I.edit} Edit</button>
       <button class="btn btn-g btn-sm noic" data-act="toast:Campaign link copied — talentnext.io/go/${esc(c.name.toLowerCase())}">${I.link} Copy Link</button>
       ${c.status === 'active' ? `<button class="btn btn-g btn-sm noic" data-act="askstatus:campaign:${c.id}:paused">Pause</button><button class="btn btn-g btn-sm noic" data-act="askstatus:campaign:${c.id}:ended">End</button>`
         : c.status === 'ended' ? '' : `<button class="btn btn-p btn-sm noic" data-act="askstatus:campaign:${c.id}:active">${c.status === 'draft' ? 'Launch' : 'Resume'} ${I.arrowRight}</button>`}`)}

      ['money', 'Spend', money(c.spend), `of ${money(c.budget)} budget`],

      ['check', 'Converted', String(c.conv), 'to accounts'],
      ['chart', 'CPA', cpa(c), 'cost per account']

const sevTag = s => s === 'high' ? '<span class="tag sm red">High</span>'
  : s === 'notice' ? '<span class="tag sm warn">Notice</span>' : '<span class="tag sm">Info</span>';

  const deg = SVC_HEALTH.filter(s => s.state !== 'live');

ACTIONS.askdisconnect = key => { const g = INTG_BY_ID[key.split(':')[1]]; if(!g) return; askConfirm({mk:'warning', title:`Disconnect ${g.name}?`, body:`${g.detail} stops working across the platform until it is reconnected. ${g.cat === 'Payments' ? 'No charge, escrow hold or payout can run while it is off.' : ''}`, ok:'Disconnect', danger:true, act:'dodisconnect:' + g.id}); };

/* an audit line's id — given on first sight, so a sheet can name one line while
   `unshift` keeps moving the indexes */
let AUD_SEQ = 0;
const audId = a => a.id || (a.id = 'al' + (++AUD_SEQ));
/* SA-15 A1 — the date facet, read off the seed's own `when` words */
const audWhen = a => /^(Today|Just now)/.test(a.when) ? 'today' : /^Yest/.test(a.when) ? 'yest' : 'older';
function systemAudit(){
  const sf = getFilter('audsev', 'all'), q = getFilter('q', ''), mf = getFilter('audmod', 'all'), wf = getFilter('audwhen', 'all');
  const mods = [...new Set(AUDIT.map(a => a.mod))];
  const rows = AUDIT.filter(a => sf === 'all' ? true : (a.sev || 'info') === sf).filter(a => mf === 'all' || a.mod === mf).filter(a => wf === 'all' || audWhen(a) === wf).filter(a => hit(q, a.who, a.act, a.obj, a.mod, a.role, a.ip));
  return `
  <section class="sec">
    ${searchHead('Audit log', 'Every consequential action, in order. Immutable and retained for compliance. A line opens to its before and after state.',
      `${exportBtn('Audit log')} <button class="btn btn-g btn-sm noic" data-sheet="auditalert">${I.notification} Alert Rules</button>`, 'Search by actor, action or object')}
    ${filterStrip('audsev', 'all', [
      ['all', 'All', AUDIT.length],
      ['high', 'High', AUDIT.filter(a => a.sev === 'high').length],
      ['notice', 'Notice', AUDIT.filter(a => a.sev === 'notice').length],
      ['info', 'Info', AUDIT.filter(a => (a.sev || 'info') === 'info').length]
    ])}
    <div class="cs lst-filt" role="tablist" aria-label="Module">
      <button role="tab" class="${mf === 'all' ? 'on' : ''}" data-filter="audmod:all">Every module</button>
      ${mods.map(m => `<button role="tab" class="${mf === m ? 'on' : ''}" data-filter="audmod:${esc(m)}">${esc(m)}<span class="lf-n">${AUDIT.filter(a => a.mod === m).length}</span></button>`).join('')}
    </div>
    ${lstTools('Search by actor, action or object',
      filterDd('audwhen', 'all', [['all', 'Any time'], ['today', 'Today'], ['yest', 'Yesterday'], ['older', 'Older']], 'When'))}
    ${rows.length ? table(
      [{label:'When', sort:false}, {label:'Actor'}, {label:'Action'}, {label:'Module'}, {label:'Severity'}, {label:'IP'}, ACT_COL],
      rows.map(a => ({sv:[, a.who, a.act], cells:[
        esc(a.when),
        idCell(a.who, a.role),
        idCell(a.act, a.obj),
        esc(a.mod),
        sevTag(a.sev),
        esc(a.ip),
        rowActs([['view', a.from !== undefined ? 'Inspect before and after' : 'Inspect the line', `data-sheet="auditline:${audId(a)}"`]])
      ]})))
      : emptyState('doc', 'No lines match', 'Nothing in this filter.')}
  </section>`;
}
/* SA-15 A2 / E3 — ONE LINE, READ-ONLY. The before and after state when the
   action changed a value; the fact that it cannot be edited stated on the
   sheet itself, and no save button to contradict it. */
SHEETS.auditline = id => {
  const a = AUDIT.find(x => x.id === id); if(!a) return {title:'Audit line', body:'', ok:''};
  return {title:`${a.act} — ${a.when}`, ok:'',
    body:`${kv([['Actor', `${esc(a.who)} <span class="t-caption">${esc(a.role)}</span>`], ['Target', esc(a.obj)], ['Module', esc(a.mod)], ['Category', esc(a.cat)], ['Severity', sevTag(a.sev)], ['IP', esc(a.ip)]])}
      ${a.from !== undefined ? `<p class="t-label mt5">State</p>${kv([['Before', esc(a.from)], ['After', esc(a.to)]])}` : note('', 'No value changed', 'This line records an event, not a change of state — there is no before and after to show.')}
      <div class="btn-row mt4"><button class="btn btn-g btn-sm noic" data-act="toast:Line ${esc(id)} exported">${I.download} Export This Line</button></div>
      <p class="t-desc">Immutable — a line cannot be edited or removed, by a Super Admin or anyone (SA-15 E3). Which actions must be logged, and for how long, are the open rulings on the register.</p>`};

/* THE THREE SECTION HEADINGS PER REPORT read to their OWN content (Maryam,
   8 Sep 2026: "what is happening / what has been done / what you need to do"
   were the BRIEF for each section, not the headings — name them for the
   report's subject). [ state, recent-log, open-items ] per report. */
const RPT_HEADS = {
  users:      ['Accounts overview',       'Recent account activity',     'Open items'],
  vetting:    ['Vetting queue',           'Recent approvals',            'Awaiting your review'],
  candidates: ['Candidate standing',      'Recent level decisions',      'Reviews to sign off'],
  agents:     ['Agent activity',          'Recent agent activity',       'Actions to take'],
  cohorts:    ['Cohorts running',         'Recent cohort activity',      'Gaps to fill'],
  market:     ['Marketplace this window', 'Recent marketplace activity', 'To settle'],
  employers:  ['Employer accounts',       'Recent employer activity',    'To verify & invoice'],
  finance:    ['Money this window',       'Recent transactions',         'Payments to action'],
  system:     ['System health',           'Recent system activity',      'Compliance & config']
};
function reportPage(key){
  const r = REPORTS[key];
  const [hHead, dHead, tHead] = RPT_HEADS[key];
  const sevL = s => s === 'high' ? 'High' : s === 'notice' ? 'Notice' : 'Info';
  const done = AUDIT.filter(a => r.mods.includes(a.mod)).slice(0, 5);
  const todo = r.todo();
  return `
  <section class="sec">
    ${aiHead(hHead, `The live state of ${esc(r.short.toLowerCase())} right now.`,
      `<button class="btn btn-g btn-sm noic" data-go="${r.go}">Open ${esc(r.short)}</button>`)}
    ${kv(r.happening().map(([l, v]) => [l, `<b>${v}</b>`, 'n']))}
  </section>

  <section class="sec">
    ${aiHead(dHead, 'The latest actions logged in this area.',
      '<button class="btn btn-g btn-sm noic" data-go="system/audit">Audit Log</button>')}
    ${done.length
      ? `<div class="tile-stack">${done.map(a => memRow(a.who, `${esc(a.act)} · ${esc(a.obj)}`, tag(a.sev, sevL(a.sev)))).join('')}</div>`
      : emptyState('doc', 'Nothing logged yet', 'No recent actions in this area.')}
  </section>

  <section class="sec">
    ${aiHead(tHead, 'Open items in this area waiting on a Super Admin.')}
    ${todo.length
      ? kv(todo.map(([l, v]) => [l, `<b>${v}</b>`, 'n']))
      : emptyState('doc', 'All clear', 'Nothing is pending in this area right now.')}
  </section>`;
}

ACTIONS.changepw = () => {
  const cur = (device.querySelector('#pwcur') || {}).value || '';
  const np = (device.querySelector('#pwnew') || {}).value || '';
  const cp = (device.querySelector('[data-f="cp"]') || {}).value || '';
  if(!cur){ toast('Enter your current password', 'warn'); return; }
  if(!pwOK(np)){ toast(PW_RULE_TEXT, 'warn'); return; }
  if(np === cur){ toast('Choose a password you have not used as your current one', 'warn'); return; }
  if(np !== cp){ toast('Both new passwords must match', 'warn'); return; }
  for(let i = SESSIONS.length - 1; i >= 0; i--) if(!SESSIONS[i].current) SESSIONS.splice(i, 1);
  audit('Changed own password', ME.name, 'Settings', 'high');
  toast('Password changed. Every other session has been signed out.');
};
ACTIONS.phonesend = () => {
  const np = ((device.querySelector('[data-f="newphone"]') || {}).value || '').trim();
  const pw = (device.querySelector('[data-f="phonepw"]') || {}).value || '';
  if(!np || np.replace(/[^\d]/g, '').length < 7){ toast('Enter a valid mobile number', 'warn'); return; }
  if(!pw){ toast('Enter your current password to change where codes are sent', 'warn'); return; }
  S._newPhone = np; S.secPhone = 'code';
  toast('Code sent to the new number');
};
ACTIONS.phonecancel = () => { S.secPhone = 'idle'; S._newPhone = null; };
ACTIONS.phoneverify = () => {
  const code = ((device.querySelector('#pcode') || {}).value || '').trim();
  if(!/^\d{6}$/.test(code)){ toast('That code is not right', 'warn'); return; }
  const from = otpMaskPhone(ME.phone); ME.phone = S._newPhone;
  S.secPhone = 'idle'; S._newPhone = null;

};
ACTIONS.revoke = key => { const i = SESSIONS.findIndex(s => s.id === key.split(':')[1]); if(i >= 0){ const s = SESSIONS[i]; SESSIONS.splice(i, 1); audit('Revoked session', s.dev, 'Settings', 'high'); toast('Session revoked'); } };

ACTIONS.dorevokeall = () => { for(let i = SESSIONS.length - 1; i >= 0; i--) if(!SESSIONS[i].current) SESSIONS.splice(i, 1); audit('Revoked all other sessions', ME.name, 'Settings', 'high'); toast('All other sessions signed out'); S.confirm = null; };

  /* SA-02 A1 — the step-up gate on grant, revoke, View As and release-all. Off,

/* ======================================================================
   SA-02 — THE SIGN-IN SCENE. Blocked in the journey (every recovery path and
   the step-up model are unruled), so what is drawn is the part that has a
   basis on record: email + password, then the authenticator code the seed's
   own sign-in configuration requires of internal staff (`AUTH_CFG`: "Two-factor
   · Required for internal staff"). It reuses the candidate portal's auth
   composition whole — `.auth-card` with the brand column and `.auth-col`, the
   `.form-page`, the `.auth-id` identity panel on the code step — because a
   staff sign-in that looked unlike the platform's would be a fifth design.

   ROLE SWITCHING (A2) DOES NOT APPEAR, DELIBERATELY. The candidate login offers
   a role picker because that account can be three people; Derek Sole holds one
   role, so a picker would be a control with one option. It comes back when a
   multi-role staff account signs in here — the register carries the ruling.
   The lost-device, SSO-outage and anomalous-sign-in exceptions (E1–E3) are
   stated on the code step as the open rulings they are; there is no
   "can't use your authenticator" link, because it would lead nowhere yet.

   THE INTRO COPY IS AUTHORED — the candidate's welcome text is about being
   assessed and would be wrong here — and is flagged as such (DESIGN.md §3).
   ====================================================================== */
const AUTH_ART_ADMIN = `
<div class="auth-brand">
  <span class="auth-logo"><img src="${LOGO_K}" alt="TalentNext"></span>
  <div class="auth-intro">
    <h2 class="t-heading-01">TalentNext admin</h2>
    <p class="t-body-02">The console for the people who run the platform — accounts and roles, vetting, cohorts, the marketplace, settlement and the audit log that records all of it.</p>
    <p class="t-body-02 auth-begin">Sign in to continue.</p>
  </div>
  <p class="t-helper-01 auth-foot">&copy; 2026 TALENTnext Limited</p>
</div>
<i class="auth-mark" aria-hidden="true"></i>`;
const authIdPanel = (label, email, back) => `
  <div class="sec sec-id">
    <div class="auth-id">
      <span class="auth-id-l">${label}</span>
      <span class="auth-id-v">${esc(email)}${back ? `<a data-act="${back}">Not you?</a>` : ''}</span>
    </div>
  </div>`;
/* ============ EPIC 1 — STAFF AUTHENTICATION (OTP by email / SMS) ============
   Stories 1.2 (activate), 1.4 (sign in), 1.5 (reset). Two factors always: a
   password, then a six-digit code sent to the email or mobile on the account —
   no authenticator app, no trusted device, the channel chosen every time. A
   prototype accepts any six digits (handoff ruling #3: the flow and its screens,
   not the send). The resend cooldown is enforced behaviourally (an early press is
   refused) rather than ticked live, to keep the OTP field's caret. */
const otpMaskEmail = e => { const [n, d] = String(e || '').split('@'); return d ? `${(n || '').slice(0, 1)}${'•'.repeat(Math.max(3, (n || '').length - 1))}@${d}` : e; };
const otpMaskPhone = p => { const s = String(p || '').replace(/[^\d]/g, ''); return s.length >= 4 ? `+${s.slice(0, 1)} ••• ••• ${s.slice(-4)}` : p; };
function otpOptions(chosen, pickAct, u){
  const opt = (v, label, dest) => `<button data-act="${pickAct}:${v}" style="font:inherit;color:inherit;display:flex;align-items:center;gap:var(--s04);width:100%;text-align:left;padding:var(--s04);border:1px solid ${chosen === v ? 'var(--accent)' : 'var(--rule)'};background:${chosen === v ? 'color-mix(in srgb, var(--accent) 6%, #fff)' : 'var(--background)'};margin-bottom:var(--s03);cursor:pointer">
    <span style="flex:none;width:18px;height:18px;border-radius:999px;border:2px solid ${chosen === v ? 'var(--accent)' : 'var(--border-strong-01)'};display:inline-flex;align-items:center;justify-content:center">${chosen === v ? '<span style="width:8px;height:8px;border-radius:999px;background:var(--accent)"></span>' : ''}</span>
    <span><span style="font-weight:var(--t-w-strong)">${label}</span><br><span class="t-desc">${dest}</span></span></button>`;
  return opt('email', 'Email address', otpMaskEmail(u.email)) + opt('sms', 'Mobile number', otpMaskPhone(u.phone));
}
function otpEntryBlock(sentAt, resendAct, changeAct){
  const left = Math.max(0, 40 - Math.floor((Date.now() - (sentAt || 0)) / 1000));
  return `<div class="sec sec-rule">
    <div class="f"><label for="lcode">Verification code</label>
      <input class="inp fill" id="lcode" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" maxlength="6"></div>
    <p class="t-body-02 aux mt5">${left > 0
      ? `You can resend the code in about ${left}s.`
      : `<a data-act="${resendAct}">Resend code</a>`} &nbsp;·&nbsp; <a data-act="${changeAct}">Use a different method</a></p>
  </div>`;
}
const PW_RULE_TEXT = 'At least 12 characters, with an uppercase letter, a lowercase letter, a number and a special character.';
function pwRules(pw){ pw = pw || ''; return {len:pw.length >= 12, up:/[A-Z]/.test(pw), lo:/[a-z]/.test(pw), num:/\d/.test(pw), sp:/[^A-Za-z0-9]/.test(pw)}; }
const pwOK = pw => { const r = pwRules(pw); return r.len && r.up && r.lo && r.num && r.sp; };
function pwFields(){
  return `<div class="sec sec-rule">
    <div class="f"><label for="np">New password</label>
      <div class="pw-wrap"><input class="inp fill" id="np" type="password" placeholder="Enter a new password" autocomplete="new-password">
        <button class="pw-eye" data-eye="np" aria-label="Show password">${I.view}</button></div></div>
    <div class="f last"><label for="cp">Confirm password</label>
      <input class="inp fill" id="cp" type="password" placeholder="Re-enter the password" autocomplete="new-password"></div>
    <p class="t-desc mt5">${PW_RULE_TEXT}</p>
  </div>`;
}
function authView(){
  const step = S.auth === 'deliver' ? authDeliver()
    : S.auth === 'code' ? authCode()
    : S.auth === 'setpw' ? authSetpw()
    : S.auth === 'reset' ? authReset()
    : authLogin();
  /* `.auth-card` is a CHILD of `.app` — §17/§57 key every rule on
     `.app:has(> .auth-card)` and `.auth-card > .auth-col`, the shape hifi's
     render writes; one element wearing both classes matches neither. */
  return `<div class="app authShell" data-portal="admin"><div class="auth-card">${AUTH_ART_ADMIN}
    <div class="auth-col">
      <header class="shell"><span class="shell-logo" style="padding-left:var(--s05)"><img src="${LOGO_K}" alt="TalentNext"></span></header>
      <main class="main"><div class="page form-page">${step}</div></main>
    </div></div>
    <div class="pt-toasts" id="toasts"></div>
  </div>`;
}
function authLogin(){
  return `
  ${dsPh('Log in', 'Enter the email address and password on your TalentNext staff account.')}
  <div class="sec sec-rule">
    <div class="f"><label for="lem">Email address</label>
      <input class="inp fill" id="lem" type="email" value="${esc(ME.email)}" autocomplete="username"></div>
    <div class="f last"><label for="lpw">Password</label>
      <div class="pw-wrap"><input class="inp fill" id="lpw" type="password" value="••••••••••••" autocomplete="current-password">
        <button class="pw-eye" data-eye="lpw" aria-label="Show password">${I.view}</button></div></div>
    <p class="t-body-02 aux"><a data-act="goreset">Forgotten your password?</a></p>
  </div>
  <div class="sec sec-act">
    <div class="foot-row foot-stack"><div><button class="btn btn-p btn-full" data-act="signin">Log in ${I.arrowRight}</button></div>
    <p class="t-body-02 mt5" style="color:var(--text-secondary)">Staff accounts are created by a Super Admin — there is no sign-up here.</p></div>
  </div>`;
}
/* 1.4 step 2 / 1.5 step 2 — the OTP delivery choice (no channel pre-selected). */
function authDeliver(){
  const reset = S.authFlow === 'reset';
  return `
  ${dsPh('Choose where to send your code', 'Two-factor is required for internal staff. We’ll send a six-digit code to one of these.')}
  ${authIdPanel(reset ? 'Resetting for' : 'Signing in as', ME.email, 'authback')}
  <div class="sec sec-rule">${otpOptions(S.otpCh, 'otppick', ME)}</div>
  <div class="sec sec-act">
    <div class="foot-row foot-stack"><div><button class="btn btn-p btn-full" data-act="sendcode">Send Code ${I.arrowRight}</button></div></div>
  </div>`;
}
/* 1.4 step 3 / 1.5 step 3 — the OTP entry, with the resend gate and a way back. */
function authCode(){
  const reset = S.authFlow === 'reset';
  return `
  ${dsPh('Enter your code', `A six-digit code is on its way to your ${S.otpCh === 'sms' ? 'mobile' : 'email'}. It expires in 10 minutes.`)}
  ${authIdPanel(reset ? 'Resetting for' : 'Signing in as', ME.email, 'authback')}
  ${otpEntryBlock(S.otpSentAt, 'resendcode', 'changemethod')}
  <div class="sec sec-act">
    <div class="foot-row foot-stack"><div><button class="btn btn-p btn-full" data-act="verifyotp">${reset ? 'Verify' : 'Verify And Sign In'} ${I.arrowRight}</button></div></div>
  </div>`;
}
/* 1.5 step 1 — identify the account. The flow advances whether or not the address
   matches, so nothing here discloses which addresses hold an account. */
function authReset(){
  return `
  ${dsPh('Reset your password', 'Enter the email on your staff account and we’ll send a one-time code to verify it’s you.')}
  ${authIdPanel('Resetting for', ME.email, 'authback')}
  <div class="sec sec-rule">
    <div class="f last"><label for="rem">Email address</label>
      <input class="inp fill" id="rem" type="email" value="${esc(ME.email)}" autocomplete="username" placeholder="name@talentnext.io"></div>
  </div>
  <div class="sec sec-act">
    <div class="foot-row foot-stack"><div><button class="btn btn-p btn-full" data-act="resetcont">Continue ${I.arrowRight}</button></div>
    <p class="t-body-02 aux mt5"><a data-act="authback">Back to log in</a></p></div>
  </div>`;
}
/* 1.5 step 4 — set the new password (reached only after the code verifies). */
function authSetpw(){
  return `
  ${dsPh('Set a new password', 'Choose a password you have not used before on this account.')}
  ${pwFields()}
  <div class="sec sec-act">
    <div class="foot-row foot-stack"><div><button class="btn btn-p btn-full" data-act="savenewpw">Set New Password ${I.arrowRight}</button></div></div>
  </div>`;
}
ACTIONS.signin = () => {
  const em = (device.querySelector('#lem') || {}).value || '', pw = (device.querySelector('#lpw') || {}).value || '';
  if(!em.trim() || !pw){ toast('Enter your email address and password', 'warn'); return; }
  /* credentials are checked before any code is issued (1.4) — a prototype accepts
     the seeded pair, then moves to the delivery choice. */
  S.authFlow = 'signin'; S.otpCh = null; S.auth = 'deliver';
};
ACTIONS.authback = () => { S.auth = 'login'; S.authFlow = 'signin'; S.otpCh = null; };
ACTIONS.goreset = () => { S.auth = 'reset'; S.authFlow = 'reset'; S.otpCh = null; };
ACTIONS.resetcont = () => { S.authFlow = 'reset'; S.otpCh = null; S.auth = 'deliver'; };
ACTIONS.otppick = key => { S.otpCh = key.split(':')[1]; };
ACTIONS.sendcode = () => {
  if(!S.otpCh){ toast('Choose where to send your code', 'warn'); return; }
  S.otpSentAt = Date.now(); S.auth = 'code';
  toast(`Code sent to your ${S.otpCh === 'sms' ? 'mobile' : 'email'}`);
};
ACTIONS.changemethod = () => { S.otpCh = null; S.auth = 'deliver'; };
ACTIONS.resendcode = () => {
  const left = 40 - Math.floor((Date.now() - (S.otpSentAt || 0)) / 1000);
  if(left > 0){ toast(`Please wait about ${left}s before resending`, 'warn'); return; }
  S.otpSentAt = Date.now(); toast('A fresh code is on its way');
};
ACTIONS.verifyotp = () => {
  const code = ((device.querySelector('#lcode') || {}).value || '').trim();
  if(!/^\d{6}$/.test(code)){ toast('That code is not correct. Check it and try again.', 'warn'); return; }
  if(Date.now() - (S.otpSentAt || 0) > 10 * 60000){ toast('That code has expired. Request a new one.', 'warn'); return; }
  if(S.authFlow === 'reset'){ S.auth = 'setpw'; return; }
  const ch = S.otpCh === 'sms' ? 'SMS' : 'email';
  S.signedIn = true; S.auth = 'login'; S.otpCh = null;
  AUDIT.unshift({when:'Just now', who:ME.name, role:'Super Admin', obj:`Email + password + one-time code (${ch})`, act:'Signed in', mod:'System & Audit', cat:'Sign-in', sev:'notice', ip:'10.2.14.2'});
  if(!MOD_BY_K[S.mod]){ S.mod = 'home'; S.sub = 'home'; }
};
ACTIONS.savenewpw = () => {
  const np = (device.querySelector('#np') || {}).value || '', cp = (device.querySelector('#cp') || {}).value || '';
  if(!pwOK(np)){ toast(PW_RULE_TEXT, 'warn'); return; }
  if(np !== cp){ toast('Both passwords must match.', 'warn'); return; }
  audit('Reset own password', ME.name, 'System & Audit', 'high');
  S.auth = 'login'; S.authFlow = 'signin'; S.otpCh = null;
  toast('Password reset. Sign in with your new password.');

/* 1.2 ACTIVATE STAFF ACCOUNT — the invite-acceptance flow. In production this is

/* THE RAIL IS A TREE — `tn-admin.html:3692`, on the design system's `.sn-item`
   and §120's `.sn-sub`. A module row carries the sum of its queue counts in the
   rail's own `.badge`; while the rail is open, the module you are in lists its
   visible sub-pages under it with their own counts. §120 has the argument for
   why the sub-rows are gated by the render and not by CSS. */
function sidenav(){
  const main = MODULES.filter(m => !m.footer && !m.hidden && V[m.k]);
  const foot = MODULES.filter(m => m.footer && !m.hidden && V[m.k]);
  const badge = n => n ? `<span class="badge">${n}</span>` : '';
  const item = m => {
    const on = m.k === S.mod;
    const vis = m.subs.filter(s => !s.hidden);
    const hasSubs = vis.length > 1;
    /* THE SUB-BLOCK IS ALWAYS IN THE DOM FOR A PARENT MODULE — Maryam, 7 Sep
       2026: "on hover to a collapsed navbar module icon which has further
       sub-modules I want you to show the sub modules dropdown on hover." §120's
       original rule gated the block on `on && S.nav`, because a shut 72px rail
       has no room for a second level. The flyout answers that "no room" by
       floating the subs BESIDE the rail on hover (§120's shut-state block), so
       the block now renders for every parent and the CSS decides where it goes:
       inline under the current module in the open rail / mobile drawer, and a
       hover-only flyout in the collapsed rail. A sub reads `.on` only inside the
       CURRENT module's block. */
    const subs = hasSubs
      ? `<div class="sn-subs">${vis.map(s => `<button class="sn-item sn-sub ${on && s.k === S.sub ? 'on' : ''}" data-go="${m.k}/${s.k}"${on && s.k === S.sub ? ' aria-current="page"' : ''}><span>${esc(s.t)}</span>${badge(subBadge(m.k, s.k))}</button>`).join('')}</div>`
      : '';
    /* A MODULE WITH SUB-PAGES CARRIES A CHEVRON so you know it opens a tree
       (Maryam, 7 Sep 2026); the queue count sits to its LEFT. The two ride in a
       `.sn-trail` group pushed to the row's end; the chevron flips when the
       module is INLINE-EXPANDED (its sub-tree shown under it in the open rail —
       the flyout is a hover state, not an expanded one). When inline-expanded
       the module's own count comes off — the sub-rows carry the counts. */
    const expanded = on && S.nav && hasSubs;
    const modCount = expanded ? '' : badge(modBadge(m.k));
    /* a DIV, not a span — `.sn-item > span{flex:1}` (and the open-rail
       `:not(.badge)` variant) would otherwise stretch the trail and strand the
       count + chevron at its left instead of the row's right edge. */
    const trail = hasSubs
      ? `<div class="sn-trail">${modCount}<svg class="sn-chev${expanded ? ' open' : ''}" viewBox="0 -960 960 960" aria-hidden="true">${inner('chevDown')}</svg></div>`
      : modCount;
    const expAttr = hasSubs ? ` aria-expanded="${expanded ? 'true' : 'false'}"` : '';
    const btn = `<button class="sn-item ${on ? 'on' : ''}${hasSubs ? ' sn-parent' : ''}" title="${esc(m.t)}" data-go="${m.k}/${firstSub(m)}"${on && !expanded ? ' aria-current="page"' : ''}${expAttr}>${ic(m.ic)}<span>${esc(m.t)}</span>${trail}</button>`;
    /* a parent rides in a `.sn-node` (position:relative) so the flyout has an
       anchor and one hover region spans the icon and the panel it opens. */
    return hasSubs ? `<div class="sn-node${on ? ' on' : ''}">${btn}${subs}</div>` : btn;
  };
  return `
  <div class="scrim ${S.nav ? 'on' : ''}" data-close="nav"></div>
  <nav class="sidenav ${S.nav ? 'on' : ''}" aria-label="Portal">
    <div class="sn-main">${main.map(item).join('')}</div>
    <div class="sn-foot">
      ${foot.map(item).join('')}
      <button class="sn-item" title="Log out" data-confirm="logout">${I.logout}<span>Log out</span></button>
    </div>
  </nav>`;
}

/* THE EDITING SHEETS — the design system's bottom `.sheet`. An entry in
   `SHEETS` is an object or a function of `S.id`; a `rec:<kind>:<id>` key is

/* PILOT — RECORD FORMS OPEN AS AN IN-FLOW SIDE PANEL, NOT A CENTRE MODAL
   (Maryam, 13 Sep 2026: "for all such actions like adding user, open the side
   slider instead of modal ... follow the one on the candidate portal — the
   content window slides left, attached to the side nav, and the panel takes the
   rest of the place. Implement this here first so I can decide.")

   So it is the candidate portal's `.peek` (views.js / §44), NOT an overlay: the
   panel is an IN-FLOW third column in `.shell-body` after `.view-col`, so the
   content column genuinely narrows and both are legible at full contrast — no
   dim, no covering. `render()` places `sidePeek()` and adds `peek` to
   `data-shown` (so §44's `.main` margin-drop fires); `sheetView()` renders
   nothing for these. The panel reuses the sheet's `.sheet-h`/`.sheet-b`/`.sheet-f`
   inside the `.peek` shell, so ALL the form logic is untouched — `readForm`, the
   `.fdd` dropdown's `.sheet-b` overflow toggle, and the two-step `_pending` flow.

   ROLLED OUT TO EVERY RECORD FORM (Maryam, 13 Sep 2026: "all such modals with
   creating something should move to the right slider"). Every `rec:<kind>:*`
   form — the New/Add and the Edit of a user, role, candidate, agent, cohort,
   course, employer, booking, campaign, DSAR, flag, invoice, lead, placement,
   referral, refund, fee — opens in the slider (they all share `recSheet`). The
   one-off confirm/action sheets stay centre modals on purpose: they are not
   "creating something" but a decision or a two-step guarded action — grant /
   revoke Super Admin, view-as, level/score override, merge, refunds approval,
   audit-line, and the like. A few non-record create dialogs (Invite a leader,
   Add member, Add session, Connect a service, Open an incident) also stay
   centre for now; move them by adding their keys here if wanted. */
/* record forms open in the slider; so do the staff create/edit forms (Epic 1),
   to match "Add User" on the same module. The guarded two-step actions
   (change role, deactivate, reactivate, delete) stay centre modals — they are a
   decision, not "creating something". */
const SIDE_SHEET_KEYS = ['addstaff', 'editstaff', 'inviteagent'];
const sideSheet = key => !!key && (key.indexOf('rec:') === 0 || SIDE_SHEET_KEYS.some(k => key === k || key.indexOf(k + ':') === 0));

/* resolve `S.sheet` to its `{title, body, ok, act, danger}` — shared by the
   centre modal (`sheetView`) and the in-flow panel (`sidePeek`) */
function resolveSheet(){
  let s = null;
  if(S.sheet && S.sheet.indexOf('rec:') === 0){ const [, kind, id] = S.sheet.split(':'); s = recSheet(kind, id); }
  else if(S.sheet){
    /* `name:id` — the id is passed to the sheet function, so a sheet opened from a
       list row need not write `S.id` (which is the PAGE's record). The older
       sheets that read `S.id` ignore the argument. */
    const i = S.sheet.indexOf(':');
    const name = i < 0 ? S.sheet : S.sheet.slice(0, i), arg = i < 0 ? undefined : S.sheet.slice(i + 1);
    s = SHEETS[name]; if(typeof s === 'function') s = s(arg);
  }
  return s;
}

function sheetView(){
  if(sideSheet(S.sheet)) return '';   /* side sheets render as an in-flow .peek column, see sidePeek() */
  const s = resolveSheet();
  return `<div class="modal ${S.sheet ? 'on' : ''}" data-close="sheet">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${s ? esc(s.title) : ''}">
      <div class="sheet-h"><h2>${s ? esc(s.title) : ''}</h2>

      </div>
    </div>

}

/* THE IN-FLOW SIDE PANEL — a `.peek` column (§44) carrying the SAME sheet

/* ======================================================================

function trailParts(){
  const m = MOD_BY_K[S.mod];
  const sub = m._sub[S.sub];
  const out = [{label:m.t, go:m.k + '/' + firstSub(m)}];
  if(sub && sub.hidden){
    const list = detailListSub(m);
    if(list && list.t !== m.t) out.push({label:list.t, go:m.k + '/' + list.k});
    const rec = detailRecordLabel();
    out.push({label:rec || sub.t});
  } else if(sub && S.sub !== firstSub(m)){
    out.push({label:sub.t});
  }
  return out;
}
function detailListSub(m){
  const map = {users:'users', vetting:'applications', candidates:'candidates', agents:'agents',
    cohorts:'cohorts', employers:'employers', crm:'leads'};
  const dmap = {appdetail:'applications', staffdetail:'users', coursedetail:'catalogue',
    leaddetail:'leads', campaigndetail:'campaigns', import:'users', empverifydetail:'empverify'};
  /* an internal staff record's list is the Staff directory, not All Users. */
  if(S.sub === 'staffdetail' && (USER_BY_ID[S.id] || {}).internal) return m._sub.staff || null;
  const k = dmap[S.sub] || map[m.k];
  return m._sub[k] || null;
