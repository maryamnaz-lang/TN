  ${/* ══ PEOPLE & ACCESS ══ users by role (bars) · users by status (bars) · where users come from (stats) */''}
  <section class="sec">
    ${group('People &amp; access')}
    <div class="dgrid dgrid-2">
      <div class="dcol">
        ${secHead('Users by role')}
        ${hbars(roleRows.map(([name, n]) => [name, n, n]))}
      </div>
      <div class="dcol">
        ${secHead('Users by status')}
        ${hbars([
          ['Active', `${uActive} · ${pctOf(uActive, USERS.length)}%`, uActive],
          ['Inactive', `${uInactive} · ${pctOf(uInactive, USERS.length)}%`, uInactive]
        ])}
      </div>
    </div>
  </section>
  <section class="sec">
    ${secHead('Where users come from')}
    ${stats([
      ['route', 'Individual', String(USERS.filter(u => u.origin === 'individual').length), 'direct sign-ups'],
      ['spark', 'Signal', String(USERS.filter(u => u.origin === 'signal').length), 'sponsoring employer'],
      ['link', 'Filter Go', String(USERS.filter(u => u.origin === 'filtergo').length), 'franchise partner'],
      ['lock', 'Internal', String(USERS.filter(u => u.origin === 'internal').length), 'staff accounts']
    ])}
  </section>

  ${/* ══ COHORTS & MARKETPLACE ══ marketplace stats · cohort health (table) */''}
  <section class="sec">
    ${group('Cohorts &amp; marketplace')}
    ${stats([
      ['market', 'Confirmed', String(bkConfirmed), 'booked interviews'],
      ['bank', 'Awaiting pay', String(bkAwaiting), 'unpaid or pending'],
      ['money', 'Booked value', money(gmv), 'paid this window'],
      ['agents', 'Avg fee', money(avgFee), 'per interview']
    ])}
  </section>
  <section class="sec">
    ${aiHead('Cohort health', 'Every running cohort, how far through the 90-day loop it is, and whether it has a leader.',
      '<button class="btn btn-g btn-sm noic" data-go="cohorts/cohorts">Cohorts</button>')}
    ${liveCohorts.length ? table(
      [{label:'Cohort'}, {label:'Track'}, {label:'Progress'}, {label:'Members'}, {label:'Leader'}],
      liveCohorts.map(c => ({cells:[
        idCell(c.name, c.level),
        esc(c.track),
        `Wk ${c.week} / 12`,
        `${c.size} / 10`,
        c.leader === 'Unassigned' ? tag('flagged', 'Needs a leader') : esc(c.leader)
      ]})),
      {paginate:false}
    ) : emptyState('cohorts', 'No active cohorts', 'Nothing is running this window.')}
  </section>

  ${/* ══ PIPELINE & ACTIVITY ══ funnel (bars) · needs your attention (list) · recent activity (timeline) */''}
  <section class="sec">
    ${group('Pipeline &amp; activity')}
    <div class="dgrid dgrid-3">
      <div class="dcol">
        ${secHead('Pipeline funnel')}
        ${hbars([
          ['Leads (quiz takers)', leadTot, leadTot],
          ['On an account', CANDS.length, CANDS.length],
          ['In a cohort', inCohort, inCohort],
          ['Booked an interview', BOOKINGS.length, BOOKINGS.length],
          ['Placed', PLACEMENTS.length, PLACEMENTS.length]
        ])}
      </div>
      <div class="dcol">
        ${secHead('Needs your attention')}
        <div class="tile-stack">${attnRows}</div>
      </div>
      <div class="dcol">
        ${secHead('Recent activity')}
        <div class="tile-stack">${AUDIT.slice(0, 5).map(a => memRow(a.who, `${esc(a.act)} · ${esc(a.obj)}`, tag(a.sev, a.sev === 'high' ? 'High' : a.sev === 'notice' ? 'Notice' : 'Info'))).join('')}</div>
      </div>
    </div>
  </section>

  ${/* ══ OPEN DECISIONS & RISKS ══ the register's blocked lines (whole register is its own page) */''}
  <section class="sec">
    ${aiHead('Open decisions &amp; risks', `${saCount('blocked')} of ${SA_CASES.length} use cases are blocked by an undecided upstream item; ${saCount('open')} more need a stakeholder ruling. ${highDec} high · ${medDec} medium across the register.`,
      '<button class="btn btn-g btn-sm noic" data-go="home/rulings">Open The Register</button>')}
    <div class="tile-stack">
      ${DECISIONS.filter(d => d.kind === 'blocked').map(decisionTile).join('')}
    </div>

  if(!u.roles.length) u.status = 'offboarded';
  audit(kind === 'emergency' ? 'Emergency revocation of Super Admin' : kind === 'expiry' ? 'Super Admin grant expired' : 'Revoked Super Admin',
    `${u.name}${reason ? ' — ' + reason : ''}${kind === 'emergency' ? ' · all sessions ended' : ''}`, 'Users & Roles', 'high', {from: from.join(', '), to: u.roles.join(', ') || 'no roles — offboarded'});
}
/* AUTO-EXPIRY IS REAL (SA-01 A2 / SA-16 A3): a time-boxed grant past its date is
   revoked by the platform on the next render, with its own audit line, so the
   register's "auto-expiry" is a behaviour and not a word on a card. */
function expireGrants(){
  USERS.filter(u => isAdmin(u) && u.grant && u.grant.until && u.grant.until < isoToday()).forEach(u => revokeAdmin(u, 'expiry', `time-boxed grant ended ${mdy(u.grant.until)}`));
}

/* ---- SA-09 A5: MERGE DUPLICATE ACCOUNTS ------------------------------------
   The kept account takes the roles of the merged one; the merged one goes, and
   its candidate record (if any) goes with it. Logged high with both names. */
SHEETS.merge = id => {
  const u = USER_BY_ID[id]; if(!u) return {title:'Merge', body:'', ok:''};
  const others = USERS.filter(x => x.id !== u.id && !isAdmin(x));
  return {title:`Merge ${u.name} into another account`, ok:'Continue', act:'askmerge:' + u.id,
    body:`${fieldHtml({k:'into', l:'Keep this account', t:'select', opts: others.map(x => [x.id, `${x.name} · ${x.email}`])})}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'e.g. Same person signed up twice with two addresses'})}
      <p class="t-desc">${esc(u.name)}’s roles move onto the kept account; ${esc(u.name)}’s sign-in, and a candidate record if there is one, are removed. Receipts stay under the accounting rule. Logged at high severity.</p>`};
};
ACTIONS.askmerge = key => {
  const u = USER_BY_ID[key.split(':')[1]]; const v = readForm(); const into = USER_BY_ID[v.into];
  if(!u || !into){ toast('Pick the account to keep', 'warn'); return 'keep'; }
  if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  S._pending = v;
  askConfirm({mk:'warning', title:`Merge ${u.name} into ${into.name}?`, body:`${into.name} keeps its sign-in and gains ${u.roles.map(r => (ROLE_BY_K[r] || {}).short || r).join(', ')}. ${u.name}’s account is removed. This can’t be undone.`, ok:'Merge Accounts', danger:true, act:'domerge:' + u.id});
};
ACTIONS.domerge = key => {
  const u = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null;
  const into = USER_BY_ID[v.into]; if(!u || !into) return;
  const from = into.roles.join(', ');
  u.roles.forEach(r => { if(!into.roles.includes(r)) into.roles.push(r); });
  KINDS.user.remove(u);
  audit('Merged accounts', `${u.name} → ${into.name} — ${v.reason || ''}`, 'Users & Roles', 'high', {from, to: into.roles.join(', ')});
  toast(`${u.name} merged into ${into.name}`);
  if(S.sub === 'staffdetail'){ S.id = into.id; }
};

/* ---- SA-11: VIEW AS (IMPERSONATION) -------------------------------------------
   The primary alternatives drawn: READ-ONLY by default (write-enabled is
   offered as the open ruling it is, and logged high when chosen), interview
   video EXCLUDED always (A3), a reason, and a switch recording whether the user
   is told afterwards (E3 — recorded, because whether they ever learn it happened
   is unruled). Two refusals: another admin (E1) and a user with a booking today
   (E2 — a session during a live interview). The session is `S.viewAs`; the bar
   under the app bar names it; the router refuses every write while it is open;
   both ends write an audit line, and every line written in between says whose
   name the admin was acting under. Consent-gated against unilateral is the
   remaining open branch and is stated in the sheet, not faked with a wait. */
ACTIONS.askviewas = key => {
  const u = USER_BY_ID[key.split(':')[1]]; if(!u) return;
  if(u.roles.some(isFullAccess)){ toast('You can’t view as another admin (SA-11 E1)', 'warn'); return; }
  const live = BOOKINGS.some(b => (b.cand === u.name || b.agent === u.name) && b.status === 'active' && b.date === isoToday());
  if(live){ toast(`${u.name} has an interview today — no session during a live interview (SA-11 E2)`, 'warn'); return; }
  S.sheet = 'viewas:' + u.id;
};
SHEETS.viewas = id => {
  const u = USER_BY_ID[id]; if(!u) return {title:'View as', body:'', ok:''};
  return {title:`View as ${u.name}`, ok:'Continue', act:'askviewas2:' + u.id,
    body:`${kv([['Account', `${esc(u.name)} <span class="t-caption">${esc(u.email)}</span>`], ['Roles', roleChips(u.roles)], ['Interview video', 'Excluded from every session']])}
      ${fieldHtml({k:'scope', l:'Scope', t:'select', opts:[['read', 'Read-only — see what they see, change nothing'], ['write', 'Write-enabled — act in their name (open ruling; logged high)']]}, 'read')}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — a support ticket or the thing you are checking'})}
      ${fieldHtml({k:'tell', l:'Afterwards', t:'checks', opts:[['tell', `Tell ${u.name} this session happened`]]}, ['tell'])}
      <p class="t-desc">Consent-gated against unilateral is an open ruling (SA-11 A2); this build opens the session on your authority and records it. The next step asks for an authenticator code.</p>`};
};
ACTIONS.askviewas2 = key => {
  const u = USER_BY_ID[key.split(':')[1]]; const v = readForm();
  if(!u) return; if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  S._pending = v;
  askConfirm({mk:'warning', stepup:true, title:`Open a ${v.scope === 'write' ? 'write-enabled' : 'read-only'} session as ${u.name}?`,
    body:`You see the platform as ${u.name}’s record holds it${v.scope === 'write' ? ', and anything you change is written in their name and logged at high severity' : ' and can change nothing until you end the session'}. Interview video is excluded.`,
    ok:'Start Session', danger: v.scope === 'write', act:'doviewas:' + u.id});
};
ACTIONS.doviewas = key => {
  const u = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null;
  if(!u) return;
  S.viewAs = {id:u.id, scope: v.scope === 'write' ? 'write' : 'read', since:Date.now(), tell: Array.isArray(v.tell) && v.tell.includes('tell'), reason:v.reason || ''};
  audit(`Started View As (${S.viewAs.scope === 'write' ? 'write-enabled' : 'read-only'})`, `${u.name} — ${S.viewAs.reason}${S.viewAs.tell ? ' · user will be told' : ' · user not told'}`, 'Users & Roles', 'high');
  go('users/staffdetail/' + u.id);
};
ACTIONS.endviewas = () => {
  const va = S.viewAs; if(!va) return;
  const u = USER_BY_ID[va.id]; const mins = Math.max(1, Math.round((Date.now() - va.since) / 60000));
  S.viewAs = null;
  audit('Ended View As', `${u ? u.name : va.id} — ${mins} min${va.tell ? ' · notice sent to the user' : ''}`, 'Users & Roles', 'high');
  toast(va.tell && u ? `Session ended — ${u.name} has been told` : 'Session ended');
};
/* THE BAR UNDER THE APP BAR while a session is open. `.viewas` is §129's; the
   words are §63 §57's. It sits in `.view-col` above `.main`, so the page
   scrolls under it and the Tal dock is unaffected. */
function viewAsBar(){
  const va = S.viewAs; if(!va) return '';

    <button class="btn btn-g btn-sm noic viewas-end" data-act="endviewas">End Session</button>

}

/* THE ROLE FILTER (DESIGN.md admin list rule). The tab strip is gone — the role
   is a `.fdd` dropdown in the toolbar beside Status, so both filters read the
   same way. `admin` is the internal-account bucket (Admin / Super Admin); the
   rest are a plain role membership. Deactivated is the Status filter's job, not a
   role, so it is not here. */
const ROLE_OPTS = [
  ['all', 'All'],
  ['candidate', 'Candidate'],
  ['agent', 'Talent Agent'],
  ['leader', 'Cohort Leader'],
  ['admin', 'Admin'],
  ['employer', 'Employer']
];
/* The role is a TAB STRIP again (Maryam, 13 Sep 2026: "take the role tabs as we
   had before ... remove the roles filter since we are adding the tabs now"), on
   the same role set as the old dropdown — with live counts in the tab. `admin` is
   the internal-account bucket; every other tab is a plain role membership. */
const roleCount = v => v === 'all' ? USERS.length : v === 'admin' ? USERS.filter(u => u.internal).length : USERS.filter(u => u.roles.includes(v)).length;
const ROLE_TABS = () => ROLE_OPTS.map(([v, l]) => [v, l, roleCount(v)]);
/* A cohort leader an admin added is a MODERATOR (§ moderator, 11 Sep 2026).
   `u.addedBy` is the id of the admin who added them, and the Cohort Leader filter
   adds an "Added by" column reading it: the signed-in Super Admin (ME) reads
   "You", any other admin by name — the "Added by" is the column header, so it is
   not repeated in every cell. Authored placeholder on the two leader accounts —
   the seed has no add-audit trail. */
const addedByLabel = u => { const by = u.addedBy && USER_BY_ID[u.addedBy]; return by ? (by.id === ME.id ? 'You' : esc(by.name)) : '—'; };
/* HOW MANY COHORTS A LEADER IS RUNNING (Maryam, 14 Sep 2026). Read off the
   account's own `cohorts` list — the `(leads)` entries, not `(member)`. A
   candidate who became a cohort leader is capped at ONE at a time, so u4 reads
   "1"; a MODERATOR (`u.addedBy` set) may run several, so u40 reads "2". The
   number is the column, and the "Added by" column beside it says which of the two
   a row is. */
const leadingCount = u => (u.cohorts || []).filter(c => /\(leads\)/i.test(c)).length;
const leadingCell = u => { const n = leadingCount(u); return n ? `${n} cohort${n === 1 ? '' : 's'}${!u.addedBy && n === 1 ? ' <span class="t-caption">(at cap)</span>' : ''}` : '—'; };
/* EPIC 3 — the external account's main role, its detail route, level and status
   cells. Cohort Leader is a capability layered on the account (a column, not a
   type). A row opens the module that owns the account — the rich candidate /
   agent detail — falling back to the generic user detail for an employer. */
const mainRole = u => ['candidate', 'agent', 'employer'].find(r => u.roles.includes(r)) || (u.roles[0] || '—');
const typeLabel = u => (ROLE_BY_K[mainRole(u)] || {}).name || '—';
const userDetailRoute = u => u.roles.includes('candidate') ? 'candidates/detail/' + u.id
  : u.roles.includes('agent') ? 'agents/detail/' + u.id
  : 'users/staffdetail/' + u.id;
const USER_STATUS_LABEL = {invited:'Invited', active:'Active', ok:'Active', inactive:'Deactivated'};
const userStatusTag = u => tag(u.status === 'ok' ? 'active' : u.status, USER_STATUS_LABEL[u.status] || cap(u.status));
const candLevel = u => { const c = CAND_BY_ID[u.id]; const lv = (c && c.level) || (u.level && u.level !== '—' ? u.level : ''); return lv || 'Not yet levelled'; };

function usersAll(){
  const rf = getFilter('role', 'all'), q = getFilter('q', ''), sf = getFilter('status', 'all');
  const active = u => u.status === 'active' || u.status === 'ok';
  /* EXTERNAL accounts only — internal staff live in the Staff directory
     (Epic 1). The doc keeps the two apart: "an account never appears in both".
     Role is a TAB STRIP (Maryam 13 Sep 2026, overriding the doc's Type dropdown),
     dropping the internal (Admin) bucket. */
  const ext = USERS.filter(u => !u.internal);
  const extTabs = ROLE_OPTS.filter(([v]) => v !== 'admin')
    .map(([v, l]) => [v, l, v === 'all' ? ext.length : ext.filter(u => u.roles.includes(v)).length]);
  const rows = ext.filter(u => rf === 'all' ? true : u.roles.includes(rf))
    .filter(u => sf === 'all' ? true : sf === 'active' ? active(u) : sf === 'invited' ? u.status === 'invited' : (!active(u) && u.status !== 'invited'))
    .filter(u => hit(q, u.name, u.email, u.company));
  return `
  <section class="sec">
    ${searchHead('All users', 'Every candidate, agent, cohort leader and employer on the platform. Internal staff are in the Staff directory. A row opens the full record.',
      `<button class="btn btn-g btn-sm noic" data-go="users/import">${I.download} Bulk Import</button>
       ${exportBtn('Users directory')}
       <button class="btn btn-p btn-sm noic" data-sheet="inviteagent">${I.add} Invite Talent Agent</button>`)}
    ${filterStrip('role', 'all', extTabs)}
    ${lstTools('Search by name or email',
      filterDd('status', 'all', [['all', 'All'], ['invited', 'Invited'], ['active', 'Active'], ['inactive', 'Deactivated']], 'Status'))}
    ${rows.length ? table(
      [{label:'User'}, {label:'Type'}, {label:'Cohort leader'}, {label:'Level'}, {label:'Status'}, {label:'Joined'}, {label:'Last active'}, ACT_COL],
      rows.map(u => ({go:userDetailRoute(u), sv:[u.name], cells:[
        idCell(u.name, u.email),
        esc(typeLabel(u)),
        u.roles.includes('leader') ? '<span class="tag sm">Cohort leader</span>' : '<span class="t-caption">—</span>',
        u.roles.includes('candidate') ? esc(candLevel(u)) : '<span class="t-caption">—</span>',
        userStatusTag(u),
        esc(u.joined),
        esc(u.last),
        rowActs([['view', 'View', `data-go="${userDetailRoute(u)}"`],
          ...(u.status === 'invited'
            ? [['renew', 'Resend invite', `data-act="staffresend:${u.id}"`], ['close', 'Cancel invite', `data-act="staffcancelinvite:${u.id}"`]]
            : [active(u) ? ['pause', 'Deactivate', `data-sheet="deactext:${u.id}"`] : ['play', 'Reactivate', `data-sheet="reactext:${u.id}"`]]),
          ...(u.roles.some(isFullAccess) ? [] : [['view', 'View as', `data-act="askviewas:${u.id}"`]]),
          ['group', 'Merge into another account', `data-sheet="merge:${u.id}"`],
          ['delete', 'Delete', `data-sheet="delext:${u.id}"`]])
      ]})))
      : emptyState('users', 'No accounts match', q ? `Nothing matches “${q}” in this filter.` : 'Nothing in this filter yet.')}
  </section>`;
}

/* ======================================================================
   EPIC 1 — SUPER ADMIN ACCESS & PROVISIONING (the staff lifecycle)

   The doc's "Staff User Management" is the internal-account directory, kept
   apart from the external Users directory (Epic 3): "The Staff directory holds
   internal accounts. The Users directory holds external ones." It is a new
   sub-page (`users/staff`) built on the same table / dropdown / sheet / confirm
   components every list uses. Every write logs an audit line; the four
   highest-severity actions (fee change, refund approval, account deletion, role
   deletion — story 1.6) pass a step-up code. OTP delivery, email send and real
   password storage are out of a prototype's scope (handoff ruling #3): the
   screens and the flow are built, not the send.
   ====================================================================== */
const STAFF_STATUS_LABEL = {invited:'Invited', active:'Active', inactive:'Deactivated'};
const staffStatusTag = u => tag(u.status, STAFF_STATUS_LABEL[u.status] || cap(u.status));
/* an INFO block for a sheet foot — the same light panel `recSheet` draws. */
const sheetHelp = t => `<div class="sheet-help"><svg class="sheet-help-ic" viewBox="0 -960 960 960" aria-hidden="true">${inner('info')}</svg><p class="t-desc">${t}</p></div>`;
/* a READ-ONLY field — §12 draws `[readonly]` + `.pfe-ro` with a dashed underline
   (the lock), with a note saying where the value is changed instead (1.8). */
const roField = (label, val, why) => `<label class="f"><span class="lbl">${esc(label)}</span>
  <input class="inp pfe-ro" value="${esc(val || '')}" readonly>${why ? `<p class="t-desc">${esc(why)}</p>` : ''}</label>`;
/* an invite's days left — 7 days from `invitedOn` (1.7). */
function inviteDaysLeft(u){
  if(!u.invitedOn) return null;
  const [mm, dd, yy] = u.invitedOn.split('-').map(Number);
  const exp = new Date(yy, mm - 1, dd).getTime() + 7 * 864e5;
  return Math.ceil((exp - Date.now()) / 864e5);
}
const inviteBadge = u => { const d = inviteDaysLeft(u); return d == null ? '' : d > 0 ? ` <span class="t-caption">${d} day${d === 1 ? '' : 's'} left</span>` : ` <span class="t-caption">expired</span>`; };
/* GUARDS (1.3 / 1.7 / 1.9 / 1.11). `staffProtect` blocks the original Super
   Admin and the actor's own account — neither may be role-changed, deactivated
   or deleted. `lastSAGuard` blocks removing access from the only Super Admin
   left. Both return a reason string or null. */
function staffProtect(u){
  if(u.orig) return 'The original Super Admin account is protected';
  if(u.id === ME.id) return 'You can’t act on your own account here — use My Profile';
  return null;
}
const lastSAGuard = u => isSA(u) && activeSAs().length <= 1 ? 'This is the only Super Admin account' : null;

/* the row's action menu, by status and guard (1.7). View is always there;
   Invited swaps Edit/Deactivate for Resend / Cancel invite; Delete rides at any
   status unless a guard blocks it. */
function staffRowActs(u){
  const acts = [['view', 'View', `data-go="users/staffdetail/${u.id}"`]];
  const prot = staffProtect(u);
  if(u.status === 'invited'){
    acts.push(['renew', 'Resend invite', `data-act="staffresend:${u.id}"`]);
    acts.push(['eye', 'Preview activation', `data-act="staffpreviewactivate:${u.id}"`]);
    acts.push(['close', 'Cancel invite', `data-act="staffcancelinvite:${u.id}"`]);
  } else {
    acts.push(['edit', 'Edit', `data-sheet="editstaff:${u.id}"`]);
    if(!prot) acts.push(['group', 'Change role', `data-sheet="changerole:${u.id}"`]);
    if(u.status === 'active'){
      if(!prot && !lastSAGuard(u)) acts.push(['pause', 'Deactivate', `data-sheet="deactivate:${u.id}"`]);
    } else {
      acts.push(['play', 'Reactivate', `data-sheet="reactivate:${u.id}"`]);
    }
  }
  if(!prot && !lastSAGuard(u)) acts.push(['delete', 'Delete', `data-sheet="delstaff:${u.id}"`]);
  return rowActs(acts);
}

PAGESUM['users/staff'] = () => {
  const staff = USERS.filter(u => u.internal);
  const inv = staff.filter(u => u.status === 'invited').length;
  const deact = staff.filter(u => u.status === 'inactive').length;

};

/* 1.1 ADD STAFF MEMBER — the seven-field invite form. Super Admin shows in the
   role list only to an actor who holds it. Send Invite creates an Invited
   account and logs High; no credential is ever set here (the staff member sets
   their own at activation, 1.2). */

    ok:'Send Invite',

};
ACTIONS.sendinvite = () => {
  const v = readForm();
  if(!v.first || !v.last){ toast('Enter a first and last name', 'warn'); return 'keep'; }
  const email = (v.email || '').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Enter a valid email address', 'warn'); return 'keep'; }
  if(USERS.some(u => u.email.toLowerCase() === email.toLowerCase())){ toast('This email address is already in use on the platform', 'warn'); return 'keep'; }
  if(!v.phone){ toast('Enter a phone number', 'warn'); return 'keep'; }
  if(!v.job){ toast('Enter a job title', 'warn'); return 'keep'; }
  if(!v.dept){ toast('Select a department', 'warn'); return 'keep'; }
  if(!v.role){ toast('Select a role', 'warn'); return 'keep'; }
  if(v.role === 'admin' && !isSA(ME)){ toast('Only a Super Admin can assign the Super Admin role', 'warn'); return 'keep'; }
  const name = `${v.first} ${v.last}`.trim();
  const u = {id:newId('u', USERS), name, email, roles:[v.role], level:'—', status:'invited', joined:today(), origin:'internal', last:'Never', internal:true, job:v.job, dept:v.dept, phone:v.phone, invitedBy:ME.id, invitedOn:today()};
  USERS.push(u); USER_BY_ID[u.id] = u;
  audit('Invited staff member', `${name} · ${staffRoleName(u)}`, 'Users & Roles', 'high');
  toast(`Invite sent to ${email}`);
  S.sheet = null;

   live cohorts); a candidate has none. Delete adds the step-up code (story 1.6).
   The clearing is summarised rather than simulated end-to-end (prototype). */
function extClearing(u){
  const items = [];
  if(u.roles.includes('agent')){
    const up = BOOKINGS.filter(b => b.agent === u.name && (b.status === 'active' || b.status === 'pending')).length;
    if(up) items.push(`${up} upcoming interview${up === 1 ? '' : 's'} cancelled and refunded`);
    items.push('marketplace listing removed');
  }
  const leads = leadingCount(u);
  if(leads) items.push(`${leads} live cohort${leads === 1 ? '' : 's'} to reassign to another leader`);
  return items;
}

KINDS.role = {
  label:'role', mod:'Users & Roles', after:'users/roles',
  find: k => ROLE_BY_K[k], name: r => r.name,
  fields: [
    {k:'name', l:'Role name', t:'text', req:1, ph:'e.g. Calibration Lead'},
    {k:'kind', l:'Kind', t:'select', opts:[['external', 'External — part of the product'], ['internal', 'Internal — runs the platform']], def:'internal'},
    {k:'desc', l:'What it does', t:'textarea', req:1, ph:'One sentence a new admin can read'}
  ],
  help:'A new role starts with no capabilities. Grant them in the permission matrix below; every grant is logged.',
  okNew:'Create Role',
  create: v => { const k = v.name.toLowerCase().replace(/[^a-z0-9]+/g, '') || newId('role', ROLES); const r = {k, name:v.name, short:v.name, kind:v.kind, desc:v.desc}; ROLES.push(r); ROLE_BY_K[k] = r; MATRIX[k] = {}; return r; },
  update: (r, v) => { r.name = v.name; r.short = v.name; r.kind = v.kind; r.desc = v.desc; },

        `<div>${esc(r.name)}${r.k === 'admin' ? ' <span class="tag sm rl-default">Default</span>' : ''}</div>`,
        ...(showType ? [`<span class="tag sm">${cap(r.kind)}</span>`] : []),
        esc(r.desc),
        String(usersWith(r.k)),
        r.k === 'admin' ? '' : rowActs([editBtn('role', r.k), delBtn('role', r.k)])
      ]})))}
  </section>

  ${/* The Permissions matrix. The "Super Admin holders" grant/revoke section

ACTIONS.editperms = () => { S.editPerms = !S.editPerms; if(!S.editPerms) toast('Permission changes saved'); };
ACTIONS.toggleperm = key => {
  const [, rk, ck] = key.split(':'); const r = ROLE_BY_K[rk]; const c = CAPS.find(x => x.k === ck); if(!r || !c) return;
  MATRIX[rk] = MATRIX[rk] || {};
  const on = !MATRIX[rk][ck];
  /* SA-10 E1 — a grant across the Program / Business wall is warned and asked,
     not refused (the refusal is the open ruling). */
  const side = roleSide(rk);
  if(on && side && CAP_SIDE[ck] && CAP_SIDE[ck] !== side){
    askConfirm({mk:'warning', title:`Grant “${c.t}” to ${r.name}?`,
      body:`${r.name} is a ${side}-side role and this is a ${CAP_SIDE[ck]} capability — the grant breaches the Program / Business wall (SA-10 E1). Whether that should be refused is an open ruling; granting it is logged at high severity with the breach named.`,
      ok:'Grant Anyway', danger:true, act:`doperm:${rk}:${ck}`});
    return;
  }
  if(on) MATRIX[rk][ck] = 1; else delete MATRIX[rk][ck];
  audit(`${on ? 'Granted' : 'Removed'} capability`, `${r.name} — ${c.t}`, 'Users & Roles', 'high', {from: on ? 'not granted' : 'granted', to: on ? 'granted' : 'not granted'});
};
ACTIONS.doperm = key => {
  const [, rk, ck] = key.split(':'); const r = ROLE_BY_K[rk]; const c = CAPS.find(x => x.k === ck); S.confirm = null; if(!r || !c) return;
  MATRIX[rk] = MATRIX[rk] || {}; MATRIX[rk][ck] = 1;
  audit('Granted capability across the wall', `${r.name} — ${c.t} (${roleSide(rk) || 'mixed'} role, ${CAP_SIDE[ck]} capability)`, 'Users & Roles', 'high', {from:'not granted', to:'granted'});

};

/* ══ BULK IMPORT USERS — a three-step wizard (Maryam, 11 Sep 2026, off the
   reference flow: Upload → Review → Done), built in OUR UI. Every row is parsed
   and VALIDATED before anything is created; only Ready rows become accounts.
   State is `S.imp` (never the DOM — trap 9). The role cell is a native
   `<select class="inp">`, the admin's own form-field select (see `fieldHtml`). */
const IMP_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const IMP_ROLE_KEYS = ROLES.map(r => r.k);
/* sample rows the "Load sample data" button runs through the validator — four
   clean, four each tripping a different rule (invalid email · missing role ·
   duplicate of an existing account · unknown role key). Authored (§74). */
const IMP_SAMPLE = [
  ['Ava Stone', 'ava@brightpath.io', 'candidate'], ['Max Lee', 'max@northgate.health', 'agent'],
  ['Joan Roy', 'joan@signal.co', 'employer'], ['Dev Kapoor', 'dev@talentnext.io', 'reviewer'],
  ['Sam Poe', 'not-an-email', 'candidate'], ['No Role Here', 'norole@acme.io', ''],
  ['Dupe Account', 'dana@talentnext.io', 'agent'], ['Zoe Fields', 'zoe@acme.io', 'wizard']
];
function impParse(text){
  return (text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean)
    .filter(l => !/^\s*name\s*,\s*email\s*,\s*role/i.test(l))
    .map(l => { const c = l.split(','); return {name:(c[0] || '').trim(), email:(c[1] || '').trim(), role:(c[2] || '').trim()}; });
}
function impValidate(rows){
  const seen = {}, existing = new Set(USERS.map(u => u.email.toLowerCase()));
  return rows.map(r => {
    const name = (r.name || '').trim(), email = (r.email || '').trim(), role = (r.role || '').trim().toLowerCase();
    let st;
    if(!name) st = {k:'err', t:'Missing name'};
    else if(!IMP_EMAIL.test(email)) st = {k:'err', t:'Invalid email'};
    else if(!role) st = {k:'warn', t:'Missing role'};
    else if(!IMP_ROLE_KEYS.includes(role)) st = {k:'err', t:`Unknown role "${(r.role || '').trim()}"`};
    else if(existing.has(email.toLowerCase()) || seen[email.toLowerCase()]) st = {k:'err', t:'Duplicate email'};
    else st = {k:'ok', t:'Ready'};
    if(email) seen[email.toLowerCase()] = true;
    return {name:r.name, email:r.email, role:r.role, st};
  });
}
const impTag = st => tag(st.k === 'ok' ? 'active' : st.k === 'warn' ? 'requested' : 'flagged', st.t);
function impStepper(active){
  const steps = ['Upload', 'Review', 'Done'];
  return `<div style="display:flex;align-items:center;justify-content:center;gap:var(--s03);margin:var(--s06) 0 var(--s06);flex-wrap:wrap">
    ${steps.map((s, i) => {
      const done = i < active, on = i === active, fill = done || on;
      const disc = `<span style="width:26px;height:26px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:500;flex:none;${done ? 'background:var(--accent);color:var(--on-accent)' : on ? 'background:var(--text-primary);color:var(--background)' : 'background:var(--surface-2);color:var(--text-helper);border:1px solid var(--border-subtle-02)'}">${done ? `<svg viewBox="0 -960 960 960" width="14" height="14" fill="currentColor" style="display:block">${inner('check')}</svg>` : i + 1}</span>`;
      return `${i ? '<span style="width:36px;height:1px;background:var(--rule);flex:none"></span>' : ''}<span style="display:inline-flex;align-items:center;gap:var(--s03)">${disc}<span style="font-size:var(--t-body-size);${fill ? 'color:var(--text-primary);font-weight:500' : 'color:var(--text-helper)'}">${s}</span></span>`;
    }).join('')}
  </div>`;
}
function usersImport(){
  const imp = S.imp, rows = imp.rows;
  const ready = rows.filter(r => r.st.k === 'ok').length, needfix = rows.length - ready;
  const stepN = imp.step === 'upload' ? 0 : imp.step === 'review' ? 1 : 2;

  const upload = `
    <section class="sec"><div style="max-width:680px;margin:0 auto">
      <label for="impFile" style="display:block;border:1.5px dashed var(--border-subtle-02);padding:var(--s08) var(--s06);text-align:center;cursor:pointer;background:var(--surface-2)">
        <span style="width:44px;height:44px;border-radius:999px;background:var(--background);border:1px solid var(--rule);display:inline-flex;align-items:center;justify-content:center">${I.download}</span>
        <span class="t-h4" style="display:block;margin-top:var(--s04)">Choose a CSV file</span>
        <span class="t-desc" style="display:block">Click to browse. Columns: <b>name</b>, <b>email</b>, <b>role</b>.</span>
        <input type="file" id="impFile" accept=".csv,text/csv" hidden>
      </label>
      <div class="btn-row" style="justify-content:center;margin-top:var(--s05)">
        <button class="btn btn-g btn-sm noic" data-act="imptemplate">${I.download} Download template</button>
        <button class="btn btn-g btn-sm noic" data-act="impsample">Load sample data</button>
      </div>
      <div style="border-top:1px solid var(--rule);margin:var(--s06) 0"></div>
      <h3 class="t-h4" style="margin:0 0 var(--s04)">Or paste CSV rows</h3>
      <textarea class="inp" id="impText" data-imptext rows="4" style="min-height:96px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px" placeholder="name,email,role&#10;Ava Stone,ava@example.com,candidate">${esc(S.imp.text || '')}</textarea>
      <p class="t-desc" style="margin:var(--s04) 0 0">Accepted roles: ${IMP_ROLE_KEYS.join(', ')}.</p>
      <div class="btn-row" style="margin-top:var(--s05);justify-content:flex-end"><button class="btn btn-p noic" data-act="impparse"${(S.imp.text || '').trim() ? '' : ' disabled'}>Parse rows ${I.arrowRight}</button></div>
    </div></section>`;

  /* THE REVIEW TABLE follows our `.tbl` component (Maryam, 11 Sep 2026 — the same
     class `table()` renders: header divider, row hairlines, aligned cells). It is
     built directly rather than through `table()` for two reasons: the rows are
     NOT sortable/paginated, and the role cell's `.fdd` menu must not be clipped —
     so its wrapper is `overflow:visible`, not `.tbl-wrap`'s sideways scroll.
     The editable cells are `.inp` given a full bordered box (radius 0) so a cell
     READS as a field at rest. The role cell is OUR dropdown (`.fdd`, `impRoleCell`),
     never a native <select>. */
  const impFld = 'width:100%;min-height:38px;height:38px;padding:0 var(--s04);border:1px solid var(--border-subtle-02);border-bottom:1px solid var(--border-subtle-02);border-radius:var(--radius);background:var(--background)';
  const impRoleCell = (i, role) => { const k = (role || '').trim().toLowerCase(), cur = ROLES.find(ro => ro.k === k), open = S.impRoleOpen === i;
    return `<div class="fdd${open ? ' on' : ''}" style="display:block">
      <button type="button" class="fdd-t" data-improleopen="${i}" aria-haspopup="listbox" aria-expanded="${open}" style="width:100%;justify-content:space-between;min-height:38px;height:38px;border-color:var(--border-subtle-02);background:var(--background)">
        <span style="${cur ? '' : 'color:var(--text-helper)'}">${cur ? esc(cur.name) : 'Choose role…'}</span>
        <svg class="fdd-cx" viewBox="0 -960 960 960" aria-hidden="true">${inner('chevDown')}</svg></button>
      <div class="fdd-menu" role="listbox">${ROLES.map(ro => `<button type="button" class="fdd-opt${ro.k === k ? ' on' : ''}" role="option" aria-selected="${ro.k === k}" data-improleset="${i}:${ro.k}">${esc(ro.name)}</button>`).join('')}</div>
    </div>`; };
  const review = `
    <section class="sec"><div style="padding:0 var(--s05)">
      <div style="overflow:visible"><table class="tbl">
        <tr><th style="width:52px">Sr. #</th><th>Name</th><th>Email</th><th style="width:210px">Role</th><th style="width:160px">Status</th></tr>
        ${rows.map((r, i) => `<tr>
          <td><span class="t-caption" style="color:var(--text-helper)">${i + 1}</span></td>
          <td><input class="inp" data-impcell="${i}:name" value="${esc(r.name)}" style="${impFld}" aria-label="Row ${i + 1} name"></td>
          <td><input class="inp" data-impcell="${i}:email" value="${esc(r.email)}" style="${impFld}" aria-label="Row ${i + 1} email"></td>
          <td>${impRoleCell(i, r.role)}</td>
          <td>${impTag(r.st)}</td>
        </tr>`).join('')}
      </table></div>
      <div class="btn-row" style="margin-top:var(--s06);justify-content:space-between">
        <button class="btn btn-g noic" data-act="impback">${I.arrowLeft} Previous Step</button>
        <button class="btn btn-p noic" data-act="impdo"${ready ? '' : ' disabled'}>Import ${ready} user${ready === 1 ? '' : 's'} ${I.arrowRight}</button>
      </div>
    </div></section>`;

  const done = `
    <section class="sec">
      <div style="text-align:center;padding:var(--s08) var(--s06)">
        <span style="width:52px;height:52px;border-radius:999px;background:var(--support-success-ink);display:inline-flex;align-items:center;justify-content:center;color:var(--background)"><svg viewBox="0 -960 960 960" width="28" height="28" fill="currentColor" style="display:block">${inner('check')}</svg></span>
        <h3 class="t-h3" style="margin:var(--s05) 0 var(--s03)">Imported ${imp.count} user${imp.count === 1 ? '' : 's'}</h3>
        <p class="t-desc">Users have been successfully added to the platform.</p>
        <div class="btn-row" style="justify-content:center;margin-top:var(--s06)">
          <button class="btn btn-p noic" data-act="impmore">${I.download} Import more users</button>
        </div>
      </div>
    </section>`;

  return `
  ${detailHead('users/users', pageSummary())}
  ${impStepper(stepN)}
  ${imp.step === 'upload' ? upload : imp.step === 'review' ? review : done}`;
}
ACTIONS.imptemplate = () => {
  try { const csv = 'name,email,role\nAva Stone,ava@example.com,candidate\nMax Lee,max@example.com,agent\n';
    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'user-import-template.csv'; a.click(); } catch(e){}
  toast('Template downloaded (name, email, role)');
};
ACTIONS.impsample = () => { S.imp.rows = impValidate(IMP_SAMPLE.map(r => ({name:r[0], email:r[1], role:r[2]}))); S.imp.step = 'review'; };
ACTIONS.impparse = () => {
  const rows = impParse(S.imp.text || '');
  if(!rows.length){ toast('Nothing to parse — paste rows or load the sample', 'warn'); return 'keep'; }
  S.imp.rows = impValidate(rows); S.imp.step = 'review';
};
ACTIONS.impback = () => { S.imp.step = 'upload'; };
ACTIONS.impmore = () => { S.imp = {step:'upload', rows:[], count:0, text:''}; };
ACTIONS.impdo = () => {
  const ready = S.imp.rows.filter(r => r.st.k === 'ok');
  if(!ready.length){ toast('No rows are ready to import', 'warn'); return 'keep'; }
  ready.forEach(r => { const u = {id:newId('u', USERS), name:r.name.trim(), email:r.email.trim(), roles:[r.role.trim().toLowerCase()], level:'—', status:'active', joined:today(), origin:'individual', last:'invited'}; USERS.push(u); USER_BY_ID[u.id] = u; });
  S.imp.count = ready.length;
  audit('Bulk imported users', `${ready.length} account${ready.length === 1 ? '' : 's'} from CSV`, 'Users & Roles', 'high');
  S.imp.step = 'done';
};

/* THE STAFF MEMBER DETAIL (1.7) — an internal account's full record: their
   details, the role with the permissions it carries (read-only — changed in the
   Roles module, not here), their status and provenance, and their recent audit
   lines. Actions mirror the directory row, guards and all. */
function staffDetailView(u){
  DETAIL_LABEL = u.name;
  const days = inviteDaysLeft(u);
  const sum = `<b>${esc(u.name)}</b> holds the ${esc(staffRoleName(u))} role in ${esc(u.dept || 'the team')}. ${u.status === 'invited' ? 'The invite is outstanding, so the account can’t sign in until it is accepted.' : u.status === 'inactive' ? 'The account is deactivated: the record is intact but sign-in is refused.' : 'The account is active.'}`;
  const prot = staffProtect(u);
  let acts;
  if(u.orig){
    acts = '<span class="tag sm brand">Original Super Admin — protected</span>';
  } else if(u.status === 'invited'){
    acts = `<button class="btn btn-g btn-sm noic" data-act="staffresend:${u.id}">${I.renew} Resend Invite</button>
      <button class="btn btn-g btn-sm noic" data-act="staffpreviewactivate:${u.id}">${I.view} Preview Activation</button>
      <button class="btn btn-g btn-sm noic" data-act="staffcancelinvite:${u.id}">${I.close} Cancel Invite</button>
      <button class="btn btn-g btn-sm noic" data-sheet="delstaff:${u.id}">${I.delete} Delete</button>`;
  } else {
    acts = `<button class="btn btn-g btn-sm noic" data-sheet="editstaff:${u.id}">${I.edit} Edit</button>
      ${prot ? '' : `<button class="btn btn-g btn-sm noic" data-sheet="changerole:${u.id}">Change Role</button>`}
      ${u.roles.includes('leader')
        ? `<button class="btn btn-g btn-sm noic" data-act="askremoveleader:${u.id}">Remove Cohort Leader</button>`
        : `<button class="btn btn-g btn-sm noic" data-act="askmarkleader:${u.id}">Mark As Cohort Leader</button>`}
      ${u.status === 'active'
        ? (prot || lastSAGuard(u) ? '' : `<button class="btn btn-g btn-sm noic" data-sheet="deactivate:${u.id}">Deactivate</button>`)
        : `<button class="btn btn-p btn-sm noic" data-sheet="reactivate:${u.id}">Reactivate ${I.arrowRight}</button>`}
      ${prot || lastSAGuard(u) ? '' : `<button class="btn btn-g btn-sm noic" data-sheet="delstaff:${u.id}">${I.delete} Delete</button>`}`;
  }
  const caps = CAPS.filter(c => (MATRIX[staffRole(u)] || {})[c.k]);
  const invitedBy = u.invitedBy && USER_BY_ID[u.invitedBy] ? (USER_BY_ID[u.invitedBy].id === ME.id ? 'You' : USER_BY_ID[u.invitedBy].name) : '—';
  return `
  ${detailHead('users/staff', sum)}
  <section class="sec">
    ${aiHead(esc(u.name), esc(u.email), acts)}
    ${kv([
      ['Role', esc(staffRoleName(u))],
      ['Status', u.status === 'invited' ? `${staffStatusTag(u)}${days != null ? (days > 0 ? ` · ${days} day${days === 1 ? '' : 's'} left` : ' · expired') : ''}` : staffStatusTag(u)],
      ['Job title', esc(u.job || '—')],
      ['Department', esc(u.dept || '—')],
      ['Phone', esc(u.phone || '—')],
      ['Added', esc(u.joined)],
      ['Invited by', esc(invitedBy)],
      ['Last signed in', esc(u.last || 'Never')]
    ])}
  </section>

  <section class="sec">
    ${aiHead(`What a ${staffRoleName(u)} can do`, 'The permissions this role carries. Change them in the Roles module, not here.')}
    ${caps.length ? `<div class="skl">${caps.map(c => `<span class="skl-c">${esc(c.t)}</span>`).join('')}</div>` : note('', '', 'This role carries no platform permissions.')}
  </section>

  <section class="sec">
    ${secHead('Recent activity')}
    <div class="tile-stack">
      ${AUDIT.filter(a => a.who === u.name || a.obj.indexOf(u.name) === 0).slice(0, 5).map(a =>
        memRow(a.who, `${esc(a.act)} · ${esc(a.obj)}`, `<span class="t-caption">${esc(a.when)}</span>`)).join('')
        || emptyState('doc', 'No audit lines yet', 'Nothing on this account has been logged in this window.')}
    </div>
  </section>`;
}

        || emptyState('doc', 'No audit lines yet', 'Nothing on this account has been logged in this window.')}

const CHECK_LABEL = {clear:'Clear', flagged:'Flagged', flag:'Flagged', pending:'Pending', 'n/a':'Not required', confirmed:'Confirmed'};
const CHECK_V = {clear:'green', flagged:'red', flag:'red', pending:'warn', 'n/a':'', confirmed:'green'};
const checkTag = v => `<span class="tag sm${CHECK_V[v] ? ' ' + CHECK_V[v] : ''}">${esc(CHECK_LABEL[v] || cap(v))}</span>`;

PAGESUM['vetting/applications'] = () => {
  const rev = APPLICATIONS.filter(a => a.status === 'review').length;
  const flag = APPLICATIONS.filter(a => a.safeguarding === 'flagged' && a.status !== 'approved' && a.status !== 'rejected').length;
  return `${openApps()} agents are in the queue, ${rev} ready to decide. Agents run recorded 1:1 interviews with 18–24 year-olds, so <b>${flag} need an enhanced safeguarding check</b> before they can go live.`;
};
PAGESUM['vetting/empverify'] = () => {
  const n = unverifiedEmp();
  return `<b>${n} employer ${n === 1 ? 'account is' : 'accounts are'} not yet verified.</b> An employer is verified before it can unlock candidate interviews or make a hire, so the queue is the gate on the hiring side.`;
};

function vettingApplications(){
  const sf = getFilter('safe', 'all'), q = getFilter('q', '');
  const open = APPLICATIONS.filter(a => a.status !== 'approved' && a.status !== 'rejected');
  const decided = APPLICATIONS.filter(a => a.status === 'approved' || a.status === 'rejected');
  const rows = (sf === 'decided' ? decided : open)
    .filter(a => sf === 'all' || sf === 'decided' ? true : sf === 'flagged' ? a.safeguarding === 'flagged' : a.safeguarding !== 'flagged')
    .filter(a => hit(q, a.name, a.email, a.role, a.location));
  return `
  <section class="sec">
    ${searchHead('Agent applications', 'Everyone who applied to conduct interviews. Open one to see the checks and decide.', exportBtn('Applications'), 'Search applicants')}
    ${filterStrip('safe', 'all', [
      ['all', 'Open', open.length],
      ['flagged', 'Enhanced check', open.filter(a => a.safeguarding === 'flagged').length],
      ['clear', 'Cleared or n/a', open.filter(a => a.safeguarding !== 'flagged').length],
      ['decided', 'Decided', decided.length]
    ])}
    ${lstTools('Search applicants')}
    ${rows.length ? table(
      [{label:'Applicant'}, {label:'Experience'}, {label:'Fee', num:true}, {label:'Safeguarding'}, {label:'Stage'}, {label:'Applied'}, ACT_COL],
      rows.map(a => ({go:'vetting/appdetail/' + a.id, sv:[a.name], cells:[
        idCell(a.name, a.email),
        esc(a.role),
        money(a.fee),
        checkTag(a.safeguarding),
        a.status === 'approved' ? tag('approved') : a.status === 'rejected' ? tag('rejected')
          : tag(a.stage === 'interview' ? 'scheduled' : 'review', a.stage === 'interview' ? 'Vetting call' : 'In checks'),
        esc(a.when),
        a.status === 'approved' || a.status === 'rejected' ? ''
          : rowActs([['check', 'Approve', `data-act="askhire:${a.id}"`], ['close', 'Reject', `data-act="askreject:${a.id}"`]])
      ]})))
      : emptyState('shield', 'The queue is clear', 'No applications are waiting on a decision.')}
  </section>`;
}

ACTIONS.askhire = key => {
  const a = APP_BY_ID[key.split(':')[1]]; if(!a) return;
  const blocked = a.safeguarding === 'flagged' || a.bg === 'flag';
  askConfirm({mk: blocked ? 'warning' : 'check', title:`Approve ${a.name} as a Talent Agent?`,
    body: blocked ? `A check is still ${a.bg === 'flag' ? 'flagged' : 'outstanding'} on this application. Approving now overrides it — your call wins, and the override is logged at high severity.`
      : `${a.name} gets an agent account at ${money(a.fee)} a session and appears on the marketplace. Written to the audit log.`,
    ok:'Approve & Hire', danger: blocked, act:'apphire:' + a.id});
};
ACTIONS.apphire = key => {
  const a = APP_BY_ID[key.split(':')[1]]; if(!a) return;
  a.status = 'approved'; a.decision = 'hired';
  if(!USERS.some(u => u.email === a.email)){
    const u = {id:newId('u', USERS), name:a.name, email:a.email, roles:['agent'], level:'—', job:a.role, rating:0, interviewed:0, status:'active', joined:today(), origin:'individual', last:'just now', fee:a.fee};
    USERS.push(u); USER_BY_ID[u.id] = u;
  }
  audit('Approved agent', a.name, 'Vetting', 'notice');
  toast(a.name + ' approved as a Talent Agent');
  S.confirm = null; S.mod = 'vetting'; S.sub = 'applications'; S.id = null;
};
ACTIONS.askreject = key => { S.id = key.split(':')[1]; S.sheet = 'reject'; };
ACTIONS.doreject = key => {
  const a = APP_BY_ID[key.split(':')[1]]; if(!a) return;
  const v = readForm(); if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  a.status = 'rejected'; a.decision = 'rejected'; a.note = 'Rejected: ' + v.reason;
  audit('Rejected agent application', a.name, 'Vetting', 'notice');
  toast(a.name + '’s application rejected');
  S.mod = 'vetting'; S.sub = 'applications'; S.id = null;
};
ACTIONS.domoreinfo = key => {

const yn = v => v ? '<span class="tag sm green">Yes</span>' : '<span class="tag sm">No</span>';
const LEVELS = ['E1', 'E2', 'E3', 'B1', 'B2', 'B3', 'T1', 'T2', 'T3'];
/* TRAILBLAZER IS OUT OF MVP AND STAYS IN THE DATA MODEL (SA-04 E4): the three
   T levels are kept on the records (Yuki Tanaka is T1 in the seed) and are not
   OFFERED by a picker. `levelOpts(cur)` is the MVP list plus the record's own
   level when it is one of the three, so an edit never silently demotes. */
const LEVELS_MVP = LEVELS.filter(l => l[0] !== 'T');
const levelOpts = cur => (cur && cur[0] === 'T' && !LEVELS_MVP.includes(cur)) ? [...LEVELS_MVP, cur] : LEVELS_MVP;
const levelIx = l => LEVELS.indexOf(l);
const bucketOf = lvl => lvl[0] === 'B' ? 'Builder' : lvl[0] === 'T' ? 'Trailblazer' : 'Explorer';
const agentNames = () => USERS.filter(u => u.roles.includes('agent')).map(u => u.name);

/* ==========================================================================
   THE CANDIDATE-PORTAL COMPONENTS, VIEWED BY AN ADMIN (Maryam, 14 Sep 2026).
   The level black card, the interview-scenes carousel and the quiz-results
   block are the candidate portal's own components (§75 dark-card, §111 `.scv*`,
   §80 `.qzp*`, §61 the rose) — all shipped in the design system, so the admin
   composes their MARKUP on the same classes. Only the COPY changes: the admin
   is reading someone else's record, so the voice is third-person. Except the
   quiz rose, none of this is redrawn.
   ========================================================================== */

/* THE LADDER, CORRECT ACROSS ALL THREE TRACKS. The DS `dsLadder` reads `RUNG`,
   which only maps the five Explorer codes (the candidate portal never shows a
   Builder), so a Builder or Trailblazer would land on rung 2. Here a candidate
   can be anywhere on the fifteen, so the rung is `LVL_CODES.indexOf` — the
   position in the one true list. `codes` prints the code in every block, the
   black hero's own state (the level is printed at 34px above it). */

/* INTERVIEW SCENES — the candidate portal's `.scv*` carousel (§111.9), whole:

   attribution wears the same portrait disc — exactly `pfScenes`. The design
   system ships five embedded faces (`AV.priya/owen/lena/samuel/hana`), so the
   admin does not fall back to a grey box; `agentFace` maps each agent to one
   deterministically (a first-name match where there is one, otherwise a stable
   hash). The titles/durations are authored placeholder (flagged, §74 — the seed
   has no per-interview scene telemetry); every card is attributed to the agent
   whose interview it came from, so the row IS "all scenes from all interviews". */
const ADM_SCENE_SET = [
  ['The reorganization call', '02:14'], ['Handing over the vendor review', '11:02'],
  ['The Friday rhythm', '19:37'],       ['Managing up', '24:50'],
  ['Conflict with a peer', '31:15'],    ['Closing reflection', '41:03']
];
const ADM_FACES = [AV.priya, AV.owen, AV.lena, AV.samuel, AV.hana];
function agentFace(name){
  const first = String(name || '').trim().toLowerCase().split(/\s+/)[0];
  if(AV[first]) return AV[first];
  let h = 0; for(const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return ADM_FACES[h % ADM_FACES.length];
}
/* ALIGNED (14 Sep 2026): the carousel MARKUP is now the shipped `dsScenes`
   builder — `sceneCardAdm` was a hand-copy of `.scv*` (its own note said "the
   candidate portal's carousel, whole"), which is precisely what drifts. The admin
   keeps its OWN data (`ADM_SCENE_SET` × the interviews' agents, authored
   placeholder) and hands each scene to the builder as a `{img, i, name, at,
   title}` record; the chevrons run through the shared `dsScvScroll`. The empty
   state stays the admin's own — `dsScenes` draws a row, not a "nothing yet". */
function admScenes(ivs){
  const withAgent = ivs.filter(b => b.agent && b.agent !== '—');
  const scenes = withAgent.flatMap(b => ADM_SCENE_SET.map(([t, at]) => ({
    img: agentFace(b.agent), i: initials(b.agent), name: b.agent, at, title: t
  })));
  return scenes.length
    ? dsScenes('Interview scenes', scenes)
    : `<section class="sec">
        ${aiHead('Interview scenes', 'Short clips kept from every interview on this candidate’s record.', '')}
        ${emptyState('video', 'No scenes yet', 'Scenes appear once this candidate has an interview on the record.')}
      </section>`;
}

/* THE QUIZ RESULTS — the candidate portal's `quizPeek` content (§80) laid out
   as a normal section rather than a 372px slide-over. The rose (§61) is ported
   verbatim; the lists and the ladder rows are the same, third-person. The five
   bands are authored placeholder (§74 — the seed has no per-candidate quiz),
   the same set the candidate portal ships. */
const ADM_SCORES = [['Decisiveness', 78], ['Delegation', 41], ['Directness', 66],
                    ['Coaching', 38], ['Composure', 84]];
const ADM_QZ_STR = ['Execution under pressure', 'Comfortable with ambiguity', 'Holds a line under challenge'];
const ADM_QZ_DEV = ['Delegates too late', 'Avoids conflict until it escalates', 'Coaches by telling'];
const qzBand = v => v >= 70 ? ['s', 'Strong'] : v >= 50 ? ['m', 'Mixed'] : ['w', 'Weak'];
const qzRung = (v, track) => {
  const T = ['Explorer', 'Builder', 'Trailblazer'];
  const lo = Math.max(0, T.indexOf(track || 'Explorer')) * 5;
  const fifth = Math.min(5, Math.max(1, Math.ceil(v / 20)));
  return LVL_CODES[lo + fifth - 1];
};
function qzLede(first){
  const asc = ADM_SCORES.slice().sort((a, b) => a[1] - b[1]);
  const low = asc[0], high = asc[asc.length - 1];
  return `<b>${high[0]}</b> at ${high[1]} is ${esc(first)}’s strongest band, `
    + `${low[0].toLowerCase()} at ${low[1]} the weakest. An agent pushes hardest on the two lowest, `
    + `and both are holding ${esc(first)} a rung below the rest.`;
}
const qzList = (title, hue, items) => `<div class="qzp-g">
  <div class="qzp-t ${hue}">${title}</div>
  <ol class="qzp-l">${items.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
</div>`;
/* THE ROSE — `quizRose` from views.js, unchanged. Five wedges from a hub, each
   reaching as far as its score; the fill carries the verdict (solid / hatch /
   hairline), never a hue. Every token it reads (`--chart-ink`, `--layer-01/02`,
   `--border-subtle-01`) ships in the design system. */
function quizRose(dims, score, bare){
  const CX = 180, CY = 158, R0 = 36, R = 108, GAP = 1.4;
  const pol = (a, r) => [CX + r * Math.cos(a * Math.PI / 180), CY + r * Math.sin(a * Math.PI / 180)];
  const seg = (a0, a1, r) => {
    const [x0, y0] = pol(a0, R0), [x1, y1] = pol(a0, r), [x2, y2] = pol(a1, r), [x3, y3] = pol(a1, R0);
    return `M${x0.toFixed(1)} ${y0.toFixed(1)}L${x1.toFixed(1)} ${y1.toFixed(1)}`
      + `A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`
      + `L${x3.toFixed(1)} ${y3.toFixed(1)}`
      + `A${R0} ${R0} 0 0 0 ${x0.toFixed(1)} ${y0.toFixed(1)}Z`;
  };
  const step = 360 / dims.length;
  const fill = v => ({s: 'var(--chart-ink)', m: 'url(#qzHatch)', w: 'var(--layer-01)'})[qzBand(v)[0]];
  const rings = [25, 50, 75, 100].map(p =>
    `<circle cx="${CX}" cy="${CY}" r="${(R0 + (p / 100) * (R - R0)).toFixed(1)}" fill="none"
      stroke="var(--border-subtle-01)" stroke-width="1" stroke-dasharray="2 4"/>`).join('');
  const wedges = dims.map(([k, v], i) => {
    const a0 = -90 + i * step + GAP, a1 = -90 + (i + 1) * step - GAP;
    return `<path d="${seg(a0, a1, R0 + (v / 100) * (R - R0))}" fill="${fill(v)}"
      stroke="var(--chart-ink)" stroke-width="1.2"/>`;
  }).join('');
  const marks = dims.map(([k, v], i) => {
    const mid = -90 + i * step + step / 2;
    const [lx, ly] = pol(mid, R + 21);
    const anchor = Math.abs(lx - CX) < 14 ? 'middle' : (lx > CX ? 'start' : 'end');
    const [vx, vy] = pol(mid, R0 + (v / 100) * (R - R0) - 15);
    return `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anchor}" class="qz-lab">${k}</text>
      <text x="${vx.toFixed(1)}" y="${(vy + 4).toFixed(1)}" text-anchor="middle"
        class="qz-val${qzBand(v)[0] === 's' ? ' on' : ''}">${v}</text>`;
  }).join('');
  return `<div class="qz-rose">
    <svg viewBox="-32 0 424 326" class="qz-svg" role="img"
      aria-label="Quiz bands: ${dims.map(([k, v]) => k + ' ' + v).join(', ')}">
      <defs><pattern id="qzHatch" width="6" height="6" patternTransform="rotate(45)"
        patternUnits="userSpaceOnUse">
        <rect width="6" height="6" fill="var(--layer-01)"/>
        <line x1="0" y1="0" x2="0" y2="6" stroke="var(--chart-ink)" stroke-width="2"/></pattern></defs>
      ${rings}${wedges}
      <circle cx="${CX}" cy="${CY}" r="${R0}" fill="var(--layer-01)"
        stroke="var(--chart-ink)" stroke-width="1.2"/>
      <text x="${CX}" y="${CY - 2}" text-anchor="middle" class="qz-mid">${score}</text>
      <text x="${CX}" y="${CY + 14}" text-anchor="middle" class="qz-mids">of 100</text>
      ${marks}
    </svg>
    ${bare ? '' : `<div class="qz-key">
      ${dims.map(([k, v]) => { const [cls, word] = qzBand(v);
        return `<div class="kv"><span class="k"><i class="qz-sw ${cls}"></i>${k}</span>
          <span class="v">${v}<span class="tag qz-vd">${word}</span></span></div>`; }).join('')}
    </div>`}
  </div>`;
}
function admQuiz(c){
  const first = String(c.name).split(' ')[0];
  const asc = ADM_SCORES.slice().sort((a, b) => a[1] - b[1]);
  const rows = asc.slice(0, 2).map(([band, v]) => `
    <div class="qzp-r">

      <span class="qzp-r-b">
        <span class="qzp-r-k">${band} &middot; ${v}</span>
        <span class="qzp-r-v">Reads at ${qzRung(v, c.bucket)} on the ${esc(c.bucket)} track</span>
        <span class="qzp-r-tag">High impact</span>
      </span>
    </div>`).join('');
  return `<section class="sec">
    ${aiHead('Quiz results', 'How the levelling quiz scored this candidate across the five bands.')}
    <div class="adm-quiz">
      <p class="qzp-lede"><span class="qzp-mk" aria-hidden="true"></span>${qzLede(first)}</p>
      ${qzList('What they do well', 'ok', ADM_QZ_STR)}
      ${qzList('Where they lose ground', 'acc', ADM_QZ_DEV)}
      <div class="qzp-rose">${quizRose(ADM_SCORES, 64, true)}</div>
      <div class="qzp-g">
        <div class="qzp-t">Where this puts them on the ladder</div>
        <div class="qzp-rows">${rows}</div>
      </div>
    </div>
  </section>`;
}

function levelHistory(c){

    c.history = [];
    AUDIT.filter(a => a.act === 'Promoted candidate' && a.obj.indexOf(c.name) === 0 && a.who !== ME.name).forEach(a => {

}
/* ---- SA-05: SCORE OVERRIDE (blocked; the surface is drawn, the blind is not) --
   Void an interview's score with one of two consequences — a free re-interview
   (A1) or a void that leaves the agent's share untouched (A2) — and a batch
   recalibration on a faulty model version (A3). What the re-interviewer is
   shown afterwards (blinded or unblinded, E1) is the blocked ruling and is
   stated, not chosen; a recording past its 24-month retention (E2) is checked
   against the booking date. */
SHEETS.voidscore = id => {
  const b = BOOKINGS.find(x => x.id === id); if(!b) return {title:'Void score', body:'', ok:''};
  const past = b.date && (new Date() - new Date(b.date)) > 730 * 864e5;
  return {title:`Void the score — ${b.cand} with ${b.agent}`, ok:'Continue', act:'askvoid:' + b.id,
    body:`${kv([['Interview', `${esc(b.kind)} · ${esc(b.slot)} · ${esc(b.date)}`], ['Fee', b.fee ? money(b.fee) : 'Free'], ['Recording', past ? tag('blocked', 'Past 24-month retention — erased') : tag('active', 'Within retention')]])}
      ${fieldHtml({k:'mode', l:'Consequence', t:'select', opts:[['reiv', 'Void and grant a free re-interview'], ['keep', 'Void only — the agent’s share is not penalised']]}, 'reiv')}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — e.g. connection dropped for 20 minutes'})}
      ${note('warn', 'Blinded or unblinded is undecided', `Whether the re-interviewer sees this recording is the blocked ruling (SA-05 E1)${past ? '; here it is moot — the recording is past retention (E2)' : ''}. The void is logged either way.`)}`};
};
ACTIONS.askvoid = key => {
  const b = BOOKINGS.find(x => x.id === key.split(':')[1]); const v = readForm(); if(!b) return;
  if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  S._pending = v;
  askConfirm({mk:'warning', title:`Void ${b.cand}’s score from this interview?`, body: v.mode === 'reiv' ? `The score no longer counts toward a level and ${b.cand} is granted a free re-interview. ${b.agent}’s share of the ${b.fee ? money(b.fee) : 'fee'} is unaffected.` : `The score no longer counts toward a level. ${b.agent}’s share is not penalised and no re-interview is granted.`, ok:'Void Score', danger:true, act:'dovoid:' + b.id});
};
ACTIONS.dovoid = key => {
  const b = BOOKINGS.find(x => x.id === key.split(':')[1]); const v = S._pending || {}; S._pending = null; S.confirm = null; if(!b) return;
  const from = b.status; b.status = 'voided';
  if(v.mode === 'reiv'){ BOOKINGS.push({id:newId('bk', BOOKINGS), cand:b.cand, agent:b.agent, slot:'To be booked', date:isoToday(), fee:0, escrow:'n/a', paid:false, kind:'Re-interview (free)', status:'pending'}); }
  audit(v.mode === 'reiv' ? 'Voided score, granted free re-interview' : 'Voided score, agent share kept', `${b.cand} — ${b.agent} · ${v.reason || ''}`, 'Candidates', 'high', {from, to:'voided'});
  toast(v.mode === 'reiv' ? `Score voided — ${b.cand} gets a free re-interview` : 'Score voided');
};

const AGENTS = () => USERS.filter(u => u.roles.includes('agent'));
/* `display:inline-block` overrides the DS's `svg{display:block}` so the star
   sits ON the rating line rather than stacking above it (Maryam, 7 Sep 2026). */

/* THE STAR LEADS THE DIGIT — "★ 4.9", not "4.9 ★" (Maryam, 7 Sep 2026). */
const ratingCell = r => `<span style="white-space:nowrap">${starMark} ${r}</span>`;

const listed = a => a.status === 'active';

/* ======================================================================
   MARKETPLACE (user-stories Epic 6) — assessment range, the three listing
   states, and a WEEKLY-FROZEN ranking.
   ====================================================================== */
/* THE ASSESSMENT RANGE is guidance shown to candidates; it restricts nothing
   (6.3). A range is a pair on the fifteen-rung ladder and may be a single
   level. Authored placeholder (§74 — the seed carries no range). */
const LADDER = LVL_CODES;                    /* E1..E5, B1..B5, T1..T5 (from the DS) */
const agRange = a => a.range || ['E2', 'B1'];
const rangeLabel = r => r[0] === r[1] ? r[0] : `${r[0]} to ${r[1]}`;
const rangeCovers = (r, lvl) => LADDER.indexOf(lvl) >= LADDER.indexOf(r[0]) && LADDER.indexOf(lvl) <= LADDER.indexOf(r[1]);
/* THREE LISTING STATES (6.1): Listed (bookable), Paused (an admin took them out),
   Not listed (never finished their own onboarding, so never appeared). Listing
   state is independent of account status. */
const agState = a => a.onboarded === false ? 'notlisted' : (a.status === 'active' ? 'listed' : 'paused');
const AG_STATE = {listed:['active', 'Listed'], paused:['inactive', 'Paused'], notlisted:['', 'Not listed']};
const agStateTag = a => { const [v, l] = AG_STATE[agState(a)]; return tag(v, l); };
/* THE RANKING IS BY CANDIDATE RATING ALONE, recalculated WEEKLY — it is not live
   (6.1). Only Listed agents carry a rank. We freeze it once at load and state
   when it was last recalculated and when it next falls, on the Monday–Sunday
   cycle payouts already use. Ties break on interviews conducted. */
let RANK_LAST = '', RANK_NEXT = '';
function freezeRanking(){
  AGENTS().forEach(a => a.rank = null);
  AGENTS().filter(a => agState(a) === 'listed')
    .sort((a, b) => b.rating - a.rating || b.interviewed - a.interviewed)
    .forEach((a, i) => a.rank = i + 1);
  const now = new Date(), dow = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() - ((dow + 6) % 7)); mon.setHours(0, 0, 0, 0);
  const next = new Date(mon); next.setDate(mon.getDate() + 7);
  const fmt = d => d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  RANK_LAST = fmt(mon); RANK_NEXT = fmt(next);
}

  AGENTS().forEach(a => { if(!a.range) a.range = seed[a.id] || ['E1', 'E3']; });
  freezeRanking();
})();

/* ---- MARKETPLACE ACTIONS (Epic 6) --------------------------------------------
   Set an agent's assessment range (6.3) and pause / restore a listing with a
   mandatory reason (6.2). The range is guidance only and restricts nothing; a
   pause leaves the diary, money and portal access untouched. Every one carries
   a reason to the audit log that is never shown to the agent. */
const agUpcoming = a => BOOKINGS.filter(b => b.agent === a.name && b.status !== 'cancelled' && b.status !== 'voided').length;

SHEETS.agrange = id => {
  const a = USER_BY_ID[id]; if(!a) return {title:'Set assessment range', body:'', ok:''};
  const r = agRange(a);
  return {title:`Set assessment range — ${a.name}`, ok:'Save Range', act:'doagrange:' + id,
    body:`${kv([['Agent', esc(a.name)], ['Current range', rangeLabel(r)]])}
      ${fieldHtml({k:'from', l:'From level', t:'select', opts: LADDER.map(l => [l, l])}, r[0])}
      ${fieldHtml({k:'to', l:'To level', t:'select', opts: LADDER.map(l => [l, l])}, r[1])}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — written to the audit log; never shown to the agent'})}
      <p class="t-desc">Guidance shown to candidates on the marketplace and the agent’s public profile. It restricts nothing — the agent may still interview at any level.</p>`};
};
ACTIONS.doagrange = key => {
  const a = USER_BY_ID[key.split(':')[1]]; const v = readForm(); if(!a) return;
  if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  if(LADDER.indexOf(v.from) > LADDER.indexOf(v.to)){ toast('The lower level must come before the upper level', 'warn'); return 'keep'; }
  const before = agRange(a);
  if(before[0] === v.from && before[1] === v.to){ toast('Pick a different range', 'warn'); return 'keep'; }
  a.range = [v.from, v.to];
  audit('Set agent assessment range', `${a.name} — ${rangeLabel(before)} → ${rangeLabel(a.range)} · ${v.reason}`, 'Talent Agents', 'notice', {from: rangeLabel(before), to: rangeLabel(a.range)});
  toast(`${a.name} now assesses ${rangeLabel(a.range)}`);
};

SHEETS.agpause = id => {
  const a = USER_BY_ID[id]; if(!a) return {title:'Pause listing', body:'', ok:''};
  const n = agUpcoming(a);
  return {title:`Pause ${a.name}’s listing`, ok:'Pause Listing', danger:true, act:'askagpause:' + id,
    body:`${kv([['Agent', esc(a.name)], ['Email', esc(a.email)], ['Upcoming interviews', `${n} in the diary`]])}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — written to the audit log; never shown to the agent'})}
      <p class="t-desc">They come out of the marketplace and cannot receive new bookings. Their ${n} upcoming interview${n === 1 ? '' : 's'} go ahead as booked, and they keep their diary, evaluations and earnings. Their rank clears at the next weekly recalculation.</p>`};
};
ACTIONS.askagpause = key => {
  const a = USER_BY_ID[key.split(':')[1]]; const v = readForm(); if(!a) return;
  if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  S._pending = {reason: v.reason};
  askConfirm({mk:'warning', title:`Pause ${a.name}?`, body:`They stop appearing in the marketplace. Their ${agUpcoming(a)} upcoming interview${agUpcoming(a) === 1 ? '' : 's'} go ahead as booked.`, ok:'Pause Listing', danger:true, act:'doagpause:' + a.id});
};
ACTIONS.doagpause = key => {
  const a = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null; if(!a) return;
  a.status = 'inactive'; freezeRanking();
  audit('Paused agent listing', `${a.name} · ${v.reason || ''}`, 'Talent Agents', 'high');
  toast(`${a.name}’s listing paused`);
};

SHEETS.agrestore = id => {
  const a = USER_BY_ID[id]; if(!a) return {title:'Restore listing', body:'', ok:''};
  return {title:`Restore ${a.name}’s listing`, ok:'Restore Listing', act:'askagrestore:' + id,
    body:`${kv([['Agent', esc(a.name)], ['Email', esc(a.email)]])}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — written to the audit log; never shown to the agent'})}
      <p class="t-desc">They reappear in the marketplace immediately and can receive new bookings. They regain a rank at the next weekly recalculation.</p>`};
};
ACTIONS.askagrestore = key => {
  const a = USER_BY_ID[key.split(':')[1]]; const v = readForm(); if(!a) return;
  if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  S._pending = {reason: v.reason};
  askConfirm({mk:'check', title:`Restore ${a.name} to the marketplace?`, body:'They reappear immediately and can be booked again.', ok:'Restore Listing', act:'doagrestore:' + a.id});
};
ACTIONS.doagrestore = key => {
  const a = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null; if(!a) return;
  a.status = 'active'; freezeRanking();
  audit('Restored agent listing', `${a.name} · ${v.reason || ''}`, 'Talent Agents', 'high');
  toast(`${a.name}’s listing restored`);
};

  <section class="sec">

  </section>

  <section class="sec">
    ${aiHead('Sessions', 'The group sessions this cohort runs across the 90-day cycle. Add or remove one at any time.',
      `<button class="btn btn-g btn-sm noic" data-act="addsess:${c.id}">${I.add} Add Session</button>`)}
    ${(c.sessions && c.sessions.length) ? table(

      : emptyState('calendar', 'No sessions yet', draft ? 'Build the session outline before you start the cohort.' : 'Add the first session to this cohort.')}

}
SHEETS.addmember = () => {
  const c = COHORT_BY_ID[S.id];
  const free = CANDS.filter(x => x.cohort === '—' && x.status === 'active');
  /* SA-12 A1 — FORCE ADD: a candidate already placed elsewhere, or suspended,
     can be added past the eligibility rule; the option says so and the add is
     logged at high severity. The eligibility rule itself is the open ruling. */
  const forced = CANDS.filter(x => !(x.cohort === '—' && x.status === 'active') && x.cohort !== (c || {}).name);
  return {title:`Add a member to ${c ? c.name : 'the cohort'}`,
    body:`${fieldHtml({k:'cand', l:'Candidate', t:'select', opts: [...(free.length ? free.map(x => [x.id, `${x.name} · ${x.level}`]) : [['', 'Every active candidate is already in a cohort']]), ...forced.map(x => [x.id, `${x.name} · ${x.level} · ${x.status === 'inactive' ? 'suspended' : 'in ' + x.cohort} — force add`])]})}
      <p class="t-desc">Candidates without a cohort are offered first. An entry marked “force add” bypasses eligibility (SA-12 A1) — they leave their current cohort or their suspension is noted — and is logged at high severity.</p>`,
    ok:'Add To Roster', act:'doaddmember:' + (c ? c.id : '')};
};
ACTIONS.doaddmember = key => { const c = COHORT_BY_ID[key.split(':')[1]]; const v = readForm(); const m = CAND_BY_ID[v.cand]; if(!c || !m){ toast('Pick a candidate', 'warn'); return 'keep'; }
  const forced = !(m.cohort === '—' && m.status === 'active'); const from = m.cohort;
  m.cohort = c.name; syncCohortSizes();
  audit(forced ? 'Force-added to cohort (eligibility bypassed)' : 'Added to cohort', `${m.name} → ${c.name}${forced ? ` · was ${from === '—' ? 'suspended' : 'in ' + from}` : ''}`, 'Cohort Management', forced ? 'high' : 'notice', {from, to:c.name});
  toast(`${m.name} ${forced ? 'force-added' : 'added'} to ${c.name}`); };
/* SA-12 A5 — extend or reschedule. 12 versus 13 weeks is the open ruling; both are
   offered and the choice is logged. */
SHEETS.extend = id => {
  const c = COHORT_BY_ID[id]; if(!c) return {title:'Extend', body:'', ok:''};
  return {title:`Extend or reschedule ${c.name}`, ok:'Continue', act:'askextend:' + c.id,
    body:`${fieldHtml({k:'weeks', l:'Length', t:'select', opts:[['12', '12 weeks — the 90-day loop'], ['13', '13 weeks — extended by one (open ruling)']]}, String(c.weeks || 12))}
      ${fieldHtml({k:'start', l:'Cycle start', t:'date'}, c.start)}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1})}
      <p class="t-desc">A changed start moves every session; a 13th week is the extension the journey leaves open (SA-12 A5). Members are told from their portal.</p>`};
};
ACTIONS.askextend = key => { const c = COHORT_BY_ID[key.split(':')[1]]; const v = readForm(); if(!c) return; if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  S._pending = v; askConfirm({mk:'warning', title:`Change ${c.name}’s schedule?`, body:`${c.name} runs ${v.weeks} weeks from ${v.start}. Logged at high severity.`, ok:'Apply', act:'doextend:' + c.id}); };
ACTIONS.doextend = key => { const c = COHORT_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null; if(!c) return;
  const from = `${c.weeks || 12} weeks from ${c.start}`; c.weeks = Number(v.weeks) || 12; if(v.start) c.start = v.start;
  audit(c.weeks === 13 ? 'Extended cohort to 13 weeks' : 'Rescheduled cohort', `${c.name} — ${v.reason}`, 'Cohort Management', 'high', {from, to:`${c.weeks} weeks from ${c.start}`}); toast(`${c.name} rescheduled`); };
/* SA-12 A3 — merge an under-filled cohort into another, or dissolve it. */
SHEETS.mergeco = id => {
  const c = COHORT_BY_ID[id]; if(!c) return {title:'Merge', body:'', ok:''};
  const targets = COHORTS.filter(x => x.id !== c.id && x.status === 'active' && x.track === c.track && x.size + c.size <= 10);
  return {title:`Merge ${c.name} into another cohort`, ok: targets.length ? 'Continue' : '', act:'askmergeco:' + c.id,
    body: targets.length ? `${fieldHtml({k:'into', l:'Into', t:'select', opts: targets.map(x => [x.id, `${x.name} · ${x.size}/10 · week ${x.week}`])})}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'e.g. Under-filled at week 1'})}
      <p class="t-desc">Every member moves across; ${esc(c.name)} is archived. Only a same-track cohort with room is offered.</p>` : note('warn', 'No cohort can take them', `No active ${esc(c.track)} cohort has room for ${c.size} more. Dissolve instead, or move members one at a time.`)};
};
ACTIONS.askmergeco = key => { const c = COHORT_BY_ID[key.split(':')[1]]; const v = readForm(); const t = COHORT_BY_ID[v.into]; if(!c || !t){ toast('Pick a cohort', 'warn'); return 'keep'; } if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  S._pending = v; askConfirm({mk:'warning', title:`Merge ${c.name} into ${t.name}?`, body:`${c.size} member${c.size === 1 ? '' : 's'} move to ${t.name}; ${c.name} is archived at week ${c.week}. This can’t be undone.`, ok:'Merge Cohorts', danger:true, act:'domergeco:' + c.id}); };
ACTIONS.domergeco = key => { const c = COHORT_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null; const t = COHORT_BY_ID[v.into]; if(!c || !t) return;
  CANDS.forEach(x => { if(x.cohort === c.name) x.cohort = t.name; }); c.status = 'archived'; syncCohortSizes();
  audit('Merged cohorts', `${c.name} → ${t.name} · ${v.reason}`, 'Cohort Management', 'high', {from:c.name, to:t.name}); toast(`${c.name} merged into ${t.name}`); go('cohorts/detail/' + t.id); };
ACTIONS.askdissolve = key => { const c = COHORT_BY_ID[key.split(':')[1]]; if(!c) return;
  askConfirm({mk:'warning', title:`Dissolve ${c.name}?`, body:`Its ${c.size} member${c.size === 1 ? '' : 's'} return to no cohort and keep their level; the cohort is archived at week ${c.week}. Logged at high severity. This can’t be undone.`, ok:'Dissolve', danger:true, act:'dodissolve:' + c.id}); };
ACTIONS.dodissolve = key => { const c = COHORT_BY_ID[key.split(':')[1]]; S.confirm = null; if(!c) return; const n = c.size;
  CANDS.forEach(x => { if(x.cohort === c.name) x.cohort = '—'; }); c.status = 'archived'; syncCohortSizes();
  audit('Dissolved cohort', `${c.name} — ${n} member${n === 1 ? '' : 's'} released`, 'Cohort Management', 'high', {from:'active', to:'archived'}); toast(`${c.name} dissolved`); };
/* SA-12 A4 — rebalance by moving one member; no E4 or E5 is guaranteed per cohort. */
SHEETS.moveco = id => {
  const c = COHORT_BY_ID[id]; if(!c) return {title:'Move', body:'', ok:''};
  const roster = CANDS.filter(x => x.cohort === c.name);
  const targets = COHORTS.filter(x => x.id !== c.id && x.status !== 'archived' && x.size < 10);
  return {title:`Move a member out of ${c.name}`, ok: roster.length && targets.length ? 'Continue' : '', act:'askmoveco:' + c.id,
    body: roster.length && targets.length ? `${fieldHtml({k:'cand', l:'Member', t:'select', opts: roster.map(x => [x.id, `${x.name} · ${x.level}`])})}
      ${fieldHtml({k:'into', l:'To', t:'select', opts: targets.map(x => [x.id, `${x.name} · ${x.track} ${x.level} · ${x.size}/10`])})}
      <p class="t-desc">Rebalancing (SA-12 A4). The journey does not guarantee an E4 or E5 in every cohort, so a move across levels is allowed and logged.</p>` : note('', 'Nothing to move', 'Either the roster is empty or no other cohort has room.')};
};
ACTIONS.askmoveco = key => { const c = COHORT_BY_ID[key.split(':')[1]]; const v = readForm(); const m = CAND_BY_ID[v.cand]; const t = COHORT_BY_ID[v.into]; if(!c || !m || !t){ toast('Pick a member and a cohort', 'warn'); return 'keep'; }
  S._pending = v; askConfirm({mk:'check', title:`Move ${m.name} to ${t.name}?`, body:`${m.name} leaves ${c.name} and takes a seat in ${t.name} from its next session.`, ok:'Move', act:'domoveco:' + c.id}); };
ACTIONS.domoveco = key => { const c = COHORT_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null; const m = CAND_BY_ID[v.cand]; const t = COHORT_BY_ID[v.into]; if(!c || !m || !t) return;
  m.cohort = t.name; syncCohortSizes(); audit('Moved member between cohorts', `${m.name}: ${c.name} → ${t.name}`, 'Cohort Management', 'high', {from:c.name, to:t.name}); toast(`${m.name} moved to ${t.name}`); };
