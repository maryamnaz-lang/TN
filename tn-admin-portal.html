      ${fieldHtml({k:'scope', l:'Scope', t:'select', opts:[['read', 'Read-only — see what they see, change nothing'], ['write', 'Write-enabled — act in their name (open ruling; logged high)']]}, 'read')}

ACTIONS.askviewas2 = key => {

/* THE ROLE FILTER (DESIGN.md admin list rule). The tab strip is gone — the role
   is a `.fdd` dropdown in the toolbar beside Status, so both filters read the
   same way. `admin` is the internal-account bucket (Admin / Super Admin); the
   rest are a plain role membership. Deactivated is the Status filter's job, not a
   role, so it is not here. */
const ROLE_OPTS = [
  ['all', 'All'],
  ['candidate', 'Candidate'],
  ['agent', 'Talent Agent'],
  ['leader', 'Cohort Leader'],
  ['admin', 'Admin'],
  ['employer', 'Employer']
];
/* The role is a TAB STRIP again (Maryam, 13 Sep 2026: "take the role tabs as we
   had before ... remove the roles filter since we are adding the tabs now"), on
   the same role set as the old dropdown — with live counts in the tab. `admin` is
   the internal-account bucket; every other tab is a plain role membership. */
const roleCount = v => v === 'all' ? USERS.length : v === 'admin' ? USERS.filter(u => u.internal).length : USERS.filter(u => u.roles.includes(v)).length;
const ROLE_TABS = () => ROLE_OPTS.map(([v, l]) => [v, l, roleCount(v)]);
/* A cohort leader an admin added is a MODERATOR (§ moderator, 11 Sep 2026).
   `u.addedBy` is the id of the admin who added them, and the Cohort Leader filter
   adds an "Added by" column reading it: the signed-in Super Admin (ME) reads
   "You", any other admin by name — the "Added by" is the column header, so it is
   not repeated in every cell. Authored placeholder on the two leader accounts —
   the seed has no add-audit trail. */
const addedByLabel = u => { const by = u.addedBy && USER_BY_ID[u.addedBy]; return by ? (by.id === ME.id ? 'You' : esc(by.name)) : '—'; };
/* HOW MANY COHORTS A LEADER IS RUNNING (Maryam, 14 Sep 2026). Read off the
   account's own `cohorts` list — the `(leads)` entries, not `(member)`. A
   candidate who became a cohort leader is capped at ONE at a time, so u4 reads
   "1"; a MODERATOR (`u.addedBy` set) may run several, so u40 reads "2". The
   number is the column, and the "Added by" column beside it says which of the two
   a row is. */
const leadingCount = u => (u.cohorts || []).filter(c => /\(leads\)/i.test(c)).length;
const leadingCell = u => { const n = leadingCount(u); return n ? `${n} cohort${n === 1 ? '' : 's'}${!u.addedBy && n === 1 ? ' <span class="t-caption">(at cap)</span>' : ''}` : '—'; };
/* EPIC 3 — the external account's main role, its detail route, level and status
   cells. Cohort Leader is a capability layered on the account (a column, not a
   type). A row opens the module that owns the account — the rich candidate /
   agent detail — falling back to the generic user detail for an employer. */
const mainRole = u => ['candidate', 'agent', 'employer'].find(r => u.roles.includes(r)) || (u.roles[0] || '—');
const typeLabel = u => (ROLE_BY_K[mainRole(u)] || {}).name || '—';
const userDetailRoute = u => u.roles.includes('candidate') ? 'candidates/detail/' + u.id
  : u.roles.includes('agent') ? 'agents/detail/' + u.id
  : 'users/staffdetail/' + u.id;
const USER_STATUS_LABEL = {invited:'Invited', active:'Active', ok:'Active', inactive:'Deactivated'};
const userStatusTag = u => tag(u.status === 'ok' ? 'active' : u.status, USER_STATUS_LABEL[u.status] || cap(u.status));
const candLevel = u => { const c = CAND_BY_ID[u.id]; const lv = (c && c.level) || (u.level && u.level !== '—' ? u.level : ''); return lv || 'Not yet levelled'; };

function usersAll(){
  const rf = getFilter('role', 'all'), q = getFilter('q', ''), sf = getFilter('status', 'all');
  const active = u => u.status === 'active' || u.status === 'ok';
  /* EXTERNAL accounts only — internal staff live in the Staff directory
     (Epic 1). The doc keeps the two apart: "an account never appears in both".
     Role is a TAB STRIP (Maryam 13 Sep 2026, overriding the doc's Type dropdown),
     dropping the internal (Admin) bucket. */
  /* Employers are not part of the system for now (Maryam, 19 Sep 2026: "remove
     the Employers tab entirely, as employers are not currently part of our
     system") — no Employer tab and no employer rows on this screen. */
  const ext = USERS.filter(u => !u.internal && !u.roles.includes('employer'));
  const extTabs = ROLE_OPTS.filter(([v]) => v !== 'admin' && v !== 'employer')
    .map(([v, l]) => [v, l, v === 'all' ? ext.length : ext.filter(u => u.roles.includes(v)).length]);
  const rows = ext.filter(u => rf === 'all' ? true : u.roles.includes(rf))
    .filter(u => sf === 'all' ? true : sf === 'active' ? active(u) : sf === 'invited' ? u.status === 'invited' : (!active(u) && u.status !== 'invited'))
    .filter(u => hit(q, u.name, u.email, u.company));
  return `
  <section class="sec">
    ${searchHead('All users', 'Every candidate, agent and cohort leader on the platform. Internal staff are in the Staff directory. A row opens the full record.',
      `<button class="btn btn-g btn-sm noic" data-go="users/import">${I.download} Bulk Import</button>
       <button class="btn btn-p btn-sm noic" data-sheet="adduser">${I.add} Add User</button>`)}
    ${filterStrip('role', 'all', extTabs)}
    ${lstTools('Search by name or email',
      filterDd('status', 'all', [['all', 'All'], ['invited', 'Invited'], ['active', 'Active'], ['inactive', 'Deactivated']], 'Status'))}
    ${rows.length ? table(
      [{label:'User'}, {label:'Type'}, {label:'Cohort leader'}, {label:'Level'}, {label:'Status'}, {label:'Joined'}, {label:'Last active'}, ACT_COL],
      rows.map(u => ({id:u.id, go:userDetailRoute(u), sv:[u.name], cells:[
        personCell(u.name, u.email),
        esc(typeLabel(u)),
        u.roles.includes('leader') ? '<span class="tag sm">Cohort leader</span>' : '<span class="t-caption">—</span>',
        u.roles.includes('candidate') ? esc(candLevel(u)) : '<span class="t-caption">—</span>',
        userStatusTag(u),
        esc(u.joined),
        esc(u.last),
        rowActs([['view', 'View', `data-go="${userDetailRoute(u)}"`],
          ...(u.status === 'invited'
            ? [['renew', 'Resend invite', `data-act="staffresend:${u.id}"`], ['close', 'Cancel invite', `data-act="staffcancelinvite:${u.id}"`]]
            : [active(u) ? ['deactivate', 'Deactivate', `data-sheet="deactext:${u.id}"`] : ['play', 'Reactivate', `data-sheet="reactext:${u.id}"`]]),
          ...(u.roles.some(isFullAccess) ? [] : [['view', 'View as', `data-act="askviewas:${u.id}"`]]),
          ['group', 'Merge into another account', `data-sheet="merge:${u.id}"`],
          ['delete', 'Delete', `data-sheet="delext:${u.id}"`]])
      ]})), {bulk: usersBulk})
      : emptyState('users', 'No accounts match', q ? `Nothing matches “${q}” in this filter.` : 'Nothing in this filter yet.')}
  </section>`;
}

/* ======================================================================
   EPIC 1 — SUPER ADMIN ACCESS & PROVISIONING (the staff lifecycle)

   The doc's "Staff User Management" is the internal-account directory, kept
   apart from the external Users directory (Epic 3): "The Staff directory holds
   internal accounts. The Users directory holds external ones." It is a new
   sub-page (`users/staff`) built on the same table / dropdown / sheet / confirm
   components every list uses. Every write logs an audit line; the four
   highest-severity actions (fee change, refund approval, account deletion, role
   deletion — story 1.6) pass a step-up code. OTP delivery, email send and real
   password storage are out of a prototype's scope (handoff ruling #3): the
   screens and the flow are built, not the send.
   ====================================================================== */
const STAFF_STATUS_LABEL = {invited:'Invited', active:'Active', inactive:'Deactivated'};
const staffStatusTag = u => tag(u.status, STAFF_STATUS_LABEL[u.status] || cap(u.status));
/* an INFO block for a sheet foot — the same light panel `recSheet` draws. */
const sheetHelp = t => `<div class="sheet-help"><svg class="sheet-help-ic" viewBox="0 0 24 24" aria-hidden="true">${inner('info')}</svg><p class="t-desc">${t}</p></div>`;
/* the same light card WITH a strong title over its body (Maryam, 18 Sep 2026) —
   used where a block needs a heading, e.g. "What deactivating clears". */
const infoCard = (title, t) => `<div class="sheet-help"><svg class="sheet-help-ic" viewBox="0 0 24 24" aria-hidden="true">${inner('info')}</svg><div class="sheet-help-b"><b>${esc(title)}</b><p class="t-desc">${t}</p></div></div>`;
/* a READ-ONLY field — §12 draws `[readonly]` + `.pfe-ro` with a dashed underline
   (the lock), with a note saying where the value is changed instead (1.8). */
const roField = (label, val, why) => `<label class="f"><span class="lbl">${esc(label)}</span>
  <input class="inp pfe-ro" value="${esc(val || '')}" readonly>${why ? `<p class="t-desc">${esc(why)}</p>` : ''}</label>`;
/* an invite's days left — 7 days from `invitedOn` (1.7). */
function inviteDaysLeft(u){
  if(!u.invitedOn) return null;
  const [mm, dd, yy] = u.invitedOn.split('-').map(Number);
  const exp = new Date(yy, mm - 1, dd).getTime() + 7 * 864e5;
  return Math.ceil((exp - Date.now()) / 864e5);
}
const inviteBadge = u => { const d = inviteDaysLeft(u); return d == null ? '' : d > 0 ? ` <span class="t-caption">${d} day${d === 1 ? '' : 's'} left</span>` : ` <span class="t-caption">expired</span>`; };
/* GUARDS (1.3 / 1.7 / 1.9 / 1.11). `staffProtect` blocks the original Super
   Admin and the actor's own account — neither may be role-changed, deactivated
   or deleted. `lastSAGuard` blocks removing access from the only Super Admin
   left. Both return a reason string or null. */
function staffProtect(u){
  if(u.orig) return 'The original Super Admin account is protected';
  if(u.id === ME.id) return 'You can’t act on your own account here — use My Profile';
  return null;
}
const lastSAGuard = u => isSA(u) && activeSAs().length <= 1 ? 'This is the only Super Admin account' : null;

/* the row's action menu, by status and guard (1.7). View is always there;
   Invited swaps Edit/Deactivate for Resend / Cancel invite; Delete rides at any
   status unless a guard blocks it. */
function staffRowActs(u){
  const acts = [['view', 'View', `data-go="users/staffdetail/${u.id}"`]];
  const prot = staffProtect(u);
  if(u.status === 'invited'){
    acts.push(['renew', 'Resend invite', `data-act="staffresend:${u.id}"`]);
    acts.push(['eye', 'Preview activation', `data-act="staffpreviewactivate:${u.id}"`]);
    acts.push(['close', 'Cancel invite', `data-act="staffcancelinvite:${u.id}"`]);
  } else {
    acts.push(['edit', 'Edit', `data-sheet="editstaff:${u.id}"`]);
    if(!prot) acts.push(['group', 'Change role', `data-sheet="changerole:${u.id}"`]);
    if(u.status === 'active'){
      if(!prot && !lastSAGuard(u)) acts.push(['deactivate', 'Deactivate', `data-sheet="deactivate:${u.id}"`]);
    } else {
      acts.push(['play', 'Reactivate', `data-sheet="reactivate:${u.id}"`]);
    }
  }
  if(!prot && !lastSAGuard(u)) acts.push(['delete', 'Delete', `data-sheet="delstaff:${u.id}"`]);
  return rowActs(acts);
}

PAGESUM['users/staff'] = () => {
  const staff = USERS.filter(u => u.internal);
  const inv = staff.filter(u => u.status === 'invited').length;
  const deact = staff.filter(u => u.status === 'inactive').length;
  return `<b>${staff.length} internal accounts</b> across ${STAFF_ROLE_KEYS.length} roles. ${inv} ${inv === 1 ? 'invite is' : 'invites are'} outstanding and ${deact} ${deact === 1 ? 'account is' : 'accounts are'} deactivated. Staff sign in with a password and a one-time code, never a shared credential.`;
};

function usersStaff(){
  const rf = getFilter('role', 'all'), sf = getFilter('status', 'all'), df = getFilter('dept', 'all'), q = getFilter('q', '');
  const rows = USERS.filter(u => u.internal)
    .filter(u => rf === 'all' || staffRole(u) === rf)
    .filter(u => sf === 'all' || u.status === sf)
    .filter(u => df === 'all' || u.dept === df)
    .filter(u => hit(q, u.name, u.email));
  const nameCell = u => `<div>${esc(u.name)}${u.orig ? ' <span class="tag sm brand">Original</span>' : ''}</div><div class="t-caption">${esc(u.email)}</div>`;
  return `
  <section class="sec">
    ${searchHead('Staff Members', 'Everyone internal with an account, at what level, and who has stopped using it. A row opens the full record.',
      `${exportBtn('Staff directory')}
       <button class="btn btn-p btn-sm noic" data-sheet="addstaff">${I.add} Add Staff Member</button>`)}
    ${lstTools('Search by name or email',
      filterDd('role', 'all', [['all', 'All roles'], ...staffRoleOpts(true)], 'Role')
      + filterDd('status', 'all', [['all', 'All'], ['invited', 'Invited'], ['active', 'Active'], ['inactive', 'Deactivated']], 'Status')
      + filterDd('dept', 'all', [['all', 'All'], ...DEPARTMENTS.map(d => [d, d])], 'Department'))}
    ${rows.length ? table(
      [{label:'Name'}, {label:'Role'}, {label:'Job title'}, {label:'Department'}, {label:'Status'}, {label:'Last signed in'}, {label:'Added'}, ACT_COL],
      rows.map(u => ({go:'users/staffdetail/' + u.id, sv:[u.name], cells:[
        nameCell(u),
        esc(staffRoleName(u)),
        esc(u.job || '—'),
        esc(u.dept || '—'),
        u.status === 'invited' ? `${staffStatusTag(u)}${inviteBadge(u)}` : staffStatusTag(u),
        esc(u.last || 'Never'),
        esc(u.joined),
        staffRowActs(u)
      ]})))
      : emptyState('users', 'No staff match', q ? `Nothing matches “${q}” in this filter.` : 'No staff in this filter yet.')}
  </section>`;
}

   role list only to an actor who holds it. Send Invite creates an Invited
   account and logs High; no credential is ever set here (the staff member sets
   their own at activation, 1.2). */
SHEETS.addstaff = () => {
  const actorSA = isSA(ME);
  return {
    title:'Add staff member',
    body: [
      fieldHtml({k:'first', l:'First name', t:'text', req:1, ph:'e.g. Dana'}),
      fieldHtml({k:'last', l:'Last name', t:'text', req:1, ph:'e.g. Whitfield'}),
      fieldHtml({k:'email', l:'Email address', t:'email', req:1, ph:'name@talentnext.io'}),

      fieldHtml({k:'job', l:'Job title', t:'text', req:1, ph:'e.g. Level Reviewer'}),

      fieldHtml({k:'role', l:'Role', t:'select', req:1, opts:[['', 'Select a role'], ...staffRoleOpts(actorSA)]})
    ].join('') + sheetHelp(`An invite email goes to the address; the staff member sets their own password and verifies by a one-time code. ${actorSA ? 'Super Admin can be assigned because you hold it.' : 'Only a Super Admin can assign the Super Admin role.'}`),

ACTIONS.sendinvite = () => {
  const v = readForm();
  if(!v.first || !v.last){ toast('Enter a first and last name', 'warn'); return 'keep'; }
  const email = (v.email || '').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Enter a valid email address', 'warn'); return 'keep'; }
  if(USERS.some(u => u.email.toLowerCase() === email.toLowerCase())){ toast('This email address is already in use on the platform', 'warn'); return 'keep'; }
  if(!v.phone){ toast('Enter a phone number', 'warn'); return 'keep'; }
  if(!v.job){ toast('Enter a job title', 'warn'); return 'keep'; }
  if(!v.dept){ toast('Select a department', 'warn'); return 'keep'; }
  if(!v.role){ toast('Select a role', 'warn'); return 'keep'; }
  if(v.role === 'admin' && !isSA(ME)){ toast('Only a Super Admin can assign the Super Admin role', 'warn'); return 'keep'; }
  const name = `${v.first} ${v.last}`.trim();
  const u = {id:newId('u', USERS), name, email, roles:[v.role], level:'—', status:'invited', joined:today(), origin:'internal', last:'Never', internal:true, job:v.job, dept:v.dept, phone:v.phone, invitedBy:ME.id, invitedOn:today()};
  USERS.push(u); USER_BY_ID[u.id] = u;
  audit('Invited staff member', `${name} · ${staffRoleName(u)}`, 'Users & Roles', 'high');
  toast(`Invite sent to ${email}`);
  S.sheet = null;
};

/* ADD A USER — Maryam, 16 Sep 2026. Role FIRST, as a SINGLE-CHOICE radio (one
   role at a time), replacing the old role-stack checkboxes on the ADD flow only;
   editing an existing account keeps KINDS.user's multi-role checkboxes, because a
   person really can hold several. When Cohort Leader is picked, an "or" divider
   reveals a picker to promote an EXISTING candidate instead of inviting a new
   one. The reveal is pure CSS (`.adduser-form:has(input[value="leader"]:checked)`),
   so a radio change fires no render() and the half-typed name/email survive. */
SHEETS.adduser = () => {
  const roleOpts = ROLES.filter(r => r.kind === 'external');
  const leaderCands = CANDS.filter(c => !((USER_BY_ID[c.id] || {}).roles || []).includes('leader'));
  const candOpts = [['', 'Select a candidate'], ...leaderCands.map(c => [c.id, c.name])];
  return {
    title:'Add a user',
    body:
      `<div class="adduser-form">
        <div class="f"><span class="lbl">Role <span class="req-star" aria-hidden="true">*</span></span>
          <div class="adduser-roles mt4" role="radiogroup" aria-label="Role">
            ${roleOpts.map(r => `<label class="rdo"><input type="radio" name="adduser-role" data-f="role" value="${esc(r.k)}"><span class="rdo-dot"></span><span class="rdo-txt">${esc(r.name)}</span></label>`).join('')}
          </div>
        </div>
        ${fieldHtml({k:'name', l:'Full name', t:'text', ph:'First and last name'})}
        ${fieldHtml({k:'email', l:'Email address', t:'email', ph:'name@company.com'})}
        ${''/* Origin field and the info block are hidden (Maryam, 16 Sep 2026);
              new accounts default to 'individual' origin in submitadduser. */}
        <div class="adduser-leaderpick">
          <div class="adduser-or"><span>Choose an existing candidate</span></div>
          ${formDd({k:'leadercand', l:'', t:'select', opts: candOpts}, '')}
        </div>
      </div>`,
    ok:'Send Invite',
    act:'submitadduser'
  };
};
ACTIONS.submitadduser = () => {
  const v = readForm();
  if(!v.role){ toast('Choose a role', 'warn'); return 'keep'; }
  /* THE "OR" PATH — promote an existing candidate to cohort leader. */
  if(v.role === 'leader' && v.leadercand){
    const u = USER_BY_ID[v.leadercand]; if(!u){ toast('Pick a candidate to promote', 'warn'); return 'keep'; }
    if(!u.roles.includes('leader')) u.roles.push('leader');
    u.volunteer = true;
    audit('Made candidate a cohort leader', u.name, 'Users & Roles', 'high');
    toast(`${u.name} is now a cohort leader`);
    S.sheet = null; return;
  }
  /* THE INVITE PATH — a new single-role account. */
  const email = (v.email || '').trim();
  if(!v.name){ toast('Full name is required', 'warn'); return 'keep'; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Enter a valid email address', 'warn'); return 'keep'; }
  if(USERS.some(u => u.email.toLowerCase() === email.toLowerCase())){ toast('This email address is already in use on the platform', 'warn'); return 'keep'; }
  const rec = KINDS.user.create({name:v.name, email, roles:[v.role], origin:v.origin || 'individual'});
  audit('Invited user', `${rec.name} · ${(ROLES.find(r => r.k === v.role) || {}).name || v.role}`, 'Users & Roles', 'high');
  toast(`Invite sent to ${email}`);
  S.sheet = null;
};
/* Invited row actions (1.1 / 1.7). */

ACTIONS.staffcancelinvite = key => {
  const u = USER_BY_ID[key.split(':')[1]]; if(!u) return;
  askConfirm({mk:'warning', danger:true, title:`Cancel ${u.name}’s invite?`, body:'The outstanding link stops working and the account is removed from the directory.', ok:'Cancel Invite', act:'docancelinvite:' + u.id});

/* 1.8 EDIT A STAFF MEMBER — first/last/job/department editable; email and phone
   read-only with a note on where each is changed; role and status are their own
   flows. Save logs Medium with each field before and after. */
SHEETS.editstaff = id => {
  const u = USER_BY_ID[id]; if(!u) return {title:'Edit', body:'', ok:''};
  const parts = String(u.name).trim().split(/\s+/); const first = parts.shift() || ''; const last = parts.join(' ');
  return {
    title:`Edit ${u.name}`,
    body: [
      fieldHtml({k:'first', l:'First name', t:'text', req:1}, first),
      fieldHtml({k:'last', l:'Last name', t:'text', req:1}, last),
      fieldHtml({k:'job', l:'Job title', t:'text', req:1}, u.job),
      fieldHtml({k:'dept', l:'Department', t:'select', req:1, opts:DEPARTMENTS.map(d => [d, d])}, u.dept),
      roField('Email address', u.email, 'The sign-in identifier. To change it, delete the account and send a new invite.'),
      roField('Phone number', u.phone, 'A second factor. Only the account holder changes it, in Login & Security.')
    ].join(''),
    ok:'Save Changes',

ACTIONS.savestaff = key => {
  const u = USER_BY_ID[key.split(':')[1]]; if(!u) return;
  const v = readForm();
  if(!v.first || !v.last){ toast('Enter a first and last name', 'warn'); return 'keep'; }

  u.name = `${v.first} ${v.last}`.trim(); u.job = v.job; u.dept = v.dept;
  audit('Edited staff details', u.name, 'Users & Roles', 'med', {from, to:`${u.name} · ${u.job} · ${u.dept}`});

/* 1.3 ASSIGN / CHANGE STAFF ROLE — read-only identity, a New Role dropdown
   (current pre-selected), a confirmation naming the move, High audit with
   before/after. Refuses the same role, refuses removing the last Super Admin. */
SHEETS.changerole = id => {
  const u = USER_BY_ID[id]; if(!u) return {title:'Change role', body:'', ok:''};
  return {
    title:`Change ${u.name}’s role`,
    body: roField('Staff member', `${u.name} · ${u.email}`)
      + roField('Current role', staffRoleName(u))
      + fieldHtml({k:'role', l:'New role', t:'select', req:1, opts:staffRoleOpts(isSA(ME))}, staffRole(u))
      + sheetHelp('The role replaces the current one, never adds to it. The staff member is notified and their access changes immediately.'),
    ok:'Confirm',
    act:'submitchangerole:' + id
  };
};
ACTIONS.submitchangerole = key => {
  const u = USER_BY_ID[key.split(':')[1]]; if(!u) return;
  const v = readForm(); const nr = v.role;
  if(nr === staffRole(u)){ toast('Select a different role to continue', 'warn'); return 'keep'; }
  if(nr !== 'admin' && lastSAGuard(u)){ toast('This is the only Super Admin account. Assign Super Admin to another staff member first.', 'warn'); return 'keep'; }
  if(nr === 'admin' && !isSA(ME)){ toast('Only a Super Admin can assign the Super Admin role', 'warn'); return 'keep'; }
  S._pending = {role:nr};
  askConfirm({mk:'warning', title:`Change ${u.name} from ${staffRoleName(u)} to ${(ROLE_BY_K[nr] || {}).name}?`,
    body:'They will be notified and their access changes immediately.', ok:'Change Role', act:'dochangerole:' + u.id});
};
ACTIONS.dochangerole = key => {
  const u = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null;
  if(!u || !v.role) return;
  const from = staffRoleName(u);
  u.roles = [v.role];
  audit('Changed staff role', u.name, 'Users & Roles', 'high', {from, to:(ROLE_BY_K[v.role] || {}).name});
  toast(`${u.name} is now ${(ROLE_BY_K[v.role] || {}).name}. They’ve been notified.`);
};

/* 1.9 DEACTIVATE — a mandatory internal reason, a confirmation, High audit. The
   account keeps its role and history; only access is removed. */
SHEETS.deactivate = id => {
  const u = USER_BY_ID[id]; if(!u) return {title:'Deactivate', body:'', ok:''};
  return {
    title:`Deactivate ${u.name}`,
    body: fieldHtml({k:'note', l:'Reason', t:'textarea', req:1, ph:'Why this account is being switched off. Internal only — the staff member never sees it.'})
      + sheetHelp('They are signed out immediately and can’t sign in again. The record, role and history stay intact so the account can be reactivated later.'),
    ok:'Deactivate', danger:true,
    act:'submitdeactivate:' + id
  };
};
ACTIONS.submitdeactivate = key => {
  const u = USER_BY_ID[key.split(':')[1]]; if(!u) return;
  const v = readForm(); if(!v.note){ toast('Enter a reason', 'warn'); return 'keep'; }
  const g = staffProtect(u) || lastSAGuard(u); if(g){ toast(g, 'warn'); return 'keep'; }
  S._pending = {note:v.note};
  askConfirm({mk:'warning', danger:true, title:`Deactivate ${u.name}?`, body:'They will be signed out immediately and will not be able to sign in again.', ok:'Deactivate', act:'dodeactivate:' + u.id});
};
ACTIONS.dodeactivate = key => {
  const u = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null;
  if(!u) return;
  const g = staffProtect(u) || lastSAGuard(u); if(g){ toast(g, 'warn'); return; }
  u.status = 'inactive'; u.deactivatedOn = isoToday(); u.last = 'Signed out';
  audit('Deactivated staff account', `${u.name} · ${v.note || ''}`, 'Users & Roles', 'high');
  toast(`${u.name} deactivated`);
};

/* 1.10 REACTIVATE — a mandatory reason; the account returns with the role it
   held, or a role is chosen here where that role has since been deleted. */
SHEETS.reactivate = id => {
  const u = USER_BY_ID[id]; if(!u) return {title:'Reactivate', body:'', ok:''};
  const roleGone = !ROLE_BY_K[staffRole(u)];
  return {
    title:`Reactivate ${u.name}`,
    body: fieldHtml({k:'note', l:'Reason', t:'textarea', req:1, ph:'Why access is being restored. Internal only.'})
      + (roleGone ? fieldHtml({k:'role', l:'Role', t:'select', req:1, opts:[['', 'Select a role'], ...staffRoleOpts(isSA(ME))]}) : roField('Role restored', staffRoleName(u)))
      + sheetHelp('Their password and one-time-code method are unchanged, so they sign in exactly as before.'),
    ok:'Reactivate',
    act:'submitreactivate:' + id
  };
};
ACTIONS.submitreactivate = key => {
  const u = USER_BY_ID[key.split(':')[1]]; if(!u) return;
  const v = readForm(); if(!v.note){ toast('Enter a reason', 'warn'); return 'keep'; }
  const roleGone = !ROLE_BY_K[staffRole(u)];
  if(roleGone && !v.role){ toast('Choose a role for this account', 'warn'); return 'keep'; }
  const role = roleGone ? v.role : staffRole(u);
  S._pending = {note:v.note, role};
  askConfirm({mk:'check', title:`Reactivate ${u.name} as ${(ROLE_BY_K[role] || {}).name}?`, body:'They will be able to sign in again.', ok:'Reactivate', act:'doreactivate:' + u.id});
};
ACTIONS.doreactivate = key => {
  const u = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null;
  if(!u) return;
  u.status = 'active'; if(v.role) u.roles = [v.role]; delete u.deactivatedOn; u.last = 'Just now';
  audit('Reactivated staff account', `${u.name} · ${(ROLE_BY_K[v.role] || {}).name} · ${v.note || ''}`, 'Users & Roles', 'high');
  toast(`${u.name} reactivated`);
};

/* 1.11 DELETE — a mandatory reason, an irreversibility confirmation, then the
   step-up password (story 1.6). Personal data is erased; the audit trail is kept
   (pseudonymised, in a real build). Prototype: the account is removed and the

      + sheetHelp('This erases their personal data and cannot be undone. What they did on the platform is kept, pseudonymised, so the audit trail survives.'),
    ok:'Delete', danger:true,
    act:'submitdelstaff:' + id
  };
};
ACTIONS.submitdelstaff = key => {
  const u = USER_BY_ID[key.split(':')[1]]; if(!u) return;
  const v = readForm(); if(!v.note){ toast('Enter a reason', 'warn'); return 'keep'; }
  const g = staffProtect(u) || lastSAGuard(u); if(g){ toast(g, 'warn'); return 'keep'; }
  S._pending = {note:v.note};
  askConfirm({mk:'warning', danger:true, stepup:true, title:`Delete ${u.name} permanently?`, body:'This erases their personal data and cannot be undone.', ok:'Delete', act:'dodelstaff:' + u.id});
};
ACTIONS.dodelstaff = key => {
  const u = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null;
  if(!u) return;
  const g = staffProtect(u) || lastSAGuard(u); if(g){ toast(g, 'warn'); return; }
  const nm = u.name;
  USERS.splice(USERS.indexOf(u), 1); delete USER_BY_ID[u.id];
  audit('Deleted staff account', `${nm} · ${v.note || ''}`, 'Users & Roles', 'high');
  toast(`${nm} deleted. Personal data is being erased; the audit trail is kept.`);

/* 3.2 INVITE A TALENT AGENT — the only external type that can be invited
   (candidates arrive through the quiz, employers have no route). Three fields;
   the agent supplies fee, bio, specialities and payout destination in their own
   onboarding. Creates an Invited agent, High audit, invite does not expire. */
SHEETS.inviteagent = () => ({
  title:'Invite talent agent',
  body: [
    fieldHtml({k:'first', l:'First name', t:'text', req:1, ph:'e.g. Dana'}),
    fieldHtml({k:'last', l:'Last name', t:'text', req:1, ph:'e.g. Whitfield'}),
    fieldHtml({k:'email', l:'Email address', t:'email', req:1, ph:'name@agency.com'})
  ].join('') + sheetHelp('Talent Agent is the only external account you invite here — candidates arrive through the quiz. The agent sets their own fee, bio and payout destination during onboarding, and the invite does not expire.'),
  ok:'Send Invite',
  act:'doinviteagent'
});
ACTIONS.doinviteagent = () => {
  const v = readForm();
  if(!v.first || !v.last){ toast('Enter a first and last name', 'warn'); return 'keep'; }
  const email = (v.email || '').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Enter a valid email address', 'warn'); return 'keep'; }
  if(USERS.some(u => u.email.toLowerCase() === email.toLowerCase())){ toast('This email address is already in use on the platform', 'warn'); return 'keep'; }

};

/* 3.3 ASSIGN COHORT LEADER — a capability layered on an account, not a main role.
   Eligible: a candidate at level E5 or above, or any internal staff account (the
   fallback before candidates reach E5). Marking makes the account placeable in
   the Cohorts module; the main role is untouched. Removal is refused while the
   leader holds a live cohort (reassignment happens in the Cohorts flow). */
const levelCode = lv => String(lv || '').split(/[ ·]/)[0];
const leaderEligible = u => !!u && (u.internal || (u.roles.includes('candidate') && LVL_CODES.indexOf(levelCode((CAND_BY_ID[u.id] || u).level)) >= LVL_CODES.indexOf('E5')));
ACTIONS.askmarkleader = key => {
  const u = USER_BY_ID[key.split(':')[1]]; if(!u) return;
  if(u.roles.includes('leader')){ toast(`${u.name} is already a cohort leader`, 'warn'); return; }
  if(!leaderEligible(u)){ toast('Cohort leaders must be at level E5 or above', 'warn'); return; }
  askConfirm({mk:'check', title:`Mark ${u.name} as a cohort leader?`, body:'They can then be placed on a cohort. This does not change their main role.', ok:'Mark As Cohort Leader', act:'domarkleader:' + u.id});
};
ACTIONS.domarkleader = key => {
  const u = USER_BY_ID[key.split(':')[1]]; S.confirm = null; if(!u) return;
  if(!u.roles.includes('leader')) u.roles = [...u.roles, 'leader'];
  audit('Marked as cohort leader', u.name, 'Users & Roles', 'notice');

/* ══ BULK IMPORT USERS — a three-step wizard (Maryam, 11 Sep 2026, off the
   reference flow: Upload → Review → Done), built in OUR UI. Every row is parsed
   and VALIDATED before anything is created; only Ready rows become accounts.
   State is `S.imp` (never the DOM — trap 9). The role cell is a native
   `<select class="inp">`, the admin's own form-field select (see `fieldHtml`). */
const IMP_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const IMP_ROLE_KEYS = ROLES.map(r => r.k);
/* sample rows the "Load sample data" button runs through the validator — four
   clean, four each tripping a different rule (invalid email · missing role ·
   duplicate of an existing account · unknown role key). Authored (§74). */
const IMP_SAMPLE = [
  ['Ava Stone', 'ava@brightpath.io', 'candidate'], ['Max Lee', 'max@northgate.health', 'agent'],
  ['Joan Roy', 'joan@signal.co', 'employer'], ['Dev Kapoor', 'dev@talentnext.io', 'reviewer'],
  ['Sam Poe', 'not-an-email', 'candidate'], ['No Role Here', 'norole@acme.io', ''],
  ['Dupe Account', 'dana@talentnext.io', 'agent'], ['Zoe Fields', 'zoe@acme.io', 'wizard']
];
function impParse(text){
  return (text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean)
    .filter(l => !/^\s*name\s*,\s*email\s*,\s*role/i.test(l))
    .map(l => { const c = l.split(','); return {name:(c[0] || '').trim(), email:(c[1] || '').trim(), role:(c[2] || '').trim()}; });
}
function impValidate(rows){
  const seen = {}, existing = new Set(USERS.map(u => u.email.toLowerCase()));
  return rows.map(r => {
    const name = (r.name || '').trim(), email = (r.email || '').trim(), role = (r.role || '').trim().toLowerCase();
    let st;
    if(!name) st = {k:'err', t:'Missing name'};
    else if(!IMP_EMAIL.test(email)) st = {k:'err', t:'Invalid email'};
    else if(!role) st = {k:'warn', t:'Missing role'};
    else if(!IMP_ROLE_KEYS.includes(role)) st = {k:'err', t:`Unknown role "${(r.role || '').trim()}"`};
    else if(existing.has(email.toLowerCase()) || seen[email.toLowerCase()]) st = {k:'err', t:'Duplicate email'};
    else st = {k:'ok', t:'Ready'};
    if(email) seen[email.toLowerCase()] = true;
    return {name:r.name, email:r.email, role:r.role, st};
  });
}

ACTIONS.imptemplate = () => {

  const rows = (sf === 'decided' ? decided : open)
    .filter(a => sf === 'all' || sf === 'decided' ? true : sf === 'flagged' ? a.safeguarding === 'flagged' : a.safeguarding !== 'flagged')

  return `
  <section class="sec">

      ['decided', 'Decided', decided.length]
    ])}

    ${rows.length ? table(
      [{label:'Applicant'}, {label:'Experience'}, {label:'Fee', num:true}, {label:'Safeguarding'}, {label:'Stage'}, {label:'Applied'}, ACT_COL],

          : tag(a.stage === 'interview' ? 'scheduled' : 'review', a.stage === 'interview' ? 'Vetting call' : 'In checks'),

        a.status === 'approved' || a.status === 'rejected' ? ''
          : rowActs([['check', 'Approve', `data-act="askhire:${a.id}"`], ['close', 'Reject', `data-act="askreject:${a.id}"`]])

}

   THE CANDIDATE-PORTAL COMPONENTS, VIEWED BY AN ADMIN (Maryam, 14 Sep 2026).

   §80 `.qzp*`, §61 the rose) — all shipped in the design system, so the admin

/* THE LADDER, CORRECT ACROSS ALL THREE TRACKS. The DS `dsLadder` reads `RUNG`,
   which only maps the five Explorer codes (the candidate portal never shows a
   Builder), so a Builder or Trailblazer would land on rung 2. Here a candidate
   can be anywhere on the fifteen, so the rung is `LVL_CODES.indexOf` — the
   position in the one true list. `codes` prints the code in every block, the
   black hero's own state (the level is printed at 34px above it). */
function admLadder(level){
  const r = (LVL_CODES.indexOf(level) + 1) || 2;
  return `<div class="ladder">${LVL_CODES.map((code, i) =>
    `<i class="${i < r - 1 ? 'done' : (i === r - 1 ? 'on' : '')}"><b>${code}</b></i>`).join('')}</div>
  <div class="ladder-lab"><span>Explorer</span><span>Builder</span><span>Trailblazer</span></div>`;
}

/* THE LEVEL BLACK CARD — `lvlWing`'s recipe (§75 dark-card, §97 `.prog`), the
   admin's copy. Level name and track are the record's; the signature line names
   the assessing agent rather than the candidate portal's own reviewer. */
function admLevelCard(c){
  const rung = (LVL_CODES.indexOf(c.level) + 1) || 2;
  const sig = c.agent === '—' ? 'Level not yet assessed' : 'Assessed by ' + esc(c.agent);
  return `<div class="sec dark-card">
    <div class="stp stp-open stp-titled wing-lvl">
      <div class="stp-top"><h2 class="u-h3">Where this candidate is on the ladder</h2></div>
      <div class="prog">
        <div class="prog-top">
          <div><div class="prog-pct">${esc(c.bucket)} &ndash; ${esc(c.level)}</div>
            <div class="prog-l">${sig}</div></div>
          <div class="prog-day"><div class="prog-dn">${rung}<small> of 15</small></div>
            <div class="prog-l">on the ladder</div></div>
        </div>
        ${admLadder(c.level)}
      </div>
    </div>
  </div>`;
}

/* INTERVIEW SCENES — the candidate portal's `.scv*` carousel (§111.9), whole:
   the still IS the agent's PORTRAIT with the play mark over it, and the
   attribution wears the same portrait disc — exactly `pfScenes`. The design
   system ships five embedded faces (`AV.priya/owen/lena/samuel/hana`), so the
   admin does not fall back to a grey box; `agentFace` maps each agent to one
   deterministically (a first-name match where there is one, otherwise a stable
   hash). The titles/durations are authored placeholder (flagged, §74 — the seed
   has no per-interview scene telemetry); every card is attributed to the agent
   whose interview it came from, so the row IS "all scenes from all interviews". */
const ADM_SCENE_SET = [
  ['The reorganization call', '02:14'], ['Handing over the vendor review', '11:02'],
  ['The Friday rhythm', '19:37'],       ['Managing up', '24:50'],
  ['Conflict with a peer', '31:15'],    ['Closing reflection', '41:03']
];
/* A REAL PROFILE PHOTOGRAPH PER PERSON (Maryam, 20 Sep 2026: "get rid of avatars
   and use real images — the other images we are using as candidate or talent
   agent profile images overall on the platform"). This REVERSES the same-day
   choice of `hifi/build/avatars/` (av1 + b1..b4 + g1..g5) — those are the
   Duolingo-style ILLUSTRATED placeholder discs the candidate portal uses only for
   the ANONYMISED same-level Ranking, never a real profile (build.py's own note).
   The real photographs are the ones the marketplace + call surfaces show, embedded
   in the design system this portal links: `AV.priya/owen/lena/samuel/hana` (the
   five agent portraits) and `CALL_ART.faceW/faceM` (the two interview-call faces).
   A person whose first name IS one of the agents gets their own portrait; everyone
   else is assigned one of the seven deterministically by a name hash, so a face is
   stable per person and the tables read as real photos, not cartoons. */
const ADM_FACES = {priya:AV.priya, owen:AV.owen, lena:AV.lena, samuel:AV.samuel, hana:AV.hana, faceW:CALL_ART.faceW, faceM:CALL_ART.faceM};
const ADM_FACE_POOL = Object.values(ADM_FACES);
function agentFace(name){
  const n = String(name || '').trim();
  const first = n.toLowerCase().split(/\s+/)[0];
  if(ADM_FACES[first]) return ADM_FACES[first];
  let h = 0; for(const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return ADM_FACE_POOL[h % ADM_FACE_POOL.length];
}
/* ALIGNED (14 Sep 2026): the carousel MARKUP is now the shipped `dsScenes`
   builder — `sceneCardAdm` was a hand-copy of `.scv*` (its own note said "the
   candidate portal's carousel, whole"), which is precisely what drifts. The admin
   keeps its OWN data (`ADM_SCENE_SET` × the interviews' agents, authored
   placeholder) and hands each scene to the builder as a `{img, i, name, at,
   title}` record; the chevrons run through the shared `dsScvScroll`. The empty
   state stays the admin's own — `dsScenes` draws a row, not a "nothing yet". */
function admScenes(ivs){
  const withAgent = ivs.filter(b => b.agent && b.agent !== '—');
  const scenes = withAgent.flatMap(b => ADM_SCENE_SET.map(([t, at]) => ({
    img: agentFace(b.agent), i: initials(b.agent), name: b.agent, at, title: t
  })));
  return scenes.length
    ? dsScenes('Interview scenes', scenes)
    : `<section class="sec">
        ${aiHead('Interview scenes', 'Short clips kept from every interview on this candidate’s record.', '')}
        ${emptyState('video', 'No scenes yet', 'Scenes appear once this candidate has an interview on the record.')}
      </section>`;
}

/* THE QUIZ RESULTS — the candidate portal's `quizPeek` content (§80) laid out
   as a normal section rather than a 372px slide-over. The rose (§61) is ported
   verbatim; the lists and the ladder rows are the same, third-person. The five
   bands are authored placeholder (§74 — the seed has no per-candidate quiz),
   the same set the candidate portal ships. */
const ADM_SCORES = [['Decisiveness', 78], ['Delegation', 41], ['Directness', 66],
                    ['Coaching', 38], ['Composure', 84]];
const ADM_QZ_STR = ['Execution under pressure', 'Comfortable with ambiguity', 'Holds a line under challenge'];
const ADM_QZ_DEV = ['Delegates too late', 'Avoids conflict until it escalates', 'Coaches by telling'];
const qzBand = v => v >= 70 ? ['s', 'Strong'] : v >= 50 ? ['m', 'Mixed'] : ['w', 'Weak'];
const qzRung = (v, track) => {
  const T = ['Explorer', 'Builder', 'Trailblazer'];
  const lo = Math.max(0, T.indexOf(track || 'Explorer')) * 5;
  const fifth = Math.min(5, Math.max(1, Math.ceil(v / 20)));
  return LVL_CODES[lo + fifth - 1];
};
function qzLede(first){
  const asc = ADM_SCORES.slice().sort((a, b) => a[1] - b[1]);
  const low = asc[0], high = asc[asc.length - 1];
  return `<b>${high[0]}</b> at ${high[1]} is ${esc(first)}’s strongest band, `
    + `${low[0].toLowerCase()} at ${low[1]} the weakest. An agent pushes hardest on the two lowest, `
    + `and both are holding ${esc(first)} a rung below the rest.`;
}
const qzList = (title, hue, items) => `<div class="qzp-g">
  <div class="qzp-t ${hue}">${title}</div>
  <ol class="qzp-l">${items.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
</div>`;
/* THE ROSE — `quizRose` from views.js, unchanged. Five wedges from a hub, each
   reaching as far as its score; the fill carries the verdict (solid / hatch /
   hairline), never a hue. Every token it reads (`--chart-ink`, `--layer-01/02`,
   `--border-subtle-01`) ships in the design system. */
function quizRose(dims, score, bare){
  const CX = 180, CY = 158, R0 = 36, R = 108, GAP = 1.4;
  const pol = (a, r) => [CX + r * Math.cos(a * Math.PI / 180), CY + r * Math.sin(a * Math.PI / 180)];
  const seg = (a0, a1, r) => {
    const [x0, y0] = pol(a0, R0), [x1, y1] = pol(a0, r), [x2, y2] = pol(a1, r), [x3, y3] = pol(a1, R0);
    return `M${x0.toFixed(1)} ${y0.toFixed(1)}L${x1.toFixed(1)} ${y1.toFixed(1)}`
      + `A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`
      + `L${x3.toFixed(1)} ${y3.toFixed(1)}`
      + `A${R0} ${R0} 0 0 0 ${x0.toFixed(1)} ${y0.toFixed(1)}Z`;
  };
  const step = 360 / dims.length;
  const fill = v => ({s: 'var(--chart-ink)', m: 'url(#qzHatch)', w: 'var(--layer-01)'})[qzBand(v)[0]];
  const rings = [25, 50, 75, 100].map(p =>
    `<circle cx="${CX}" cy="${CY}" r="${(R0 + (p / 100) * (R - R0)).toFixed(1)}" fill="none"
      stroke="var(--border-subtle-01)" stroke-width="1" stroke-dasharray="2 4"/>`).join('');
  const wedges = dims.map(([k, v], i) => {
    const a0 = -90 + i * step + GAP, a1 = -90 + (i + 1) * step - GAP;
    return `<path d="${seg(a0, a1, R0 + (v / 100) * (R - R0))}" fill="${fill(v)}"
      stroke="var(--chart-ink)" stroke-width="1.2"/>`;
  }).join('');
  const marks = dims.map(([k, v], i) => {
    const mid = -90 + i * step + step / 2;
    const [lx, ly] = pol(mid, R + 21);
    const anchor = Math.abs(lx - CX) < 14 ? 'middle' : (lx > CX ? 'start' : 'end');
    const [vx, vy] = pol(mid, R0 + (v / 100) * (R - R0) - 15);
    return `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anchor}" class="qz-lab">${k}</text>
      <text x="${vx.toFixed(1)}" y="${(vy + 4).toFixed(1)}" text-anchor="middle"
        class="qz-val${qzBand(v)[0] === 's' ? ' on' : ''}">${v}</text>`;
  }).join('');
  return `<div class="qz-rose">
    <svg viewBox="-32 0 424 326" class="qz-svg" role="img"
      aria-label="Quiz bands: ${dims.map(([k, v]) => k + ' ' + v).join(', ')}">
      <defs><pattern id="qzHatch" width="6" height="6" patternTransform="rotate(45)"
        patternUnits="userSpaceOnUse">
        <rect width="6" height="6" fill="var(--layer-01)"/>
        <line x1="0" y1="0" x2="0" y2="6" stroke="var(--chart-ink)" stroke-width="2"/></pattern></defs>
      ${rings}${wedges}
      <circle cx="${CX}" cy="${CY}" r="${R0}" fill="var(--layer-01)"
        stroke="var(--chart-ink)" stroke-width="1.2"/>
      <text x="${CX}" y="${CY - 2}" text-anchor="middle" class="qz-mid">${score}</text>
      <text x="${CX}" y="${CY + 14}" text-anchor="middle" class="qz-mids">of 100</text>
      ${marks}
    </svg>
    ${bare ? '' : `<div class="qz-key">
      ${dims.map(([k, v]) => { const [cls, word] = qzBand(v);
        return `<div class="kv"><span class="k"><i class="qz-sw ${cls}"></i>${k}</span>
          <span class="v">${v}<span class="tag qz-vd">${word}</span></span></div>`; }).join('')}
    </div>`}
  </div>`;
}
function admQuiz(c){
  const first = String(c.name).split(' ')[0];
  /* THE ROSE PIE CHART IS REMOVED (Maryam, 15 Sep 2026: "remove this quiz pie
     chart") — the lede and the two bands lists carry the read on their own. Just
     the text column now, with generous vertical gaps between its parts. The
     "Where this puts them on the ladder" rows stay removed. */
  return `<section class="sec">
    ${aiHead('Quiz results', 'How the levelling quiz scored this candidate across the five bands.')}
    <div class="adm-quiz">
      <div class="adm-quiz-txt">
        <p class="qzp-lede"><span class="qzp-mk" aria-hidden="true"></span>${qzLede(first)}</p>
        ${qzList('What they do well', 'ok', ADM_QZ_STR)}
        ${qzList('Where they lose ground', 'acc', ADM_QZ_DEV)}
      </div>
    </div>
  </section>`;
}

/* AUTHORED PROFILE FACTS (§74) — the admin seed carries no per-candidate
   profile telemetry, so the eight-fact band is authored: Maryam (u4) matches
   the candidate portal's own grid exactly, and every other candidate gets
   stable, varied placeholder values off a name-hash so the band always fills. */
const CAND_PROFILE = {
  u4: {points:1095, courses:0, role:'Operations Lead', industry:'Software', years:'5 years', aspiration:'Develop in my current role'}
};
const CAND_ROLES = ['Operations Lead', 'Product Manager', 'Team Lead', 'Analyst', 'Account Manager', 'Coordinator'];
const CAND_INDS  = ['Software', 'Healthcare', 'Finance', 'Retail', 'Logistics'];
const CAND_ASP   = ['Develop in my current role', 'Develop for another role', 'Develop for ownership'];
function candProfile(c){
  if(CAND_PROFILE[c.id]) return CAND_PROFILE[c.id];
  let h = 0; for(const ch of c.name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return {
    points: 200 + (h % 1600),
    courses: h % 3,
    role: CAND_ROLES[h % CAND_ROLES.length],
    industry: CAND_INDS[(h >> 3) % CAND_INDS.length],
    years: (1 + h % 12) + ' years',
    aspiration: CAND_ASP[(h >> 5) % CAND_ASP.length]
  };
}
/* THE FACT-BAND CELL — the candidate portal's `pfFact` (§105), whole. The
   `--mk` is inked to #111 by the design system (§63), so it is decorative. */
const admFact = (icon, mk, label, val) => `<div style="--mk:var(${mk})">
  <span class="l pf-l">${icon}${label}</span>

/* THE CANDIDATE'S COURSES — the platform courses they are taking and have taken,
   shown like the candidate portal's My Courses (Maryam, 15 Sep 2026): an
   accordion of course rows (cover + name + status) where a COMPLETED course opens
   to its certificate card (the badge from `CERT_ART` + course name, no header
   text and no Download/Share — Maryam, 15 Sep 2026) and the four-figure insight
   band, full width. Not-started courses are hidden. Authored placeholder (§74). */
const CAND_COURSE_LIST = [
  {name:'Foundations of Leadership', lvl:'e1', status:'Completed', on:'March 2026', chapters:'13 of 13', avg:'83%', time:'11h 40m', tasks:'12 of 13'},
  {name:'Communicating with Impact', lvl:'e2', status:'In progress',
   /* Per-chapter assessment %s for the assessed chapters, mirroring the candidate
      portal's Course Progress page (Maryam, 17 Sep 2026: "show the course details
      just like ... the course progress page ... the performance graph, the progress
      by chapter"). Authored placeholder (§74) — the seed carries no per-candidate
      chapter telemetry — matched to the candidate portal's own day-34 series so the
      admin's read and the candidate's read agree. `assessed` chapters are marked
      done; `growth` flags the growth-area chapters; `cohort` is the dashed rule. */
   series:[75,80,78,50,92], assessed:5, avg:75, cohort:79, growth:[3],
   insight:'Five chapters are assessed so far. Chapter 4, Delegation Without Drop-Off, is the lowest at 50%.'},
  {name:'Leading High-Performing Teams', lvl:'e3', status:'Not started'}
];
const courseArtAdm = lvl => (typeof COHORT_ART !== 'undefined' && (COHORT_ART[lvl] || COHORT_ART.e3)) || '';
/* THE CANDIDATE'S ACTIVE COURSE — the in-progress course (else the most recent
   completed), read off `CAND_COURSE_LIST` (the admin's authored per-candidate
   course read, §74). The Edit form's read-only Course field shows this (Maryam
   20 Sep 2026: "the candidate is taking 'Communicating with Impact' course, show
   this ... against the course but it should not be editable"). */
const candActiveCourse = () => { const l = CAND_COURSE_LIST.filter(c => c.status !== 'Not started'); return ((l.find(c => c.status === 'In progress') || l[0] || {}).name) || ''; };

/* THE COURSE-PROGRESS BODY — an IN-PROGRESS course opens to the candidate portal's
   Course Progress content (Maryam, 17 Sep 2026: "show the course details just like
   how we show on the course progress page on the candidate portal, the performance
   graph, the progress by chapter"). The DS this portal links already ships the
   `.perf-*` and `.ch-*` CSS the candidate portal draws with (`perfChart` /
   `chRow`), so this is that markup, READ-ONLY: no Restart/Resume action and no
   `.ch.open` state (the `Continue →` affordance is the candidate's, not the
   admin's — the admin is viewing, not taking the course), no navigation. The one
   green line, the red low point, the dashed cohort rule and the average-score ring
   are all the DS classes; nothing here paints. Data is on the course record
   (`series`/`assessed`/`avg`/`cohort`/`growth`/`insight`), authored §74. */
function coursePerf(c){
  const done = c.series || [], avg = c.avg, cohort = c.cohort, total = COURSE_CH.length;
  const W = 900, H = 180, L = 40, R = 10, T = 12, B = 24, IW = W - L - R, IH = H - T - B;
  const x = i => L + (total > 1 ? i * (IW / (total - 1)) : IW / 2);
  const y = v => T + IH - (v / 100) * IH;
  const lo = done.indexOf(Math.min(...done)), hi = done.indexOf(Math.max(...done));
  const path = done.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  /* 80 KEEPS ITS LABEL AND LOSES ITS LINE — the cohort rule sits ~1 unit off it
     (candidate portal's §—), so the two would paint a pixel apart as a smudge. */
  const grid = [0, 20, 40, 60, 80, 100].map(v => `
    ${v === 80 ? '' : `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--rule)" stroke-width="1" vector-effect="non-scaling-stroke"/>`}
    <text class="perf-yl" x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v}%</text>`).join('');
  const dots = done.map((v, i) => { const call = i === lo ? ' perf-lo' : i === hi ? ' perf-hi' : '';
    return `${call ? `<circle class="perf-halo${call}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="9"/>` : ''}<circle class="perf-dot${call}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4"/>`; }).join('');
  const xl = Array.from({ length: total }, (_, i) => `<text class="perf-xl" x="${x(i).toFixed(1)}" y="${H - 10}" text-anchor="middle">${i + 1}</text>`).join('');
  /* THE AVERAGE HUNG UNDER THE HIGHEST POINT AS A FILLED BOX WITH A RING beside it
     — the candidate portal's own callout, clamped to the plot so it never hangs
     off the right edge. `--background` fills it so the gridlines don't strike
     through the words; `rotate(-90)` starts the ring at twelve o'clock. */
  const cal = (hi >= 0 && avg != null) ? (() => {
    const bw = 104, bh = 34, gap = 12, r = 9;
    let bx = x(hi) + gap; if (bx + bw > W - R) bx = x(hi) - gap - bw; bx = Math.max(L, Math.min(W - R - bw, bx));
    const by = Math.max(T, Math.min(T + IH - bh, y(done[hi]) - bh / 2));
    const cx = bx + 8 + r, cy = by + bh / 2, C = 2 * Math.PI * r, arc = (C * Math.min(100, Math.max(0, avg)) / 100).toFixed(1);
    return `<g class="perf-cal"><rect x="${bx}" y="${by}" width="${bw}" height="${bh}"/>
      <circle class="perf-cal-trk" cx="${cx}" cy="${cy}" r="${r}"/>
      <circle class="perf-cal-arc" cx="${cx}" cy="${cy}" r="${r}" stroke-dasharray="${arc} ${(C - arc).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>
      <text class="perf-cal-l" x="${bx + 34}" y="${by + 15}">Average score</text>
      <text class="perf-cal-v" x="${bx + 34}" y="${by + 27}">${avg}%</text></g>`;
  })() : '';
  /* THIRD-PERSON COPY — the admin is viewing a candidate's record, not taking the
     course (Maryam, 18 Sep 2026): "Performance" / "Score", never "Your ...". The
     "Key insight" block is dropped. */
  return `<div class="sec-h"><div class="perf-hb"><h2>Performance</h2>
      <p class="all-desc">Assessment average across ${total} chapters.</p></div>
      <div class="perf-leg"><span class="perf-lg"><i class="perf-lg-l"></i>Score</span>
        <span class="perf-lg"><i class="perf-lg-d"></i>Cohort average ${cohort}%</span></div></div>
    <div class="perf-b"><div class="perf-plot">
      <svg class="perf-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Assessment score for each assessed chapter, against a cohort average of ${cohort}%">
        ${grid}
        <line class="perf-avg-line" x1="${L}" x2="${W - R}" y1="${y(cohort).toFixed(1)}" y2="${y(cohort).toFixed(1)}" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
        <path class="perf-line" d="${path}" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        ${dots}${xl}${cal}
      </svg></div></div>`;
}
/* ONE CHAPTER ROW — `chRow`'s markup with the candidate's data, read-only. An
   assessed chapter is `.done` with the green tick and its `min · %` meta; the rest
   carry the not-started circle and meta. No trailing Restart/Resume, no `.ch.open`
   (see coursePerf's note). Growth-area chapters keep the sparkle marker. */
function candChRow(i, c){
  const name = COURSE_CH[i][0], mins = COURSE_CH[i][1];
  const assessed = c.assessed || 0, isDone = i < assessed;
  const growth = (c.growth || []).includes(i);
  const meta = isDone ? `${mins} min · ${(c.series || [])[i]}% assessment`
    : i === assessed ? `In progress · ${mins} min`
    : `Not started · ${mins} min`;
  /* the status mark sits at the ROW'S RIGHT END, middle-aligned (Maryam, 18 Sep 2026,
     off the candidate portal): a green filled check for a finished chapter, a light
     bordered ring for the rest — not an inline tick after the name. */
  const mark = isDone
    ? `<span class="ch-ic crs-ch-mk crs-ch-done">${I.checkFilled}</span>`
    : `<span class="ch-ic crs-ch-mk crs-ch-todo"></span>`;
  return `<div class="ch${isDone ? ' done' : ''}">
    <span class="ch-b"><span class="ch-n">${esc(name)}</span>
      <span class="ch-m">${meta}${growth ? `<span class="sep">·</span><span class="ai-inline"><span class="sk"></span>Growth area</span>` : ''}</span></span>
    ${mark}
  </div>`;
}
function candCourseProgress(c){
  return `<div class="crs-prog">

}
function candCourseRow(c, i){

        ${admFact(I.time, '--mk-3', 'Time invested', c.time)}

    </div>
  </div>`;
}
function candCourses(){
  /* Only courses the candidate has actually engaged with — completed or in
     progress; a "Not started" course is hidden (Maryam, 15 Sep 2026). */
  const list = CAND_COURSE_LIST.filter(c => c.status !== 'Not started');

/* THE LEVEL HISTORY — `c.history`, built lazily from the one seed line that
   records a move (Nadia Haddad's promotion of Maryam Naz, in AUDIT). */
function levelHistory(c){
  if(!c.history){
    c.history = [];
    AUDIT.filter(a => a.act === 'Promoted candidate' && a.obj.indexOf(c.name) === 0 && a.who !== ME.name).forEach(a => {
      const m = a.obj.match(/(\w\d) → (\w\d)/); if(m) c.history.push({from:m[1], to:m[2], by:a.who, when:a.when, kind:'review'});
    });

/* ---- SA-05: SCORE OVERRIDE (blocked; the surface is drawn, the blind is not) --
   Void an interview's score with one of two consequences — a free re-interview
   (A1) or a void that leaves the agent's share untouched (A2) — and a batch
   recalibration on a faulty model version (A3). What the re-interviewer is
   shown afterwards (blinded or unblinded, E1) is the blocked ruling and is
   stated, not chosen; a recording past its 24-month retention (E2) is checked
   against the booking date. */
SHEETS.voidscore = id => {
  const b = BOOKINGS.find(x => x.id === id); if(!b) return {title:'Void score', body:'', ok:''};
  const past = b.date && (new Date() - new Date(b.date)) > 730 * 864e5;
  return {title:`Void the score — ${b.cand} with ${b.agent}`, ok:'Continue', act:'askvoid:' + b.id,
    body:`${kv([['Interview', `${esc(b.kind)} · ${esc(b.slot)} · ${esc(b.date)}`], ['Fee', b.fee ? money(b.fee) : 'Free'], ['Recording', past ? tag('blocked', 'Past 24-month retention — erased') : tag('active', 'Within retention')]])}
      ${fieldHtml({k:'mode', l:'Consequence', t:'select', opts:[['reiv', 'Void and grant a free re-interview'], ['keep', 'Void only — the agent’s share is not penalised']]}, 'reiv')}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — e.g. connection dropped for 20 minutes'})}
      ${note('warn', 'Blinded or unblinded is undecided', `Whether the re-interviewer sees this recording is the blocked ruling (SA-05 E1)${past ? '; here it is moot — the recording is past retention (E2)' : ''}. The void is logged either way.`)}`};
};
ACTIONS.askvoid = key => {
  const b = BOOKINGS.find(x => x.id === key.split(':')[1]); const v = readForm(); if(!b) return;
  if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  S._pending = v;
  askConfirm({mk:'warning', title:`Void ${b.cand}’s score from this interview?`, body: v.mode === 'reiv' ? `The score no longer counts toward a level and ${b.cand} is granted a free re-interview. ${b.agent}’s share of the ${b.fee ? money(b.fee) : 'fee'} is unaffected.` : `The score no longer counts toward a level. ${b.agent}’s share is not penalised and no re-interview is granted.`, ok:'Void Score', danger:true, act:'dovoid:' + b.id});
};
ACTIONS.dovoid = key => {
  const b = BOOKINGS.find(x => x.id === key.split(':')[1]); const v = S._pending || {}; S._pending = null; S.confirm = null; if(!b) return;
  const from = b.status; b.status = 'voided';
  if(v.mode === 'reiv'){ BOOKINGS.push({id:newId('bk', BOOKINGS), cand:b.cand, agent:b.agent, slot:'To be booked', date:isoToday(), fee:0, escrow:'n/a', paid:false, kind:'Re-interview (free)', status:'pending'}); }
  audit(v.mode === 'reiv' ? 'Voided score, granted free re-interview' : 'Voided score, agent share kept', `${b.cand} — ${b.agent} · ${v.reason || ''}`, 'Candidates', 'high', {from, to:'voided'});
  toast(v.mode === 'reiv' ? `Score voided — ${b.cand} gets a free re-interview` : 'Score voided');
};

   ====================================================================== */
const AGENTS = () => USERS.filter(u => u.roles.includes('agent'));
/* `display:inline-block` overrides the DS's `svg{display:block}` so the star
   sits ON the rating line rather than stacking above it (Maryam, 7 Sep 2026). */
/* THE RATING VALUE STAR IS FILLED GOLD — `star` at `--star` (Maryam, 15 Sep 2026:
   "i never said to remove the fill of the yellow stars, fill them again"; this
   reverses the same-day `starOutline`). The star that WAS outlined is the
   decorative Rating figure mark on the left, which loses its black FILL instead —
   see the `'starOutline'` icon on the agent-detail Rating stat cell. Used by
   `ratingCell` everywhere the admin prints a rating (the agents table + the agent
   detail's Rating figure). */
const starMark = `<svg viewBox="0 -960 960 960" width="15" height="15" style="display:inline-block;vertical-align:-2px;color:var(--star)" aria-hidden="true">${inner('star')}</svg>`;
/* THE STAR LEADS THE DIGIT — "★ 4.9", not "4.9 ★" (Maryam, 7 Sep 2026). */
const ratingCell = r => `<span style="white-space:nowrap">${starMark} ${r}</span>`;
/* AN AGENT TAKES ONE OF TWO KINDS — a First Interview (the initial level interview,
   complimentary, no fee) or a Re-interview (charged). Any non-re-interview seed kind
   ("Interview", "Level interview", "First (discounted)") reads as a First Interview.
   The first interview is free, so it carries no fee (Maryam, 18 Sep 2026). */
const agIvIsRe = k => /re-?interview/i.test(String(k || ''));
const agIvKind = k => agIvIsRe(k) ? 'Re-interview' : 'First Interview';
const agIvFee = (k, fee) => agIvIsRe(k) ? (fee ? money(fee) : 'Free') : 'Free';
const agentRanking = () => AGENTS().slice().sort((a, b) => b.rating - a.rating || b.interviewed - a.interviewed);
const listed = a => a.status === 'active';

/* ======================================================================
   MARKETPLACE (user-stories Epic 6) — assessment range, the three listing
   states, and a WEEKLY-FROZEN ranking.
   ====================================================================== */
/* THE ASSESSMENT RANGE is guidance shown to candidates; it restricts nothing
   (6.3). A range is a pair on the fifteen-rung ladder and may be a single
   level. Authored placeholder (§74 — the seed carries no range). */
const LADDER = LVL_CODES;                    /* E1..E5, B1..B5, T1..T5 (from the DS) */
const agRange = a => a.range || ['E2', 'B1'];
const rangeLabel = r => r[0] === r[1] ? r[0] : `${r[0]} to ${r[1]}`;
const rangeCovers = (r, lvl) => LADDER.indexOf(lvl) >= LADDER.indexOf(r[0]) && LADDER.indexOf(lvl) <= LADDER.indexOf(r[1]);
/* THREE LISTING STATES (6.1): Listed (bookable), Paused (an admin took them out),
   Not listed (never finished their own onboarding, so never appeared). Listing
   state is independent of account status. */
const agState = a => a.onboarded === false ? 'notlisted' : (a.status === 'active' ? 'listed' : 'paused');
const AG_STATE = {listed:['active', 'Listed'], paused:['inactive', 'Paused'], notlisted:['', 'Not listed']};
const agStateTag = a => { const [v, l] = AG_STATE[agState(a)]; return tag(v, l); };
/* THE RANKING IS BY CANDIDATE RATING ALONE, recalculated WEEKLY — it is not live
   (6.1). Only Listed agents carry a rank. We freeze it once at load and state
   when it was last recalculated and when it next falls, on the Monday–Sunday
   cycle payouts already use. Ties break on interviews conducted. */
let RANK_LAST = '', RANK_NEXT = '';
function freezeRanking(){
  AGENTS().forEach(a => a.rank = null);
  AGENTS().filter(a => agState(a) === 'listed')
    .sort((a, b) => b.rating - a.rating || b.interviewed - a.interviewed)
    .forEach((a, i) => a.rank = i + 1);
  const now = new Date(), dow = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() - ((dow + 6) % 7)); mon.setHours(0, 0, 0, 0);
  const next = new Date(mon); next.setDate(mon.getDate() + 7);
  const fmt = d => d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  RANK_LAST = fmt(mon); RANK_NEXT = fmt(next);
}
(function seedRanges(){
  const seed = {u1:['E3', 'B2'], u2:['E1', 'E4'], u3:['B1', 'T1'], u13:['E1', 'E3'], u14:['E2', 'B1'], u45:['E1', 'E3']};
  AGENTS().forEach(a => { if(!a.range) a.range = seed[a.id] || ['E1', 'E3']; });
  freezeRanking();
})();

const IV_TOPICS = [

  'Leading a project where two of my team disagreed on scope. I made the call in the end, but I am not sure I brought them along with me.',

  'Giving difficult feedback to a peer. It landed fine in the end, but I sat on it far too long first.',
  'Rolling out a process the team pushed back on. I want to talk about how I read the room and where I lost people.'
];
const ivTopicOf = b => { let h = 0; for(const ch of String(b.cand || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return IV_TOPICS[h % IV_TOPICS.length]; };

/* ---- MARKETPLACE ACTIONS (Epic 6) --------------------------------------------
   Set an agent's assessment range (6.3) and pause / restore a listing with a
   mandatory reason (6.2). The range is guidance only and restricts nothing; a
   pause leaves the diary, money and portal access untouched. Every one carries
   a reason to the audit log that is never shown to the agent. */
const agUpcoming = a => BOOKINGS.filter(b => b.agent === a.name && b.status !== 'cancelled' && b.status !== 'voided').length;

SHEETS.agrange = id => {
  const a = USER_BY_ID[id]; if(!a) return {title:'Set assessment range', body:'', ok:''};
  const r = agRange(a);
  return {title:`Set assessment range — ${a.name}`, ok:'Save Range', act:'doagrange:' + id,
    body:`${kv([['Agent', esc(a.name)], ['Current range', rangeLabel(r)]])}
      ${fieldHtml({k:'from', l:'From level', t:'select', opts: LADDER.map(l => [l, l])}, r[0])}
      ${fieldHtml({k:'to', l:'To level', t:'select', opts: LADDER.map(l => [l, l])}, r[1])}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — written to the audit log; never shown to the agent'})}
      <p class="t-desc">Guidance shown to candidates on the marketplace and the agent’s public profile. It restricts nothing — the agent may still interview at any level.</p>`};
};
ACTIONS.doagrange = key => {
  const a = USER_BY_ID[key.split(':')[1]]; const v = readForm(); if(!a) return;
  if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  if(LADDER.indexOf(v.from) > LADDER.indexOf(v.to)){ toast('The lower level must come before the upper level', 'warn'); return 'keep'; }
  const before = agRange(a);
  if(before[0] === v.from && before[1] === v.to){ toast('Pick a different range', 'warn'); return 'keep'; }
  a.range = [v.from, v.to];
  audit('Set agent assessment range', `${a.name} — ${rangeLabel(before)} → ${rangeLabel(a.range)} · ${v.reason}`, 'Talent Agents', 'notice', {from: rangeLabel(before), to: rangeLabel(a.range)});
  toast(`${a.name} now assesses ${rangeLabel(a.range)}`);
};

SHEETS.agpause = id => {
  const a = USER_BY_ID[id]; if(!a) return {title:'Pause listing', body:'', ok:''};
  const n = agUpcoming(a);
  return {title:`Pause ${a.name}’s listing`, ok:'Pause Listing', danger:true, act:'askagpause:' + id,
    body:`${kv([['Agent', esc(a.name)], ['Email', esc(a.email)], ['Upcoming interviews', `${n} in the diary`]])}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — written to the audit log; never shown to the agent'})}
      <p class="t-desc">They come out of the marketplace and cannot receive new bookings. Their ${n} upcoming interview${n === 1 ? '' : 's'} go ahead as booked, and they keep their diary, evaluations and earnings. Their rank clears at the next weekly recalculation.</p>`};
};
ACTIONS.askagpause = key => {
  const a = USER_BY_ID[key.split(':')[1]]; const v = readForm(); if(!a) return;
  if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  S._pending = {reason: v.reason};
  askConfirm({mk:'warning', title:`Pause ${a.name}?`, body:`They stop appearing in the marketplace. Their ${agUpcoming(a)} upcoming interview${agUpcoming(a) === 1 ? '' : 's'} go ahead as booked.`, ok:'Pause Listing', danger:true, act:'doagpause:' + a.id});
};
ACTIONS.doagpause = key => {
  const a = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null; if(!a) return;
  a.status = 'inactive'; freezeRanking();
  audit('Paused agent listing', `${a.name} · ${v.reason || ''}`, 'Talent Agents', 'high');
  toast(`${a.name}’s listing paused`);
};

SHEETS.agrestore = id => {
  const a = USER_BY_ID[id]; if(!a) return {title:'Restore listing', body:'', ok:''};
  return {title:`Restore ${a.name}’s listing`, ok:'Restore Listing', act:'askagrestore:' + id,
    body:`${kv([['Agent', esc(a.name)], ['Email', esc(a.email)]])}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — written to the audit log; never shown to the agent'})}
      <p class="t-desc">They reappear in the marketplace immediately and can receive new bookings. They regain a rank at the next weekly recalculation.</p>`};
};
ACTIONS.askagrestore = key => {
  const a = USER_BY_ID[key.split(':')[1]]; const v = readForm(); if(!a) return;
  if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  S._pending = {reason: v.reason};
  askConfirm({mk:'check', title:`Restore ${a.name} to the marketplace?`, body:'They reappear immediately and can be booked again.', ok:'Restore Listing', act:'doagrestore:' + a.id});
};
ACTIONS.doagrestore = key => {
  const a = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null; if(!a) return;
  a.status = 'active'; freezeRanking();
  audit('Restored agent listing', `${a.name} · ${v.reason || ''}`, 'Talent Agents', 'high');
  toast(`${a.name}’s listing restored`);
};

  help:'A new cohort is created as a draft. Build its session outline on the cohort before you start it. It caps at the maximum you set and begins the 90-day loop when you start it.',
  okNew:'Create Cohort',
  create: v => { const c = {id:newId('ch', COHORTS), name:v.name, leader:v.leader, cap:Number(v.cap) || 10, size:0, week:0, day:0, start:v.start, status:'draft', sessions:[]};
    COHORTS.push(c); COHORT_BY_ID[c.id] = c; return c; },
  update: (c, v) => { CANDS.forEach(x => { if(x.cohort === c.name) x.cohort = v.name; }); c.name = v.name; c.leader = v.leader; if(v.cap) c.cap = Number(v.cap); c.start = v.start; },
  remove: c => { CANDS.forEach(x => { if(x.cohort === c.name) x.cohort = '—'; }); COHORTS.splice(COHORTS.indexOf(c), 1); delete COHORT_BY_ID[c.id]; },
  guard: c => c.status === 'active' && c.size ? `${c.name} is running with ${c.size} members — archive it instead` : null,
  delWarn: c => `${c.name} is removed and its ${c.size} member${c.size === 1 ? '' : 's'} return to no cohort.`,
  status: (c, val) => val === 'archived'
    ? {title:`Archive ${c.name}?`, body:`The cohort ends now, at week ${c.week}. Members keep their level and history; the cohort no longer appears as running.`, ok:'Archive', danger:true, log:'Archived cohort', done:`${c.name} archived`, apply: x => { x.status = 'archived'; }}
    : {title:`Start ${c.name}?`, body:`This begins the 90-day cycle and moves ${c.name} from draft to active. Leader: ${c.leader === 'Unassigned' ? 'unassigned' : c.leader.replace(/\s*\(.*\)/, '')} · start ${c.start}.`, ok:'Start Cohort', log:'Started cohort', done:`${c.name} started`, apply: x => { x.status = 'active'; x.week = Math.max(1, x.week); x.day = Math.max(1, x.day); }}
};

const LEADER_STAGE_LABEL = {feedback:'All', scheduled:'Interview Pending', applied:'Awaiting Interviews'};
/* THE COHORT(S) A LEADER CURRENTLY LEADS — any non-archived cohort whose `leader`
   string (minus its "(bucket)" suffix) is this person (Maryam, 15 Sep 2026). A
   candidate-leader leads one at a time; a moderator may lead several, so this
   returns a list. */
const leaderCohorts = name => COHORTS.filter(c => c.status !== 'archived' && c.leader.replace(/\s*\(.*\)/, '').trim() === name);
function cohortsAssign(){
  /* THREE STAGES, RENAMED (Maryam, 15 Sep 2026): an approved leader is not a
     recommendation, so `feedback` is now the "All" pool with NO pitch/feedback
     prose. The bootstrap-paradox banner is removed and the queue is a TABLE.
     The rows ARE cohort leaders, so the first column reads "Cohort Leader", a
     "Current cohort" column names the cohort each leads, "Allot a cohort" shows
     only for a leader not currently leading, and the removal action reads "Remove
     as cohort leader" (was "Decline"). */
  const sf = getFilter('lstage', 'feedback');
  const rows = LEADER_REQS.filter(r => r.stage === sf);
  const acts = r => {
    const leading = leaderCohorts(r.name).length > 0;
    const remove = ['close', 'Remove as cohort leader', `data-act="askremovelead:${r.id}"`];
    if(r.stage === 'feedback') return rowActs([...(leading ? [] : [['check', 'Allot a cohort', `data-act="askallot:${r.id}"`]]), remove]);
    if(r.stage === 'applied') return rowActs([['calendar', 'Book interview', `data-act="leadsched:${r.id}"`], remove]);
    return rowActs([remove]);
  };
  return `
  <section class="sec">
    ${aiHead('Cohort leaders', 'Candidates applying to lead a cohort. Allot an approved leader to any cohort that needs one.',
      `<button class="btn btn-p btn-sm noic" data-sheet="invitelead">${I.add} Invite A Leader</button>`)}
    ${filterStrip('lstage', 'feedback', [
      ['feedback', 'All', LEADER_REQS.filter(r => r.stage === 'feedback').length],
      ['applied', 'Awaiting Interviews', LEADER_REQS.filter(r => r.stage === 'applied').length],
      ['scheduled', 'Interview Pending', LEADER_REQS.filter(r => r.stage === 'scheduled').length]
    ])}
    ${lstTools('Search the queue')}
    ${rows.length ? table(
      [{label:'Cohort Leader'}, {label:'Level'}, {label:'Bucket'}, {label:'Cohorts led', num:true}, {label:'Current cohort'}, ACT_COL],
      rows.map(r => { const cur = leaderCohorts(r.name); return {id:r.id, cells:[
        personCell(r.name, r.email || ''),
        esc(r.level), esc(r.bucket), r.led ? String(r.led) : '—',
        cur.length ? esc(cur.map(c => c.name).join(', ')) : '—',
        acts(r)
      ]}; }),
      {bulk: () => [['close', 'Remove as cohort leader', `data-act="bulkleadremove"`, 'danger']]})
      : emptyState('cohorts', 'Nobody at this stage', 'Applications move here as they progress.')}
  </section>`;
}

/* REMOVED (flow review, 11 Sep 2026): KINDS.tpl, cohortsTemplates and duptpl.

SHEETS.addsess = () => {
  const c = COHORT_BY_ID[S.id];
  /* A SESSION IS SCHEDULED BY A CONCRETE DATE AND TIME, not an abstract "week"
     (Maryam, 17 Sep 2026: "instead of week selection we need to give date and time
     fields to logically set when this session will happen"). The Mode field and the
     "added to this cohort's outline" note were removed the same day. Date is our
     month-grid picker (`t:'date'`, never a native input, §admin); Time is our
     dropdown (`t:'select'`, business hours). `sessionWeek` still derives a week from
     the cohort start so the roster table can sort and label a seed session. */
  return {title:`Add a session to ${c ? c.name : 'the cohort'}`,
    body:`${fieldHtml({k:'title', l:'Session title', t:'text', ph:'e.g. Mid-cycle levelling check-in'})}
      ${fieldHtml({k:'date', l:'Date', t:'date', ph:'Select a date'})}
      ${fieldHtml({k:'time', l:'Time', t:'select', opts:['09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00']}, '10:00')}
      ${fieldHtml({k:'dur', l:'Length (minutes)', t:'number', def:60})}`,
    ok:'Add Session', act:'doaddsess:' + (c ? c.id : '')};
};
ACTIONS.addsess = key => { S.id = key.split(':')[1]; S.sheet = 'addsess'; };
/* the week the chosen date falls in, counted from the cohort's start; 0 when the
   cohort has no start or the date is blank, so the caller can fall back. */
function sessionWeek(c, iso){
  if(!c || !c.start || !/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return 0;
  const diff = Math.floor((new Date(iso) - new Date(c.start)) / (864e5 * 7));
  return Math.max(1, diff + 1);
}
ACTIONS.doaddsess = key => { const c = COHORT_BY_ID[key.split(':')[1]]; if(!c) return; const v = readForm(); if(!v.title){ toast('Give the session a title', 'warn'); return 'keep'; }
  if(!c.sessions) c.sessions = [];
  const week = sessionWeek(c, v.date) || (c.sessions.length + 1);
  c.sessions.push({id:c.id + 's' + (c.sessions.length + 1), title:v.title, week, date:v.date || '', time:v.time || '', dur:Number(v.dur) || 60}); c.sessions.sort((a, b) => a.week - b.week);
  audit('Added session to cohort', `${c.name} — ${v.title}`, 'Cohort Management', 'info'); toast('Session added'); };
ACTIONS.delsess = key => { const [, cid, sid] = key.split(':'); const c = COHORT_BY_ID[cid]; if(!c || !c.sessions) return; const i = c.sessions.findIndex(s => s.id === sid); if(i >= 0){ const nm = c.sessions[i].title; c.sessions.splice(i, 1); audit('Removed session', `${c.name} — ${nm}`, 'Cohort Management', 'info'); toast('Session removed'); } };

    ${(c.sessions && c.sessions.length) ? table(

        s.date ? esc(dpFmt(s.date) + (s.time ? ' · ' + s.time : '')) : (s.week ? 'Week ' + s.week : '—'),
        s.dur + ' min', esc(s.mode || '—'), rowActs([['delete', 'Remove session', `data-act="delsess:${c.id}:${s.id}"`]])]})),
      {select:false})

SHEETS.addmember = () => {
  const c = COHORT_BY_ID[S.id];
  const free = CANDS.filter(x => x.cohort === '—' && x.status === 'active');
  /* SA-12 A1 — FORCE ADD: a candidate already placed elsewhere, or suspended,
     can be added past the eligibility rule; the option says so and the add is
     logged at high severity. The eligibility rule itself is the open ruling. */
  const forced = CANDS.filter(x => !(x.cohort === '—' && x.status === 'active') && x.cohort !== (c || {}).name);
  return {title:`Add a member to ${c ? c.name : 'the cohort'}`,
    body:`${fieldHtml({k:'cand', l:'Candidate', t:'select', opts: [...(free.length ? free.map(x => [x.id, `${x.name} · ${x.level}`]) : [['', 'Every active candidate is already in a cohort']]), ...forced.map(x => [x.id, `${x.name} · ${x.level} · ${x.status === 'inactive' ? 'suspended' : 'in ' + x.cohort} — force add`])]})}
      <p class="t-desc">Candidates without a cohort are offered first. An entry marked “force add” bypasses eligibility (SA-12 A1) — they leave their current cohort or their suspension is noted — and is logged at high severity.</p>`,
    ok:'Add To Roster', act:'doaddmember:' + (c ? c.id : '')};
};
ACTIONS.doaddmember = key => { const c = COHORT_BY_ID[key.split(':')[1]]; const v = readForm(); const m = CAND_BY_ID[v.cand]; if(!c || !m){ toast('Pick a candidate', 'warn'); return 'keep'; }
  const forced = !(m.cohort === '—' && m.status === 'active'); const from = m.cohort;
  m.cohort = c.name; syncCohortSizes();
  audit(forced ? 'Force-added to cohort (eligibility bypassed)' : 'Added to cohort', `${m.name} → ${c.name}${forced ? ` · was ${from === '—' ? 'suspended' : 'in ' + from}` : ''}`, 'Cohort Management', forced ? 'high' : 'notice', {from, to:c.name});
  toast(`${m.name} ${forced ? 'force-added' : 'added'} to ${c.name}`); };
/* SA-12 A5 — extend or reschedule. 12 versus 13 weeks is the open ruling; both are
   offered and the choice is logged. */
SHEETS.extend = id => {

ACTIONS.askextend = key => { const c = COHORT_BY_ID[key.split(':')[1]]; const v = readForm(); if(!c) return; if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }

ACTIONS.doextend = key => { const c = COHORT_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null; if(!c) return;

/* SA-12 A3 — merge an under-filled cohort into another, or dissolve it. */
SHEETS.mergeco = id => {
  const c = COHORT_BY_ID[id]; if(!c) return {title:'Merge', body:'', ok:''};

};
ACTIONS.askmergeco = key => { const c = COHORT_BY_ID[key.split(':')[1]]; const v = readForm(); const t = COHORT_BY_ID[v.into]; if(!c || !t){ toast('Pick a cohort', 'warn'); return 'keep'; } if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }

ACTIONS.domergeco = key => { const c = COHORT_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null; const t = COHORT_BY_ID[v.into]; if(!c || !t) return;
  CANDS.forEach(x => { if(x.cohort === c.name) x.cohort = t.name; }); c.status = 'archived'; syncCohortSizes();
  audit('Merged cohorts', `${c.name} → ${t.name} · ${v.reason}`, 'Cohort Management', 'high', {from:c.name, to:t.name}); toast(`${c.name} merged into ${t.name}`); go('cohorts/detail/' + t.id); };
ACTIONS.askdissolve = key => { const c = COHORT_BY_ID[key.split(':')[1]]; if(!c) return;
