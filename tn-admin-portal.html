   RENDER
   ====================================================================== */
const device = document.getElementById('device');
const MO = {key:'', open:{}};
/* THE SEARCH FIELD'S CARET survives the render the same way the ask field's
   does: the input handler records which field and where, the render puts it
   back. Consumed on use, so a later render never steals focus. */
let SRCH_FOCUS = null;
let IMP_FOCUS = null;   /* bulk-import cell caret restore, like SRCH_FOCUS */

/* §125 — PLACE THE OPEN ROW MENU. The kebab's dropdown is emitted inside its
   table cell, but `.tbl-wrap` clips it (it scrolls sideways, which clips the
   other axis too) and `overflow:visible` breaks a phone's sideways-scrolled
   table. So the open list is LIFTED into `.main` — the scroll container, which
   clips nothing sideways — and positioned at the trigger, opening up or down by
   the room below and clamped inside the frame. Coordinates are in `.main`'s own
   layout px: `getBoundingClientRect` is in scaled viewport px (the prototype
   frame's fit-to-pane transform), so every gap is divided by that scale before
   it becomes a `left`/`top`. Re-run every render; the fresh list is re-lifted. */
function placeRowMenu(){
  if(!S.rowMenu) return;
  const main = device.querySelector('.main');
  const trig = device.querySelector(`.rowmenu-t[data-rowmenu="${S.rowMenu}"]`);
  const list = device.querySelector(`.rowmenu-list[data-rmlist="${S.rowMenu}"]`);
  if(!main || !trig || !list) return;
  const mr = main.getBoundingClientRect();
  const scale = mr.width / main.clientWidth || 1;
  const tr = trig.getBoundingClientRect();
  /* the trigger, in main's own (unscaled) content coordinates */
  const triRight  = (tr.right  - mr.left) / scale + main.scrollLeft;
  const triTop    = (tr.top    - mr.top ) / scale + main.scrollTop;
  const triBottom = (tr.bottom - mr.top ) / scale + main.scrollTop;
  main.style.position = 'relative';       /* the menu anchors to main */
  main.appendChild(list);
  const menuW = list.offsetWidth  || 190;
  const menuH = list.offsetHeight || 0;
  const gap = 6, edge = 8;
  const contentW = main.clientWidth, frameH = main.clientHeight;
  /* right-align to the kebab, then keep it inside the frame */
  let left = triRight - menuW;
  left = Math.max(edge, Math.min(left, contentW - menuW - edge));
  /* THE FLOATING TAL DOCK OCCLUDES THE FOOT of `.main`, so the usable bottom is
     the dock's top, not the frame's — else a low menu opens down and hides
     behind "Ask Tal anything" (§125). */
  const dock = device.querySelector('.askdock');
  let viewBottom = main.scrollTop + frameH;
  if(dock){
    const dr2 = dock.getBoundingClientRect();
    viewBottom = Math.min(viewBottom, (dr2.top - mr.top) / scale + main.scrollTop - gap);
  }
  /* below the kebab, unless that would run past the usable foot and there is
     room above */
  const openUp = (triBottom + gap + menuH > viewBottom) && (triTop - gap - menuH >= main.scrollTop);
  const top = openUp ? triTop - gap - menuH : triBottom + gap;
  list.style.left = left + 'px';
  list.style.right = 'auto';
  list.style.top = top + 'px';
  list.style.bottom = 'auto';
}

function render(){
  ROWMENU_SEQ = 0;                        /* §125 — stable per-render menu ids */
  TBL_SEQ = 0;                            /* §127 — stable per-render table ids */
  TBL_ROWKEYS = {};                       /* row-select — rebuilt as each table renders */
  SEL_TABLES = [];                        /* bulk action bar — tables re-register each render */
  expireGrants();                         /* SA-01 A2 / SA-16 A3 — a time-boxed grant past its date comes off */
  /* 1.2 — THE ACTIVATION PREVIEW. A full-frame scene layered over everything
     (the invite link has no console), previewed from an Invited staff row. */
  if(S.activate){ device.innerHTML = activateView();
    const f = device.querySelector('#lcode, #np'); if(f && document.activeElement !== f){ try { f.focus(); } catch(e){} }
    return; }
  /* SA-02 — THE GATE. Signed out, the frame holds the sign-in scene and nothing
     else: no shell, no rail, no dock, no hash written. */
  if(!S.signedIn){
    device.innerHTML = authView();
    const f = device.querySelector('#lcode, #lem'); if(f && document.activeElement !== f) { try { f.focus(); } catch(e){} }
    return;
  }
  if(!MOD_BY_K[S.mod] || !V[S.mod]){ S.mod = 'home'; S.sub = 'home'; }
  const m = MOD_BY_K[S.mod];
  if(!m._sub[S.sub]) S.sub = firstSub(m);
  DETAIL_LABEL = null;

  const view = V[S.mod];
  const key = (S.tal ? 'tal/' : '') + S.mod + '/' + S.sub + '/' + (S.id || '');
  const entered = MO.key !== '' && key !== MO.key;
  MO.key = key;

  const OVER = ['nav', 'notif', 'confirm', 'sheet'];
  const opened = OVER.filter(k => S[k] && !MO.open[k]);
  const shown = OVER.filter(k => S[k]);
  /* a side-panel record form (sidePeek) is an in-flow `.peek` column. `data-shown`
     (persistent) drives the layout — §44's `.main` margin-drop, the width, the
     seam fix; `data-open` (this render only) drives the ENTRANCE animation — the
     panel walks in from the right and the content narrows with it. MO.peek holds
     the previous state so `data-open~="peek"` is set only on the render it opens
     (trap 5: layout reads data-shown, motion reads data-open). */
  const peekNow = sideSheet(S.sheet);
  if(peekNow) shown.push('peek');
  if(peekNow && !MO.peek) opened.push('peek');
  MO.peek = peekNow;
  for(const k of OVER) MO.open[k] = !!S[k];

  const at = ` data-rail="${S.nav ? 'open' : 'shut'}" data-view="${S.mod}"`
    + (entered ? ' data-enter' : '')
    + (opened.length ? ` data-open="${opened.join(' ')}"` : '')
    + (shown.length ? ` data-shown="${shown.join(' ')}"` : '')
    + (S.sheetClosing ? ' data-closing="peek"' : '');

  /* PRESERVE THE TABLE'S SCROLL ACROSS A SAME-PAGE RENDER. `render()` replaces
     `device.innerHTML`, so the new `.main` starts at scrollTop 0 — which threw a
     long list back to the top on every menu toggle, sort, filter or keystroke
     (§125). Capture it here and restore it below, but only when the page did not
     change (`entered`): a real navigation still resets, as `go()` does. */
  const _prevMain = device.querySelector('.main');
  const _prevScroll = _prevMain ? _prevMain.scrollTop : 0;
  /* the table's sideways scroll too, by index — else opening a menu on a phone,
     where the table is scrolled right to reach the Actions column, snaps it back
     to the first column (§125) */
  const _prevWrapX = [...device.querySelectorAll('.tbl-wrap')].map(w => w.scrollLeft);

  /* THE ASK PAGE REPLACES THE PAGE and is the direct child of `.main` (§21
     gives it `height:100%`); the dock is not printed while it, a sheet or a
     confirmation is open — the dock is the invitation to the surface. */
  device.innerHTML = `<div class="app" data-portal="admin"${at}>
    ${shell()}
    <div class="shell-body">
      ${sidenav()}
      <div class="view-col">
        ${viewAsBar()}
        <main class="main">${S.tal ? askView() : `<div class="page">${view()}</div>`}</main>
        ${/* THE TAL FLOATING DOCK IS HIDDEN ON THE ADMIN (Maryam, 21 Sep 2026:
            "hide tal floating bottom bar from the super admin portal"). The
            bulk-action bar still rides the same slot when rows are selected —
            it is a selection tool, not Tal — so only the "Ask Tal" pill goes.
            `askDock` stays defined; drop the `: ''` to bring it back. */''}
        ${S.tal || S.sheet || S.confirm ? '' : (bulkCtx() ? bulkBar() : '')}
      </div>
      ${sideSheet(S.sheet) ? sidePeek() : ''}
    </div>
    ${/* THE MODAL OVERLAYS ARE DIRECT CHILDREN OF `.app`, NOT `.shell-body`, so
         their `inset:0` backdrop covers the WHOLE frame — the app bar included
         (Maryam, 13 Sep 2026: "on opening a modal the top header should also have
         the overlay"). In `.shell-body` they began below the 68px bar, leaving the
         header undimmed. `.app` is positioned, `.modal` z-index (70) beats the
         bar's (30). THE NOTIFICATION PANEL IS A CHILD OF `.app` TOO NOW — its
         scrim must dim the app bar as well (Maryam, 15 Sep 2026: "cover the top
         header in the overlay as well like we have on the candidate portal"), so
         it can no longer live inside `.shell-body` below the bar. */''}
    ${notifPanel()}
    ${confirmSheet()}
    ${sheetView()}
    ${/* THE SHARED STRIPE "ADD PAYMENT METHOD" MODAL (`dsPayForm`), opened by
         `S.payModal` — the same component every portal uses. */''}
    ${dsPayForm(S.payTab, S.payModal)}
    <div class="pt-toasts" id="toasts"></div>
  </div>`;

  /* restore the scroll captured above — same page only (§125). Instant, not the
     `.main`'s own smooth behaviour, or every menu toggle would glide the list. */
  if(!entered && _prevScroll){
    const nm = device.querySelector('.main');
    if(nm){ const sb = nm.style.scrollBehavior; nm.style.scrollBehavior = 'auto'; nm.scrollTop = _prevScroll; nm.style.scrollBehavior = sb; }
  }
  if(!entered){
    const wraps = device.querySelectorAll('.tbl-wrap');
    _prevWrapX.forEach((x, i) => { if(wraps[i] && x) wraps[i].scrollLeft = x; });
  }

  const app = device.querySelector('.app');
  if(app.hasAttribute('data-enter')){
    device.querySelectorAll('.page > .modhead, .page > .sec, .page > .ph')
      .forEach((el, i) => el.style.setProperty('--i', Math.min(i, 7)));
  }
  dsStagger(device.querySelector('.page'));

  placeTopbar();
  placeRowMenu();

  /* the thread ends at the bottom, and the caret goes back — only when this
     render was caused by you (the agent portal's `ASK_FOCUS` note) */
  const th = device.querySelector('#askThread');
  if(th) th.scrollTop = th.scrollHeight;
  if(ASK_FOCUS){ ASK_FOCUS = false; const el = device.querySelector('#askIn'); if(el) el.focus(); }
  if(SRCH_FOCUS){
    const f = SRCH_FOCUS; SRCH_FOCUS = null;
    const el = device.querySelector(`[data-srch="${f.name}"]`);
    if(el){ el.focus(); try { el.setSelectionRange(f.pos, f.pos); } catch(e){} }
  }
  if(IMP_FOCUS){
    const f = IMP_FOCUS; IMP_FOCUS = null;
    const el = device.querySelector(f.sel);
    if(el){ el.focus(); try { el.setSelectionRange(f.pos, f.pos); } catch(e){} }
  }

  try {
    /* the Tal summary band is hidden portal-wide now (see `head`), so this is
       usually absent — only type it when a page still draws one */
    const talP = device.querySelector('.modhead .ai-aura.talsum > .ai-body > p');
    if(talP && typeof dsTypeSummary === 'function'){
      dsTypeSummary(talP, key);
    }
  } catch(e){ console.warn('talsum', e); }

  try { syncSheetSubmit(); } catch(e){ console.warn('sheetsubmit', e); }
  writeHash();
}

/* ======================================================================
   THE URL IS WHERE YOU ARE — hash `#mod/sub[/id]`, `replaceState` out,
   read back on load and on the back button.
   ====================================================================== */
function writeHash(){
  if(!S.signedIn) return;
  const parts = [S.mod, S.sub];
  if(S.id) parts.push(S.id);
  try { history.replaceState(null, '', '#' + parts.join('/')); } catch(e){}
}
function readHash(){
  const p = location.hash.slice(1).split('/').filter(Boolean);
  if(!p.length) return false;
  if(!MOD_BY_K[p[0]] || !V[p[0]]) return false;
  S.mod = p[0];
  S.sub = (p[1] && MOD_BY_K[p[0]]._sub[p[1]]) ? p[1] : firstSub(MOD_BY_K[p[0]]);
  S.id = p[2] || null;
  return true;
}
window.addEventListener('hashchange', () => {
  if(!readHash()) return;
  S.nav = S.notif = S.acct = false; S.confirm = null; S.sheet = null; S.tal = false; S.rowMenu = null;
  render();
});

/* ======================================================================
   NAVIGATION — one delegated listener on `#device`, which outlives every
   render. `data-go` carries `mod/sub[/id]`; everything else is a flag.
   ====================================================================== */
const routeOf = () => S.mod + '/' + S.sub + (S.id ? '/' + S.id : '');
function go(dest, keepNav){
  const p = String(dest).split('/');
  const mod = p[0], sub = p[1], id = p[2];
  if(!MOD_BY_K[mod] || !V[mod]) return;
  /* Remember the screen we are leaving so a detail's Back can return to it. Skip
     a no-op (navigating to the same route) and a consecutive duplicate; cap the
     stack so it cannot grow without bound. */
  const cur = routeOf(), next = mod + '/' + ((sub && MOD_BY_K[mod]._sub[sub]) ? sub : firstSub(MOD_BY_K[mod])) + (id ? '/' + id : '');
  if(S.signedIn && cur !== next){ if(S.hist[S.hist.length - 1] !== cur) S.hist.push(cur); if(S.hist.length > 30) S.hist.shift(); }
  S.mod = mod;
  S.sub = (sub && MOD_BY_K[mod]._sub[sub]) ? sub : firstSub(MOD_BY_K[mod]);
  S.id = id || null;
  /* THE RAIL STAYS OPEN when you moved from inside it at desktop — a tree you
     have to reopen after every press is not a tree. On a phone it is a drawer
     over the page and shuts, as it always did. */
  if(!keepNav) S.nav = false;
  S.notif = false; S.acct = false; S.tal = false; S.editPerms = false; S.rowMenu = null; S.pgOpen = null; S.fdOpen = null;
  render();
  const main = device.querySelector('.main');
  if(main) main.scrollTop = 0;
}

/* BACK — pop the last remembered screen and go there without pushing (a back that
   pushed would ping-pong). A stale/hidden popped target or an empty stack (a deep
   link) falls back to the fixed list `detailHead` was given. */
function goBack(fallback){
  let dest = S.hist.pop();
  if(dest){ const m = dest.split('/')[0]; if(!MOD_BY_K[m] || !V[m]) dest = null; }
  if(!dest) dest = fallback;
  const p = String(dest || '').split('/'), mod = p[0], sub = p[1], id = p[2];
  if(!MOD_BY_K[mod] || !V[mod]) return;
  S.mod = mod;
  S.sub = (sub && MOD_BY_K[mod]._sub[sub]) ? sub : firstSub(MOD_BY_K[mod]);
  S.id = id || null;
  S.nav = false; S.notif = false; S.acct = false; S.tal = false; S.editPerms = false; S.rowMenu = null; S.pgOpen = null; S.fdOpen = null;
  render();
  const main = device.querySelector('.main');
  if(main) main.scrollTop = 0;
}

/* TAL'S OWN CONTROLS, IN A LISTENER OF THEIR OWN — the agent portal's shape. */
device.addEventListener('click', e => {
  /* THE SCENES CAROUSEL CHEVRONS scroll the row in place, no render (trap 9 —
     a scroll position is where the reader is looking, not view state). */
  const scv = e.target.closest('[data-scv]');
  if(scv){ dsScvScroll(scv); return; }
  /* THE NUMBER STEPPER (bucket Edit sheet) — adjust the input value in place, no
     render, so the description textarea's in-progress text survives (the sheet is
     read back from the DOM on Save). Clamped to the field's min/max. */
  const nst = e.target.closest('[data-nstep]');
  if(nst){
    const [key, dir] = nst.dataset.nstep.split(':');
    const inp = device.querySelector(`[data-f="${key}"]`);
    if(inp){
      const lo = +inp.min || 1, hi = +inp.max || 99;
      let n = parseInt(inp.value, 10); if(isNaN(n)) n = lo;
      n = Math.max(lo, Math.min(hi, n + (dir === 'up' ? 1 : -1)));
      inp.value = n;
    }
    return;
  }
  /* OUR form dropdown (formDd) — DOM-only, no render (the form is read from the
     DOM on save). Toggle the menu, set the hidden [data-f] input and the trigger
     label; a pick never rebuilds the sheet, so other in-progress fields survive. */
  const fdt = e.target.closest('[data-formddtoggle]');
  if(fdt){
    const fdd = fdt.closest('.fdd'), wasOpen = fdd.classList.contains('on');
    device.querySelectorAll('.fdd.fdd-form.on').forEach(x => { x.classList.remove('on'); const s = x.closest('.sheet-b'); if(s) s.classList.remove('dd-open'); });
    fdd.classList.toggle('on', !wasOpen);
    fdt.setAttribute('aria-expanded', String(!wasOpen));
    const sb = fdt.closest('.sheet-b'); if(sb) sb.classList.toggle('dd-open', !wasOpen);
    return;
  }
  const fds = e.target.closest('[data-formddset]');
  if(fds){
    const fdd = fds.closest('.fdd'), hid = fdd.querySelector('input[data-f]'), vl = fdd.querySelector('.fdd-val');
    if(hid) hid.value = fds.dataset.formddset;
    /* innerHTML, not textContent — an option may carry an avatar (`fddAv`); the
       trigger must keep it when selected (Maryam, 15 Sep 2026). The option's HTML
       is our own markup with escaped labels. */
    if(vl){ vl.innerHTML = fds.innerHTML; vl.classList.remove('fdd-ph'); }
    fdd.querySelectorAll('.fdd-opt').forEach(o => { const on = o === fds; o.classList.toggle('on', on); o.setAttribute('aria-selected', String(on)); });
    fdd.classList.remove('on');
    const tr = fdd.querySelector('[data-formddtoggle]'); if(tr) tr.setAttribute('aria-expanded', 'false');
    const sb = fds.closest('.sheet-b'); if(sb) sb.classList.remove('dd-open');
    syncSheetSubmit();
    return;
  }
  /* a click outside an open form dropdown closes it (DOM-only, no render) */
  if(!e.target.closest('.fdd.fdd-form')){
    device.querySelectorAll('.fdd.fdd-form.on').forEach(x => { x.classList.remove('on'); const s = x.closest('.sheet-b'); if(s && !device.querySelector('.fdate.on')) s.classList.remove('dd-open'); const tr = x.querySelector('[data-formddtoggle]'); if(tr) tr.setAttribute('aria-expanded', 'false'); });
  }
  /* OUR DATE PICKER — open/close, month nav and day pick, all DOM-only (never
     render(), which reads the form back from the DOM); the viewed month lives in
     the popup's `data-ym`. */
  const dtt = e.target.closest('[data-datetoggle]');
  if(dtt){
    const fdate = dtt.closest('.fdate'), wasOpen = fdate.classList.contains('on');
    device.querySelectorAll('.fdate.on').forEach(x => { if(x !== fdate){ x.classList.remove('on'); const tr = x.querySelector('[data-datetoggle]'); if(tr) tr.setAttribute('aria-expanded', 'false'); } });
    fdate.classList.toggle('on', !wasOpen);
    dtt.setAttribute('aria-expanded', String(!wasOpen));
    const sb = fdate.closest('.sheet-b');
    if(sb){ if(!wasOpen) sb.classList.add('dd-open'); else if(!device.querySelector('.fdd.fdd-form.on')) sb.classList.remove('dd-open'); }
    return;
  }
  const dnv = e.target.closest('[data-datenav]');
  if(dnv){
    const [key, dir] = dnv.dataset.datenav.split(':');
    const fdate = dnv.closest('.fdate'), pop = fdate.querySelector('.fdate-pop'), cal = pop.querySelector('.dcal');
    const [yy, mm] = cal.dataset.ym.split('-').map(Number);   /* mm is 1-12 */
    let mi = mm - 1 + Number(dir), y = yy;
    if(mi < 0){ mi = 11; y--; } else if(mi > 11){ mi = 0; y++; }
    const hid = fdate.querySelector('input[data-f]');
    pop.innerHTML = dateGrid(key, y, mi, hid ? hid.value : '');
    return;
  }
  const dsx = e.target.closest('[data-dateset]');
  if(dsx){
    const raw = dsx.dataset.dateset, i = raw.indexOf(':'), iso = raw.slice(i + 1);
    const fdate = dsx.closest('.fdate'), hid = fdate.querySelector('input[data-f]'), vl = fdate.querySelector('.fdate-val'), tr = fdate.querySelector('[data-datetoggle]');
    if(hid) hid.value = iso;
    if(vl){ vl.textContent = dpFmt(iso); vl.classList.remove('fdate-ph'); }
    fdate.classList.remove('on'); if(tr) tr.setAttribute('aria-expanded', 'false');
    const sb = fdate.closest('.sheet-b'); if(sb && !device.querySelector('.fdd.fdd-form.on')) sb.classList.remove('dd-open');
    syncSheetSubmit();
    return;
  }
  /* a click outside an open date picker closes it (DOM-only) */
  if(!e.target.closest('.fdate')){
    device.querySelectorAll('.fdate.on').forEach(x => { x.classList.remove('on'); const tr = x.querySelector('[data-datetoggle]'); if(tr) tr.setAttribute('aria-expanded', 'false'); const s = x.closest('.sheet-b'); if(s && !device.querySelector('.fdd.fdd-form.on')) s.classList.remove('dd-open'); });
  }
  /* THE SEARCH CLEAR (X) — empties the query and returns the full table; the
     caret returns to the (now empty) field via SRCH_FOCUS. */
  const sx = e.target.closest('[data-srchclear]');
  if(sx){ setFilter(sx.dataset.srchclear, ''); SRCH_FOCUS = {name:sx.dataset.srchclear, pos:0}; return render(); }
  const eye = e.target.closest('[data-eye]');
  if(eye){
    const inp = device.querySelector('#' + eye.dataset.eye); if(!inp) return;
    const show = inp.type === 'password'; inp.type = show ? 'text' : 'password';
    if(show && inp.value.startsWith('•')) inp.value = 'Operations-2026!';
    eye.innerHTML = show ? I.viewOff : I.view; return;
  }
  if(e.target.closest('[data-askopen]')){ return askOpen(); }
  if(e.target.closest('[data-askback]')){ return askClose(); }
  const chip = e.target.closest('[data-ask]');
  if(chip){ return askOpen(chip.dataset.ask); }
  if(e.target.closest('[data-asksend]')){
    const el = device.querySelector('#askIn');
    const q = el && el.value.trim();
    if(q){ el.value = ''; ask(q); }
    return;
  }
});
device.addEventListener('keydown', e => {
  if(e.target.id !== 'askIn' || e.key !== 'Enter') return;
  const q = e.target.value.trim();
  if(q){ e.target.value = ''; ask(q); }
});

/* THE SEARCH FIELD FILTERS AS YOU TYPE. The value goes into the page's filter
   state and the page re-renders; `SRCH_FOCUS` puts the caret back. */
device.addEventListener('input', e => {
  /* a keystroke in a record-sheet field re-checks the submit gate live (no render,
     which would rebuild the half-typed form — trap 9). */
  if(e.target.closest('.sheet-b [data-f], .peek-form [data-f]')) syncSheetSubmit();
  const el = e.target.closest('[data-srch]');
  if(el){ setFilter(el.dataset.srch, el.value); SRCH_FOCUS = {name:el.dataset.srch, pos:el.selectionStart}; return render(); }
  /* BULK IMPORT — a name/email cell edited live: update the row, re-validate the
     batch so its status badge follows the fix, and put the caret back (trap 9 /
     `SRCH_FOCUS`). */
  const cell = e.target.closest('[data-impcell]');
  if(cell){ const [i, f] = cell.dataset.impcell.split(':'); S.imp.rows[+i][f] = cell.value;
    S.imp.rows = impValidate(S.imp.rows); IMP_FOCUS = {sel:`[data-impcell="${cell.dataset.impcell}"]`, pos:cell.selectionStart}; return render(); }
  /* BULK IMPORT — the paste box: track its text so "Parse rows" enables/disables
     with content (disabled while empty). Caret restored like the cells. */
  const box = e.target.closest('[data-imptext]');
  if(box){ S.imp.text = box.value; IMP_FOCUS = {sel:'[data-imptext]', pos:box.selectionStart}; return render(); }
});
/* BULK IMPORT — the role <select> chosen, or a CSV file picked. Both re-validate
   and re-render (a `change` never needs a caret restored). */
device.addEventListener('change', e => {
  const rl = e.target.closest('[data-improle]');
  if(rl){ S.imp.rows[+rl.dataset.improle].role = rl.value; S.imp.rows = impValidate(S.imp.rows); return render(); }
  const f = e.target.closest('#impFile');
  if(f && f.files && f.files[0]){ const rd = new FileReader();
    rd.onload = () => { const rows = impParse(rd.result); if(!rows.length){ toast('That file had no rows', 'warn'); return; } S.imp.rows = impValidate(rows); S.imp.step = 'review'; render(); };
    rd.readAsText(f.files[0]); }
});

device.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-back],[data-toggle],[data-close],[data-confirm],[data-do],[data-readall],[data-tab],[data-filter],[data-act],[data-sheet],[data-sort],[data-rowmenu],[data-ivopen],[data-crsopen],[data-pg],[data-pgsize],[data-pgddtoggle],[data-fdtoggle],[data-payopen],[data-paytab],[data-payclose],[data-improleopen],[data-improleset],[data-sel],[data-selall],[data-selclearall]');

  if(S.acct && !e.target.closest('.acct-t, .acct-menu')){ S.acct = false; render(); }
  /* §125 — an open row menu closes on any click outside its trigger or list.
     The list is included by name because `placeRowMenu` moves it out of the
     `.rowmenu` wrapper into `.main`. */
  if(S.rowMenu && !e.target.closest('.rowmenu, .rowmenu-list')){ S.rowMenu = null; render(); }
  /* §127 — an open rows-per-page dropdown closes on any click outside it */
  if(S.pgOpen && !e.target.closest('.pgn-dd')){ S.pgOpen = null; render(); }
  /* §128 — an open filter dropdown closes on any click outside it */
  if(S.fdOpen && !e.target.closest('.fdd')){ S.fdOpen = null; render(); }
  /* a bulk-import role dropdown closes on any click outside a `.fdd` */
  if(S.impRoleOpen != null && !e.target.closest('.fdd')){ S.impRoleOpen = null; render(); }
  if(!t) return;
  const d = t.dataset;
  /* a menu item was chosen — close the menu; the item's own handler re-renders */
  if(t.closest('.rowmenu-list')) S.rowMenu = null;

  if(d.close !== undefined){
    if(t.classList.contains('modal') && e.target !== t) return;
    /* THE SIDE SLIDER CLOSES THE WAY IT OPENED (Maryam, 14 Sep 2026): play the
       walk-OUT (data-closing="peek" → the reverse of peek-walk-in), THEN drop
       S.sheet a beat later so the panel slides out and the content widens back,
       instead of the panel vanishing in one frame. Guarded so a double-click
       does not re-arm it. The centre modal / confirm keep their instant close. */
    if(d.close === 'sheet') S.refundTxn = null;   /* a fresh refund next time */
    if(d.close === 'sheet' && sideSheet(S.sheet) && !S.sheetClosing){
      S.sheetClosing = true; render();
      setTimeout(() => { S.sheet = null; S.sheetClosing = false; render(); }, 400);
      return;
    }
    S[d.close] = d.close === 'confirm' || d.close === 'sheet' ? null : false;
    return render();
  }
  if(d.readall){
    ADMIN_NOTIF.forEach(n => { if(!n.rd && !S.read.includes(n.h)) S.read.push(n.h); });
    return render();
  }
  if(d.confirm !== undefined){ S.confirm = d.confirm; return render(); }
  if(d.do !== undefined){
    /* SA-02 A1 — a step-up confirmation does not run without its code. Six
       digits is the whole check in a prototype; the point is the gate, not the
       verification. */
    const cf = S._confirm;
    if(S.confirm === '_dyn' && cf && cf.stepup && SEC.stepup !== false){
      const code = (device.querySelector('.modal.on .conf [data-f="code"]') || {}).value || '';
      if(!/^\d{6}$/.test(code.trim())){ toast('Enter the 6-digit code from your authenticator', 'warn'); return; }
    }
    return doAction(d.do, t);
  }
  if(d.toggle){ S[d.toggle] = !S[d.toggle]; return render(); }
  if(d.rowmenu !== undefined){ S.rowMenu = S.rowMenu === d.rowmenu ? null : d.rowmenu; return render(); }
  /* ROW SELECT — toggle one row's checkbox. `data-sel` is the table key,
     `data-selrow` the row key; matched before the row's `data-go`, so ticking a
     box never opens the record. */
  if(d.sel !== undefined && d.selrow !== undefined){
    const map = S.sel[d.sel] = S.sel[d.sel] || {};
    if(map[d.selrow]) delete map[d.selrow]; else map[d.selrow] = true;
    return render();
  }
  /* SELECT ALL — the header box toggles the WHOLE dataset (every page). If all
     are on it clears; otherwise it sets all. Keys come from `TBL_ROWKEYS`, filled
     by the last render of that table. */
  if(d.selall !== undefined){
    const keys = TBL_ROWKEYS[d.selall] || [], map = S.sel[d.selall] = S.sel[d.selall] || {};
    const allOn = keys.length > 0 && keys.every(k => map[k]);
    keys.forEach(k => { if(allOn) delete map[k]; else map[k] = true; });
    return render();
  }
  /* CLEAR SELECTION — the action bar's × empties the active table's picks. */
  if(d.selclearall !== undefined){ const ctx = bulkCtx(); if(ctx) S.sel[ctx.key] = {}; return render(); }
  if(d.ivopen !== undefined){ S.ivOpen = S.ivOpen === d.ivopen ? null : d.ivopen; return render(); }
  if(d.crsopen !== undefined){ S.crsOpen = S.crsOpen === d.crsopen ? null : d.crsopen; return render(); }
  if(d.tab !== undefined){ setTab(d.tab); return render(); }
  if(d.fdtoggle !== undefined){          /* §128 — open/close a filter dropdown */
    const k = pageKey() + ':' + d.fdtoggle;
    S.fdOpen = S.fdOpen === k ? null : k;
    return render();
  }
  if(d.improleopen !== undefined){       /* bulk-import role dropdown open/close */
    const i = +d.improleopen; S.impRoleOpen = S.impRoleOpen === i ? null : i;
    return render();
  }
  if(d.improleset !== undefined){        /* a role chosen — set it, re-validate, close */
    const ci = d.improleset.indexOf(':'); const i = +d.improleset.slice(0, ci);
    S.imp.rows[i].role = d.improleset.slice(ci + 1); S.imp.rows = impValidate(S.imp.rows); S.impRoleOpen = null;
    return render();
  }
  if(d.filter !== undefined){
    const i = d.filter.indexOf(':');
    setFilter(d.filter.slice(0, i), d.filter.slice(i + 1));
    S.fdOpen = null;                       /* a chosen filter closes the dropdown (§128) */
    return render();
  }
  if(d.sort !== undefined){
    /* asc → desc → off, per column */
    const i = +d.sort; const cur = S.sort[pageKey()];
    S.sort[pageKey()] = !cur || cur.i !== i ? {i, dir:'asc'} : cur.dir === 'asc' ? {i, dir:'desc'} : null;
    if(!S.sort[pageKey()]) delete S.sort[pageKey()];
    return render();
  }
  if(d.pg !== undefined){
    /* `key:action` — action is a page index, or 'prev' / 'next' (§127). The key
       holds no ':' (mod/sub/#seq), so split on the first. */
    const i = d.pg.indexOf(':'), key = d.pg.slice(0, i), act = d.pg.slice(i + 1);
    const cur = S.pg[key] || {page:0, size:PAGE_DEFAULT};
    let page = cur.page || 0;
    page = act === 'prev' ? page - 1 : act === 'next' ? page + 1 : +act;
    S.pg[key] = {page: Math.max(0, page), size: cur.size || PAGE_DEFAULT};
    return render();                       /* table() clamps to the last page */
  }
  if(d.pgddtoggle !== undefined){          /* §127 — open/close the size dropdown */
    S.pgOpen = S.pgOpen === d.pgddtoggle ? null : d.pgddtoggle;
    return render();
  }
  if(d.pgsize !== undefined){
    const i = d.pgsize.indexOf(':'), key = d.pgsize.slice(0, i), size = +d.pgsize.slice(i + 1);
    S.pg[key] = {page: 0, size};           /* a new page size starts at page one */
    S.pgOpen = null;                        /* a chosen size closes the dropdown */
    return render();
  }
  /* SA-11 A1 — READ-ONLY WHILE VIEWING AS SOMEBODY. Every edit sheet and every
     state-changing action is refused with one message; the things that are
     allowed are the ones that end or describe the session (`endviewas`, a
     toast, a Tal question). Filters, sorting, paging and navigation are reads
     and pass. The lock is here, in the one router every control goes through,
     rather than on each of ninety handlers. */
  if(S.viewAs && S.viewAs.scope === 'read' && (d.sheet !== undefined || (d.act !== undefined && !/^(endviewas|toast)/.test(d.act)) || d.do !== undefined)){
    toast(`Read-only while viewing as ${(USER_BY_ID[S.viewAs.id] || {}).name || 'this user'} — end the session to make changes`, 'warn'); return;
  }
  /* opening a sheet via a data-sheet button (incl. the generic "Issue a Refund")
     clears the per-row refund prefill, so only `startrefund` fills it (20 Sep 2026) */
  if(d.sheet !== undefined){ S.refundTxn = null; S.sheet = d.sheet; return render(); }
  /* THE SHARED STRIPE MODAL (`dsPayForm`) — "Add Card" opens it, its Card /
     US-bank tabs swap the picture, and it closes on the backdrop or the picture's
     own Save/Cancel row. A card comes back from Stripe's hosted form, so the modal
     is the whole add path — nothing is pushed to `CARDS` here. */
  if(d.payopen !== undefined){ S.payModal = true; S.payTab = 'card'; return render(); }
  if(d.paytab !== undefined){ S.payTab = d.paytab; return render(); }
  if(d.payclose !== undefined){ if(t.classList.contains('modal') && e.target !== t) return; S.payModal = false; return render(); }
  if(d.act !== undefined){ return doAction(d.act, t); }
  if(d.read && !S.read.includes(d.read)) S.read.push(d.read);
  if(d.back !== undefined){ return goBack(d.back); }
  if(d.go !== undefined){ return go(d.go, !!t.closest('.sidenav') && device.clientWidth >= 900); }
});

/* Every gated/destructive action funnels through `doAction`. A handler runs
   BEFORE the render that would replace an open sheet, so it can read the
   sheet's fields; returning 'keep' holds the sheet open (a required field is
   missing); anything else closes it — unless the handler opened a sheet of
   its own, which is what the `before` test protects. */
function doAction(key, el){
  const before = S.sheet;
  const name = key.split(':')[0];
  const fn = ACTIONS[key] || ACTIONS[name];
  let keep = false;
  if(fn){ keep = fn(key, el) === 'keep'; }
  else if(name === 'toast'){ toast(key.slice(6)); }
  else { S.confirm = null; }
  if(!keep && S.sheet === before) S.sheet = null;
  render();
}

/* ======================================================================
   THE VIEWPORT (frame) PICKER — prototype chrome. One document, three sizes,
   each keeping its true pixel width so the container queries resolve honestly.
   ====================================================================== */
const VP_SIZE = {mobile:[390, 844], tablet:[744, 1133], fluid:[1440, 900]};
const fitBox = document.getElementById('fit');
function fitFrame(){
  const vp = device.dataset.vp;
  const stage = fitBox.parentElement;
  const pct = document.getElementById('vpscale');
  if(vp === 'fluid'){
    device.style.transform = 'none';
    device.style.width = '100%';
    device.style.height = Math.max(520, window.innerHeight - stage.getBoundingClientRect().top) + 'px';
    fitBox.style.width = '100%';
    fitBox.style.height = device.style.height;
    if(pct) pct.textContent = Math.round(stage.clientWidth) + 'px';
    return;
  }
  const [w, h] = VP_SIZE[vp] || VP_SIZE.mobile;
  device.style.width = w + 'px';
  device.style.height = Math.min(h, Math.round(window.innerHeight * 0.8)) + 'px';
  const avail = stage.clientWidth - 8;
  const scale = Math.min(1, avail / w);
  device.style.transform = scale < 1 ? `scale(${scale})` : 'none';
  fitBox.style.width = Math.round(w * scale) + 'px';
  fitBox.style.height = Math.round(parseFloat(device.style.height) * scale) + 'px';
  if(pct) pct.textContent = scale < 1 ? Math.round(scale * 100) + '%' : '100%';
}
/* The prototype top bar is removed (Maryam, 8 Sep 2026: "remove the top black
   bar … we have only one device direction"), so the viewport picker, Reset and
   the wordmark it held are gone. Their wiring is guarded rather than deleted, so
   the device still boots at `fluid` and `fitFrame` runs, and the bar can be
   restored by markup alone if it is ever wanted again. */
document.getElementById('vp')?.addEventListener('click', e => {
  const b = e.target.closest('button[data-vp]');
  if(!b) return;
  document.querySelectorAll('#vp button').forEach(x => x.classList.toggle('on', x === b));
  device.dataset.vp = b.dataset.vp;
  S.nav = false;
  S.rowMenu = null;                       /* §125 — a resize invalidates its coords */
  render();
  fitFrame();
});
window.addEventListener('resize', fitFrame);
document.getElementById('reset')?.addEventListener('click', () => {
  S.mod = 'home'; S.sub = 'home'; S.id = null;
  S.nav = S.notif = S.acct = false; S.confirm = null; S.sheet = null;
  S.tal = false; S.thread = []; S.typing = false; S.editPerms = false; S.rowMenu = null;
  S.read = []; S.tab = {}; S.filter = {}; S.sort = {}; S.pg = {}; S.pgOpen = null; S.fdOpen = null;
  render();
});

/* the prototype-bar wordmark (present only if the bar is restored) */
const ptLogoEl = document.getElementById('ptLogo');
if(ptLogoEl) ptLogoEl.innerHTML = `<img src="${LOGO_K}" alt="TalentNext">`;

/* ---- boot ---- */
readHash();
render();
fitFrame();
if(!ASK_ON){ ASK_ON = true; setInterval(askRotate, ASK_ROT_MS); }
</script>
