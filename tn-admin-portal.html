const kv = rows => dsKv(rows);

/* DASHBOARD CHARTS (§120.1f). Two self-contained shapes on the `--dv-*` ramp.
   `donut(segs)` — segs are [label, value, fill]; the arc is drawn as a
   stroke-dasharray length off a rotated circle, the total sits in the hole, the
   figures ride the legend. `hbars(rows)` — rows are [label, valueText, barValue]
   (barValue is what sets the width, valueText is what the reader sees, so a bar
   can read a per-cent while its length tracks a count). The figure never leaves
   the graph. */
const DV = ['var(--dv-4)', 'var(--dv-3)', 'var(--dv-2)', 'var(--dv-hi)', 'var(--dv-gold)', 'var(--dv-1)'];
function donut(segs){
  const total = segs.reduce((n, s) => n + s[1], 0) || 1;
  const r = 44, C = 2 * Math.PI * r; let off = 0;
  const arcs = segs.filter(s => s[1] > 0).map(s => {
    const len = s[1] / total * C;
    const c = `<circle cx="58" cy="58" r="${r}" fill="none" stroke="${s[2]}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off += len; return c;
  }).join('');
  const leg = segs.map(s => `<div class="leg-row"><span class="leg-sw" style="background:${s[2]}"></span><span class="leg-l t-desc">${esc(s[0])}</span><b class="leg-v">${s[1]}</b></div>`).join('');
  return `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 116 116" aria-hidden="true">${arcs}</svg><div class="donut-c"><span class="t-h3">${total}</span><span class="t-caption">total</span></div></div><div class="donut-leg">${leg}</div></div>`;
}
function hbars(rows){
  const max = Math.max(...rows.map(r => r[2]), 1);
  return `<div class="hbars">${rows.map(r => {
    const w = Math.max(3, Math.round(r[2] / max * 100));
    return `<div class="hbar"><div class="hbar-top"><span class="hbar-l t-desc">${esc(r[0])}</span><b class="hbar-v">${r[1]}</b></div><div class="hbar-track"><i style="width:${w}%"></i></div></div>`;
  }).join('')}</div>`;
}

/* MULTI-LINE TREND CHART — a line per series (Figma "Charts", Maryam 21 Sep 2026:
   "i want this graph for the user by role, each role will have a line"). Built in
   our components at the reference's proportions: smooth dashed curves, a dot+label
   legend (matching the donut's legend), integer y-axis with hairline gridlines and
   month x-labels. Colour rides the green `--dv-*` ramp, never the brand red
   (categorical data-viz, DESIGN.md §3). The chart owns its own SVG labels, so
   fill/size are inline on the <text> (§63 §5). Uniform viewBox scaling — no
   `preserveAspectRatio:none` distortion.
   `series` are {name, color, pts:[..n values]}; `opts.labels` overrides the months.
   Catmull-Rom → cubic bezier for the smoothing (a monotone x grid, so no loops). */
function smoothPath(pts){
  if(pts.length < 2) return pts.length ? `M${pts[0].x},${pts[0].y}` : '';
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || pts[i + 1];
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}
/* A "nice" axis step for a range — 1/2/5 × 10^n — so gridline labels are round
   (3 for a 12-count axis, $500 for a $1,140 one) rather than 1140/5. */
function niceStep(range, target){
  const raw = (range || 1) / (target || 4);
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / pow;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow;
}
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* Shared HORIZONTAL grid: one VISIBLE hairline per value tick (the 0 / 10 / 20 / 30
   rows), plus the y-axis label for each (Maryam 21 Sep 2026: "the gaps between
   horizontal lines to 20px means the 0 10 20 30 rows lines"). The 20px gap is set
   by the plot height, not here — the plot is (ticks-1) × ROW_GAP tall, so
   consecutive tick rows sit ROW_GAP apart. NO vertical gridlines. */
const CHART_ROW_GAP = 32;               // viewBox-px between adjacent tick rows (Maryam 21 Sep 2026)
function chartGridH(x0, x1, ticks, Y, fmt){
  const lines = ticks.map(t => `<line x1="${x0}" y1="${Y(t).toFixed(1)}" x2="${x1}" y2="${Y(t).toFixed(1)}" stroke="var(--rule)" stroke-width="1"/>`).join('');
  const labels = ticks.map(t => `<text x="${x0 - 8}" y="${(Y(t) + 3).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--text-helper)">${esc(fmt(t))}</text>`).join('');
  return lines + labels;
}
/* opts: labels, aria, fmt (y-label formatter, e.g. money), dashed (default true),
   area (fill under each line, default false), rowGap (px between tick rows). */
function lineChart(series, opts = {}){
  const labels = opts.labels || MONTHS, n = labels.length;
  const fmt = opts.fmt || (v => String(v)), dashed = opts.dashed !== false;
  const rowGap = opts.rowGap || CHART_ROW_GAP;
  const W = 1000, padL = opts.padL || 40, padR = 14, padT = 14, padB = 28;
  const x0 = padL, x1 = W - padR, plotW = x1 - x0;
  const maxV = Math.max(1, ...series.flatMap(s => s.pts));
  const step = niceStep(maxV * 1.08, 7);
  const vmax = Math.max(step, Math.ceil(maxV * 1.05 / step) * step);
  const ticks = []; for(let t = 0; t <= vmax + 1e-6; t += step) ticks.push(t);
  const plotH = (ticks.length - 1) * rowGap, y1 = padT + plotH, H = y1 + padB;
  const X = i => x0 + (n === 1 ? 0 : i / (n - 1) * plotW);
  const Y = v => y1 - v / vmax * plotH;
  const grid = chartGridH(x0, x1, ticks, Y, fmt);
  const xlab = labels.map((l, i) => `<text x="${X(i).toFixed(1)}" y="${H - 9}" text-anchor="middle" font-size="8" letter-spacing=".4" fill="var(--text-helper)">${esc(String(l).toUpperCase())}</text>`).join('');
  const areas = opts.area ? series.map(s => {
    const pt = s.pts.map((v, i) => ({x: X(i), y: Y(v)}));
    return `<path d="${smoothPath(pt)} L${X(n - 1).toFixed(1)},${y1} L${x0.toFixed(1)},${y1} Z" fill="${s.color}" opacity=".08" stroke="none"/>`;
  }).join('') : '';
  const lines = series.map(s => `<path d="${smoothPath(s.pts.map((v, i) => ({x: X(i), y: Y(v)})))}" fill="none" stroke="${s.color}" stroke-width="2.5"${dashed ? ' stroke-dasharray="6 6"' : ''} stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const leg = series.map(s => `<span class="lc-chip"><span class="lc-dot" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('');
  return `<div class="lchart"><div class="lchart-leg">${leg}</div><svg class="lchart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || 'Trend by series')}">${grid}${areas}${lines}${xlab}</svg></div>`;
}
/* GROUPED BAR CHART — side-by-side bars per category, one group of bars per month
   (Figma "Charts", Maryam 21 Sep 2026). Same wrapper/legend/axis language as
   `lineChart`; green `--dv-*` ramp; rounded bar tops; chart owns its SVG labels.
   Same 20px tick-row spacing (the plot height is derived from the tick count). */
function barChart(series, opts = {}){
  const labels = opts.labels || MONTHS, n = labels.length;
  const fmt = opts.fmt || (v => String(v));
  const rowGap = opts.rowGap || CHART_ROW_GAP;
  const W = 1000, padL = opts.padL || 40, padR = 14, padT = 16, padB = 28;
  const x0 = padL, x1 = W - padR, plotW = x1 - x0;
  const maxV = Math.max(1, ...series.flatMap(s => s.pts));
  const step = niceStep(maxV * 1.08, 7);
  const vmax = Math.max(step, Math.ceil(maxV * 1.05 / step) * step);
  const ticks = []; for(let t = 0; t <= vmax + 1e-6; t += step) ticks.push(t);
  const plotH = (ticks.length - 1) * rowGap, y1 = padT + plotH, H = y1 + padB;
  const Y = v => y1 - v / vmax * plotH;
  const bandW = plotW / n, gw = Math.min(bandW * 0.6, 58), gap = 5;
  const bw = (gw - gap * (series.length - 1)) / series.length, rx = Math.min(bw / 2, 5);
  const grid = chartGridH(x0, x1, ticks, Y, fmt);
  const bars = labels.map((l, i) => {
    const gl = x0 + i * bandW + (bandW - gw) / 2;
    return series.map((s, j) => {
      const v = s.pts[i] || 0, h = v / vmax * plotH;
      return h <= 0 ? '' : `<rect x="${(gl + j * (bw + gap)).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${rx.toFixed(1)}" fill="${s.color}"/>`;
    }).join('');
  }).join('');
  const xlab = labels.map((l, i) => `<text x="${(x0 + i * bandW + bandW / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle" font-size="8" letter-spacing=".4" fill="var(--text-helper)">${esc(String(l).toUpperCase())}</text>`).join('');
  const leg = series.map(s => `<span class="lc-chip"><span class="lc-dot" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('');
  return `<div class="lchart"><div class="lchart-leg">${leg}</div><svg class="lchart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || 'By month')}">${grid}${bars}${xlab}</svg></div>`;
}
/* A gently-rising 12-point series ending EXACTLY at `end` (the role's real current
   count) — the intra-year shape is authored placeholder (§74; the seed has no
   headcount history, SA-03 E1), the December point is the true figure. A small
   deterministic wave (keyed on `seed`) separates roles whose endpoints coincide. */
function roleTrend(end, seed){
  const start = Math.max(0, end - (2 + (seed % 2)));
  const pts = [];
  for(let i = 0; i < 12; i++){
    const t = i / 11;
    let v = start + (end - start) * Math.pow(t, 0.8);
    v += Math.sin(i * 0.9 + seed * 1.3) * 0.22 + Math.cos(i * 0.5 + seed) * 0.12;
    pts.push(Math.max(0, +v.toFixed(2)));
  }
  pts[11] = end;
  return pts;
}
/* A growth ramp that works at ANY magnitude (a 20-count population as well as a
   3-count one): rises from ~18% of `end` up to `end`, ending EXACTLY at the real
   current figure — the December point is the truth, the intra-year climb is
   authored placeholder (§74; no dated history, SA-03 E1). The wobble is scaled to
   the magnitude (a per-cent), so a small line and a large one both read cleanly. */
function growthTrend(end, seed){
  const pts = [];
  for(let i = 0; i < 12; i++){
    const t = i / 11;
    let v = end * (0.18 + 0.82 * Math.pow(t, 0.9));
    v *= 1 + Math.sin(i * 0.8 + seed * 1.5) * 0.05;
    pts.push(Math.max(0, +v.toFixed(2)));
  }
  pts[11] = end;
  return pts;
}

/* THE REVENUE WATERFALL (Maryam, 11 Sep 2026: "I need this kind of revenue chart
   but according to our data ... please do not use green only"). A self-contained
   inline SVG — like `donut`/`hbars`, one function, no new stylesheet class — that
   walks a P&L: each REVENUE line is a floating bar that builds the running total
   up, a SUBTOTAL is a full bar from zero, each COST floats it back down. Every
   figure reconciles because it is read off ONE seed (TXNS): gross = the three
   `in` lines, net = gross − payouts − refunds.
   COLOUR is assigned by CONTENT off Maryam's four (11 Sep 2026): the caller hands
   each REVENUE bar a fill (the calendar pastels `--cal-reiv`/`--cal-iv`/`--cal-open`
   — violet / green / warm-grey); COST bars are red `#FF4626`; SUBTOTAL bars stay
   the neutral `--text-helper` grey so a total still reads as a total. All fills,
   sizes and weights are inline on the SVG (a chart owns its own labels, §63 §5).
   `rows` are {l:label, v:signed delta, k:'rev'|'cost'|'sub', c:fill for 'rev'}. */
function waterfall(rows){
  let run = 0;
  const bars = rows.map(r => {
    if(r.k === 'sub') return {...r, from:0, to:run, disp:run};
    const from = run; run += r.v;
    return {...r, from:Math.min(from, run), to:Math.max(from, run), disp:r.v};
  });
  const maxV = Math.max(...bars.map(b => b.to), 1) * 1.08;
  const W = 560, L = 150, RM = 72, rowH = 34, barH = 19, padT = 10, padB = 10;
  const H = bars.length * rowH + padT + padB;
  const plotL = L, plotR = W - RM, plotW = plotR - plotL;
  const x = v => plotL + v / maxV * plotW;
  const grid = [0, .25, .5, .75, 1].map(f => {
    const gx = (plotL + f * plotW).toFixed(1);
    return `<line x1="${gx}" y1="${padT}" x2="${gx}" y2="${H - padB}" stroke="var(--rule)" stroke-width="1"/>`;
  }).join('');
  const body = bars.map((b, i) => {
    const cy = padT + i * rowH + rowH / 2;
    const bx = x(b.from), bw = Math.max(2, x(b.to) - x(b.from));
    const fill = b.k === 'sub' ? 'var(--text-helper)' : b.k === 'cost' ? '#FF4626' : b.c;
    const sign = b.k === 'rev' ? '+' : b.k === 'cost' ? '−' : '';
    const lw = b.k === 'sub' ? 600 : 400;
    return `<rect x="${bx.toFixed(1)}" y="${(cy - barH / 2).toFixed(1)}" width="${bw.toFixed(1)}" height="${barH}" rx="2" fill="${fill}"/>`
      + `<text x="${L - 12}" y="${(cy + 4).toFixed(1)}" text-anchor="end" style="font-size:12px;font-weight:${lw};color:var(--text-secondary)">${esc(b.l)}</text>`
      + `<text x="${(x(b.to) + 8).toFixed(1)}" y="${(cy + 4).toFixed(1)}" style="font-size:12px;font-weight:600;color:var(--text-primary)">${sign}${money(Math.abs(b.disp))}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Revenue waterfall" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:${W}px;height:auto;margin-top:var(--s04)">${grid}${body}</svg>`;
}

/* THE TREND LINE CHART — the platform's OWN `perfChart` line, reused (Maryam,
   11 Sep 2026: "you could have used this component instead of what you created").
   `perfChart` lives in hifi's views.js and is candidate-specific (perfParts, the
   13-chapter %, the score ring), so it does not port whole — but its LOOK is all
   in the design-system `.perf-*` CSS the admin already links: `.perf-line` /
   `.perf-dot` / `.perf-avg-line` are one green (`--support-success-ink`), the
   lowest point flips red (`.perf-lo`) and the highest carries a halo (`.perf-hi`).
   So this is that component's markup, generalised to any series: straight-segment
   line, a dashed benchmark, y labels through `fmt`, x labels from `axis`. No
   inline colour — the DS classes paint it.
   `data` numbers, `axis` labels, `target` the dashed benchmark, `fmt` the y/label
   formatter (money or plain). Series are authored placeholder (§74). */
function trendChart(data, {axis, target, fmt}){
  fmt = fmt || (v => String(v));
  const W = 900, H = 180, L = 44, R = 12, T = 12, B = 26;
  const IW = W - L - R, IH = H - T - B, min = 0;
  const max = Math.max(...data, target || 0) * 1.14 || 1;
  const n = data.length;
  const x = i => L + (n > 1 ? i * (IW / (n - 1)) : IW / 2);
  const y = v => T + IH - ((v - min) / (max - min)) * IH;
  const lo = data.indexOf(Math.min(...data)), hi = data.indexOf(Math.max(...data));
  const path = data.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const grid = [0, .25, .5, .75, 1].map(f => { const v = min + (max - min) * f; return `
    <line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--rule)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <text class="perf-yl" x="${L - 8}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${fmt(Math.round(v))}</text>`; }).join('');
  const avg = target != null ? `<line class="perf-avg-line" x1="${L}" x2="${W - R}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>` : '';
  const dots = data.map((v, i) => { const call = i === lo ? ' perf-lo' : i === hi ? ' perf-hi' : '';
    return `${call ? `<circle class="perf-halo${call}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="9"/>` : ''}<circle class="perf-dot${call}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4"/>`; }).join('');
  const xl = axis.map((l, i) => `<text class="perf-xl" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`).join('');
  return `<div class="perf-plot"><svg class="perf-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend">
    ${grid}${avg}<path class="perf-line" d="${path}" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${dots}${xl}</svg></div>`;
}
/* AUTHORED weekly new-lead counts (§74) — the seed's LEADS carry no capture date,
   so the six-week trend the wireframe's "New leads" card shows is a placeholder;
   the total and the start/end steps are read off it. */
const LEADS_TREND = { axis:['Jun 30', 'Jul 7', 'Jul 14', 'Jul 21', 'Jul 28', 'Aug 4'], data:[19, 26, 23, 33, 29, 39] };
function newLeadsCard(){
  const d = LEADS_TREND, total = d.data.reduce((a, b) => a + b, 0);
  const avg = Math.round(total / d.data.length);
  return `
    <div class="chart-read" style="margin:0 0 var(--s04)"><span class="v">${total} leads</span><span class="k">${esc(d.axis[0])} – ${esc(d.axis[d.axis.length - 1])} · ${d.data[0]}→${d.data[d.data.length - 1]} a week</span></div>
    ${trendChart(d.data, {axis:d.axis, target:avg})}`;
}

/* THE DATA TABLE — always inside `.tbl-wrap`, the one component that scrolls
   sideways. `cols` are [{label, num?, sort?, act?}] and `rows` are
   {cells:[…], go?, sv?:[…]} — `sv` is a row's raw sort values where the cell's
   text is not the thing to order by (a tag, a two-line cell).

   EVERY COLUMN SORTS unless it says `sort:false` or is the action cell. The
   head carries `data-sort=i`; the router flips `S.sort[page]` between asc, desc
   and off; the active head shows a chevron (§120.2). Sorting reads the cell's
   text with the tags stripped and compares as numbers when both sides parse as
   one — `$1,250` and `4.9 ★` both do — so a money column orders by amount. */
/* THE ROW-SELECT CHECKBOX (Maryam, 15 Sep 2026). A role="checkbox" BUTTON, not a
   native <input>: the whole cell is one click target that (a) never navigates the
   clickable row — the router matches its `data-sel`/`data-selall` before the row's
   `data-go`, the same way the kebab does — and (b) is a pure function of `S.sel`,
   redrawn every render, so there is no DOM checked-state to fall out of sync
   (trap 9's spirit). `on` fills accent and shows the tick; `ind` is the header's
   some-but-not-all dash; empty otherwise. Styled admin-local (`#admin-tbl-sel`)
   in the platform's square-radius-0 language, the DS `.cbx` being a labelled form
   row too heavy for a cell. */
const selBtn = (attr, on, ind, label) =>
  `<button type="button" class="tbl-cb${on ? ' on' : ind ? ' ind' : ''}" role="checkbox" aria-checked="${on ? 'true' : ind ? 'mixed' : 'false'}"${label ? ` aria-label="${label}"` : ''} ${attr}><span class="tbl-cb-b">${on ? I.check : ''}</span></button>`;
function table(cols, rows, opts){
  opts = opts || {};
  const st = S.sort[pageKey()];
  const head = cols.map((c, i) => {
    const cls = [c.num ? 'num' : '', c.act ? 'tbl-act' : ''].filter(Boolean).join(' ');
    /* TABLE HEADERS ARE NOT CLICKABLE (Maryam, 13 Sep 2026: "table headers should
       not be clickable"). Click-to-sort is off — no `data-sort`, no chevron; the
       `S.sort` machinery stays dormant (st is always undefined, so rows keep their
       given order). Flip this back to `!c.act && c.sort !== false && c.label` to
       restore sorting. */
    const sortable = false;
    const on = st && st.i === i;
    return `<th${cls ? ` class="${cls}"` : ''}${sortable ? ` data-sort="${i}" aria-sort="${on ? (st.dir === 'desc' ? 'descending' : 'ascending') : 'none'}"` : ''}>${esc(c.label)}${on ? `<svg viewBox="0 0 24 24" aria-hidden="true">${inner(st.dir === 'desc' ? 'chevDown' : 'chevUp')}</svg>` : ''}</th>`;
  }).join('');
  const ordered = sortRows(rows, st);
  /* STABLE COLUMN WIDTHS ACROSS PAGES (Maryam 12 Sep 2026). A plain
     `table-layout:auto` table sizes its columns to whichever rows are on the
     current page, so paginating a list makes the columns jump width page to
     page. We size them ONCE off the whole dataset (`ordered`, every row, not the
     visible slice) and pin them with `table-layout:fixed` + a `<colgroup>`, so
     every page draws the same grid — the page-1 layout, held steady. Widths are
     a text-length estimate (longest line in the column, header included), so
     they stay proportional to the content rather than going equal-width; the
     table keeps its sideways scroll (`width:auto; min-width:100%`) so a wide
     table behaves exactly as before, just without the per-page reflow. */
  const colW = cols.map((c, i) => {
    if(c.act) return 56;                                   // the kebab column
    const strip = s => String(s == null ? '' : s)
      .replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p|li|tr)>/gi, '\n')
      .replace(/<[^>]*>/g, '').replace(/&[a-z]+;/gi, 'x').trim();
    const lineMax = s => strip(s).split('\n').reduce((m, l) => Math.max(m, l.trim().length), 0);
    let body = 0;
    for(const r of ordered) body = Math.max(body, lineMax((r.cells || [])[i]));
    const sortable = !c.act && c.sort !== false && c.label;
    const head = String(c.label || '').length * 7.7 + (sortable ? 18 : 0);
    const w = Math.max(body * 6.7, head) + 16 /* cell padding */ + 4;
    return Math.round(Math.min(Math.max(w, 72), 340));
  });
  const colSum = colW.reduce((s, w) => s + w, 0);
  /* PAGINATION (§127, Maryam 7 Sep 2026). A table shows one page at a time —
     PAGE_DEFAULT rows, and the reader can change that. State is `S.pg[key]`,
     keyed by page AND a per-render table index (`TBL_SEQ`) so two tables on one
     page do not share a page number. The bar is skipped when everything already
     fits in the smallest page (`total <= PAGE_MIN`), and opts.paginate:false
     turns it off for a table that should always show whole. */
  const total = ordered.length;
  const key = pageKey() + '#' + (TBL_SEQ++);
  /* ROW SELECTION (Maryam, 15 Sep 2026: "on all super admin portal tables I need
     a checkbox on each row and ... the header row for select all"). Every table
     grows a leading select column unless `opts.select === false`. A row's key is
     its record id / route / first-cell text (content-stable, so selection
     survives pagination and re-sort), held in `S.sel[key]` — keyed exactly like
     `S.pg`, so two tables on a page select independently. `TBL_ROWKEYS[key]` is
     the full ordered key list, which the select-all click handler reads (it has
     no `ordered` of its own). Select-all covers the WHOLE dataset, every page. */
  /* CHECKBOXES ONLY ON TABLES THAT HAVE ROW ACTIONS (Maryam, 15 Sep 2026:
     "on tables ... with no action item please do not add the checkboxes").
     Bulk-select earns its column only where there is something to act on — the
     kebab `act` column. A read-only table (no actions) draws none. `opts.select`
     still forces it either way when a caller needs to. */
  const hasAct = cols.some(c => c.act);
  const doSel = ('select' in opts) ? (opts.select !== false) : hasAct;
  const selMap = doSel ? (S.sel[key] = S.sel[key] || {}) : {};
  let selHead = '', selW = 0, rkMap = null;
  if(doSel){
    const rk = (r, i) => r.id != null ? String(r.id) : (r.go || cellText(r.cells[0]) || ('#' + i));
    const keys = ordered.map(rk);
    TBL_ROWKEYS[key] = keys;
    /* BULK ACTION BAR — a table that names a `selectKind` (a KINDS key) registers
       itself so the floating action bar knows which record actions apply to its
       selected rows (Maryam, 15 Sep 2026). Rows of such a table must carry `id`.
       A table with no KIND may instead pass `opts.bulk`, a `(ids) => [[icon, label,
       attr, cls?], …]` function that returns its own bulk buttons — the same bar,
       driven by the caller rather than by a KIND's handlers (e.g. Transactions'
       Download All / Download as zip, which act on receipts, not records). */
    if(typeof opts.selectKind === 'string' || typeof opts.bulk === 'function') SEL_TABLES.push({key, kind: opts.selectKind, bulk: opts.bulk});
    rkMap = new Map(); ordered.forEach((r, i) => rkMap.set(r, keys[i]));
    const selCount = keys.reduce((n, k) => n + (selMap[k] ? 1 : 0), 0);
    const allOn = keys.length > 0 && selCount === keys.length, someOn = selCount > 0 && !allOn;
    selHead = `<th class="tbl-sel">${selBtn(`data-selall="${key}"`, allOn, someOn, 'Select all rows')}</th>`;
    selW = 34;
  }
  const paginate = opts.paginate !== false && total > PAGE_MIN;
  let shown = ordered, pgBar = '';
  if(paginate){
    const cur = S.pg[key] || {};
    const size = cur.size || PAGE_DEFAULT;
    const pages = Math.max(1, Math.ceil(total / size));
    const page = Math.min(Math.max(0, cur.page || 0), pages - 1);
    shown = ordered.slice(page * size, page * size + size);
    pgBar = pagination(key, total, page, size, pages);
  }
  const body = shown.map(r => {
    const rk = doSel ? rkMap.get(r) : null, on = doSel && !!selMap[rk];
    const selCell = doSel ? `<td class="tbl-sel">${selBtn(`data-sel="${key}" data-selrow="${esc(rk)}"`, on, false, 'Select row')}</td>` : '';
    const trCls = [r.go ? 'clk' : '', on ? 'sel' : ''].filter(Boolean).join(' ');
    return `<tr${trCls ? ` class="${trCls}"` : ''}${r.go ? ` data-go="${esc(r.go)}"` : ''}>${selCell}${
      r.cells.map((c, i) => {
        const col = cols[i] || {};
        const cls = [col.num ? 'num' : '', col.act ? 'tbl-act' : ''].filter(Boolean).join(' ');
        return `<td${cls ? ` class="${cls}"` : ''}>${c}</td>`;
      }).join('')}</tr>`;
  }).join('');
  /* COLUMNS DIVIDE THE FULL WIDTH (Maryam, 15 Sep 2026: "the column take the
     width accordingly ... divide the space accordingly"). The colgroup is
     PROPORTIONAL (percentages of the total), so `width:100%` always fills the
     container — the columns keep their content-proportional ratios (stable page
     to page) but stretch to the edge rather than leaving space on the right. The
     `min-width` (the px sum) still lets `.tbl-wrap` scroll a genuinely-too-narrow
     table sideways. */
  const allW = (doSel ? [selW] : []).concat(colW);
  const totalW = allW.reduce((s, w) => s + w, 0) || 1;
  const cg = `<colgroup>${allW.map(w => `<col style="width:${(w / totalW * 100).toFixed(3)}%">`).join('')}</colgroup>`;
  return `<div class="tbl-wrap"><table class="tbl" style="table-layout:fixed;width:100%;min-width:${totalW}px">${cg}<tr>${selHead}${head}</tr>${body}</table></div>${pgBar}`;
}

/* THE PAGINATION BAR — §127. Rows-per-page on the left (a set of sizes, the
   active one filled), the range in the middle, prev / page-numbers / next on the
   right. The controls reuse `.btn` so §63 owns their type; this file only writes
   the numbers and the data hooks. Page numbers window to first · current±1 ·
   last with ellipses once there are more than seven pages. */
const PAGE_DEFAULT = 5, PAGE_MIN = 5, PAGE_SIZES = [5, 10, 25, 50];
let TBL_SEQ = 0;
let TBL_ROWKEYS = {};   /* per-render: table key -> its full ordered row-key list, read by the select-all handler */
let SEL_TABLES = [];    /* per-render: [{key, kind}] for tables that opted into the bulk action bar */
function pageWindow(page, pages){
  if(pages <= 7) return Array.from({length: pages}, (_, i) => i);
  const out = [0];
  const start = Math.max(1, page - 1), end = Math.min(pages - 2, page + 1);
  if(start > 1) out.push('…');
  for(let i = start; i <= end; i++) out.push(i);
  if(end < pages - 2) out.push('…');
  out.push(pages - 1);
  return out;
}
function pagination(key, total, page, size, pages){
  const from = page * size + 1, to = Math.min(total, (page + 1) * size);
  /* OUR dropdown, never a native <select> (DESIGN.md §3). The trigger shows the
     size, the menu opens UPWARD (the bar sits at the table's foot, so there is
     room above and the Tal dock never covers it); `S.pgOpen` is the open one. */
  const open = S.pgOpen === key;
  const sizeDd = `<div class="pgn-dd${open ? ' on' : ''}">
    <button class="pgn-dd-t" data-pgddtoggle="${key}" aria-haspopup="listbox" aria-expanded="${open ? 'true' : 'false'}">${size}<svg class="pgn-dd-cx" viewBox="0 0 24 24" aria-hidden="true">${inner('chevDown')}</svg></button>
    <div class="pgn-dd-menu" role="listbox">${PAGE_SIZES.map(s =>
      `<button class="pgn-dd-opt${s === size ? ' on' : ''}" role="option" aria-selected="${s === size ? 'true' : 'false'}" data-pgsize="${key}:${s}">${s}</button>`).join('')}</div>
  </div>`;
  const nums = pageWindow(page, pages).map(n => n === '…'
    ? `<span class="pgn-gap">…</span>`
    : `<button class="btn btn-sm noic ${n === page ? 'btn-p' : 'btn-g'}" data-pg="${key}:${n}"${n === page ? ' aria-current="page"' : ''}>${n + 1}</button>`).join('');
  return `<div class="pgn">
    <div class="pgn-size"><span class="pgn-lbl">Rows per page</span>${sizeDd}</div>
    <div class="pgn-info">${from}–${to} of ${total}</div>
    <div class="pgn-nav">
      <button class="btn btn-g btn-sm pgn-arrow" data-pg="${key}:prev"${page === 0 ? ' disabled' : ''} aria-label="Previous page">${I.chevLeft}</button>
      <div class="pgn-nums">${nums}</div>
      <button class="btn btn-g btn-sm pgn-arrow" data-pg="${key}:next"${page >= pages - 1 ? ' disabled' : ''} aria-label="Next page">${I.chevRight}</button>
    </div>
  </div>`;
}
const cellText = h => String(h == null ? '' : h).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
function sortRows(rows, st){
  if(!st) return rows;
  const i = st.i, dir = st.dir === 'desc' ? -1 : 1;
  const val = r => (r.sv && r.sv[i] !== undefined) ? r.sv[i] : cellText(r.cells[i]);
  const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return /^[\s$−\-]*\d/.test(String(v)) && !isNaN(n) ? n : null; };
  return rows.slice().sort((a, b) => {
    let x = val(a), y = val(b);
    const nx = num(x), ny = num(y);
    if(nx !== null && ny !== null){ x = nx; y = ny; } else { x = String(x).toLowerCase(); y = String(y).toLowerCase(); }
    return (x < y ? -1 : x > y ? 1 : 0) * dir;
  });
}

/* THE ROW'S ACTIONS — ONE KEBAB THAT OPENS A MENU (§125, Maryam 7 Sep 2026).
   Each entry is [icon, label, attr] where attr is the control's `data-*`; the
   old row of quiet icon buttons is now a single `overflow` trigger and the
   actions are labelled rows in a dropdown. `ROWMENU_SEQ` (reset each render)
   gives every menu a stable id so `S.rowMenu` can hold the open one; the id is
   deterministic across renders because the render order is. The item keeps its
   own `data-*`, so a press still runs the action; the router closes the menu.
   The row is `tr.clk` and opens the record; the trigger and items sit nearer in
   the router's `closest`, so a press on one never also opens the row. */
let ROWMENU_SEQ = 0;
const rowActs = acts => {
  acts = (acts || []).filter(Boolean);
  if(!acts.length) return '';
  const id = 'rm' + (ROWMENU_SEQ++);
  const open = S.rowMenu === id;
  const items = acts.map(([icon, label, attr]) =>
    `<button class="rowmenu-i" role="menuitem" ${attr}><span class="rowmenu-ic">${I[icon] || ic(icon)}</span>${esc(label)}</button>`).join('');
  /* `.on` rides the LIST, not the wrapper — `placeRowMenu` lifts the open list
     out of `.rowmenu` into `.main`, where a wrapper-scoped state would not reach
     it (§125). */
  return `<div class="rowmenu">
    <button class="btn btn-g btn-sm rowmenu-t" data-rowmenu="${id}" aria-haspopup="menu" aria-expanded="${open ? 'true' : 'false'}" title="Actions" aria-label="Actions">${I.overflow}</button>
    <div class="rowmenu-list${open ? ' on' : ''}" role="menu" data-rmlist="${id}">${items}</div>
  </div>`;
};
const ACT_COL = {label:'Actions', act:true};

/* THE BLACK CARD — §75, and it is the WHOLE recipe (DESIGN.md §3, memory).
   `.sec.dark-card`, a `.dc-hd` head row that takes ONE of a `.dc-when` time or
   a `.dc-act` control, then the content as direct children — `.kv` rows, a
   paragraph, a `.crow` — and a `.btn-row` at the foot when the card has things
   to do. That is the gallery's own markup (#signature, "one class, and it is
   the whole recipe"). The first admin build wrapped the rows in a `.dc-lines`
   div, a class no layer states, which is why Maryam read the card as having
   "no fine content structuring": the rows were unstyled on black. The
   `body`+`actions` shape (`.dc-b` > content + `.dc-a`) is §75's other body, for
   a sentence with a button beside it. */
const darkCard = ({title, when, act, head, body, foot, actions, cls}) => `
  <section class="sec dark-card${cls ? ' ' + cls : ''}">
    <div class="dc-hd">
      <div class="dc-hd-r"><h2 class="dc-t">${title}</h2>
        ${head ? head
          : when ? `<span class="dc-when">${ic('time')}${when}</span>`
          : act ? `<button class="btn btn-sm noic dc-act" ${act.attr || ''}>${act.label} ${I.arrowRight}</button>`
          : ''}</div>
    </div>
    ${actions
      ? `<div class="dc-b">${body || ''}<div class="dc-a">${actions}</div></div>`
      : (body || '')}
    ${foot ? `<div class="btn-row">${foot}</div>` : ''}
  </section>`;

/* ALIGNED (14 Sep 2026): delegates to the shipped `dsNote`. Same markup and the
   admin's own kinds ('', warn, err, succ) map identically; the arg order flips
   ((kind,title,body) here, (body,kind,title) there) and is adapted below, so no
   caller changes. The admin never used 'acc', so the one icon that differed
   (star vs the source's info) has no call site. */
const note = (kind, title, body) => dsNote(body, kind, title);

const emptyState = (icon, title, sub) => `<div class="empty">${ic(icon)}<span class="t">${esc(title)}</span>${sub ? `<span class="s">${esc(sub)}</span>` : ''}</div>`;

/* A PERSON ROW — the design system's `.mem`, an initials disc, a name and a
   line under it, an optional trailing tag. */
const memRow = (name, sub, trail, go, img) => `
  <${go ? 'button' : 'div'} class="mem${go ? ' clk' : ''}"${go ? ` data-go="${esc(go)}"` : ''}>${img ? `<span class="av mem-av mem-ph"><span class="av-ph"><img src="${img}" alt="" loading="lazy"></span></span>` : av(name)}
    <span class="mem-b"><span class="mem-n">${esc(name)}</span><span class="mem-m">${sub}</span></span>

/* EACH MEMBER MAY BE TAKING A DIFFERENT COURSE (Maryam, 15 Sep 2026). Authored
   placeholder (§74 — the seed has no per-member course): a stable name-hash
   spreads the live catalogue courses across the roster so the column varies. */
function memCourse(m){
  const live = COURSES.filter(c => c.status === 'live');
  if(!live.length) return '';
  let h = 0; for(const ch of m.name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return live[h % live.length].name;
}

/* A NAVIGATION ROW — the design system's `.tile.clk.gcard`, a leading icon, a

const navRow = (icon, title, sub, go, cta) => `
  <button class="tile clk gcard" data-go="${esc(go)}">

    ${cta ? `<span class="row-cta">${esc(cta)}</span>` : ''}
    <svg class="tile-arrow" viewBox="0 0 24 24">${inner('arrowRight')}</svg>
  </button>`;

/* A CARD ROW — `.cardrow`: a mark, a title line with tags, a description, and
   the actions on the right. Used where a record has more to say than a table
   cell holds (a payout, a refund, a flag). */
const cardRow = (icon, title, desc, acts) => `
  <div class="cardrow">
    <span class="cardrow-ic">${ic(icon)}</span>
    <span class="cardrow-b"><span class="cardrow-t">${title}</span>

/* A TOAST — the transient confirmations the source shows on cosmetic actions.
   Built from the design system's `.note`; positioned by the chrome host. */
function toast(msg, kind){
  const host = device.querySelector('#toasts');
  if(!host) return;
  const el = document.createElement('div');
  el.innerHTML = note(kind === 'ok' ? 'succ' : kind || 'succ', '', esc(msg));
  const node = el.firstElementChild;
  host.appendChild(node);
  setTimeout(() => { node.style.transition = 'opacity .3s'; node.style.opacity = '0';
    setTimeout(() => node.remove(), 300); }, 2400);
}

/* THE AUDIT LOG IS WRITTEN, NOT ONLY READ. Every state-changing action in the
   portal calls `audit()` so the immutable record on System & Audit shows what
   the signed-in admin just did — the source's own rule ("written to the audit
   log") made true rather than said. */
function audit(act, obj, mod, sev, diff){
  /* `diff` is {from, to} — the BEFORE and AFTER state (SA-15 A2), so a line can
     be inspected rather than only read. Callers that change one value pass it;
     the audit line sheet (`SHEETS.auditline`) draws it as two `.kv` rows. While
     a View As session is open (SA-11) the line says so, so an action taken in
     somebody's name is never mistaken for the admin's own. */
  const va = S.viewAs && USER_BY_ID[S.viewAs.id];
  AUDIT.unshift({when:'Just now', who:ME.name, role:'Super Admin', obj, act, mod: mod || MOD_BY_K[S.mod].t,
    cat: va ? `Admin action · viewing as ${va.name}` : 'Admin action', sev: sev || 'notice', ip:'10.2.14.2',
    from: diff ? diff.from : undefined, to: diff ? diff.to : undefined});
}

/* NO INLINE RULING NOTES ON MODULE PAGES — Maryam, 7 Sep 2026: "remove all
   such sections like 'SA-09 · Account actions — Open ruling' … this is not the
   info a user would want to see." This REVERSES the earlier rule that a page
   waiting on a ruling drew one `ruling('SA-nn')` `.note`; the open/blocked
   branches still live on the Rulings Register (`home/rulings`, in the Dashboard
   sub-nav), which is the one place they belong — they are not surfaced on the
   working pages any more. Kept as a no-op so the call apparatus and the SA_CASES
   data behind the register are untouched; a stray call renders nothing. */
function ruling(){ return ''; }
/* the case's status as the admin's plain coloured text (§126) */
const saTag = st => tag(st === 'confirmed' ? 'confirmed' : st === 'open' ? 'requested' : 'blocked', cap(st));

/* THE ACTIONS TABLE — declared here, before the module views, because each
   module registers its gated/destructive actions into it (`ACTIONS['deact']
   = …`). Every action funnels through `doAction`; the confirmation sheet's
   button carries `data-do`, a plain control `data-act`. Cosmetic actions
   toast; state-changing ones mutate a record and re-render. */
const ACTIONS = {
  logout: () => { S.confirm = null; if(S.viewAs) ACTIONS.endviewas(); S.signedIn = false; S.auth = 'login'; S.nav = S.notif = S.acct = false; S.tal = false; }
};
/* DETAIL_LABEL — the record name a detail page puts in the last breadcrumb
   crumb. Declared up here so `render()` can always clear it. */
let DETAIL_LABEL = null;

/* THE EDITING SHEETS — a module registers its own (the reject-with-reason
   sheet); the record engine's `rec:` sheets are built on demand by `recSheet`.
   An entry is an object, or a function of `S.id` for a record-specific one. */
const SHEETS = {};

/* ======================================================================
   THE RECORD ENGINE — create, edit and delete for every kind of record

   Maryam, 4 Sep 2026: "since it is super admin then there should have been
   crud operations, it's like data were just added". One engine rather than a
   sheet per module: a KIND declares its fields, how to make a record from a
   form, how to write a form back onto a record and how to remove one. The
   design system's `.sheet` is the form (§sheet, "rises from the bottom on a
   phone, centres at 600px and up"), the `.conf` dialog gates every delete
   (memory: confirm every destructive action), and the same three attributes
   drive all of it:

     data-sheet="rec:<kind>:new|<id>"   open the form, blank or filled
     data-act="save:<kind>:new|<id>"    read the form, validate, write
     data-act="askdel:<kind>:<id>"      confirm, then  del:<kind>:<id>

   A FIELD is {k, l, t, opts?, req?, ph?, help?}: t is text | email | number |
   date | select | textarea | checks. `checks` is a list of `.cbx` boxes and
   reads back as an array — that is how roles stack on an account.

   THE FORM IS READ FROM THE DOM ON SAVE, and it is the one place this file
   reads DOM state — the sheet is a form, and a form's state is its fields.
   `doAction` runs the handler before the render that would replace the sheet,
   so the inputs are still there to read; a handler returning 'keep' holds the
   sheet open (a required field is empty) instead of closing it.
   ====================================================================== */
const KINDS = {};
const newId = (pfx, list) => { let n = list.length + 1; while(list.some(x => x.id === pfx + n)) n++; return pfx + n; };
const today = () => { const d = new Date(); return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}-${d.getFullYear()}`; };

/* OUR form dropdown for a sheet/settings SELECT field — never a native <select>
   anywhere in this portal (DESIGN.md §3, Maryam 11 Sep 2026: no system dropdowns
   on the Super Admin portal). It is DOM-only: a `.fdd.fdd-form` with a hidden
   `[data-f]` input that `readForm`/`readPageForm` read UNCHANGED, plus a
   full-width trigger and an option menu. `data-formddtoggle`/`data-formddset`
   are handled in the NON-rendering click listener, because the form is read from
   the DOM on save — a render would rebuild it and lose every other in-progress
   field. Reuses the existing `.fdd*` classes (like `impRoleCell`), so no new CSS. */
/* A dropdown option is `[value, label]` or, when it should carry a face,
   `[value, label, imgSrc]` — the third element renders a round avatar before the
   label, in both the trigger and the menu (Maryam, 15 Sep 2026: leader options
   show their photo). Opt-in: an option with no third element is text-only. */
const fddAv = src => src ? `<span class="fdd-av"><img src="${src}" alt="" loading="lazy"></span>` : '';
function formDd(f, val){
  const opts = (typeof f.opts === 'function' ? f.opts() : f.opts).map(o => Array.isArray(o) ? o : [o, o]);
  const match = opts.find(o => String(o[0]) === String(val));
  /* A select that carries a placeholder (`f.ph`) starts EMPTY — no option is
     auto-selected and the hidden input holds '' — so a REQUIRED select reads as
     blank and can gate the submit button (Maryam, 20 Sep 2026). Without `f.ph` the
     first option stands in as the default, exactly as before (backward-compatible:
     selects have never set `ph`). */
  const cur = match || (f.ph ? null : (opts[0] || ['', '']));
  const cv = cur ? cur[0] : '';
  const cl = cur ? cur[1] : f.ph;
  const ci = cur ? cur[2] : undefined;
  return `<label class="f"><span class="lbl">${esc(f.l)}${f.req ? ' <span class="req-star" aria-hidden="true">*</span>' : ''}</span>
    <div class="fdd fdd-form" style="display:block">
      <input type="hidden" data-f="${f.k}" value="${esc(cv)}">
      <button type="button" class="fdd-t" data-formddtoggle aria-haspopup="listbox" aria-expanded="false" style="width:100%;justify-content:space-between;min-height:40px">
        <span class="fdd-val${cur ? '' : ' fdd-ph'}">${fddAv(ci)}${esc(cl)}</span>
        <svg class="fdd-cx" viewBox="0 0 24 24" aria-hidden="true">${inner('chevDown')}</svg></button>
      <div class="fdd-menu" role="listbox" style="left:0;right:0;max-height:260px;overflow-y:auto">${opts.map(([ov, ol, oimg]) =>
        `<button type="button" class="fdd-opt${String(ov) === String(cv) ? ' on' : ''}" role="option" aria-selected="${String(ov) === String(cv) ? 'true' : 'false'}" data-formddset="${esc(ov)}">${fddAv(oimg)}${esc(ol)}</button>`).join('')}</div>
    </div></label>`;
}
/* OUR DATE PICKER — replaces the native <input type="date"> so no browser/OS
   picker shows on the Super Admin portal (Maryam, 15 Sep 2026: "this needs to be
   in our ui"). A trigger carrying the calendar icon opens a compact month grid on
   the RIGHT, under the icon. DOM-only (never render(), which reads the form back
   from the DOM): picking writes the hidden `data-f` input as ISO yyyy-mm-dd — the
   exact value the native input stored — and the trigger's MM-DD-YYYY label, then
   closes. The viewed month rides in a `data-ym` attribute, not in S. */
const DP_MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const dpPad = n => String(n).padStart(2, '0');
const dpFmt = iso => { if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return ''; const [y, m, d] = iso.split('-'); return `${m}-${d}-${y}`; };
function dateGrid(key, y, m /* 0-11 */, sel){
  const start = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  const t = new Date(), tIso = `${t.getFullYear()}-${dpPad(t.getMonth() + 1)}-${dpPad(t.getDate())}`;
  let cells = '';
  for(let i = 0; i < start; i++) cells += '<span class="dcal-x"></span>';
  for(let d = 1; d <= days; d++){
    const iso = `${y}-${dpPad(m + 1)}-${dpPad(d)}`;
    cells += `<button type="button" class="dcal-d${iso === sel ? ' on' : ''}${iso === tIso ? ' today' : ''}" data-dateset="${key}:${iso}">${d}</button>`;
  }
  return `<div class="dcal" data-ym="${y}-${dpPad(m + 1)}">
    <div class="dcal-h">
      <button type="button" class="dcal-nav" data-datenav="${key}:-1" aria-label="Previous month"><svg viewBox="0 0 24 24" aria-hidden="true">${inner('chevLeft')}</svg></button>
      <span class="dcal-m">${DP_MON[m]} ${y}</span>
      <button type="button" class="dcal-nav" data-datenav="${key}:1" aria-label="Next month"><svg viewBox="0 0 24 24" aria-hidden="true">${inner('chevRight')}</svg></button>
    </div>
    <div class="dcal-wd">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(w => `<span>${w}</span>`).join('')}</div>
    <div class="dcal-grid">${cells}</div>
  </div>`;
}
function formDate(f, val){
  const iso = /^\d{4}-\d{2}-\d{2}$/.test(val || '') ? val : '';
  const now = new Date();
  const [vy, vm] = iso ? iso.split('-').map(Number) : [now.getFullYear(), now.getMonth() + 1];
  return `<label class="f"><span class="lbl">${esc(f.l)}${f.req ? ' <span class="req-star" aria-hidden="true">*</span>' : ''}</span>
    <div class="fdate" style="display:block">
      <input type="hidden" data-f="${f.k}" value="${esc(iso)}">
      <button type="button" class="inp fdate-t" data-datetoggle="${f.k}" aria-haspopup="dialog" aria-expanded="false" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:var(--s03);min-height:40px">
        <span class="fdate-val${iso ? '' : ' fdate-ph'}">${iso ? dpFmt(iso) : (f.ph || 'Select a date')}</span>
        <svg class="fdate-ic" viewBox="0 0 24 24" aria-hidden="true">${inner('calendar')}</svg></button>
      <div class="fdate-pop">${dateGrid(f.k, vy, vm - 1, iso)}</div>
    </div></label>`;
}
function fieldHtml(f, v){
  const def = typeof f.def === 'function' ? f.def() : f.def;
  const val = v == null ? (def == null ? '' : def) : v;
  if(typeof f.opts === 'function') f = Object.assign({}, f, {opts:f.opts()});
  const lbl = `<span class="lbl">${esc(f.l)}${f.req ? ' <span class="req-star" aria-hidden="true">*</span>' : ''}</span>`;
  /* Every text field carries a placeholder (Maryam, 14 Sep 2026: "the fields should
     always have placeholder text like the Email address field"). Falls back to a
     hint off the label when the field defines none. Selects/checks don't take one. */
  const ph = f.ph || ('Enter ' + String(f.l || '').toLowerCase());
  if(f.t === 'select') return formDd(f, val);
  if(f.t === 'date') return formDate(f, val);
  if(f.t === 'textarea') return `<label class="f">${lbl}<textarea class="inp" data-f="${f.k}" rows="3" placeholder="${esc(ph)}">${esc(val)}</textarea></label>`;
  if(f.t === 'checks') return `<div class="f">${lbl}<div class="mt4">${f.opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o];
    const on = Array.isArray(val) && val.includes(ov);
    return `<label class="cbx"><input type="checkbox" data-f="${f.k}" value="${esc(ov)}"${on ? ' checked' : ''}><span class="box">${I.check}</span><span class="txt">${esc(ol)}</span></label>`; }).join('')}</div></div>`;
  return `<label class="f">${lbl}<input class="inp${f.ro ? ' pfe-ro' : ''}" data-f="${f.k}" type="${f.t || 'text'}" value="${esc(val)}" placeholder="${esc(ph)}" autocomplete="off"${f.t === 'number' ? ' min="0"' : ''}${f.ro ? ' readonly' : ''}></label>`;
}
function recSheet(kind, id){
  const K = KINDS[kind]; if(!K) return null;
  const rec = id === 'new' ? null : K.find(id);
  const fields = typeof K.fields === 'function' ? K.fields(rec) : K.fields;
  /* `help` may be a function of the record, so a KIND can show its info block on
     ADD only (the agent KIND's "arrives through the vetting queue" note is about
     creating an account, not editing one). */
  const help = typeof K.help === 'function' ? K.help(rec) : K.help;
  /* Whether a required field is empty at open — so the submit button starts
     disabled and only lights once every required field is filled (Maryam, 20 Sep
     2026). `syncSheetSubmit` keeps it in step as the form is edited. Reads the same
     initial value fieldHtml renders. */
  const initInvalid = fields.some(f => {
    if(!f.req) return false;
    let v;
    if(rec) v = typeof f.get === 'function' ? f.get(rec) : rec[f.k];
    else { const d = typeof f.def === 'function' ? f.def() : f.def; v = d == null ? '' : d; }
    return v === '' || v == null || (Array.isArray(v) && !v.length);
  });
  return {
    title: rec ? `Edit ${K.label} — ${K.name(rec)}` : `Add ${K.an || 'a'} ${K.label}`,
    body: fields.map(f => fieldHtml(f, rec ? (typeof f.get === 'function' ? f.get(rec) : rec[f.k]) : undefined)).join('')
      /* the help line is an INFO BLOCK — a light-grey panel with an info icon on
         the left (Maryam, 13 Sep 2026) — not a bare description paragraph. */
      + (help ? `<div class="sheet-help"><svg class="sheet-help-ic" viewBox="0 0 24 24" aria-hidden="true">${inner('info')}</svg><p class="t-desc">${help}</p></div>` : ''),
    ok: rec ? 'Save Changes' : (K.okNew || `Add ${cap(K.label)}`),
    act: `save:${kind}:${rec ? rec.id : 'new'}`,
    gate: true, disabled: initInvalid
  };
}
function readForm(){
  const out = {};
  /* the centre modal OR the in-flow side panel (sidePeek) — a record form lives
     in whichever is open (`.peek-form` is the side panel; see sideSheet) */
  device.querySelectorAll('.modal.on .sheet [data-f], .peek-form [data-f]').forEach(el => {
    const k = el.dataset.f;
    if(el.type === 'checkbox'){ (out[k] = out[k] || []); if(el.checked) out[k].push(el.value); return; }
    /* a radio GROUP shares one data-f — only the checked member sets the value,
       so the field is single-choice (the Add-a-user Role picker). */
    if(el.type === 'radio'){ if(el.checked) out[k] = el.value; return; }
    out[k] = el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value.trim();
  });
  return out;
}
/* KEEP A RECORD SHEET'S SUBMIT BUTTON IN STEP WITH THE FORM (Maryam, 20 Sep 2026):
   the button (marked `data-submit`) is disabled while any required field is empty
   and lights the moment they are all filled. Called after every render and, without
   a render (trap 9 — a render would rebuild the half-filled form), on each dropdown
   pick, date pick and keystroke. Reads the same required-field rule `saveRecord`
   enforces, so the button state and the actual guard never disagree. */
function syncSheetSubmit(){
  const btn = device.querySelector('.sheet-f [data-submit="1"]');
  if(!btn) return;
  const parts = (btn.dataset.act || '').split(':');   /* save:kind:id */
  if(parts[0] !== 'save') return;
  const K = KINDS[parts[1]]; if(!K) return;
  const fields = typeof K.fields === 'function' ? K.fields(parts[2] === 'new' ? null : K.find(parts[2])) : K.fields;
  const vals = readForm();
  btn.disabled = fields.some(f => f.req && (vals[f.k] === '' || vals[f.k] == null || (Array.isArray(vals[f.k]) && !vals[f.k].length)));
}
function saveRecord(kind, id){
  const K = KINDS[kind]; if(!K) return;
  const vals = readForm();
  const fields = typeof K.fields === 'function' ? K.fields(id === 'new' ? null : K.find(id)) : K.fields;
  const missing = fields.find(f => f.req && (vals[f.k] === '' || vals[f.k] == null || (Array.isArray(vals[f.k]) && !vals[f.k].length)));
  if(missing){ toast(`${missing.l} is required`, 'warn'); return 'keep'; }
  if(id === 'new'){
    const rec = K.create(vals);
    audit(`Added ${K.label}`, K.name(rec), K.mod, K.sev);
    toast(`${cap(K.label)} added — ${K.name(rec)}`);
    if(K.detail){ const d = K.detail(rec).split('/'); S.mod = d[0]; S.sub = d[1]; S.id = d[2] || null; }
  } else {
    const rec = K.find(id); if(!rec) return;
    K.update(rec, vals);
    audit(`Edited ${K.label}`, K.name(rec), K.mod, K.sev);
    toast(`${K.name(rec)} saved`);
  }
}
ACTIONS.save = key => { const [, kind, id] = key.split(':');
  /* 1.6 — a fee change is a step-up action: validate the form, then ask for a
     fresh code before it commits (the fee's own confirmation). */
  if(kind === 'fee') return feeStepup(id);
  return saveRecord(kind, id); };
function feeStepup(id){
  const vals = readForm();
  const fields = typeof KINDS.fee.fields === 'function' ? KINDS.fee.fields(id === 'new' ? null : KINDS.fee.find(id)) : KINDS.fee.fields;
  const missing = fields.find(f => f.req && (vals[f.k] === '' || vals[f.k] == null));
  if(missing){ toast(`${missing.l} is required`, 'warn'); return 'keep'; }
  S._pending = {id, vals};
  const nm = id === 'new' ? (vals.t || 'the fee') : KINDS.fee.name(KINDS.fee.find(id));
  askConfirm({mk:'warning', stepup:true, title:`${id === 'new' ? 'Add' : 'Change'} ${nm}?`, body:'A fee change applies to new charges only, from its effective date; anything already in escrow settles at the rate it was booked at.', ok:'Save Fee', act:'dosavefee'});
}
ACTIONS.dosavefee = () => {
  const p = S._pending || {}; S._pending = null; S.confirm = null;
  const id = p.id, vals = p.vals || {};
  if(id === 'new'){ const rec = KINDS.fee.create(vals); audit('Added fee', KINDS.fee.name(rec), KINDS.fee.mod, 'high'); toast(`Fee added — ${KINDS.fee.name(rec)}`); }
  else { const rec = KINDS.fee.find(id); if(rec){ const from = rec.v; KINDS.fee.update(rec, vals); audit('Changed fee', KINDS.fee.name(rec), KINDS.fee.mod, 'high', {from, to:rec.v}); toast(`${KINDS.fee.name(rec)} saved`); } }
};
/* THE "NEEDS YOUR ATTENTION" PAGER — `attn:prev` / `attn:next` walk the black
   card's action items, wrapping at both ends. `attnItems().length` is the count;
   doAction re-renders. */
ACTIONS.attn = key => { const dir = key.split(':')[1]; const n = attnItems().length;
  S.attnPage = (((S.attnPage + (dir === 'prev' ? -1 : 1)) % n) + n) % n; };

ACTIONS.askdel = key => {
  const [, kind, id] = key.split(':'); const K = KINDS[kind]; const rec = K && K.find(id); if(!rec) return;
  if(K.guard){ const why = K.guard(rec); if(why){ toast(why, 'warn'); return; } }
  /* 1.6 — deleting an account or a role is one of the four step-up actions: a
     fresh code is asked for before it commits. */
  const stepup = kind === 'user' || kind === 'role';
  askConfirm({mk:'warning', stepup, title:`Delete ${K.name(rec)}?`,
    body: (K.delWarn ? K.delWarn(rec) : `This ${K.label} is removed from the platform.`) + ' This can’t be undone.',
    ok:`Delete ${cap(K.label)}`, danger:true, act:`del:${kind}:${id}`});
};
ACTIONS.del = key => {
  const [, kind, id] = key.split(':'); const K = KINDS[kind]; const rec = K && K.find(id); if(!rec) return;
  const nm = K.name(rec);
  K.remove(rec);
  audit(`Deleted ${K.label}`, nm, K.mod, 'high');
  toast(`${nm} deleted`);
  S.confirm = null;
  /* on the record's own page? go back to its list */
  const sub = MOD_BY_K[S.mod]._sub[S.sub];
  if(sub && sub.hidden && K.after){ const a = K.after.split('/'); S.mod = a[0]; S.sub = a[1]; S.id = null; }
};
/* a status flip with a confirmation — `askstatus:<kind>:<id>:<value>` */
ACTIONS.askstatus = key => {
  const [, kind, id, val] = key.split(':'); const K = KINDS[kind]; const rec = K && K.find(id); if(!rec || !K.status) return;
  const st = K.status(rec, val); if(!st) return;
  askConfirm({mk: st.danger ? 'warning' : 'check', title: st.title, body: st.body, ok: st.ok, danger: !!st.danger, act:`status:${kind}:${id}:${val}`});
};
ACTIONS.status = key => {
  const [, kind, id, val] = key.split(':'); const K = KINDS[kind]; const rec = K && K.find(id); if(!rec) return;
  const st = K.status(rec, val); if(st && st.apply) st.apply(rec); else rec.status = val;
  audit(st && st.log ? st.log : `Set ${K.label} ${val}`, K.name(rec), K.mod, 'high');
  toast(st && st.done ? st.done : `${K.name(rec)} ${val}`);
  S.confirm = null;
};

/* THE PAGED BLACK CARD BODY — Maryam, 11 Sep 2026 (second pass). One attention
   item's queue is "opened" in the card at a time: its LABEL row (no count) leads,
   then every request under it as a `.kv` row (name left, one short field right),

   Level reviews / Unverified employers — agents dropped, added straight through the
   admin now); the count beside them, `1 of <rows in view>`, counts the rows shown,
   the label row included (payouts = label + 3 = "1 of 4"). No count on the label. */
function attnCard(){
  const items = attnItems();
  const n = items.length;
  const i = ((S.attnPage % n) + n) % n;               /* clamp/wrap defensively */
  const it = items[i];
  const shown = 1 + it.rows.length;                   /* label row + its request rows */
  /* THE PAGER reuses the dark card's own header-right slot `.dc-when` (right-
     aligned, on-dark ink, 16px icons, gapped) so it needs no new CSS and sits
     exactly on the heading line above the header divider. The chevrons carry

    [`<b>${it.label}</b>`, '', ''],                    /* the queue label — no count (Maryam) */
    ...it.rows.map(r => [r[0], r[1], 'n'])

/* THE BULK ACTION BAR (Maryam, 15 Sep 2026). When rows are selected in a table
   that named a `selectKind` (a KINDS key), the floating Tal dock is replaced by an
   action bar of the actions that apply to the selection — DYNAMIC BY COUNT: one row
   shows the per-record actions (a cohort → Edit / Archive / Delete); two or more
   show only what applies to many at once (Archive All / Delete All — you cannot edit
   two at once). Same three-layer shadow as the Tal field; the bar's height fits its
   content. `bulkCtx` finds the first registered table that has a live selection. */
/* The bulk actions for a KIND are DERIVED from its handlers: every KIND has Edit
   (`rec:`) and Delete (`askdel:`), and one whose records carry a two-state status
   (`BULK_STATUS`) also gets that toggle (Archive / Pause / Deactivate). One row
   shows all three; many rows show only the status toggle and Delete (you cannot
   edit two at once). `icon` is the status action's glyph. A KIND without a
   `BULK_STATUS` entry (roles) shows only Edit / Delete. */
const BULK_STATUS = {
  cohort: {val:'archived', label:'Archive', icon:'pause'},
  agent:  {val:'inactive', label:'Pause',   icon:'pause'},
  cand:   {val:'inactive', label:'Deactivate', icon:'deactivate'}
};
function bulkActions(kind, ids){
  const bs = BULK_STATUS[kind];
  if(ids.length === 1){
    const id = ids[0];
    const out = [['edit', 'Edit', `data-sheet="rec:${kind}:${id}"`]];
    if(bs) out.push([bs.icon, bs.label, `data-act="askstatus:${kind}:${id}:${bs.val}"`]);
    out.push(['delete', 'Delete', `data-act="askdel:${kind}:${id}"`, 'danger']);
    return out;
  }
  const out = [];
  if(bs) out.push([bs.icon, bs.label + ' All', `data-act="bulkstatus:${kind}:${bs.val}"`]);
  out.push(['delete', 'Delete All', `data-act="bulkdel:${kind}"`, 'danger']);
  return out;
}
function bulkCtx(){
  for(const t of SEL_TABLES){
    const map = S.sel[t.key] || {};
    const ids = (TBL_ROWKEYS[t.key] || []).filter(k => map[k]);
    if(ids.length) return {key:t.key, kind:t.kind, bulk:t.bulk, ids};
  }
  return null;
}
function bulkBar(){
  const ctx = bulkCtx(); if(!ctx) return askDock();
  const n = ctx.ids.length;
  /* A table's own `bulk(ids)` wins; otherwise the KIND's Edit/status/Delete set. */
  const acts = (ctx.bulk ? ctx.bulk(ctx.ids) : (KINDS[ctx.kind] ? bulkActions(ctx.kind, ctx.ids) : null)) || [];
  if(!acts.length) return askDock();
  return `<div class="askdock">
    <div class="actbar">
      <span class="actbar-n"><b>${n}</b> selected</span>
      <span class="actbar-sep"></span>
      <div class="actbar-acts">${acts.map(([ic_, label, attr, cls]) =>
        /* icon is a raw <svg> (a glyph not in the shared set), or a key: prefer
           `ic()` so an IMAP alias resolves — `I[key]` returns a truthy EMPTY svg
           for an unknown key, which would blank the icon. */
        `<button class="actbar-b${cls ? ' ' + cls : ''}" ${attr}>${/^\s*</.test(ic_) ? ic_ : (ic(ic_) || I[ic_] || '')}<span>${label}</span></button>`).join('')}</div>
      <button class="actbar-x" data-selclearall aria-label="Clear selection" title="Clear selection">${I.close}</button>
    </div>
  </div>`;
}
ACTIONS.bulkstatus = key => {
  const [, kind, val] = key.split(':'); const ctx = bulkCtx(); if(!ctx || ctx.kind !== kind) return;
  const K = KINDS[kind]; const ids = ctx.ids.slice();
  const one = K.status && K.find(ids[0]) ? K.status(K.find(ids[0]), val) : null;
  S._pending = {kind, val, ids, selKey: ctx.key};
  askConfirm({mk:'warning', title:`${one ? one.ok : cap(val)} ${ids.length} ${K.label}s?`,
    body:`This applies to all ${ids.length} selected. Members keep their level and history; the change is logged. This can’t be undone.`,
    ok: one ? one.ok + ' All' : 'Confirm', danger:true, act:'dobulkstatus'});
};
ACTIONS.dobulkstatus = () => {
  const p = S._pending || {}; S._pending = null; S.confirm = null; const K = KINDS[p.kind]; if(!K || !p.ids) return;
  let n = 0; p.ids.forEach(id => { const rec = K.find(id); if(!rec) return; const st = K.status ? K.status(rec, p.val) : null;
    if(st && st.apply) st.apply(rec); else rec.status = p.val; audit(st && st.log ? st.log : `Set ${K.label} ${p.val}`, K.name(rec), K.mod, 'high'); n++; });
  if(p.selKey) S.sel[p.selKey] = {}; if(typeof syncCohortSizes === 'function') syncCohortSizes();
  const bs = BULK_STATUS[p.kind];
  toast(`${n} ${K.label}${n === 1 ? '' : 's'} ${bs ? bs.label.toLowerCase() + 'd' : 'updated'}`);
};
ACTIONS.bulkdel = key => {
  const [, kind] = key.split(':'); const ctx = bulkCtx(); if(!ctx || ctx.kind !== kind) return;
  const K = KINDS[kind]; const ids = ctx.ids.slice();
  S._pending = {kind, ids, selKey: ctx.key};
  askConfirm({mk:'warning', title:`Delete ${ids.length} ${K.label}s?`,
    body:`All ${ids.length} selected ${K.label}s are removed from the platform. This can’t be undone.`, ok:'Delete All', danger:true, act:'dobulkdel'});
};
ACTIONS.dobulkdel = () => {
  const p = S._pending || {}; S._pending = null; S.confirm = null; const K = KINDS[p.kind]; if(!K || !p.ids) return;
  let n = 0; p.ids.forEach(id => { const rec = K.find(id); if(rec){ K.remove(rec); audit(`Deleted ${K.label}`, K.name(rec), K.mod, 'high'); n++; } });
  if(p.selKey) S.sel[p.selKey] = {}; if(typeof syncCohortSizes === 'function') syncCohortSizes();
  toast(`${n} ${K.label}${n === 1 ? '' : 's'} deleted`);
};
/* THE USERS TABLE drives its own bulk bar (Maryam, 16 Sep 2026: "show bottom
   action bar on selecting the table through checkboxes"). All Users is a mix of
   external KINDs (candidate / agent / employer) and runs custom deactivate /
   reactivate / delete flows rather than one KIND's handlers, so it can't use
   `selectKind`; `opts.bulk` returns its own buttons and these handlers apply the
   same effect as the per-row flows (dodeactext / doreactext / dodelext), over
   every selected account, behind one confirm. Delete keeps the step-up (1.6). */
function usersBulk(ids){
  const users = ids.map(id => USER_BY_ID[id]).filter(Boolean);
  const active = u => u.status === 'active' || u.status === 'ok';
  const many = ids.length > 1;
  const out = [];
  if(users.some(active)) out.push(['deactivate', many ? 'Deactivate All' : 'Deactivate', 'data-act="bulkuserdeact"']);
  else if(users.length && users.every(u => u.status === 'inactive')) out.push(['play', many ? 'Reactivate All' : 'Reactivate', 'data-act="bulkuserreact"']);
  out.push(['delete', many ? 'Delete All' : 'Delete', 'data-act="bulkuserdel"', 'danger']);
  return out;
}
ACTIONS.bulkuserdeact = () => {
  const ctx = bulkCtx(); if(!ctx) return;
  const ids = ctx.ids.filter(id => { const u = USER_BY_ID[id]; return u && (u.status === 'active' || u.status === 'ok'); });
  if(!ids.length){ toast('No active accounts selected', 'warn'); return; }
  S._pending = {ids, selKey: ctx.key};
  askConfirm({mk:'warning', danger:true, title:`Deactivate ${ids.length} account${ids.length === 1 ? '' : 's'}?`,
    body:`They will be signed out and notified. This applies to all ${ids.length} selected active account${ids.length === 1 ? '' : 's'}.`,
    ok: ids.length === 1 ? 'Deactivate' : 'Deactivate All', act:'dobulkuserdeact'});
};
ACTIONS.dobulkuserdeact = () => {
  const p = S._pending || {}; S._pending = null; S.confirm = null; let n = 0;
  (p.ids || []).forEach(id => { const u = USER_BY_ID[id]; if(!u) return;
    u.status = 'inactive'; u.last = 'Signed out'; if(u.roles.includes('agent')) u.onboarded = false;
    const c = CAND_BY_ID[u.id]; if(c) c.status = 'inactive';

  if(p.selKey) S.sel[p.selKey] = {};
  toast(`${n} account${n === 1 ? '' : 's'} deactivated`);
};
ACTIONS.bulkuserreact = () => {
  const ctx = bulkCtx(); if(!ctx) return;
  const ids = ctx.ids.filter(id => { const u = USER_BY_ID[id]; return u && u.status === 'inactive'; });
  if(!ids.length){ toast('No deactivated accounts selected', 'warn'); return; }
  S._pending = {ids, selKey: ctx.key};
  askConfirm({mk:'check', title:`Reactivate ${ids.length} account${ids.length === 1 ? '' : 's'}?`,
    body:`They will be able to sign in again and will be notified. This applies to all ${ids.length} selected.`,
    ok: ids.length === 1 ? 'Reactivate' : 'Reactivate All', act:'dobulkuserreact'});
};
ACTIONS.dobulkuserreact = () => {
  const p = S._pending || {}; S._pending = null; S.confirm = null; let n = 0;
  (p.ids || []).forEach(id => { const u = USER_BY_ID[id]; if(!u) return;
    u.status = 'active'; u.last = 'Just now';
    const c = CAND_BY_ID[u.id]; if(c) c.status = 'active';
    audit('Reactivated account', `${u.name} · bulk`, 'Users & Roles', 'high'); n++; });
  if(p.selKey) S.sel[p.selKey] = {};
  toast(`${n} account${n === 1 ? '' : 's'} reactivated`);
};
ACTIONS.bulkuserdel = () => {
  const ctx = bulkCtx(); if(!ctx) return;
  const ids = ctx.ids.slice();
  S._pending = {ids, selKey: ctx.key};
  askConfirm({mk:'warning', danger:true, stepup:true, title:`Delete ${ids.length} account${ids.length === 1 ? '' : 's'} permanently?`,
    body:`This erases their personal data across the platform and cannot be undone. It applies to all ${ids.length} selected. Receipts and the audit trail are kept.`,
    ok: ids.length === 1 ? 'Delete' : 'Delete All', act:'dobulkuserdel'});
};
ACTIONS.dobulkuserdel = () => {
  const p = S._pending || {}; S._pending = null; S.confirm = null; let n = 0;
  (p.ids || []).forEach(id => { const u = USER_BY_ID[id]; if(!u) return;
    const nm = u.name;
    if(KINDS.user && KINDS.user.remove) KINDS.user.remove(u); else { USERS.splice(USERS.indexOf(u), 1); delete USER_BY_ID[u.id]; }
    audit('Deleted account', `${nm} · bulk`, 'Users & Roles', 'high'); n++; });
  if(p.selKey) S.sel[p.selKey] = {};
  toast(`${n} account${n === 1 ? '' : 's'} deleted. Personal data is being erased; receipts and the audit trail are kept.`);
};

/* ======================================================================
   THE VIEWS — one function per module, returning the page inside `.page`.
   A module page is: the head band, the sub-tabs, then the current sub's
   sections. The rail only shows a module once its renderer is registered.

const V = {};

/* ------------------------------------------------------------ DASHBOARD --- */
function homeOverview(){
  /* ══════════════════════════════════════════════════════════════════════════
     DASHBOARD — realigned to the LIVE modules only (Maryam, 21 Sep 2026).
     The band grew before several rulings landed and was surfacing analytics for
     modules the admin can no longer open: employer unlocks / placement fees
     (Employers are "not part of the system for now", 19 Sep, and the module is
     hidden), and a whole "Growth & acquisition" group of CRM lead analytics (the
     CRM module is hidden). Every band now maps to one of the nine VISIBLE
     modules and routes into it — nothing on the dashboard reads a hidden module.
     Order is OPERATIONAL-FIRST: what needs the admin, then the figures, then the
     splits. Charts stay LEAN (donut for a 2–4 slice split, hbars for a ranked
     list) per "data over decoration" (DESIGN §5); no trend line — the seed has
     no time series (SA-03 E1) so a trend would be authored placeholder.
     ══════════════════════════════════════════════════════════════════════════ */
  const pctOf = (n, t) => t ? Math.round(n / t * 100) : 0;
  /* PEOPLE (Users & Roles). Employer accounts are ORGANISATIONS in their own
     (hidden) module, so they stay off the account-role read. */
  const people = USERS.filter(u => !u.roles.includes('employer'));
  const activeCands = countActive(CANDS);
  /* COHORT LEADERS vs MODERATORS, keyed on `addedBy` (Maryam, 14 Sep 2026:
     "addedBy = moderator; cap the rest") — a volunteered candidate-leader has no
     `addedBy` and leads one cohort; an admin-added moderator carries it and may
     lead several. Authored placeholder split, read off the seed (SA-03 E1). */
  const leaders = USERS.filter(u => u.roles.includes('leader'));
  const cohortLeaderCount = leaders.filter(u => !u.addedBy).length;
  const moderatorCount = leaders.filter(u => u.addedBy).length;
  const agentListed = USERS.filter(u => u.roles.includes('agent') && u.onboarded !== false).length;
  /* "Users by role" reads the INTERNAL roles only (Maryam, 21 Sep 2026: "remove
     the Talent Agent, Cohort Leader and Candidate from this graph"). Those three
     are the external populations, and each already has its own figure in
     "Platform at a glance" — Candidates, Cohort leaders, Talent agents — so the
     bar chart was re-stating them at a scale that flattened every internal role
     under the candidate count. Employer stays out as before: employers are
     organisations in their own hidden module, not account roles here. */
  const roleRows = ROLES.filter(r => r.kind === 'internal')
    .map(r => [r.name, USERS.filter(u => u.roles.includes(r.k)).length]).filter(r => r[1] > 0);
  const uActive = people.filter(u => u.status === 'active').length;

  /* CANDIDATES + COHORTS */

  /* MARKETPLACE & INTERVIEWS (BOOKINGS). Booking mix by kind (donut) + the state

  const bkMix = {}; BOOKINGS.forEach(b => { bkMix[b.kind] = (bkMix[b.kind] || 0) + 1; });
  const bkMixRows = Object.entries(bkMix).sort((a, b) => b[1] - a[1]);

  const gross = grossProcessed();

/* ---- SA-01 · SA-16: GRANT AND REVOKE SUPER ADMIN ---------------------------
   Two sheets and two step-up confirmations. A grant names a TERM (permanent or
   time-boxed — auto-expiry is real: `expireGrants()` runs on every render), a
   SECOND APPROVER and a REASON, and refuses the three exceptions the journey
   names: self-escalation, a holder who is also an agent or cohort leader (a
   full-access role can hold no other — the roles page's own rule), and a sole
   admin, which is not refused but logged as single-approver at high severity,
   because with one holder the second-approver rule cannot be satisfied (E1).
   A revocation names its kind — planned, emergency, expiry — refuses the last
   remaining holder (SA-16 E1) and flags a holder who is the approver on a
   pending grant (E2). Both go through a step-up code (SA-02 A1). */
const staffForGrant = () => USERS.filter(u => u.internal && !isAdmin(u) && u.status !== 'inactive');
SHEETS.grant = id => {
  const u = id ? USER_BY_ID[id] : null;
  const others = admins().filter(a => a.id !== ME.id);
  const sole = !others.length;
  return {title: u ? `Grant Super Admin — ${u.name}` : 'Grant Super Admin', ok:'Continue', act:'askgrant',
    body:`${u ? `<input type="hidden" data-f="user" value="${u.id}">` : fieldHtml({k:'user', l:'Account', t:'select', opts: staffForGrant().length ? staffForGrant().map(x => [x.id, `${x.name} · ${x.roles.map(r => (ROLE_BY_K[r] || {}).short || r).join(', ')}`]) : [['', 'No internal account is eligible']]})}
      ${fieldHtml({k:'term', l:'Term', t:'select', opts:[['30', 'Time-boxed — 30 days, auto-expires'], ['90', 'Time-boxed — 90 days, auto-expires'], ['perm', 'Permanent']]}, '30')}
      ${fieldHtml({k:'approver', l:'Second approver', t:'select', opts: sole ? [['none', 'No second Super Admin exists — single-approver grant']] : others.map(a => [a.id, a.name])})}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — written to the audit log with the grant'})}
      ${sole ? note('warn', 'You are the only holder', 'The second-approver rule cannot be satisfied (SA-01 E1). The grant is logged as single-approver at high severity.') : ''}
      <p class="t-desc">A full-access role can hold no other: an account that is also an agent or a cohort leader is refused until that role is removed. You cannot grant to yourself. The next step asks for an authenticator code.</p>`};
};
ACTIONS.askgrant = () => {
  const v = readForm(); const u = USER_BY_ID[v.user];
  if(!u){ toast('Pick an account', 'warn'); return 'keep'; }
  if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  if(u.id === ME.id){ toast('You cannot escalate your own account (SA-01 E2)', 'warn'); return 'keep'; }
  if(u.roles.includes('agent') || u.roles.includes('leader')){ toast(`${u.name} is also ${u.roles.includes('agent') ? 'a talent agent' : 'a cohort leader'} — a full-access role can hold no other (SA-01 E3)`, 'warn'); return 'keep'; }
  if(isAdmin(u)){ toast(`${u.name} already holds Super Admin`, 'warn'); return 'keep'; }
  S._pending = v;
  const until = v.term === 'perm' ? null : new Date(Date.now() + Number(v.term) * 864e5).toISOString().slice(0, 10);
  askConfirm({mk:'warning', stepup:true, title:`Grant ${u.name} Super Admin?`,
    body:`Full control across every module${until ? `, expiring ${mdy(until)}` : ', with no expiry'}. ${v.approver === 'none' ? 'Single-approver — there is no second Super Admin to co-sign.' : `Co-signed by ${(USER_BY_ID[v.approver] || {}).name || 'a second Super Admin'}.`} Logged at high severity.`,
    ok:'Grant Super Admin', danger:true, act:'dogrant:' + u.id});
};
ACTIONS.dogrant = key => {
  const u = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null;
  if(!u) return;
  const from = u.roles.slice();
  u.roles = [...u.roles.filter(r => r !== 'admin2'), 'admin']; u.internal = true;
  u.grant = {since:isoToday(), until: v.term === 'perm' ? null : new Date(Date.now() + Number(v.term) * 864e5).toISOString().slice(0, 10),
    approver: v.approver === 'none' ? 'Single-approver (sole holder)' : (USER_BY_ID[v.approver] || {}).name || '—', by:ME.name, reason:v.reason};
  audit('Granted Super Admin', `${u.name} — ${u.grant.until ? 'until ' + mdy(u.grant.until) : 'permanent'} · ${u.grant.approver} · ${v.reason}`, 'Users & Roles', 'high', {from: from.join(', '), to: u.roles.join(', ')});
  toast(`${u.name} is a Super Admin — logged`);
};
SHEETS.revokeadmin = id => {
  const u = USER_BY_ID[id]; if(!u) return {title:'Revoke Super Admin', body:'', ok:''};
  const last = admins().length <= 1;
  const approving = USERS.filter(x => x.grant && x.grant.approver === u.name && grantState(x) === 'time-boxed');
  if(last) return {title:`Revoke Super Admin — ${u.name}`, ok:'',
    body: note('warn', 'The only remaining holder', `${esc(u.name)} is the last Super Admin on the platform. Revoking would leave nobody able to grant the role back (SA-16 E1); grant it to a second account first.`)};
  return {title:`Revoke Super Admin — ${u.name}`, ok:'Continue', act:'askrevokeadmin:' + u.id,
    body:`${fieldHtml({k:'kind', l:'Kind', t:'select', opts:[['planned', 'Planned offboarding'], ['emergency', 'Emergency — suspected compromise, every session ends now'], ['expiry', 'Expiry — the time-boxed grant has run out']]}, 'planned')}
      ${fieldHtml({k:'reason', l:'Reason', t:'textarea', req:1, ph:'Required — written to the audit log'})}
      ${approving.length ? note('warn', 'Mid-way through an approval', `${esc(u.name)} co-signed ${approving.map(x => esc(x.name)).join(', ')}’s time-boxed grant, still running (SA-16 E2). The grant stands; the line records that its approver was revoked.`) : ''}
      <p class="t-desc">The role comes off; if it was the account’s only role the account is offboarded. The next step asks for an authenticator code.</p>`};
};
ACTIONS.askrevokeadmin = key => {
  const u = USER_BY_ID[key.split(':')[1]]; const v = readForm();
  if(!u) return; if(!v.reason){ toast('A reason is required', 'warn'); return 'keep'; }
  S._pending = v;
  askConfirm({mk:'warning', stepup:true, title:`Revoke ${u.name}’s Super Admin?`,
    body: v.kind === 'emergency' ? `Every session ${u.name} holds ends now and the role comes off. Logged at high severity as an emergency revocation.` : `The role comes off${u.roles.length === 1 ? ' and, as their only role, the account is offboarded' : ''}. Logged at high severity.`,
    ok:'Revoke', danger:true, act:'dorevokeadmin:' + u.id});
};
ACTIONS.dorevokeadmin = key => {
  const u = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null;
  if(!u) return;
  revokeAdmin(u, v.kind || 'planned', v.reason || '');
  toast(`${u.name}’s Super Admin revoked`);
};
function revokeAdmin(u, kind, reason){
  const from = u.roles.slice();
  u.roles = u.roles.filter(r => r !== 'admin'); u.grant = null;
  if(!u.roles.length) u.status = 'offboarded';
  audit(kind === 'emergency' ? 'Emergency revocation of Super Admin' : kind === 'expiry' ? 'Super Admin grant expired' : 'Revoked Super Admin',
    `${u.name}${reason ? ' — ' + reason : ''}${kind === 'emergency' ? ' · all sessions ended' : ''}`, 'Users & Roles', 'high', {from: from.join(', '), to: u.roles.join(', ') || 'no roles — offboarded'});
}
/* AUTO-EXPIRY IS REAL (SA-01 A2 / SA-16 A3): a time-boxed grant past its date is
   revoked by the platform on the next render, with its own audit line, so the
   register's "auto-expiry" is a behaviour and not a word on a card. */
function expireGrants(){
  USERS.filter(u => isAdmin(u) && u.grant && u.grant.until && u.grant.until < isoToday()).forEach(u => revokeAdmin(u, 'expiry', `time-boxed grant ended ${mdy(u.grant.until)}`));
}

/* ---- SA-09 A5: MERGE DUPLICATE ACCOUNTS ------------------------------------
   The kept account takes the roles of the merged one; the merged one goes, and

SHEETS.merge = id => {

      <p class="t-desc">${esc(u.name)}’s roles move onto the kept account; ${esc(u.name)}’s sign-in, and a candidate record if there is one, are removed. Receipts stay under the accounting rule. Logged at high severity.</p>`};

  if(!u || !into){ toast('Pick the account to keep', 'warn'); return 'keep'; }

};
ACTIONS.domerge = key => {
  const u = USER_BY_ID[key.split(':')[1]]; const v = S._pending || {}; S._pending = null; S.confirm = null;
  const into = USER_BY_ID[v.into]; if(!u || !into) return;

  u.roles.forEach(r => { if(!into.roles.includes(r)) into.roles.push(r); });
  KINDS.user.remove(u);
  audit('Merged accounts', `${u.name} → ${into.name} — ${v.reason || ''}`, 'Users & Roles', 'high', {from, to: into.roles.join(', ')});

/* ---- SA-11: VIEW AS (IMPERSONATION) -------------------------------------------
   The primary alternatives drawn: READ-ONLY by default (write-enabled is
   offered as the open ruling it is, and logged high when chosen), interview
   video EXCLUDED always (A3), a reason, and a switch recording whether the user
   is told afterwards (E3 — recorded, because whether they ever learn it happened
   is unruled). Two refusals: another admin (E1) and a user with a booking today
   (E2 — a session during a live interview). The session is `S.viewAs`; the bar
   under the app bar names it; the router refuses every write while it is open;

ACTIONS.askviewas = key => {

};
SHEETS.viewas = id => {
