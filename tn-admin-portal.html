<!DOCTYPE html>

<title>TalentNext — Super Admin portal</title>

<!-- ==========================================================================
     THE DESIGN SYSTEM. Two files, fonts embedded in the first, so this is the
     whole dependency — the same link the Talent Agent portal carries. Serve
     over http (a browser blocks a linked stylesheet on file://):
         python3 -m http.server 8802 --bind 127.0.0.1
     Every class used below is a real class from design-system/gallery.html.
     The <style> block is PROTOTYPE CHROME AND NOTHING ELSE (the device frame,
     the viewport picker, the wordmark size, a toast host) — no product rule.
     ========================================================================== -->
<link rel="stylesheet" href="design-system/talentnext-ds.css?b=b9a82854">

<style>
/* ==========================================================================
   PROTOTYPE CHROME ONLY — not product design.

   `.pt-bar`, `.pt-stage`, `.pt-fit` and `.device` all come from the design
   system, including `container-type:inline-size; container-name:app` on
   `.device`, which is the host requirement — nothing in this system responds
   to the browser window, every breakpoint is `@container app (min-width:…)`.

   The mark: `TN_MARK` carries a viewBox and no size, so the bar says how big.
   The admin portal has no stage picker — a super admin sees one live platform,
   not a set of onboarding snapshots the way the agent portal does — so the bar
   holds the frame (viewport) picker and the Reset button only.
   ========================================================================== */
.pt-bar img{height:18px;width:auto;flex:none}

/* THE STAGE FOOT ROOM GOES WITH THE STAGE PICKER THIS FILE DOES NOT HAVE.
   `.pt-stage` is `padding:var(--s06) var(--s05) var(--s10)` in the design
   system — 64px at the foot for a caption row, plus a 16px flex gap. This file
   prints neither, so both reserved space for elements that are not here. Set to
   an even margin, same as the agent portal's chrome states for the same reason. */
.pt-stage{padding-bottom:var(--s05);gap:0}

/* THE TOAST HOST is prototype chrome: a fixed layer for the transient
   confirmations the source portal shows on cosmetic actions (reminder sent,
   receipt downloaded). Each toast is the design system's own `.note` component —
   no colour or type is stated here, only where the stack sits. It is appended
   inside `.device`, whose `container-type` makes it the containing block for a
   fixed child, so a toast is clipped to the frame it belongs to (the same
   mechanism the agent portal's steps popup note records). */
.pt-toasts{position:fixed;left:50%;bottom:var(--s06);transform:translateX(-50%);
  z-index:60;display:flex;flex-direction:column;gap:var(--s03);width:min(360px,86%);
  pointer-events:none}
.pt-toasts .note{margin:0;box-shadow:0 6px 24px rgba(17,17,17,.12);background:var(--pure-white,#fff)}
</style>
<style id="pilot-side-sheet">
/* PILOT (Maryam, 13 Sep 2026) — a record form opens as the candidate portal's
   IN-FLOW `.peek` column (§44), NOT a centre modal and NOT an overlay: the
   content column narrows and the panel takes the freed space beside it, no dim.
   `render()` places `sidePeek()` as a `.peek.peek-form` column in `.shell-body`
   after `.view-col`, and adds `peek` to `data-shown` so §44's `.main`
   margin-drop fires; `sheetView()` renders nothing for these. The panel reuses
   the sheet's `.sheet-h`/`.sheet-b`/`.sheet-f` inside the `.peek` shell so ALL
   the form logic is untouched — `readForm`, the `.fdd` dropdown's `.sheet-b`
   overflow toggle, and the two-step `_pending` flow. §44 already ships the
   column, the mobile-overlay fallback and the margin-drop through the design
   system; only these two panel-fit tweaks are portal-local. Scoped to Add/Edit
   User (`sideSheet`); promote to a build layer if approved. */
.peek.peek-form .sheet-b{flex:1 1 auto}
.peek.peek-form .sheet-f{justify-content:space-between; border-top:1px solid var(--rule)}

/* THE PANEL HEADING IS THE SECTION-HEADING SIZE (Maryam, 13 Sep 2026: "the
   heading of the slider should be the section heading size like how we use it").
   The DS sets `.sheet-h h2` to 18px; here it takes `--t-sec` (16px), the same
   role every `.sec-h` heading uses, at the strong weight. And the heading row's
   air is tighter — the space above "Add a user" and below it (down to the header
   divider) both come down from `--s06` (24) to `--s04` (12). */
.app .peek.peek-form .sheet-h{padding-top:var(--s04); padding-bottom:var(--s04)}
.app .peek.peek-form .sheet-h h2{
  font-size:var(--t-sec-size); line-height:var(--t-sec-lh);
  font-weight:var(--t-w-strong); letter-spacing:var(--t-sec-ls)}

/* THE HELP LINE IS AN INFO BLOCK — a light-grey panel with an info icon on the
   left (Maryam, 13 Sep 2026). `recSheet` wraps the help text in `.sheet-help`;
   this is not panel-scoped, so every record form's help reads the same way. */
.app .sheet-help{
  display:flex; gap:var(--s03); align-items:flex-start;
  margin-top:var(--s05); padding:var(--s04);
  background:var(--surface-2); border:1px solid var(--rule)}
.app .sheet-help .sheet-help-ic{
  flex:none; width:18px; height:18px; margin-top:1px; color:var(--accent)}
.app .sheet-help .t-desc{margin:0}
/* A TITLED info card — the same grey `.sheet-help` shell, with a strong black
   title over its body (Maryam, 18 Sep 2026: the "What deactivating clears" block
   reads like the plain help card). */
.app .sheet-help .sheet-help-b{display:flex; flex-direction:column; gap:var(--s02); min-width:0}
.app .sheet-help .sheet-help-b b{font-weight:var(--t-w-strong); color:var(--text-primary)}

/* WIDER PANEL (Maryam, 13 Sep 2026, per the reference red box): the panel takes
   a bit under half the frame and the content column reduces to fit. Overrides
   §44's `.app .peek{width:min(420px,42%)}` — `.app .peek.peek-form` is (0,3,0) vs
   (0,2,0), so it wins; below 900cqw §44 still makes it a full overlay. The -1px
   margin is the seam fix below. `--peek-w` is the panel's width, reused by the
   entrance animation so the two can never drift apart.
   NARROWED A LITTLE (Maryam, 14 Sep 2026: "reduce the width of the right slider
   a little bit") — 40%/720 → 37%/640, so the form reads tighter without losing
   its two-column fields. */
.app .peek.peek-form{--peek-w:min(37%, 640px); width:var(--peek-w); margin-left:-1px}

/* THE ENTRANCE — THE PANEL WALKS IN FROM THE RIGHT AND THE CONTENT NARROWS WITH
   IT (Maryam, 13 Sep 2026: "it should not instantly switch — a smooth slider
   walking in from the right, and the left content window smoothly going left").
   Animating ONE property does both: `margin-right` on the last flex child. At
   `-var(--peek-w)` the panel's width is cancelled, so the content column (flex:1)
   fills the frame and the panel sits just past the right edge (clipped by
   `#device`'s overflow). Easing it to 0 lets the panel's width count again — the
   content reflows narrower every frame while the panel slides into view, one
   push-drawer motion. Keyed on `data-open~="peek"` (this render only, trap 5), so
   it plays on open and never on an incidental re-render; a CSS animation plays on
   a freshly-inserted element, which a transition would not. */
@keyframes peek-walk-in{
  from{margin-right:calc(-1 * var(--peek-w))}
  to{margin-right:0}}
.app[data-open~="peek"] .peek.peek-form{
  animation:peek-walk-in 450ms var(--ease-decelerate) both}

/* THE EXIT — the mirror of the entrance (Maryam, 14 Sep 2026: "the smooth
   interaction with which it was opened should also be applied on closing").
   `data-closing="peek"` is stamped for the one render between the close press and
   the panel's removal (400ms later); the panel walks back out to the right and the
   content column widens with it, the same margin-right motion reversed. */
@keyframes peek-walk-out{
  from{margin-right:0}
  to{margin-right:calc(-1 * var(--peek-w))}}
.app[data-closing~="peek"] .peek.peek-form{
  animation:peek-walk-out 400ms var(--ease-accelerate) both}

/* ONE CLEAN SEAM LINE, CONTENT ATTACHED — NO GAP (Maryam, 13 Sep 2026: "the
   content and the slider need to be attached, no gap between them; the border has
   to look like one line, not two combined lines"). The panel's own `border-left`
   (§44, 1px `--rule`) is the single divider; content sits flush against it. The
   doubling was full-bleed content drawing its OWN border at the seam — the `.cs`
   filter-tab strip's faint per-tab `border-right` dividers (invisible on white,
   but a second hairline beside the panel's), and a bordered control at the
   toolbar's right edge. Two fixes, no gutter:
     1. switch the tab dividers off while the panel is open (they are not a
        visible design element), so nothing draws a line a few px inside the seam;
     2. pull the panel 1px onto the content edge (`margin-left:-1px`, above) so any
        edge-control border coincides with the panel border instead of sitting
        beside it — one line, still visually attached. */
.app[data-shown~="peek"] .cs button{border-right-color:transparent}
</style>
<style id="admin-attn-grid">
/* "NEEDS YOUR ATTENTION" AS A FOUR-UP COLUMN GRID (Maryam, 21 Sep 2026: "should
   be horizontal 4 cards with no spacing in between and just border, so it gives
   the impression of a 4-column grid"). Layout only — the rows, their copy, their
   counts and their routes are untouched; this swaps the stacked `.tile-stack`
   for a grid and re-flows each row's own contents into a card.

   ONE HAIRLINE PER JOIN. Borders are drawn on ONE side of each join, never two:
   the CONTAINER pays the top and left edges, and each CELL pays its own right
   and bottom. Two neighbouring cells therefore share a single 1px rule — the
   earlier "full border on every cell, pulled back 1px" version drew two abutting
   hairlines instead of one overlapping pair, which is why the inner verticals
   read twice as heavy as the outer frame (Maryam, 21 Sep 2026: "middle line is
   too thick"). Nothing here needs negative margins, so the rule stays single
   width at any count and survives a wrap to a second row. */
.attn-grid{
  display:grid; grid-template-columns:repeat(var(--attn-cols, 4), minmax(0, 1fr));
  border-top:1px solid var(--rule); border-left:1px solid var(--rule);
}
/* ONE ALIGNED ROW — icon, content, arrow (Maryam, 21 Sep 2026: "the icon,
   content and arrow all needs to be in the same row aligned"). The card was a
   flex COLUMN (mark on top, body, arrow at the foot); it is a flex ROW now, all
   three vertically centred like a standard `.cardrow` list row. The mark and the
   arrow don't shrink; the body is the flexible middle and pushes the arrow to
   the right edge. `min-height` drops (a row sizes to its own content). */
.app .view-col .main .page .attn-grid > .tile.gcard{
  display:flex; flex-direction:row; align-items:center; gap:var(--s04);
  padding:var(--s05); margin:0;
  border:0;
  border-right:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
}
.attn-grid .cardrow-ic{flex:none}
.attn-grid .gcard-b{display:block; flex:1 1 auto; min-width:0}
.attn-grid .tile-arrow{flex:none; align-self:center; margin:0 0 0 auto}

/* THE DS's LIST UNDERLINE, OFF, AND NO HOVER WASH. In a `.page` the DS hides each
   row's real bottom border and draws the divider as an `::after` inset by
   `--pad-x`, so inside a card it showed up as a short line floating above the
   card's foot (Maryam, 21 Sep 2026: "bottom border is inconsistent"). The pseudo
   is kept but neutralised — transparent at rest AND on hover. The card's ONLY
   hover answer is the arrow turning accent (Maryam, 21 Sep 2026: "remove the grey
   bg on hover, the arrow turning in accent color is enough"). Written at (0,6,0)
   to beat the DS's own `.app .view-col .main .page` rules by weight, no
   `!important`.

   NO `:where(.__nh)` HERE. That is the DS's non-touch gate, and this portal
   never arms `.__nh` (see the note at the head of this file) — every DS `:hover`
   carrying it is inert, and the portal's own hovers fire natively on a plain
   `:hover`. A rule written with the gate would simply never match. */
.app .view-col .main .page .attn-grid > .tile.gcard::after,
.app .view-col .main .page .attn-grid > .tile.gcard:hover::after{
  left:0; right:0; top:0; bottom:0; height:auto; background-color:transparent;
}
/* THE ARROW GOES ACCENT ON HOVER (Maryam, 21 Sep 2026). The DS takes it from
   `--text-placeholder` to `--text-primary`; here it takes the accent instead, so
   the card's hover answer is the accent chip's mate. The 2px nudge is the DS's
   and is left alone. */
.app .view-col .main .page .attn-grid > .tile.gcard:hover .tile-arrow{color:var(--accent); transform:translateX(2px)}

/* NARROWER VIEWPORTS — two up, then one. The container still pays top and left,
   the cells still pay right and bottom, so the frame closes at every count. */
@media (max-width:1100px){ .attn-grid{grid-template-columns:repeat(2, minmax(0, 1fr))} }
@media (max-width:660px){ .attn-grid{grid-template-columns:minmax(0, 1fr)} }

/* THE MARK IS A ROUND LIGHT-ACCENT CHIP WITH AN ACCENT GLYPH (Maryam, 21 Sep
   2026: "use round icons bg, the bg should be in light accent color and the
   above icon should be in accent color, the icon size should be standard"). The
   DS ships this chip as a black glyph on a soft `--tal-chip-1` wash with a
   radial highlight and a 1px `--rule` edge; all three are cleared here and
   replaced by the lightest accent tone (`color-mix(--accent 12%, #fff)`, the
   same tint the auth-id chip and `.rank-chip` use) under an `--accent` glyph, on
   a full-round chip. The SIZE is left at the DS default (36px chip / 20px glyph)
   — the standard `.cardrow-ic` size, so nothing is resized. Scoped to the
   attention grid, so the decision tiles and every other `.cardrow-ic` list keep
   the DS treatment. This SUPERSEDES the same-day solid-accent + white-glyph chip.
   `background` (the shorthand) is used so the DS's `background-image` gradient is
   reset along with the colour. */
.app .view-col .main .page .attn-grid .cardrow-ic{background:color-mix(in srgb, var(--accent) 12%, #fff); border:0; border-radius:50%}
.app .view-col .main .page .attn-grid .cardrow-ic svg{color:var(--accent)}

/* NO SECTION DIVIDER UNDER THE GRID (Maryam, 21 Sep 2026). The DS closes every
   `.sec` with a `--pad-x`-inset 1px `::after`. Under a bordered grid that rule
   lands just below the cards' own bottom border and reads as a stray second
   line, so it is dropped for this one section; the grid's own frame is what
   separates it from "Platform at a glance". */
.app .view-col .main .page .sec:has(> .attn-grid)::after{content:none; display:none}

/* "PLATFORM AT A GLANCE" USES THE STANDARD STAT CELL (Maryam, 21 Sep 2026:
   "cards of platform at glance should have the standard ui that we are using for
   the other cards where the value is on the right end"). The vertical single-
   column override tried earlier the same day is REMOVED, so `.dash-stats` falls
   back to the DS `.stat` shape — the three-column 'ic top n' grid where the
   figure sits centred on the cell's right, exactly like every other `.stats`
   block. The `.dash-stats` class is kept on the markup (harmless with no rules)
   so a future `.dash-stats`-only tweak has a hook. */
</style>
<style id="admin-row-hover">
/* A CLICKABLE TABLE ROW (`tr.clk`) LIGHTS ITS FIRST-COLUMN NAME ON HOVER
   (Maryam, 13 Sep 2026: "the rows are clickable, so on hover I want the black
   text in the first column to change to the accent — only the black text, not
   the grey sub-line"). The first cell holds two kinds of text: the name (the
   black anchor) and the `.t-caption` sub-line (the grey email). Colouring the
   whole first `td` accent recolours the name only — `.t-caption` carries its own
   colour rule, which beats the inherited value, so the sub-line stays grey with
   nothing named here.

   The accent as INK is `--accent-text` (#c2332d, AA on white), per DESIGN.md §3
   — `--accent` on words is reserved for stated exceptions.

   WRITTEN AS A PLAIN `:hover` HERE ON PURPOSE. The admin portal links the design
   system, whose `:hover`s are disarmed (`:where(.__nh)`, trap 6) and never armed
   in this file — so the DS's own `.clk:hover` row wash does not even fire here.
   A portal-local rule fires natively. Admin-only. */
.app .tbl tr.clk{cursor:pointer}
.app .tbl tr.clk:hover td:first-child{color:var(--accent-text)}
/* NO ROW BACKGROUND WASH (Maryam, 13 Sep 2026: "on clicking the menu icon the
   whole row shows this bg, it should not show this"). The DS gives `.clk:active`
   an `--overlay-pressed` grey; pressing anywhere in the row — including the kebab
   — washed the whole row. The row's only hover affordance is the first-column
   name turning accent (above), so the pressed wash is dropped. (0,4,1) beats the
   DS `.clk:active` (0,2,0). */
.app .tbl tr.clk:active{background:transparent}

/* LINKED (SOCIAL) ACCOUNTS on the candidate detail (Maryam, 20 Sep 2026: "linked
   accounts means social accounts ... show the linked accounts after the skills
   section"). The DS ships the candidate portal's `.lacc`/`.lacc-grid` cards
   (§105); the admin reuses them READ-ONLY, so the card is not a button — cursor
   default, no hover affordance. */
.app .lacc-ro{cursor:default}

/* PAYMENT-METHOD BRAND ICON in the Transactions Method column (Maryam, 20 Sep
   2026) — the brand chip alone, no card number. Admin-local. */
.app .pay-mk{display:inline-flex;align-items:center}
.app .pay-mk svg{display:block}

/* THE ROLES TABLE'S "DEFAULT" CHIP (Maryam, 14 Sep 2026): the one chip on the
   Super Admin row, accent ink on a light-accent ground. `.app` gives it (0,3,0)
   so it beats the base `.tag:not(.brand):not(.acc)` (0,3,0) on order. */
.app .tag.rl-default{background:color-mix(in srgb, var(--accent) 12%, transparent); border-color:transparent; color:var(--accent-text)}
/* `.tag.brand` shipped BLACK-ON-BLACK on the admin (DS gives it a dark ground,
   §63 forces `.tag` ink to near-black and skips `.brand`, so the label was
   invisible — the "Original" marker read as a solid black blob). Give it the same
   readable accent-tint the Default chip uses, admin-scoped. (15 Sep 2026) */
.app .tag.brand{background:color-mix(in srgb, var(--accent) 12%, transparent); border-color:transparent; color:var(--accent-text)}
/* THE PAGE-HEADING DESCRIPTION IS THE DESCRIPTION GREY #828282 (Maryam, 15 Sep
   2026: "the desc with the page heading needs to be in the font colour what tal
   summary desc colour is in right now"). The DS gives `.aih-d` its
   --text-secondary colour only through `.sec > .sec-h.aih` (a DIRECT child, §63
   §13). Admin list heads wrap the head in `searchHead` — `.sec > .hd-srch >
   .hd-srch-t > .sec-h.aih` — so that rule never matches and the desc fell back
   to the inherited primary #111 (black). Every admin heading desc reads the
   same #828282 now, matching the colour the Tal summary body carried before it
   was darkened one step platform-wide the same day (§33). Descendant combinator
   so it covers both the wrapped list heads and the direct ones; (0,7,0), later
   than the DS base (0,7,0), so it wins on order. The dark-card override (0,8,0,
   §63) still beats it, so a black-card heading keeps --on-dark-2. Admin-only. */
.app .page .sec .sec-h.aih > .aih-b > .aih-d{color:var(--text-secondary)}
/* the dashboard page heading ("Welcome Back, Derek!") sits directly above the
   period row — its own section, but with the bottom padding zeroed so the two
   read as one header block rather than two full-gap sections. `!important` to
   beat the admin section-rhythm chain (same reason `.set-head` needs it). */
.app .main .sec.dash-head{padding-bottom:0 !important}
.app .main .sec.dash-periodbar{padding-top:var(--s05) !important}
/* the dashboard period selector row (2.2): caption left, the segmented buttons
   right; wraps to a stack on a narrow width. */
.app .dash-periodbar-in{display:flex;align-items:center;justify-content:space-between;gap:var(--s05);flex-wrap:wrap}
.app .dash-periodbar-in .lst-filters{display:flex;gap:var(--s03);flex-wrap:wrap}

/* NO VERTICAL SCROLLBAR ON A DATA TABLE (Maryam, 14 Sep 2026: "we are only
   showing 5 rows, why is the table scrollable"). A CLOSED row-action menu is
   `visibility:hidden` but still laid out (`position:absolute`, `display:flex`)
   below the last row, so it inflates `.tbl-wrap`'s scrollHeight; and because
   `overflow-x` is `auto`, `overflow-y` computes to `auto` too (CSS spec), so a
   stray vertical scrollbar appears. The OPEN menu is lifted into `.main`
   (placeRowMenu), so the wrap is only ever a sideways scroller — pin overflow-y
   hidden. Admin-wide; the table auto-heights to its rows so nothing real clips. */
.app .tbl-wrap{overflow-y:hidden}

/* PERMISSIONS MATRIX MARKS (Maryam, 14 Sep 2026): granted in the accent,
   ungranted a very light grey. Read-mode marks (pmYes/pmNo) carry their own inline
   colour; these colour the edit-mode toggle icons, which have none. */
.app .perm-tbl .btn[aria-pressed="true"] svg{color:var(--accent)}
.app .perm-tbl .btn[aria-pressed="false"] svg{color:var(--gray-20)}
/* The edit-view toggle is icon-only, so an edit row is the same height as a read
   row (Maryam, 14 Sep 2026). The default .btn min-height (32px) made edit rows
   ~12px taller than the read table; drop the button chrome to its glyph. */
.app .perm-tbl td .btn{min-height:0; height:auto; padding:0; border:0}
/* Every role column is CENTRED under its own heading (Maryam, 14 Sep 2026) — the
   mark sits mid-column, not right-aligned like a figure. The first column
   (Capability) stays left. Beats `.tbl .num{text-align:right}` (0,2,0). */
.app .perm-tbl th:not(:first-child), .app .perm-tbl td:not(:first-child){text-align:center}
/* The Permissions heading row breathes like the Roles one (Maryam, 14 Sep 2026).
   The modhead's first section (Roles) gets s06 above and s06 below its heading
   (DS 9572/9573); this later section had the default 12 heading-to-content gap, so
   lift it to s06. Top padding is already s06, matching Roles. */
.app .sec:has(.perm-tbl){padding-top:var(--s06)}
.app .sec:has(.perm-tbl) > .sec-h{margin-bottom:var(--s06)}

/* TAL SUMMARY HIDDEN PORTAL-WIDE (Maryam, 17 Sep 2026, #admin-nosum). With the
   "Summary by Tal" band gone from `head()`, a list-page head band is only an empty
   breadcrumb (`.ph.ph-bare`) — hide it so no washed slab is left behind. The
   element stays in the DOM, so the `.modhead + .sec` first-section spacing rules
   still fire; a detail head keeps its back arrow and is untouched. */
.app .modhead:not(:has(.ai-aura)):has(> .ph.ph-bare){display:none}

/* A STRIP-ONLY TAB SECTION PAYS ONE TIGHT GAP TO ITS CONTENT (Maryam, 17 Sep 2026:
   "remove the unnecessary gap between tabs and the content"). The DS's strip-only
   `.sec-cs` zeroing did not resolve here (a `:has()` selector that matched but lost
   to `.sec`'s padding shorthand at compute time), so the tabs sat 48px above the
   content. `.iv-tabs` is a plain-class handle on the interview page's tab section:
   zero its bottom padding and the strip's own margin, and pull the content up to a
   single --s05 gap. `.set-tabs` (the Settings module's own inner-tab strip,
   21 Sep 2026) shares the same handle so its strip meets its pane the same way. */
.app .sec.iv-tabs,.app .sec.set-tabs{padding-top:var(--s05); padding-bottom:0}
.app .sec.iv-tabs > .cs,.app .sec.set-tabs > .cs{margin-bottom:0}
.app .sec.iv-tabs::after,.app .sec.set-tabs::after{content:none}
.app .sec.iv-tabs + .sec,.app .sec.set-tabs + .sec{padding-top:var(--s05)}
/* the head section above the tabs gives up its bottom padding so the tabs sit a
   single --s05 below the interview title, not a full section gap (Maryam, 18 Sep
   2026: "remove unnecessary spaces above and below tabs row"). */
.app .sec:has(+ .sec.iv-tabs),.app .sec:has(+ .sec.set-tabs){padding-bottom:0}
/* NO DIVIDER AFTER THE TOP SECTION BLOCK on a detail screen — the identity/facts
   block right after the back-arrow head (Maryam, 18 Sep 2026: "remove the line
   after the four blocks row"). §14 draws a foot rule on any section that precedes
   a heading; `:not(#_)` adds an id's worth of specificity so this clears it
   without `!important`. Admin-local. */
.app .modhead + .sec:not(#_)::after{content:none}

/* MODALS SIT TIGHTER (Maryam, 14 Sep 2026: "less padding from all sides").
   Admin-portal-local overrides of the DS modal frame (uniform --s06); the DS
   default is untouched for the other three portals. Reduce the sheet header,
   body and footer to --s05 and pull the header divider in to match. */
.app .sheet .sheet-h{padding:var(--s05) var(--s04) var(--s05) var(--s05)}
.app .sheet .sheet-h::after{left:var(--s05); right:var(--s05)}

   content box (642px) while the DS `.sec > .acc` bleed (talentnext-ds §—) shifts
   it left by `--pad-x` — so every row sat 32px short on the RIGHT, under-running
   the facts grid and Interviews list above it. Dropping the pin lets the DS bleed
   do its job: `.acc-i` restores `--pad-x`, so the row CONTENT (thumb, title,
   chevron) aligns to the content column like every other section, and the top/
   bottom hairlines bleed to the full section width. */
.app .crs-list .acc-b{max-width:none}
/* The in-progress course's progress body (coursePerf + chapter list) — the chapter
   block stands off the performance section by `--s07`. */
.app .crs-prog-ch{margin-top:var(--s07)}
/* the progress body stands off the course row it opens from (Maryam, 18 Sep 2026:
   "add space after the inprogress course row and it's content"). */
.app .crs-prog{padding-top:var(--s05)}
/* THE CHAPTER STATUS MARK SITS AT THE ROW'S RIGHT END, middle-aligned (Maryam, 18
   Sep 2026, off the candidate portal): a green filled check for a finished chapter,
   a light bordered ring for the rest. Overrides the DS `.ch-ic` grey square. */
.app .crs-prog .ch-ic.crs-ch-mk{width:22px; height:22px; margin-left:auto; background:transparent; border:0; place-items:center}
.app .crs-prog .ch-ic.crs-ch-done{color:var(--support-success)}
.app .crs-prog .ch-ic.crs-ch-done svg{width:22px; height:22px; fill:currentColor}
.app .crs-prog .ch-ic.crs-ch-todo{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--gray-20); background:transparent}
/* COMPACT course COVER on the accordion row — the candidate portal's My Courses
   layout (Maryam, 16 Sep 2026, reversing the same-day big-cover: "the courses
   section on super admin needs the reference layout from the candidate portal").
   56x38 (§105.1's `.crs-row > .crs-thumb`), `flex:none` so the title takes the
   slack, `--s04` of air to the title, a 1px `--rule` edge like every framed image.
   Scoped to .crs-list so it matches the candidate portal's small thumb here. */
.app .crs-list .crs-h{gap:var(--s04); align-items:center}
/* STATUS STACKS BELOW THE NAME, left-aligned with it (Maryam, 16 Sep 2026: "take
   the status of the course below the name of the course, left aligned with course
   name"). The candidate portal's `.ol` accordion already gets this from the DS
   (`.ol .acc-h .ttl` column); the admin course list isn't `.ol`, so restate it
   scoped to `.crs-list`. `.crs-name` (name) sits over `.t-desc` (status). */
.app .crs-list .acc-h .ttl{display:flex; flex-direction:column; align-items:flex-start; gap:2px}
.app .crs-list .crs-thumb{flex:none; width:56px; height:38px; margin-right:0; overflow:hidden; border:1px solid var(--rule); background:var(--surface-2)}
.app .crs-list .crs-thumb img{width:100%; height:100%; object-fit:cover; display:block}
.app .crs-cert{background:var(--gray-100); color:var(--on-dark); padding:var(--s05); margin-bottom:var(--s05)}
.app .crs-cert-row{display:flex; align-items:center; gap:var(--s04)}
.app .crs-cert-mk{flex:none; width:40px; height:44px}
.app .crs-cert-mk img{width:100%; height:100%; object-fit:contain; display:block}
.app .crs-cert-b{display:flex; flex-direction:column; min-width:0}
.app .crs-cert-t{color:var(--on-dark); font-weight:var(--t-w-strong)}
.app .crs-cert-m{color:var(--on-dark-2); font-size:11.5px; letter-spacing:.4px}
@container app (min-width:900px){ .app .facts.pf-facts.crs-stats{grid-template-columns:repeat(4,1fr); max-width:none} }

/* Interviews: collapsed .found rows with an agent avatar + a transcript link */
.app .iv-list{display:flex; flex-direction:column; gap:var(--s04)}
.app .iv-found-av{flex:none; width:36px; height:36px; border-radius:999px; overflow:hidden}
.app .iv-found-av img{width:100%; height:100%; object-fit:cover; display:block}
.app .iv-found-tx{display:flex; flex-direction:column; min-width:0}
.app .iv-found-name{color:var(--text-primary); font-weight:var(--t-w-strong)}

/* Quiz results — generous gaps between the parts (scoped to .adm-quiz) */
.app .adm-quiz-txt{display:flex; flex-direction:column; gap:var(--s07)}
.app .adm-quiz .qzp-g{display:flex; flex-direction:column; gap:var(--s05)}
.app .adm-quiz .qzp-l + .qzp-l{margin-top:var(--s03)}

/* ========== DASHBOARD ========== */
/* Period selector row: the 'as at' note left, the This week/month/quarter buttons right */
.app .dash-periodbar-in{display:flex; align-items:center; justify-content:space-between; gap:var(--s04); flex-wrap:wrap}
/* Horizontal-bar chart (a ranked list / funnel) — green data-viz ramp, never brand red */
.app .hbars{display:flex; flex-direction:column; gap:var(--s04)}
.app .hbar-top{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s03); margin-bottom:var(--s02)}
.app .hbar-v{color:var(--text-primary); font-weight:var(--t-w-strong)}
.app .hbar-track{height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden}
.app .hbar-track i{display:block; height:100%; background:var(--dv-3, var(--support-success)); border-radius:999px}
/* Multi-line trend chart — a line per series (Figma "Charts", Maryam 21 Sep 2026),
   recolored to the green --dv-* ramp (categorical data-viz never rides the brand
   red, DESIGN.md §3). Dashed smooth curves; the chart owns its own SVG labels
   (§63 §5, so fill/size live inline on the <text>). Uniform viewBox scale, so it
   never distorts. The monthly series are AUTHORED PLACEHOLDER (§74) — the seed
   carries no headcount history (SA-03 E1) — pinned so the last point equals each
   role's real current count. */
.app .lchart{display:flex; flex-direction:column; gap:var(--s05)}
.app .lchart-leg{display:flex; flex-wrap:wrap; gap:var(--s03) var(--s05)}
.app .lc-chip{display:inline-flex; align-items:center; gap:var(--s02); font-size:var(--t-desc-size); color:var(--text-secondary)}
.app .lc-dot{width:9px; height:9px; border-radius:999px; flex:none}
.app .lchart-svg{display:block; width:100%; height:auto; overflow:visible}
/* Bucket cards — a 3-up `.stats` grid (Candidates by bucket, Maryam 21 Sep 2026).
   Base `.stats` is 2-up (mobile) / 4-up (>=900); three cells there would leave a
   grey grid-gap cell, so pin it to one column on a phone and exactly three across
   at desktop — always fully filled. Restated inside the query so the desktop rule
   outweighs the base 4-up (trap 3). */
.app .stats.dash-buckets{grid-template-columns:1fr}
@container app (min-width:900px){ .app .stats.dash-buckets{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* Attention-queue pager (on a dark card) */
.app .dc-pager{display:inline-flex; align-items:center; gap:var(--s02)}
.app .dc-pg{display:inline-flex; align-items:center; justify-content:center; cursor:pointer; width:24px; height:24px; color:var(--on-dark)}
.app .dc-pg svg{width:18px; height:18px; color:currentColor; display:block}
.app .dc-pg-n{font-size:12.5px; color:var(--on-dark-2); white-space:nowrap}

/* ========== SHARED HOOKS ========== */
/* Dropdown option / trigger value carrying a round avatar (leader picker, member rows) */
.app .fdd-val{display:inline-flex; align-items:center; gap:var(--s02); min-width:0}
/* an unselected placeholder dropdown reads as placeholder text, like a field's ph.
   The modifier is `.fdd-ph`, NOT a bare `.ph` — `.ph` is the page-header component
   in the DS (padding 40/16/24 + decorative pseudo-elements), so a bare `.ph` here
   inherited that and blew the field to ~87px tall (Maryam, 20 Sep 2026). */
.app .fdd-val.fdd-ph{color:var(--text-placeholder)}
.app .fdd-av{flex:none; width:22px; height:22px; border-radius:999px; overflow:hidden; display:inline-block; vertical-align:middle}
.app .fdd-av img{width:100%; height:100%; object-fit:cover; display:block}
/* Search-field magnifier */
.app .mag{flex:none; width:20px; height:20px; color:var(--icon-secondary)}
/* Course-outline chapter title */
.app .ol-t{display:block; color:var(--text-primary); font-weight:var(--t-w-strong)}
/* Row-action kebab trigger (icon-only) */
.app .rowmenu-t{padding-left:var(--s02); padding-right:var(--s02)}
/* Bare date-popup wrapper */
.app .dcal{width:100%}
</style>

<body>

<!-- prototype chrome removed — Maryam, 8 Sep 2026: "remove the top black bar
     since we have only one device direction." The Super Admin portal opens
     straight into the Desktop (fluid) device; the viewport picker, scale readout
     and Reset the bar held are gone. Their JS wiring is guarded (see the foot of
     the script), so the whole bar can be restored by markup alone if wanted. -->

<div class="pt-stage">
  <div class="pt-fit" id="fit">
    <div class="device" id="device" data-vp="fluid"></div>
  </div>
</div>

<script src="design-system/talentnext-ds.js?b=b9a82854"></script>
<script>
/* ==========================================================================
   THE SUPER ADMIN PORTAL

   A FOURTH SIGNED-IN USER, IN A FILE OF ITS OWN, on the same design system the
   Talent Agent portal is built on. The candidate and cohort leader share
   `hifi/` because a demo walks between them; the agent and the admin are each
   a separate application and a separate signed-in person, so each is a
   hand-written file linking `design-system/`.

   WHO IS SIGNED IN: Derek Sole, Super Admin (u9 in the record). The portal has
   full control across every module — users, vetting, cohorts, the marketplace
   and settlement — with override on any level or setting.

   WHERE THE DATA COMES FROM: verbatim from `tn-admin.html`, the frozen data and
   flow reference. Every user, application, cohort, booking, payout, refund,
   settlement, lead, campaign, feature flag, decision and audit line below is
   copied from that file's seed block (its lines 3077–3592 and 6772–6836). No
   record, number or copy is invented here — the frozen file is the source of
   truth and this file is only its hi-fi skin.

   WHERE THE DESIGN COMES FROM: the other three portals only. The head band with
   Tal's page summary (`dsTypeSummary`), §78's top bar with the breadcrumb trail
   and the account menu, the rail, `aiHead` for a heading that carries a
   sentence, `.dark-card` for the one loud thing on a page, `.stat`/`.qa-c`
   figure cells, the design system's data table, §65 disclosures, and the
   `.conf` dialog for every destructive action and log-out. No component is
   invented; where the admin needs one the box does not ship, it is composed
   from ones it does.

   TWO ADMIN RULES STATED BY THE BRIEF AND KEPT HERE:
     - DATA OVER DECORATIVE CHARTS. The frozen file draws bar, donut, funnel and
       line charts on its dashboards; this portal reads the same figures as
       `.stats`, `.kv` bands and tables, which is the standing admin preference
       (DESIGN.md §3) and also keeps every surface on the design system with no
       chart CSS to invent.
     - THE FEE SPLIT IS CONFIGURATION, NOT COPY. The 20% platform share appears
       once, in Fee Configuration, and nowhere in a sentence — an admin-set
       number does not belong in prose.

   4 SEP 2026 — THE SECOND PASS, from Maryam's review of the first ("tal is
   missing, the tabs on pages have margins, the black card has no fine content
   structuring, no sub modules … no filters on tables, unnecessary lines …
   there should have been crud operations"). What changed, and where each is
   argued: the ask dock and the full-height Tal page are ported from the agent
   portal (see TAL, FOR THE ADMIN); the sub-page strip is `.sec-cs` + `.cs`
   (see `subTabs`); the rail is a tree with queue counts (§120, `sidenav`);
   the black card follows the gallery recipe (`darkCard`); every list has a
   live search, a count strip, sortable heads and row actions (`searchHead`,
   `filterStrip`, `table`, `rowActs`); and a record engine gives every kind of
   record create, edit, delete and status changes through the same sheet and
   confirmation (THE RECORD ENGINE). Everything the admin does writes a line
   to the audit log (`audit`), so System & Audit shows the session's own work.

   NAVIGATION IS `mod/sub[/id]`, and that is the whole of the router. The rail
   is the twelve modules; a module opens on its first sub-page; the sub-pages of
   a module are a `.tabs` strip; a table row drills into a hidden detail sub
   with a record id. The hash is `#mod/sub[/id]`, written with `replaceState`
   and read back on load, so a reload comes back to the screen you were on — the
   same three parts `hifi/` and the agent portal keep.
   ========================================================================== */

/* ---- small utilities ---------------------------------------------------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + Number(n).toLocaleString('en-US');
const money2 = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});

/* THE ICON MAP. The admin data names icons in its own vocabulary (`agent`,
   `cohorts`, `spark`, `store`, `route`, `dl`, `dots`, `sliders`, `bank`,
   `scale`…). This maps each onto the design system's Material Symbols set —
   `Object.keys(IP)` is the whole list — so a call site names the meaning and
   gets the official mark. A name already in the set passes through. */
const IMAP = {
  home:'dashboard', users:'group', vetting:'shield', candidates:'user',
  agents:'verified', cohorts:'growth', market:'video', employers:'launch',
  finance:'wallet', crm:'chart', system:'settings', settings:'settings',
  profile:'user', agent:'verified', store:'launch', spark:'lightning',
  money:'wallet', bank:'wallet', alert:'warning', route:'link', account:'user',
  lock:'locked', node:'link', eye:'view', scale:'renew', doc:'document',
  clock:'time', plus:'add', dots:'overflow', sliders:'settings', dl:'download',
  gear:'settings', flag:'flag', shield:'shield', video:'video', wallet:'wallet',
  chart:'chart', link:'link', group:'group', calendar:'calendar', book:'book',
  growth:'growth', receipt:'receipt', check:'check', star:'star', time:'time',
  filter:'filter', search:'search', user:'user', verified:'verified',
  location:'location', ticket:'ticket', document:'document', notification:'notification'
};
const ic = name => I[IMAP[name] || name] || '';

/* A STATUS WORD IS A `.tag`, AND ITS HUE IS A SET, NOT THE ACCENT (DESIGN.md
   §3). This maps every status string the records carry onto the design system's
   tag variants — green for done/good, warn for waiting, red for a problem —
   with the word the source shows. Anything unmapped renders as a plain tag with
   its own text title-cased. */
const TAGV = {
  /* good */ active:'green', settled:'green', paid:'green', live:'green', ok:'green',
  approved:'green', won:'green', reconciled:'green', placed:'green', confirmed:'green',
  published:'green', completed:'green', verified:'green',
  /* the Transactions status sets (Maryam, 20 Sep 2026): money-in charges are
     Received/Pending/Failed, payouts Pending/Paid/Failed, refunds
     Pending/Refunded/Failed. `received` reads as good (green), a completed
     `refunded` reads as done (green — it no longer falls through to plain text),
     and `failed` is a problem (red). `pending`/`paid` already map above. */
  received:'green', refunded:'green', failed:'red',
  /* transcript states (Maryam, 21 Sep 2026): a ready transcript is done (green),
     one still generating is in progress (amber); `failed` is already red above. */
  ready:'green', generating:'warn',
  /* waiting */ held:'warn', pending:'warn', review:'warn', requested:'warn', invited:'warn',
  processing:'warn', sent:'warn', overdue:'warn', unmatched:'warn', shortlisted:'warn',
  reviewing:'warn', scheduled:'warn', draft:'warn', degraded:'warn', 'in progress':'warn',
  /* problem */ blocked:'red', declined:'red', lost:'red', unverified:'red',
  inactive:'red', rejected:'red', down:'red', open:'red', flagged:'red', passed:'',
  /* neutral-ish */ applied:'', feedback:'green', 'n/a':'',
  /* the Super Admin journey's states (7 Sep 2026) */ reassign:'warn', expired:'red', offboarded:'red', voided:'red', permanent:'green', 'time-boxed':'warn', credit:'green'
};
/* `held` DISPLAYS as "Pending" — the hold word is removed from the UI while the
   status key stays (Maryam, 15 Sep 2026: "the hold state will be removed from
   wherever it is mentioned"). It keeps the amber `warn` hue. Applies to every
   `tag('held')` — the payouts pending bucket and a transaction in escrow. */
const TAGLABEL = {'n/a':'n/a', ok:'Verified', held:'Pending'};
const cap = s => String(s || '').replace(/^\w/, c => c.toUpperCase());
/* A STATUS IS PLAIN COLOURED TEXT, NEVER A CHIP (Maryam, 7 Sep 2026: "never add
   status in tags, this is a universal change on admin portal"). The chip box is
   dropped platform-wide across the admin — `tag()` is the admin's own state
   helper, so changing it here changes every Status/Listing/verify/outcome cell
   at once. The good/waiting/problem colour stays (it is the meaning, a SET, not
   the accent — DESIGN.md §3); §126 gives `.statw` its inks. The categorical
   LABEL chips (roles, levels) still use `.tag` and become round chips (§126). */
const tag = (status, label) => {
  const key = String(status || '').toLowerCase();
  const v = TAGV[key] === undefined ? '' : TAGV[key];
  const txt = label != null ? label : (TAGLABEL[key] || cap(status));
  return `<span class="statw${v ? ' ' + v : ''}">${esc(txt)}</span>`;
};

/* A FACE IS A DISC OF INITIALS. The five embedded portraits in the design
   system belong to named people who are not these thirty-two accounts, so admin
   rows carry initials on a disc — the design system's own `.av`/`.mem-av`, round
   since §106 — rather than a photograph that would claim an identity. */
const initials = name => String(name || '?').trim().split(/\s+/).slice(0, 2)
  .map(w => w[0]).join('').toUpperCase();
const av = (name, size) => `<span class="av${size ? ' ' + size : ''} mem-av">${esc(initials(name))}</span>`;

/* ======================================================================
   SEED DATABASE — verbatim from tn-admin.html:3077–3592 and 6772–6836.
   Data is data; these object literals are carried across unchanged so the
   hi-fi portal and the frozen reference cannot disagree on a record.
   ====================================================================== */
const ROLES=[
 {k:'candidate', name:'Candidate', short:'Candidate', kind:'external', desc:'Takes the quiz, gets levelled, joins cohorts and books interviews.'},
 {k:'agent',     name:'Talent Agent', short:'Agent', kind:'external', desc:'Interviews candidates, sets own fee, holds a public marketplace listing.'},
 {k:'leader',    name:'Cohort Leader', short:'Cohort Leader', kind:'external', desc:'A Builder who volunteers to lead an Explorer cohort through the 90-day loop.'},
 {k:'employer',  name:'Employer', short:'Employer', kind:'external', desc:'Searches the candidate database, unlocks interviews, makes hires.'},
 {k:'reviewer',  name:'Reviewer', short:'Reviewer', kind:'internal', desc:'Owns candidate level decisions. Can see the AI raw score — no one else can.'},
 {k:'manager',   name:'Manager of Agents', short:'Manager', kind:'internal', desc:'Oversees a book of agents; handles calibration and escalations.'},
 {k:'supervisor',name:'Supervisor', short:'Supervisor', kind:'internal', desc:'Reviews agents above the manager line; adjusts an agent’s own level and ranking.'},
 {k:'admin2',    name:'Admin', short:'Admin', kind:'internal', desc:'Full platform access across every module, working alongside the Super Admin.'},
 {k:'admin',     name:'Super Admin', short:'Super Admin', kind:'internal', desc:'Full control across every module, with override on any level or setting.'}
];
const ROLE_BY_K={}; ROLES.forEach(r => ROLE_BY_K[r.k]=r);

/* DEPARTMENTS (Epic 1, story 1.1 / 1.7 / 1.8). The doc flags the option list as
   "pending from the client" — so this is AUTHORED PLACEHOLDER, flagged. Edit /
   Add-staff read it for the Department dropdown; the Staff directory filters on
   it. When the real list lands, replace this array. */
const DEPARTMENTS = ['Operations', 'Talent Success', 'Trust & Safety', 'Finance', 'Engineering'];

/* THE FIVE INTERNAL STAFF ROLES the doc's Change-Role and Add-Staff dropdowns
   offer, in the doc's order (1.3): Reviewer, Supervisor, Manager of Agents,
   Admin, Super Admin — mapped onto the ROLES keys. Super Admin (`admin`) is
   offered only to an actor who already holds it (1.1 / 1.3). */
const STAFF_ROLE_KEYS = ['reviewer', 'supervisor', 'manager', 'admin2', 'admin'];
const staffRoleOpts = actorIsSA => STAFF_ROLE_KEYS
  .filter(k => k !== 'admin' || actorIsSA)
  .map(k => [k, (ROLE_BY_K[k] || {}).name || k]);
/* an internal account holds exactly one internal role — the first internal role
   on its `roles` stack. */
const staffRole = u => (u.roles || []).find(r => (ROLE_BY_K[r] || {}).kind === 'internal') || (u.roles || [])[0];
const staffRoleName = u => { const r = staffRole(u); return (ROLE_BY_K[r] || {}).name || '—'; };
const isSA = u => (u.roles || []).includes('admin');
/* the platform's Super Admin accounts that can still sign in (Active). The
   last-remaining-Super-Admin guard is evaluated against this at the moment of
   action (1.3 / 1.9 / 1.11). */
const activeSAs = () => USERS.filter(u => u.internal && isSA(u) && u.status === 'active');
const CAPS=[
 {k:'takequiz', t:'Take Quiz / Interview'},
 {k:'setfee',   t:'Set Interview Fee'},
 {k:'conduct',  t:'Conduct Interviews'},
 {k:'decidelvl',t:'Assign Candidate Level'},
 {k:'lead',     t:'Lead Cohorts'},
 {k:'searchdb', t:'Candidate Database'},
 {k:'rawscore', t:'View AI Raw Scores'},
 {k:'payouts',  t:'Manage Payouts'},
 {k:'usersroles',t:'Manage Users & Roles'},
 {k:'fees',     t:'Configure Fees & Payouts'},
 {k:'system',   t:'System Settings & Overrides'}
];
const MATRIX={
 candidate:{takequiz:1},
 agent:{conduct:1,setfee:1},
 leader:{lead:1,takequiz:1},
 employer:{searchdb:1},
 reviewer:{decidelvl:1,rawscore:1},
 manager:{conduct:1,rawscore:1},
 supervisor:{rawscore:1,decidelvl:1},
 admin2:{takequiz:1,setfee:1,conduct:1,decidelvl:1,lead:1,searchdb:1,rawscore:1,payouts:1,usersroles:1,fees:1,system:1},
 admin:{takequiz:1,setfee:1,conduct:1,decidelvl:1,lead:1,searchdb:1,rawscore:1,payouts:1,usersroles:1,fees:1,system:1}
};
const isFullAccess = k => { const m = MATRIX[k]; return m ? CAPS.every(c => m[c.k]) : false; };
/* THE PROGRAM / BUSINESS WALL (SA-10 E1). The journey names the wall and leaves
   the rule open, so the portal takes the reading a dynamic ACL needs to be
   useful at all: a capability is on the PROGRAM side (the product — quiz,
   interview, level, cohort, database, score) or the BUSINESS side (running the
   platform — fees, payouts, users, system). A role with capabilities on one
   side that is granted one from the other BREACHES the wall; the matrix warns
   and asks, it does not refuse — the open ruling is whether it should. */
const CAP_SIDE = {takequiz:'Program', conduct:'Program', decidelvl:'Program', lead:'Program', searchdb:'Program', rawscore:'Program',
  setfee:'Business', payouts:'Business', fees:'Business', usersroles:'Business', system:'Business'};
const roleSide = k => { const on = Object.keys(MATRIX[k] || {}); const sides = [...new Set(on.map(c => CAP_SIDE[c]))]; return sides.length === 1 ? sides[0] : null; };

/* SUPER ADMIN GRANTS (SA-01, SA-16). `u.grant` is {since, until, approver, by} —
   `until` an ISO date or null for permanent. The seed's one holder is Derek,
   whose grant is the bootstrap the journey's A1 describes: the first admin at
   go-live, out of band, with no second approver because there was nobody to be
   one. `since` is his joined date read the other way round. */
const isoToday = () => new Date().toISOString().slice(0, 10);
const mdy = iso => iso ? `${iso.slice(5, 7)}-${iso.slice(8, 10)}-${iso.slice(0, 4)}` : '—';
const isAdmin = u => u.roles.includes('admin');
const admins = () => USERS.filter(isAdmin);
const grantOf = u => u.grant || (isAdmin(u) ? {since:'2026-01-02', until:null, approver:'Bootstrap at go-live (out of band)', by:'—'} : null);
const grantState = u => { const g = grantOf(u); return !g ? null : !g.until ? 'permanent' : g.until < isoToday() ? 'expired' : 'time-boxed'; };

];

/* does a record match the page's search? case-insensitive, any field */
const hit = (q, ...fields) => { q = String(q || '').trim().toLowerCase(); if(!q) return true;

/* THE FILTER STRIP — §15's `.cs` with live counts in `.lf-n`, under the heading

/* THE FIGURE CELL — §29/§24. Four parts, four cells per `.stats`, the mark's

const statCell = (icon, label, value, note) => `

const stats = (cells, cls) => `<div class="stats${cls ? ' ' + cls : ''}">${cells.map(c => statCell(c[0], c[1], c[2], c[3])).join('')}</div>`;

/* A HAIRLINE KEY/VALUE LIST — the safe band at any width (DESIGN.md §3). */
/* ALIGNED (14 Sep 2026): delegates to the shipped `dsKv`. No admin call uses the
   optional per-row `cls` the old copy carried (every row is `[k, v]`), so nothing
