  <section class="sec">
    <div class="note"><span>${I.info}</span><div class="nb"><b>A level change moves your range</b>
      ${v.reviewed
        ? 'A3 is E1 to B2, which is why Explorer’s first two levels appeared in your queue this month.'
        : 'A2 is E2 to B1. A3 would add Explorer’s first two levels and Builder’s second.'}</div></div>
    <div class="tal-sugg">${askChip('What moves me to A3?')}</div>
  </section>`;

/* --------------------------------------------------------------------------
   PROFILE — the roles-stack rule, and what Tal may do.

   NO `sub` ON THIS PAGE. Profile has no factual spine — there is no `·` row of
   figures that is true of it — so the title stands alone over Tal's sentence.
   Inventing a line to fill the slot is what produces two summaries six
   millimetres apart, which is the duplication the rule exists to stop.
   -------------------------------------------------------------------------- */
V.profile = v => head({title: 'Profile'}) + `

  <section class="sec">
    <div class="sec-h"><h2>You</h2></div>
    <div class="tile-stack">
      <div class="cardrow">
        <span class="cardrow-ic">${avatar(A.i, AV.owen, 40)}</span>
        <span class="cardrow-b"><span class="cardrow-t">${A.n}</span>
          <span class="cardrow-d">${A.email}</span></span>
        <span class="cardrow-a"><button class="btn btn-g btn-sm noic" data-sheet="profile">Edit</button></span>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Your roles</h2></div>
    ${kv([
      ['Talent agent', v.certified ? `Since ${A.since}` : 'Added 12 June'],
      ['Candidate', 'Explorer – E4, finished March 2024'],
      ['Sign-in', 'One account, one password']])}
    <div class="note mt5"><span>${I.info}</span><div class="nb"><b>Roles stack</b>
      Becoming an agent added a role to the account you already had. Your own record as a candidate is untouched by anything you do here.</div></div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>What Tal does</h2></div>
    <label class="tg"><div class="tb"><b>Draft my reports</b>
      <span>From the transcript, within an hour of the call</span></div>
      <input type="checkbox" data-perm="draft"${S.perms.draft ? ' checked' : ''}><span class="sw"></span></label>
    <label class="tg"><div class="tb"><b>Summarise a candidate before a call</b>
      <span>Their quiz result, what they asked for, and their summary if there is one</span></div>
      <input type="checkbox" data-perm="brief"${S.perms.brief ? ' checked' : ''}><span class="sw"></span></label>
    <label class="tg"><div class="tb"><b>Suggest follow-ups during the interview</b>
      <span>On your screen only, and never in the recording</span></div>
      <input type="checkbox" data-perm="live"${S.perms.live ? ' checked' : ''}><span class="sw"></span></label>
    <p class="help mt4">Turn drafting off and Tal stops reading your transcripts the same day.</p>
  </section>

  <section class="sec">
    <div class="btn-row">
      <button class="btn btn-g noic" data-confirm="logout">Log out</button>
    </div>
  </section>`;

/* ==========================================================================
   THE FRAME
   ========================================================================== */
function shell(v){
  return `
  <header class="shell">
    <button class="shell-act nav-t ${S.nav ? 'on' : ''}" data-toggle="nav"
      aria-label="${S.nav ? 'Collapse' : 'Expand'} navigation">${S.nav ? I.close
      : `<span class="nav-t-mark">${TN_MARK}</span><span class="nav-t-menu">${I.menu}</span>`}</button>
    <!-- THE REAL LOCKUP, not the mark plus the word set in type. The design
         system's JS now carries the portal's own PNGs — LOGO_K black, LOGO_W
         white — so the app bar can hold the same image the candidate portal
         holds instead of an approximation of it, and this file needs no CSS to
         size a wordmark it is no longer drawing.

         A BUTTON, NOT AN ANCHOR: an anchor with no href picks up the prose-link
         styling below 900px, and going home is an action here rather than a
         document reference. (No backticks in a comment inside a template
         literal, either — they end the string.) -->
    <button class="shell-logo" data-go="dashboard" aria-label="TalentNext home"><img src="${LOGO_K}" alt="TalentNext"></button>
    <div class="shell-right">
      <span class="shell-name">Talent agent${v.certified ? ` &middot; ${v.rangeShort}` : ''}</span>
      <button class="shell-act ${S.tal ? 'on' : ''}" data-toggle="tal" aria-label="Ask Tal">${I.talChat}</button>
      <span class="av-ph sm shell-avatar"><i>${A.i}</i><img src="${AV.owen}" alt=""></span>
    </div>
  </header>`;
}

function sidenav(v){
  const active = parentOf(S.view, v.nav) || S.view;
  const items = NAVSETS[v.nav].map(([k, l, ic]) =>
    `<button class="sn-item ${k === active ? 'on' : ''}" title="${l}" data-go="${k}"${k === active ? ' aria-current="page"' : ''}>${I[ic]}<span>${l}</span></button>`).join('');
  return `
  <div class="scrim ${S.nav ? 'on' : ''}" data-close="nav"></div>
  <nav class="sidenav ${S.nav ? 'on' : ''}" aria-label="Portal">
    <div class="sn-main">${items}</div>
    <div class="sn-foot">
      <button class="sn-item ${active === 'profile' ? 'on' : ''}" title="Profile" data-go="profile">${I.user}<span>Profile</span></button>
      <button class="sn-item" title="Log out" data-confirm="logout">${I.logout}<span>Log out</span></button>
    </div>
  </nav>`;
}

/* TAL'S PANEL, as a sheet.

   NOTHING IN IT KEEPS STATE IN THE DOM. `device.innerHTML` is replaced on
   every render, so the chosen question is `S.talQ` and the answer is drawn
   from the table — a class a click handler added would be gone by the next
   paint. That is `hifi/`'s rule for anything inside Tal and it is the reason
   its whole thread is a pure function of `S`.

   THE QUESTIONS ARE BUTTONS, NOT PAGE ROWS. A `.tile`/`.gcard` borrowed into a
   sheet brings the page's `--pad-x` indent with it and hangs off both sides —
   the trap `35-book.css` answers with one declaration. A `.btn-row` of small
   outlined buttons has no gutter to bring. */
/* THE CHIPS ARE THE PAGE'S, THE ANSWERS ARE TAL'S. The chips offered are the
   ones for the page you are on; the answer is looked up across the whole
   table, because a chip printed on a page can name a question that lives in
   another page's list — the dashboard offers "how is the report written",
   which is an Interview question. Looking it up in the current page's list
   only is what made Tal open empty when asked from the dashboard. */
const talAnswer = q => Object.values(TALQ).flat().find(e => e[0] === q);

function talSheet(){
  const qs = TALQ[S.view] || TALQ.dashboard;
  const a = talAnswer(S.talQ);
  return `<div class="modal ${S.tal ? 'on' : ''}" data-close="tal">
    <div class="sheet">
      <div class="sheet-h"><h2>Ask Tal</h2>
        <button class="x" data-close="tal" aria-label="Close">${I.close}</button></div>
      <div class="sheet-b">
        ${a ? tw(a[0], a[2] ? `<p class="t-body-02">${a[1]}</p>${twLines(a[2])}` : `<p class="t-body-02">${a[1]}</p>`,
                 a[3] ? twBtn(a[3][0], a[3][1]) : '') : `
          <div class="ai-aura">
            <div class="ai-head"><span class="ai-label bare">Tal</span></div>
            <div class="ai-body"><p>I can read your listing, your interviews, your scores and the money. What do you need?</p></div>
          </div>`}
        <span class="tal-sugg">
          ${qs.filter(q => q[0] !== S.talQ).map(q => askChip(q[0])).join('')}
        </span>
      </div>
    </div>
  </div>`;
}

/* CONFIRMATION BEFORE ANYTHING THAT CANNOT BE TAKEN BACK — signing a report,
   and logging out. Both are one press away from the edge of the product. */
const CONFIRMS = {
  logout: ['Log out?', 'You will need your password to come back in.', 'Log out'],
  sign:   ['Sign and send?', 'The level goes to the candidate as soon as this is signed, and a change afterwards is a review decision.', 'Sign and send']
};
function confirmSheet(){
  const c = CONFIRMS[S.confirm];
  return `<div class="modal ${S.confirm ? 'on' : ''}" data-close="confirm">
    <div class="sheet">
      <div class="sheet-h"><h2>${c ? c[0] : ''}</h2>
        <button class="x" data-close="confirm" aria-label="Close">${I.close}</button></div>
      <div class="sheet-b"><p class="t-body-02">${c ? c[1] : ''}</p></div>
      <div class="sheet-f">
        <button class="btn btn-s noic" data-close="confirm">Cancel</button>
        <button class="btn btn-p noic" data-close="confirm">${c ? c[2] : ''}</button>
      </div>
    </div>
  </div>`;
}

/* The editing sheets. One component, four titles — the fields differ, the
   frame does not. */
const SHEETS = {
  listing: ['Your listing', `
    <label class="f"><span class="lbl">Headline</span>
      <input class="inp" value="Eleven years in delivery, six of them managing managers"></label>
    <label class="f"><span class="lbl">Bio</span>
      <textarea class="inp" rows="3">I interview for how somebody actually ran a week, not for how they describe themselves.</textarea></label>
    <p class="help">Your name, photo and the range you assess come from your account and your level.</p>`],
  fee: ['Your fee', `
    <label class="f"><span class="lbl">What a candidate pays</span>
      <input class="inp" value="$85"></label>
    <div class="kv"><span class="k">You would be paid</span><span class="v">$68</span></div>
    <p class="help">A new fee applies to new bookings. Anything in escrow settles at the rate it was booked at.</p>`],
  slot: ['Add a slot', `
    <label class="f"><span class="lbl">Day</span>
      <select class="inp"><option>Monday 31 August</option><option>Tuesday 1 September</option></select></label>
    <label class="f"><span class="lbl">Time</span>
      <select class="inp"><option>3:00 PM ET</option><option>5:00 PM ET</option><option>7:00 PM ET</option></select></label>
    <p class="help">45 minutes, and it can be taken back any time before it is booked.</p>`],
  brief: ['A note to yourself', `
    <label class="f"><span class="lbl">Note</span>
      <textarea class="inp" rows="3" placeholder="Only you and Tal can see this"></textarea></label>
    <p class="help">Kept with the brief and never sent to the candidate.</p>`],
  profile: ['Your details', `
    <label class="f"><span class="lbl">Full name</span><input class="inp" value="Owen Clarke"></label>
    <label class="f"><span class="lbl">Email</span><input class="inp" value="owen.clarke@fieldstone.co"></label>`]
};
function editSheet(){
  const s = SHEETS[S.sheet];
  return `<div class="modal ${S.sheet ? 'on' : ''}" data-close="sheet">
    <div class="sheet">
      <div class="sheet-h"><h2>${s ? s[0] : ''}</h2>
        <button class="x" data-close="sheet" aria-label="Close">${I.close}</button></div>
      <div class="sheet-b">${s ? s[1] : ''}</div>
      <div class="sheet-f">
        <button class="btn btn-s noic" data-close="sheet">Cancel</button>
        <button class="btn btn-p noic" data-close="sheet">Save</button>
      </div>
    </div>
  </div>`;
}

/* ==========================================================================
   RENDER

   THE WHOLE FRAME IS REPRINTED, which is `hifi/`'s model and the reason it is
   worth inheriting: no component may keep state in the DOM, so anything
   interactive has to be a pure function of `S`.

   `data-enter` is a ONE-RENDER motion cue and is stamped only when the page
   actually changed — flipping a switch or opening Tal must not replay the
   entrance. `data-shown` is the state and is what layout may read.
   ========================================================================== */
const device = document.getElementById('device');
const MO = {key:'', open:{}};

function render(){
  const v = f();
  const parent = parentOf(S.view, v.nav);
  if(!NAVSETS[v.nav].some(([k]) => k === S.view) && S.view !== 'profile'
     && !(parent && NAVSETS[v.nav].some(([k]) => k === parent))){
    S.view = 'dashboard';           /* a stage that lost the page you were on */
  }
  /* AND NO INTERVIEW PAGE IN A STAGE WITH NO INTERVIEWS. `live` is the day the
     listing went up: the Interviews page correctly says nothing is booked, so
     a detail page for a booking that does not exist yet is the one screen that
     could contradict its own stage. Nothing links to it there; this is for the
     stage picker, which can leave you on a view the new stage does not have. */
  if(S.view === 'interview' && !v.busy) S.view = 'interviews';
  const view = V[S.view] || V.dashboard;

  const key = S.stage + '/' + S.view + '/' + (S.view === 'interview' ? S.iv : '') + '/' + S.tab;
  const entered = key !== MO.key;
  MO.key = key;

  const OVER = ['nav', 'tal', 'confirm', 'sheet'];
  const opened = OVER.filter(k => S[k] && !MO.open[k]);
  const shown  = OVER.filter(k => S[k]);
  for(const k of OVER) MO.open[k] = !!S[k];

  const at = ` data-rail="${S.nav ? 'open' : 'shut'}"`
           + ` data-view="${S.view}"`
           + (entered ? ' data-enter' : '')
           + (opened.length ? ` data-open="${opened.join(' ')}"` : '')
           + (shown.length ? ` data-shown="${shown.join(' ')}"` : '');

  device.innerHTML = `<div class="app"${at}>
    ${shell(v)}
    <div class="shell-body">
      ${sidenav(v)}
      <div class="view-col">
        <main class="main"><div class="page">${view(v)}</div></main>
      </div>
    </div>
    ${talSheet()}${confirmSheet()}${editSheet()}
  </div>`;

  dsStagger(device.querySelector('.page'));
  document.getElementById('pick').value = S.stage;
  const st = STAGES.find(s => s[0] === S.stage);
  document.getElementById('cap').innerHTML = st ? `<b>${st[1]}.</b> ${st[2]}` : '';
}

/* --------------------------------------------------------------------------
   NAVIGATION — one delegated listener on a container that outlives the render.

   `data-iv` IS READ IN THE CAPTURE PHASE, before the click reaches the router,
   which is what keeps `data-go` a plain view name. The alternative is a
   `data-go="interview:sofia"` that the router has to split, and the wireframe's
   `data-ag="member:41:Maryam Naz"` is what that turns into.
   -------------------------------------------------------------------------- */
device.addEventListener('click', e => {
  const t = e.target.closest('[data-iv]');
  if(t) S.iv = t.dataset.iv;
}, true);

device.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-toggle],[data-close],[data-ask],[data-tab],[data-confirm],[data-sheet],[data-stp]');
  if(!t) return;
  const d = t.dataset;

  /* THE BACKDROP CLOSES, THE SHEET DOES NOT. `data-close` sits on the modal
     root as well as on the cancel controls, so a click anywhere inside the
     sheet still finds it by `closest()` — which shut the sheet the moment
     anybody put the cursor in a field. When the match IS the modal, only the
     backdrop itself counts; a real control matches as itself and closes. */
  if(d.close){
    if(t.classList.contains('modal') && e.target !== t) return;
    S[d.close] = false; if(d.close === 'tal') S.talQ = null;
    return render();
  }
  if(d.toggle){ S[d.toggle] = !S[d.toggle]; if(d.toggle === 'tal') S.talQ = null; return render(); }
  if(d.confirm){ S.confirm = d.confirm; return render(); }
  if(d.sheet){ S.sheet = d.sheet; return render(); }
  /* A CHIP ON A PAGE AND A CHIP IN THE SHEET ARE THE SAME CONTROL. Both carry
     `data-ask`, and asking opens Tal if Tal is not already open — which is
     what makes an `askChip` on a page an offer rather than a dead end. */
  if(d.ask){ S.talQ = d.ask; S.tal = true; return render(); }
  if(d.tab){ S.tab = d.tab; return render(); }
  /* THE STEPS POPUP. `.stp-all` is promoted to a centred overlay inside the
     head band, so the toggle and the scrim behind it are one flag on `S`. */
  if(d.stp !== undefined){ S.stp = d.stp === '1'; return render(); }
  if(d.go){
    S.view = d.go; S.nav = false; S.tal = false; S.talQ = null;
    if(d.go === 'interviews') S.tab = 'next';
    render();
    device.querySelector('.main').scrollTop = 0;
  }
});

/* The switches keep their state on `S`, not in the DOM, for the same reason
   everything else does: the next render would print the markup's default. */
device.addEventListener('change', e => {
  const p = e.target.closest('[data-perm]');
  if(p){ S.perms[p.dataset.perm] = p.checked; }
});

/* --------------------------------------------------------------------------
   PROTOTYPE CHROME
   -------------------------------------------------------------------------- */
document.getElementById('ptLogo').innerHTML = `<img src="${LOGO_W}" alt="TalentNext">`;
document.getElementById('pick').innerHTML =
  STAGES.map(s => `<option value="${s[0]}">${s[1]}</option>`).join('');

document.getElementById('pick').onchange = e => {
  S.stage = e.target.value; S.view = 'dashboard'; S.nav = false; S.tal = false;
  render();
};
document.getElementById('reset').onclick = () => {
  S.view = 'dashboard'; S.nav = false; S.tal = false; S.talQ = null;
  S.confirm = false; S.sheet = false; S.tab = 'next'; S.iv = 'rafael';
  render();
};

/* ONE DOCUMENT, THREE SIZES. Each frame keeps its true pixel width so the
   container queries inside it resolve honestly, and is scaled down to fit
   rather than squashed. Desktop is not a device: it has no bezel and takes the
   whole stage, which is also the honest preview. */
const VP_SIZE = {mobile:[390, 844], tablet:[744, 1133], fluid:[1440, 900]};
const fitBox = document.getElementById('fit');

function fitFrame(){
  const vp = device.dataset.vp;
  const stage = fitBox.parentElement;
  const pct = document.getElementById('vpscale');
  if(vp === 'fluid'){
    device.style.transform = 'none';
    device.style.width = '100%';
    device.style.height = Math.max(520, window.innerHeight - stage.getBoundingClientRect().top - 64) + 'px';
    fitBox.style.width = '100%';
    fitBox.style.height = device.style.height;
    if(pct) pct.textContent = Math.round(stage.clientWidth) + 'px';
    return;
  }
  const [w, h] = VP_SIZE[vp] || VP_SIZE.mobile;
  device.style.width = w + 'px';
  device.style.height = Math.min(h, Math.round(window.innerHeight * 0.8)) + 'px';
  const avail = stage.clientWidth - 8;
  const scale = Math.min(1, avail / w);
  device.style.transform = scale < 1 ? `scale(${scale})` : 'none';
  fitBox.style.width = Math.round(w * scale) + 'px';
  fitBox.style.height = Math.round(parseFloat(device.style.height) * scale) + 'px';
  if(pct) pct.textContent = scale < 1 ? Math.round(scale * 100) + '%' : '100%';
}

document.getElementById('vp').addEventListener('click', e => {
  const b = e.target.closest('button[data-vp]');
  if(!b) return;
  document.querySelectorAll('#vp button').forEach(x => x.classList.toggle('on', x === b));
  device.dataset.vp = b.dataset.vp;
  S.nav = false;
  render();
  fitFrame();
});
window.addEventListener('resize', fitFrame);

render();
fitFrame();
</script>
</body>
</html>
