<script>
/* ==========================================================================
   THE TALENT AGENT PORTAL

   A THIRD SIGNED-IN USER, IN A FILE OF ITS OWN. The candidate and the cohort
   leader share `hifi/` because a demo has to walk from one side of a cohort to
   the other without a reload — they are two views of the same fortnight. An
   agent is not: they meet a candidate for forty-five minutes, once, and never
   see the 90 days. Nothing is gained by putting a switch between them, so this
   is a separate file linking the same design system, which is what
   design-system/ exists for.

   THE JOURNEY IS THE FLOW DIAGRAM. Its four stages and thirteen steps are the
   stage picker on the black bar:

     Stage 1  Recruitment and vetting   → `apply`, `vetting`   (steps 1, 2 + gate)
     Stage 2  Account, listing, money   → `setup`              (steps 3, 4, 5, 6)
     Stage 3  Enablement and go-live    → `training`           (step 7 + gate)
     Stage 4  Operating as an agent     → `live`, `working`,
                                          `reviewed`           (steps 8–13)

   The diagram's left column — the open questions — does NOT cross into a
   hi-fi screen, the same rule `hifi/` keeps against the wireframe's
   client-facing annotations. An undecided thing is decided here and the
   decision is written down in the handoff, not drawn on the page as a
   question. The four that were genuinely undecided, and what this file does:

     - AN AGENT ROLE IS ADDED TO AN ACCOUNT, it is not a second account. The
       diagram's own rule says roles stack, so Profile says so and the
       candidate record is left alone.
     - THE 20/80 SPLIT IS THE MODEL, and the $100 monthly listing fee is not
       in force. Two revenue models were never reconciled; the split is the
       later of the two and the one that was confirmed. An agent who is also
       charged a subscription would need a card on file, and a portal that
       takes money FROM an agent is a different product.
     - MONEY NEVER TOUCHES THIS PORTAL. Payouts are a handoff to Stripe, the
       same shape as the candidate's booking: TalentNext holds no bank
       details and this file draws no bank form. `hifi/`'s `ai7.js` makes the
       same call for the same reason.
     - THE INTERVIEW SETS THE LEVEL AND THE AGENT SIGNS IT; a change after the
       signature is a review decision above them. That is what reconciles the
       diagram's "the agent cannot change candidate levels" with the candidate
       portal, where every level is signed by the agent who set it.

   AND THE BOUNDARY IS KEPT BY OMISSION. "Agents do not lead cohorts" is not a
   line of copy anywhere below — cohorts, chapters, weeks and the 90 days do
   not appear in this portal at all, which is a stronger way to say it than a
   note explaining what the reader cannot do.

   --------------------------------------------------------------------------
   WHICH COMPONENTS THIS PAGE IS MADE OF, AND WHY THAT LIST CHANGED

   The first build of this file was correct and did not look like TalentNext.
   It was written against a design system whose build used an allowlist, and
   the allowlist had dropped every component carrying the brand — so a page
   built honestly out of what was in the box came out as hairline sections,
   figure cells and list rows, which is a well-made admin table.

   `build-ds.py` is include-by-default now, and this file is rebuilt on what
   that ships. The four that do the work, all from **Signature** in
   `gallery.html`, all with fixed internal markup:

     `.ai-aura`   Tal's band. Every page's summary, and Tal's report draft.
     `.plate`     the black hero: the next interview, the calibration slot.
                  Its CTA is a plain `.btn.btn-p` and comes out ORANGE.
     `.wkc`+`.ring` the four training modules, drawn the way the candidate's
                  chapters are drawn.
     `.lvl-hero`  the agent's level. `.cert` for the certificate.

   Tal answers with `tw()` — the portal's own reply widget — and offers with
   `.chip-tal`. **`.tal-panel` and `.tal-fab` are NOT used**: §27 hides both
   (`display:none`, restated inside the container query), because the thread
   moved to the ask dock, and the dock is one of the eight families
   `build-ds.py` excludes by name since its behaviour *is* a render pass. A
   surface the design system switches off is not a surface to build on. Tal's
   questions therefore open a `.sheet`, which is a component the system does
   ship, and everything inside it is Tal's own vocabulary.
   ========================================================================== */

/* --------------------------------------------------------------------------
   WHO IS SIGNED IN

   OWEN CLARKE, on purpose, and not a new name. He is already one of the three
   agents the candidate portal offers Maryam — $85, assesses E2 to B1, 164
   interviews, rated 4.6 — so the demo can book him on one side and see the
   booking arrive on the other. Priya Nair was the obvious pick and is the
   wrong one: she is already the cohort leader AND the agent who signed
   Maryam's report, and a third role on the same person makes the roles-stack
   rule impossible to read.

   The figures below are the marketplace's, unchanged. `f()` merges the stage
   over them, because an agent on their first day has none of them yet.
   -------------------------------------------------------------------------- */
const A = {
  n:'Owen Clarke', i:'OC', email:'owen.clarke@fieldstone.co',
  since:'June 2024',
  range:'Explorer E2 – Builder B1', rangeShort:'E2 – B1',
  fee:85, share:68, cut:17,          /* $85, split 80/20 → $68 and $17 */
  rating:4.6, ivs:164, month:9,
  level:'A2', levels:4, rank:12, pool:38,
  follow:4.4, depth:4.7,
  manager:'Nadia Rahman',
  escrow:204, earned:612,
  payout:'Stripe · account ending 4417'
};

/* --------------------------------------------------------------------------
   THE STAGES

   `[key, label, caption]`, the shape `hifi/`'s own STAGES uses, and the
   caption prints under the frame. Seven snapshots, in the order the diagram
   runs. Each is internally consistent and they are not one continuous week:
   the onboarding four are June 2024, when Owen joined, and the operating three
   are now. A stage that had to hold both would have to claim 164 interviews on
   an agent who has not been certified yet.
   -------------------------------------------------------------------------- */
const STAGES = [
  ['apply',    'Applying',              'Stage 1. The application is open and unsent. Two of the five parts are missing, and nothing is reviewed until all five are in.'],
  ['vetting',  'In vetting',            'Stage 1. Submitted 3 June. Identity has cleared, the background check is running and one of the two references is back. The approval gate is ahead.'],
  ['setup',    'Approved, setting up',  'Stage 2. Approved 12 June, and the agent role is on the account Owen already had. Listing, fee and payout destination are what is left.'],
  ['training', 'Training',              'Stage 3. Listing and money are done. Three of four modules are finished and the calibration interview is the last thing before the certification gate.'],
  ['live',     'Listed, nothing booked','Stage 4, day one. Certified 20 June and visible in the marketplace since Monday. Six slots are open and no one has taken one yet.'],
  ['working',  'A working week',        'Stage 4. Two interviews ahead, one report due tonight, and $204 in escrow. This is the portal as an agent actually uses it.'],
  ['reviewed', 'After a review',        'Stage 4, step 13. The quarterly review moved Owen to A3 and widened the range he may assess to E1 – B2.']
];

/* Stage config. Anything absent falls back to `A`. */
const CFG = {
  apply:    {nav:'early', sent:false, ivs:0, month:0, rating:null, escrow:0, earned:0},
  vetting:  {nav:'early', sent:true,  ivs:0, month:0, rating:null, escrow:0, earned:0},
  setup:    {nav:'setup', approved:true, ivs:0, month:0, rating:null, escrow:0, earned:0},
  training: {nav:'setup', approved:true, listed:false, listing:true, paid:true, mods:3,
             ivs:0, month:0, rating:null, escrow:0, earned:0},
  live:     {nav:'full',  approved:true, listing:true, paid:true, mods:4, certified:true, listed:true,
             ivs:0, month:0, rating:null, escrow:0, earned:0},
  working:  {nav:'full',  approved:true, listing:true, paid:true, mods:4, certified:true, listed:true,
             busy:true},
  reviewed: {nav:'full',  approved:true, listing:true, paid:true, mods:4, certified:true, listed:true,
             busy:true, reviewed:true,
             level:'A3', range:'Explorer E1 – Builder B2', rangeShort:'E1 – B2',
             rank:9, follow:4.6, ivs:171, month:7}
};

const S = {stage:'working', view:'dashboard', nav:false, tal:false, talQ:null,
           iv:'rafael', tab:'next', confirm:false, sheet:false, stp:false,
           perms:{draft:true, brief:true, live:false}};

const f = () => ({...A, ...CFG[S.stage]});

/* --------------------------------------------------------------------------
   THE RAIL

   THREE SETS, BECAUSE THE NAV IS THE RECORD OF WHAT IS UNLOCKED — the same
   reason the candidate's grows from four items to nine. An agent who has not
   been approved has one page and a form; an agent who cannot be booked has no
   Interviews page to look at; the full set arrives with the listing.
   -------------------------------------------------------------------------- */
const NAVSETS = {
  early: [['dashboard','Home','dashboard'], ['application','Application','document']],
  setup: [['dashboard','Home','dashboard'], ['listing','Listing','view'],
          ['training','Training','book'], ['earnings','Earnings','wallet']],
  full:  [['dashboard','Home','dashboard'], ['interviews','Interviews','calendar'],
          ['availability','Availability','time'], ['listing','Listing','view'],
          ['earnings','Earnings','wallet'], ['standing','Standing','chart']]
};

/* A sub-page's rail item is its parent's — `interview` is reached from
   `interviews` and must not un-mark it.

   AND TRAINING CHANGES PARENT WITH THE STAGE, because it changes job. While an
   agent is being enabled it is a module they are working through and it has a
   rail item of its own; once they are certified it is the certificate and the
   date of the next re-check, which is reference material read twice a year —
   so it moves under Standing and the rail keeps the six things a working agent
   opens weekly. A stage-blind map would have marked a rail item that is not in
   the set, and the render guard would have bounced the page. */
const parentOf = (view, nav) =>
  view === 'interview' ? 'interviews'
  : (view === 'training' && nav === 'full') ? 'standing'
  : null;

/* --------------------------------------------------------------------------
   THE INTERVIEWS

   Five, and the working week is built out of them. The fee is the same $85 on
   every row because it is Owen's rate, not a negotiation: the candidate pays
   into escrow at booking, so an interview that has not happened is already
   paid for. Three of these are what makes escrow $204 — Rafael (booked),
   Sofia (held, report not delivered) and Tom (delivered, releasing Thursday).
   -------------------------------------------------------------------------- */
const IVS = [
  {id:'rafael', n:'Rafael Ortiz', i:'RO', st:'next',
   day:'Thursday 20 August', time:'3:00 PM ET', kind:'First interview',
   band:'Explorer, predicted by the quiz', asked:'Delegation, and being new to managing former peers',
   paid:'Paid at booking, 19 August'},

  {id:'amara', n:'Amara Osei', i:'AO', st:'next',
   day:'Monday 24 August', time:'6:00 PM ET', kind:'Re-interview',
   band:'Builder – B1, set 4 March', asked:'Hard conversations, and holding a line under pressure',
   paid:'Paid at booking, 18 August', summary:true},

  {id:'sofia', n:'Sofia Marek', i:'SM', st:'report',
   day:'Tuesday 18 August', time:'5:00 PM ET', kind:'First interview',
   band:'Explorer, predicted by the quiz', level:'Explorer – E2',
   due:'6:00 PM today', asked:'Running her first team of four'},

  {id:'tom', n:'Tom Whelan', i:'TW', st:'done',
   day:'Monday 17 August', time:'6:30 PM ET', kind:'Re-interview',
   level:'Builder – B1', signed:'17 August', money:'Releases Thursday 20 August',
   follow:4.6, depth:4.8},

  {id:'nina', n:'Nina Haddad', i:'NH', st:'done',
   day:'Friday 14 August', time:'4:00 PM ET', kind:'First interview',
   level:'Explorer – E4', signed:'15 August', money:'Paid 19 August',
   follow:4.3, depth:4.7}
];
const iv = id => IVS.find(x => x.id === id) || IVS[0];

/* FIVE PORTRAITS ACROSS MORE THAN FIVE PEOPLE. The design system's JS carries
   the portal's own five, and this is the same fidelity choice `hifi/` states
   for its ten cohort members rather than a claim that these are one person. */
const PHOTOS = {rafael: AV.lena, amara: AV.hana, sofia: AV.priya,
                tom: AV.samuel, nina: AV.hana};

/* The four training modules, in the order they are taken. `f.mods` is how many
   of them are finished, so this list and the ring cannot drift apart. */
const MODULES = [
  ['How the interview runs', '45 minutes, and what each part is for'],
  ['Drawing out a story', 'Getting past the answer somebody rehearsed'],
  ['Evidence, not impression', 'What a level has to be able to point at'],
  ['Writing the report', 'The 24 hours after the call']
];

/* Availability. `on` is a taken slot — `.slot.sel` draws it filled, which is
   the design system's own "this one is chosen" and reads correctly for "this
   one is spoken for" too. */
const SLOTS = [
  ['This week', [
    ['Wed 19', '7:00 PM', 0], ['Thu 20', '3:00 PM', 1], ['Fri 21', '5:00 PM', 0]]],
  ['Week of 24 August', [
    ['Mon 24', '6:00 PM', 1], ['Tue 25', '5:00 PM', 0], ['Wed 26', '7:00 PM', 0],
    ['Thu 27', '3:00 PM', 0], ['Fri 28', '5:00 PM', 0]]]
];

/* ==========================================================================
   TAL

   THE CONCEPT CARRIED ACROSS IS THE PAGE SUMMARY, not the thread. In `hifi/`
   every page opens with Tal saying, in two sentences, what has moved — and
   that pass (`ai6.js`) exists because a page whose top is a caption of itself
   is a page nobody reads. The rules travel with it exactly:

     - TWO SENTENCES, 18 TO 28 WORDS. Say the thing and stop.
     - THE FACTS, IN THE ORDER A PERSON WOULD ASK FOR THEM. Where you are,
       what is open, what is on you. The numbers ARE the content.
     - A CATCH-UP, NOT A DESCRIPTION. If the line would read the same next
       week, it is a caption. The reader is looking at the page already.
     - NO FRAMING, NO POLICY, NO POINTING AT THE UI, and nothing from another
       portal — an agent is not told what a candidate's Cohort page looks like.
     - CONTRACTIONS, PLAIN WORDS. Tal talking to one person.

   AND THE SPLIT WITH THE GREY LINE IS A RULE, not a preference. `ph(title,
   sub)`'s second argument carries the page's FACTUAL SPINE as a `·` row — no
   verb, no claim — and Tal carries the READING. Where a page has no spine it
   gets no `sub` and the title stands alone over Tal's sentence, which is why
   Profile passes a title only. Writing a sentence into both slots is what
   produced the duplication `ai6.js` was mostly written to remove.

   THE CARD IS A `.note acc`. `hifi/`'s aura and its head band are one product
   surface's own vocabulary and `build-ds.py` drops them by name, so the
   summary is drawn with the component the design system does carry: the
   accent note, which is the one tone reserved for "something that is yours".
   The mark is `talChat`, the same glyph the candidate portal uses for Tal.
   ========================================================================== */
const PAGESUM = {

  dashboard: {
    apply:   'Nothing’s sent yet — three of the five parts are filled in. Your two referees are the piece that needs someone else’s time.',
    vetting: 'Submitted 3 June. Identity cleared the same day, the background check is with the provider, and one of your two references is back.',
    setup:   'Approved on 12 June, and the agent role sits on the account you already had. Listing and fee are done; payouts aren’t.',
    training:'Three of four modules done, and calibration is Thursday 20 June with Derek Hale. Certification is the last thing before you can be booked.',
    live:    'Listed since Monday and nothing booked yet. Six slots are open over the next fortnight, and Friday at 5:00 PM is the first.',
    working: 'Sofia Marek’s report is due at 6:00 PM today, and Rafael Ortiz is Thursday at 3:00 PM. $204 is sitting in escrow.',
    reviewed:'Nadia moved you to A3 on 1 October, so you can assess E1 to B2 now. Two bookings arrived in the week since.'
  },

  application: {
    apply:   'Experience and motivation are written, your two referees aren’t. Nothing is looked at until all five parts are in — usually five working days after that.',
    _:       'Submitted 3 June with two referees. Identity cleared, the background check is with the provider, and Marisa Vance decides once both are back.'
  },

  listing: {
    setup:   'Your card is written and your fee is $85, which leaves you $68 after the split. Payouts are the one thing still stopping a booking.',
    training:'Your card and fee are set, and nothing is visible yet — a listing goes live the day you’re certified. Delegation is your first specialism.',
    live:    'You’ve been in browse since Monday at $85, assessing E2 to B1. No rating yet: the first three interviews are what make one.',
    _:       'You’re visible at $85 assessing E2 to B1, with 164 interviews and 4.6 behind you. Delegation is the specialism candidates search for most.'
  },

  },

    _:       'Two ahead — Rafael on Thursday, Amara on Monday — and Sofia’s report is due at 6:00 PM. 164 finished in total.'
  },

  /* A FUNCTION, BECAUSE THE PAGE IS FIVE DIFFERENT PAGES. Reads `S.iv` and the
     record itself, so the figures cannot drift from the interview being read. */
  interview: () => {
    const v = iv(S.iv);
    if(v.st === 'next')   return `${v.n} is ${v.day.split(' ')[0]} at ${v.time}, paid and confirmed. ${v.summary ? 'It’s a re-interview, so their 90-day summary is on the brief.' : 'They’re straight off the quiz, so no level exists yet.'}`;
    if(v.st === 'report') return `You interviewed ${v.n} yesterday and the write-up is due at ${v.due}. Tal has a draft off the transcript waiting for your edit.`;
    return `${v.n}, ${v.day.replace(/^\w+ /,'')}, confirmed at ${v.level} and signed the same evening. Follow-up scored ${v.follow} and depth ${v.depth}.`;
  },

  availability: 'Six slots are open over the next fortnight and two are taken. Friday at 5:00 PM is the first one nobody has claimed.',

    live:    'Nothing earned yet. Your $85 splits to $68 once a report is delivered, and it sits in escrow for three working days first.',
    _:       '$612 earned this month across nine interviews, and $204 is still in escrow. Tom’s $68 releases Thursday, three days after his report went out.'
  },

  standing: {
    reviewed:'The review moved you up a level on 1 October, so you may assess E1 to B2 now. Follow-up came up to 4.6 over the quarter.',
    _:       'Follow-up came up to 4.4 in August and depth has held at 4.7 since May. Nadia Rahman reads the quarter on 1 October.'
  },

};

/* --------------------------------------------------------------------------
   THE QUESTIONS TAL OFFERS

   `hifi/`'s TALCTX, one row per page. THREE, and they are the questions a
   person actually arrives with — "can I decline this", "when do I get paid" —
   not three ways of asking what the page is. A question whose answer is on

   -------------------------------------------------------------------------- */

      ['Due', '24 hours from the end']]],

  ],

  ],

     'The candidate pays $85. TalentNext keeps 20%, which is $17, and $68 comes to you three working days after the report is delivered.',
     [['The candidate pays', '$85'], ['TalentNext keeps', '$17 &middot; 20%'], ['You are paid', '$68 &middot; 80%']]],
    ['Where do payouts land?',
     'Stripe, on the account ending 4417. TalentNext never holds your bank details — Stripe does, and Stripe is where you change them.'],
    ['What about tax?',
     'You’re paid as a contractor and the paperwork sits with Stripe. Your statements are there too, not here.']
  ],
  standing: [
    ['What’s actually being scored?',
     'Your half of the conversation — how well you followed up, and how deep you got. Tal reads the transcript. The candidate’s rating is counted separately.'],
    ['What moves me to A3?',
     'The last quarter’s volume and both scores, read by Nadia on 1 October. Follow-up at 4.5 is the usual bar; you’re at 4.4.'],
    ['Does my rank change my fee?',
     'No — you set your fee. Rank changes where you sit in browse, which is a different thing, and it is recalculated weekly.']
  ],
  profile: [
    ['What can Tal see?',
     'Your transcripts and your briefs, and nothing outside this portal. Turn drafting off and Tal stops reading transcripts the same day.'],
    ['Does this affect my candidate account?',
     'No. The agent role was added to the account you already had — same login, same details, and nothing on the other side changed.']
  ]
};

/* ==========================================================================
   HELPERS — every one of these returns design-system markup and nothing else
   ========================================================================== */

/* THE PAGE HEAD, in `hifi/`'s own shape: one `.ph` per page, carrying the only
   h1, and `sub` is the FACT ROW — never a sentence. */
function ph(title, sub, backTo){
  return `<div class="ph">
    <div class="ph-main">
      <div class="ph-top">${backTo ? `<button class="ph-back" data-go="${backTo}" aria-label="Back">${I.arrowLeft}</button>` : ''}<h1>${title}</h1></div>
      ${sub ? `<p>${sub}</p>` : ''}
    </div>
  </div>`;
}

/* Tal's summary for the current page. Looked up rather than written at the
   call site, which is the whole point: the summaries are one voice and belong
   in one table, so a new page needs a row there and nothing else. A value is a
   string, a function, or an object keyed by stage with `_` as the fallback. */
function pageSummary(){
  let e = PAGESUM[S.view];
  if(typeof e === 'function') e = e();
  if(e && typeof e === 'object') e = e[S.stage] || e._;
  return e || '';
}

/* ==========================================================================
   THE HEAD BAND — `.modhead`, and it is the opening move of every page

   THE WASH IS THE WRAPPER, NOT A RENDER PASS. `.app .modhead::before` paints
   two radial gradients in `--tal-chip-2`, and it covers whatever the wrapper
   contains — so the page header, Tal's card and the plate read as ONE band
   rather than three stacked blocks. The portal builds this wrapper with
   `placeBand` (`ai5.js`), which is what made it look like something only the
   portal could have. It is not: the paint needs nothing but the element. It
   draws its own closing hairline (`::after`) too, so nothing here adds one.

   TAL'S MARK HAS TWO FORMS AND PICKING THE WRONG ONE SHOWS. Inside a band the
   card takes `tile tight talsum` and the label stays PLAIN — §33 keys the 32px
   gradient disc on `.modhead .ai-aura.talsum > .ai-head > .ai-label::before`.
   `.bare` (§37) is the 16px fallback for a page with no band at all, and using
   it inside one puts a small dot where the disc belongs. This file had `.bare`
   everywhere before the band existed; the only place it is still right is
   Tal's draft further down the report page.

   AND THE GREETING SWALLOWS THE PAGE HEADER. `.app .modhead:has(.tal-greet) >
   .ph{display:none}` — so a card carrying a `.tal-greet` becomes the head, and
   the title and fact row under it would be a second heading nobody reads. That
   is why `greet` is passed on the dashboard and nowhere else: every other page
   needs its title, so it must not carry one.
   ========================================================================== */
function head({title, sub, back, greet, wing, plate}){
  const text = pageSummary();
  return `<div class="modhead">
    ${ph(title, sub, back)}
    ${text ? `<div class="sec">
      <div class="ai-aura tile tight talsum">
        <div class="ai-head"><span class="ai-label">Tal</span></div>
        <div class="ai-body"><p>${greet ? `<span class="tal-greet">${greet}</span>` : ''}${text}</p></div>
        ${wing || ''}
      </div>
    </div>` : ''}
    ${plate ? `<div class="sec sec-dark">${plate}</div>` : ''}
  </div>`;
}

/* FOUR CELLS, ALWAYS. `.stats` is a fixed 2/4-column grid and its hairlines
   are the 1px gap, so a row it does not fill paints grey rather than closing
   up. Three is the count to avoid. */
const stats = cells => `<div class="stats">${cells.map(([v, k]) =>
  `<div class="stat"><span class="v">${v}</span><span class="k">${k}</span></div>`).join('')}</div>`;

/* A HAIRLINE LIST, AND IT IS WHY `.facts` IS NOT USED ANYWHERE BELOW.

   `.facts` is the prettier band for reference material and it is measurably
   wrong at one width. Its columns are `auto-fit` at `minmax(140px,1fr)`, so
   the count is `floor(width / 140)`: spare tracks collapse, but cells that
   WRAP do not — row two keeps the full column count and its empty slots paint
   the rule colour, because the hairlines ARE the 1px gap. A four-cell band
   therefore paints two grey slots wherever it is 420–560px wide, which on
   these pages is a container width of about 900. The design system's README
   names the case and prescribes the fix: for a band that has to hold at every
   width, use `.kv`. `.stats` is the other safe one — a FIXED 2/4-column grid,
   so exactly four cells fill both tiers and can never leave a spare track. */
const kv = rows => `<div>${rows.map(([k, v]) =>
  `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;

/* The navigation row — the design system's replacement for every card. */
const goRow = (icon, eyebrow, title, sub, go, attr) => `
  <button class="tile clk gcard" data-go="${go}"${attr || ''}>
    <span class="cardrow-ic">${I[icon]}</span>
    <span class="gcard-b">${eyebrow ? `<span class="eyebrow">${eyebrow}</span>` : ''}
      <h3>${title}</h3><span class="sub">${sub}</span></span>
    <svg class="tile-arrow" viewBox="0 0 24 24">${inner('arrowRight')}</svg>
  </button>`;

/* A detail row: two lines and a trailing tag instead of a chevron. */
const factRow = (icon, title, detail, tag) => `
  <div class="cardrow">
    <span class="cardrow-ic">${I[icon]}</span>
    <span class="cardrow-b"><span class="cardrow-t">${title}</span>
      <span class="cardrow-d">${detail}</span></span>
    ${tag ? `<span class="cardrow-a">${tag}</span>` : ''}
  </div>`;

/* A checklist row. `checkFilled` / `circleDash` / `circle` is the same three-
   state vocabulary `hifi/`'s stepper uses. */
const checkRow = (st, title, detail, go) => {
  const ic = st === 'done' ? 'checkFilled' : st === 'now' ? 'circleDash' : 'circle';
  const tag = st === 'done' ? '<span class="tag sm green">Done</span>'
            : st === 'now'  ? '<span class="tag sm warn">On you</span>'
            : '<span class="tag sm">Waiting</span>';
  return go && st !== 'done'
    ? `<button class="tile clk gcard" data-go="${go}">
         <span class="cardrow-ic">${I[ic]}</span>
         <span class="gcard-b"><h3>${title}</h3><span class="sub">${detail}</span></span>
         <svg class="tile-arrow" viewBox="0 0 24 24">${inner('arrowRight')}</svg></button>`
    : factRow(ic, title, detail, tag);
};

/* --------------------------------------------------------------------------
   THE SIGNATURE COMPONENTS

   These four are what make a page read as TalentNext rather than as a correct
   admin table, and every one of them has internal structure the CSS keys on —
   a guessed structure looks BROKEN rather than absent. The recipes are
   `gallery.html` under **Signature**, taken from `views.js`; these wrappers
   exist so the structure is stated once here and cannot drift page to page.
   -------------------------------------------------------------------------- */

/* THE BLACK PLATE — the hero, and the one place the accent appears as a fill.

   THE CTA INSIDE IS A PLAIN `.btn.btn-p` AND COMES OUT ORANGE. §19 gives
   `.plate .btn-p` the brand gradient; the same class is black everywhere else
   on the page. Do not reach for another class to get the colour — the pairing
   is the component, and it is the single thing the first extraction lost.

   THE COUNTDOWN IS ASSEMBLED HERE, NOT DECLARED. `data-when` is documented as
   an attribute that "draws the chip in the corner", and it does — in the
   portal, where `placePlates` (`ai5.js`) reads it on every render, builds a
   `.plate-h` row, and seats the title in it beside a `.plate-when` chip
   because a plate with no eyebrow has nothing else for that row to hold
   (`.plate-h-bare` is the flag §15 keys the title's zeroed margin on). No CSS
   anywhere reads the attribute. This file has no render passes, so it emits
   the arranged shape directly and keeps `data-when` as the record of where
   the value came from. Child order then follows the portal's own, because
   that is the order the desktop grid was tuned against: head, meta, who,
   actions — `.plate-a` is explicitly placed in column 2 either way. */
const plate = ({when, av, photo, who, whoSub, title, meta, actions}) => `
  <div class="plate"${when ? ` data-when="${when}"` : ''}>
    <i class="dark-glow" aria-hidden="true"></i>
    <div class="plate-h${when ? ' plate-h-bare' : ''}">
      <div class="plate-t">${title}</div>
      ${when ? `<span class="plate-when">${I.time}<b>${when}</b></span>` : ''}
    </div>
    <div class="plate-b">${meta}</div>
    ${actions ? `<div class="plate-a">${actions}</div>` : ''}
    ${who ? `<div class="plate-who">
      ${avatar(av, photo, 56)}
      <span class="plate-wb"><b>${who}</b><span>${whoSub}</span></span>
    </div>` : ''}
  </div>`;

/* A FACE, WITH THE INITIALS BEHIND IT. `.av-ph` holds the letters and the
   photograph in the same box, so a missing asset degrades to "OC" rather than
   to a hole. The five portraits in the design system's JS are shared across
   more people than that — the same fidelity choice the portal states for its
   own ten cohort members, not a claim that these are one person. */
const avatar = (initials, photo, size) => `
  <span class="av-ph"${size ? ` style="width:${size}px;height:${size}px"` : ''}><i>${initials}</i>${
    photo ? `<img src="${photo}" alt="">` : ''}</span>`;

/* THE RING — two SVG circles, not a conic gradient. `--arc` is a
   stroke-dasharray LENGTH rather than a percentage: r=26, so the
   circumference is 163.36 and arc = 163.36 × pct/100. */
const ring = pct => `
  <div class="ring" role="img" aria-label="${pct}% done">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle class="ring-t" cx="32" cy="32" r="26"></circle>
      <circle class="ring-f" cx="32" cy="32" r="26" style="--arc:${(163.36 * pct / 100).toFixed(1)}"></circle>
    </svg>
    <span class="ring-n u-h2">${pct}<small>%</small></span>
  </div>`;

/* --------------------------------------------------------------------------
   THE STEPPER, AND IT LIVES INSIDE TAL'S CARD

   `.stp-wing` is a grid area of `.ai-aura.talsum`: at desktop it sits to the
   right of Tal's sentence behind a hairline, and on a phone it drops under it.
   That pairing is the point — where you are in the journey and what Tal makes
   of it are one thought, and the portal merged them for that reason.

   A STEPPER ON A PHONE EATS A SCREEN, so only the rail, the count and the step
   you are on are drawn; the rest is one press away in `.stp-all`, which the
   band promotes to a centred popup over an overlay. `S.stp` is that flag, on
   the state object rather than in the DOM, because `render()` reprints the
   frame and a class a handler added would be gone by the next paint.
   -------------------------------------------------------------------------- */
function stepper(steps, title){
  let i = steps.findIndex(x => x.st === 'on');
  if(i < 0) i = steps.filter(x => x.st === 'done').length ? steps.length - 1 : 0;
  const cur = steps[i], open = !!S.stp;
  const ic = st => st === 'done' ? `<span class="pi-ic" style="fill:var(--text-primary)">${I.checkFilled}</span>`
    : st === 'on' ? `<span class="pi-ic" style="fill:var(--text-primary)">${I.circleDash}</span>`
    : `<span class="pi-ic" style="fill:var(--gray-50)">${I.circle}</span>`;
  return `<div class="stp-wing">
    <div class="stp flush stp-titled${open ? ' open' : ''}">
      <div class="stp-top">
        <h2 class="u-h3">${title}</h2>
        <span class="stp-meter">
          <span class="stp-rail" role="img" aria-label="Step ${i + 1} of ${steps.length}">
            ${steps.map(x => `<i class="${x.st}"></i>`).join('')}
          </span>
          <span class="stp-c">Step ${i + 1} of ${steps.length}</span>
        </span>
        <button class="stp-t" data-stp="${open ? '0' : '1'}" aria-expanded="${open}">${open ? 'Hide steps' : 'All steps'}${I.chevDown}</button>
      </div>
      <div class="stp-now">
        <div class="pi-lab">${cur.lab}</div>${cur.sec ? `<div class="pi-sec">${cur.sec}</div>` : ''}
      </div>
      ${open ? '<div class="stp-overlay" data-stp="0"></div>' : ''}
      <div class="stp-all"><div class="stp-pop"><h3 class="stp-pop-h">${title}</h3>
        <div class="pi" style="padding:0">
          ${steps.map(x => `<div class="pi-step ${x.st}">${ic(x.st)}
            <div><div class="pi-lab">${x.lab}</div>${x.sec ? `<div class="pi-sec">${x.sec}</div>` : ''}</div></div>`).join('')}
        </div></div></div>
    </div>
  </div>`;
}

/* THE JOURNEY, WHICH IS THE FLOW DIAGRAM'S FOUR STAGES PLUS THE WORK ITSELF.
   Each stage marks one step `on`, everything before it `done`, and the rest
   blank — so the same five rows read correctly at every point in the file. */
const JOURNEY = v => {
  const at = {apply:0, vetting:1, setup:2, training:3}[S.stage] ?? 4;
  const rows = [
    ['Your application', v.sent ? 'Sent 3 June, with two referees' : 'Three of five parts filled in'],
    ['Vetting', 'Identity, a background check and two references'],
    ['Listing and payouts', `${money(v.fee)} an interview &middot; 80% of it yours`],
    ['Training and calibration', 'Four modules, then 45 minutes with Derek Hale'],
    ['Interviewing', v.busy ? `${v.ivs} on record &middot; ${v.month} this month`
      : v.certified ? 'Listed since 24 June &middot; nothing booked yet'
      : 'Bookable the day you are certified']
  ];
  return stepper(rows.map(([lab, sec], n) =>
    ({st: n < at ? 'done' : n === at ? 'on' : '', lab, sec})), 'Where you are');
};

/* HOW TAL ANSWERS. `tw()` is the portal's own reply widget — a titled block,
   a body, and an optional action — and `.tw-lines` is the key/value grid
   inside one. Tal replies with a card rather than a paragraph wherever the
   answer has fields in it; that is a decision the wireframes made and the
   portal kept. */
const tw = (title, body, action) => `<span class="tw">
  ${title ? `<span class="tw-h">${title}</span>` : ''}${body}
  ${action ? `<span class="tw-a">${action}</span>` : ''}</span>`;
const twBtn = (label, go) => `<button class="tw-btn"${go ? ` data-go="${go}"` : ''}>${label}${I.arrowRight}</button>`;
const twLines = rows => `<span class="tw-lines">${rows.map(([k, v]) =>
  `<span><b>${k}</b>${v}</span>`).join('')}</span>`;

/* TAL'S CHIP — an offer, not navigation. `.sk-mark` is the standalone mark and
   the cool pool behind it is a radial gradient on the chip itself. */
const askChip = (q, label) => `<button class="chip-tal" data-ask="${q}">
  <span class="sk-mark xs"></span>${label || q}</button>`;

/* A person, with the design system's square avatar. */
const memRow = (v, tag, go) => `
  <div class="mem"${go ? ` data-go="${go}" data-iv="${v.id}"` : ''}>
    ${avatar(v.i, PHOTOS[v.id])}
    <span class="mem-b"><span class="mem-n">${v.n}</span>
      <span class="mem-m">${v.day}<span class="mdot"></span>${v.time}</span></span>
    ${tag}</div>`;

const money = n => '$' + n.toLocaleString('en-US');

/* ==========================================================================
   THE PAGES
   ========================================================================== */
const V = {};

/* --------------------------------------------------------------------------
   HOME — four different pages, because an agent in vetting and an agent with a
   report due tonight do not share a single fact. Branching here rather than in
   four view keys keeps one `PAGESUM.dashboard` table, keyed by stage.
   -------------------------------------------------------------------------- */
V.dashboard = v => {
  /* THE DASHBOARD IS THE ONE PAGE THAT GREETS YOU, and the greeting hides the
     page header by design (§33). So the title and the fact row are still
     written — they are what a reader gets if the band ever fails — but what is
     read is Tal's line and the stepper beside it. Both carry the same facts
     the fact row would have. */
  const band = extra => head({
    title: `Welcome back, ${A.n.split(' ')[0]}!`,
    sub: v.certified ? `Talent agent &middot; assesses ${v.range} &middot; ${money(v.fee)} an interview`
       : v.approved ? 'Talent agent &middot; not yet certified'
       : 'Application in progress',
    greet: `Welcome back, ${A.n.split(' ')[0]}!`,
    wing: JOURNEY(v),
    plate: extra
  });

  /* --- stage 1: before approval ---------------------------------------- */
  if(!v.approved) return band() + `
    <section class="sec">
      <div class="sec-h"><h2>Where it is</h2></div>
      <ol class="steps">
        <li><span class="s-n">1</span><span class="s-b"><b>Your application</b>
          ${v.sent ? 'Sent 3 June, with two referees.' : 'Three of the five parts are filled in.'}</span></li>
        <li><span class="s-n">2</span><span class="s-b"><b>Identity and background</b>
          ${v.sent ? 'Identity cleared 3 June. The background check is with the provider.' : 'Runs once the form is in. Everyone you interview is 18 to 24.'}</span></li>
        <li><span class="s-n">3</span><span class="s-b"><b>References</b>
          ${v.sent ? 'Kofi Mensah has replied. Ana Duarte was asked on 3 June.' : 'Two people who have seen you interview or coach.'}</span></li>
        <li><span class="s-n">4</span><span class="s-b"><b>Approval</b>
          ${v.sent ? 'Marisa Vance decides once both checks are back.' : 'Five working days from the last piece arriving.'}</span></li>
      </ol>
    </section>
    <section class="sec">
      <div class="btn-row">
        <button class="btn btn-p" data-go="application">${v.sent ? 'Open your application' : 'Finish your application'} ${I.arrowRight}</button>
      </div>
    </section>`;

  /* --- stage 2 and 3: approved, not yet bookable ------------------------ */
  if(!v.certified) return band() + `
    <section class="sec">
      <div class="sec-h"><h2>Before you list</h2></div>
      <div class="tile-stack">
        ${checkRow('done', 'Agent role added', 'On the account you already had, 12 June')}
        ${checkRow(v.listing ? 'done' : 'now', 'Your listing', v.listing ? 'Written, with four specialisms' : 'Photo, bio, specialisms and the range you assess', 'listing')}
        ${checkRow(v.paid ? 'done' : 'now', 'Your fee and payouts', v.paid ? `${money(v.fee)} an interview &middot; Stripe connected` : `${money(v.fee)} set. A payout destination is still needed`, 'earnings')}
        ${checkRow(v.mods === 4 ? 'done' : v.listing ? 'now' : '', 'Training and calibration',
          v.mods === 4 ? 'Four modules and the calibration interview' : `${v.mods || 0} of four modules done &middot; calibration Thursday 20 June`, 'training')}
      </div>
    </section>
    <section class="sec">
      <div class="note"><span>${I.info}</span><div class="nb"><b>Nothing is bookable yet</b>
        A listing goes into browse the day you are certified, and not before. Candidates cannot see a half-built one.</div></div>
    </section>`;

  /* --- stage 4, day one: listed, empty ---------------------------------- */
  if(!v.busy) return band() + `
    <section class="sec">
      <div class="sec-h"><h2>Your listing</h2></div>
      ${stats([['Live', 'In browse'], [money(v.fee), 'Your rate'], ['6', 'Slots open'], ['0', 'Booked']])}
    </section>
    <section class="sec">
      <div class="sec-h"><h2>Nothing booked</h2></div>
      <div class="empty">${I.calendar}<span class="t">No interviews yet</span>
        <span class="help">A candidate browsing your track sees your next free slot first. Friday at 5:00 PM is the one they will be offered.</span></div>
    </section>
    <section class="sec">
      <div class="btn-row">
        <button class="btn btn-p" data-go="availability">Open more slots ${I.arrowRight}</button>
        <button class="btn btn-g noic" data-go="listing">See how you appear</button>
      </div>
    </section>`;

  /* --- stage 4: a working week ------------------------------------------ */
  /* THE NEXT INTERVIEW IS THE PLATE, AND THE PLATE IS IN THE BAND. It is the
     same object the candidate's dashboard puts there — an appointment with a
     person, a time, and the one action worth a hero. Inside a `.modhead` it
     sits inset rather than bleeding to the column edge (§33 zeroes the
     negative margin), which is what makes the greeting, the sentence, the
     stepper and the appointment read as one opening block. */
  const due = iv('sofia'), next = iv('rafael');
  return band(plate({
      when: 'tomorrow', av: next.i, photo: AV.lena, who: next.n,
      whoSub: `${next.kind} &middot; ${next.band}`,
      title: 'Interview with ' + next.n,
      meta: `${next.day} at ${next.time} &middot; 45 minutes &middot; ${money(v.fee)} paid`,
      actions: `<button class="btn btn-p btn-sm noic">Join the call ${I.video}</button>
        <button class="btn btn-sm noic plate-b2" data-go="interview" data-iv="${next.id}">Read the brief</button>`
    })) + `
    <section class="sec">
      <div class="sec-h"><h2>This month</h2></div>
      ${stats([
        [String(v.month), 'Interviews'],
        [String(v.follow), 'Follow-up'],
        [money(v.earned), 'Earned'],
        [money(v.escrow), 'In escrow']])}
    </section>

    <section class="sec">
      <div class="sec-h"><h2>On you</h2></div>
      <div class="tile-stack">
        ${goRow('edit', 'Due 6:00 PM today', `${due.n}’s report`, 'Tal has a draft off the transcript', 'interview', ` data-iv="${due.id}"`)}
      </div>
      <div class="tal-sugg">${askChip('How is the report written?', 'Ask Tal how the write-up works')}</div>
    </section>

    <section class="sec">
      <div class="sec-h"><h2>After that</h2></div>
      <div class="tile-stack">
        ${IVS.filter(x => x.st === 'next' && x.id !== next.id).map(x =>
          memRow(x, `<span class="tag sm">${x.kind}</span>`, 'interview')).join('')}
        ${factRow('time', 'Friday 21 August, 5:00 PM ET', 'Open &mdash; nobody has taken it',
          '<span class="tag sm">Open</span>')}
      </div>
    </section>

    <section class="sec">
      <div class="note"><span>${I.info}</span><div class="nb"><b>There is nothing to accept</b>
        A booking arrives paid for. Your availability is the control &mdash; a slot you leave open can be taken without asking you first.</div></div>
      <div class="btn-row mt5">
        <button class="btn btn-p" data-go="interviews">All interviews ${I.arrowRight}</button>
        <button class="btn btn-g noic" data-go="availability">Availability</button>
      </div>
    </section>`;
};

/* --------------------------------------------------------------------------
   APPLICATION — steps 1 and 2, and the gate. The safeguarding note is product
   copy, not the diagram's risk annotation: it says what the check is for, in
   the voice the reader needs, because "everyone you interview is 18 to 24" is
   the reason and it is not obvious.
   -------------------------------------------------------------------------- */
V.application = v => head({
    title: 'Your application',
    sub: v.sent ? 'Submitted 3 June &middot; one of three checks back &middot; decision within five working days'
                : 'Draft &middot; three of five parts &middot; nothing is reviewed until all five are in'
  }) + `

  <section class="sec">
    <div class="sec-h"><h2>What you sent</h2></div>
    ${kv([
      ['Route', 'Invited by Derek Hale, 28 May'],
      ['Experience', 'Eleven years, six of them managing managers'],
      ['You would assess', 'Explorer and Builder'],
      ['Why you want to', '240 words, written 1 June'],
      ['Referees', v.sent ? 'Kofi Mensah, Ana Duarte' : 'Not given yet']])}
  </section>

  <section class="sec">
    <div class="sec-h"><h2>The checks</h2></div>
    <div class="tile-stack">
      ${factRow('shield', 'Identity', v.sent ? 'Cleared 3 June' : 'Runs when you send the form',
        v.sent ? '<span class="tag sm green">Cleared</span>' : '<span class="tag sm">Waiting</span>')}
      ${factRow('locked', 'Background check', v.sent ? 'With the provider since 4 June' : 'Required before a first interview',
        v.sent ? '<span class="tag sm warn">Running</span>' : '<span class="tag sm">Waiting</span>')}
      ${factRow('email', 'References', v.sent ? 'Kofi Mensah replied 5 June. Ana Duarte asked 3 June' : 'Two people who have seen you interview',
        v.sent ? '<span class="tag sm warn">1 of 2</span>' : '<span class="tag sm">Waiting</span>')}
    </div>
  </section>

  <section class="sec">
    <div class="note"><span>${I.shield}</span><div class="nb"><b>Why the background check</b>
      Everyone you will interview is between 18 and 24, and the conversation is one-to-one and recorded. The check runs before your first interview, not before approval.</div></div>
  </section>

  ${v.sent ? '' : `
  <section class="sec">
    <div class="sec-h"><h2>Still to add</h2></div>
    <div>
      <label class="f"><span class="lbl">First referee</span>
        <input class="inp" placeholder="Name and email"></label>
      <label class="f"><span class="lbl">Second referee</span>
        <input class="inp" placeholder="Name and email"></label>
      <label class="cbx"><input type="checkbox"><span class="box">${I.check}</span>
        <span class="txt">I agree to a background check before my first interview</span></label>
    </div>
    <div class="btn-row mt5"><button class="btn btn-p">Send the application ${I.arrowRight}</button></div>
  </section>`}`;

/* --------------------------------------------------------------------------
   LISTING — steps 4 and 5. How the agent appears in browse, and their fee.

V.listing = v => head({

  <section class="sec">
    <div class="sec-h"><h2>How you appear</h2></div>
    <div class="tile-stack">
      <div class="cardrow">
        <span class="cardrow-ic">${avatar(A.i, AV.owen, 40)}</span>

          <span class="cardrow-d">Talent agent &middot; assesses ${v.range}</span></span>
        <span class="cardrow-a"><button class="btn btn-g btn-sm noic" data-sheet="listing">Edit</button></span>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>On your card</h2></div>
    ${stats([
      [money(v.fee), 'Your fee'], [v.rangeShort, 'Assesses'],
      [String(v.ivs || 0), 'Interviews'], [v.rating || '&mdash;', 'Rating']])}
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Specialisms</h2></div>

      <span class="tag">Delegation</span><span class="tag">Hard conversations</span>
      <span class="tag">First-time managers</span><span class="tag">Delivery under pressure</span>
      <span class="tag bordered">${I.add}Add</span>

  </section>

  <section class="sec">
    <div class="sec-h"><h2>Your fee</h2></div>
    ${kv([
      ['You charge', money(v.fee)],

    <div class="btn-row mt5"><button class="btn btn-g btn-sm noic" data-sheet="fee">Change your fee</button></div>
    <div class="note mt5"><span>${I.info}</span><div class="nb"><b>A new fee applies to new bookings</b>
      Anything already in escrow settles at the rate it was booked at.</div></div>
  </section>

  ${v.listed ? `
  <section class="sec">
    <div class="sec-h"><h2>Visibility</h2></div>
    <label class="tg"><div class="tb"><b>Listed in the marketplace</b>
      <span>Candidates on your track can find and book you</span></div>
      <input type="checkbox" checked><span class="sw"></span></label>
    <p class="help mt4">Pausing takes you out of browse. Interviews already booked still stand, and nothing is re-approved when you come back.</p>
  </section>` : ''}`;

/* --------------------------------------------------------------------------
   TRAINING — step 7 and the certification gate. Derek's rubric is three
   things, so it is a `.kv` rather than a `.facts` band: three cells in an
   auto-fit grid leaves one paying grey.
   -------------------------------------------------------------------------- */
V.training = v => {
  const done = v.mods === 4;
  /* A `&middot;` ROW IS FIGURES, so the count is set rather than spelt — the
     house rule is that a small number is spelt only when it opens a sentence.
     Tal's summary below says "Three modules done" for the same reason. */
  /* THE BACK BUTTON APPEARS ONLY WHERE THE PAGE IS A SUB-PAGE. In the enabling
     stages Training is a rail item and a back arrow would point at nothing;
     once certified it is reached from Standing, and it needs one. */
  /* THE HERO CHANGES WITH THE STATE AND STAYS IN THE BAND. Before certification
     the head carries the appointment that is in the way; after it, the thing
     that came out of it. Both are dark cards, and only one is ever drawn. */
  return head({
    title: 'Training and calibration',
    sub: done ? '4 of 4 modules &middot; calibrated 20 June &middot; re-checked each June'
              : `${v.mods || 0} of 4 modules &middot; calibration Thursday 20 June`,
    back: v.nav === 'full' ? 'standing' : '',
    plate: done
      ? `<div class="cert">
          <h3>Certified to interview</h3>
          <p class="sub">Issued 20 June 2024 &middot; signed by Derek Hale &middot; Explorer and Builder</p>
        </div>`
      : plate({
          when: 'in 2 days', av: 'DH', photo: AV.samuel, who: 'Derek Hale',
          whoSub: 'Head of agent standards',
          title: 'Calibration interview',
          meta: 'Thursday 20 June at 4:00 PM ET &middot; 45 minutes &middot; recorded',
          actions: `<button class="btn btn-p btn-sm noic">Confirm the slot ${I.video}</button>
            <button class="btn btn-sm noic plate-b2">Ask to move it</button>`
        })
  }) + `

  <section class="sec">
    <div class="sec-h"><h2>The method</h2></div>
    <!-- THE WEEK CARD AND ITS RING. Four modules run in sequence and each one
         is either finished or not, which is exactly the shape the candidate's
         chapter card draws — so it is drawn with the same component rather
         than with a second progress idea invented here. -->
    <div class="wkc">
      <div class="wkc-top">
        <div class="wkc-tb">
          <div class="wkc-eb t-label-01">Module ${Math.min((v.mods || 0) + 1, 4)} &middot; ${done ? 'all finished' : 'in progress'}</div>
          <h3 class="u-h3">${done ? 'The interview method' : MODULES[Math.min(v.mods || 0, 3)][0]}</h3>
          <div class="wkc-min sub">${v.mods || 0} of 4 modules</div>
        </div>
        ${ring(Math.round((v.mods || 0) / 4 * 100))}
      </div>
      <span class="eyebrow">${done ? 'What you were taken through' : 'What you have finished'}</span>
      <ul class="wkc-did">
        ${MODULES.filter((m, n) => n < (v.mods || 0)).map(m =>
          `<li class="u-compact"><span class="wkc-tick">${I.checkFilled}</span>
            <span class="wkc-db"><b>${m[0]}</b><span class="sub">${m[1]}</span></span></li>`).join('')
          || '<li class="u-compact"><span class="wkc-db"><span class="sub">Nothing finished yet.</span></span></li>'}
      </ul>
    </div>
  </section>

  ${done ? '' : `
  <section class="sec">
    <div class="sec-h"><h2>Still to do</h2></div>
    <div class="tile-stack">
      ${MODULES.map((m, n) => n < (v.mods || 0) ? '' : factRow('book', m[0], m[1],
        n === (v.mods || 0) ? '<span class="tag sm warn">Next</span>' : '<span class="tag sm">Locked</span>')).join('')}
    </div>
  </section>`}

  <section class="sec">
    <div class="sec-h"><h2>Calibration</h2></div>
    ${kv([
      ['With', 'Derek Hale'],
      ['When', done ? 'Thursday 20 June' : 'Thursday 20 June, 4:00 PM ET'],
      ['Length', '45 minutes'],
      ['Result', done ? 'Certified' : 'Not sat yet']])}
    <p class="help mt4">A recorded mock interview with a real candidate who has agreed to it. Derek watches your half of the conversation.</p>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>The rubric</h2></div>
    ${kv([
      ['Tenacity', 'Do you stay with a thread that is going somewhere'],
      ['Energy', 'Does the candidate do more talking by the end than the start'],
      ['Noticing', 'Do you hear what was left out']])}
  </section>

  <section class="sec">
    ${done
      ? `<p class="help">The method is re-checked each June, and that is two modules rather than four.</p>`
      : `<div class="note warn"><span>${I.warning}</span><div class="nb"><b>Your listing waits on this</b>
          Nothing goes into browse until the calibration is passed.</div></div>
         <div class="btn-row mt5"><button class="btn btn-p">Open module ${(v.mods || 0) + 1} ${I.arrowRight}</button></div>`}
    <div class="tal-sugg">${askChip('What is calibration?')}</div>
  </section>`;
};

/* --------------------------------------------------------------------------
   INTERVIEWS — steps 9, 10 and 11. Two tabs, because "what is coming" and
   "what is finished" are two questions and a page that answers both at once
   makes the reader do the filtering.
   -------------------------------------------------------------------------- */
V.interviews = v => {
  if(!v.busy) return head({title: 'Interviews',
    sub: 'Nothing booked &middot; six slots open &middot; 45 minutes each'}) + `
    <section class="sec">
      <div class="empty">${I.calendar}<span class="t">Nothing booked yet</span>
        <span class="help">A booking arrives already paid for, with the candidate’s brief attached. There is nothing to accept.</span></div>
      <div class="btn-row"><button class="btn btn-p" data-go="availability">Open more slots ${I.arrowRight}</button></div>
    </section>`;

  const next = IVS.filter(x => x.st === 'next'), done = IVS.filter(x => x.st === 'done');
  const owed = IVS.filter(x => x.st === 'report');

  return head({title: 'Interviews',
    sub: `${v.month} this month &middot; ${v.ivs} in total &middot; next Thursday 20 August`}) + `
  <div class="tabs">
    <button class="${S.tab === 'next' ? 'on' : ''}" data-tab="next">Coming up</button>
    <button class="${S.tab === 'done' ? 'on' : ''}" data-tab="done">Finished</button>
  </div>

  ${S.tab === 'next' ? `
  <section class="sec">
    <div class="sec-h"><h2>Waiting on you</h2></div>
    <div class="tile-stack">
      ${owed.map(x => goRow('edit', `Due ${x.due}`, `${x.n}’s report`,
        `Interviewed ${x.day.replace(/^\w+ /, '')} &middot; ${x.level}`, 'interview', ` data-iv="${x.id}"`)).join('')}
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Booked</h2></div>
    <div class="tile-stack">
      ${next.map(x => goRow('video', x.day, x.n,
        `${x.time} &middot; ${x.kind} &middot; ${money(v.fee)} paid`, 'interview', ` data-iv="${x.id}"`)).join('')}
    </div>
  </section>

  <section class="sec">
    <div class="note"><span>${I.info}</span><div class="nb"><b>Booked means paid</b>
      The fee is taken when the slot is chosen and held in escrow, so an interview reaches you already settled. If a candidate does not appear, wait fifteen minutes and mark it.</div></div>
  </section>`
  : `
  <section class="sec">
    <div class="sec-h"><h2>Last five</h2></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <tr><th>Candidate</th><th>Interviewed</th><th>Level set</th><th class="num">Follow-up</th><th class="num">Depth</th></tr>
        ${done.concat(owed).map(x => `<tr>
          <td>${x.n}</td><td>${x.day.replace(/^\w+ /, '')}</td>
          <td>${x.level || '&mdash;'}</td>
          <td class="num">${x.follow || '&mdash;'}</td>
          <td class="num">${x.depth || '&mdash;'}</td></tr>`).join('')}
      </table>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Open one</h2></div>
    <div class="tile-stack">
      ${done.map(x => goRow('document', x.level, x.n,
        `${x.day.replace(/^\w+ /, '')} &middot; signed ${x.signed}`, 'interview', ` data-iv="${x.id}"`)).join('')}
    </div>
  </section>`}`;
};

/* --------------------------------------------------------------------------
   ONE INTERVIEW — the brief before, the report after. Three pages in one,
   keyed off the record's own state, because they are the same interview at
   three moments and splitting them would put the brief out of reach the
   moment the call ended.
   -------------------------------------------------------------------------- */
V.interview = v => {
  const x = iv(S.iv);
  /* NO GREY LINE WHERE THE PLATE CARRIES THE SPINE. An upcoming interview
     states its kind, day and time on the hero directly under the head, so a
     fact row saying the same three things is the page telling you twice
     before Tal has said anything. The two finished states have no plate, so
     they keep it. */
  const PHOTO = {rafael: AV.lena, amara: AV.hana, sofia: AV.priya, tom: AV.samuel, nina: AV.hana};
  const band = extra => head({
    title: x.n,
    sub: x.st === 'next' ? '' : `${x.kind} &middot; ${x.day} &middot; ${x.time}`,
    back: 'interviews',
    plate: extra
  });

  if(x.st === 'next') return band(plate({
      when: x.id === 'rafael' ? 'tomorrow' : 'in 5 days',
      av: x.i, photo: PHOTO[x.id], who: x.n, whoSub: x.band,
      title: x.kind, meta: `${x.day} at ${x.time} &middot; 45 minutes &middot; video, recorded`,
      actions: `<button class="btn btn-p btn-sm noic">Join the call ${I.video}</button>
        <button class="btn btn-sm noic plate-b2">Add to calendar</button>`
    })) + `
    <section class="sec">
      <div class="sec-h"><h2>Their brief</h2></div>
      ${kv([
        ['Where they are', x.band],
        ['Asked to be assessed on', x.asked],
        ['Booked', x.paid],
        ['Fee', `${money(v.fee)}, ${money(v.share)} of it yours`],
        ...(x.summary ? [['Attached', 'Their 90-day summary']] : [])])}
    </section>

    <section class="sec">
      <div class="sec-h"><h2>Before it</h2></div>
      <ol class="steps">
        <li><span class="s-n">1</span><span class="s-b"><b>Read the brief</b>
          Two minutes. It is what they asked for, in their words.</span></li>
        <li><span class="s-n">2</span><span class="s-b"><b>Open the room early</b>
          The recording starts when you both join, and they are told that.</span></li>
        <li><span class="s-n">3</span><span class="s-b"><b>Send the report within a day</b>
          Tal drafts it off the transcript. The level is set by you and signed by you.</span></li>
      </ol>
    </section>

    <section class="sec">
      <div class="btn-row">
        <button class="btn btn-g noic" data-sheet="brief">Add a note to the brief</button>
      </div>
      <div class="tal-sugg">${askChip('What do I read beforehand?')}</div>
    </section>`;

  if(x.st === 'report') return band() + `
    <section class="sec">
      <div class="note warn"><span>${I.warning}</span><div class="nb"><b>Due at ${x.due}</b>
        Twenty-four hours from the end of the call is the promise the candidate paid against.</div></div>
    </section>

    <section class="sec">
      <div class="sec-h"><h2>The call</h2></div>
      ${kv([
        ['Held', `${x.day} &middot; ${x.time}`],
        ['Ran', '48 minutes'],
        ['Transcript', 'Ready'],
        ['Your share', `${money(v.share)}, held until the report goes out`]])}
    </section>

    <section class="sec">
      <div class="sec-h"><h2>Tal’s draft</h2></div>
      <!-- THE SAME BAND AS THE PAGE SUMMARY, because it is the same speaker.
           Tal has one voice and one surface in this product; a second styling
           for "Tal, but further down the page" would be a second Tal. -->
      <div class="ai-aura">
        <div class="ai-head"><span class="ai-label bare">Tal</span></div>
        <div class="ai-body"><p>She talks about her team of four in specifics and
          about herself in generalities, which is where the evidence thins. Two
          clear examples of delegation, none of a hard conversation she started.</p></div>
      </div>
      <label class="f mt5"><span class="lbl">Your write-up</span>
        <textarea class="inp" rows="4">Sofia runs a team of four and described handing over the vendor review in enough detail to show she plans a handover rather than announces one. Less evidence on conversations she has had to open herself.</textarea></label>
      ${kv([['Level you are setting', x.level], ['Growth areas', 'Hard conversations, and asking for what she needs']])}
    </section>

    <section class="sec">
      <div class="note"><span>${I.info}</span><div class="nb"><b>Signing is what sets the level</b>
        After it is signed, a change to a level is a review decision rather than yours.</div></div>
      <div class="btn-row mt5">
        <button class="btn btn-p noic" data-confirm="sign">Sign and send the report</button>
        <button class="btn btn-g noic">Save the draft</button>
      </div>
    </section>`;

  return band() + `
    <section class="sec">
      <div class="sec-h"><h2>What you set</h2></div>
      ${kv([
        ['Level', x.level],
        ['Signed', x.signed],
        ['Follow-up scored', x.follow],
        ['Depth scored', x.depth]])}
    </section>

    <section class="sec">
      <div class="sec-h"><h2>Your report</h2></div>
      <p class="t-body-02">${x.n} came in at ${x.level} on the evidence of two projects rather than on how they described themselves. The growth areas are written against the same two examples, so the candidate can see where they came from.</p>
      <div class="btn-row mt5">
        <button class="btn btn-g btn-sm noic">Read the report</button>
        <button class="btn btn-g btn-sm noic">${I.download}Transcript</button>
      </div>
    </section>

    <section class="sec">
      <div class="sec-h"><h2>The fee</h2></div>
      ${kv([['Candidate paid', money(v.fee)], ['TalentNext kept', money(v.cut)],
            ['Your share', money(v.share)], ['Status', x.money]])}
    </section>`;
};

/* --------------------------------------------------------------------------
   AVAILABILITY — the agent's only control over their workload.

   `.slots` IS NOT ONE OF THE SIX CONTAINERS that opt a section out of the
   184px label column, and it bleeds to the page edge with a negative margin,
   so a `.sec-h` beside it would be laid against a column 184px narrower than
   the grid expects. These sections use an `.eyebrow` as their heading instead,
   which is the cheap fix and the one the design system's own README names.
   -------------------------------------------------------------------------- */
V.availability = () => head({
    title: 'Availability',
    sub: 'Six slots open &middot; 45 minutes each &middot; Eastern time'
  }) + `

  ${SLOTS.map(([week, slots]) => `
  <section class="sec">
    <span class="eyebrow">${week}</span>
    <div class="slots">
      ${slots.map(([d, t, taken]) =>
        `<button class="slot${taken ? ' sel' : ''}">${d}<br>${t}</button>`).join('')}
    </div>
    <p class="help mt4">${slots.filter(s => s[2]).length
      ? `${slots.filter(s => s[2]).length} taken, ${slots.filter(s => !s[2]).length} open.`
      : 'All open.'}</p>
  </section>`).join('')}

  <section class="sec">
    <div class="sec-h"><h2>How slots work</h2></div>
    ${kv([
      ['Length', '45 minutes, fixed'],
      ['Timezone', 'Eastern, and shown to candidates in theirs'],
      ['How far ahead', 'Eight weeks'],
      ['Taking one back', 'Any time before it is booked']])}
  </section>

  <section class="sec">
    <div class="note"><span>${I.info}</span><div class="nb"><b>This is the whole of your workload</b>
      A slot you leave open can be booked and paid for without asking you first. Closing one is how you say no.</div></div>
    <div class="btn-row mt5"><button class="btn btn-p" data-sheet="slot">Add a slot ${I.arrowRight}</button></div>
  </section>`;

/* --------------------------------------------------------------------------
   EARNINGS — steps 6 and 12.

   NO BANK FORM ANYWHERE, and that is deliberate: a payout destination is a
   handoff to Stripe on Stripe's own hosted page, which is the same call
   `hifi/`'s booking flow makes about taking the candidate's money. What comes
   back is a confirmation, and this page draws the confirmation.
   -------------------------------------------------------------------------- */
V.earnings = v => {
  const connected = v.paid;
  return head({title: 'Earnings',
    sub: connected ? `80/20 split &middot; ${money(v.share)} an interview &middot; ${money(v.escrow)} in escrow`
                   : '80/20 split &middot; no destination connected'}) + `

  ${connected && v.busy ? `
  <section class="sec">
    <div class="sec-h"><h2>This month</h2></div>
    ${stats([[money(v.earned), 'Earned'], [money(v.escrow), 'In escrow'],
             [String(v.month), 'Interviews'], [money(v.share), 'Each']])}
  </section>` : ''}

  <section class="sec">
    <div class="sec-h"><h2>How a fee splits</h2></div>
    ${kv([
      ['The candidate pays', money(v.fee)],
      ['TalentNext keeps', `${money(v.cut)} &middot; 20%`],
      ['You are paid', `${money(v.share)} &middot; 80%`],
      ['Released', 'Three working days after the report is delivered']])}
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Where it goes</h2></div>
    ${connected ? `
    <div class="tile-stack">
      ${factRow('wallet', v.payout, 'Connected 12 June', '<span class="tag sm green">Connected</span>')}
    </div>
    <p class="help mt4">TalentNext never holds your bank details. Stripe does, and Stripe is where you change them.</p>`
    : `
    <div class="empty">${I.wallet}<span class="t">No destination yet</span>
      <span class="help">Nothing can be booked until there is somewhere to pay you. TalentNext hands you to Stripe and never sees an account number.</span></div>
    <div class="btn-row"><button class="btn btn-p">Continue to Stripe ${I.launch}</button></div>`}
  </section>

  ${connected && v.busy ? `
  <section class="sec">
    <div class="sec-h"><h2>Payments</h2></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <tr><th>Interview</th><th>Date</th><th class="num">Fee</th><th class="num">Yours</th><th>Status</th></tr>
        <tr><td>Rafael Ortiz</td><td>19 Aug</td><td class="num">${money(v.fee)}</td><td class="num">${money(v.share)}</td><td>In escrow</td></tr>
        <tr><td>Sofia Marek</td><td>18 Aug</td><td class="num">${money(v.fee)}</td><td class="num">${money(v.share)}</td><td>Report due</td></tr>
        <tr><td>Tom Whelan</td><td>17 Aug</td><td class="num">${money(v.fee)}</td><td class="num">${money(v.share)}</td><td>Releases 20 Aug</td></tr>
        <tr><td>Nina Haddad</td><td>14 Aug</td><td class="num">${money(v.fee)}</td><td class="num">${money(v.share)}</td><td>Paid 19 Aug</td></tr>
        <tr><td>Marcus Bell</td><td>12 Aug</td><td class="num">${money(v.fee)}</td><td class="num">${money(v.share)}</td><td>Paid 17 Aug</td></tr>
      </table>
    </div>
  </section>` : ''}`;
};

/* --------------------------------------------------------------------------
   STANDING — steps 11 and 13. What the AI scores, and who reviews it.

   THE SCORE IS ABOUT THE AGENT, NEVER THE CANDIDATE, and the page says so once
   rather than hedging in three places. It reads the transcript for how the
   conversation went, which is a different question from what the candidate is
   worth — that answer is the report, and the report is written by a person.
   -------------------------------------------------------------------------- */
/* THREE SLOTS, THREE JOBS, AND THE HERO IS NOW ONE OF THEM. The grey line is
   the spine, the hero card states the level and what it entitles you to, and
   Tal reads what moved. The first draft of this page had all three saying "A2,
   ranked 12 of 38, reviewed by Nadia" — which is the duplication the two-slot
   rule exists to stop, arriving through a third surface. */
V.standing = v => head({
    title: 'Your standing',
    sub: `Agent level ${v.level} of A${v.levels} &middot; ranked ${v.rank} of ${v.pool} &middot; reviewed quarterly`,
    /* .lvl-hero IS THE LEVEL, on both sides of the product. The candidate's own
       level is drawn with this card; an agent's level is the same kind of fact
       about the same kind of person, so it is drawn the same way rather than as
       a fifth figure cell — and it belongs in the band for the same reason the
       plate does: it is what the page is about. */
    plate: `<div class="lvl-hero">
      <span class="eyebrow">Your agent level</span>
      <div class="big">Agent &ndash; ${v.level}</div>
      <p class="sub">You may assess ${v.range}.</p>
    </div>`
  }) + `

  <section class="sec">
    <div class="sec-h"><h2>Where you are</h2></div>
    ${stats([[v.level, `Of A${v.levels}`], [`${v.rank}<small>/${v.pool}</small>`, 'In browse'],
             [String(v.follow), 'Follow-up'], [String(v.depth), 'Depth']])}
  </section>

  <section class="sec">
    <div class="sec-h"><h2>What is scored</h2></div>
    ${kv([
      ['Follow-up', 'Whether you stayed with a thread that was going somewhere'],
      ['Depth', 'How far past the rehearsed answer the conversation got'],
      ['Read from', 'The transcript, within an hour of the call'],
      ['Not scored', 'The candidate. That is your report, and you write it']])}
  </section>

  <section class="sec">

    <div class="tbl-wrap">
      <table class="tbl">
        <tr><th>Candidate</th><th>Date</th><th class="num">Follow-up</th><th class="num">Depth</th><th class="num">Their rating</th></tr>
        <tr><td>Tom Whelan</td><td>17 Aug</td><td class="num">4.6</td><td class="num">4.8</td><td class="num">5.0</td></tr>
        <tr><td>Nina Haddad</td><td>14 Aug</td><td class="num">4.3</td><td class="num">4.7</td><td class="num">4.5</td></tr>
        <tr><td>Marcus Bell</td><td>12 Aug</td><td class="num">4.5</td><td class="num">4.6</td><td class="num">4.5</td></tr>
        <tr><td>Iris Novak</td><td>8 Aug</td><td class="num">4.2</td><td class="num">4.7</td><td class="num">4.0</td></tr>
        <tr><td>Jonah Petit</td><td>5 Aug</td><td class="num">4.4</td><td class="num">4.8</td><td class="num">5.0</td></tr>
      </table>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Your review</h2></div>
    ${kv([
      ['Reviewed by', `${v.manager} &middot; manager of agents`],
      ['How often', 'Every quarter'],
      ['Last one', v.reviewed ? '1 October &middot; moved to A3' : '1 July &middot; held at A2'],
      ['Next', v.reviewed ? '1 January' : '1 October'],
      ['What it can move', 'Your level, and the range you may assess']])}

  <section class="sec">

    </div>
