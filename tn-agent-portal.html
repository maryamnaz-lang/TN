<script>
/* ==========================================================================
   THE TALENT AGENT PORTAL

   A THIRD SIGNED-IN USER, IN A FILE OF ITS OWN. The candidate and the cohort
   leader share `hifi/` because a demo has to walk from one side of a cohort to
   the other without a reload — they are two views of the same fortnight. An
   agent is not: they meet a candidate for forty-five minutes, once, and never
   see the 90 days. Nothing is gained by putting a switch between them, so this
   is a separate file linking the same design system, which is what
   design-system/ exists for.

   THE JOURNEY IS THE FLOW DIAGRAM. Its four stages and thirteen steps are the
   stage picker on the black bar:

     Stage 1  Recruitment and vetting   → `apply`, `vetting`   (steps 1, 2 + gate)
     Stage 2  Account, listing, money   → `setup`              (steps 3, 4, 5, 6)
     Stage 3  Enablement and go-live    → `training`           (step 7 + gate)
     Stage 4  Operating as an agent     → `live`, `working`,
                                          `reviewed`           (steps 8–13)

   The diagram's left column — the open questions — does NOT cross into a
   hi-fi screen, the same rule `hifi/` keeps against the wireframe's
   client-facing annotations. An undecided thing is decided here and the
   decision is written down in the handoff, not drawn on the page as a
   question. The four that were genuinely undecided, and what this file does:

     - AN AGENT ROLE IS ADDED TO AN ACCOUNT, it is not a second account. The
       diagram's own rule says roles stack, so Profile says so and the
       candidate record is left alone.
     - THE 20/80 SPLIT IS THE MODEL, and the $100 monthly listing fee is not
       in force. Two revenue models were never reconciled; the split is the
       later of the two and the one that was confirmed. An agent who is also
       charged a subscription would need a card on file, and a portal that
       takes money FROM an agent is a different product.
     - MONEY NEVER TOUCHES THIS PORTAL. Payouts are a handoff to Stripe, the
       same shape as the candidate's booking: TalentNext holds no bank
       details and this file draws no bank form. `hifi/`'s `ai7.js` makes the
       same call for the same reason.
     - THE INTERVIEW SETS THE LEVEL AND THE AGENT SIGNS IT; a change after the
       signature is a review decision above them. That is what reconciles the
       diagram's "the agent cannot change candidate levels" with the candidate
       portal, where every level is signed by the agent who set it.

   AND THE BOUNDARY IS KEPT BY OMISSION. "Agents do not lead cohorts" is not a
   line of copy anywhere below — cohorts, chapters, weeks and the 90 days do
   not appear in this portal at all, which is a stronger way to say it than a
   note explaining what the reader cannot do.
   ========================================================================== */

/* --------------------------------------------------------------------------
   WHO IS SIGNED IN

   OWEN CLARKE, on purpose, and not a new name. He is already one of the three
   agents the candidate portal offers Maryam — $85, assesses E2 to B1, 164
   interviews, rated 4.6 — so the demo can book him on one side and see the
   booking arrive on the other. Priya Nair was the obvious pick and is the
   wrong one: she is already the cohort leader AND the agent who signed
   Maryam's report, and a third role on the same person makes the roles-stack
   rule impossible to read.

   The figures below are the marketplace's, unchanged. `f()` merges the stage
   over them, because an agent on their first day has none of them yet.
   -------------------------------------------------------------------------- */
const A = {
  n:'Owen Clarke', i:'OC', email:'owen.clarke@fieldstone.co',
  since:'June 2024',
  range:'Explorer E2 – Builder B1', rangeShort:'E2 – B1',
  fee:85, share:68, cut:17,          /* $85, split 80/20 → $68 and $17 */
  rating:4.6, ivs:164, month:9,
  level:'A2', levels:4, rank:12, pool:38,
  follow:4.4, depth:4.7,
  manager:'Nadia Rahman',
  escrow:204, earned:612,
  payout:'Stripe · account ending 4417'
};

/* --------------------------------------------------------------------------
   THE STAGES

   `[key, label, caption]`, the shape `hifi/`'s own STAGES uses, and the
   caption prints under the frame. Seven snapshots, in the order the diagram
   runs. Each is internally consistent and they are not one continuous week:
   the onboarding four are June 2024, when Owen joined, and the operating three
   are now. A stage that had to hold both would have to claim 164 interviews on
   an agent who has not been certified yet.
   -------------------------------------------------------------------------- */
const STAGES = [
  ['apply',    'Applying',              'Stage 1. The application is open and unsent. Two of the five parts are missing, and nothing is reviewed until all five are in.'],
  ['vetting',  'In vetting',            'Stage 1. Submitted 3 June. Identity has cleared, the background check is running and one of the two references is back. The approval gate is ahead.'],
  ['setup',    'Approved, setting up',  'Stage 2. Approved 12 June, and the agent role is on the account Owen already had. Listing, fee and payout destination are what is left.'],
  ['training', 'Training',              'Stage 3. Listing and money are done. Three of four modules are finished and the calibration interview is the last thing before the certification gate.'],
  ['live',     'Listed, nothing booked','Stage 4, day one. Certified 20 June and visible in the marketplace since Monday. Six slots are open and no one has taken one yet.'],
  ['working',  'A working week',        'Stage 4. Two interviews ahead, one report due tonight, and $204 in escrow. This is the portal as an agent actually uses it.'],
  ['reviewed', 'After a review',        'Stage 4, step 13. The quarterly review moved Owen to A3 and widened the range he may assess to E1 – B2.']
];

/* Stage config. Anything absent falls back to `A`. */
const CFG = {
  apply:    {nav:'early', sent:false, ivs:0, month:0, rating:null, escrow:0, earned:0},
  vetting:  {nav:'early', sent:true,  ivs:0, month:0, rating:null, escrow:0, earned:0},
  setup:    {nav:'setup', approved:true, ivs:0, month:0, rating:null, escrow:0, earned:0},
  training: {nav:'setup', approved:true, listed:false, listing:true, paid:true, mods:3,
             ivs:0, month:0, rating:null, escrow:0, earned:0},
  live:     {nav:'full',  approved:true, listing:true, paid:true, mods:4, certified:true, listed:true,
             ivs:0, month:0, rating:null, escrow:0, earned:0},
  working:  {nav:'full',  approved:true, listing:true, paid:true, mods:4, certified:true, listed:true,
             busy:true},
  reviewed: {nav:'full',  approved:true, listing:true, paid:true, mods:4, certified:true, listed:true,
             busy:true, reviewed:true,
             level:'A3', range:'Explorer E1 – Builder B2', rangeShort:'E1 – B2',
             rank:9, follow:4.6, ivs:171, month:7}
};

const S = {stage:'working', view:'dashboard', nav:false, tal:false, talQ:null,
           iv:'rafael', tab:'next', confirm:false, sheet:false,
           perms:{draft:true, brief:true, live:false}};

const f = () => ({...A, ...CFG[S.stage]});

/* --------------------------------------------------------------------------
   THE RAIL

   THREE SETS, BECAUSE THE NAV IS THE RECORD OF WHAT IS UNLOCKED — the same
   reason the candidate's grows from four items to nine. An agent who has not
   been approved has one page and a form; an agent who cannot be booked has no

   -------------------------------------------------------------------------- */
const NAVSETS = {

};

/* --------------------------------------------------------------------------
   THE INTERVIEWS

   Five, and the working week is built out of them. The fee is the same $85 on

   into escrow at booking, so an interview that has not happened is already
   paid for. Three of these are what makes escrow $204 — Rafael (booked),
   Sofia (held, report not delivered) and Tom (delivered, releasing Thursday).
   -------------------------------------------------------------------------- */
const IVS = [

   band:'Explorer, predicted by the quiz', asked:'Delegation, and being new to managing former peers',

   paid:'Paid at booking, 18 August', summary:true},

  {id:'sofia', n:'Sofia Marek', i:'SM', st:'report',
   day:'Tuesday 18 August', time:'5:00 PM ET', kind:'First interview',
   band:'Explorer, predicted by the quiz', level:'Explorer – E2',
   due:'6:00 PM today', asked:'Running her first team of four'},

   day:'Monday 17 August', time:'6:30 PM ET', kind:'Re-interview',

];
const iv = id => IVS.find(x => x.id === id) || IVS[0];

/* Availability. `on` is a taken slot — `.slot.sel` draws it filled, which is
   the design system's own "this one is chosen" and reads correctly for "this
   one is spoken for" too. */
const SLOTS = [
  ['This week', [
    ['Wed 19', '7:00 PM', 0], ['Thu 20', '3:00 PM', 1], ['Fri 21', '5:00 PM', 0]]],
  ['Week of 24 August', [
    ['Mon 24', '6:00 PM', 1], ['Tue 25', '5:00 PM', 0], ['Wed 26', '7:00 PM', 0],
    ['Thu 27', '3:00 PM', 0], ['Fri 28', '5:00 PM', 0]]]

/* ==========================================================================
   TAL

   THE CONCEPT CARRIED ACROSS IS THE PAGE SUMMARY, not the thread. In `hifi/`
   every page opens with Tal saying, in two sentences, what has moved — and
   that pass (`ai6.js`) exists because a page whose top is a caption of itself
   is a page nobody reads. The rules travel with it exactly:

     - TWO SENTENCES, 18 TO 28 WORDS. Say the thing and stop.
     - THE FACTS, IN THE ORDER A PERSON WOULD ASK FOR THEM. Where you are,
       what is open, what is on you. The numbers ARE the content.
     - A CATCH-UP, NOT A DESCRIPTION. If the line would read the same next
       week, it is a caption. The reader is looking at the page already.
     - NO FRAMING, NO POLICY, NO POINTING AT THE UI, and nothing from another
       portal — an agent is not told what a candidate's Cohort page looks like.
     - CONTRACTIONS, PLAIN WORDS. Tal talking to one person.

   AND THE SPLIT WITH THE GREY LINE IS A RULE, not a preference. `ph(title,
   sub)`'s second argument carries the page's FACTUAL SPINE as a `·` row — no
   verb, no claim — and Tal carries the READING. Where a page has no spine it
   gets no `sub` and the title stands alone over Tal's sentence, which is why
   Profile passes a title only. Writing a sentence into both slots is what
   produced the duplication `ai6.js` was mostly written to remove.

   THE CARD IS A `.note acc`. `hifi/`'s aura and its head band are one product
   surface's own vocabulary and `build-ds.py` drops them by name, so the
   summary is drawn with the component the design system does carry: the
   accent note, which is the one tone reserved for "something that is yours".
   The mark is `talChat`, the same glyph the candidate portal uses for Tal.
   ========================================================================== */
const PAGESUM = {

    working: 'Sofia Marek’s report is due at 6:00 PM today, and Rafael Ortiz is Thursday at 3:00 PM. $204 is sitting in escrow.',
    reviewed:'Nadia moved you to A3 on 1 October, so you can assess E1 to B2 now. Two bookings arrived in the week since.'
  },

  application: {
    apply:   'Experience and motivation are written, your two referees aren’t. Nothing is looked at until all five parts are in — usually five working days after that.',
    _:       'Submitted 3 June with two referees. Identity cleared, the background check is with the provider, and Marisa Vance decides once both are back.'
  },

  listing: {
    setup:   'Your card is written and your fee is $85, which leaves you $68 after the split. Payouts are the one thing still stopping a booking.',
    training:'Your card and fee are set, and nothing is visible yet — a listing goes live the day you’re certified. Delegation is your first specialism.',
    live:    'You’ve been in browse since Monday at $85, assessing E2 to B1. No rating yet: the first three interviews are what make one.',
    _:       'You’re visible at $85 assessing E2 to B1, with 164 interviews and 4.6 behind you. Delegation is the specialism candidates search for most.'
  },

  training: {
    training:'Three modules done, one to go, and calibration is Thursday with Derek Hale. He watches for tenacity, energy, and whether you notice what isn’t said.',
    _:       'All four modules done and calibrated on 20 June by Derek Hale. The method is re-checked once a year, so nothing’s due until June.'
  },

    live:    'Nothing booked yet. Six slots are open over the next fortnight, and a booking arrives already paid for — there’s nothing to accept.',
    _:       'Two ahead — Rafael on Thursday, Amara on Monday — and Sofia’s report is due at 6:00 PM. 164 finished in total.'
  },

  /* A FUNCTION, BECAUSE THE PAGE IS FIVE DIFFERENT PAGES. Reads `S.iv` and the
     record itself, so the figures cannot drift from the interview being read. */
  interview: () => {
    const v = iv(S.iv);
    if(v.st === 'next')   return `${v.n} is ${v.day.split(' ')[0]} at ${v.time}, paid and confirmed. ${v.summary ? 'It’s a re-interview, so their 90-day summary is on the brief.' : 'They’re straight off the quiz, so no level exists yet.'}`;
    if(v.st === 'report') return `You interviewed ${v.n} yesterday and the write-up is due at ${v.due}. Tal has a draft off the transcript waiting for your edit.`;
    return `${v.n}, ${v.day.replace(/^\w+ /,'')}, confirmed at ${v.level} and signed the same evening. Follow-up scored ${v.follow} and depth ${v.depth}.`;
  },

    _:       '$612 earned this month across nine interviews, and $204 is still in escrow. Tom’s $68 releases Thursday, three days after his report went out.'
  },

/* ==========================================================================
   HELPERS — every one of these returns design-system markup and nothing else
   ========================================================================== */

/* THE PAGE HEAD, in `hifi/`'s own shape: one `.ph` per page, carrying the only
   h1, and `sub` is the FACT ROW — never a sentence. */
function ph(title, sub, backTo){
  return `<div class="ph">
    <div class="ph-main">
      <div class="ph-top">${backTo ? `<button class="ph-back" data-go="${backTo}" aria-label="Back">${I.arrowLeft}</button>` : ''}<h1>${title}</h1></div>
      ${sub ? `<p>${sub}</p>` : ''}
    </div>
  </div>`;
}

/* TAL'S CARD. Looked up rather than written at the call site, which is the
   whole point of the pass: the summaries are one voice and belong in one
   table, so a new page needs a row here and nothing else. A value is a string,
   a function, or an object keyed by stage with `_` as the fallback. */
function talCard(){
  let e = PAGESUM[S.view];
  if(typeof e === 'function') e = e();
  if(e && typeof e === 'object') e = e[S.stage] || e._;
  if(!e) return '';
  /* `.sec.tint` IS THE GROUND, and it is the one permitted ground change in
     this system — a background, never a card. It is doing the job `hifi/`'s
     head band does: putting Tal's sentence on its own surface directly under
     the page head, so the summary reads as a different kind of thing from the
     page rather than as the page's first paragraph. Inside `.app` a `.note`
     has no rule and no fill of its own (§22 strips both, because a wash on a
     borderless row is one more edge than a page of hairlines has), so without
     this the card would be a bold word and a sentence. */
  return `<section class="sec tint">
    <div class="note acc"><span>${I.talChat}</span>
      <div class="nb"><b>Tal</b>${e}</div></div>
  </section>`;
}

/* FOUR CELLS, ALWAYS. `.stats` is a fixed 2/4-column grid and its hairlines
   are the 1px gap, so a row it does not fill paints grey rather than closing
   up. Three is the count to avoid. */
const stats = cells => `<div class="stats">${cells.map(([v, k]) =>
  `<div class="stat"><span class="v">${v}</span><span class="k">${k}</span></div>`).join('')}</div>`;

/* A HAIRLINE LIST, AND IT IS WHY `.facts` IS NOT USED ANYWHERE BELOW.

   `.facts` is the prettier band for reference material and it is measurably
   wrong at one width. Its columns are `auto-fit` at `minmax(140px,1fr)`, so
   the count is `floor(width / 140)`: spare tracks collapse, but cells that
   WRAP do not — row two keeps the full column count and its empty slots paint
   the rule colour, because the hairlines ARE the 1px gap. A four-cell band
   therefore paints two grey slots wherever it is 420–560px wide, which on
   these pages is a container width of about 900. The design system's README
   names the case and prescribes the fix: for a band that has to hold at every
   width, use `.kv`. `.stats` is the other safe one — a FIXED 2/4-column grid,
   so exactly four cells fill both tiers and can never leave a spare track. */
const kv = rows => `<div>${rows.map(([k, v]) =>
  `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;

/* The navigation row — the design system's replacement for every card. */
const goRow = (icon, eyebrow, title, sub, go, attr) => `
  <button class="tile clk gcard" data-go="${go}"${attr || ''}>
    <span class="cardrow-ic">${I[icon]}</span>
    <span class="gcard-b">${eyebrow ? `<span class="eyebrow">${eyebrow}</span>` : ''}
      <h3>${title}</h3><span class="sub">${sub}</span></span>
    <svg class="tile-arrow" viewBox="0 0 24 24">${inner('arrowRight')}</svg>
  </button>`;

/* A detail row: two lines and a trailing tag instead of a chevron. */
const factRow = (icon, title, detail, tag) => `
  <div class="cardrow">
    <span class="cardrow-ic">${I[icon]}</span>
    <span class="cardrow-b"><span class="cardrow-t">${title}</span>
      <span class="cardrow-d">${detail}</span></span>
    ${tag ? `<span class="cardrow-a">${tag}</span>` : ''}
  </div>`;

/* A checklist row. `checkFilled` / `circleDash` / `circle` is the same three-
   state vocabulary `hifi/`'s stepper uses. */
const checkRow = (st, title, detail, go) => {
  const ic = st === 'done' ? 'checkFilled' : st === 'now' ? 'circleDash' : 'circle';
  const tag = st === 'done' ? '<span class="tag sm green">Done</span>'
            : st === 'now'  ? '<span class="tag sm warn">On you</span>'
            : '<span class="tag sm">Waiting</span>';
  return go && st !== 'done'
    ? `<button class="tile clk gcard" data-go="${go}">
         <span class="cardrow-ic">${I[ic]}</span>
         <span class="gcard-b"><h3>${title}</h3><span class="sub">${detail}</span></span>
         <svg class="tile-arrow" viewBox="0 0 24 24">${inner('arrowRight')}</svg></button>`
    : factRow(ic, title, detail, tag);
};

/* A person, with the design system's square avatar. */
const memRow = (v, tag, go) => `
  <div class="mem"${go ? ` data-go="${go}" data-iv="${v.id}"` : ''}>
    <span class="av mem-av">${v.i}</span>
    <span class="mem-b"><span class="mem-n">${v.n}</span>
      <span class="mem-m">${v.day}<span class="mdot"></span>${v.time}</span></span>
    ${tag}</div>`;

const money = n => '$' + n.toLocaleString('en-US');

/* ==========================================================================
   THE PAGES
   ========================================================================== */
const V = {};

/* --------------------------------------------------------------------------

   -------------------------------------------------------------------------- */
V.dashboard = v => {

        <li><span class="s-n">2</span><span class="s-b"><b>Identity and background</b>

  if(!v.certified) return head + talCard() + `
    <section class="sec">
      <div class="sec-h"><h2>Before you list</h2></div>
      <div class="tile-stack">
        ${checkRow('done', 'Agent role added', 'On the account you already had, 12 June')}

        ${checkRow(v.mods === 4 ? 'done' : v.listing ? 'now' : '', 'Training and calibration',

    </section>
    <section class="sec">
      <div class="note"><span>${I.info}</span><div class="nb"><b>Nothing is bookable yet</b>

    </section>`;

  /* --- stage 4, day one: listed, empty ---------------------------------- */
  if(!v.busy) return head + talCard() + `
    <section class="sec">
      <div class="sec-h"><h2>Your listing</h2></div>
      ${stats([['Live', 'In browse'], [money(v.fee), 'Your rate'], ['6', 'Slots open'], ['0', 'Booked']])}
    </section>
    <section class="sec">
      <div class="sec-h"><h2>Nothing booked</h2></div>
      <div class="empty">${I.calendar}<span class="t">No interviews yet</span>
        <span class="help">A candidate browsing your track sees your next free slot first. Friday at 5:00 PM is the one they will be offered.</span></div>
    </section>
    <section class="sec">
      <div class="btn-row">
        <button class="btn btn-p" data-go="availability">Open more slots ${I.arrowRight}</button>
        <button class="btn btn-g noic" data-go="listing">See how you appear</button>
      </div>

  /* --- stage 4: a working week ------------------------------------------ */
  const due = iv('sofia'), next = iv('rafael');
  return head + talCard() + `
    <section class="sec">
      <div class="sec-h"><h2>This month</h2></div>
      ${stats([
        [String(v.month), 'Interviews'],
        [String(v.follow), 'Follow-up'],
        [money(v.earned), 'Earned'],
        [money(v.escrow), 'In escrow']])}
    </section>

    <section class="sec">
      <div class="sec-h"><h2>On you</h2></div>
      <div class="tile-stack">
        ${goRow('edit', 'Due 6:00 PM today', `${due.n}’s report`, 'Tal has a draft off the transcript', 'interview', ` data-iv="${due.id}"`)}
        ${goRow('video', next.day, `Interview with ${next.n}`, `${next.time} &middot; 45 minutes &middot; paid`, 'interview', ` data-iv="${next.id}"`)}

    <section class="sec">
      <div class="sec-h"><h2>Coming up</h2></div>
      <div class="tile-stack">
        ${IVS.filter(x => x.st === 'next').map(x =>
          memRow(x, `<span class="tag sm">${x.kind}</span>`, 'interview')).join('')}

    <section class="sec">
      <div class="note"><span>${I.info}</span><div class="nb"><b>There is nothing to accept</b>
        A booking arrives paid for. Your availability is the control &mdash; a slot you leave open can be taken without asking you first.</div></div>
      <div class="btn-row mt5">
        <button class="btn btn-p" data-go="interviews">All interviews ${I.arrowRight}</button>
        <button class="btn btn-g noic" data-go="availability">Availability</button>

};

/* --------------------------------------------------------------------------
   APPLICATION — steps 1 and 2, and the gate. The safeguarding note is product
   copy, not the diagram's risk annotation: it says what the check is for, in
   the voice the reader needs, because "everyone you interview is 18 to 24" is
   the reason and it is not obvious.
   -------------------------------------------------------------------------- */
V.application = v => ph('Your application',

/* --------------------------------------------------------------------------

V.listing = v => ph('Your listing', v.listed

  <section class="sec">

/* --------------------------------------------------------------------------
   TRAINING — step 7 and the certification gate. Derek's rubric is three
   things, so it is a `.kv` rather than a `.facts` band: three cells in an
   auto-fit grid leaves one paying grey.
   -------------------------------------------------------------------------- */
V.training = v => {
  const done = v.mods === 4;
  return ph('Training and calibration', done
      ? 'Four modules &middot; calibrated 20 June &middot; re-checked each June'
      : `${v.mods || 0} of four modules &middot; calibration Thursday 20 June`)
    + talCard() + `

  <section class="sec">
    <div class="sec-h"><h2>The method</h2></div>
    <div class="tile-stack">
      ${[['How the interview runs', '45 minutes, and what each part is for', 1],
         ['Drawing out a story', 'Getting past the answer somebody rehearsed', 2],
         ['Evidence, not impression', 'What a level has to be able to point at', 3],
         ['Writing the report', 'The 24 hours after the call', 4]]
        .map(([t, d, n]) => factRow(n <= (v.mods || 0) ? 'checkFilled' : 'book', t, d,
          n <= (v.mods || 0) ? '<span class="tag sm green">Done</span>'
          : n === (v.mods || 0) + 1 ? '<span class="tag sm warn">Next</span>' : '<span class="tag sm">Locked</span>')).join('')}

  </section>

  <section class="sec">
    <div class="sec-h"><h2>Calibration</h2></div>

    <div class="sec-h"><h2>The rubric</h2></div>

  <section class="sec">
    ${done
      ? `<div class="note succ"><span>${I.checkFilled}</span><div class="nb"><b>Certified 20 June</b>
          Signed by Derek Hale. The method is re-checked each June, and that is two modules rather than four.</div></div>`
      : `<div class="note warn"><span>${I.warning}</span><div class="nb"><b>Your listing waits on this</b>

/* --------------------------------------------------------------------------
   ONE INTERVIEW — the brief before, the report after. Three pages in one,

   moment the call ended.
   -------------------------------------------------------------------------- */

  const x = iv(S.iv);
  const head = ph(x.n, `${x.kind} &middot; ${x.day} &middot; ${x.time}`, 'interviews');

    <section class="sec">
      <div class="note warn"><span>${I.warning}</span><div class="nb"><b>Due at ${x.due}</b>

        <textarea class="inp" rows="4">Sofia runs a team of four and described handing over the vendor review in enough detail to show she plans a handover rather than announces one. Less evidence on conversations she has had to open herself.</textarea></label>
      ${kv([['Level you are setting', x.level], ['Growth areas', 'Hard conversations, and asking for what she needs']])}

function shell(v){

      aria-label="${S.nav ? 'Collapse' : 'Expand'} navigation">${S.nav ? I.close

      <button class="shell-act ${S.tal ? 'on' : ''}" data-toggle="tal" aria-label="Ask Tal">${I.talChat}</button>
      <span class="av sm shell-avatar">${A.i}</span>
    </div>
  </header>`;
}

function sidenav(v){
  const active = PARENT[S.view] || S.view;
  const items = NAVSETS[v.nav].map(([k, l, ic]) =>
    `<button class="sn-item ${k === active ? 'on' : ''}" title="${l}" data-go="${k}"${k === active ? ' aria-current="page"' : ''}>${I[ic]}<span>${l}</span></button>`).join('');
  return `
  <div class="scrim ${S.nav ? 'on' : ''}" data-close="nav"></div>
  <nav class="sidenav ${S.nav ? 'on' : ''}" aria-label="Portal">
    <div class="sn-main">${items}</div>
    <div class="sn-foot">
      <button class="sn-item ${active === 'profile' ? 'on' : ''}" title="Profile" data-go="profile">${I.user}<span>Profile</span></button>
      <button class="sn-item" title="Log out" data-confirm="logout">${I.logout}<span>Log out</span></button>
    </div>
  </nav>`;
}

/* TAL'S PANEL, as a sheet.

   NOTHING IN IT KEEPS STATE IN THE DOM. `device.innerHTML` is replaced on
   every render, so the chosen question is `S.talQ` and the answer is drawn
   from the table — a class a click handler added would be gone by the next
   paint. That is `hifi/`'s rule for anything inside Tal and it is the reason
   its whole thread is a pure function of `S`.

   THE QUESTIONS ARE BUTTONS, NOT PAGE ROWS. A `.tile`/`.gcard` borrowed into a
   sheet brings the page's `--pad-x` indent with it and hangs off both sides —
   the trap `35-book.css` answers with one declaration. A `.btn-row` of small
   outlined buttons has no gutter to bring. */
function talSheet(){
  const qs = TALQ[S.view] || TALQ.dashboard;
  const a = qs.find(q => q[0] === S.talQ);
  return `<div class="modal ${S.tal ? 'on' : ''}" data-close="tal">
    <div class="sheet">
      <div class="sheet-h"><h2>Ask Tal</h2>
        <button class="x" data-close="tal" aria-label="Close">${I.close}</button></div>
      <div class="sheet-b">
        ${a ? `<div class="note acc"><span>${I.talChat}</span>
          <div class="nb"><b>${a[0]}</b>${a[1]}</div></div>` : ''}
        <p class="help${a ? ' mt5' : ''}">${a ? 'Anything else' : 'On this page'}</p>
        <div class="btn-row">
          ${qs.filter(q => q[0] !== S.talQ).map(q =>
            `<button class="btn btn-g btn-sm noic" data-ask="${q[0]}">${q[0]}</button>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

/* ==========================================================================
   RENDER

   THE WHOLE FRAME IS REPRINTED, which is `hifi/`'s model and the reason it is
   worth inheriting: no component may keep state in the DOM, so anything
   interactive has to be a pure function of `S`.

   `data-enter` is a ONE-RENDER motion cue and is stamped only when the page
   actually changed — flipping a switch or opening Tal must not replay the
   entrance. `data-shown` is the state and is what layout may read.
   ========================================================================== */
const device = document.getElementById('device');
const MO = {key:'', open:{}};

function render(){
  const v = f();
  if(!NAVSETS[v.nav].some(([k]) => k === S.view) && S.view !== 'profile'
     && !(PARENT[S.view] && NAVSETS[v.nav].some(([k]) => k === PARENT[S.view]))){
    S.view = 'dashboard';           /* a stage that lost the page you were on */
  }
  const view = V[S.view] || V.dashboard;

  const key = S.stage + '/' + S.view + '/' + (S.view === 'interview' ? S.iv : '') + '/' + S.tab;
  const entered = key !== MO.key;
  MO.key = key;

  const OVER = ['nav', 'tal', 'confirm', 'sheet'];
  const opened = OVER.filter(k => S[k] && !MO.open[k]);
  const shown  = OVER.filter(k => S[k]);
  for(const k of OVER) MO.open[k] = !!S[k];

  const at = ` data-rail="${S.nav ? 'open' : 'shut'}"`
           + ` data-view="${S.view}"`
           + (entered ? ' data-enter' : '')
           + (opened.length ? ` data-open="${opened.join(' ')}"` : '')
           + (shown.length ? ` data-shown="${shown.join(' ')}"` : '');

  device.innerHTML = `<div class="app"${at}>
    ${shell(v)}
    <div class="shell-body">
      ${sidenav(v)}
      <div class="view-col">
        <main class="main"><div class="page">${view(v)}</div></main>
      </div>
    </div>
    ${talSheet()}${confirmSheet()}${editSheet()}
  </div>`;

  dsStagger(device.querySelector('.page'));
  document.getElementById('pick').value = S.stage;
  const st = STAGES.find(s => s[0] === S.stage);
  document.getElementById('cap').innerHTML = st ? `<b>${st[1]}.</b> ${st[2]}` : '';
}

/* --------------------------------------------------------------------------
   NAVIGATION — one delegated listener on a container that outlives the render.

   `data-iv` IS READ IN THE CAPTURE PHASE, before the click reaches the router,
   which is what keeps `data-go` a plain view name. The alternative is a
   `data-go="interview:sofia"` that the router has to split, and the wireframe's
   `data-ag="member:41:Maryam Naz"` is what that turns into.
   -------------------------------------------------------------------------- */
device.addEventListener('click', e => {
  const t = e.target.closest('[data-iv]');
  if(t) S.iv = t.dataset.iv;
}, true);

device.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-toggle],[data-close],[data-ask],[data-tab],[data-confirm],[data-sheet]');
  if(!t) return;
  const d = t.dataset;

  if(d.close){
    if(e.target.closest('.sheet') && !e.target.closest('[data-close]')) return;
    S[d.close] = false; if(d.close === 'tal') S.talQ = null;
    return render();
  }
  if(d.toggle){ S[d.toggle] = !S[d.toggle]; if(d.toggle === 'tal') S.talQ = null; return render(); }
  if(d.confirm){ S.confirm = d.confirm; return render(); }
  if(d.sheet){ S.sheet = d.sheet; return render(); }
  if(d.ask){ S.talQ = d.ask; return render(); }
  if(d.tab){ S.tab = d.tab; return render(); }
  if(d.go){
    S.view = d.go; S.nav = false; S.tal = false; S.talQ = null;
    if(d.go === 'interviews') S.tab = 'next';
    render();
    device.querySelector('.main').scrollTop = 0;
  }
});

/* The switches keep their state on `S`, not in the DOM, for the same reason
   everything else does: the next render would print the markup's default. */
device.addEventListener('change', e => {
  const p = e.target.closest('[data-perm]');
  if(p){ S.perms[p.dataset.perm] = p.checked; }
});

};
document.getElementById('reset').onclick = () => {

};

/* ONE DOCUMENT, THREE SIZES. Each frame keeps its true pixel width so the
   container queries inside it resolve honestly, and is scaled down to fit
   rather than squashed. Desktop is not a device: it has no bezel and takes the
   whole stage, which is also the honest preview. */
const VP_SIZE = {mobile:[390, 844], tablet:[744, 1133], fluid:[1440, 900]};
const fitBox = document.getElementById('fit');

function fitFrame(){
  const vp = device.dataset.vp;
  const stage = fitBox.parentElement;
  const pct = document.getElementById('vpscale');
  if(vp === 'fluid'){
    device.style.transform = 'none';
    device.style.width = '100%';
    device.style.height = Math.max(520, window.innerHeight - stage.getBoundingClientRect().top - 64) + 'px';
    fitBox.style.width = '100%';
    fitBox.style.height = device.style.height;
    if(pct) pct.textContent = Math.round(stage.clientWidth) + 'px';
    return;
  }
  const [w, h] = VP_SIZE[vp] || VP_SIZE.mobile;
  device.style.width = w + 'px';
  device.style.height = Math.min(h, Math.round(window.innerHeight * 0.8)) + 'px';
  const avail = stage.clientWidth - 8;
  const scale = Math.min(1, avail / w);
  device.style.transform = scale < 1 ? `scale(${scale})` : 'none';
  fitBox.style.width = Math.round(w * scale) + 'px';
  fitBox.style.height = Math.round(parseFloat(device.style.height) * scale) + 'px';
  if(pct) pct.textContent = scale < 1 ? Math.round(scale * 100) + '%' : '100%';
}

document.getElementById('vp').addEventListener('click', e => {
  const b = e.target.closest('button[data-vp]');
  if(!b) return;
  document.querySelectorAll('#vp button').forEach(x => x.classList.toggle('on', x === b));
  device.dataset.vp = b.dataset.vp;
  S.nav = false;
  render();
  fitFrame();
});
window.addEventListener('resize', fitFrame);

render();
fitFrame();
</script>
</body>
</html>
