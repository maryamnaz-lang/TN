   EVERY DATE HERE IS THE SLOT'S. `ord` and `chip` used to be written on the `IVS`
   row beside a `day` that said the same thing in words; both are now `daysOut`
   and `chipOf` over the slot the interview is booked into, so the diary column,
   the calendar cell and the page's own prose cannot drift. An interview with no
   slot cannot appear — which is correct, because a booking IS a slot. */
const diary = (v, not) => IVS.filter(x => x.st === 'next' && x.id !== not)
  .map(x => ({x, s: slotForIv(x.id)})).filter(r => r.s)
  .map(({x, s}) => ({
    ord: daysOut(s), chip: chipOf(s), time: x.time, id: x.id, i: x.i, iv: x.id,
    now: daysOut(s) === 0, go: 'interview',
    t: `${x.kind} &middot; ${x.n}`,
    d: `45 minutes, recorded &middot; ` + (x.summary
        ? 'their 90-day summary is attached, so you read that first'
        : `${money(v.fee)} already in escrow`)
  })).sort((a, b) => a.ord - b.ord);

const money = n => '$' + n.toLocaleString('en-US');

/* ==========================================================================
   THE PAGES
   ========================================================================== */
const V = {};

/* --------------------------------------------------------------------------
   HOME — three different pages, because an agent still being enabled and an
   agent with a report due tonight do not share a single fact. Branching here
   rather than in three view keys keeps one `PAGESUM.dashboard` table, keyed by
   stage.

   There was a fourth, `if(!v.approved)`, and it was Stage 1's: a four-row "How
   it works" list and a button into the Application page. Both went with the
   two stages that could reach them — see the note over `STAGES`. Every stage
   that is left sets `approved:true`, so the branch was unreachable, and an
   unreachable branch on the busiest view in the file is the one place a stale
   fact hides longest.
   -------------------------------------------------------------------------- */
V.dashboard = v => {
  /* THE DASHBOARD IS THE ONE PAGE THAT GREETS YOU, and the greeting hides the
     page header by design (§33). So the title and the fact row are still
     written — they are what a reader gets if the band ever fails — but what is
     read is Tal's line and the stepper beside it. Both carry the same facts
     the fact row would have. */
  const band = extra => head({
    title: `Welcome back, ${A.n.split(' ')[0]}!`,
    sub: v.certified ? `Talent agent &middot; assesses ${v.range} &middot; ${money(v.fee)} an interview`
                     : 'Talent agent &middot; not yet certified',
    greet: `Welcome back, ${A.n.split(' ')[0]}!`,
    /* THE JOURNEY STEPPER IS FOR AN AGENT WHO IS STILL BEING ENABLED, and it
       comes off the moment they are certified. From `live` on it read "Step 5 of
       5 · Interviewing · Listed since 24 June · nothing booked yet" — a progress
       rail with every segment filled, a count that cannot move, and a current
       step whose detail line was already the sentence Tal had just said two
       inches to its left. A stepper that is finished is not a stepper; it is a
       decoration taking a third of the head band and half of Tal's measure.
       What replaced it is nothing: §33.8 collapses the card to one column when
       there is no `.stp-wing` (`:not(:has(.stp-wing))`, written for exactly
       this), so Tal's line takes the width back rather than leaving a gap.

       `certified` is the test rather than a list of stages, because that is the
       fact the stepper's last step IS — "bookable the day you are certified".
       A stage added after `reviewed` gets the right answer without being named
       here, and `setup` and `training` keep the wing because for them the
       journey is the page's whole subject. */
    wing: v.certified ? '' : JOURNEY(v),
    plate: extra
  });

  /* --- stage 2 and 3: approved, not yet bookable ------------------------ */
  /* THE ONE THING TO DO NEXT, AS THE BLACK CARD.

     `working` opens with a `.plate` because an agent with a week ahead has one
     appointment that matters more than the page around it. An agent being
     enabled has the same shape of problem and had no answer to it: the dashboard
     opened with Tal's sentence, then a four-row checklist, and the reader had to
     find which of the four rows was theirs today. Two of them are `now` at
     `setup`, which is the case that makes it worst — a list with two live rows
     does not say which one to start.

     SO THE PLATE IS THE FIRST UNFINISHED STEP, AND IT IS DERIVED FROM THE SAME
     ORDER THE LIST USES. `checkRow` marks step 2 `done` on `v.listing`, step 3
     on `v.paid`, step 4 on `v.lessonsDone === 4`; this reads those three flags in the
     same sequence and stops at the first that is false. So the card and the row
     it duplicates can never disagree — there is no second table of "what is
     next" to keep in step, which is the failure mode a hand-written hero card
     has. Change a flag in `CFG` and both move together.

     EACH ONE CARRIES WHAT THAT STEP ACTUALLY HAS. The public profile has no date
     and no person, so it gets neither — `plate()` omits the countdown chip and
     the face when they are not passed, and a chip reading "soon" over a task
     with no deadline is the kind of furniture this file keeps out. Calibration
     has both, so step 4 gets Derek and the Thursday. The action is always the
     page that step lives on, which is where the row underneath goes too.

     AND IT IS NOT THE TRAINING PAGE'S PLATE. That one is the calibration
     interview — an appointment, with a confirm and a move-it. This one is the
     LESSON, because that is what is on the agent before the call: one of four
     left, self-paced, no date. Two plates about the same stage saying two
     different things is correct here; they are two different steps. */
  const NEXT_STEP = [
    [v => !v.listing, v => ({
      title: 'Write your public profile',
      meta: `Photo, bio, four specialisms and the range you assess &middot; nothing is visible until you are certified`,
      actions: `<button class="btn btn-p btn-sm noic" data-go="profile">Open your public profile ${I.arrowRight}</button>
        <button class="btn btn-sm noic plate-b2" data-peek="1">See how you will appear</button>`
    })],
    [v => !v.paid, v => ({
      title: 'Connect a payout destination',
      meta: `${money(v.fee)} an interview, ${money(v.share)} of it yours &middot; a Stripe handoff, so TalentNext never sees an account number`,
      actions: `<button class="btn btn-p btn-sm noic" data-go="earnings">Continue to Stripe ${I.launch}</button>`
    })],
    [v => v.lessonsDone !== 4, v => ({
      when: 'in 2 days', av: 'DH', photo: AV.samuel, who: 'Derek Hale',
      whoSub: 'Head of agent standards',
      title: `Finish ${LESSONS[v.lessonsDone || 0][0].toLowerCase()}`,
      meta: `${(v.lessonsDone || 0)} of four lessons done &middot; then 45 minutes with Derek on Thursday 20 June`,
      actions: `<button class="btn btn-p btn-sm noic" data-go="training">Open Training ${I.arrowRight}</button>`
    })]
  ];
  const nextStep = v => {
    const hit = NEXT_STEP.find(([test]) => test(v));
    return hit ? plate(hit[1](v)) : '';
  };

  if(!v.certified) return band(nextStep(v)) + `
    <section class="sec">
      <div class="sec-h"><h2>Before you list</h2></div>
      <div class="tile-stack">
        ${/* `user`, and it is the one row here that names its own icon: this
              row opens nothing — the agent role is a fact about the account,
              not a page — so there is no rail item for `navIcon` to read. */''}
        ${/* THE NUMBERS ARE WRITTEN, NOT COUNTED. Four steps in a fixed order,
              and the order is the product's rather than the array's — a step
              that stops applying is removed from the page, not renumbered by a
              loop, so "3" always means the fee and payouts. `checkRow`'s last
              argument is the one it prints. */''}
        ${checkRow('done', 'Agent role added', 'On the account you already had, 12 June', null, 1)}
        ${checkRow(v.listing ? 'done' : 'now', 'Your public profile', v.listing ? 'Written, with four specialisms' : 'Photo, bio, specialisms and the range you assess', 'profile', 2)}
        ${checkRow(v.paid ? 'done' : 'now', 'Your fee and payouts', v.paid ? `${money(v.fee)} an interview &middot; Stripe connected` : `${money(v.fee)} set. A payout destination is still needed`, 'earnings', 3)}
        ${checkRow(v.lessonsDone === 4 ? 'done' : v.listing ? 'now' : '', 'Training and calibration',
          v.lessonsDone === 4 ? 'All four lessons and the calibration interview' : `${v.lessonsDone || 0} of four lessons done &middot; calibration Thursday 20 June`, 'training', 4)}
      </div>
    </section>
    <section class="sec">
      ${/* AN AGENT IS BOOKED; AN AGENT DOES NOT BOOK. "Nothing is bookable yet"
            has no subject in it, and the sentence a reader supplies is the wrong
            one — it reads as "there is nothing for you to book", which is a
            thing this portal never asks anyone to do. A candidate finds an agent
            in browse, takes one of their open slots and pays for it at that
            moment; the agent's only control is which slots are open. So the note
            names who does the booking, and it is not the person reading it.

            The same slip is worth watching for anywhere else this portal talks
            about a booking. "Booked means paid", "a booking arrives paid for"
            and "there is nothing to accept" are all already passive and all
            already correct — the agent is the object of the sentence in every
            one of them, which is the test. */''}
      <div class="note"><span>${I.info}</span><div class="nb"><b>Candidates cannot book you yet</b>
        Your public profile goes into browse the day you are certified, and not before &mdash; a half-built one is never shown.</div></div>
    </section>`;

  /* --- stage 4, day one: listed, empty ---------------------------------- */
  if(!v.busy) return band() + `
    ${/* NO HEADING OVER THE FIGURE ROW — see the note on the working week's
          row below, which is the same four cells and the same argument. */''}
    <section class="sec">
      ${stats([
        ['search',   'In browse',  'Live',        'since 24 June'],
        ['wallet',   'Your rate',  money(v.fee),  `${money(v.share)} of it yours`],
        ['calendar', 'Slots open', '6',           'over the next fortnight'],
        ['video',    'Booked',     '0',           'nobody has taken one yet']])}
    </section>
    ${/* THE ACTIONS ARE INSIDE THE EMPTY STATE, and they used to be a section of
          their own below it. That put them hard left under a centred block, two
          left edges and two vertical rhythms for what is one thought: nothing
          has happened, here is what to do about it. §43 centres them with the
          rest of the block and gives the section the height left on the page, so
          the whole thing sits in the middle of the space it is describing. */''}
    <section class="sec sec-fill">
      <div class="sec-h"><h2>Nobody has booked you yet</h2></div>
      <div class="empty">${I.calendar}<span class="t">No interviews yet</span>
        <span class="help">A candidate browsing your track sees your next free slot first. Friday at 5:00 PM is the one they will be offered.</span>
        <div class="btn-row">
          <button class="btn btn-p" data-go="availability">Open more slots ${I.arrowRight}</button>
          ${/* `data-peek`, NOT A DESTINATION. There is no page to send this to
                any more — the module it used to open was removed and its
                sections live on Profile — and even when there was one, sending
                somebody to a form to answer "how do I appear" was answering a
                different question. The peek draws the card beside whatever you
                were reading. */''}
          <button class="btn btn-g noic" data-peek="1">See how you appear</button>
        </div></div>
    </section>`;

  /* --- stage 4: a working week ------------------------------------------ */
  /* THE NEXT INTERVIEW IS THE PLATE, AND THE PLATE IS IN THE BAND. It is the
     same object the candidate's dashboard puts there — an appointment with a
     person, a time, and the one action worth a hero. Inside a `.modhead` it
     sits inset rather than bleeding to the column edge (§33 zeroes the
     negative margin), which is what makes the greeting, the sentence, the
     stepper and the appointment read as one opening block. */
  const due = iv('sofia'), next = iv('rafael');
  return band(plate({
      when: 'tomorrow', av: next.i, photo: AV.lena, who: next.n,
      whoSub: `${next.kind} &middot; ${next.band}`,
      title: 'Interview with ' + next.n,
      meta: `${next.day} at ${next.time} &middot; 45 minutes &middot; ${money(v.fee)} paid`,
      actions: `<button class="btn btn-p btn-sm noic">Join the call ${I.video}</button>
        <button class="btn btn-sm noic plate-b2" data-go="interview" data-iv="${next.id}">Read the brief</button>`
    })) + `
    ${/* NO HEADING OVER THE FIGURE ROW. Every cell here names itself — the
          label IS what a `.stats` cell is scanned by (§10's note on the label
          column makes the same point) — and each one carries its own period in
          its footnote: "9 in total", "up from 4.2 in July", "three interviews,
          held". A heading of "This month" over four cells where only one of
          them is a monthly figure was a fifth label that did not match its
          own row, set at h2 weight above cells that are already headed.
          The dashboard's other figure row lost its "Your public profile" for the
          same reason. On the pages that keep theirs — Earnings, Public profile,
          Standing — the row sits among other sections and the heading is what
          separates them; here it is the first thing under the head band. */''}
    <section class="sec">
      ${stats([
        ['video',      'Interviews', String(v.month),   `${v.ivs} in total`],
        ['growth',     'Follow-up',  String(v.follow),  'up from 4.2 in July'],
        ['wallet',     'Earned',     money(v.earned),   `${money(v.share)} an interview`],
        ['creditCard', 'In escrow',  money(v.escrow),   'three interviews, held']])}
    </section>

    <section class="sec">
      <div class="sec-h"><h2>On you</h2></div>
      <div class="tile-stack">
        ${faceRow(due, `Report &middot; Tal has a draft off the transcript &middot; due ${due.due}`, 'interview')}
      </div>
    </section>

    <section class="sec">
      <div class="sec-h"><h2>After that</h2>
        <span class="t-helper-01">Booked interviews, in the order they happen</span></div>
      <div class="tile-stack">
        ${diary(v, next.id).map(bookedRow).join('')}
      </div>
    </section>

    <section class="sec">
      <div class="note"><span>${I.info}</span><div class="nb"><b>There is nothing to accept</b>
        A booking arrives paid for. Your availability is the control &mdash; a slot you leave open can be taken without asking you first.</div></div>
      <div class="btn-row mt5">
        <button class="btn btn-p" data-go="interviews">All interviews ${I.arrowRight}</button>
        <button class="btn btn-g noic" data-go="availability">Availability</button>
      </div>
    </section>`;
};

/* --------------------------------------------------------------------------
   THERE WAS AN APPLICATION PAGE HERE — steps 1 and 2, and the approval gate:
   what was sent, the three checks with their tags, a safeguarding note, and a
   referee form on the unsent variant. It is gone with Stage 1 (the note over
   `STAGES` has the argument), along with the `early` rail set that was the only
   thing that could reach it and the dashboard branch that linked it.

   ONE THING IT SAID IS WORTH KEEPING WHERE IT IS READ, and it is not a rule the
   diagram made obvious: the background check runs before an agent's FIRST
   INTERVIEW, not before approval, because everyone they will interview is
   between 18 and 24 and the conversation is one-to-one and recorded. That is a
   fact about being bookable rather than about applying, so if it is ever wanted
   on screen again it belongs on Training or Standing, next to certification —
   not on a page an agent sees once and never opens again.
   -------------------------------------------------------------------------- */

/* --------------------------------------------------------------------------
   LISTING — steps 4 and 5. How the agent appears in browse, and their fee.
   -------------------------------------------------------------------------- */
/* --------------------------------------------------------------------------
   THERE WAS A PUBLIC PROFILE MODULE HERE, AND IT WAS ONE PAGE TOO MANY

   It held five sections: the card as a row with Preview and Edit, the four
   figure cells, the specialisms, the fee, and the visibility toggle. Every one
   of them is a thing an agent edits ABOUT THEMSELVES, which is what Profile is,
   and the one thing the page did that Profile could not — show the card as a
   candidate sees it — is what the peek was built for. So a rail item, a view, a
   `PAGESUM` table and a `TALQ` row were all being spent on a second profile
   page whose answer was "open the preview".

   The sections moved to `V.profile` unchanged, under one heading that says what
   they are. Nothing was dropped: the fee sheet, the specialism chips and the
   visibility switch are all still there, and `data-sheet="listing"` is still the
   editor behind them — the SHEET keeps its key, because a sheet is not a page
   and renaming it would be a rename for its own sake.

   THE ENTRY POINT IS A BUTTON, NOT A DESTINATION. "Public profile" on the
   Profile page opens the peek beside whatever you are reading, which is the
   whole argument §44 makes: the card and the form belong on screen together, and
   sending someone to a page to look at a preview of another page is the shape
   this removal exists to undo.
   -------------------------------------------------------------------------- */

/* --------------------------------------------------------------------------
   TRAINING — step 7 and the certification gate. Derek's rubric is three
   things, so it is a `.kv` rather than a `.facts` band: three cells in an
   auto-fit grid leaves one paying grey.
   -------------------------------------------------------------------------- */
V.training = v => {
  /* THREE STATES, AND THE PAGE USED TO DRAW TWO. `done` was the only branch, so
     an agent who had started nothing got the same page as one with three modules
     behind them — and four things on it were wrong at once:

       - Tal said the modules were finished (a missing `PAGESUM` key, fixed above)
       - the black card offered "Confirm the slot" for a calibration interview,
         before a single module had been opened
       - the progress card said "Module 1 · in progress" over a 0% ring and
         "Nothing finished yet"
       - the one thing to actually do, "Open module 1", was a button at the very
         bottom of the page, under the rubric and a warning note

     `at` is the state, read off the same `lessonsDone` count the rest of the page uses:
     0 is nothing started, 1–3 is under way, 4 is certified. Every branch below
     names it rather than testing `lessonsDone` again, so the page cannot disagree with
     itself the way it just did. */
  const lessonsDone = v.lessonsDone || 0;
  const at = lessonsDone === 4 ? 'certified' : lessonsDone === 0 ? 'unstarted' : 'underway';
  const next = LESSONS[Math.min(lessonsDone, 3)];

  /* AND CALIBRATION IS NOT BOOKED UNTIL THE LESSONS ARE. That is the fact the
     old page was missing, and it is what made the plate absurd: a date and a
     "confirm" for an appointment that cannot be scheduled yet. It is stated once
     here and read in three places — the fact row, the hero, and the kv band. */
  const calWhen = at === 'unstarted'
    ? 'Booked once the four lessons are done'
    : 'Thursday 20 June, 4:00 PM ET';

  /* THE HERO IS THE NEXT THING TO DO, and which thing that is depends on the
     state. Nothing started: the first lesson, with the button that opens it —
     the page's primary action, at the top, where the candidate portal puts every
     other one. Under way: the calibration, because the appointment is the thing
     in the way and the remaining lesson has its own row below. Certified: the
     certificate, because there is nothing left to do. */
  const hero = at === 'certified'
    ? `<div class="cert">
        <h3>Certified to interview</h3>
        <p class="sub">Issued 20 June 2024 &middot; signed by Derek Hale &middot; Explorer and Builder</p>
      </div>`
    : at === 'unstarted'
      ? plate({
          title: `Start with ${next[0].toLowerCase()}`,
          meta: `${next[1]} &middot; lesson 1 of 4, then a 45-minute calibration with Derek Hale`,
          actions: `<button class="btn btn-p btn-sm noic">Open lesson 1 ${I.arrowRight}</button>`
        })
      : plate({
          when: 'in 2 days', av: 'DH', photo: AV.samuel, who: 'Derek Hale',
          whoSub: 'Head of agent standards',
          title: 'Calibration interview',
          meta: `${calWhen} &middot; 45 minutes &middot; recorded`,
          actions: `<button class="btn btn-p btn-sm noic">Confirm the slot ${I.video}</button>
            <button class="btn btn-sm noic plate-b2">Ask to move it</button>`
        });

  /* THE BACK BUTTON APPEARS ONLY WHERE THE PAGE IS A SUB-PAGE. In the enabling
     stages Training is a rail item and a back arrow would point at nothing;
     once certified it is reached from Standing, and it needs one. */
  return head({
    title: 'Training and calibration',
    /* A `&middot;` ROW IS FIGURES, so the count is set rather than spelt — the
       house rule is that a small number is spelt only when it opens a
       sentence. */
    sub: at === 'certified'
      ? '4 of 4 lessons &middot; calibrated 20 June &middot; re-checked each June'
      : `${lessonsDone} of 4 lessons &middot; ${at === 'unstarted' ? 'calibration once the four are done' : 'calibration Thursday 20 June'}`,
    back: v.nav === 'full' ? 'standing' : '',
    plate: hero
  }) + `

  <section class="sec">
    <div class="sec-h"><h2>Your progress</h2></div>
    ${/* THE WEEK CARD AND ITS RING. Four lessons run in sequence and each one is
          either finished or not, which is exactly the shape the candidate's
          chapter card draws — so it is drawn with the same component rather than
          with a second progress idea invented here.

          THE EYEBROW SAYS WHICH STATE, and "in progress" was wrong in the one it
          was hard-coded for: nothing is in progress when nothing is started, and
          the ring beside it read 0%. The heading is the lesson the eyebrow is
          about, so at `unstarted` both name lesson 1 and agree.

          The section is headed "Your progress" and not "The method" — the method
          is what the four lessons TEACH, and it was the heading over a card
          about how far through them you are. */''}
    <div class="wkc">
      <div class="wkc-top">
        <div class="wkc-tb">
          <div class="wkc-eb t-label-01">${at === 'certified'
            ? 'All four lessons &middot; finished'
            : `Lesson ${lessonsDone + 1} of 4 &middot; ${at === 'unstarted' ? 'not started' : 'next'}`}</div>
          <h3 class="u-h3">${at === 'certified' ? 'The interview method' : next[0]}</h3>
          <div class="wkc-min sub">${lessonsDone} of 4 lessons done</div>
        </div>
        ${ring(Math.round(lessonsDone / 4 * 100))}
      </div>
      <span class="eyebrow">${at === 'certified' ? 'What you were taken through' : 'What you have finished'}</span>
      <ul class="wkc-did">
        ${LESSONS.filter((m, n) => n < lessonsDone).map(m =>
          `<li class="u-compact"><span class="wkc-tick">${I.checkFilled}</span>
            <span class="wkc-db"><b>${m[0]}</b><span class="sub">${m[1]}</span></span></li>`).join('')
          || '<li class="u-compact"><span class="wkc-db"><span class="sub">Nothing yet &mdash; lesson 1 is where it starts.</span></span></li>'}
      </ul>
    </div>
  </section>

  ${at === 'certified' ? '' : `
  <section class="sec">
    <div class="sec-h"><h2>The four lessons</h2></div>
    ${/* A `Next` TAG IS NOT AN ACTION. The row that is yours to do carried a
          pill saying so and nothing to press, while the button that opened it sat
          at the foot of the page under the rubric. The pill was the label for a
          control that was somewhere else. It is a button on the row now, and the
          rows that are not yours keep the tag, because "Locked" IS a status and
          there is nothing to press on it. Heading is "The four lessons" rather
          than "Still to do", because the finished ones are listed here too — with
          their tick, so the section is the whole set in order rather than a
          remainder. */''}
    ${/* NUMBERED, NOT FOUR IDENTICAL BOOKS. `factRow`'s mark is an icon, and the
          icon was `book` on every row — so the left of the list was the same
          glyph four times, saying "this is a lesson" to a reader who had just
          read the heading "The four lessons". What the mark has to say here is
          WHICH lesson, because these run in a fixed sequence and the row you can
          open is the next number: `.ch-num` is that component (§03.139), and the
          "Before you list" checklist reached the same conclusion for the same
          reason — §42's note is the long version.

          So the row is written out rather than passed through `factRow`. It is
          `checkRow`'s static shape exactly: number, then title with its status
          beside it, then the detail line, then the trailing slot. `Locked` stays
          a tag because it IS a status with nothing to press; the next lesson
          gets the button. */''}
    <div class="tile-stack">
      ${LESSONS.map((m, n) => `<div class="cardrow ckrow">
        <span class="ch-num">${n + 1}</span>
        <span class="cardrow-b">
          <span class="cardrow-t">${m[0]}${n < lessonsDone
            ? `<span class="row-st done" role="img" aria-label="Finished">${I.checkFilled}</span>` : ''}</span>
          <span class="cardrow-d">${m[1]}</span></span>
        ${n < lessonsDone ? ''
          : n === lessonsDone ? `<span class="cardrow-a"><button class="btn btn-g btn-sm noic">Open lesson ${n + 1}</button></span>`
          : '<span class="cardrow-a"><span class="tag sm">Locked</span></span>'}
      </div>`).join('')}
    </div>
  </section>`}

  <section class="sec">
    <div class="sec-h"><h2>Calibration</h2></div>
    ${kv([
      ['With', 'Derek Hale &middot; head of agent standards'],
      ['When', at === 'certified' ? 'Thursday 20 June' : calWhen],
      ['Length', '45 minutes, recorded'],
      ['Result', at === 'certified' ? 'Passed &mdash; certified 20 June' : at === 'unstarted' ? 'Not scheduled yet' : 'Not sat yet']])}
    <p class="help mt4">A recorded mock interview with a real candidate who has agreed to it. Derek watches your half of the conversation.</p>
    ${at === 'certified' ? '' : `
    ${/* THE NOTE MOVED HERE, TO THE THING IT IS ABOUT. It was the last block on
          the page, under the rubric, where it read as a warning about the rubric.
          What it is actually about is the gate: the calibration is what the
          public profile waits on. */''}
    <div class="note warn mt5"><span>${I.warning}</span><div class="nb"><b>Your public profile waits on this</b>
      Nothing goes into browse until the calibration is passed &mdash; and it cannot be booked until the four lessons are done.</div></div>`}
  </section>

  <section class="sec">
    <div class="sec-h"><h2>What Derek watches for</h2></div>
    ${/* "THE RUBRIC" IS THE WORD FOR IT INSIDE THE COMPANY. The heading is what
          the reader wants to know — the three rows are questions Derek is asking
          himself about you, and the heading should say that. */''}
    ${kv([
      ['Tenacity', 'Do you stay with a thread that is going somewhere'],
      ['Energy', 'Does the candidate do more talking by the end than the start'],
      ['Noticing', 'Do you hear what was left out']])}
    ${at === 'certified'
      ? `<p class="help mt4">The method is re-checked each June, and that is two lessons rather than four.</p>`
      : ''}
  </section>`;
};

/* --------------------------------------------------------------------------
   INTERVIEWS — steps 9, 10 and 11. Two tabs, because "what is coming" and
   "what is finished" are two questions and a page that answers both at once
   makes the reader do the filtering.
   -------------------------------------------------------------------------- */
V.interviews = v => {
  if(!v.busy) return head({title: 'Interviews',
    sub: 'Nothing booked &middot; six slots open &middot; 45 minutes each'}) + `
    ${/* `sec-fill` — §43's opt-in. This section IS the page, so it takes the
          height that is left and centres the block in it. Not applied to a
          section that merely CONTAINS an empty state among others: the leader's
          candidate page has one of those and stretching it would push the six
          sections under it apart. */''}
    <section class="sec sec-fill">
      <div class="empty">${I.calendar}<span class="t">Nothing booked yet</span>
        <span class="help">A booking arrives already paid for, with the candidate’s brief attached. There is nothing to accept.</span>
        <div class="btn-row"><button class="btn btn-p" data-go="availability">Open more slots ${I.arrowRight}</button></div></div>
    </section>`;

  const done = IVS.filter(x => x.st === 'done');
  const owed = IVS.filter(x => x.st === 'report');

  return head({title: 'Interviews',
    sub: `${v.month} this month &middot; ${v.ivs} in total &middot; next Thursday 20 August`}) + `
  <div class="tabs">
    <button class="${S.tab === 'next' ? 'on' : ''}" data-tab="next">Coming up</button>
    <button class="${S.tab === 'done' ? 'on' : ''}" data-tab="done">Finished</button>
  </div>

  ${S.tab === 'next' ? `
  <section class="sec">
    <div class="sec-h"><h2>Waiting on you</h2></div>
    <div class="tile-stack">
      ${owed.map(x => faceRow(x,
        `Report &middot; interviewed ${x.day.replace(/^\w+ /, '')} at ${x.level} &middot; due ${x.due}`,
        'interview')).join('')}
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Booked</h2>
      <span class="t-helper-01">In the order they happen</span></div>
    <div class="tile-stack">
      ${diary(v).map(bookedRow).join('')}
    </div>
  </section>

  <section class="sec">
    <div class="note"><span>${I.info}</span><div class="nb"><b>Booked means paid</b>
      The fee is taken when the slot is chosen and held in escrow, so an interview reaches you already settled. If a candidate does not appear, wait fifteen minutes and mark it.</div></div>
  </section>`
  : `
  <section class="sec">
    <div class="sec-h"><h2>Last five</h2></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <tr><th>Candidate</th><th>Interviewed</th><th>Level set</th><th class="num">Follow-up</th><th class="num">Depth</th></tr>
        ${done.concat(owed).map(x => `<tr>
          <td>${x.n}</td><td>${x.day.replace(/^\w+ /, '')}</td>
          <td>${x.level || '&mdash;'}</td>
          <td class="num">${x.follow || '&mdash;'}</td>
          <td class="num">${x.depth || '&mdash;'}</td></tr>`).join('')}
      </table>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Open one</h2></div>
    <div class="tile-stack">
      ${done.map(x => goRow('document', x.level, x.n,
        `${x.day.replace(/^\w+ /, '')} &middot; signed ${x.signed}`, 'interview', ` data-iv="${x.id}"`)).join('')}
    </div>
  </section>`}`;
};

/* --------------------------------------------------------------------------
   ONE INTERVIEW — the brief before, the report after. Three pages in one,
   keyed off the record's own state, because they are the same interview at
   three moments and splitting them would put the brief out of reach the
   moment the call ended.
   -------------------------------------------------------------------------- */
V.interview = v => {
  const x = iv(S.iv);
  /* NO GREY LINE WHERE THE PLATE CARRIES THE SPINE. An upcoming interview
     states its kind, day and time on the hero directly under the head, so a
     fact row saying the same three things is the page telling you twice
     before Tal has said anything. The two finished states have no plate, so
     they keep it. */
  const PHOTO = {rafael: AV.lena, amara: AV.hana, sofia: AV.priya, tom: AV.samuel, nina: AV.hana};
  const band = extra => head({
    title: x.n,
    sub: x.st === 'next' ? '' : `${x.kind} &middot; ${x.day} &middot; ${x.time}`,
    back: 'interviews',
    plate: extra
  });

  if(x.st === 'next') return band(plate({
      when: x.id === 'rafael' ? 'tomorrow' : 'in 5 days',
      av: x.i, photo: PHOTO[x.id], who: x.n, whoSub: x.band,
      title: x.kind, meta: `${x.day} at ${x.time} &middot; 45 minutes &middot; video, recorded`,
      actions: `<button class="btn btn-p btn-sm noic">Join the call ${I.video}</button>
        <button class="btn btn-sm noic plate-b2">Add to calendar</button>`
    })) + `
    <section class="sec">
      <div class="sec-h"><h2>Their brief</h2></div>
      ${kv([
        ['Where they are', x.band],
        ['Asked to be assessed on', x.asked],
        ['Booked', x.paid],
        ['Fee', `${money(v.fee)}, ${money(v.share)} of it yours`],
        ...(x.summary ? [['Attached', 'Their 90-day summary']] : [])])}
    </section>

    <section class="sec">
      <div class="sec-h"><h2>Before it</h2></div>
      <ol class="steps">
        <li><span class="s-n">1</span><span class="s-b"><b>Read the brief</b>
          Two minutes. It is what they asked for, in their words.</span></li>
        <li><span class="s-n">2</span><span class="s-b"><b>Open the room early</b>
          The recording starts when you both join, and they are told that.</span></li>
        <li><span class="s-n">3</span><span class="s-b"><b>Send the report within a day</b>
          Tal drafts it off the transcript. The level is set by you and signed by you.</span></li>
      </ol>
    </section>

    <section class="sec">
      <div class="btn-row">
        <button class="btn btn-g noic" data-sheet="brief">Add a note to the brief</button>
      </div>
    </section>`;

  if(x.st === 'report') return band() + `
    <section class="sec">
      <div class="note warn"><span>${I.warning}</span><div class="nb"><b>Due at ${x.due}</b>
        Twenty-four hours from the end of the call is the promise the candidate paid against.</div></div>
    </section>

    <section class="sec">
      <div class="sec-h"><h2>The call</h2></div>
      ${kv([
        ['Held', `${x.day} &middot; ${x.time}`],
        ['Ran', '48 minutes'],
        ['Transcript', 'Ready'],
        ['Your share', `${money(v.share)}, held until the report goes out`]])}
    </section>

    <section class="sec">
      <div class="sec-h"><h2>Tal’s draft</h2></div>
      <!-- THE SAME BAND AS THE PAGE SUMMARY, because it is the same speaker.
           Tal has one voice and one surface in this product; a second styling
           for "Tal, but further down the page" would be a second Tal. -->
      <div class="ai-aura">
        <div class="ai-head"><span class="ai-label bare">Tal</span></div>
        <div class="ai-body"><p>She talks about her team of four in specifics and
          about herself in generalities, which is where the evidence thins. Two
          clear examples of delegation, none of a hard conversation she started.</p></div>
      </div>
      <label class="f mt5"><span class="lbl">Your write-up</span>
        <textarea class="inp" rows="4">Sofia runs a team of four and described handing over the vendor review in enough detail to show she plans a handover rather than announces one. Less evidence on conversations she has had to open herself.</textarea></label>
      ${kv([['Level you are setting', x.level], ['Growth areas', 'Hard conversations, and asking for what she needs']])}
    </section>

    <section class="sec">
      <div class="note"><span>${I.info}</span><div class="nb"><b>Signing is what sets the level</b>
        After it is signed, a change to a level is a review decision rather than yours.</div></div>
      <div class="btn-row mt5">
        <button class="btn btn-p noic" data-confirm="sign">Sign and send the report</button>
        <button class="btn btn-g noic">Save the draft</button>
      </div>
    </section>`;

  return band() + `
    <section class="sec">
      <div class="sec-h"><h2>What you set</h2></div>
      ${kv([
        ['Level', x.level],
        ['Signed', x.signed],
        ['Follow-up scored', x.follow],
        ['Depth scored', x.depth]])}
    </section>

    <section class="sec">
      <div class="sec-h"><h2>Your report</h2></div>
      <p class="t-body-02">${x.n} came in at ${x.level} on the evidence of two projects rather than on how they described themselves. The growth areas are written against the same two examples, so the candidate can see where they came from.</p>
      <div class="btn-row mt5">
        <button class="btn btn-g btn-sm noic">Read the report</button>
        <button class="btn btn-g btn-sm noic">${I.download}Transcript</button>
      </div>
    </section>

    <section class="sec">
      <div class="sec-h"><h2>The fee</h2></div>
      ${kv([['Candidate paid', money(v.fee)], ['TalentNext kept', money(v.cut)],
            ['Your share', money(v.share)], ['Status', x.money]])}
    </section>`;
};

/* --------------------------------------------------------------------------
   AVAILABILITY — the agent's only control over their workload.

   `.slots` IS NOT ONE OF THE SIX CONTAINERS that opt a section out of the
   184px label column, and it bleeds to the page edge with a negative margin,
   so a `.sec-h` beside it would be laid against a column 184px narrower than
   the grid expects. These sections use an `.eyebrow` as their heading instead,
   which is the cheap fix and the one the design system's own README names.
   -------------------------------------------------------------------------- */
/* --------------------------------------------------------------------------
   THE CALENDAR — §41's component, and the markup it keys on

   ONE BLOCK PER DAY, AND THE DAY CELL IS NOT THE TARGET. It is tempting to make
   the whole cell pressable — it is bigger, and Fitts' law is real — and it would
   be wrong twice: 24 of the 31 cells have nothing to open, and a cell that
   responds to a press on an empty Tuesday promises a slot you could add there,
   which is what the "Add a slot" sheet is for. Only the block is a button.

   THE THREE STATES ARE DERIVED, NOT STORED. `taken` is "this slot has an `iv`",
   and `next` is "this slot is `nextCall()`" — so the gradient moves on its own
   as days pass and there is no flag anywhere to forget to move. §41 has the
   argument for why only one of the three is filled.

   THE LEADING AND TRAILING DAYS ARE REAL DATES, not blanks. A grid that pads
   with empty cells makes the week the month starts in look like a broken week;
   showing 27–31 July greyed says "this is a Monday-to-Sunday grid" without
   claiming anything is bookable there. `.cal-out` is the tone, and those cells
   never carry a block because `slotAt` is asked for the cell's OWN month.
   -------------------------------------------------------------------------- */
function calGrid(v){
  const [y, m] = CAL_MONTHS[S.cal] || CAL_MONTHS[0];
  const first = wdOf(y, m, 1);                       /* Mon = 0 */
  const len = new Date(y, m + 1, 0).getDate();       /* day 0 of next month */
  const prevLen = new Date(y, m, 0).getDate();
  const cells = [];
  /* six rows always, so the calendar's height does not jump between months */
  for(let i = 0; i < 42; i++){
    const n = i - first + 1;
    if(n < 1) cells.push({d: prevLen + n, out: true, wd: i % 7});
    else if(n > len) cells.push({d: n - len, out: true, wd: i % 7});
    else cells.push({d: n, wd: i % 7, y, m});
  }
  const nx = nextCall();
  return `<div class="cal">
    <div class="cal-top">
      <h3 class="cal-m">${MON_L[m]} ${y}</h3>
      <span class="cal-tz">Eastern time</span>
      <div class="cal-nav">
        <button class="cal-b" data-cal-m="${S.cal - 1}" aria-label="Previous month"
          ${S.cal === 0 ? 'disabled' : ''}>${I.arrowLeft}</button>
        <button class="cal-b" data-cal-m="${S.cal + 1}" aria-label="Next month"
          ${S.cal === CAL_MONTHS.length - 1 ? 'disabled' : ''}>${I.arrowRight}</button>
      </div>
    </div>
    <div class="cal-grid">
      ${WD_S.map(w => `<span class="cal-wd">${w}</span>`).join('')}
      ${cells.map(c => {
        const s = c.out ? null : slotAt(c.y, c.m, c.d);
        const today = !c.out && c.y === CAL_TODAY.y && c.m === CAL_TODAY.m && c.d === CAL_TODAY.d;
        const cls = ['cal-d', c.out ? 'cal-out' : '', c.wd > 4 ? 'cal-we' : '',
                     today ? 'cal-today' : ''].filter(Boolean).join(' ');
        return `<div class="${cls}"><span class="cal-n">${c.d}</span>${
          s ? calBlock(s, nx, v) : ''}</div>`;
      }).join('')}
    </div>
    ${S.slot && slotBy(S.slot) ? calPop(slotBy(S.slot), v) : ''}
  </div>`;
}

/* THE JOIN CONTROL IS ON THE BLOCK ONLY WHEN THE BLOCK IS THE NEXT CALL, which
   is the whole reason that one block is allowed a fill: the gradient is not
   decoration for "booked", it is the surface an action sits on. Every other
   booked block says who and nothing else, and offers Join in the card. */
const calBlock = (s, nx, v) => {
  const booked = !!s.iv, isNext = nx && s.id === nx.id;
  const x = booked ? iv(s.iv) : null;
  const cls = ['cal-slot', booked ? 'taken' : '', isNext ? 'next' : '',
               S.slot === s.id ? 'on' : ''].filter(Boolean).join(' ');
  return `<button class="${cls}" data-cal="${s.id}"
    aria-label="${s.t}, ${booked ? 'booked with ' + x.n : 'open'}">
    <span class="cal-t">${s.t}</span>
    <span class="cal-s">${booked ? x.n : 'Open'}</span>
    ${isNext ? `<span class="cal-join">${I.video}Join</span>` : ''}
  </button>`;
};

/* --------------------------------------------------------------------------
   WHICH SIDE THE CARD OPENS ON — the one thing about this component that CSS
   cannot decide, so it is a pass and not a rule.

   RIGHT IF THERE IS ROOM, LEFT IF THERE IS NOT, and "room" is a fact about which
   column of the week the day sits in: a Monday has five columns of space to its
   right and a Friday has none. §41 states both placements and the arrow for each;
   all this does is measure and choose.

   MEASURED WITH `offsetLeft`, NOT `getBoundingClientRect`. `#device` carries the
   harness's fit-to-pane transform, so a rect-measured 264px card reports 6px and
   every comparison below silently succeeds — the trap CLAUDE.md records as №15,
   and it costs an hour because the numbers look like a layout bug rather than a
   measuring one. Offsets are layout values and are not scaled. Walking up to
   `.cal` rather than reading one offset, because `.cal-d` is `position:relative`
   and is therefore its own offset parent.

   IT DOES NOT RUN ON A PHONE, and it does not need to check: §41 makes the card
   `position:static` under 600px, where `left` and `top` are simply ignored. The
   inline values are written anyway and harmlessly, which is one branch fewer
   here and one fact fewer to keep in two places.
   -------------------------------------------------------------------------- */
/* the arrow's own offset from the top of the card, §41's `top:var(--s06)` */
const CAL_ARROW = 18;
function placeCal(){
  const pop = device.querySelector('.cal-pop');
  if(!pop) return;
  const cal = pop.closest('.cal');
  const slot = cal && cal.querySelector('.cal-slot.on');
  if(!slot) return;

  let x = 0, y = 0, n = slot;
  while(n && n !== cal){ x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }

  const GAP = 8, EDGE = 8;
  const popW = pop.offsetWidth, popH = pop.offsetHeight;
  const right = x + slot.offsetWidth + GAP;
  const side = right + popW <= cal.offsetWidth - EDGE ? 'right' : 'left';
  pop.dataset.side = side;
  pop.style.left = Math.max(EDGE, side === 'right' ? right : x - GAP - popW) + 'px';
  /* the arrow sits 24px down the card (§41), so the card is lifted by that much
     to put the arrow on the block rather than below it — then clamped inside the
     calendar, because a card hanging off the bottom would be the one thing a
     popover must never do: sit outside the thing it belongs to. */
  const top = y - CAL_ARROW;
  pop.style.top = Math.max(EDGE, Math.min(top, cal.offsetHeight - popH - EDGE)) + 'px';
}

   somebody else deciding: a reference replying, a check clearing, an approval.
   After it, it is bookings and money.

   ROW SHAPE IS `hifi/`'s, FIELD FOR FIELD (`ic t b w go unread`), so
   `notifPanel` below is that file's function rather than a new one. `w` is read
   by the grouping test — anything matching `ago` or `Today` is today, the rest
   is earlier — which is why "Yesterday" and "3 days ago" have to be spelt that
   way and not as dates.

   `iv` IS THE ONE FIELD ADDED, and it is here rather than in `go` for trap-free
   routing: the interview page takes its subject from `S.iv`, set by the
   capture-phase `[data-iv]` listener, so a row that lands on Sofia's report is
   `go:'interview'` plus `iv:'sofia'` and needs no colon-splitting in the router.
   Same argument as the wireframe's `data-ag="member:41:Maryam Naz"`, avoided.

   EVERY FIGURE IS READ OFF A PAGE. The dates, the fee split, the escrow days,
   the lesson count and the two ratings are the same ones `PAGESUM` and the views
   print — a bell that rounds a number is a fourth place for it to drift.
   ========================================================================== */
const AGENT_NOTIF = {

    {ic:'calendar',   t:'Amara Osei booked a re-interview',b:'Monday 24 August at 6:00 PM ET. Her 90-day summary is on the brief.',                     w:'Yesterday',  go:'interview', iv:'amara',  unread:1},

const notifList  = () => AGENT_NOTIF[S.stage] || [];
const unreadCount = () => notifList().filter(n => n.unread && !S.read.includes(n.t)).length;

/* `hifi/`'s `notifPanel`, with the empty state written for this portal and
   `data-iv` emitted for the rows that name an interview. Nothing keeps state in
   the DOM: `un` is derived from `S.read` on every render, which is why marking
   one read is a push onto `S.read` and not a class. */
function notifPanel(){
  const list = notifList();
  const rows = group => list
    .filter(n => group === 'today' ? /ago|Today/.test(n.w) : !/ago|Today/.test(n.w))
    .map(n => {
      const un = n.unread && !S.read.includes(n.t);
      return `<button class="nrow ${un ? 'un' : ''}" data-go="${n.go}" data-read="${n.t}"${n.iv ? ` data-iv="${n.iv}"` : ''}>
        <span class="nrow-ic">${I[n.ic]}</span>
        <span class="nrow-b"><span class="nrow-t">${n.t}</span><span class="nrow-d">${n.b}</span></span>
        <span class="nrow-w">${n.w}</span>
      </button>`;
    }).join('');
  const today = rows('today'), earlier = rows('earlier');
  return `<div class="notif ${S.notif ? 'on' : ''}">
    <div class="notif-h">
      <h2>Notifications</h2>
      ${unreadCount() ? `<button class="notif-all" data-readall="1">Mark all read</button>` : ''}
      <button class="x" data-toggle="notif" aria-label="Close">${I.close}</button>
    </div>
    <div class="notif-b">
      ${list.length ? `
        ${today ? `<div class="notif-g">Today</div>${today}` : ''}
        ${earlier ? `<div class="notif-g">Earlier</div>${earlier}` : ''}`
      : `<div class="empty" style="border:0">${I.time}
        <h3>Nothing yet</h3><p>Bookings, reports going out and money releasing will show up here.</p></div>`}
    </div>
  </div>`;
}

/* ==========================================================================
   THE FRAME
   ========================================================================== */
function shell(v){
  return `
  <header class="shell">
    <button class="shell-act nav-t ${S.nav ? 'on' : ''}" data-toggle="nav"
      aria-label="${S.nav ? 'Collapse' : 'Expand'} navigation">${S.nav ? I.close
      : `<span class="nav-t-mark">${TN_MARK}</span><span class="nav-t-menu">${I.menu}</span>`}</button>
    <!-- THE REAL LOCKUP, not the mark plus the word set in type. The design
         system's JS now carries the portal's own PNGs — LOGO_K black, LOGO_W
         white — so the app bar can hold the same image the candidate portal
         holds instead of an approximation of it, and this file needs no CSS to
         size a wordmark it is no longer drawing.

         A BUTTON, NOT AN ANCHOR: an anchor with no href picks up the prose-link
         styling below 900px, and going home is an action here rather than a
         document reference. (No backticks in a comment inside a template
         literal, either — they end the string.) -->
    <button class="shell-logo" data-go="dashboard" aria-label="TalentNext home"><img src="${LOGO_K}" alt="TalentNext"></button>
    ${/* THE RIGHT-HAND END OF THE BAR IS THE ROW OF THINGS ABOUT YOU: your
          name, your bell, your face. It used to hold a Tal button, and that was
          wrong twice over.

          It was the WRONG CONTROL IN THE RIGHT PLACE. Tal is already on every
          page — `.askdock` is the invitation, and pressing it records
          `S.askFrom`, which is what "Back to …" names. A second door to the same
          surface, in the one slot the other two portals reserve for the bell,
          meant the glyph a person reads as "messages" opened a conversation
          instead of the list of what had happened to them.

          And it left the agent with NO NOTIFICATIONS AT ALL, which is not a
          missing nicety: a bell is how an agent finds out that a candidate
          booked them, that a reference came back, that escrow released. Those
          are the events this portal is made of and there was nowhere they
          landed.

          So the bell is here — `hifi/`'s own component, `hifi/`'s own count
          badge — and its pressed state is the `on` class the design system
          already draws on `.shell-act`.

          A `${}` COMMENT RATHER THAN AN HTML ONE, and that is not a style
          choice: this is inside a template literal, so a backtick in an HTML
          comment ends the string. The note above `.shell-logo` says the same
          thing and stays prose for it. */''}
    <div class="shell-right">
      <span class="shell-name">Talent agent${v.certified ? ` &middot; ${v.rangeShort}` : ''}</span>

        aria-label="Notifications" aria-expanded="${S.notif}"
        title="Notifications">${I.notification}${unreadCount()
          ? `<span class="shell-badge">${unreadCount()}</span>` : ''}</button>
      <button class="shell-act" data-go="profile" aria-label="Profile" title="Profile"><span class="av-ph sm shell-avatar"><i>${A.i}</i><img src="${AV.owen}" alt=""></span></button>

function sidenav(v){
  const active = parentOf(S.view, v.nav) || S.view;
  const items = NAVSETS[v.nav].map(([k, l, ic]) =>
    `<button class="sn-item ${k === active ? 'on' : ''}" title="${l}" data-go="${k}"${k === active ? ' aria-current="page"' : ''}>${I[ic]}<span>${l}</span></button>`).join('');
  return `
  <div class="scrim ${S.nav ? 'on' : ''}" data-close="nav"></div>
  <nav class="sidenav ${S.nav ? 'on' : ''}" aria-label="Portal">
    <div class="sn-main">${items}</div>
    <div class="sn-foot">
      <button class="sn-item ${active === 'profile' ? 'on' : ''}" title="Profile" data-go="profile">${I.user}<span>Profile</span></button>
      <button class="sn-item" title="Log out" data-confirm="logout">${I.logout}<span>Log out</span></button>
    </div>
  </nav>`;
}

/* ==========================================================================
   TAL, FULL HEIGHT — THE ASK PAGE

   THIS WAS A SHEET, AND A SHEET IS THE WRONG SURFACE FOR A CONVERSATION. Tal
   opened as a `.modal` > `.sheet`: a bottom sheet holding one answer, one set
   of chips, and a close cross. Two things were wrong with it and both get worse
   the more you ask. A sheet is a place you go to do ONE thing and dismiss —
   which is why the portal uses it for editing a fee and confirming a signature
   — so it can only ever show the last answer, and the question you asked two
   turns ago is gone. And it is a different Tal from the one the other two
   portals have: the candidate and the leader share one surface, a full-height
   page with a thread in it, and a product whose assistant changes shape
   depending on who is signed in has three assistants.

   SO IT IS `hifi/`'s SURFACE, out of the same stylesheet. `.ask-page` is a
   `height:100%` flex column inside `.main`: a `.ask-top` bar that says where
   you came back to, a `.ask-thread` that scrolls, and a `.ask-foot` that does
   not — the field is always where you left it. §21 ships all of it, and the
   floating dock at the foot of every page is the thing that opens it (the
   design system already hides the dock while an ask page is present).

   NOTHING IN HERE KEEPS STATE IN THE DOM, which is `hifi/`'s rule for anything
   inside Tal and the reason this file can render the whole frame every time.
   The conversation is `S.thread`, the pending answer is `S.typing`, and the
   page you opened from is `S.askFrom`. The one thing that is DOM state is the
   caret, and `ASK_FOCUS` is how it survives a render — see the note there.

   THE THREE PIECES OF hifi's DESIGN THAT ARE KEPT VERBATIM, because they are
   decisions that file argues for at length and re-deciding them would give this
   portal a fourth Tal:

     the empty state is a HERO, not a bubble. A bubble is a TURN, and nothing
     has been said yet — so a greeting in one opens the thread already one
     message deep and makes the first thing you do reading rather than typing.
     `.tal-hero` with `.tal-mk.lg.orb` is the largest mark in the product and
     §40 is what animates it.

     the suggestions live in the FOOT and go the moment you ask. They are an
     offer while the thread is empty; over a conversation they are a second
     conversation running alongside the first.

     the bubble names its speaker ABOVE what they said, and the two speakers
     use one component. `askBubble` here is `askBubble` there.
   ========================================================================== */

/* THE ANSWERS ARE LOOKED UP ACROSS THE WHOLE TABLE, not in the current page's
   list. A chip printed on one page can name a question that lives in another
   page's set — the dashboard offers "how is the report written", which is an
   Interviews question — and searching only the current list is what made Tal
   open empty when asked from the dashboard. */
const talAnswer = q => Object.values(TALQ).flat().find(e => e[0] === q);

/* WHAT TAL SAYS BACK, as the widget the portal already answers in. `tw()` is a
   titled block with a body and an optional action, and `.tw-top` is what tells
   §39 the widget OPENS the bubble rather than following a sentence — without it
   the label sits 34px down against 17px at the sides (trap 16 in CLAUDE.md; in
   `hifi/` a wrapper stamps it from a prefix test, and here every reply is a
   widget so it is simply always true).

   AND AN UNKNOWN QUESTION GETS THE HONEST ANSWER. `TALQ` is a table, so most of
   what somebody types is not in it. Tal says what it can see — the six subjects
   this portal's Tal has — and offers the page's own questions again. Inventing
   an answer and printing a helpdesk number are the same failure. */
const talReply = q => {
  const a = talAnswer(q);
  if(!a) return tw('I do not have that one',
    `<p class="t-body-02">I can read your public profile, your interviews, your scores and the money.
      Ask me about one of those and I will answer off the pages you are looking at.</p>`);
  return tw(a[0],
    a[2] ? `<p class="t-body-02">${a[1]}</p>${twLines(a[2])}` : `<p class="t-body-02">${a[1]}</p>`,
    a[3] ? twBtn(a[3][0], a[3][1]) : '');
};

/* ONE BUBBLE COMPONENT, TWO SPEAKERS — `hifi/`'s `askBubble`, unchanged except
   for whose face it is. The speaker is named above what they said rather than
   beside it, so a long answer does not indent under a label. */
const askBubble = (who, html) => who === 'me'
  ? `<div class="tal-msg me"><span class="tal-who"><span class="tal-who-n">You</span>
      <span class="av"><img src="${AV.owen}" alt=""><i>${A.i}</i></span></span>
      <div class="bb">${html}</div></div>`
  : `<div class="tal-msg"><span class="tal-who"><span class="tal-mk sm"></span>
      <span class="tal-who-n">Tal</span></span><div class="bb">${html}</div></div>`;

/* "BACK TO …" NAMES THE PAGE, AND THE RAIL ALREADY NAMES EVERY PAGE. Reading it
   out of `NAVSETS` rather than keeping a second map means a page cannot be
   renamed in the rail and stay wrong here. Sub-pages answer with their parent's
   label, which is what the rail marks while you are on them. */
const askWhere = view => {
  const nav = f().nav;
  const key = NAVSETS[nav].some(([k]) => k === view) ? view : parentOf(view, nav);
  const row = (NAVSETS[nav].find(([k]) => k === key) || [])[1];
  return row || 'TalentNext';
};

/* THE LINE IN THE TOP-RIGHT IS THE STAGE, IN ONE PHRASE. `hifi/` prints where
   the candidate is in their 90 days; the agent's equivalent is where they are in
   being enabled, which is the same fact the stepper draws. */
const askState = v => v.busy ? `Agent – ${v.level} · ${v.month} interviews this month`
  : v.certified ? `Agent – ${v.level} · listed, nothing booked`
  : 'Approved, not yet certified';

function askView(v){
  const opened = S.thread.length > 0;
  const qs = (TALQ[S.askFrom] || TALQ.dashboard).map(q => q[0]);
  const hero = `<div class="tal-hero">
      <span class="tal-mk lg orb"></span>
      <h2>Hello <b>${A.n.split(' ')[0]}</b>, I am Tal &#128075;</h2>
      <p>I can read your public profile, your interviews, your scores and the money. What do you need?</p>
    </div>`;
  const thread = (opened ? '' : hero)
    + S.thread.map(m => askBubble(m.who, m.html)).join('')
    + (S.typing ? askBubble('tal', '<div class="ai-stream"><i></i><i></i><i></i></div>') : '');

  return `<div class="page ask-page">
    <div class="ask-top">
      <button class="ph-back" data-askback="1" aria-label="Back to ${askWhere(S.askFrom)}">${I.arrowLeft}</button>
      <span class="ask-top-t">Back to ${askWhere(S.askFrom)}</span>
      <span class="ask-top-s">${askState(v)}</span>
    </div>
    <div class="ask-thread" id="askThread">${thread}</div>
    <div class="ask-foot">
      ${opened ? '' : `<div class="ask-sugg">${qs.map(q => askChip(q)).join('')}</div>`}
      <div class="askfield">
        <span class="askline-mark"><span class="tal-mk sm"></span></span>
        <input class="inp" id="askIn" placeholder="Ask anything" autocomplete="off">
        <button class="askfield-send" data-asksend="1" aria-label="Send">${I.arrowRight}</button>
      </div>
    </div>
  </div>`;
}

/* --------------------------------------------------------------------------
   ASKING, AND THE TWO FLAGS THAT MAKE IT FEEL LIKE A CONVERSATION

   THE ANSWER ARRIVES AFTER THE QUESTION, not with it. Pushing both turns in one
   render draws Tal replying before you have seen your own message land, which
   reads as a canned response rather than an answer. So: push the question, set
   `S.typing`, render — that paints the three-dot stream `hifi/` uses — then push
   the answer and render again. The timer holds no DOM reference, so a close or
   another question mid-flight cannot leave it writing into a page that is gone;
   `S.thread` is the only thing it touches.

   `ASK_FOCUS` IS THE CARET, AND IT IS THE ONE PIECE OF DOM STATE HERE. Every
   render reprints the frame, so the field is a new element and the caret is
   lost. `hifi/` avoids this by building the ask page once and patching bubbles
   into it; this portal has no render passes and rebuilds the frame, so instead
   it re-focuses after the paint — but ONLY when a render was caused by asking or
   opening, never when it was caused by the answer arriving. Stealing the caret
   back on Tal's turn is what makes a page scroll under you while you read.
   -------------------------------------------------------------------------- */
let ASK_FOCUS = false;
const ASK_WAIT = 520;

function askOpen(q){
  if(!S.tal){ S.askFrom = S.view; S.tal = true; S.nav = false; }
  if(q) return ask(q);
  ASK_FOCUS = true; render();
}

function askClose(){
  S.tal = false; S.typing = false; render();
}

function ask(q){
  S.thread.push({who: 'me', html: `<p>${q}</p>`});
  S.typing = true;
  ASK_FOCUS = true;
  render();
  setTimeout(() => {
    if(!S.typing) return;          /* closed, or another question overtook it */
    S.typing = false;
    S.thread.push({who: 'tal', html: talReply(q)});
    render();                      /* no ASK_FOCUS — see the note above */
  }, ASK_WAIT);
}

/* CONFIRMATION BEFORE ANYTHING THAT CANNOT BE TAKEN BACK — signing a report,

const CONFIRMS = {
