          at the foot of the page under the rubric. The pill was the label for a
          control that was somewhere else. It is a button on the row now, and the
          rows that are not yours keep the tag, because "Locked" IS a status and
          there is nothing to press on it. Heading is "The four lessons" rather
          than "Still to do", because the finished ones are listed here too — with
          their tick, so the section is the whole set in order rather than a
          remainder. */''}
    ${/* NUMBERED, NOT FOUR IDENTICAL BOOKS. `factRow`'s mark is an icon, and the
          icon was `book` on every row — so the left of the list was the same
          glyph four times, saying "this is a lesson" to a reader who had just
          read the heading "The four lessons". What the mark has to say here is
          WHICH lesson, because these run in a fixed sequence and the row you can
          open is the next number: `.ch-num` is that component (§03.139), and the
          "Before you list" checklist reached the same conclusion for the same
          reason — §42's note is the long version.

          So the row is written out rather than passed through `factRow`. It is
          `checkRow`'s static shape exactly: number, then title with its status
          beside it, then the detail line, then the trailing slot. `Locked` stays
          a tag because it IS a status with nothing to press; the next lesson
          gets the button. */''}
    <div class="tile-stack">
      ${LESSONS.map((m, n) => `<div class="cardrow ckrow">
        <span class="ch-num">${n + 1}</span>
        <span class="cardrow-b">
          <span class="cardrow-t">${m[0]}${n < lessonsDone
            ? `<span class="row-st done" role="img" aria-label="Finished">${I.checkFilled}</span>` : ''}</span>
          <span class="cardrow-d">${m[1]}</span></span>
        ${n < lessonsDone ? ''
          : n === lessonsDone ? `<span class="cardrow-a"><button class="btn btn-g btn-sm noic">Open lesson ${n + 1}</button></span>`
          : '<span class="cardrow-a"><span class="tag sm">Locked</span></span>'}
      </div>`).join('')}
    </div>
  </section>`}

  ${/* THE CALIBRATION SECTION IS GONE AND ITS FOUR CELLS ARE THE PROGRESS BAND
        (Maryam, 2 Sep 2026, with the Course Progress layout). That page has ONE
        figure row and this page had two — the progress band above and this one
        400px below it, four cells each, which reads as two attempts at the same
        job rather than as two subjects.

        WHAT MOVED AND WHAT WENT. `When` and `Result` are cells 3 and 4 of the
        band above, unchanged in their branching. `With` is the help line under
        it — Derek's name and his role, in the sentence that was already about
        him. `Length` ("45 min, recorded and kept") is the one fact that went: it
        is in the black card's own paragraph on the two stages that draw one, and
        it is true of every calibration in the product rather than of this one.

        THE `.stats`-OVER-`.kv` ARGUMENT IS WORTH KEEPING and it is why the band
        above is a `.stats` rather than four rows. These four are short, they are
        facts about one thing, and as `.kv` rows they were four lines of text
        900px wide with 700px of nothing after the words. `.facts` would have
        been the other mistake — its `auto-fit` columns leave a spare track
        painting the rule colour at the widths where a cell wraps. And the FIGURE
        stays short with the note carrying the rest, because `.stat` puts the
        label and the figure on one line with the figure `nowrap` at the right
        edge: "Thursday 20 June, 4:00 PM ET" as a figure truncates to "Thursday
        20 J…" the moment the page narrows.

        THE WARNING NOTE SURVIVES ON ITS OWN, directly under the lesson list. It
        had been moved here once already, from the foot of the page where it read
        as a warning about the rubric; what it is about is the GATE, and the
        nearest thing to the gate is now the list of what has to be finished
        first. */''}
  ${at === 'certified' ? '' : `
  <section class="sec">
    <div class="note warn"><span>${I.warning}</span><div class="nb"><b>Your public profile waits on this</b>
      Nothing goes into browse until the calibration is passed &mdash; and it cannot be booked until the four lessons are done.</div></div>
  </section>`}

  ${/* THE RUBRIC IS A §65 DISCLOSURE. Nothing in it is yours to do — it is the
        standard you are being read against — and it is the same three sentences
        every time the page is opened, which is the definition of a re-read. It
        was permanently open at the foot of the page, so an agent coming back to
        check which lesson is next scrolled past three rows they had read on
        their first visit.

        "THE RUBRIC" IS THE WORD FOR IT INSIDE THE COMPANY and the heading is
        deliberately not that: the three rows are questions Derek is asking
        himself about you, and §65's whole argument is that a closed
        disclosure's heading has to BE the summary of what is behind it. "What
        Derek watches for" is; "The rubric" would need a line under it to say so.

        The certified footnote goes INSIDE the panel rather than beside the
        heading — it is a fact about the re-check, which is what the three rows
        are about, not a description of the block. */''}
  ${foundSec('What Derek watches for', 'rubric', kv([
      ['Tenacity', 'Do you stay with a thread that is going somewhere'],
      ['Energy', 'Does the candidate do more talking by the end than the start'],
      ['Noticing', 'Do you hear what was left out']])
    + (at === 'certified'
      ? `<p class="help mt4">The method is re-checked each June, and that is two lessons rather than four.</p>`
      : ''))}`;
};

/* --------------------------------------------------------------------------
   INTERVIEWS — steps 9, 10 and 11. Two tabs, because "what is coming" and
   "what is finished" are two questions and a page that answers both at once
   makes the reader do the filtering.
   -------------------------------------------------------------------------- */
V.interviews = v => {
  if(!v.busy) return head({title: 'Interviews',
    sub: 'Nothing booked &middot; six slots open &middot; 45 minutes each'}) + `
    ${/* `sec-fill` — §43's opt-in. This section IS the page, so it takes the
          height that is left and centres the block in it. Not applied to a
          section that merely CONTAINS an empty state among others: the leader's
          candidate page has one of those and stretching it would push the six
          sections under it apart. */''}
    <section class="sec sec-fill">
      <div class="empty">${I.calendar}<span class="t">Nothing booked yet</span>
        <span class="help">A booking arrives already paid for, with the candidate’s brief attached. There is nothing to accept.</span>
        <div class="btn-row"><button class="btn btn-p" data-go="availability">Open more slots ${I.arrowRight}</button></div></div>
    </section>`;

  const done = IVS.filter(x => x.st === 'done');
  const owed = IVS.filter(x => x.st === 'report');

  return head({title: 'Interviews',
    sub: `${v.month} this month &middot; ${v.ivs} in total &middot; next Thursday 20 August`}) + `
  <div class="tabs">
    <button class="${S.tab === 'next' ? 'on' : ''}" data-tab="next">Coming up</button>
    <button class="${S.tab === 'done' ? 'on' : ''}" data-tab="done">Finished</button>
  </div>

  ${S.tab === 'next' ? `
  <section class="sec">
    <div class="sec-h"><h2>Waiting on you</h2></div>
    <div class="tile-stack">
      ${owed.map(x => faceRow(x,
        `Report &middot; interviewed ${x.day.replace(/^\w+ /, '')} at ${x.level} &middot; due ${x.due}`,
        'interview')).join('')}
    </div>
  </section>

  <section class="sec">
    ${aiHead('Booked', 'In the order they happen',
      `<button class="btn btn-g btn-sm noic" data-go="availability">Availability ${I.arrowRight}</button>`)}
    <div class="tile-stack">
      ${diary(v).map(bookedRow).join('')}
    </div>
  </section>

  ${/* "BOOKED MEANS PAID" IS A DISCLOSURE NOW, because it is the rule this page
        runs on rather than news about it. Three sentences, identical on every
        visit, and it was the last thing on the tab — so an agent checking their
        week read it every time and needed it once. §65's shape, with the
        heading carrying the whole claim so the closed row still says the thing.

        THE FIFTEEN-MINUTE RULE IS WHAT MAKES IT WORTH KEEPING AT ALL. The first
        two sentences are said again in Tal's summary and in the dashboard's own
        note; "if a candidate does not appear, wait fifteen minutes and mark it"
        is stated nowhere else in the portal, which is why the block is folded
        rather than deleted. */''}
  ${foundSec('Booked means paid', 'paid', `
    <div class="note mt5"><span>${I.info}</span><div class="nb"><b>The fee is taken at the slot, not at the call</b>
      It is held in escrow, so an interview reaches you already settled. If a candidate does not appear, wait fifteen minutes and mark it.</div></div>`)}`
  : `
  <section class="sec">
    <div class="sec-h"><h2>Last five</h2></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <tr><th>Candidate</th><th>Interviewed</th><th>Level set</th><th class="num">Follow-up</th><th class="num">Depth</th></tr>
        ${done.concat(owed).map(x => `<tr>
          <td>${x.n}</td><td>${x.day.replace(/^\w+ /, '')}</td>
          <td>${x.level || '&mdash;'}</td>
          <td class="num">${x.follow || '&mdash;'}</td>
          <td class="num">${x.depth || '&mdash;'}</td></tr>`).join('')}
      </table>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Open one</h2></div>
    <div class="tile-stack">
      ${done.map(x => goRow('document', x.level, x.n,
        `${x.day.replace(/^\w+ /, '')} &middot; signed ${x.signed}`, 'interview', ` data-iv="${x.id}"`)).join('')}
    </div>
  </section>`}`;
};

/* --------------------------------------------------------------------------
   ONE INTERVIEW — the brief before, the report after. Three pages in one,
   keyed off the record's own state, because they are the same interview at
   three moments and splitting them would put the brief out of reach the
   moment the call ended.
   -------------------------------------------------------------------------- */
V.interview = v => {
  const x = iv(S.iv);
  /* NO GREY LINE WHERE THE PLATE CARRIES THE SPINE. An upcoming interview
     states its kind, day and time on the hero directly under the head, so a
     fact row saying the same three things is the page telling you twice
     before Tal has said anything. The two finished states have no plate, so
     they keep it. */
  const PHOTO = {rafael: AV.lena, amara: AV.hana, sofia: AV.priya, tom: AV.samuel, nina: AV.hana};
  const band = extra => head({
    title: x.n,
    sub: x.st === 'next' ? '' : `${x.kind} &middot; ${x.day} &middot; ${x.time}`,
    back: 'interviews',
    plate: extra
  });

  /* THE APPOINTMENT IS A `crow` IN A `.dark-card`, AND THE PAGE'S `sub` STAYS
     EMPTY. That was already the arrangement's reason — "an upcoming interview
     states its kind, day and time on the hero directly under the head, so a
     fact row saying the same three things is the page telling you twice" — and
     it survives the move: §77's `.dc-when` holds the day and the time, and the
     `.crow-role` line holds the kind. The two finished states still have no
     hero and still keep their grey line.

     `urgent` READS THE SAME WORD THE PLATE'S `data-when` DID. Rafael is
     tomorrow and inside the day; the other upcoming interview is five days out
     and is not, which is exactly §59's inside/outside test and §71.2a's own
     state. One expression, both cards. */
  if(x.st === 'next'){
    const soon = x.id === 'rafael';
    return band() + callCard({
      title: x.kind,
      when: `${x.day.replace(/^\w+ /, '')}, ${x.time}`,
      urgent: soon,
      av: x.i, photo: PHOTO[x.id], name: x.n, role: x.band,
      detail: `45 minutes &middot; video, recorded &middot; ${soon ? 'tomorrow' : 'in 5 days'}`,
      actions: `<button class="btn btn-sm noic ic-l">${I.calendar}Add to calendar</button>
        <button class="btn btn-p btn-sm noic">Join the call ${I.video}</button>`
    }) + `
    ${/* THE SHEET IS ON THE BRIEF'S OWN HEADING ROW. "Add a note to the brief"
          was a `.btn-row` in a section of its own at the foot of the page — a
          bare button under a heading-less block, which is the one arrangement
          §73 was written to end. It acts on the brief, so it belongs on the
          brief's row. */''}
    <section class="sec">
      ${aiHead('Their brief', `What ${x.n.split(' ')[0]} asked for, in their words`,
        `<button class="btn btn-g btn-sm noic" data-sheet="brief">Add a note</button>`)}
      ${kv([
        ['Where they are', x.band],
        ['Asked to be assessed on', x.asked],
        ['Booked', x.paid],
        ['Fee', `${money(v.fee)}, ${money(v.share)} of it yours`],
        ...(x.summary ? [['Attached', 'Their 90-day summary']] : [])])}
    </section>

    ${/* THE THREE STEPS ARE A DISCLOSURE — the same three every time, and by the
          second interview an agent knows them. §65's chevron-left row keeps the
          heading as the whole claim, and the `.all-desc` line carries the one
          fact inside the block that changes what you do BEFORE opening it: the
          report is due within a day. */''}
    ${foundSec('Before it', 'before', `
      <ol class="steps mt5">
        <li><span class="s-n">1</span><span class="s-b"><b>Read the brief</b>

/* --------------------------------------------------------------------------
   AVAILABILITY — the agent's only control over their workload.

   `.slots` IS NOT ONE OF THE SIX CONTAINERS that opt a section out of the
   184px label column, and it bleeds to the page edge with a negative margin,
   so a `.sec-h` beside it would be laid against a column 184px narrower than
   the grid expects. These sections use an `.eyebrow` as their heading instead,
   which is the cheap fix and the one the design system's own README names.
   -------------------------------------------------------------------------- */
/* --------------------------------------------------------------------------
   THE CALENDAR — §41's component, and the markup it keys on

   ONE BLOCK PER DAY, AND THE DAY CELL IS NOT THE TARGET. It is tempting to make
   the whole cell pressable — it is bigger, and Fitts' law is real — and it would
   be wrong twice: 24 of the 31 cells have nothing to open, and a cell that
   responds to a press on an empty Tuesday promises a slot you could add there,
   which is what the "Add a slot" sheet is for. Only the block is a button.

   THE THREE STATES ARE DERIVED, NOT STORED. `taken` is "this slot has an `iv`",
   and `next` is "this slot is `nextCall()`" — so the gradient moves on its own
   as days pass and there is no flag anywhere to forget to move. §41 has the
   argument for why only one of the three is filled.

   THE LEADING AND TRAILING DAYS ARE REAL DATES, not blanks. A grid that pads
   with empty cells makes the week the month starts in look like a broken week;
   showing 27–31 July greyed says "this is a Monday-to-Sunday grid" without
   claiming anything is bookable there. `.cal-out` is the tone, and those cells
   never carry a block because `slotAt` is asked for the cell's OWN month.
   -------------------------------------------------------------------------- */
function calGrid(v){
  const [y, m] = CAL_MONTHS[S.cal] || CAL_MONTHS[0];
  const first = wdOf(y, m, 1);                       /* Mon = 0 */
  const len = new Date(y, m + 1, 0).getDate();       /* day 0 of next month */
  const prevLen = new Date(y, m, 0).getDate();
  const cells = [];
  /* six rows always, so the calendar's height does not jump between months */
  for(let i = 0; i < 42; i++){
    const n = i - first + 1;
    if(n < 1) cells.push({d: prevLen + n, out: true, wd: i % 7});
    else if(n > len) cells.push({d: n - len, out: true, wd: i % 7});
    else cells.push({d: n, wd: i % 7, y, m});
  }
  const nx = nextCall();
  return `<div class="cal">
    <div class="cal-top">
      <h3 class="cal-m">${MON_L[m]} ${y}</h3>
      <span class="cal-tz">Eastern time</span>
      <div class="cal-nav">
        <button class="cal-b" data-cal-m="${S.cal - 1}" aria-label="Previous month"
          ${S.cal === 0 ? 'disabled' : ''}>${I.arrowLeft}</button>
        <button class="cal-b" data-cal-m="${S.cal + 1}" aria-label="Next month"
          ${S.cal === CAL_MONTHS.length - 1 ? 'disabled' : ''}>${I.arrowRight}</button>
      </div>
    </div>
    <div class="cal-grid">
      ${WD_S.map(w => `<span class="cal-wd">${w}</span>`).join('')}
      ${cells.map(c => {
        const s = c.out ? null : slotAt(c.y, c.m, c.d);
        const today = !c.out && c.y === CAL_TODAY.y && c.m === CAL_TODAY.m && c.d === CAL_TODAY.d;
        const cls = ['cal-d', c.out ? 'cal-out' : '', c.wd > 4 ? 'cal-we' : '',
                     today ? 'cal-today' : ''].filter(Boolean).join(' ');
        return `<div class="${cls}"><span class="cal-n">${c.d}</span>${
          s ? calBlock(s, nx, v) : ''}</div>`;
      }).join('')}
    </div>
    ${S.slot && slotBy(S.slot) ? calPop(slotBy(S.slot), v) : ''}
  </div>`;
}

/* THE JOIN CONTROL IS ON THE BLOCK ONLY WHEN THE BLOCK IS THE NEXT CALL, which
   is the whole reason that one block is allowed a fill: the gradient is not
   decoration for "booked", it is the surface an action sits on. Every other
   booked block says who and nothing else, and offers Join in the card. */
const calBlock = (s, nx, v) => {
  const booked = !!s.iv, isNext = nx && s.id === nx.id;
  const x = booked ? iv(s.iv) : null;
  const cls = ['cal-slot', booked ? 'taken' : '', isNext ? 'next' : '',
               S.slot === s.id ? 'on' : ''].filter(Boolean).join(' ');
  return `<button class="${cls}" data-cal="${s.id}"
    aria-label="${s.t}, ${booked ? 'booked with ' + x.n : 'open'}">
    <span class="cal-t">${s.t}</span>
    <span class="cal-s">${booked ? x.n : 'Open'}</span>
    ${isNext ? `<span class="cal-join">${I.video}Join</span>` : ''}
  </button>`;
};

/* THE CARD. Two shapes, one component: a booked slot leads with the person,
   because who you are meeting is the answer to "what is this"; an open slot has
   no person, so it leads with what the slot is worth. Both end in one action,
   and neither offers the other's — a "Join the call" on an empty slot would be a
   button with nothing behind it. */
const calPop = (s, v) => {
  const booked = !!s.iv, x = booked ? iv(s.iv) : null;
  return `<div class="cal-pop" data-side="right">
    <div class="cal-pop-h">
      <span class="cal-pop-d">${longDate(s)}</span>
      <button class="cal-pop-x" data-cal="" aria-label="Close">${I.close}</button>
    </div>
    <p class="cal-pop-t">${s.t} ET &middot; 45 minutes${booked ? ' &middot; recorded' : ''}</p>
    ${booked ? `
    <div class="cal-pop-who">
      ${avatar(x.i, PHOTOS[x.id], 36)}
      <span class="cal-pop-nb"><b>${x.n}</b><span>${x.band}</span></span>

    <div class="cal-row"><span class="l">Asked to be assessed on</span>
      <span class="v">${x.asked}</span></div>
    <div class="cal-row"><span class="l">Fee</span>
      <span class="v">${money(v.fee)}, ${money(v.share)} of it yours &middot; paid</span></div>
    <div class="cal-pop-a">
      <button class="btn btn-p btn-sm noic">Join the call ${I.video}</button>
      <button class="btn btn-g btn-sm noic" data-go="interview" data-iv="${x.id}">Read the brief</button>
    </div>`
    : `
    <div class="cal-row"><span class="l">Status</span>
      <span class="v">Open &mdash; nobody has taken it</span></div>
    <div class="cal-row"><span class="l">If it is booked</span>
      <span class="v">${money(v.fee)} into escrow, ${money(v.share)} of it yours</span></div>
    <div class="cal-row"><span class="l">Taking it back</span>
      <span class="v">Any time before it is booked</span></div>
    <div class="cal-pop-a">
      <button class="btn btn-g btn-sm noic" data-confirm="closeSlot">Close this slot</button>
    </div>`}
  </div>`;
};

/* --------------------------------------------------------------------------
   WHICH SIDE THE CARD OPENS ON — the one thing about this component that CSS
   cannot decide, so it is a pass and not a rule.

   RIGHT IF THERE IS ROOM, LEFT IF THERE IS NOT, and "room" is a fact about which
   column of the week the day sits in: a Monday has five columns of space to its
   right and a Friday has none. §41 states both placements and the arrow for each;
   all this does is measure and choose.

   MEASURED WITH `offsetLeft`, NOT `getBoundingClientRect`. `#device` carries the
   harness's fit-to-pane transform, so a rect-measured 264px card reports 6px and
   every comparison below silently succeeds — the trap CLAUDE.md records as №15,
   and it costs an hour because the numbers look like a layout bug rather than a
   measuring one. Offsets are layout values and are not scaled. Walking up to
   `.cal` rather than reading one offset, because `.cal-d` is `position:relative`
   and is therefore its own offset parent.

   IT DOES NOT RUN ON A PHONE, and it does not need to check: §41 makes the card
   `position:static` under 600px, where `left` and `top` are simply ignored. The
   inline values are written anyway and harmlessly, which is one branch fewer
   here and one fact fewer to keep in two places.
   -------------------------------------------------------------------------- */
/* the arrow's own offset from the top of the card, §41's `top:var(--s06)` */
const CAL_ARROW = 18;
function placeCal(){
  const pop = device.querySelector('.cal-pop');
  if(!pop) return;
  const cal = pop.closest('.cal');
  const slot = cal && cal.querySelector('.cal-slot.on');
  if(!slot) return;

  let x = 0, y = 0, n = slot;
  while(n && n !== cal){ x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }

  const GAP = 8, EDGE = 8;
  const popW = pop.offsetWidth, popH = pop.offsetHeight;
  const right = x + slot.offsetWidth + GAP;
  const side = right + popW <= cal.offsetWidth - EDGE ? 'right' : 'left';
  pop.dataset.side = side;
  pop.style.left = Math.max(EDGE, side === 'right' ? right : x - GAP - popW) + 'px';
  /* the arrow sits 24px down the card (§41), so the card is lifted by that much
     to put the arrow on the block rather than below it — then clamped inside the
     calendar, because a card hanging off the bottom would be the one thing a
     popover must never do: sit outside the thing it belongs to. */
  const top = y - CAL_ARROW;
  pop.style.top = Math.max(EDGE, Math.min(top, cal.offsetHeight - popH - EDGE)) + 'px';
}

/* --------------------------------------------------------------------------
   STANDING — steps 11 and 13. What the AI scores, and who reviews it.

   THE SCORE IS ABOUT THE AGENT, NEVER THE CANDIDATE, and the page says so once

/* THE PAGE HAS NO HERO CARD ANY MORE, AND THAT IS THE AGENT LEVEL COMING OUT
   (Maryam, 2 Sep 2026: "we don't have any concept of agent level, so remove
   that kinda thing totally from the talent agent portal"). `A`'s note has the
   argument for the concept; this is what it cost the page.

   WHAT WAS HERE: a `.lvl-hero` in the head band reading "Your agent level /
   Agent – A3 / You may assess Explorer E1 – Builder B2", and a `Level` figure
   cell beside it at "A3 / A1 to A4". The note defended the card on the grounds
   that `.lvl-hero` is how the product draws a level on both sides and an
   agent's level is "the same kind of fact about the same kind of person" —
   which was the whole mistake in one sentence. The candidate's level is a real
   rung on a fifteen-step ladder the product is built around; the agent's was a
   second ladder nothing else in the product defines.

   THE RANGE IS WHAT THE CARD WAS ACTUALLY FOR, so it moves into the figure band
   as a cell rather than being deleted with the tier it was printed under. "You
   may assess Explorer E1 – Builder B2" is the one fact on that card a reader
   needs, and `.stats` wants exactly four cells (a fixed 2/4-column grid whose
   hairlines are the 1px gap, so a row it does not fill paints grey). Four real
   readings, and the level's slot is the range's now.

   AND WITH NO HERO THE BAND IS ONE COLUMN, which §70 does on its own — there is
   no `.head-col` and no dark card, so Tal's summary takes the full width and
   uncaps. That is the arrangement the other module pages on this portal already
   have, so Standing stopped being the one page with a card in its band.

   THE PAGE'S TWO SLOTS STILL DO DIFFERENT JOBS, which is the surviving half of
   the note that was here. Its first draft had the spine, the hero and Tal all

   somebody else deciding: a reference replying, a check clearing, an approval.

   by the grouping test — anything matching `ago` or `Today` is today, the rest
   is earlier — which is why "Yesterday" and "3 days ago" have to be spelt that
   way and not as dates.

   `iv` IS THE ONE FIELD ADDED, and it is here rather than in `go` for trap-free
   routing: the interview page takes its subject from `S.iv`, set by the
   capture-phase `[data-iv]` listener, so a row that lands on Sofia's report is
   `go:'interview'` plus `iv:'sofia'` and needs no colon-splitting in the router.
   Same argument as the wireframe's `data-ag="member:41:Maryam Naz"`, avoided.

   EVERY FIGURE IS READ OFF A PAGE. The dates, the fee split, the escrow days,
   the lesson count and the two ratings are the same ones `PAGESUM` and the views

const notifList  = () => AGENT_NOTIF[S.stage] || [];
const unreadCount = () => notifList().filter(n => n.unread && !S.read.includes(n.t)).length;

/* `hifi/`'s `notifPanel`, with the empty state written for this portal and
   `data-iv` emitted for the rows that name an interview. Nothing keeps state in
   the DOM: `un` is derived from `S.read` on every render, which is why marking
   one read is a push onto `S.read` and not a class. */
function notifPanel(){
  const list = notifList();
  const rows = group => list
    .filter(n => group === 'today' ? /ago|Today/.test(n.w) : !/ago|Today/.test(n.w))
    .map(n => {
      const un = n.unread && !S.read.includes(n.t);
      return `<button class="nrow ${un ? 'un' : ''}" data-go="${n.go}" data-read="${n.t}"${n.iv ? ` data-iv="${n.iv}"` : ''}>
        <span class="nrow-ic">${I[n.ic]}</span>
        <span class="nrow-b"><span class="nrow-t">${n.t}</span><span class="nrow-d">${n.b}</span></span>
        <span class="nrow-w">${n.w}</span>
      </button>`;
    }).join('');
  const today = rows('today'), earlier = rows('earlier');
  return `<div class="notif ${S.notif ? 'on' : ''}">
    <div class="notif-h">
      <h2>Notifications</h2>
      ${unreadCount() ? `<button class="notif-all" data-readall="1">Mark all read</button>` : ''}
      <button class="x" data-toggle="notif" aria-label="Close">${I.close}</button>
    </div>
    <div class="notif-b">
      ${list.length ? `
        ${today ? `<div class="notif-g">Today</div>${today}` : ''}
        ${earlier ? `<div class="notif-g">Earlier</div>${earlier}` : ''}`
      : `<div class="empty" style="border:0">${I.time}
        <h3>Nothing yet</h3><p>Bookings, reports going out and money releasing will show up here.</p></div>`}
    </div>
  </div>`;
}

          opens to check them: Profile's roles block names the role, and Standing
          states the range in its own fact row. What the bar carries now is where
          you ARE, which nothing else on the screen was saying once §78 took the

      <button class="shell-act ${S.notif ? 'on' : ''}" data-toggle="notif"
        aria-label="Notifications" aria-expanded="${S.notif}"
        title="Notifications">${I.notification}${unreadCount()
          ? `<span class="shell-badge">${unreadCount()}</span>` : ''}</button>
      <button class="shell-act" data-go="profile" aria-label="Profile" title="Profile"><span class="av-ph sm shell-avatar"><i>${A.i}</i><img src="${AV.owen}" alt=""></span></button>
    </div>
  </header>`;
}

function sidenav(v){
  const active = parentOf(S.view, v.nav) || S.view;
  const items = NAVSETS[v.nav].map(([k, l, ic]) =>
    `<button class="sn-item ${k === active ? 'on' : ''}" title="${l}" data-go="${k}"${k === active ? ' aria-current="page"' : ''}>${I[ic]}<span>${l}</span></button>`).join('');
  return `
  <div class="scrim ${S.nav ? 'on' : ''}" data-close="nav"></div>
  <nav class="sidenav ${S.nav ? 'on' : ''}" aria-label="Portal">
    <div class="sn-main">${items}</div>
    <div class="sn-foot">
      <button class="sn-item ${active === 'profile' ? 'on' : ''}" title="Profile" data-go="profile">${I.user}<span>Profile</span></button>
      <button class="sn-item" title="Log out" data-confirm="logout">${I.logout}<span>Log out</span></button>
    </div>
  </nav>`;
}

/* ==========================================================================
   TAL, FULL HEIGHT — THE ASK PAGE

   THIS WAS A SHEET, AND A SHEET IS THE WRONG SURFACE FOR A CONVERSATION. Tal
   opened as a `.modal` > `.sheet`: a bottom sheet holding one answer, one set
   of chips, and a close cross. Two things were wrong with it and both get worse
   the more you ask. A sheet is a place you go to do ONE thing and dismiss —
   which is why the portal uses it for editing a fee and confirming a signature
   — so it can only ever show the last answer, and the question you asked two
   turns ago is gone. And it is a different Tal from the one the other two
   portals have: the candidate and the leader share one surface, a full-height
   page with a thread in it, and a product whose assistant changes shape
   depending on who is signed in has three assistants.

   SO IT IS `hifi/`'s SURFACE, out of the same stylesheet. `.ask-page` is a
   `height:100%` flex column inside `.main`: a `.ask-top` bar that says where
   you came back to, a `.ask-thread` that scrolls, and a `.ask-foot` that does
   not — the field is always where you left it. §21 ships all of it, and the
   floating dock at the foot of every page is the thing that opens it (the
   design system already hides the dock while an ask page is present).

   NOTHING IN HERE KEEPS STATE IN THE DOM, which is `hifi/`'s rule for anything
   inside Tal and the reason this file can render the whole frame every time.
   The conversation is `S.thread`, the pending answer is `S.typing`, and the
   page you opened from is `S.askFrom`. The one thing that is DOM state is the
   caret, and `ASK_FOCUS` is how it survives a render — see the note there.

   THE THREE PIECES OF hifi's DESIGN THAT ARE KEPT VERBATIM, because they are
   decisions that file argues for at length and re-deciding them would give this
   portal a fourth Tal:

     the empty state is a HERO, not a bubble. A bubble is a TURN, and nothing
     has been said yet — so a greeting in one opens the thread already one
     message deep and makes the first thing you do reading rather than typing.
     `.tal-hero` with `.tal-mk.lg.orb` is the largest mark in the product and
     §40 is what animates it.

     the suggestions live in the FOOT and go the moment you ask. They are an
     offer while the thread is empty; over a conversation they are a second
     conversation running alongside the first.

     the bubble names its speaker ABOVE what they said, and the two speakers
     use one component. `askBubble` here is `askBubble` there.
   ========================================================================== */

/* THE ANSWERS ARE LOOKED UP ACROSS THE WHOLE TABLE, not in the current page's
   list. A chip printed on one page can name a question that lives in another
   page's set — the dashboard offers "how is the report written", which is an
   Interviews question — and searching only the current list is what made Tal
   open empty when asked from the dashboard. */
const talAnswer = q => Object.values(TALQ).flat().find(e => e[0] === q);

/* WHAT TAL SAYS BACK, as the widget the portal already answers in. `tw()` is a
   titled block with a body and an optional action, and `.tw-top` is what tells
   §39 the widget OPENS the bubble rather than following a sentence — without it
   the label sits 34px down against 17px at the sides (trap 16 in CLAUDE.md; in
   `hifi/` a wrapper stamps it from a prefix test, and here every reply is a
   widget so it is simply always true).

   AND AN UNKNOWN QUESTION GETS THE HONEST ANSWER. `TALQ` is a table, so most of
   what somebody types is not in it. Tal says what it can see — the six subjects
   this portal's Tal has — and offers the page's own questions again. Inventing
   an answer and printing a helpdesk number are the same failure. */
const talReply = q => {
  const a = talAnswer(q);
  if(!a) return tw('I do not have that one',
    `<p class="t-body-02">I can read your public profile, your interviews, your scores and the money.
      Ask me about one of those and I will answer off the pages you are looking at.</p>`);
  return tw(a[0],
    a[2] ? `<p class="t-body-02">${a[1]}</p>${twLines(a[2])}` : `<p class="t-body-02">${a[1]}</p>`,
    a[3] ? twBtn(a[3][0], a[3][1]) : '');
};

/* ONE BUBBLE COMPONENT, TWO SPEAKERS — `hifi/`'s `askBubble`, unchanged except
   for whose face it is. The speaker is named above what they said rather than
   beside it, so a long answer does not indent under a label. */
const askBubble = (who, html) => who === 'me'
  ? `<div class="tal-msg me"><span class="tal-who"><span class="tal-who-n">You</span>
      <span class="av"><img src="${AV.owen}" alt=""><i>${A.i}</i></span></span>
      <div class="bb">${html}</div></div>`
  : `<div class="tal-msg"><span class="tal-who"><span class="tal-mk sm"></span>
      <span class="tal-who-n">Tal</span></span><div class="bb">${html}</div></div>`;

/* "BACK TO …" NAMES THE PAGE, AND THE RAIL ALREADY NAMES EVERY PAGE. Reading it
   out of `NAVSETS` rather than keeping a second map means a page cannot be
   renamed in the rail and stay wrong here. Sub-pages answer with their parent's
   label, which is what the rail marks while you are on them. */
const askWhere = view => {
  const nav = f().nav;
  const key = NAVSETS[nav].some(([k]) => k === view) ? view : parentOf(view, nav);
  const row = (NAVSETS[nav].find(([k]) => k === key) || [])[1];
  return row || 'TalentNext';
};

/* THE LINE IN THE TOP-RIGHT IS THE STAGE, IN ONE PHRASE. `hifi/` prints where
   the candidate is in their 90 days; the agent's equivalent is where they are in
   being enabled, which is the same fact the journey column draws.

   IT LED ON `Agent – A2` AND NOW LEADS ON THE RANGE, which is the agent-level
   concept coming out (see `A`'s note). The tier was doing the identifying work
   in this line and the range does it better: what a reader wants from a
   one-phrase state is what they are allowed to do and how much of it they have
   done, and "Explorer E2 – Builder B1" is the first half of that where "A2" was
   a label for it. `rangeShort`, because this is one line in a dock. */
const askState = v => v.busy ? `Assesses ${v.rangeShort} · ${v.month} interviews this month`
  : v.certified ? `Assesses ${v.rangeShort} · listed, nothing booked`
  : 'Approved, not yet certified';

function askView(v){
  const opened = S.thread.length > 0;
  const qs = (TALQ[S.askFrom] || TALQ.dashboard).map(q => q[0]);
  const hero = `<div class="tal-hero">
      <span class="tal-mk lg orb"></span>
      <h2>Hello <b>${A.n.split(' ')[0]}</b>, I am Tal &#128075;</h2>
      <p>I can read your public profile, your interviews, your scores and the money. What do you need?</p>
    </div>`;
  const thread = (opened ? '' : hero)
    + S.thread.map(m => askBubble(m.who, m.html)).join('')
    + (S.typing ? askBubble('tal', '<div class="ai-stream"><i></i><i></i><i></i></div>') : '');

  return `<div class="page ask-page">
    <div class="ask-top">
      <button class="ph-back" data-askback="1" aria-label="Back to ${askWhere(S.askFrom)}">${I.arrowLeft}</button>
      <span class="ask-top-t">Back to ${askWhere(S.askFrom)}</span>
      <span class="ask-top-s">${askState(v)}</span>
    </div>
    <div class="ask-thread" id="askThread">${thread}</div>
    <div class="ask-foot">
      ${opened ? '' : `<div class="ask-sugg">${qs.map(q => askChip(q)).join('')}</div>`}
      <div class="askfield">
        <span class="askline-mark"><span class="tal-mk sm"></span></span>
        <input class="inp" id="askIn" placeholder="Ask anything" autocomplete="off">
        <button class="askfield-send" data-asksend="1" aria-label="Send">${I.arrowRight}</button>
      </div>
    </div>
  </div>`;
}

/* --------------------------------------------------------------------------
   ASKING, AND THE TWO FLAGS THAT MAKE IT FEEL LIKE A CONVERSATION

   THE ANSWER ARRIVES AFTER THE QUESTION, not with it. Pushing both turns in one
   render draws Tal replying before you have seen your own message land, which
   reads as a canned response rather than an answer. So: push the question, set
   `S.typing`, render — that paints the three-dot stream `hifi/` uses — then push
   the answer and render again. The timer holds no DOM reference, so a close or
   another question mid-flight cannot leave it writing into a page that is gone;
   `S.thread` is the only thing it touches.

   `ASK_FOCUS` IS THE CARET, AND IT IS THE ONE PIECE OF DOM STATE HERE. Every
   render reprints the frame, so the field is a new element and the caret is
   lost. `hifi/` avoids this by building the ask page once and patching bubbles
   into it; this portal has no render passes and rebuilds the frame, so instead
   it re-focuses after the paint — but ONLY when a render was caused by asking or
   opening, never when it was caused by the answer arriving. Stealing the caret
   back on Tal's turn is what makes a page scroll under you while you read.
   -------------------------------------------------------------------------- */
let ASK_FOCUS = false;
const ASK_WAIT = 520;

function askOpen(q){
  if(!S.tal){ S.askFrom = S.view; S.tal = true; S.nav = false; }
  if(q) return ask(q);
  ASK_FOCUS = true; render();
}

function askClose(){
  S.tal = false; S.typing = false; render();
}

function ask(q){
  S.thread.push({who: 'me', html: `<p>${q}</p>`});
  S.typing = true;
  ASK_FOCUS = true;
  render();
  setTimeout(() => {
    if(!S.typing) return;          /* closed, or another question overtook it */
    S.typing = false;
    S.thread.push({who: 'tal', html: talReply(q)});
    render();                      /* no ASK_FOCUS — see the note above */
  }, ASK_WAIT);
}

/* CONFIRMATION BEFORE ANYTHING THAT CANNOT BE TAKEN BACK — signing a report,
   and logging out. Both are one press away from the edge of the product. */
/* A FOURTH FIELD, AND ONLY LOGOUT HAS ONE: the stage the confirmation lands on.
   "Log out" used to close the sheet and leave you on the page you had just left
   — the one control in the portal whose whole purpose is to take you somewhere
   and the only one that did nothing. Now there is somewhere for it to go, and
   the sentence in the sheet is finally true: coming back does need the password,
   because the screen behind it is the one that asks for it. */
const CONFIRMS = {
  logout: ['Log out?', 'You will need your password to come back in.', 'Log out', 'signin'],
  sign:   ['Sign and send?', 'The level goes to the candidate as soon as this is signed, and a change afterwards is a review decision.', 'Sign and send'],
  /* CLOSING A SLOT IS CONFIRMED, because it is the one thing on the Availability
     page that takes away something a candidate may be looking at right now. It
     is reversible — you can open the same time again — but not by undo, so it
     takes the same gate as signing. */
  closeSlot: ['Close this slot?', 'It comes out of browse straight away. Nobody can book it, and you can open the same time again whenever you like.', 'Close it']
};
function confirmSheet(){
  const c = CONFIRMS[S.confirm];
  return `<div class="modal ${S.confirm ? 'on' : ''}" data-close="confirm">
    <div class="sheet">
      <div class="sheet-h"><h2>${c ? c[0] : ''}</h2>
        <button class="x" data-close="confirm" aria-label="Close">${I.close}</button></div>
      <div class="sheet-b"><p class="t-body-02">${c ? c[1] : ''}</p></div>
      <div class="sheet-f">
        <button class="btn btn-s noic" data-close="confirm">Cancel</button>
        ${/* `data-stage` RIDES THE SAME BUTTON as `data-close`, and the router's
              stage branch clears `S.confirm` itself, so one press both confirms
              and leaves. The stage branch is written above the close branch for
              exactly this — a second control would be a second thing to keep in
              step with the first. */''}
        <button class="btn btn-p noic" data-close="confirm"${c && c[3] ? ` data-stage="${c[3]}"` : ''}>${c ? c[2] : ''}</button>
      </div>
    </div>
  </div>`;
}

/* The editing sheets. One component, four titles — the fields differ, the
   frame does not. */
const SHEETS = {
  listing: ['Your public profile', `
    <label class="f"><span class="lbl">Headline</span>
      <input class="inp" value="Eleven years in delivery, six of them managing managers"></label>
    <label class="f"><span class="lbl">Bio</span>
      <textarea class="inp" rows="3">I interview for how somebody actually ran a week, not for how they describe themselves.</textarea></label>
    <p class="help">Your name, photo and the range you assess come from your account and your level.</p>`],
  fee: ['Your fee', `
    <label class="f"><span class="lbl">What a candidate pays</span>
      <input class="inp" value="$85"></label>
    <div class="kv"><span class="k">You would be paid</span><span class="v">$68</span></div>
    <p class="help">A new fee applies to new bookings. Anything in escrow settles at the rate it was booked at.</p>`],
  slot: ['Add a slot', `
    <label class="f"><span class="lbl">Day</span>
      <select class="inp"><option>Monday 31 August</option><option>Tuesday 1 September</option></select></label>
    <label class="f"><span class="lbl">Time</span>
      <select class="inp"><option>3:00 PM ET</option><option>5:00 PM ET</option><option>7:00 PM ET</option></select></label>
    <p class="help">45 minutes, and it can be taken back any time before it is booked.</p>`],
  brief: ['A note to yourself', `
    <label class="f"><span class="lbl">Note</span>
      <textarea class="inp" rows="3" placeholder="Only you and Tal can see this"></textarea></label>
    <p class="help">Kept with the brief and never sent to the candidate.</p>`],
  profile: ['Your details', `
    <label class="f"><span class="lbl">Full name</span><input class="inp" value="Owen Clarke"></label>
    <label class="f"><span class="lbl">Email</span><input class="inp" value="owen.clarke@fieldstone.co"></label>`]
};
function editSheet(){
  const s = SHEETS[S.sheet];
  return `<div class="modal ${S.sheet ? 'on' : ''}" data-close="sheet">
    <div class="sheet">
      <div class="sheet-h"><h2>${s ? s[0] : ''}</h2>
        <button class="x" data-close="sheet" aria-label="Close">${I.close}</button></div>
      <div class="sheet-b">${s ? s[1] : ''}</div>
      <div class="sheet-f">
        <button class="btn btn-s noic" data-close="sheet">Cancel</button>
        <button class="btn btn-p noic" data-close="sheet">Save</button>
      </div>
    </div>

}

/* ==========================================================================
   SIGNING IN — stage: `signin`

   THERE IS ONE FRONT DOOR AND THIS IS IT. Profile has said so since this file
   was written — "Sign-in: one account, one password" sits in the roles band
   under a note headed "Roles stack" — so an agent does not have an agent
   login. They have a TalentNext login, and Owen's carries two roles because
   becoming an agent added one to the account he already had.

   THERE WAS A SECOND SCREEN AND IT IS GONE (Maryam, 2 Sep 2026: "login should
   directly take the talent agent on the dashboard, not on this screen, remove
   this screen from flow"). `role` was a `Choose a portal` step between the
   password and the product: two rows, the agent's own portal and the candidate
   record on the same account. It was the roles-stack rule made visible, and
   making a rule visible is not on its own a reason to put a screen in front of
   somebody who has just typed their password — the portal they are opening is
   the one they signed into.

   WHAT IT HELD IS STILL HELD, AND THAT WAS THE ONE THING TO CHECK BEFORE
   DELETING IT. Its agent row said "open the portal you just logged into", which
   is what logging in now does. Its candidate row was the ONLY element in this
   file writing `data-portal`, and therefore the only route to `hifi/` — so that
   row moved to `V.profile`'s "Your roles", the block that is already about an
   account carrying two of them. The note over `roleRow` has the argument, and
   §78 is the precedent: the candidate portal took its portal switch out of the
   app bar and made it a row in the account menu for the same reason.

   SO WHAT IS LEFT IS THE PRODUCT'S OWN FRONT DOOR AND NOTHING ABOUT IT IS AN
   AGENT'S — one email, one password, and four screens of password recovery
   behind it.

   WHAT IS DELIBERATELY ABSENT, and each omission is the same argument as the
   one the stage list makes about Stage 1:

     - NO SIGN-UP. The portal begins where an agent exists, and signing up
       here would create a candidate account this file cannot open. The foot of
       `login` says where an approved agent comes from instead.
     - NO EMAIL VERIFICATION AND NO ACCOUNT CREATION. Owen verified an address
       and chose a password as a candidate in 2024. A role was added; a person
       was not. `hifi/`'s `create`, `verify` and `created` screens are that
       file's because that is where a TalentNext account is born.
     - NO TERMS GATE. Approval is where the agent agreement was signed, and
       this portal starts after approval. A consent step at sign-in would be a
       screen the flow diagram does not have, drawn in this one's language —
       which is exactly what the two Stage 1 snapshots were.

   ONE STATE ON THE ROLE SCREEN, NOT TWO. The first sign-in after approval is a
   real moment — the second row was not there last time — but `signin` is a
   stage of its own rather than a step inside the other five, so it has no
   approval date to be near. The `setup` stage's bell carries that moment
   already ("You are approved — the agent role sits on the account you already
   had"), and a "New" tag here would be the same sentence in a place that
   cannot say when. The returning state is also the one a reader sees every
   time after the first.

   IT IS THE CANDIDATE PORTAL'S OWN FRONT DOOR, AND GETTING THERE MEANT CHANGING
   THE DESIGN SYSTEM. `hifi/` draws its login as `.auth-card`: a split card, the
   brand column with the wordmark and the welcome on the left, the form on the
   right, an orange wash behind it and the illustration bled off the corner. The
   first version of this file could not use any of it — `build-ds.py` excluded
   `auth*` wholesale — so it drew the form on `.form-page` instead and produced a
   correct login on plain white. Which is the allowlist's failure a third time,
   and the note over `EXCLUDE_PREFIXES` is now the long version of it.

   `auth*` ships. So do `auth-art.webp` and `auth-mark.webp`, embedded like the
   fonts and Tal's mark, and so do `.sec-id`, `.sec-rule`, `.sec-act` and
   `.sec-cbx` — the card's internal spacing, every rule for which is nested
   inside `.auth-card` in `17-auth.css`, which is why using them without it (as
   the `.form-page` version did) styled nothing at all.

   THE FRAME IS `views.js`'s, ASSEMBLED IN `render()`: `.auth-card` holding
   `AUTH_ART` and an `.auth-col`, and each view printing its own shell and page
   inside that column. Below 900px `.auth-card` is `display:contents` and
   `.auth-brand` is hidden, so the card dissolves and the phone gets the shell
   and the form — one markup, two layouts, neither of them written here.

   NOTHING IN THIS FILE WRITES CSS, which is still true and is the test that
   matters: every rule these five screens use is a rule the portal uses, in the
   cascade position the portal puts it in.
   ========================================================================== */

/* THE SHELL IS THE LOGO AND, WHERE THERE IS SOMEWHERE BACK TO, ONE ARROW.
   `shell()` proper carries the rail toggle, the bell and the avatar, and not
   one of the three means anything before you are signed in — a notification
   count for an account nobody has opened yet is the clearest case. Same
   two-branch shape as `hifi/`'s `authShell`, including the inline padding: with
   no toggle to its left the lockup has to pay the bar's own gutter, and with
   one it must not pay it twice. */
/* `views.js`'s `authShell`, unchanged — the logo, and one back arrow where there
   is somewhere to go back to. It is a bare header rather than `shell()` because
   the rail toggle, the bell and the avatar are all controls over an account and
   there is no account open yet; at desktop §17 hides this header outright
   (`.auth-card > .auth-col > .shell{display:none}`), because the brand column
   beside it is already carrying the lockup. So it is the mobile head. The inline
   padding is measured, not chosen: with no toggle to its left the lockup pays
   the bar's own gutter, and with one it must not pay it twice. */
function signinShell(back){
  return `
  <header class="shell">
    ${back
      ? `<button class="shell-act" data-signin="${back}" aria-label="Back">${I.arrowLeft}</button>
         <span class="shell-logo" style="padding-left:var(--s02)"><img src="${LOGO_K}" alt="TalentNext"></span>`
      : `<span class="shell-logo" style="padding-left:var(--s05)"><img src="${LOGO_K}" alt="TalentNext"></span>`}
  </header>`;
}

/* THE BRAND COLUMN, PORTED WORD FOR WORD FROM `views.js`. It is the left half of
   the split card at desktop and `display:none` below 900px, and every class in
   it — `.auth-brand`, `.auth-logo`, `.auth-intro`, `.auth-begin`, `.auth-foot`,
   `.auth-mark` — now ships in the design system.

   THE WORDS ARE NOT RE-WRITTEN FOR AN AGENT, and that is the decision rather
   than laziness. "assesses you in real conversation … moves you up the ladder a
   level at a time" reads as candidate copy, and the first instinct was to
   rewrite it for somebody who does the assessing. But this is ONE front door:
   at the moment these words are on screen the product does not yet know which
   of Owen's two roles is about to open, because that is the next screen's
   question. Copy that picked a side here would be wrong for whoever it did not
   pick. It is also not untrue of him — Owen has a level, a ladder and a
   finished Explorer course of his own.

   If it should say something role-neutral instead, that is a change to the
   PRODUCT's front door and belongs in `views.js`, where the same paragraph is
   stated once for both portals. Rewriting it here would give TalentNext two
   different welcome screens depending on which file you opened. */
const AUTH_ART = `
<div class="auth-brand">
  <span class="auth-logo"><img src="${LOGO_K}" alt="TalentNext"></span>
  <div class="auth-intro">
    <h2 class="t-heading-01">Welcome to TALENTnext</h2>
    <p class="t-body-02">TalentNext is the AI-native leadership platform that assesses you in real conversation, compounds every interview, chapter and call into a live picture of where you stand, then moves you up the ladder a level at a time.</p>
    <p class="t-body-02">From here, growth stops being guesswork.</p>
    <p class="t-body-02 auth-begin">Let&rsquo;s begin.</p>
  </div>
  <p class="t-helper-01 auth-foot">&copy; 2026 TALENTnext Limited</p>
</div>
<i class="auth-mark" aria-hidden="true"></i>`;

/* A ROLE ROW. `goRow` is the shape — mark, eyebrow, title, sub, chevron — and it
   is not reused because it hardcodes `data-go`, which sets a VIEW. This row
   leaves the FILE, so it takes its trailing attribute whole.

   IT USED TO DRAW TWO ROWS ON A `Choose a portal` SCREEN AND NOW DRAWS ONE ON
   PROFILE (Maryam, 2 Sep 2026 — "login should directly take the talent agent on
   the dashboard, not on this screen, remove this screen from flow"). The agent
   row went with the screen: it said "open the portal you just logged into",
   which is what logging in now does. The candidate row could not go with it,
   because it was the ONLY thing in this file writing `data-portal` and therefore
   the only route to `hifi/` — so it moved to the one block that is already about
   an account carrying two roles, `V.profile`'s "Your roles".

   THAT IS ALSO WHERE THE OTHER SIDE PUTS IT. §78 took the portal switch out of
   the candidate portal's app bar and made it a row in the ACCOUNT MENU, on the
   argument that it is a personal control rather than a frame one. This file's
   avatar opens Profile rather than a menu, so Profile's roles block IS that
   destination, one step longer.

   A BUTTON AND NOT AN `<a href>`, which is the note over `.shell-logo` proved a
   second time. It was written as an anchor on the reasoning that a cross-document
   link is what an anchor is for; the anchor took `text-decoration:underline` from
   the prose-link styling and drew all three of its lines underlined, eyebrow and
   sub included, beside an identical row that was not. That styling is §12's
   explicit decision and it is right for a link inside a paragraph; this is a
   440px row with a chevron on it. So it is a button and the navigation is the
   router's job — `data-portal`, whose one writer this now is. */
const roleRow = (icon, eyebrow, title, sub, attr) => `
  <button class="tile clk gcard" ${attr}>
    <span class="cardrow-ic">${I[icon]}</span>
