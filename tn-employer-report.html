<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalentNext — employer development report</title>

<!-- The design system, exactly as the starter / tn-new-portal link it. Serve over
     http (a browser blocks a linked stylesheet on file://). No portal file and no
     design-system layer is touched by this page. -->
<link rel="stylesheet" href="design-system/talentnext-ds.css?b=145df367">

<style>
/* HOST GEOMETRY ONLY — the four declarations the starter requires, plus two
   local opt-outs. Nothing here is design: every colour/size/space is a token. */
.host{
  position:relative;width:100%;height:100dvh;
  container-type:inline-size;container-name:app;
  overflow:hidden;background:var(--background)}

/* No rail on an owner's report, so suppress the rail divider `.app::after`
   draws at the collapsed rail position (the DS does the same on its rail-less
   scenes, e.g. `.app:has(> .auth-card)`). Layout plumbing, not design. */
.app::after{content:none}

/* LABEL-COLUMN OPT-OUT for the two wrappers this page introduces, restated
   inside the container query exactly as the starter documents. `.signed` is a
   shipped DS component but is not on §10.15's auto-opt-out list, so a heading
   above it would otherwise take the 184px spine. This makes the report stack
   heading-above-content — the same way the admin interview screen presents
   these very cards. */
@container app (min-width:900px){
  .sec:has(> .signed){display:block;
    padding-left:var(--pad-x);padding-right:var(--pad-x)}
  .sec:has(> .signed) > .sec-h{
    border-right:0;min-height:0;margin-bottom:var(--s05);padding:0}
}
</style>
</head>
<body>

<div class="host" id="host">
  <div class="app" id="app"></div>
</div>

<script src="design-system/talentnext-ds.js?b=145df367"></script>
<script>
/* ONE PAGE, no rail, no state. An owner opens this report from an email link;
   it is a document, not a portal. Everything below is a real DS component —
   the shell, `.ph`, `.facts`, `.ai-aura`, and the `.signed` / `.sig-*`
   strengths / growth / note cards (the same `ivEvalBlock` markup the admin
   interview screen uses).

   WHAT THIS VIEW DELIBERATELY DOES NOT SHOW (client, slide 10):
     - no readiness alerts
     - no level, ladder, E-code, score, or Tal level rationale
   The owner sees development guidance, not the scoring behind it. */

const OWNER   = 'Marcus Reed';          /* the signed-in franchise owner */
const COMPANY = 'Signal';               /* their franchise */
const EMP     = 'Maryam Naz';           /* the employee they sponsored */
const first   = EMP.split(' ')[0];

/* The strengths / development pair — the exact `ivEvalBlock` markup, worded as
   development, with no level or score. */
const evalBlock = `<div class="signed iv-eval">
    <div class="sig-pair">
      <div class="sig-c" style="--mk:var(--mk-2)"><i class="sig-ic">${I.star}</i>
        <div class="sig-b"><div class="sig-top"><span class="sig-t">Strengths</span><span class="sig-tag">Strong</span></div>
          <p class="sig-p">${first} reasons from consequences to people, not policy. She can walk through a real reorganization call by call, with three worked examples that each carry a date and a name.</p></div></div>
      <div class="sig-c" style="--mk:var(--mk-3)"><i class="sig-ic">${I.growth}</i>
        <div class="sig-b"><div class="sig-top"><span class="sig-t">Development areas</span><span class="sig-tag">Focus</span></div>
          <p class="sig-p">Delegation, and coaching rather than fixing. She still tends to solve a problem herself where handing it to someone else, and developing them, would stretch her further.</p></div></div>
    </div>
  </div>`;

/* Coaching guidance — the anchor of this view, and the part the internal
   screens do not have. Three moves the owner can bring into a 1:1, each with a
   line to actually say. Built from the same `.sig-c` single-card the agent's
   note uses. */
const COACHING = [
  ['Give her a problem to coach, not solve',
   `Next time something lands that a team member could own, ask ${first} to run the conversation and debrief with you after. Try: &ldquo;I&rsquo;d like you to take this one, then walk me through how it went.&rdquo;`],
  ['Name the delegation out loud',
   `She takes work on quietly. In your next one-to-one, point to one thing you&rsquo;d like her to hand off and agree who picks it up. Try: &ldquo;What&rsquo;s one thing on your list someone else on the team could carry?&rdquo;`],
  ['Ask for the conversation she&rsquo;s putting off',
   `She is at her best reasoning from the people a decision affects. Ask about a hard conversation she has been avoiding and offer to prepare it together. Try: &ldquo;Which conversation have you been meaning to have but haven&rsquo;t yet?&rdquo;`],
];
const coachBlock = `<div class="signed">
    ${COACHING.map(([t, p]) => `<div class="sig-c" style="--mk:var(--mk-1)"><i class="sig-ic">${I.chat}</i>
      <div class="sig-b"><div class="sig-top"><span class="sig-t">${t}</span></div>
        <p class="sig-p">${p}</p></div></div>`).join('')}
  </div>`;

document.getElementById('app').innerHTML = `
  <header class="shell">
    <a class="shell-logo"><img src="${LOGO_K}" alt="TalentNext"></a>
    <div class="shell-right">
      <span class="shell-name">${OWNER}</span>
      <span class="av sm shell-avatar av-ph"><i>MR</i><img src="${AV.samuel}" alt=""></span>
    </div>
  </header>

  <div class="shell-body">
    <main class="main">
      <div class="page">

        <div class="ph">
          <span class="eyebrow">Development report</span>
          <h1>${EMP}</h1>
          <p class="lead">A read from ${first}&rsquo;s TalentNext interview, shared with you as her
            sponsor. Written to support the conversations you&rsquo;re already having with her, not to
            score her.</p>
        </div>

        <section class="sec">
          <div class="sec-h"><h2>The interview</h2></div>
          <div class="facts">
            <div><span class="l">Held</span><span class="v">Aug 20, 2026</span></div>
            <div><span class="l">Format</span><span class="v">45-minute recorded interview</span></div>
            <div><span class="l">Sponsored by</span><span class="v">${COMPANY}</span></div>
            <div><span class="l">Prepared for</span><span class="v">${OWNER}</span></div>
          </div>
        </section>

        <section class="sec">
          <div class="ai-aura">
            <div class="ai-head"><span class="ai-label bare">Tal</span></div>
            <div class="ai-body"><p>${first} came across as someone who thinks from the people a
              decision lands on and works back to it. She is already running real work, and speaks
              about it plainly. The clearest place to grow her is handing things off and coaching
              others through them, rather than carrying them herself.</p></div>
          </div>
        </section>

        <section class="sec">
          <div class="sec-h"><h2>Strengths and development</h2></div>
          ${evalBlock}
        </section>

        <section class="sec">
          <div class="sec-h"><h2>Coaching guidance</h2></div>
          ${coachBlock}
        </section>

        <section class="sec">
          <div class="note"><span>${I.info}</span><div class="nb"><b>About this report</b>A
            development read from ${first}&rsquo;s TalentNext interview, shared with ${COMPANY} as her
            sponsor. It is guidance for your coaching conversations, not a score, a rating, or a
            hiring decision.</div></div>
        </section>

      </div>
    </main>
  </div>`;
</script>
</body>
</html>
